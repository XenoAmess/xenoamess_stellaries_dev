l_english:
 origin_heart_of_devouring:0 "Heart of Devouring"
 origin_heart_of_devouring_desc:0 "Our civilization never regarded worlds as borders. They are food yet to be stripped bare. Queen Vivhite rules with an icy will: alien lives and entire planets will eventually belong to the only throne."
 origin_heart_of_devouring_effects:0 "§YExtermination civics only§!. Bind the original homeworld, gaining §G+2§! district capacity and §G+10%§! job output. Devour owned natural colonies and return eligible founder population to the core. Every cumulative §Y4§! units of native matter adds §G1§! homeworld district. Generic dismantling creates §G100§! population per cumulative §Y6§! units; Terravores retain native random rewards. Typical size 15–25 worlds take 3–5 years. Districts use normal jobs; resource districts can exceed terrain limits. Psionics and crisis progression retain vanilla requirements."
 eep_requires_exterminator:0 "Requires Devouring Swarm, Determined Exterminator, Fanatic Purifiers, or an extermination scorched-earth civic."
 decision_eep_devour:0 "Devour: Offer to the Only Throne"
 decision_eep_devour_desc:0 "Vivhite recognizes no alien claim to a world. Leave enough founder population to digest it, then bring its inhabitants, crust and molten core home."
 eep_devour_effect:0 "Digestion takes Q × 2.4 effective months, rounded up. Completion returns eligible founder population and permanently shatters the source. Capacity is exchanged per cumulative 4 Q; generic dismantling creates 100 population per cumulative 6 Q, carrying remainders across worlds. Terravores retain native random consumption rewards. Core loss or combat pauses progress; final settlement waits for vanilla purging to end."
 eep_source_required:0 "Requires an owned, peaceful natural colony other than the bound core, with the core under our control. Megastructures, arks, ring segments, the Synaptic Lathe and nanotech worlds are excluded."
 eep_seed_required:0 "The source needs at least 100 non-purging founder population, or the core needs more than 100 to supply the shortfall. Never relocate the core’s last population. Digestion workers are not created for free."
 eep_material_required:0 "Undamaged native matter is required."
 decision_eep_audience:0 "Audience with Queen Vivhite"
 decision_eep_audience_desc:0 "Enter the court of the Heart of Devouring. Vivhite judges the matter returned to her throne and the next world marked for destruction."
 eep_audience_effect:0 "Read the bound core, cumulative matter, population manufacturing, active tasks and actual ascension status. This report grants no rewards."
 eep_capacity:0 "Heart of Devouring: Accumulated World Matter"
 eep_capacity_desc:0 "Devoured matter becomes genuine buildable district capacity without changing the planet's original size."
 d_eep_core:0 "Heart of Devouring: Vivhite's Throne"
 d_eep_core_desc:0 "The Queen's will gathers here. Normal jobs receive 10% additive output only while the original people own the throne. Physical capacity belongs to this planet."
 situation_eep_devouring:0 "Devouring [Target.GetName]"
 situation_eep_devouring_type:0 "Heart of Devouring: Planetary Digestion"
 situation_eep_devouring_desc:0 "No life deserves preservation. No crust deserves waste. [Target.GetName] will become part of the only homeworld."
 situation_eep_devouring_monthly_change_tooltip:0 "Gain 1 progress each effective month. Core loss, occupation or ground combat pauses progress. Final settlement waits for all vanilla purging to finish."
 eep_digesting:0 "Strip the World"
 eep_digesting_desc:0 "Reduce every purpose of this world to feeding the throne."
 eep_devour_approach:0 "Obey the Queen"
 eep_devour_approach_desc:0 "Continue digestion until the world shatters."
 eep_cancel_approach:0 "Halt Digestion"
 eep_cancel_approach_desc:0 "End the task without completion rewards. Existing devastation, native rewards and actual population relocation remain."
 eep_monthly_ready:0 "Throne and digestion colony available"
 eep_block_core:0 "Throne disconnected: the bound core is outside our control. Progress and settlement pause until this same world is recovered."
 eep_block_combat:0 "The digestion colony is occupied or fighting a ground battle. Progress is paused."
 eep_block_purge:0 "Digestion is complete. Waiting for vanilla purging to finish; no premature population destruction or repeated consumption."
 mod_situation_eep_devouring_max_progress_add:0 "Required Digestion Months"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "The Only Throne"
 eep.10.desc:0 "Vivhite stands in the obsidian court, gazing down at the star chart.\n\nBorders? Her voice carries no warmth. I do not draw borders around food.\n\nThere are no promises to aliens, no mercy and no retreat. Everything must feed this heart. Conquered worlds will surrender their lives, crust and cores. The Queen will regret none of it."
 eep.10.a:0 "Beyond the throne, all may be devoured."
 eep.11.name:0 "The Ashes of a World"
 eep.11.desc:0 "The last crust peels away. Oceans and cities have lost their names; only the quantity returned to the core remains.\n\nVivhite glances at the report without pleasure. Next.\n\nWorlds consumed: [Root.eep_worlds]; cumulative native matter: [Root.eep_c]; added core capacity: [Root.eep_d]; population manufactured by generic dismantling: [Root.eep_made]. These record completed settlement. This message grants no additional reward.\n\nCourt: [Root.GetEEPCourtStage]. Latest world: capacity added [Root.eep_last_capacity]; founder population returned [Root.eep_last_return]; generic manufacture [Root.eep_last_manufactured]."
 eep.11.a:0 "Let the ashes feed the heart."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "The core's horizon expands again. New districts support real housing and jobs; factories, hive chambers and neural hubs keep working.\n\nVivhite brushes an alien territory from the star chart. Their ancestral soil is merely our next foundation.\n\nCumulative matter: [Root.eep_c]; added capacity: [Root.eep_d]; manufactured population: [Root.eep_made]. The Queen records a new growth stage without a second economic reward."
 eep.13.a:0 "Make them the foundation."
 eep.30.name:0 "An Irresistible Will"
 eep.30.desc:0 "Our lawful psionic ascension is complete. The court's consciousness reaches across the core; psionic coordination and normal jobs sustain its growing heart.\n\nVivhite regards alien echoes in the Shroud as worthless residue. There is no need to understand them. Only to make them submit to the end.\n\nThis moment records vanilla ascension already achieved. It grants no extra population, capacity or ascension eligibility."
 eep.30.a:0 "Will is law."
 eep.31.name:0 "Stars Forged into Blades"
 eep.31.desc:0 "Our crisis progression has unlocked mineral ships. Devoured minerals feed the fleet while alloys sustain core construction; war closes both production loops.\n\nVivhite watches the fleet pass overhead. Losses can be replaced. Hesitation is forbidden.\n\nShip availability, costs and later stages follow vanilla rules. The Queen bypasses no DLC, ascension or special project requirement."
 eep.31.a:0 "Point the blade at the next world."
 eep.40.name:0 "Throne Disconnected"
 eep.40.desc:0 "Control of the bound core has been interrupted. Digestion stops and unsettled rewards remain sealed.\n\nVivhite's order is cold and direct. Recover it. The cost is irrelevant.\n\nRecovering the same core resumes tasks. Moving the capital cannot create a second heart."
 eep.40.a:0 "Recover the throne at any cost."
 eep.41.name:0 "The Throne Restored"
 eep.41.desc:0 "The original homeworld is under our control again. Surviving digestion colonies resume progress; each pending task settles once against its own receipt.\n\nVivhite does not celebrate. Continue. Make them pay for the delay with everything they have."
 eep.41.a:0 "Continue devouring."
 eep.42.name:0 "The Heart Stops"
 eep.42.desc:0 "The original homeworld is no longer a usable colony. The Heart of Devouring has no replacement throne.\n\nUnfinished tasks end. There is no capital rebinding, copied capacity or replacement population. Surviving colonies continue under vanilla rules. The Queen's final order still leaves no room for mercy."
 eep.42.a:0 "Remember the only heart."
 eep.100.name:0 "Queen Vivhite: Court Ledger"
 eep.100.desc:0 "I count only what has returned to the throne.\n\nBound core: [eep_report_core.GetName]; court: [Root.GetEEPCourtStage]\nMatter C: [Root.eep_c]; capacity remainder: [Root.eep_c_remainder]/4\nGeneric matter G: [Root.eep_g]; population remainder: [Root.eep_g_remainder]/6\nTotal added capacity D: [Root.eep_d]; actual free districts: [eep_report_core.eep_free_districts]\nCurrent core population: [eep_report_core.eep_actual_pop]; historically manufactured: [Root.eep_made]\nWorlds consumed: [Root.eep_worlds]; active tasks: [Root.eep_tasks]; final settlements waiting: [Root.eep_waiting]\nLatest world: capacity added [Root.eep_last_capacity], returned population [Root.eep_last_return], manufactured [Root.eep_last_manufactured]\nThrone status: [Root.eep_core_state] (0 available, 1 disconnected, 2 permanently ended)\nLawful psionic ascension complete: [Root.eep_psi] (0 no, 1 yes)\nActual Nemesis stage: [Root.eep_crisis] (2 corvettes, 3 destroyers, 4 cruisers)\n\nRead-only report. Districts, housing, jobs and upkeep require normal management."
 eep.100.a:0 "Dismissed."
 eep.100.tasks:0 "Present the digestion records."
 eep.101.name:0 "Digestion Colony: [eep_report_source.GetName]"
 eep.101.desc:0 "Destruction is no excuse. Account for your progress.\n\nSource: [eep_report_source.GetName]\nPath: [eep_report_source.GetEEPTaskPath]\nFrozen matter Q: [eep_report_source.eep_q]\nActual progress: [eep_report_source.eep_progress]/[eep_report_source.eep_months] effective months\nBlocker: [eep_report_source.eep_block_state] (0 normal, 1 throne disconnected, 2 combat or occupation, 3 final purge)\n\nChange approaches in the situation interface. Cancellation or ownership loss grants no completion reward."
 eep_stage_0:0 "Throne Established"
 eep_stage_1:0 "Crown of Shattered Worlds"
 eep_stage_2:0 "Stars Return to the Heart"
 eep_stage_3:0 "Court of Countless Worlds"
 eep_path_native:0 "Terravore: vanilla random consumption"
 eep_path_generic:0 "Generic dismantling: population from cumulative matter"
 eep.32.name:0 "The Court’s Next Blade"
 eep.32.desc:0 "Vivhite examines the newly unlocked hull. Their resistance must end sooner than that of the last world.\n\nActual Nemesis stage: [Root.eep_crisis]. Stage 3 unlocks $crisis_destroyer$; stage 4 unlocks $crisis_cruiser$. Hulls, fitting and upkeep remain vanilla. This message grants no ability or reward."
