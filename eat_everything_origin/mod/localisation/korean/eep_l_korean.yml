l_korean:
 origin_heart_of_devouring:0 "탐식의 핵심"
 origin_heart_of_devouring_desc:0 "우리 문명은 결코 세계를 경계로 여기지 않았다. 그것들은 아직 털어내야 할 먹이다. 여왕 비히테는 얼음 같은 의지로 '이 야기'를 다스린다: 이족의 생명과 행렬 전체는 마침내 유일한 왕좌에 귀속될 것이다."
 origin_heart_of_devouring_effects:0 "§Y소멸 민속 전용§!. 원래의 모성을 속박하여 §G+2§! 지구 용량과 §G+10%§! 직위 생산을 얻는다. 보유한 자연 식민지를 탐식하고 적격한 시조 인구를 모성으로 돌려보낸다. 누적된 §Y4§! 단위의 원주민 물질마다 §G1§! 모성 지구를 더한다. 일반 해체는 누적 §Y6§! 단위당 §G100§! 인구를 생성하며; 테라보어는 원본의 무작위 보상을 유지한다. 일반적인 크기 15–25 세계는 3–5년이 소요된다. 지구에는 정상적인 직위가 사용된다; 자원 지구는 지형 한도를 초과할 수 있다. 사이오닉과 위기 진행은 바닐라 요구를 유지한다. (지금은 C:저장)"
 eep_requires_exterminator:0 "탐식 군약, 결의 소멸자, 광신 종족 청소 또는 소멸 초토 민속이 필요합니다."
 decision_eep_devour:0 "탐식: 유일한 왕좌에 바치다"
 decision_eep_devour_desc:0 "비히테는 어느 세계에 대한 이족의 생물을 인정하지 않는다. 그것을 소화할 충분한 시조 인구를 남겨두고, 그 주민과 지각 그리고 용융된 핵심을 모성으로 가져오라."
 eep_devour_effect:0 "소화에는 남은 원자적 생물 질량 Q × 2.4 유효 월이 걸리며 반올림한다. 완료 시 적격 시조 인구를 반환하고 출처를 영구히 분쇄한다. 용량은 누적된 4 Q 단위로 교환된다; 일반 해체는 누적된 6 Q 단위당 100 인구를 생성하며, 나머지는 세계 간에 유지된다. 테라보어는 원본의 무작위 소비 보상을 유지한다. 모성 상실 또는 전투는 진행을 일시 중지한다; 최종 정착은 바닐라 숙청이 끝나기를 기다린다."
 eep_source_required:0 "모성 외의 자비로운 자연 식민지가 필요하며, 모성은 우리의 통제 하에 있어야 한다. 메가 구조, 방주, 링 세그먼트, 시냅스 반응 기계 및 나노 기술 세계는 제외된다."
 eep_seed_required:0 "원천에는 최소 100명의 비숙청 창업 인구가 필요하며, 그렇지 않을 경우 모성에 100명 이상의 인구가 있어야 차액을 채울 수 있다. 모성의 마지막 인구는 절대 이주시키지 말라. 소화 작업자는 공짜로 생성되지 않는다."
 eep_material_required:0 "손상되지 않은 원자적 물질이 필요하다."
 decision_eep_audience:0 "여왕 비히테와의 알현"
 decision_eep_audience_desc:0 "탐식의 핵심 법정에 입장하라. 비히테는 그녀의 왕좌로 돌아온 물질과 다음에 파괴될 세계를 심판한다."
 eep_audience_effect:0 "속박된 모성, 누적된 물질, 인구 제조, 알고리즘 과제 및 실제 승천 상태를 읽으십시오. 이 보고서는 보상을 부여하지 않습니다."
 eep_capacity:0 "탐식의 핵심: 축적된 세계의 물질"
 eep_capacity_desc:0 "탐혀진 물질은 행성의 원래 크기를 변경하지 않고 진정한 건설 가능한 지구 용량이 된다."
 d_eep_core:0 "탐식의 핵심: 비히테의 왕좌"
 d_eep_core_desc:0 "여왕의 의지가 여기에 모인다. 원래의 민족이 왕좌를 소유하는 동안에만 정상 직위는 10% 가산 생산을 받는다; 물리적 용량은 이 행성에 속한다."
 situation_eep_devouring:0 "탐식 중 [Target.GetName]"
 situation_eep_devouring_type:0 "탐식의 핵심: 행성 소화"
 situation_eep_devouring_desc:0 "어떤 생존도 보존될 자격이 없다. 어떤 지각도 낭비될 자격이 없다. [Target.GetName]은 유일한 모성의 일부가 될 것이다."
 situation_eep_devouring_monthly_change_tooltip:0 "각 유효 월마다 1 진척도를 얻는다. 모성 상실, 점령 또는 지상전은 진척도를 일시 중지한다. 최종 정착은 모든 바닐라 숙청이 끝나기를 기다린다."
 eep_digesting:0 "세계를 벗기다"
 eep_digesting_desc:0 "이 세계의 모든 목적을 왕좌에 먹이를 주는 것으로 축소하라."
 eep_devour_approach:0 "여왕을 따르라"
 eep_devour_approach_desc:0 "세계가 산산조각 날 때까지 소화를 계속하라."
 eep_cancel_approach:0 "소화 중단"
 eep_cancel_approach_desc:0 "완료 보상 없이 과제를 종료한다. 기존 황폐화, 원주민 보상 및 실제 인구 재배치는 유지된다."
 eep_monthly_ready:0 "왕좌와 소화 식민지 사용 가능"
 eep_block_core:0 "왕좌 연결 해제: 속박된 모성이 우리의 통제 하에 있지 않다. 진척도와 정착은 이 동일한 세계가 회복될 때까지 일시 중지된다."
 eep_block_combat:0 "소화 식민지는 점령당하거나 지상전을 수행 중이다. 진척도가 일시 중지되었다."
 eep_block_purge:0 "소화가 완료되었다. 바닐라 숙청이 끝나기를 기다리는 중; 조기 인구 파괴나 반복 소비는 없다."
 mod_situation_eep_devouring_max_progress_add:0 "필요한 소화 월수"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "유일한 왕좌"
 eep.10.desc:0 "비히테가 흑요석 법정에 서서 별자리표를 내려다본다.\n\n'경계?' 그녀의 목소리에는 온기가 없다. '나는 먹이 주위에 경계를 그리지 않는다.'\n\n이족에 대한 약속도, 자비도, 퇴각도 없다. 모든 것이 이 심장을 먹여야 한다. 정복된 세계는 생명, 지각, 그리고 핵심을 내줄 것이다. 여왕은 그것 중 어느 것에 대해서도 후회하지 않을 것이다."
 eep.10.a:0 "왕좌 너머, 모든 것은 탐식될 수 있다."
 eep.11.name:0 "한 세계의 재"
 eep.11.desc:0 "마지막 지각이 벗겨진다. 바다와 도시의 이름은 사라졌고, 모성으로 돌아온 물질의 양만 남는다.\n\n비비트는 즐거움도 없이 보고를 훑는다. 다음.\n\n섭취된 행성 수: [Root.eep_worlds]; 누적 원주민 물질: [Root.eep_c]; 추가된 모성 용량: [Root.eep_d]; 일반 해체로 제조된 인구: [Root.eep_made]. 이는 완료된 정착을 기록한다. 이 메시지는 추가 보상을 주지 않는다.\n\n왕정: [Root.GetEEPCourtStage]. 최근 행성: 추가된 용량 [Root.eep_last_capacity]; 창업 인구 반환 [Root.eep_last_return]; 일반 제조 [Root.eep_last_manufactured]."
 eep.11.a:0 "재가 심장을 먹이게 하라."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "모성의 지평선이 다시 확장된다. 새로운 지구는 실제 주거와 직위를 지원하며, 공장, 하이브 챔버, 신경 허브는 계속 작동한다.\n\n비히테는 별자리표에서 이족 영토를 털어낸다. 그들의 조상의 토지는 단지 우리의 다음 토대일 뿐이다.\n\n누적 물질: [Root.eep_c]; 총 추가 용량: [Root.eep_d]; 제조된 인구: [Root.eep_made]. 여왕은 두 번째 경제 보상 없이 새로운 성장 단계를 기록한다."
 eep.13.a:0 "그들을 토대로 삼아라."
 eep.30.name:0 "저항할 수 없는 의지"
 eep.30.desc:0 "우리의 합법적인 사이오닉 승천이 완료되었다. 법원의 의식이 모성을 가로지른다; 사이오닉 조정과 정상 직위는 계속된다.\n\n비히테는 베일에 있는 이족 메아를 가치 없는 찌꺼기로 간주한다. 그것들을 이해할 필요는 없다. 단지 끝까지 복종하게 만드는 것만 있을 뿐이다.\n\n이 순간은 이미 달성된 바닐라 승천을 기록한다. 추가 인구, 용량 또는 승천 자격을 부여하지 않는다."
 eep.30.a:0 "의지가 곧 법이다."
 eep.31.name:0 "별들이 칼날로 벼려지다"
 eep.31.desc:0 "우리의 위기 진행이 미네랄 함선을 해제했다. 탐식된 미네랄은 함대에 먹이를 주고 합금은 모성 건설을 지속한다; 전쟁은 두 생산 루프를 닫는다.\n\n비히테는 머리 위를 지나가는 함대를 지켜본다. 손실은 대체될 수 있다. 망설임은 금지된다.\n\n함선 가용성, 비용 및 이후 단계는 바닐라 규칙을 따른다. 여왕은 DLC, 승천 또는 특별 프로젝트 요구 사항을 우회하지 않는다."
 eep.31.a:0 "칼날을 다음 세계를 향해 겨라."
 eep.40.name:0 "왕좌 연결 해제"
 eep.40.desc:0 "속박된 모성에 대한 통제권이 중단되었다. 소화가 중단되고 미정산 보상은 봉인된 채로 남는다.\n\n비히테의 명령은 차갑고 직접적이다. 그것을 되찾아라. 비용은 중요하지 않다.\n\n동일한 모성을 회복하면 과제가 재개된다. 수도를 옮겨도 두 번째 심장을 만들 수 없다."
 eep.40.a:0 "어떤 희생을 치르더라도 왕좌를 되찾아라."
 eep.41.name:0 "왕좌 복귀"
 eep.41.desc:0 "원래의 모성이 다시 우리의 통제 하에 있다. 살아남은 소화 식민지는 진척도를 재개하며, 보류 중인 각 과제는 자체 영수증에 대해 한 번 정산된다.\n\n비히테는 축하하지 않는다. 계속하라. 그들이 가진 모든 것으로 그 지연의 대가를 치르게 하라."
 eep.41.a:0 "탐식을 계속하라."
 eep.42.name:0 "심장의 정지"
 eep.42.desc:0 "원래의 모성은 더 이상 사용 가능한 식민지가 아니다. 탐식의 핵심에는 대체 왕좌가 없다.\n\n미완료 과제는 종료된다. 자본 재결합, 복제된 용량 또는 대체 인구는 없다. 살아남은 식민지는 바닐라 규칙에 따라 계속된다. 여왕의 마지막 명령은 여전히 자비의 여지를 남기지 않는다."
 eep.42.a:0 "유일한 심장을 기억하라."
 eep.100.name:0 "여왕 비히테: 법원 장부"
 eep.100.a:0 "물러가라."
 eep.100.tasks:0 "소화 기록을 제출하라."
 eep.101.name:0 "소화 식민지: [eep_report_source.GetName]"
 eep.101.desc:0 "파괴는 면죄부가 아니다. 진척을 보고하라.\n\n원천: [eep_report_source.GetName]\n경로: [eep_report_source.GetEEPTaskPath]\n동결 물질 Q: [eep_report_source.eep_q]\n실제 진척: [eep_report_source.eep_progress]/[eep_report_source.eep_months] 유효 월\n차단: [eep_report_source.eep_block_state] (0 정상, 1 왕좌 연결 해제, 2 전투 또는 점령, 3 최종 숙청)\n\n상황 화면에서 방식을 변경하라. 취소나 소유권 상실은 완료 보상을 주지 않는다."
 eep_stage_0:0 "왕좌 수립"
 eep_stage_1:0 "碎星之王冠"
 eep_stage_2:0 "星辰归心"
 eep_stage_3:0 "만계(萬界)의 법정"
 eep_path_native:0 "테라보어: 바닐라 무작위 소비"
 eep_path_generic:0 "범용 해체: 누적 물질로부터 인구 생성"
 eep.32.name:0 "법정이 바라는 다음 칼날"
 eep.32.desc:0 "비브하이트(白绮)가 새로 해금된 함형을 살핀다. '그들의 저항은 지난 세계보다도 일찍 끝나야 한다.'\n\n실제 네메시스 단계: [Root.eep_crisis]. 3단계에서 $crisis_destroyer$ 해금, 4단계에서 $crisis_cruiser$ 해금. 함형, 장착 및 유지비는 바닐라 그대로. 이 메시지는 능력이나 보상을 부여하지 않습니다."
 eep.100.desc:0 "나는 왕좌로 돌아온 것만을 센다.\n\n결속된 핵심: [eep_report_core.GetName]; 왕정: [Root.GetEEPCourtStage]\n물질 C: [Root.eep_c]; 용량 잔여: [Root.eep_c_remainder]/4\n범용 물질 G: [Root.eep_g]; 인구 잔여: [Root.eep_g_remainder]/6\n총 추가 용량 D: [Root.eep_d]; 실제 빈 지구: [eep_report_core.eep_free_districts]\n현재 핵심 인구: [eep_report_core.eep_actual_pop]; 역사적 제조: [Root.eep_made]\n잠식된 행성: [Root.eep_worlds]; 활성 과제: [Root.eep_tasks]; 최종 정착 대기: [Root.eep_waiting]\n최근 행성: 추가된 용량 [Root.eep_last_capacity], 귀환 인구 [Root.eep_last_return], 제조 [Root.eep_last_manufactured]\n왕좌 상태: [Root.eep_core_state] (0 가용, 1 연결 해제, 2 영구 종료)\n합법적 사이오닉 승천 완료: [Root.eep_psi] (0 아니오, 1 예)\n실제 네메시스 단계: [Root.eep_crisis] (2 코벳, 3 구축함, 4 순양함)\n\n읽기 전용 보고서. 지구구획, 주거, 일자리와 유지비는 정상적인 관리가 필요하다."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "$d_eep_core_desc$"
