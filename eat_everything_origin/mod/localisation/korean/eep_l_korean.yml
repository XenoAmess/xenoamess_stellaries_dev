l_korean:
 origin_heart_of_devouring:0 "탐식의 핵심"
 origin_heart_of_devouring_desc:0 "우리 문명은 결코 세계를 경계로 여기지 않았다. 그것들은 아직 털어내야 할 먹이다. 여왕 비히테는 얼음 같은 의지로 '이 야기'를 다스린다: 이족의 생명과 행렬 전체는 마침내 유일한 왕좌에 귀속될 것이다."
 origin_heart_of_devouring_effects:0 "§YNemesis가 필요합니다. 절멸 국가이념 전용입니다.§! 새 게임에서 즉시 §R위기가 되기§!를 얻으며, 사이오닉 등 종족 승격의 원작 자격 조건은 유지됩니다. 왕좌의 직업 생산량은 기본 §G+10%§!이며, 네메시스 위기 단계마다 §G10퍼센트 포인트§!가 추가됩니다 (1~5단계에서 20%~60%, 늦어도 다음 월간 갱신에 동기화).\n모성에 병렬 민간 건설 대기열 1개가 추가되고, 유물급 드레드노트 장비와 실제로 작동하는 점프 드라이브, 암흑 물질 추진기, 이동식 조선소 10개를 갖춘 모함을 받습니다. 군체의식, 기계 지능, 기타 정부는 각각 군체 행성, 기계 행성, 유물 행성 모성으로 시작하며 추가 식민지는 받지 않습니다. 모함은 유효 물질 10을 포식할 때마다 상한 없이 1레벨 진화하며, 레벨마다 피해량, 선체, 장갑, 방어막이 각각 +5% 증가합니다. 탐식 해체 광선은 교전 중인 적국의 식민지를 지상군 없이 해체하여 모성을 부양합니다.\n모성은 기본적으로 지구 수용량 §G+2§!를 얻습니다. 자국의 자연 식민지를 포식하면 조건에 맞는 창립 종족 인구가 귀환하고, 누적 원생 물질 §Y4§!마다 모성 지구 수용량이 §G1§! 증가합니다. 일반 해체는 누적 물질 §Y6§!마다 창립 종족 인구 §G100§!을 만듭니다. 테라보어는 원작의 무작위 보상을 유지합니다. 보통 크기 15~25인 행성은 3~5년이 걸리며, 지구는 일반 직업을 사용합니다.\n식민지 관리는 결의를 통해 여왕 알현, 모성 이전, 해체 취소, 자동 포식 전환, 개별 행성 면제 해제를 제공합니다. 자동 포식은 §Y기본적으로 꺼져 있습니다§!; 모성을 이전하면 이전 모성도 자동으로 포식될 수 있습니다. 기존 저장에는 시작 보상이나 위기 경로를 소급하여 지급하지 않습니다."
 eep_requires_exterminator:0 "탐식 군약, 결의 소멸자, 광신 종족 청소 또는 소멸 초토 민속이 필요합니다."
 decision_eep_devour:0 "탐식: 유일한 왕좌에 바치다"
 decision_eep_devour_desc:0 "비히테는 어느 세계에 대한 이족의 생물을 인정하지 않는다. 그것을 소화할 충분한 시조 인구를 남겨두고, 그 주민과 지각 그리고 용융된 핵심을 모성으로 가져오라."
 eep_devour_effect:0 "소화 기간은 유효 물질 Q × 2.4개월이며 올림합니다. 완료 시 적격 창립 종족 인구를 돌려보내고 원천 행성 또는 인공 천체를 영구 파괴합니다. 누적 Q 4마다 수용량을 늘리며, 일반 해체는 누적 Q 6마다 인구 100을 만듭니다. 나머지는 천체 간에 유지됩니다. 테라보어는 원작 무작위 소비 보상을 유지합니다. 핵심 상실이나 전투는 진행을 멈추며, 최종 정산은 정화가 끝날 때까지 기다립니다."
 eep_source_required:0 "자국이 통제하는 모성과 평화로운 자국 소유의 적격 비핵심 식민지가 필요합니다. 자연 행성, 군체 행성, 기계 행성뿐 아니라 거주지, 링 월드, 시냅스 선반 등 고정 인공 천체도 지원합니다. 방주와 나노기술 행성 특화는 제외됩니다."
 eep_seed_required:0 "원천에는 최소 100명의 비숙청 창업 인구가 필요하며, 그렇지 않을 경우 모성에 100명 이상의 인구가 있어야 차액을 채울 수 있다. 모성의 마지막 인구는 절대 이주시키지 말라. 소화 작업자는 공짜로 생성되지 않는다."
 eep_material_required:0 "손상되지 않은 원자적 물질이 필요하다."
 decision_eep_audience:0 "여왕 비히테와의 알현"
 decision_eep_audience_desc:0 "탐식의 핵심 법정에 입장하라. 비히테는 그녀의 왕좌로 돌아온 물질과 다음에 파괴될 세계를 심판한다."
 eep_audience_effect:0 "속박된 모성, 누적된 물질, 인구 제조, 알고리즘 과제 및 실제 승천 상태를 읽으십시오. 이 보고서는 보상을 부여하지 않습니다."
 eep_capacity:0 "탐식의 핵심: 축적된 세계의 물질"
 eep_capacity_desc:0 "탐혀진 물질은 행성의 원래 크기를 변경하지 않고 진정한 건설 가능한 지구 용량이 된다."
 d_eep_core:0 "탐식의 핵심: 비히테의 왕좌"
 d_eep_core_desc:0 "여왕의 의지가 이곳에 모입니다. 왕좌 보너스와 누적된 지구 구획 용량은 모성 이전 결의에 따라 이동할 수 있습니다. 왕정 보너스는 결합된 모성을 우리가 통제할 때에만 적용됩니다. 모성을 잃어도 자동으로 대체 왕좌를 선택하지 않습니다."
 situation_eep_devouring:0 "천체 포식"
 situation_eep_devouring_type:0 "탐식의 핵심: 행성 소화"
 situation_eep_devouring_desc:0 "어떤 생존도 보존될 자격이 없다. 어떤 지각도 낭비될 자격이 없다. 이 천체은 유일한 모성의 일부가 될 것이다."
 situation_eep_devouring_monthly_change_tooltip:0 "각 유효 월마다 1 진척도를 얻는다. 모성 상실, 점령 또는 지상전은 진척도를 일시 중지한다. 최종 정착은 모든 바닐라 숙청이 끝나기를 기다린다."
 eep_digesting:0 "세계를 벗기다"
 eep_digesting_desc:0 "이 세계의 모든 목적을 왕좌에 먹이를 주는 것으로 축소하라."
 eep_devour_approach:0 "여왕을 따르라"
 eep_devour_approach_desc:0 "세계가 산산조각 날 때까지 소화를 계속하라."
 eep_cancel_approach:0 "소화 중단"
 eep_cancel_approach_desc:0 "중지 세계의 해체 및 자동 재시작에서 면제. 기존 종자 이전 및 토종 테라보어 비용이 환불되지 않으며 보상도 지급되지 않습니다. 재개 결정 또는 수동 시작 성공 시 면제가 해제됩니다."
 eep_monthly_ready:0 "왕좌와 소화 식민지 사용 가능"
 eep_block_core:0 "왕좌 연결 해제: 속박된 모성이 우리의 통제 하에 있지 않다. 진척도와 정착은 이 동일한 세계가 회복될 때까지 일시 중지된다."
 eep_block_combat:0 "소화 식민지는 점령당하거나 지상전을 수행 중이다. 진척도가 일시 중지되었다."
 eep_block_purge:0 "소화가 완료되었다. 바닐라 숙청이 끝나기를 기다리는 중; 조기 인구 파괴나 반복 소비는 없다."
 mod_situation_eep_devouring_max_progress_add:0 "필요한 소화 월수"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "유일한 왕좌"
 eep.10.desc:0 "비히테가 흑요석 법정에 서서 별자리표를 내려다본다.\n\n'경계?' 그녀의 목소리에는 온기가 없다. '나는 먹이 주위에 경계를 그리지 않는다.'\n\n이족에 대한 약속도, 자비도, 퇴각도 없다. 모든 것이 이 심장을 먹여야 한다. 정복된 세계는 생명, 지각, 그리고 핵심을 내줄 것이다. 여왕은 그것 중 어느 것에 대해서도 후회하지 않을 것이다."
 eep.10.a:0 "왕좌 너머, 모든 것은 탐식될 수 있다."
 eep.11.name:0 "한 세계의 재"
 eep.11.desc:0 "마지막 지각이 벗겨진다. 바다와 도시의 이름은 사라졌고, 모성으로 돌아온 물질의 양만 남는다.\n\n비비트는 즐거움도 없이 보고를 훑는다. 다음.\n\n섭취된 행성 수: [Root.eep_worlds]; 누적 원주민 물질: [Root.eep_c]; 추가된 모성 용량: [Root.eep_d]; 일반 해체로 제조된 인구: [Root.eep_made]. 이는 완료된 정착을 기록한다. 이 메시지는 추가 보상을 주지 않는다.\n\n왕정: [Root.GetEEPCourtStage]. 최근 행성: 추가된 용량 [Root.eep_last_capacity]; 창업 인구 반환 [Root.eep_last_return]; 일반 제조 [Root.eep_last_manufactured]."
 eep.11.a:0 "재가 심장을 먹이게 하라."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "모성의 지평선이 다시 확장된다. 새로운 지구는 실제 주거와 직위를 지원하며, 공장, 하이브 챔버, 신경 허브는 계속 작동한다.\n\n비히테는 별자리표에서 이족 영토를 털어낸다. 그들의 조상의 토지는 단지 우리의 다음 토대일 뿐이다.\n\n누적 물질: [Root.eep_c]; 총 추가 용량: [Root.eep_d]; 제조된 인구: [Root.eep_made]. 여왕은 두 번째 경제 보상 없이 새로운 성장 단계를 기록한다."
 eep.13.a:0 "그들을 토대로 삼아라."
 eep.30.name:0 "저항할 수 없는 의지"
 eep.30.desc:0 "우리의 합법적인 사이오닉 승천이 완료되었다. 법원의 의식이 모성을 가로지른다; 사이오닉 조정과 정상 직위는 계속된다.\n\n비히테는 베일에 있는 이족 메아를 가치 없는 찌꺼기로 간주한다. 그것들을 이해할 필요는 없다. 단지 끝까지 복종하게 만드는 것만 있을 뿐이다.\n\n이 순간은 이미 달성된 바닐라 승천을 기록한다. 추가 인구, 용량 또는 승천 자격을 부여하지 않는다."
 eep.30.a:0 "의지가 곧 법이다."
 eep.31.name:0 "별들이 칼날로 벼려지다"
 eep.31.desc:0 "우리의 위기 진행이 미네랄 함선을 해제했다. 탐식된 미네랄은 함대에 먹이를 주고 합금은 모성 건설을 지속한다; 전쟁은 두 생산 루프를 닫는다.\n\n비히테는 머리 위를 지나가는 함대를 지켜본다. 손실은 대체될 수 있다. 망설임은 금지된다.\n\n함선 가용성, 비용 및 이후 단계는 바닐라 규칙을 따른다. 여왕은 DLC, 승천 또는 특별 프로젝트 요구 사항을 우회하지 않는다."
 eep.31.a:0 "칼날을 다음 세계를 향해 겨라."
 eep.40.name:0 "왕좌 연결 해제"
 eep.40.desc:0 "속박된 모성에 대한 통제권이 중단되었다. 소화가 중단되고 미정산 보상은 봉인된 채로 남는다.\n\n비히테의 명령은 차갑고 직접적이다. 그것을 되찾아라. 비용은 중요하지 않다.\n\n동일한 모성을 회복하면 과제가 재개된다. 수도를 옮겨도 두 번째 심장을 만들 수 없다."
 eep.40.a:0 "어떤 희생을 치르더라도 왕좌를 되찾아라."
 eep.41.name:0 "왕좌 복귀"
 eep.41.desc:0 "원래의 모성이 다시 우리의 통제 하에 있다. 살아남은 소화 식민지는 진척도를 재개하며, 보류 중인 각 과제는 자체 영수증에 대해 한 번 정산된다.\n\n비히테는 축하하지 않는다. 계속하라. 그들이 가진 모든 것으로 그 지연의 대가를 치르게 하라."
 eep.41.a:0 "탐식을 계속하라."
 eep.42.name:0 "심장의 정지"
 eep.42.desc:0 "원래의 모성은 더 이상 사용 가능한 식민지가 아니다. 탐식의 핵심에는 대체 왕좌가 없다.\n\n미완료 과제는 종료된다. 자본 재결합, 복제된 용량 또는 대체 인구는 없다. 살아남은 식민지는 바닐라 규칙에 따라 계속된다. 여왕의 마지막 명령은 여전히 자비의 여지를 남기지 않는다."
 eep.42.a:0 "유일한 심장을 기억하라."
 eep.100.name:0 "여왕 비히테: 법원 장부"
 eep.100.desc:0 "나는 왕좌로 돌아온 것만을 셈니다.\n\n결속 모성: [eep_report_core.GetName]; 왕정: [Root.GetEEPCourtStage]\n물질 C: [Root.eep_c]; 용량 잔량: [Root.eep_c_remainder]/4\n일반 물질 G: [Root.eep_g]; 인구 잔량: [Root.eep_g_remainder]/6\n총 추가 용량 D: [Root.eep_d]; 실제 남은 지구구획: [eep_report_core.eep_free_districts]\n모성 현재 인구: [eep_report_core.eep_actual_pop]; 역사상 제조량: [Root.eep_made]\n포식된 세계: [Root.eep_worlds]; 활성 임무: [Root.eep_tasks]; 최종 정착 대기: [Root.eep_waiting]\n최근 세계: 추가 용량 [Root.eep_last_capacity], 반환 인구 [Root.eep_last_return], 제조량 [Root.eep_last_manufactured]\n왕좌 상태: [Root.eep_core_state] (0 가용, 1 연결 해제, 2 영구 종료)\n합법 사이오닉 승격 완료: [Root.eep_psi] (0 아니오, 1 예)\n실제 Nemesis 단계: [Root.eep_crisis] (2 코벳, 3 구축함, 4 순양함)\n\n읽기 전용 보고서. 지구구획, 주거, 업무, 유지비는 일반 경영이 필요.\n\n$eep_evolution_report$"
 eep.100.a:0 "물러가라."
 eep.100.tasks:0 "소화 기록을 제출하라."
 eep.101.name:0 "소화 식민지: [eep_report_source.GetName]"
 eep.101.desc:0 "파괴는 면죄부가 아니다. 진척을 보고하라.\n\n원천: [eep_report_source.GetName]\n경로: [eep_report_source.GetEEPTaskPath]\n동결 물질 Q: [eep_report_source.eep_q]\n실제 진척: [eep_report_source.eep_progress]/[eep_report_source.eep_months] 유효 월\n차단: [eep_report_source.eep_block_state] (0 정상, 1 왕좌 연결 해제, 2 전투 또는 점령, 3 최종 숙청)\n\n상황 화면에서 방식을 변경하라. 취소나 소유권 상실은 완료 보상을 주지 않는다."
 eep_stage_0:0 "왕좌 수립"
 eep_stage_1:0 "부서진 세계의 왕관"
 eep_stage_2:0 "심장으로 돌아오는 별들"
 eep_stage_3:0 "무수한 세계의 왕정"
 eep_path_native:0 "테라보어: 바닐라 무작위 소비"
 eep_path_generic:0 "범용 해체: 누적 물질로부터 인구 생성"
 eep.32.name:0 "법정이 바라는 다음 칼날"
 eep.32.desc:0 "비브하이트가 새로 해금된 함체를 살핀다. 그들의 저항은 지난 세계보다도 일찍 끝나야 한다.\n\n실제 네메시스 단계: [Root.eep_crisis]. 3단계에서 $crisis_destroyer$, 4단계에서 $crisis_cruiser$가 해금된다. 함체, 장비와 유지비는 원작 규칙을 따른다. 이 메시지는 능력이나 보상을 부여하지 않는다."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "여왕의 왕좌는 모성 직무 산출을 증가시킵니다: 기본 +10%, 네이티브 네메시스 위기 단계마다 10퍼센트 포인트 추가. 단계 1~5는 20% / 30% / 40% / 50% / 60%를 산출하며 다음 월간 업데이트 시점에 동기화됩니다. 보너스는 왕좌를 따릅니다. 이 위기가 없는 기존 세이브는 기본 10%를 유지합니다."
 decision_eep_digest_report:0 "포식 전쟁 기록 열람"
 decision_eep_digest_report_desc:0 "이 행성의 해체 진행 상황을 보고하라. 비브하이트는 아직 자신의 왕좌에 도달하지 않은 가치에만 관심이 있다."
 eep_digest_report_effect:0 "이 행성의 포식(Devouring) 진행도, 일시 정지 사유 및 보류 중인 정산 상태를 확인합니다. 보고서는 보상을 지급하지 않습니다."
 decision_eep_auto_devour_enable:0 "전 제국 자동 포식(Devouring) 활성화"
 decision_eep_auto_devour_enable_desc:0 "여왕의 명령이다: 속박된 모성을 제외한 제국의 모든 자격을 갖춘 식민지를 포식(Devouring)하라. 새로 획득한 식민지도 이 명령에 복종한다."
 eep_auto_devour_enable_effect:0 "전 제국 스위치를 활성화합니다. 매월, 창시 종족 시드·평화·모성 속박 요건을 충족하는 모성 외의 자격을 갖춘 소유 행성에 대해 포식(Devouring)을 개시합니다. 기본값은 비활성화되어 있으며, 메가스 구조물 및 기타 부적격 대상은 건너뜁니다."
 decision_eep_auto_devour_disable:0 "전 제국 자동 포식(Devouring) 비활성화"
 decision_eep_auto_devour_disable_desc:0 "왕좌의 확장 명령을 보류합니다. 각 행성의 운명을 직접 결정하십시오."
 eep_auto_devour_disable_effect:0 "제국 전역에서 신규 작업 자동 시작을 비활성화. 이미 진행 중인 흡수 작업은 계속 실행됨; 취소하려면 해당 행성의 해체 해제 결의 또는 해당 정세에서 소화 중지를 선택하십시오."
 eep_parallel_construction:0 "포식의 핵심: 병렬 건설"
 eep_parallel_construction_desc:0 "여왕은 현재 연결된 모성 행성에서 통제 하에 있는 동안 추가로 하나의 민간 건설 프로젝트를 동시에 진행하도록 명령합니다. 이 보너스는 왕좌를 따릅니다."
 eep_mothership:0 "백희의 황폐 모함"
 eep_mothership_desc:0 "유물급 드레드노트 무장, 방어 및 핵심 기술 사용, 작동하는 점프 드라이브, 암흑물질 추진, 10개의 이동식 조선소. 유효 물질 10당 캡 없는 진화 레벨을 얻음. 실제 수치는 제국 수정자에 따름."
 NAME_EEP_Baiqi_Mothership:0 "백희의 판결"
 NAME_EEP_Throne_World:0 "왕좌에 바치는 공물"
 eep_mothership_ship:0 "심판 모함"
 eep_mothership_ship_plural:0 "심판 모함"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "왕좌를 이곳으로 이동"
 decision_eep_migrate_core_desc:0 "비비트의 의지는 토양에 얽매이지 않습니다. 이 행성을 새로운 모성 행성으로 삼아 왕좌와 제국 수도를 함께 옮기십시오."
 eep_migration_required:0 "현재 모성은 계속 우리 통제하에 있어야 합니다. 목적지는 점령이나 지상전이 없는 적격한 자국 식민지여야 하며, 인공 천체이거나 포식 중이거나 다른 왕좌가 있는 행성은 제외됩니다."
 eep_migration_effect:0 "모성 행성 연결, 제국 수도, 왕좌 직위 보너스, 누적 지구 구획 용량 및 부여된 추가 병렬 건설 큐를 이곳으로 이동합니다. 인구와 건물은 옮기지 않으며 비축품과 파괴 장부도 변하지 않습니다. 다른 해체 작업은 계속 진행되며 수익은 새 모성 행성으로 전달됩니다. §R제국 전체 자동 파괴가 활성화되어 있다면 이전 모성 행성은 이후 자동으로 해체될 수 있습니다.§!"
 decision_eep_cancel_devour:0 "이 세계 해체 취소"
 decision_eep_cancel_devour_desc:0 "이 세계 해체 명령을 철회합니다. 여왕 비흐이트는 변경된 명령은 허락하지만 이미 지불된 비용은 지워주지 않습니다."
 eep_cancel_devour_effect:0 "즉시 이 세계의 흡수 정세를 중단하고 본 모드의 해체 잠금을 해제하며, 보상은 지급되지 않습니다. 이미 이전된 종자 인구와 토종 테라보어 피해는 유지됩니다. 다음 달 재시작 방지를 위해 이 세계에 자동 흡수 면제를 부여; 재개 결정 또는 수동 시작 성공 시 면제 해제. 기타 작업과 제국 전역 스위치는 유지됩니다."
 decision_eep_resume_auto_devour:0 "이곳에서 자동 흡수 재개"
 decision_eep_resume_auto_devour_desc:0 "이 행성에 내린 일시적인 유예를 철회하고 제국의 포식 명령에 다시 복종시킵니다."
 eep_resume_auto_devour_effect:0 "이 행성의 자동 포식 면제만 해제합니다. 제국 전체 자동 포식이 켜져 있으면 다음 월간 검사에서 일반 조건에 따라 시작을 시도하며, 꺼져 있으면 수동으로 시작해야 합니다."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "포식적 해체 광선"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "지상군 없이 자연 또는 인공 식민 천체를 해체해 모성에 바칩니다. 거주지, 링 월드, 시냅스 선반도 지원합니다. 자국의 비핵심 식민지 또는 교전 중인 적국 식민지를 대상으로 합니다. 발사 완료 시 유효 크기에 따라 수용량, 인구, 모함 성장을 정산합니다. 일반 해체는 물질 6마다 창립 종족 인구 100을 만들며, 테라보어는 원작 무작위 보상을 유지합니다. 취소된 발사는 보상을 주지 않습니다."
 eep_colossus_target_required:0 "자국 모함, 이용 가능한 모성, 유효 물질이 0보다 많은 자국의 비핵심 식민지 또는 교전 중인 적국 식민지가 필요합니다. 고정 인공 천체도 지원합니다. 모든 제국의 모성 핵심, 방주, 나노기술 행성 특화, 식민지화 중, 지상전 중, 포식 중, 이미 정산된 대상은 제외됩니다."
 eep_mothership_evolution:0 "포식적 공생: 무한 진화"
 eep_mothership_evolution_desc:0 "누적 유효 물질 10마다 상한 없이 1레벨 진화합니다. 레벨마다 피해량, 선체, 장갑, 방어막이 각각 +5% 증가하며, 선체와 장갑의 일일 재생량이 각각 0.1 증가합니다."
 eep_evolution_report:0 "모함 진화 레벨: [Root.eep_mothership_level]; 다음 레벨까지 필요한 물질: [Root.eep_mothership_next]. 레벨마다 피해량, 선체, 장갑, 방어막이 각각 +5% 증가합니다. 물질 10마다 1레벨 진화하며 레벨 상한은 없습니다.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "행성 해체"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "$PLANET|Y$(을)를 해체할 준비 중"
 EEP_ADAPTIVE_SHIELD_CORE:0 "적응형 방어막 핵"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "등급마다 방어막이 10% 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_shield_core:0 "적응형 방어막 핵"
 EEP_ADAPTIVE_ARMOR_CORE:0 "적응형 장갑 핵"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "등급마다 장갑이 10% 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_armor_core:0 "적응형 장갑 핵"
 EEP_ADAPTIVE_HULL_CORE:0 "적응형 선체 핵"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "등급마다 선체가 10% 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_hull_core:0 "적응형 선체 핵"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "적응형 화력 핵"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "등급마다 무기 피해량이 5% 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_damage_core:0 "적응형 화력 핵"
 EEP_ADAPTIVE_TRACKING_CORE:0 "적응형 추적 핵"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "등급마다 추적이 3포인트 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_tracking_core:0 "적응형 추적 핵"
 EEP_ADAPTIVE_REGEN_CORE:0 "적응형 재생 핵"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "등급마다 선체와 장갑의 고정 일일 재생량이 각각 0.2 증가합니다. 진화 5레벨마다 여섯 핵 중 하나가 같은 확률로 선택되어 영구적으로 한 등급 오릅니다. 이 핵은 동력이나 유지 자원을 추가로 소모하지 않습니다."
 eep_adaptive_regen_core:0 "적응형 재생 핵"
 eep_component_report:0 "\n\n§H핵 업그레이드 기록§!\n획득 자격: [Root.eep_component_entitled]; 지급 완료: [Root.eep_component_rewards]; 지급 대기: [Root.eep_component_pending]\n마지막으로 확인된 등급: 방어막 [Root.eep_component_shield_level] / 장갑 [Root.eep_component_armor_level] / 선체 [Root.eep_component_hull_level] / 화력 [Root.eep_component_damage_level] / 추적 [Root.eep_component_tracking_level] / 재생 [Root.eep_component_regen_level].\n5레벨마다 여섯 핵 중 하나를 무작위로 영구 업그레이드합니다. 미지급분이 많이 쌓이면 나누어 지급합니다. 모함이 파괴되거나 사용할 수 없으면 업그레이드를 멈추고 기록을 보관합니다. 이 기록은 현재 장착된 부품을 뜻하지 않습니다. 기록이 없으면 0을 표시합니다."
 eep_mothership_section:0 "심판급 모함 핵심부"
 eep_mothership_section_1019:0 "심판급 공생 선체"
 MESSAGE_DESC_FOR_EEP_PLANET_KILLER_DEVOURER:0 "(은)는 완전히 분해되어 흡수되었습니다. 원인:"
