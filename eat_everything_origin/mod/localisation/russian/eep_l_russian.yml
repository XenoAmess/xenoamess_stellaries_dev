l_russian:
 origin_heart_of_devouring:0 "Сердце Пожирания"
 origin_heart_of_devouring_desc:0 "Наша цивилизация никогда не считала миры границами. Они — пища, которую ещё предстоит обглодать. Королева Вихарт правит ледяной волей: чужие жизни и целые планеты в конце концов будут принадлежать единственному трону."
 origin_heart_of_devouring_effects:0 "§YТребуется Nemesis. Только экстерминационные государственные устройства.§! Новые партии сразу получают §RСтать Кризисом§!, сохраняя стандартное право на расовые возвышения, такие как псионика. Базовый выход трона начинается с §G+10%§!, плюс §G10 процентных пунктов§! за каждый уровень кризиса Nemesis (20%–60% на уровнях 1–5, синхронизируется ближайшим ежемесячным обновлением).\nВ начале даётся одна дополнительная параллельная гражданская очередь строительства на родном мире и матка с вооружением реликтного линкора, рабочим прыжковым двигателем, тёмной материей в качестве движущей силы и десятью мобильными верфями. Рой, Машинные Разумы и другие формы правления получают соответственно миров-ульев, Машинный мир или Реликтный мир в качестве родного мира без дополнительной колонии. Матка получает один неограниченный уровень за каждые 10 единиц эффективной поглощённой материи; каждый уровень добавляет +5% к урону, корпусу, броне и щитам. Её Жадный Луч Деконструкции разбирает вражеские колонии военного времени для родного мира без армий.\nРодной мир начинается с §G+2§! к вместимости районов. Поглощайте собственные естественные колонии и возвращайте подходящее население основателей; каждые накопленные §Y4§! единицы местной материи дают §G1§! район на родном мире. Обычная разборка создаёт §G100§! населения за каждые накопленные §Y6§! единиц материи; Терракоры сохраняют стандартные случайные награды. Миры типичного размера 15–25 занимают 3–5 лет, а районы используют обычные рабочие места.\nКолониальные решения предоставляют аудиенцию Королевы, перенос родного мира, отмену разборки, переключатели автоматического поглощения и снятие местных исключений. Автоматическое поглощение §Yотключено по умолчанию§!; после переноса бывший родной мир также может быть автоматически поглощён. Существующие сохранения не получают ретроактивных стартовых наград или пути кризиса."
 eep_requires_exterminator:0 "Требуется Пожирающий рой, Непреклонный истребитель, Фанатичные очистители или гражданство тактики выжженной земли уничтожения."
 decision_eep_devour:0 "Пожрать: Принести Единственному Трону"
 decision_eep_devour_desc:0 "Вихарт не признаёт за чужаками никаких прав на мир. Оставьте достаточно основателей, чтобы его переварить, затем доставьте её жителей, кору и расплавленное ядро домой."
 eep_devour_effect:0 "Переваривание занимает Q × 2,4 эффективных месяцев, округляя вверх. По завершении пригодные основатели возвращаются, а источник навсегда раскалывается. Вместимость обменивается накопленными по 4 Q; обычная разборка создаёт 100 населения за накопленные 6 Q, перенося остатки между мирами. Терравое сохраняют обычные случайные награды за потребление. Потеря ядра или бой приостанавливают прогресс; финальное урегулирование ждёт окончания ванильного очищения."
 eep_source_required:0 "Требуется наша собственная мирная природная колония, отличная от связанного ядра, включая миры Улья и Машинные миры, при условии что ядро находится под нашим контролем. Мегаструктуры, ковчеги, сегменты кольца, Синоптический Токарный Станок и нанотехнологические миры исключены."
 eep_seed_required:0 "Источнику требуется не менее 100 неочищаемых популяций основателей, либо ядру нужно более 100 для покрытия нехватки. Никогда не переселяйте последнюю популяцию ядра. Рабочие-дробители не создаются бесплатно."
 eep_material_required:0 "Требуется неповреждённая местная материя."
 decision_eep_audience:0 "Аудиенция у королевы Вихарт"
 decision_eep_audience_desc:0 "Войдите в двор Сердца Пожирания. Вихарт судит о материи, возвращённой её трону, и о следующем мире, назначенном на уничтожение."
 eep_audience_effect:0 "Показывает привязанное ядро, накопленную материю, производство населения, активные задачи и фактический статус вознесения. Этот отчёт не даёт наград."
 eep_capacity:0 "Сердце Пожирания: Накопленная материя миров"
 eep_capacity_desc:0 "Поглощённая материя становится настоящей вместимостью для строительства районов без изменения исходного размера планеты."
 d_eep_core:0 "Сердце Пожирания: Трон Вихарт"
 d_eep_core_desc:0 "Воля Королевы сходится здесь. Бонусы трона и накопленный лимит районов могут перемещаться вместе с решением о переносе колыбели. Бонусы двора действуют лишь пока мы контролируем привязанную колыбель; её потеря никогда не приводит к автоматическому выбору нового трона."
 situation_eep_devouring:0 "Пожирание [Target.GetName]"
 situation_eep_devouring_type:0 "Сердце Пожирания: Переваривание планеты"
 situation_eep_devouring_desc:0 "Никакая жизнь не заслуживает сохранения. Никакая кора не должна пропадать зря. [Target.GetName] станет частью единственного родного мира."
 situation_eep_devouring_monthly_change_tooltip:0 "Даёт 1 прогресса за каждый эффективный месяц. Потеря ядра, оккупация или наземный бой приостанавливают прогресс. Финальное урегулирование ждёт окончания всего ванильного очищения."
 eep_digesting:0 "Ободрать мир"
 eep_digesting_desc:0 "Свести все назначения этого мира к кормлению трона."
 eep_devour_approach:0 "Повиноваться Королеве"
 eep_devour_approach_desc:0 "Продолжать переваривание, пока мир не расколется."
 eep_cancel_approach:0 "Остановить переваривание"
 eep_cancel_approach_desc:0 "Прервать демонтаж этой планеты и исключить её из автоматического перезапуска. Уже оплаченные расходы на переселение семени и урон от местных Терравоев не возвращаются, награды не выдаются. Решение о возобновлении или успешный ручной запуск снимают исключение."
 eep_monthly_ready:0 "Трон и колония-перевариватель доступны"
 eep_block_core:0 "Трон отключён: привязанное ядро вне нашего контроля. Прогресс и урегулирование приостановлены, пока тот же мир не будет возвращён."
 eep_block_combat:0 "Колония-перевариватель оккупирована или ведёт наземный бой. Прогресс приостановлен."
 eep_block_purge:0 "Переваривание завершено. Ожидание окончания ванильного очищения; преждевременного уничтожения населения или повторного потребления не происходит."
 mod_situation_eep_devouring_max_progress_add:0 "Требуемые месяцы переваривания"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "Единственный Трон"
 eep.10.desc:0 "Вихарт стоит в обсидиановом дворе, глядя вниз на звёздную карту.\n\nГраницы? В её голосе нет тепла. Я не очерчиваю границ вокруг пищи.\n\nНикаких обещаний чужакам, ни пощады, ни отступления. Всё должно кормить это сердце. Покорённые миры отдадут свои жизни, кору и ядра. Королева не пожалеет ни о чём."
 eep.10.a:0 "За троном всё может быть пожрано."
 eep.11.name:0 "Пепел мира"
 eep.11.desc:0 "Последняя кора снимается. Океаны и города утратили имена; осталось лишь количество, возвращённое ядру.\n\nВивхайт бросает взгляд на отчёт без удовольствия. Дальше.\n\nПоглощено миров: [Root.eep_worlds]; совокупная местная материя: [Root.eep_c]; добавленная мощность ядра: [Root.eep_d]; популяция, произведённая общей разборкой: [Root.eep_made]. Эти цифры фиксируют завершённый расчёт. Данное сообщение не даёт дополнительной награды.\n\nДвор: [Root.GetEEPCourtStage]. Последний мир: добавлено мощности [Root.eep_last_capacity]; возвращено популяции основателей [Root.eep_last_return]; общая выработка [Root.eep_last_manufactured]."
 eep.11.a:0 "Пусть пепел кормит сердце."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "Горизонт ядра вновь расширяется. Новые районы поддерживают реальные жилища и работы; фабрики, камеры улья и нейронные узлы продолжают действовать.\n\nВихарт смахивает чужую территорию со звёздной карты. Их исконная земля — лишь наш следующий фундамент.\n\nНакопленная материя: [Root.eep_c]; общая дополнительная вместимость: [Root.eep_d]; произведённое население: [Root.eep_made]. Королева фиксирует новый этап роста без второй экономической награды."
 eep.13.a:0 "Сделайте их фундаментом."
 eep.30.name:0 "Непреклонная воля"
 eep.30.desc:0 "Наше законное псионическое вознесение завершено. Сознание двора простирается через ядро; псионическая координация и обычные работы поддерживают его растущее сердце.\n\nВихарт считает отголоски чужаков в Завесе бесполезным остатком. Нет нужды их понимать. Лишь подчинить до конца.\n\nЭтот момент фиксирует уже достигнутое ванильное вознесение. Он не даёт дополнительного населения, вместимости или права на вознесение."
 eep.30.a:0 "Воля есть закон."
 eep.31.name:0 "Звёзды, Перекованные в Клинки"
 eep.31.desc:0 "Прогресс нашего кризиса разблокировал минеральные корабли. Поглощённые минералы кормят флот, а сплавы поддерживают строительство ядра; война замыкает оба производственных цикла.\n\nВихарт наблюдает, как флот проходит над головой. Потери возместимы. Колебания запрещены.\n\nДоступность кораблей, стоимости и последующие стадии следуют ванильным правилам. Королева не обходит требования DLC, вознесения или особых проектов."
 eep.31.a:0 "Направить клинок на следующий мир."
 eep.40.name:0 "Трон Отключён"
 eep.40.desc:0 "Контроль над привязанным ядром прерван. Пожирание остановлено, неурегулированные награды остаются запечатанными.\n\nПриказ Вихарт холоден и прям. Верните его. Цена не имеет значения.\n\nВозврат того же ядра возобновляет задачи. Перенос столицы не создаёт второго сердца."
 eep.40.a:0 "Вернуть трон любой ценой."
 eep.41.name:0 "Трон Возвращён"
 eep.41.desc:0 "Исходный родной мир снова под нашим контролем. Выжившие колонии-перевариватели возобновляют прогресс; каждая ожидающая задача урегулируется один раз по своей квитанции.\n\nВихарт не празднует. Продолжайте. Пусть заплатят за промедление всем, что у них есть."
 eep.41.a:0 "Продолжать пожирание."
 eep.42.name:0 "Сердце Останавливается"
 eep.42.desc:0 "Исходный родной мир больше не пригоден для колонизации. У Сердца Пожирания нет запасного трона.\n\nНезавершённые задачи прекращаются. Перепривязки столицы, копирования вместимости или выдачи населения не будет. Выжившие колонии продолжают действовать по ванильным правилам. Последний приказ Королевы всё же не оставляет места пощаде."
 eep.42.a:0 "Помнить единственное сердце."
 eep.100.name:0 "Королева Вихарт: Дворовая Книга"
 eep.100.desc:0 "Я считаю лишь то, что вернулось на трон.\n\nСвязующее ядро: [eep_report_core.GetName]; двор: [Root.GetEEPCourtStage]\nМатерия C: [Root.eep_c]; остаток вместимости: [Root.eep_c_remainder]/4\nОбычная материя G: [Root.eep_g]; остаток населения: [Root.eep_g_remainder]/6\nИтого добавлено вместимости D: [Root.eep_d]; фактически свободных районов: [eep_report_core.eep_free_districts]\nТекущее население ядра: [eep_report_core.eep_actual_pop]; исторически создано: [Root.eep_made]\nПоглощено миров: [Root.eep_worlds]; активных задач: [Root.eep_tasks]; итоговых поселений в ожидании: [Root.eep_waiting]\nПоследний мир: добавлено вместимости [Root.eep_last_capacity], возвращено населения [Root.eep_last_return], создано [Root.eep_last_manufactured]\nСостояние трона: [Root.eep_core_state] (0 доступно, 1 отключено, 2 навсегда завершено)\nЗаконное псионическое возвышение завершено: [Root.eep_psi] (0 нет, 1 да)\nФактическая стадия Nemesis: [Root.eep_crisis] (2 корветы, 3 эсминцы, 4 крейсера)\n\nОтчёт только для чтения. Районы, жильё, рабочие места и содержание требуют обычного управления.\n\n$eep_evolution_report$"
 eep.100.a:0 "Свободны."
 eep.100.tasks:0 "Представить записи переваривания."
 eep.101.name:0 "Колония-перевариватель: [eep_report_source.GetName]"
 eep.101.desc:0 "Разрушение — не оправдание. Отчитайтесь за свой прогресс.\n\nИсточник: [eep_report_source.GetName]\nПуть: [eep_report_source.GetEEPTaskPath]\nЗамороженная материя Q: [eep_report_source.eep_q]\nФактический прогресс: [eep_report_source.eep_progress]/[eep_report_source.eep_months] эффективных месяцев\nБлокировка: [eep_report_source.eep_block_state] (0 норма, 1 трон отключён, 2 бой или оккупация, 3 финальная очистка)\n\nМеняйте подходы в интерфейсе ситуации. Отмена или потеря владения не дают награды за завершение."
 eep_stage_0:0 "Трон утверждён"
 eep_stage_1:0 "Корона разбитых миров"
 eep_stage_2:0 "Звёзды возвращаются к сердцу"
 eep_stage_3:0 "Бесчисленных миров двор"
 eep_path_native:0 "Терравор: стандартное случайное потребление"
 eep_path_generic:0 "Общая разборка: население из накопленной материи"
 eep.32.name:0 "Следующий клинок Двора"
 eep.32.desc:0 "Вивхайт осматривает новый открытый корпус. Их сопротивление должно закончиться быстрее, чем у последнего мира.\n\nТекущая стадия Немезиды: [Root.eep_crisis]. Стадия 3 открывает $crisis_destroyer$; стадия 4 открывает $crisis_cruiser$. Корпуса, оснащение и содержание остаются стандартными. Это сообщение не даёт способностей и наград."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "Трон Королевы увеличивает вывод профессий родного мира: +10% базово, плюс 10 процентных пунктов за каждый уровень Кризиса Nemesis. Уровни 1–5 дают 20% / 30% / 40% / 50% / 60%, синхронизированные ближайшим месячным обновлением. Бонус следует за троном. Существующие сохранения без этого Кризиса сохраняют базовые 10%."
 decision_eep_digest_report:0 "Прочитать Хронику Пожирания"
 decision_eep_digest_report_desc:0 "Представьте ход разделки этого мира. Вивхайт заботит лишь то, какая ценность ещё не достигла её трона."
 eep_digest_report_effect:0 "Просмотрите ход пожирания этого мира, причины паузы и ожидающие расчёты. Доклад не приносит наград."
 decision_eep_auto_devour_enable:0 "Включить автоматическое пожирание в масштабах империи"
 decision_eep_auto_devour_enable_desc:0 "Королева приказывает пожрать все допустимые колонии, кроме привязанного родного мира. Вновь полученные колонии также подчинятся этому приказу."
 eep_auto_devour_enable_effect:0 "Включает переключатель в масштабе всей империи. Каждый месяц начинает пожирание собственных допустимых миров, кроме привязанного родного мира, с учётом ограничений зачатка основателей, мира и владения ядром. По умолчанию отключено; мегасооружения и прочие недопустимые объекты пропускаются."
 decision_eep_auto_devour_disable:0 "Отключить автоматическое пожирание в масштабах империи"
 decision_eep_auto_devour_disable_desc:0 "Приостановить приказ трона об экспансии. Судьбу каждого мира решаете вы сами."
 eep_auto_devour_disable_effect:0 "Отключить автоматический запуск новых задач по всей империи. Уже идущие задачи пожирания продолжаются; отменить задачу можно через решение о демонтаже её исходной планеты или через подход ситуации."
 eep_parallel_construction:0 "Сердце Пожирания: Параллельное строительство"
 eep_parallel_construction_desc:0 "Королева приказывает одновременно вести один дополнительный гражданский строительный проект на текущей привязанной колыбели, пока та под нашим контролем. Бонус следует за троном."
 eep_mothership:0 "Мать-корабль Разрушения Вивхайт"
 eep_mothership_desc:0 "Оружие, защита и базовые технологии реликтного линкора, с рабочим прыжковым двигателем, движущей силой из тёмной материи и десятью мобильными верфями. Получает один неограниченный уровень эволюции за каждые 10 поглощённой материи. Фактические значения зависят от модификаторов империи."
 NAME_EEP_Baiqi_Mothership:0 "Вердикт Вивхайт"
 NAME_EEP_Throne_World:0 "Дань Трону"
 eep_mothership_ship:0 "Флагман Вердикта"
 eep_mothership_ship_plural:0 "Флагманы Вердикта"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Перенести трон сюда"
 decision_eep_migrate_core_desc:0 "Воля Вивхайт не привязана к земле. Объявите этот мир новой колыбелью и перенесите сюда трон и имперскую столицу."
 eep_migration_required:0 "Текущая колыбель должна оставаться под нашим контролем. Цель должна быть подходящей собственной колонией, без оккупации и наземных боёв, не искусственной и не поглощаемой, и не должна содержать другой трон."
 eep_migration_effect:0 "Перенесите сюда привязку колыбели, имперскую столицу, бонус должности трона, накопленную ёмкость районов и предоставленную дополнительную параллельную очередь строительства. Население, здания, запасы и книги поглощения сохраняются. Остальные задачи сноса продолжаются и направляют выручку новой колыбели. §RЕсли включено автоматическое поглощение по всей империи, прежняя колыбель впоследствии может быть снесена автоматически.§!"
 decision_eep_cancel_devour:0 "Отменить демонтаж этой планеты"
 decision_eep_cancel_devour_desc:0 "Отозвать приказ о демонтаже этого мира. Королева дозволяет сменить команду, но не спишет уже понесённые расходы."
 eep_cancel_devour_effect:0 "Немедленно прервать ситуацию пожирания этой планеты и снять блокировки демонтажа этого мода, не выдавая наград. Уже переселённые семена-основатели и урон от местных Терравоев сохраняются. Планета получает исключение из автоматического пожирания, чтобы в следующем месяце не было перезапуска; решение о возобновлении или успешный ручной запуск снимают исключение. Остальные задачи и общий переключатель империи сохраняются."
 decision_eep_resume_auto_devour:0 "Возобновить автоматическое пожирание здесь"
 decision_eep_resume_auto_devour_desc:0 "Отменить временную отсрочку для этой планеты и вернуть её под приказ империи о пожирании."
 eep_resume_auto_devour_effect:0 "Снять исключение из автоматического пожирания только для этой планеты. Если общий режим автоматического пожирания в империи включён, следующий ежемесячный обзор попытается запустить его в обычном порядке; в противном случае всё ещё требуется ручной запуск."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Жадный Луч Деконструкции"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Разбирает естественную колонию для родного мира без армий. Целится в собственные нестоличные колонии или вражеские колонии во время войны. Завершённый залп даёт вместимость, население и рост матки от эффективного размера мира. Обычная разборка создаёт 100 населения основателей за 6 материи; Терракоры сохраняют стандартные случайные награды. Отменённые залпы не дают ничего."
 eep_colossus_target_required:0 "Требуется ваш корабль-матка, доступный родной мир и собственная естественная колония вне ядра либо естественная колония воюющего противника с эффективной материей больше 0. Ядра родных миров любых империй, искусственные миры, идущая колонизация, наземные сражения, активное поглощение и уже учтённые миры исключены."
 eep_mothership_evolution:0 "Симбиоз Поглощения: Неограниченная Эволюция"
 eep_mothership_evolution_desc:0 "За каждый 10 единиц накопленной эффективной материи — один уровень эволюции, без ограничения по уровню. Каждый уровень даёт +5% к урону, корпусу, броне и щитам, а также 0,1 ежедневного восстановления корпуса и брони."
 eep_evolution_report:0 "Уровень эволюции линкора: [Root.eep_mothership_level]; материи до следующего уровня: [Root.eep_mothership_next]. Каждый уровень даёт +5% к урону, корпусу, броне и щитам. Один уровень за 10 материи, без ограничения по уровню.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "Разобрать планету"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "Подготовка к разборке планеты $PLANET|Y$"
 EEP_ADAPTIVE_SHIELD_CORE:0 "Адаптивное ядро щитов"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "Каждый ранг добавляет 10% щитов. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_shield_core:0 "Адаптивное ядро щитов"
 EEP_ADAPTIVE_ARMOR_CORE:0 "Адаптивное ядро брони"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "Каждый ранг добавляет 10% брони. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_armor_core:0 "Адаптивное ядро брони"
 EEP_ADAPTIVE_HULL_CORE:0 "Адаптивное ядро корпуса"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "Каждый ранг добавляет 10% корпуса. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_hull_core:0 "Адаптивное ядро корпуса"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "Адаптивное ядро огневой мощи"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "Каждый ранг добавляет 5% урона оружия. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_damage_core:0 "Адаптивное ядро огневой мощи"
 EEP_ADAPTIVE_TRACKING_CORE:0 "Адаптивное ядро наведения"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "Каждый ранг добавляет 3 единицы наведения. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_tracking_core:0 "Адаптивное ядро наведения"
 EEP_ADAPTIVE_REGEN_CORE:0 "Адаптивное ядро регенерации"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "Каждый ранг добавляет 0,2 фиксированного ежедневного восстановления корпуса и 0,2 брони. Каждые пять уровней эволюции одно из шести ядер выбирается с равной вероятностью и навсегда получает один ранг. Это ядро не увеличивает потребление энергии или затраты на содержание."
 eep_adaptive_regen_core:0 "Адаптивное ядро регенерации"
 eep_component_report:0 "\n\n§HЖурнал улучшений ядер§!\nПоложено: [Root.eep_component_entitled]; выдано: [Root.eep_component_rewards]; ожидает: [Root.eep_component_pending]\nПоследние подтверждённые ранги: щиты [Root.eep_component_shield_level] / броня [Root.eep_component_armor_level] / корпус [Root.eep_component_hull_level] / огневая мощь [Root.eep_component_damage_level] / наведение [Root.eep_component_tracking_level] / регенерация [Root.eep_component_regen_level].\nКаждые пять уровней одно из шести ядер случайным образом и навсегда улучшается. Большое число ожидающих улучшений выдаётся поэтапно. Если корабль-матка уничтожен или недоступен, улучшения прекращаются, а история сохраняется. Эта история не означает наличие действующих компонентов. При отсутствии записи отображается 0."
