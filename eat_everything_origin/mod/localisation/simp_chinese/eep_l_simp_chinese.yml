l_simp_chinese:
 origin_heart_of_devouring:0 "吞噬之心"
 origin_heart_of_devouring_desc:0 "我们的文明从未把星球视作疆界。它们只是尚未剥离的食物。女王·白绮以冰冷的意志统御族群：异族、生命与整个世界，最终都将归入唯一的王座。"
 origin_heart_of_devouring_effects:0 "§Y需要Nemesis。仅限灭绝国策。§!新游戏开局直接获得§R化身天灾§!，保留灵能等种族飞升的原版准入。王座岗位产出基础§G+10%§!，武灾每阶段再加§G10个百分点§!（阶段1～5为20%～60%，最迟下月同步）。\n开局母星额外1条并行民用建造队列，获得配备遗迹级无畏战舰配置、真实跃迁和暗物质动力的母舰及10条移动船坞。蜂巢／机械智能／其它政体分别获得蜂巢星球／机械星球／遗落星球母星，不额外赠送殖民地。母舰每吞噬10单位有效物质升一级，等级无上限；每级伤害、舰体、装甲、护盾各+5%。饕餮解构光束可直接拆解交战敌国殖民星，收益归母星，无需陆军。\n母星初始额外区划容量§G+2§!。吞噬自有自然殖民地，回迁合格本族人口；累计每§Y4§!格原生物质增加§G1§!母星区划。通用拆解每累计§Y6§!格制造§G100§!本族人口；噬岩者保留原版随机收益。通常15～25格星球耗时3～5年，区划使用正常岗位。\n殖民管理入口使用决议：觐见女王、迁移母星、取消拆解、自动吞噬开关与单星豁免恢复。自动吞噬§Y默认关闭§!；迁移后旧母星也可能被自动吞噬。旧存档不追补开局奖励或危机路线。"
 eep_requires_exterminator:0 "需要吞噬蜂群、铁心灭绝者、种族洁癖或焦土灭绝国策。"
 decision_eep_devour:0 "吞噬：献于唯一王座"
 decision_eep_devour_desc:0 "白绮不承认异族对星球的任何权利。留下足够的本族消化者，把人口、地壳与熔融核心逐一收归母星。"
 eep_devour_effect:0 "消化耗时为剩余原生物质 Q × 2.4 月，向上取整。结算时回迁合格本族人口，源星永久破碎。容量按累计 Q 每 4 格兑换；通用拆解人口按累计 Q 每 6 格制造 100，余料跨星保留。噬岩者使用原版随机消费收益。母星失联或战斗期间暂停；末期等待原版肃清结束。"
 eep_source_required:0 "需要自有、和平、非母星的自然殖民地，包括蜂巢星球和机械星球；母星必须仍由本国控制。不能吞噬巨构、方舟、环段、突触凝练器或纳米世界。"
 eep_seed_required:0 "源星需有至少 100 非肃清本族人口，或母星有超过 100 的本族人口供补足差额；不得迁走母星最后一批人口。消化者不免费生成。"
 eep_material_required:0 "需要尚未损毁的原生物质。"
 decision_eep_audience:0 "觐见女王·白绮"
 decision_eep_audience_desc:0 "走入吞噬之心的王庭。白绮审视的是归还王座的物质和下一颗即将毁灭的星球。"
 eep_audience_effect:0 "查看绑定母星、累计物质、人口制造、活动任务和真实飞升状态。报告只读，不发放奖励。"
 eep_capacity:0 "吞噬之心：积累的星壤"
 eep_capacity_desc:0 "吞噬所得物质成为真实可建区划容量；星球原始尺寸不变。"
 d_eep_core:0 "吞噬之心：白绮的王座"
 d_eep_core_desc:0 "女王的意志汇聚于此。王座加成与累积区划容量可通过决议随母星迁移；王庭加成仅在本国控制绑定母星时生效。失去母星不会自行选择替代王座。"
 situation_eep_devouring:0 "吞噬 [Target.GetName]"
 situation_eep_devouring_type:0 "吞噬之心：星球消化"
 situation_eep_devouring_desc:0 "没有生命值得保留，没有地壳值得浪费。[Target.GetName] 将被消化，最终成为唯一母星的一部分。"
 situation_eep_devouring_monthly_change_tooltip:0 "每个有效推进月增加 1 进度。母星失联、源星占领或地面战暂停。完成后若肃清仍在进行，则等待最后一批异族消失。"
 eep_digesting:0 "剥离世界"
 eep_digesting_desc:0 "把这颗星球的一切用途归结为供养王座。"
 eep_devour_approach:0 "遵从女王"
 eep_devour_approach_desc:0 "继续消化直到世界破碎。"
 eep_cancel_approach:0 "中止消化"
 eep_cancel_approach_desc:0 "中止本星球拆解并使其免于自动重开。不返还已经付出的种子迁移或原生噬岩代价，不发放收益；可通过恢复决议或手动开始解除豁免。"
 eep_monthly_ready:0 "王座与消化站可用"
 eep_block_core:0 "王座失联：绑定母星不在本国控制下。吞噬与结算暂停，收复同一母星后恢复。"
 eep_block_combat:0 "消化站处于占领或地面战，推进暂停。"
 eep_block_purge:0 "物质消化已完成；等待原版肃清结束，不提前毁灭人口或重复消费。"
 mod_situation_eep_devouring_max_progress_add:0 "吞噬所需月数"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "唯一的王座"
 eep.10.desc:0 "白绮立于母星的黑曜石王庭，垂眼望着星图。\n\n‘疆界？’她的声音毫无温度。‘我不需要为食物划定疆界。’\n\n没有对异族的许诺，没有怜悯，更没有退路。族群的一切必须供养这颗心脏。被征服的世界将交出自己的生命、地壳与核心，而女王不会为其中任何一样感到惋惜。"
 eep.10.a:0 "王座之外，皆可吞噬。"
 eep.11.name:0 "一颗世界的余烬"
 eep.11.desc:0 "最后一层地壳从消化站剥离。曾经的海洋和城市不再拥有名字，只有归还母星的物质数量。\n\n白绮扫过报告，神情甚至没有一丝愉悦。‘下一个。’\n\n已吞噬世界：[Root.eep_worlds]；累计原生物质：[Root.eep_c]；母星新增容量：[Root.eep_d]；通用拆解制造人口：[Root.eep_made]。这些数字记录既成结算，本次消息不追加奖励。\n\n王庭：[Root.GetEEPCourtStage]。最近一颗世界：新增容量 [Root.eep_last_capacity]；回迁本族 [Root.eep_last_return]；通用制造 [Root.eep_last_manufactured]。"
 eep.11.a:0 "余烬归于吞噬之心。"
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "母星的地平线再一次延伸。新区划承接真正的住房和岗位，工厂、巢室与神经中枢继续运转。\n\n白绮以指尖掠过星图，把一片异族疆域从未来中抹去。‘他们所谓的故土，只是我们的下一层地基。’\n\n累计物质：[Root.eep_c]；额外总容量：[Root.eep_d]；已制造人口：[Root.eep_made]。女王记录新的成长阶段，不赠予第二份经济收益。"
 eep.13.a:0 "让他们成为地基。"
 eep.30.name:0 "不可抗拒的意志"
 eep.30.desc:0 "我们的合法灵能飞升已完成。王庭的意识贯穿母星；灵能协调与普通岗位共同支撑这颗不断膨胀的心脏。\n\n白绮俯视虚境中的异族回声，像审视一份毫无价值的残渣。‘不必理解他们。只需让他们服从终局。’\n\n这一刻记录已经取得的原版飞升能力。女王没有赐予额外人口、区划或飞升资格。"
 eep.30.a:0 "意志即为律令。"
 eep.31.name:0 "以群星铸成刀锋"
 eep.31.desc:0 "我们的天灾进程已实际解锁矿物舰。吞噬所得矿物进入舰队，合金继续供养母星建设；两条生产链在战争中闭合。\n\n白绮望着舰队从王庭上空驶过。‘损失可以补充。迟疑不被允许。’\n\n矿物舰的可用性、成本和后续阶段均沿用原版。女王不会越过 DLC、飞升或特殊项目的条件。"
 eep.31.a:0 "让刀锋指向下一颗星球。"
 eep.40.name:0 "王座失联"
 eep.40.desc:0 "绑定母星的控制权已经中断。吞噬局势停在原处，所有尚未结算的收益被封存。\n\n白绮的指令冰冷而直接：‘夺回来。代价不在考虑之内。’\n\n收复同一颗母星后任务恢复。迁都不能制造第二颗吞噬之心。"
 eep.40.a:0 "不惜代价，收复王座。"
 eep.41.name:0 "王座复归"
 eep.41.desc:0 "原始母星重新回到族群控制之下。尚存的消化站恢复推进，等待结算的任务仍按各自凭证兑现一次。\n\n白绮没有庆贺。‘继续。让他们为这段耽搁付出一切。’"
 eep.41.a:0 "继续吞噬。"
 eep.42.name:0 "心脏的终止"
 eep.42.desc:0 "原始母星已经不再是可用殖民地。吞噬之心没有备用王座。\n\n未完成任务将终止；不会重绑首都、复制容量或补发人口。幸存殖民地继续沿用原版规则经营。白绮留下的最后指令，依旧没有给怜悯留下位置。"
 eep.42.a:0 "铭记唯一的心脏。"
 eep.100.name:0 "女王·白绮：王庭账簿"
 eep.100.desc:0 "‘我只看已经归还王座的东西。’\n\n绑定母星：[eep_report_core.GetName]；王庭：[Root.GetEEPCourtStage]\n累计物质 C：[Root.eep_c]；容量余料：[Root.eep_c_remainder]/4\n通用物质 G：[Root.eep_g]；人口余料：[Root.eep_g_remainder]/6\n额外总容量 D：[Root.eep_d]；实际空余：[eep_report_core.eep_free_districts]\n母星当前人口：[eep_report_core.eep_actual_pop]；历史制造：[Root.eep_made]\n已吞噬世界：[Root.eep_worlds]；活动任务：[Root.eep_tasks]；末期待结算：[Root.eep_waiting]\n最近一颗：新增容量 [Root.eep_last_capacity]，回迁 [Root.eep_last_return]，制造 [Root.eep_last_manufactured]\n王座状态：[Root.eep_core_state]（0 可用，1 失联，2 永久终止）\n合法灵能飞升完成：[Root.eep_psi]（0 否，1 是）\n实际武灾阶段：[Root.eep_crisis]（2 护卫舰，3 驱逐舰，4 巡洋舰）\n\n报告只读。区划、住房、岗位和维护仍需正常经营。\n\n$eep_evolution_report$"
 eep.100.a:0 "退下。"
 eep.100.tasks:0 "呈上消化站记录。"
 eep.101.name:0 "消化站：[eep_report_source.GetName]"
 eep.101.desc:0 "‘毁灭不是借口。把进度交代清楚。’\n\n源星：[eep_report_source.GetName]\n路径：[eep_report_source.GetEEPTaskPath]\n冻结物质 Q：[eep_report_source.eep_q]\n实际进度：[eep_report_source.eep_progress]/[eep_report_source.eep_months] 有效月\n阻塞：[eep_report_source.eep_block_state]（0 正常，1 王座失联，2 战斗或占领，3 末期肃清）\n\n局势界面可更改策略。中止或源星易主不会发放完成奖励。"
 eep_stage_0:0 "王座初立"
 eep_stage_1:0 "碎星之冠"
 eep_stage_2:0 "群星归心"
 eep_stage_3:0 "万界王庭"
 eep_path_native:0 "噬岩：原版随机消费"
 eep_path_generic:0 "通用拆解：累计物质制造人口"
 eep.32.name:0 "王庭的下一柄刀锋"
 eep.32.desc:0 "白绮审视新近解锁的舰型。‘他们的反抗，必须比上一颗世界更短。’\n\n实际武灾阶段：[Root.eep_crisis]。阶段 3 解锁 $crisis_destroyer$，阶段 4 解锁 $crisis_cruiser$；船型、装配和维护沿用原版，此消息不授予能力或奖励。"
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "女王的王座提高母星岗位产出：基础+10%，化身天灾每个原生武灾阶段再加10个百分点。阶段1～5分别为20%／30%／40%／50%／60%，最迟下月同步；随王座迁移。没有武灾的旧存档保持基础10%。"
 decision_eep_digest_report:0 "查看吞噬战记"
 decision_eep_digest_report_desc:0 "呈上这颗星球的剥离进度。白绮只关心它还有多少价值尚未归入王座。"
 eep_digest_report_effect:0 "查看本星球的吞噬进度、暂停原因与待结算状态。报告不发放奖励。"
 decision_eep_auto_devour_enable:0 "开启全帝国自动吞噬"
 decision_eep_auto_devour_enable_desc:0 "女王的命令：除唯一母星外，将帝国所有合格殖民地纳入吞噬。新取得的殖民地也将受到此命令约束。"
 eep_auto_devour_enable_effect:0 "开启全帝国开关。每月自动启动自有、非母星且符合吞噬条件的星球；沿用本族种子、和平与母星绑定限制。默认关闭；巨构与其它不合格对象跳过。"
 decision_eep_auto_devour_disable:0 "关闭全帝国自动吞噬"
 decision_eep_auto_devour_disable_desc:0 "暂缓王座的扩张命令，由你逐颗决定星球的命运。"
 eep_auto_devour_disable_effect:0 "关闭全帝国开关，不再自动启动新任务。已经开始的吞噬继续；如需中止，请在源星执行取消本星球拆解决议，或在对应局势中选择中止消化。"
 eep_parallel_construction:0 "吞噬之心：双线营造"
 eep_parallel_construction_desc:0 "女王命令当前绑定母星同时推进额外一项民用建造。仅由本国控制时生效，随王座迁移。"
 eep_mothership:0 "白绮的毁灭母舰"
 eep_mothership_desc:0 "采用遗迹级无畏战舰的武器、防御与核心科技，配备真实跃迁引擎、暗物质动力和十条移动船坞。每吞噬10单位物质进化一级，无上限；实际数值受帝国修正影响。"
 NAME_EEP_Baiqi_Mothership:0 "白绮的裁决"
 NAME_EEP_Throne_World:0 "王座的贡品"
 eep_mothership_ship:0 "裁决级母舰"
 eep_mothership_ship_plural:0 "裁决级母舰"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "迁移王座至此"
 decision_eep_migrate_core_desc:0 "白绮的意志不依附于泥土。将这里确立为新的母星，让王座与帝国首都一同迁来。"
 eep_migration_required:0 "当前母星必须仍由本国正常控制；目标须为自有、未被占领且无地面战斗的合格殖民地，不能正在吞噬、属于人工天体或承载另一座王座。"
 eep_migration_effect:0 "将母星绑定、帝国首都、王座岗位加成、累积区划容量与已授予的额外并行建造队列转移至此。不搬运人口或建筑，不改变库存及吞噬账本。其它拆解任务继续，收益送往新母星。§R若全帝国自动吞噬已开启，旧母星之后也可能被自动拆解。§!"
 decision_eep_cancel_devour:0 "取消本星球拆解"
 decision_eep_cancel_devour_desc:0 "撤回对这颗星球的拆解命令。女王容许一次改令，却不会替你抹去已经付出的代价。"
 eep_cancel_devour_effect:0 "立即中止本星球的吞噬局势并解除本Mod的拆解锁，不发放收益。已经迁移的种子人口和原生噬岩损伤不会撤回。本星球获得自动吞噬豁免，防止下月重开；可通过恢复决议或手动开始解除。其它任务与全帝国开关保持。"
 decision_eep_resume_auto_devour:0 "恢复本星球自动吞噬"
 decision_eep_resume_auto_devour_desc:0 "撤销这颗星球的临时赦免，令它再次服从帝国的吞噬命令。"
 eep_resume_auto_devour_effect:0 "仅解除本星球的自动吞噬豁免。全帝国自动吞噬开启时，下一次月度扫描会按正常条件尝试启动；关闭时仍需手动开始。"
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "饕餮解构光束"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "将天然殖民星拆解并献于母星，无需陆军。只能用于自有非母星或交战敌国殖民星；完成发射时按有效规模结算容量、人口和母舰成长。普通拆解每6单位制造100本族人口，噬岩者保留原生随机收益。取消发射不发奖励。"
 eep_colossus_target_required:0 "需要本国母舰、可用母星，以及有效物质大于0的自有非核心或交战敌国天然殖民星。不能攻击任何帝国的母星核心、人工天体、殖民中、地面战斗中、正在吞噬或已经结算的星球。"
 eep_mothership_evolution:0 "吞星共生：无限进化"
 eep_mothership_evolution_desc:0 "每累计吞噬10单位有效物质进化一级，不设上限。每级额外伤害、舰体、装甲、护盾各+5%，舰体与装甲每日恢复各+0.1。"
 eep_evolution_report:0 "母舰进化等级：[Root.eep_mothership_level]；距离下一级：[Root.eep_mothership_next] 单位物质。每级伤害、舰体、装甲、护盾各+5%；每10单位进化，等级无上限。$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "拆解星球"
