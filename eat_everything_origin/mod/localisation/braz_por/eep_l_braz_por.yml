l_braz_por:
 origin_heart_of_devouring:0 "Coração Devorador"
 origin_heart_of_devouring_desc:0 "Nossa civilização nunca tratou mundos como fronteiras. São alimento a ser despido. O Red Queen Vivhite governa com vontade gélida: vidas alienígenas e planetas inteiros acabarão subordinados ao único trono."
 origin_heart_of_devouring_effects:0 "§YRequer Nemesis. Apenas para cívicos de extermínio.§! Novos jogos concedem imediatamente §RTornar-se a Crise§!, mantendo os requisitos originais para ascensões da espécie, como a psiônica. A produção dos empregos do trono começa em §G+10%§!, com mais §G10 pontos percentuais§! por nível da crise de Nemesis (20%–60% nos níveis 1–5, sincronizados até a próxima atualização mensal).\nComece com uma fila adicional de construção civil paralela no mundo natal e uma nave-mãe com equipamentos de encouraçado da classe Relíquia, propulsor de salto funcional, propulsão de matéria escura e dez estaleiros móveis. Mentes Colmeia, Inteligências de Máquina e outras autoridades recebem, respectivamente, um Mundo Colmeia, Mundo Máquina ou Mundo Relíquia natal, sem colônia adicional. A nave-mãe ganha um nível sem limite a cada 10 de matéria efetiva consumida; cada nível acrescenta +5% de dano, casco, blindagem e escudos. Seu Feixe de Desconstrução Voraz desmantela colônias inimigas durante a guerra em benefício do mundo natal, sem exércitos.\nO mundo natal começa com §G+2§! de capacidade de distritos. Devore colônias naturais próprias e devolva a população fundadora elegível; cada §Y4§! de matéria nativa acumulada acrescenta §G1§! distrito ao mundo natal. O desmantelamento genérico cria §G100§! de população a cada §Y6§! de matéria acumulada; os Terrávoros mantêm as recompensas aleatórias originais. Mundos de tamanho 15–25 geralmente levam 3–5 anos e os distritos usam empregos normais.\nAs decisões coloniais oferecem audiência com a Rainha, transferência do mundo natal, cancelamento do desmantelamento, controles de devoração automática e remoção da isenção local. A devoração automática fica §Ydesativada por padrão§!; após a transferência, o antigo mundo natal também poderá ser devorado automaticamente. Jogos salvos existentes não recebem recompensas iniciais nem a rota da crise retroativamente."
 eep_requires_exterminator:0 "Requer Enxame Devorador, Exterminador Determinado, Purificadores Fanáticos ou um civic de terra arrasada exterminador."
 decision_eep_devour:0 "Devorar: Oferecer ao Único Trono"
 decision_eep_devour_desc:0 "Vivhite não reconhece nenhuma reivindicação alienígena sobre um mundo. Deixe população fundadora suficiente para digeri-lo, então traga seus habitantes, crosta e núcleo fundido para casa."
 eep_devour_effect:0 "A digestão leva Q × 2,4 meses efetivos, arredondados para cima. A conclusão devolve a população fundadora elegível e destrói permanentemente o mundo ou corpo artificial de origem. A capacidade aumenta a cada 4 Q acumulados; o desmantelamento comum cria 100 de população a cada 6 Q acumulados, preservando os restos entre mundos. Terrávoros mantêm as recompensas aleatórias originais. A perda do núcleo ou o combate pausa o progresso; a liquidação final aguarda o fim da purga."
 eep_source_required:0 "Requer uma colônia própria, pacífica e elegível fora do núcleo e um mundo natal sob nosso controle. Aceita mundos naturais, colmeia e mecânicos, além de corpos artificiais fixos como habitats, mundos-anel e o Torno Sináptico. Arcas e a especialização de mundo nanotecnológico continuam excluídas."
 eep_seed_required:0 "A fonte precisa de pelo menos 100 população fundadora não purgada, ou o núcleo precisa de mais de 100 para suprir a diferença. Nunca remova a última população do núcleo. Trabalhadores de digestão não são criados de graça."
 eep_material_required:0 "É necessária matéria nativa não danificada."
 decision_eep_audience:0 "Audiência com Queen Vivhite"
 decision_eep_audience_desc:0 "Entre na corte do Coração Devorador. Vivhite julga a matéria devolvida a seu trono e o próximo mundo marcado para destruição."
 eep_audience_effect:0 "Leia o núcleo vinculado, matéria cumulativa, manufatura de população, tarefas ativas e estado real de ascensão. Este relatório não concede recompensas."
 eep_capacity:0 "Coração Devorador: Matéria Mundial Acumulada"
 eep_capacity_desc:0 "A matéria devorada vira capacidade real e construível de distritos sem mudar o tamanho original do planeta."
 d_eep_core:0 "Coração Devorador: Trono de Vivhite"
 d_eep_core_desc:0 "A vontade da Rainha converge aqui. Os bônus do Trono e a capacidade acumulada de distritos podem acompanhar uma decisão de realocação do mundo natal. Os bônus da Corte aplicam-se apenas enquanto controlamos o mundo natal vinculado; perdê-lo jamais seleciona um trono substituto automaticamente."
 situation_eep_devouring:0 "Devorando um mundo"
 situation_eep_devouring_type:0 "Coração Devorador: Digestão Planetária"
 situation_eep_devouring_desc:0 "Nenhuma vida merece preservação. Nenhuma crosta merece desperdício. Este mundo se tornará parte do único mundo natal."
 situation_eep_devouring_monthly_change_tooltip:0 "Ganhe 1 progresso a cada mês efetivo. Perda do núcleo, ocupação ou combate terrestre pausa o progresso. A liquidação final espera toda purga vanilla terminar."
 eep_digesting:0 "Despir o Mundo"
 eep_digesting_desc:0 "Reduza cada propósito deste mundo a alimentar o trono."
 eep_devour_approach:0 "Obedeça à Rainha"
 eep_devour_approach_desc:0 "Continue a digestão até o mundo se estilhaçar."
 eep_cancel_approach:0 "Interromper a Digestão"
 eep_cancel_approach_desc:0 "Aborta a desmontagem deste mundo e o isenta dos reinícios automáticos. Os custos já pagos de realocação de sementes e Terravore nativo não são reembolsados, e nenhuma recompensa é concedida. Uma decisão de retomada ou início manual bem-sucedido remove a isenção."
 eep_monthly_ready:0 "Trono e colônia de digestão disponíveis"
 eep_block_core:0 "Trono desconectado: o núcleo vinculado está fora do nosso controle. Progresso e liquidação pausam até este mesmo mundo ser recuperado."
 eep_block_combat:0 "A colônia de digestão está ocupada ou em combate terrestre. Progresso pausado."
 eep_block_purge:0 "Digestão completa. Esperando a purga vanilla terminar; sem eliminação prematura de população ou consumo repetido."
 mod_situation_eep_devouring_max_progress_add:0 "Meses de Digestão Necessários"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "O Único Trono"
 eep.10.desc:0 "Vivhite está no tribunal de obsidiana, olhando para o cartograma estelar.\n\nFronteiras? Sua voz não tem calor. Tomonha alimento; Tomonha o meu alimento; Tomonha o alimento.\n\nNão há promessas a alienígenas, sem misericórdia e sem recuo. Tudo deve alimentar este coração. Mundos subjugados entregarão suas vidas, crostas e núcleos. A Rainha não se arrependerá de nada disso."
 eep.10.a:0 "Além do trono, todos podem ser devorados."
 eep.11.name:0 "As Cinzas de um Mundo"
 eep.11.desc:0 "A última crosta se desprende. Oceanos e cidades perderam seus nomes; só a quantidade devolvida ao núcleo permanece.\n\nVivhite olha o relatório sem prazer. Próximo.\n\nMundos consumidos: [Root.eep_worlds]; matéria nativa acumulada: [Root.eep_c]; capacidade adicional do núcleo: [Root.eep_d]; população fabricada por desmontagem genérica: [Root.eep_made]. Estes registram a liquidação concluída. Esta mensagem não concede recompensa adicional.\n\nCorte: [Root.GetEEPCourtStage]. Mundo mais recente: capacidade adicionada [Root.eep_last_capacity]; população fundadora devolvida [Root.eep_last_return]; manufatura genérica [Root.eep_last_manufactured]."
 eep.11.a:0 "Que as cinzas alimentem o coração."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "O horizonte do núcleo se expande novamente. Novos distritos suportam habitação e cargos reais; fábricas, câmaras da colmeia e centros neurais preservam o trabalho.\n\nVivhite tira um território alienígena do cartograma estelar. Seu solo ancestral é meramente nossa próxima fundação.\n\nMatéria cumulativa: [Root.eep_c]; capacidade adicional total: [Root.eep_d]; população manufaturada: [Root.eep_made]. A Rainha regista um novo estágio de crescimento sem uma segunda recompensa econômica."
 eep.13.a:0 "Faça deles a fundação."
 eep.30.name:0 "Uma Vontade Irresistível"
 eep.30.desc:0 "Nossa ascensão psiônica legítima está completa. A consciência da corte alcança através do núcleo; a coordenação psiônica e cargos normais sustentam seu coração crescente.\n\nVivhite ao vivo ecos alienígenas no Véu como resíduo sem valor. Não há necessidade de entendê-los. Apenas fazê-los submeter-se ao fim.\n\nEste momento regista uma ascensão vanilla já alcançada. Não concede população extra, capacidade ou elegibilidade de ascensão."
 eep.30.a:0 "Vontade é lei."
 eep.31.name:0 "Estrelas Forjadas em Lâminas"
 eep.31.desc:0 "Nossa progressão de crise desbloqueou naves de minerais. Minerais devorados alimentam a frota enquanto ligas sustentam a construção do núcleo; a guerra fecha ambas as cadeias de produção.\n\nVivhite observa a frota passarem por cima. Perdas podem ser substituídas. Hesitação é proibida.\n\nDisponibilidade de naves, custos e estágios posteriores seguem regras vanilla. A Rainha não ignora nenhum DLC, assento de ascensão ou preferência."
 eep.31.a:0 "Aponte a lâmina ao próximo mundo."
 eep.40.name:0 "Trono Desconectado"
 eep.40.desc:0 "O controle do núcleo vinculado foi interrompido. A digestão para e recompensas não liquidadas ficam guardadas.\n\nA ordem de Vivhite é fria e direta. Recupere-o. O custo é irrelevante.\n\nRecuperar o mesmo núcleo retoma as tarefas. Mover a capital não cria um segundo coração."
 eep.40.a:0 "Recupere o trono a qualquer custo."
 eep.41.name:0 "O Trono Restaurado"
 eep.41.desc:0 "O mundo natal original está sob nosso controle novamente. Colônias de digestão sobreviventes retomam o progresso; cada tarefa pendente se liquida uma vez contra seu próprio recibo.\n\nVivhite não celebra. Continue. Faça-os pagar pelo atraso com tudo o que têm."
 eep.41.a:0 "Continue devorando."
 eep.42.name:0 "O Coração Para"
 eep.42.desc:0 "O mundo natal original não é mais uma colônia utilizável. O Coração Devorador não tem um trono substituto.\n\nTarefas inacabadas terminam. Não há revinculação de capital, capacidade copiada ou população substituta. Colônias sobreviventes continuam sob regras vanilla. A ordem final de Vivhite ainda não deixa espaço para misericórdia."
 eep.42.a:0 "Lembre-se do único coração."
 eep.100.name:0 "Queen Vivhite: Livro de Registros da Corte"
 eep.100.desc:0 "Conto apenas o que retornou ao trono.\n\nNúcleo vinculado: [eep_report_core.GetName]; corte: [Root.GetEEPCourtStage]\nMatéria C: [Root.eep_c]; resto de capacidade: [Root.eep_c_remainder]/4\nMatéria genérica G: [Root.eep_g]; resto de população: [Root.eep_g_remainder]/6\nCapacidade total adicionada D: [Root.eep_d]; distritos livres reais: [eep_report_core.eep_free_districts]\nPopulação atual do núcleo: [eep_report_core.eep_actual_pop]; total historicamente fabricado: [Root.eep_made]\nMundos consumidos: [Root.eep_worlds]; tarefas ativas: [Root.eep_tasks]; acertos finais pendentes: [Root.eep_waiting]\nÚltimo mundo: capacidade adicionada [Root.eep_last_capacity], população devolvida [Root.eep_last_return], fabricada [Root.eep_last_manufactured]\nEstado do trono: [Root.eep_core_state] (0 disponível, 1 desconectado, 2 encerrado permanentemente)\nAscensão psiônica legítima concluída: [Root.eep_psi] (0 não, 1 sim)\nEstágio real de Nemesis: [Root.eep_crisis] (2 corvetas, 3 contratorpedeiros, 4 cruzadores)\n\nRelatório somente de leitura. Distritos, moradia, empregos e manutenção exigem administração normal.\n\n$eep_evolution_report$"
 eep.100.a:0 "Dispensada."
 eep.100.tasks:0 "Apresente os registros de digestão."
 eep.101.name:0 "Colônia de Digestão: [eep_report_source.GetName]"
 eep.101.desc:0 "Destruição não é desculpa. Preste contas do seu progresso.\n\nFonte: [eep_report_source.GetName]\nCaminho: [eep_report_source.GetEEPTaskPath]\nMatéria congelada Q: [eep_report_source.eep_q]\nProgresso real: [eep_report_source.eep_progress]/[eep_report_source.eep_months] meses efetivos\nBloqueio: [eep_report_source.eep_block_state] (0 normal, 1 trono desconectado, 2 combate ou ocupação, 3 purge final)\n\nMude as abordagens na interface de situação. Cancelamento ou perda de propriedade não concede recompensa de conclusão."
 eep_stage_0:0 "Trono Estabelecido"
 eep_stage_1:0 "Coroa de Mundos Estilhaçados"
 eep_stage_2:0 "As Estrelas Voltam ao Coração"
 eep_stage_3:0 "Corte de Incontáveis Mundos"
 eep_path_native:0 "Terrívora: consumo aleatório original"
 eep_path_generic:0 "Desmantelamento genérico: população a partir de matéria acumulada"
 eep.32.name:0 "A Próxima Lâmina da Corte"
 eep.32.desc:0 "Vivhite examina o casco recém-desbloqueado. A resistência deles deve acabar antes que a do último mundo.\n\nEstágio real da Nemesis: [Root.eep_crisis]. O estágio 3 desbloqueia $crisis_destroyer$; o estágio 4 desbloqueia $crisis_cruiser$. Cascos, equipamentos e manutenção permanecem originais. Esta mensagem não concede habilidade ou recompensa."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "O trono da Rainha aumenta a produção de cargos do mundo natal: +10% base, mais 10 pontos percentuais por nível de crise Nemesis nativo. Os níveis 1–5 geram 20% / 30% / 40% / 50% / 60%, sincronizados pela próxima atualização mensal. O bônus segue o trono. Saves existentes sem essa crise mantêm os 10% base."
 decision_eep_digest_report:0 "Consultar a Crônica da Devoração"
 decision_eep_digest_report_desc:0 "Apresente o progresso de extração deste mundo. Vivhite só se importa com o valor que ainda não alcançou o seu trono."
 eep_digest_report_effect:0 "Veja o progresso de devoração deste mundo, motivos de pausa e pendências de liquidação. O relatório não concede recompensas."
 decision_eep_auto_devour_enable:0 "Ativar Devoração Automática em Todo o Império"
 decision_eep_auto_devour_enable_desc:0 "A Rainha ordena que toda colônia elegível, exceto o mundo natal vinculado, seja devorada. Colônias recém-adquiridas também obedecerão a esta ordem."
 eep_auto_devour_enable_effect:0 "Ativa o interruptor para todo o império. A cada mês, começa a devorar mundos próprios elegíveis que não sejam o mundo natal vinculado, sujeito aos requisitos de semente fundadora, paz e propriedade do núcleo. Desativado por padrão; megastruturas e outros objetos inelegíveis são ignorados."
 decision_eep_auto_devour_disable:0 "Desativar Devoração Automática em Todo o Império"
 decision_eep_auto_devour_disable_desc:0 "Suspenda a ordem de expansão do trono. Decida pessoalmente o destino de cada mundo."
 eep_auto_devour_disable_effect:0 "Desativa o início automático de novas tarefas em todo o império. Tarefas de devoração em andamento continuam; cancele uma pela decisão de desmontagem do mundo de origem ou pela abordagem de sua situação."
 eep_parallel_construction:0 "Coração Devorador: Construção Paralela"
 eep_parallel_construction_desc:0 "A Rainha comanda um projeto de construção civil adicional simultâneo no mundo natal atualmente vinculado enquanto sob nosso controle. Este bônus acompanha o trono."
 eep_mothership:0 "Nave-Mãe da Devastação de Vivhite"
 eep_mothership_desc:0 "Armamentos, defesas e tecnologia central de um encouraçado da classe Relíquia, com propulsor de salto funcional, propulsão de matéria escura e dez estaleiros móveis. Ganha um nível de evolução sem limite a cada 10 de matéria consumida. Os valores reais dependem dos modificadores do império."
 NAME_EEP_Baiqi_Mothership:0 "Veredito de Vivhite"
 NAME_EEP_Throne_World:0 "Tributo ao Trono"
 eep_mothership_ship:0 "Nave-mãe Veredicto"
 eep_mothership_ship_plural:0 "Naves-mãe Veredicto"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Mover o Trono para Cá"
 decision_eep_migrate_core_desc:0 "A vontade de Vivhite não está atada ao solo. Estabeleça este mundo como o novo mundo natal e mova tanto o trono quanto a capital imperial para cá."
 eep_migration_required:0 "O mundo natal atual deve permanecer sob nosso controle. O destino deve ser uma colônia própria elegível, livre de ocupação e combate terrestre, nem artificial nem sendo devorada, e não deve conter outro trono."
 eep_migration_effect:0 "Mova o vínculo do mundo natal, a capital imperial, o bônus de cargo do trono, a capacidade acumulada de distritos e a fila adicional de construção paralela concedida para cá. População, edifícios, reservas e livros-razão de devoração são preservados. Outras tarefas de desmontagem continuam e enviam seus rendimentos ao novo mundo natal. §RSe a devoração automática em todo o império estiver ativada, o antigo mundo natal poderá ser subsequentemente desmontado automaticamente.§!"
 decision_eep_cancel_devour:0 "Cancelar Desmontagem Deste Mundo"
 decision_eep_cancel_devour_desc:0 "Retira a ordem de desmontar este mundo. A Rainha permite uma ordem alterada, mas não apaga os custos já pagos."
 eep_cancel_devour_effect:0 "Aborta imediatamente a situação de devoração deste mundo e remove os bloqueios de desmontagem deste Mod, sem conceder recompensas. Sementes fundadoras já realocadas e dano de Terravore nativo permanecem. Isenta este mundo da devoração automática para evitar um reinício no próximo mês; uma decisão de retomada ou início manual bem-sucedido remove a isenção. Outras tarefas e o interruptor do império são preservados."
 decision_eep_resume_auto_devour:0 "Retomar Devoração Automática Aqui"
 decision_eep_resume_auto_devour_desc:0 "Revoga a suspensão temporária deste mundo e o devolve ao comando de devoração do império."
 eep_resume_auto_devour_effect:0 "Remove apenas a isenção de devoração automática deste mundo. Se a devoração automática do império estiver ativada, a próxima varredura mensal tentará um início normal; caso contrário, ainda é necessário um início manual."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Feixe de Desconstrução Voraz"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Desmantela uma colônia natural ou artificial para o mundo natal sem exércitos, incluindo habitats, mundos-anel e o Torno Sináptico. Alvos são colônias próprias fora do núcleo ou colônias inimigas durante a guerra. O disparo concluído concede capacidade, população e crescimento da nave-mãe conforme o tamanho efetivo. O desmantelamento comum cria 100 de população fundadora por 6 de matéria; Terrávoros mantêm suas recompensas aleatórias. Disparos cancelados não concedem nada."
 eep_colossus_target_required:0 "Requer sua nave-mãe, um mundo natal disponível e uma colônia própria fora do núcleo ou inimiga em guerra com mais de 0 de matéria efetiva. Corpos artificiais fixos são aceitos. Exclui núcleos de todos os impérios, arcas, mundos nanotecnológicos, colonização em andamento, batalhas terrestres, devoração ativa e alvos já contabilizados."
 eep_mothership_evolution:0 "Simbiose Devoradora: Evolução Ilimitada"
 eep_mothership_evolution_desc:0 "A cada 10 de matéria efetiva acumulada, ganha um nível de evolução, sem limite. Cada nível concede +5% de dano, casco, blindagem e escudos, além de 0,1 de regeneração diária de casco e blindagem."
 eep_evolution_report:0 "Nível de evolução da Nave-Mãe: [Root.eep_mothership_level]; matéria para o próximo nível: [Root.eep_mothership_next]. Cada nível concede +5% de dano, casco, blindagem e escudos. Um nível a cada 10 de matéria, sem limite.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "Desmantelar planeta"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "Preparando para desmantelar $PLANET|Y$"
 EEP_ADAPTIVE_SHIELD_CORE:0 "Núcleo de Escudos Adaptativo"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "Cada nível acrescenta 10% de escudos. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_shield_core:0 "Núcleo de Escudos Adaptativo"
 EEP_ADAPTIVE_ARMOR_CORE:0 "Núcleo de Blindagem Adaptativo"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "Cada nível acrescenta 10% de blindagem. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_armor_core:0 "Núcleo de Blindagem Adaptativo"
 EEP_ADAPTIVE_HULL_CORE:0 "Núcleo de Casco Adaptativo"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "Cada nível acrescenta 10% de casco. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_hull_core:0 "Núcleo de Casco Adaptativo"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "Núcleo de Poder de Fogo Adaptativo"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "Cada nível acrescenta 5% de dano de armas. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_damage_core:0 "Núcleo de Poder de Fogo Adaptativo"
 EEP_ADAPTIVE_TRACKING_CORE:0 "Núcleo de Rastreamento Adaptativo"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "Cada nível acrescenta 3 pontos de rastreamento. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_tracking_core:0 "Núcleo de Rastreamento Adaptativo"
 EEP_ADAPTIVE_REGEN_CORE:0 "Núcleo de Regeneração Adaptativo"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "Cada nível acrescenta 0,2 de regeneração diária fixa de casco e 0,2 de blindagem. A cada cinco níveis de evolução, um dos seis núcleos é escolhido com a mesma probabilidade e ganha um nível permanente. Este núcleo não acrescenta consumo de energia nem custos de manutenção."
 eep_adaptive_regen_core:0 "Núcleo de Regeneração Adaptativo"
 eep_component_report:0 "\n\n§HRegistro de Melhorias dos Núcleos§!\nDevidas: [Root.eep_component_entitled]; concedidas: [Root.eep_component_rewards]; pendentes: [Root.eep_component_pending]\nÚltimos níveis confirmados: escudos [Root.eep_component_shield_level] / blindagem [Root.eep_component_armor_level] / casco [Root.eep_component_hull_level] / poder de fogo [Root.eep_component_damage_level] / rastreamento [Root.eep_component_tracking_level] / regeneração [Root.eep_component_regen_level].\nA cada cinco níveis, um dos seis núcleos é aprimorado aleatoriamente de forma permanente. Grandes quantidades de melhorias pendentes são concedidas em lotes. Se a nave-mãe for destruída ou ficar indisponível, as melhorias param e o histórico é preservado. Esse histórico não representa componentes ativos. Sem registro, exibe-se 0."
 eep_mothership_section:0 "Núcleo de Nave-Mãe da classe Veredito"
 eep_mothership_section_1019:0 "Casco Simbiótico da classe Veredito"
