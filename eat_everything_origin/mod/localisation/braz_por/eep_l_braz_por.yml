l_braz_por:
 origin_heart_of_devouring:0 "Coração Devorador"
 origin_heart_of_devouring_desc:0 "Nossa civilização nunca tratou mundos como fronteiras. São alimento a ser despido. O Red Queen Vivhite governa com vontade gélida: vidas alienígenas e planetas inteiros acabarão subordinados ao único trono."
 origin_heart_of_devouring_effects:0 "§YApenas civics de extermínio§!. Vincule o mundo natal original, ganhando §G+2§! de capacidade de distritos e §G+10%§! de output de cargos. Devore colônias naturais próprias e devolva a população fundadora elegível ao núcleo. A cada §Y4§! unidades cumulativas de matéria nativa, adicione §G1§! distrito no mundo natal. A desmontagem genérica cria §G100§! de população por §Y6§! unidades cumulativas; Terravores mantêm as recompensas aleatórias nativas. Tamanhos típicos de 15–25 mundos levam 3–5 anos. Distritos usam cargos normais; distritos de recurso podem exceder limites de terreno. Psiônicos e progressão de crise seguem os requisitos vanilla."
 eep_requires_exterminator:0 "Requer Enxame Devorador, Exterminador Determinado, Purificadores Fanáticos ou um civic de terra arrasada exterminador."
 decision_eep_devour:0 "Devorar: Oferecer ao Único Trono"
 decision_eep_devour_desc:0 "Vivhite não reconhece nenhuma reivindicação alienígena sobre um mundo. Deixe população fundadora suficiente para digeri-lo, então traga seus habitantes, crosta e núcleo fundido para casa."
 eep_devour_effect:0 "A digestão leva Q × 2,4 meses efetivos, arredondado para cima. A conclusão devolve a população fundadora elegível e estilhaça permanentemente a fonte. A capacidade é trocada a cada 4 Q cumulativos; a desmontagem genérica cria 100 de população por 6 Q cumulativos, carregando restos entre mundos. Terravores mantêm recompensas aleatórias nativas de consumo. Perda do núcleo ou combate pausa o progresso; a liquidação final espera o fim da purga vanilla."
 eep_source_required:0 "Requer uma colônia natural própria e pacífica além do núcleo vinculado, com o núcleo sob nosso controle. Megastruturas, arcas, segmentos de anel, o Torno Sináptico e mundos nanotecnológicos são excluídos."
 eep_material_required:0 "É necessária matéria nativa não danificada."
 decision_eep_audience:0 "Audiência com Queen Vivhite"
 decision_eep_audience_desc:0 "Entre na corte do Coração Devorador. Vivhite julga a matéria devolvida a seu trono e o próximo mundo marcado para destruição."
 eep_audience_effect:0 "Leia o núcleo vinculado, matéria cumulativa, manufatura de população, tarefas ativas e estado real de ascensão. Este relatório não concede recompensas."
 eep_capacity:0 "Coração Devorador: Matéria Mundial Acumulada"
 eep_capacity_desc:0 "A matéria devorada vira capacidade real e construível de distritos sem mudar o tamanho original do planeta."
 d_eep_core:0 "Coração Devorador: Trono de Vivhite"
 d_eep_core_desc:0 "A vontade de Vivhite se reúne aqui. Cargos normais recebem 10% adicional de output apenas enquanto o povo original possui o trono. A capacidade física pertence a este planeta."
 situation_eep_devouring:0 "Devorando [Target.GetName]"
 situation_eep_devouring_type:0 "Coração Devorador: Digestão Planetária"
 situation_eep_devouring_desc:0 "Nenhuma vida merece preservação. Nenhuma crosta merece desperdício. [Target.GetName] se tornará parte do único mundo natal."
 situation_eep_devouring_monthly_change_tooltip:0 "Ganhe 1 progresso a cada mês efetivo. Perda do núcleo, ocupação ou combate terrestre pausa o progresso. A liquidação final espera toda purga vanilla terminar."
 eep_digesting:0 "Despir o Mundo"
 eep_digesting_desc:0 "Reduza cada propósito deste mundo a alimentar o trono."
 eep_devour_approach:0 "Obedeça à Rainha"
 eep_devour_approach_desc:0 "Continue a digestão até o mundo se estilhaçar."
 eep_cancel_approach:0 "Interromper a Digestão"
 eep_cancel_approach_desc:0 "Encerre a tarefa sem pagamento de conclusão. Devastação existente, recompensas gratuitas e realocação de população permanecem."
 eep_monthly_ready:0 "Trono e colônia de digestão disponíveis"
 eep_block_core:0 "Trono desconectado: o núcleo vinculado está fora do nosso controle. Progresso e liquidação pausam até este mesmo mundo ser recuperado."
 eep_block_combat:0 "A colônia de digestão está ocupada ou em combate terrestre. Progresso pausado."
 eep_block_purge:0 "Digestão completa. Esperando a purga vanilla terminar; sem eliminação prematura de população ou consumo repetido."
 mod_situation_eep_devouring_max_progress_add:0 "Meses de Digestão Necessários"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "O Único Trono"
 eep.10.desc:0 "Vivhite está no tribunal de obsidiana, olhando para o cartograma estelar.\n\nFronteiras? Sua voz não tem calor. Tomonha alimento; Tomonha o meu alimento; Tomonha o alimento.\n\nNão há promessas a alienígenas, sem misericórdia e sem recuo. Tudo deve alimentar este coração. Mundos subjugados entregarão suas vidas, crostas e núcleos. A Rainha não se arrependerá de nada disso."
 eep.10.a:0 "Além do trono, todos podem ser devorados."
 eep.11.name:0 "As Cinzas de um Mundo"
 eep.11.a:0 "Que as cinzas alimentem o coração."
 eep.13.desc:0 "O horizonte do núcleo se expande novamente. Novos distritos suportam habitação e cargos reais; fábricas, câmaras de imigração e centros neurais preservam o trabalho.\n\nVivhite tira um território alienígena do cartograma estelar. Seu solo ancestral é meramente nossa próxima fundação.\n\nMatéria cumulativa: [Root.eep_c]; capacidade adicionada: [Root.eep_d]; população manufaturada: [Root.eep_made]. A Rainha regista um novo estágio de crescimento sem uma segunda recompensa econômica."
 eep.13.a:0 "Faça deles a fundação."
 eep.30.name:0 "Uma Vontade Irresistível"
 eep.30.desc:0 "Nossa ascensão psiônica legítima está completa. A consciência da corte alcança através do núcleo; a coordenação psiônica e cargos normais sustentam seu coração crescente.\n\nVivhite ao vivo ecos alienígenas no Véu como resíduo sem valor. Não há necessidade de entendê-los. Apenas fazê-los submeter-se ao fim.\n\nEste momento regista uma ascensão vanilla já alcançada. Não concede população extra, capacidade ou elegibilidade de ascensão."
 eep.30.a:0 "Vontade é lei."
 eep.31.name:0 "Estrelas Forjadas em Lâminas"
 eep.31.desc:0 "Nossa progressão de crise desbloqueou naves de minerais. Minerais devorados alimentam a frota enquanto ligas sustentam a construção do núcleo; a guerra fecha ambas as cadeias de produção.\n\nVivhite observa a frota passarem por cima. Perdas podem ser substituídas. Hesitação é proibida.\n\nDisponibilidade de naves, custos e estágios posteriores seguem regras vanilla. A Rainha não ignora nenhum DLC, assento de ascensão ou preferência."
 eep.31.a:0 "Aponte a lâmina ao próximo mundo."
 eep.40.name:0 "Trono Desconectado"
 eep.40.desc:0 "O controle do núcleo vinculado foi interrompido. A digestão para e recompensas não liquidadas ficam guardadas.\n\nA ordem de Vivhite é fria e direta. Recupere-o. O custo é irrelevante.\n\nRecuperar o mesmo núcleo retoma as tarefas. Mover a capital não cria um segundo coração."
 eep.40.a:0 "Recupere o trono a qualquer custo."
 eep.41.name:0 "O Trono Restaurado"
 eep.41.desc:0 "O mundo natal original está sob nosso controle novamente. Colônias de digestão sobreviventes retomam o progresso; cada tarefa pendente se liquida uma vez contra seu próprio recibo.\n\nVivhite não celebra. Continue. Faça-os pagar pelo atraso com tudo o que têm."
 eep.41.a:0 "Continue devorando."
 eep.42.name:0 "O Coração Para"
 eep.42.desc:0 "O mundo natal original não é mais uma colônia utilizável. O Coração Devorador não tem um trono substituto.\n\nTarefas inacabadas terminam. Não há revinculação de capital, capacidade copiada ou população substituta. Colônias sobreviventes continuam sob regras vanilla. A ordem final de Vivhite ainda não deixa espaço para misericórdia."
 eep.42.a:0 "Lembre-se do único coração."
 eep.100.name:0 "Queen Vivhite: Livro de Registros da Corte"
 eep.100.a:0 "Dispensada."
 eep.100.tasks:0 "Apresente os registros de digestão."
 eep.101.name:0 "Colônia de Digestão: [eep_report_source.GetName]"
 eep_seed_required:0 "A fonte precisa de pelo menos 100 população fundadora não purgada, ou o núcleo precisa de mais de 100 para suprir a diferença. Nunca remova a última população do núcleo. Trabalhadores de digestão não são criados de graça."
 eep.11.desc:0 "A última crosta se desprende. Oceanos e cidades perderam seus nomes; só a quantidade devolvida ao núcleo permanece.\n\nVivhite olha o relatório sem prazer. Próximo.\n\nMundos consumidos: [Root.eep_worlds]; matéria nativa acumulada: [Root.eep_c]; capacidade adicional do núcleo: [Root.eep_d]; população fabricada por desmontagem genérica: [Root.eep_made]. Estes registram a liquidação concluída. Esta mensagem não concede recompensa adicional.\n\nCorte: [Root.GetEEPCourtStage]. Mundo mais recente: capacidade adicionada [Root.eep_last_capacity]; população fundadora devolvida [Root.eep_last_return]; manufatura genérica [Root.eep_last_manufactured]."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.100.desc:0 "Só conto o que voltou ao trono.\n\nNúcleo vinculado: [eep_report_core.GetName]; corte: [Root.GetEEPCourtStage]\nMatéria C: [Root.eep_c]; restante de capacidade: [Root.eep_c_remainder]/4\nMatéria genérica G: [Root.eep_g]; restante de população: [Root.eep_g_remainder]/6\nCapacidade adicional total D: [Root.eep_d]; distritos livres reais: [eep_report_core.eep_free_districts]\nPopulação atual do núcleo: [eep_report_core.eep_actual_pop]; historicamente fabricada: [Root.eep_made]\nMundos consumidos: [Root.eep_worlds]; tarefas ativas: [Root.eep_tasks]; liquidações finais em espera: [Root.eep_waiting]\nMundo mais recente: capacidade adicionada [Root.eep_last_capacity], população devolvida [Root.eep_last_return], fabricada [Root.eep_last_manufactured]\nEstado do trono: [Root.eep_core_state] (0 disponível, 1 desconectado, 2 encerrado permanentemente)\nTradição psiônica legítima concluída: [Root.eep_psi] (0 não, 1 sim)\nEstágio real da Ameaça: [Root.eep_crisis] (2 corvetas, 3 destruidores, 4 cruzadores)\n\nRelatório somente leitura. Distritos, habitação, empregos e manutenção exigem gestão normal."
 eep.101.desc:0 "Destruição não é desculpa. Preste contas do seu progresso.\n\nFonte: [eep_report_source.GetName]\nCaminho: [eep_report_source.GetEEPTaskPath]\nMatéria congelada Q: [eep_report_source.eep_q]\nProgresso real: [eep_report_source.eep_progress]/[eep_report_source.eep_months] meses efetivos\nBloqueio: [eep_report_source.eep_block_state] (0 normal, 1 trono desconectado, 2 combate ou ocupação, 3 purge final)\n\nMude as abordagens na interface de situação. Cancelamento ou perda de propriedade não concede recompensa de conclusão."
 eep_stage_0:0 "Trono Estabelecido"
 eep_stage_1:0 "Coroa de Mundos Estilhaçados"
 eep_stage_2:0 "As Estrelas Voltam ao Coração"
 eep_stage_3:0 "Corte de Incontáveis Mundos"
 eep_path_native:0 "Terrívora: consumo aleatório original"
 eep_path_generic:0 "Desmantelamento genérico: população a partir de matéria acumulada"
 eep.32.name:0 "A Próxima Lâmina da Corte"
 eep.32.desc:0 "Vivhite examina o casco recém-desbloqueado. A resistência deles deve acabar antes que a do último mundo.\n\nEstágio real da Nemesis: [Root.eep_crisis]. O estágio 3 desbloqueia $crisis_destroyer$; o estágio 4 desbloqueia $crisis_cruiser$. Cascos, equipamentos e manutenção permanecem originais. Esta mensagem não concede habilidade ou recompensa."
