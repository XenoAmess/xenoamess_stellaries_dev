l_spanish:
 origin_heart_of_devouring:0 "Corazón Devorador"
 origin_heart_of_devouring_desc:0 "Nuestra civilización nunca consideró los mundos como fronteras. Son alimento aún por desnudar. La Reina Vivhite gobierna con voluntad gélida: las vidas alienígenas y los planetas enteros terminarán принадлежа al único trono."
 origin_heart_of_devouring_effects:0 "§YRequiere Nemesis. Solo éticas de exterminio.§! Las nuevas partidas otorgan de inmediato §RConviértete en la Crisis§!, manteniendo los requisitos originales para ascensiones de especie como la psiónica. La producción del trabajo del Trono comienza en §G+10%§!, más §G10 puntos porcentuales§! por nivel nativo de crisis de Nemesis (20%–60% en los niveles 1–5, sincronizado en la próxima actualización mensual).\nComienzas con una cola de construcción civil adicional en paralelo en el planeta natal y una nave nodriza con equipo de acorazado de clase Reliquia, un motor de salto funcional, propulsión de materia oscura y diez astilleros móviles. Las Mentes Colmena, Inteligencias Mecánicas y otras autoridades reciben respectivamente un Mundo Colmena, Mundo Máquina o Mundo Reliquia como planeta natal, sin colonia extra. La nave nodriza gana un nivel sin tope por cada 10 de materia efectiva consumida; cada nivel añade +5% de daño, casco, blindaje y escudos. Su Rayo de Deconstrucción Voraz desmantla colonias enemigas en tiempo de guerra para el planeta natal sin ejércitos.\nEl planeta natal comienza con §G+2§! de capacidad de distritos. Devora colonias naturales propias y devuelve la población fundadora elegible; cada bloque acumulativo de §Y4§! de materia nativa añade §G1§! distrito al planeta natal. El desmantelamiento genérico crea §G100§! de población por cada bloque acumulativo de §Y6§! de materia; los Terrácoros conservan las recompensas aleatorias nativas. Mundos típicos de 15–25 tardan 3–5 años y los distritos usan trabajos normales.\nLas decisiones coloniales ofrecen audiencia con la Reina, reubicación del planeta natal, cancelación del desmantelamiento, interruptores de devoración automática y eliminación de exenciones locales. La devoración automática está §Ydesactivada por defecto§!; tras la reubicación, el antiguo planeta natal también puede ser devorado automáticamente. Las partidas guardadas existentes no reciben recompensas de inicio ni ruta de crisis retroactivas."
 eep_requires_exterminator:0 "Requiere Enjambre Devorador, Exterminador Decidido, Purificadores Fanáticos o una ideología de tierra quemada exterminadora."
 decision_eep_devour:0 "Devorar: ofrendar al Único Trono"
 decision_eep_devour_desc:0 "Vivhite no reconoce ningún derecho alienígena sobre un mundo. Deja suficiente población fundadora para digerirlo y luego trae a sus habitantes, corteza y núcleo fundido a casa."
 eep_devour_effect:0 "La digestión tarda el equivalente a Q × 2.4 meses, redondeando al alza. Al completarse, devuelve a la población fundadora apta y hace añicos el origen de forma permanente. La capacidad se canjea por cada 4 Q acumuladas; el desmantelamiento genérico crea 100 población por cada 6 Q acumuladas, arrastrando los restos entre mundos. Los Terrávoros conservan las recompensas aleatorias nativas. La pérdida del núcleo o un combate detiene el progreso; el asentamiento final espera a que termine la purga vanilla."
 eep_source_required:0 "Requiere una colonia natural propia y en paz que no sea el núcleo vinculado, incluidos los mundos colmena y los mundos máquina, con el núcleo bajo nuestro control. Se excluyen megaestructuras, arcas, segmentos de anillo, el Torno Sináptico y los mundos nanotec."
 eep_seed_required:0 "La fuente necesita al menos 100 de población fundadora sin purga, o el núcleo necesita más de 100 para cubrir el déficit. Jamás traslades la última población del núcleo. Los Trabajadores de la digestión no están creadas gratis."
 eep_material_required:0 "Se requiere materia nativa intacta."
 decision_eep_audience:0 "Audiencia con la Reina Vivhite"
 decision_eep_audience_desc:0 "Entra en la corte del Corazón Devorador. Vivhite juzga la materia devuelta a su trono y el próximo mundo marcado para la destrucción."
 eep_audience_effect:0 "Lee el núcleo vinculado, la materia acumulada, la fabricación de población, las tareas activas y el estado real de ascensión. Este informe no otorga recompensas."
 eep_capacity:0 "Corazón Devorador: materia acumulada del mundo"
 eep_capacity_desc:0 "La materia devorada se convierte en capacidad real de distrito edificable sin cambiar el tamaño original del planeta."
 d_eep_core:0 "Corazón Devorador: el trono de Vivhite"
 d_eep_core_desc:0 "La voluntad de la Reina converge aquí. Las bonificaciones del trono y la capacidad de distritos acumulada pueden seguir una decisión de reubicación del mundo natal. Las bonificaciones de la corte solo se aplican mientras controlemos el mundo natal vinculado; perderlo nunca selecciona un trono alternativo automáticamente."
 situation_eep_devouring:0 "Devorando [Target.GetName]"
 situation_eep_devouring_type:0 "Corazón Devorador: digestión planetaria"
 situation_eep_devouring_desc:0 "Ninguna vida merece preservación. Ninguna corteza merece desperdicio. [Target.GetName] se convertirá en parte del único mundo de origen."
 situation_eep_devouring_monthly_change_tooltip:0 "Obtén 1 progreso cada mes efectivo. La pérdida del núcleo, la ocupación o el combate terrestre pausan el progreso. El asentamiento final espera a que terminen todas las purgas vanilla."
 eep_digesting:0 "Despojar el mundo"
 eep_digesting_desc:0 "Reduce cada propósito de este mundo a alimentar el trono."
 eep_devour_approach:0 "Obedece a la Reina"
 eep_devour_approach_desc:0 "Continúa la digestión hasta que el mundo se haga añicos."
 eep_cancel_approach:0 "Detener la digestión"
 eep_cancel_approach_desc:0 "Aborta el desmantelamiento de este mundo y exímelo de los reinicios automáticos. No se reembolsan los costes de reubicación de semillas ni de Terravoro nativo ya abonados, y no se otorgan recompensas. Una decisión de reanudar o un inicio manual correcto retira la exención."
 eep_monthly_ready:0 "Trono y colonia de digestión disponibles"
 eep_block_core:0 "Trono desconectado: el núcleo vinculado está fuera de nuestro control. El progreso y el asentamiento se pausan hasta que ese mismo mundo sea recuperado."
 eep_block_combat:0 "La colonia de digestión está ocupada o luchando en un combate terrestre. El progreso está en pausa."
 eep_block_purge:0 "La digestión ha finalizado. Esperando a que termine la purga vanilla; sin destrucción prematura de población ni consumo repetido."
 mod_situation_eep_devouring_max_progress_add:0 "Meses de digestión requeridos"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "El único trono"
 eep.10.desc:0 "Vivhite se alza en la corte de obsidiana, mirando el mapa estelar.\n\n«¿Fronteras?» Su voz no lleva calidez alguna. «No trazo fronteras alrededor de la comida.»\n\nNo hay promesas a alienígenas, ni piedad ni retirada. Todo debe alimentar este corazón. Los mundos conquistados entregarán sus vidas, cortezas y núcleos. La Reina no lamentará nada de ello."
 eep.10.a:0 "Más allá del trono, todo puede ser devorado."
 eep.11.name:0 "Las cenizas de un mundo"
 eep.11.desc:0 "La última corteza se despega. Océanos y ciudades han perdido sus nombres; solo queda la cantidad devuelta al núcleo.\n\nVivhite mira el informe sin placer. Siguiente.\n\nMundos consumidos: [Root.eep_worlds]; materia nativa acumulada: [Root.eep_c]; capacidad añadida al núcleo: [Root.eep_d]; población manufacturada por desmantelamiento genérico: [Root.eep_made]. Estos números registran asentamientos completados. Este mensaje no otorga recompensa adicional.\n\nCorte: [Root.GetEEPCourtStage]. Último mundo: capacidad añadida [Root.eep_last_capacity]; población fundadora devuelta [Root.eep_last_return]; manufactura genérica [Root.eep_last_manufactured]."
 eep.11.a:0 "Deja que las cenizas alimenten el corazón."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "El horizonte del núcleo se expande de nuevo. Los nuevos distritos sostienen vivienda y empleos reales; fábricas, cámaras de la colmena y centros neurales siguen funcionando.\n\nVivhite aparta del mapa estelar un territorio alienígena. Su suelo ancestral no es más que nuestro próximo cimiento.\n\nMateria acumulada: [Root.eep_c]; capacidad adicional total: [Root.eep_d]; población fabricada: [Root.eep_made]. La Reina registra una nueva etapa de crecimiento sin una segunda recompensa económica."
 eep.13.a:0 "Conviértelos en cimiento."
 eep.30.name:0 "Una voluntad irresistible"
 eep.30.desc:0 "Nuestra ascensión psiónica legítima está completa. La conciencia de la corte alcanza a través del núcleo; la coordinación psiónica y los empleos normales sostienen su corazón creciente.\n\nVivhite considera los ecos alienígenas en el Velo como residuos sin valor. No hace falta comprenderlos. Solo hacerlos sucumbir al final.\n\nEste momento registra la ascensión vanilla ya alcanzada. No otorga población extra, capacidad ni elegibilidad de ascensión."
 eep.30.a:0 "La voluntad es ley."
 eep.31.name:0 "Estrellas forjadas en hojas"
 eep.31.desc:0 "Nuestro progreso de crisis ha desbloqueado naves de minerales. Los minerales devorados alimentan la flota mientras las aleaciones sostienen la construcción del núcleo; la guerra cierra ambos bucles de producción.\n\nVivhite observa la flota pasar sobre la corte. Las bajas pueden reemplazarse. La vacilación está prohibida.\n\nLa disponibilidad de naves, los costes y las fases posteriores siguen las reglas vanilla. La Reina no omite ningún requisito de DLC, ascensión o proyecto especial."
 eep.31.a:0 "Apunta la hoja al próximo mundo."
 eep.40.name:0 "Trono desconectado"
 eep.40.desc:0 "El control del núcleo vinculado se ha interrumpido. La digestión se detiene y las recompensas no asentadas permanecen selladas.\n\nLa orden de Vivhite es fría y directa: recupéralo. El coste es irrelevante.\n\nRecuperar el mismo núcleo reanuda las tareas. Mover la capital no puede crear un segundo corazón."
 eep.40.a:0 "Recupera el trono a cualquier coste."
 eep.41.name:0 "El trono restaurado"
 eep.41.desc:0 "El mundo de origen original vuelve a estar bajo nuestro control. Las colonias de digestión supervivientes reanudan el progreso; cada tarea pendiente se asienta una sola vez contra su propio recibo.\n\nVivhite no celebra. Continúa. Hazles pagar por el retraso con todo lo que tienen."
 eep.41.a:0 "Continúa devorando."
 eep.42.name:0 "El corazón se detiene"
 eep.42.desc:0 "El mundo de origen original ya no es una colonia utilizable. El Corazón Devorador no tiene trono de reemplazo.\n\nLas tareas inacabadas terminan. No hay reenlace de capital, copia de capacidad ni población de reemplazo. Las colonias supervivientes continúan bajo las reglas vanilla. La última orden de la Reina tampoco deja lugar a la piedad."
 eep.42.a:0 "Recuerda el único corazón."
 eep.100.name:0 "Reina Vivhite: libro de cuentas de la corte"
 eep.100.desc:0 "Solo cuento lo que ha vuelto al trono.\n\nNúcleo vinculado: [eep_report_core.GetName]; corte: [Root.GetEEPCourtStage]\nMateria C: [Root.eep_c]; resto de capacidad: [Root.eep_c_remainder]/4\nMateria genérica G: [Root.eep_g]; resto de población: [Root.eep_g_remainder]/6\nCapacidad total añadida D: [Root.eep_d]; distritos libres reales: [eep_report_core.eep_free_districts]\nPoblación actual del núcleo: [eep_report_core.eep_actual_pop]; fabricados históricamente: [Root.eep_made]\nMundos consumidos: [Root.eep_worlds]; tareas activas: [Root.eep_tasks]; asentamientos finales en espera: [Root.eep_waiting]\nÚltimo mundo: capacidad añadida [Root.eep_last_capacity], población devuelta [Root.eep_last_return], fabricados [Root.eep_last_manufactured]\nEstado del trono: [Root.eep_core_state] (0 disponible, 1 desconectado, 2 finalizado permanentemente)\nAscensión psiónica legal completada: [Root.eep_psi] (0 no, 1 sí)\nFase real de Nemesis: [Root.eep_crisis] (2 corbetas, 3 destructores, 4 cruceros)\n\nInforme de solo lectura. Distritos, vivienda, trabajos y mantenimiento requieren gestión normal.\n\n$eep_evolution_report$"
 eep.100.a:0 "Despedida."
 eep.100.tasks:0 "Presenta los registros de digestión."
 eep.101.name:0 "Colonia de digestión: [eep_report_source.GetName]"
 eep.101.desc:0 "La destrucción no es excusa. Da cuentas de tu progreso.\n\nFuente: [eep_report_source.GetName]\nRuta: [eep_report_source.GetEEPTaskPath]\nMateria congelada Q: [eep_report_source.eep_q]\nProgreso real: [eep_report_source.eep_progress]/[eep_report_source.eep_months] meses efectivos\nBloqueo: [eep_report_source.eep_block_state] (0 normal, 1 trono desconectado, 2 combate u ocupación, 3 purga final)\n\nCambia de estrategia en la interfaz de situación. La cancelación o pérdida de la fuente no otorga recompensa de compleción."
 eep_stage_0:0 "Trono establecido"
 eep_stage_1:0 "Corona de mundos destrozados"
 eep_stage_2:0 "Las estrellas vuelven al corazón"
 eep_stage_3:0 "Corte de Innumerables Mundos"
 eep_path_native:0 "Devoratierra: consumo aleatorio de la versión base"
 eep_path_generic:0 "Desmantelamiento genérico: población a partir de materia acumulada"
 eep.32.name:0 "La Próxima Hoja de la Corte"
 eep.32.desc:0 "Vivhite examina el casco recién desbloqueado. Su resistencia debe acabar antes que la del último mundo.\n\nEtapa real de la Némesis: [Root.eep_crisis]. La etapa 3 desbloquea $crisis_destroyer$; la etapa 4 desbloquea $crisis_cruiser$. Los cascos, el equipamiento y el mantenimiento siguen siendo los de la versión base. Este mensaje no otorga ninguna habilidad ni recompensa."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "El trono de la Reina aumenta la producción de puestos del mundo natal: +10% base, más 10 puntos porcentuales por nivel nativo de crisis Nemesis. Los niveles 1–5 producen 20% / 30% / 40% / 50% / 60%, sincronizados en el siguiente pase mensual. La bonificación sigue al trono. Las partidas guardadas existentes sin esta crisis conservan el 10% base."
 decision_eep_digest_report:0 "Consultar la Crónica de la Devoración"
 decision_eep_digest_report_desc:0 "Presenta el progreso del desmantelamiento de este mundo. Vivhite solo se preocupa por el valor que aún no ha llegado a su trono."
 eep_digest_report_effect:0 "Consulta el progreso de devoración de este mundo, los motivos de pausa y el asentamiento pendiente. El informe no otorga recompensas."
 decision_eep_auto_devour_enable:0 "Activar Devoración Automática en todo el Imperio"
 decision_eep_auto_devour_enable_desc:0 "La Reina ordena que toda colonia apta, excepto el mundo natal vinculado, sea devorada. Las colonias recién adquiridas también obedecerán esta orden."
 eep_auto_devour_enable_effect:0 "Activa el interruptor de todo el imperio. Cada mes, comienza a devorar mundos propios aptos distintos del mundo natal vinculado, sujeto a requisitos de semilla fundadora, paz y propiedad del núcleo. Desactivado por defecto; se omiten megaestructuras y otros objetos no aptos."
 decision_eep_auto_devour_disable:0 "Desactivar Devoración Automática en todo el Imperio"
 decision_eep_auto_devour_disable_desc:0 "Suspende la orden de expansión del trono. Tú decides el destino de cada mundo."
 eep_auto_devour_disable_effect:0 "Desactiva el inicio automático de nuevas tareas en todo el imperio. Las tareas de devoración en curso continúan; cancela una mediante la decisión de desmantelamiento del mundo de origen o el enfoque de su situación."
 eep_parallel_construction:0 "Corazón de la Devoración: Construcción en paralelo"
 eep_parallel_construction_desc:0 "La Reina ordena un proyecto adicional de construcción civil que avanza simultáneamente en el mundo natal vinculado actualmente mientras esté bajo nuestro control. Esta bonificación sigue al trono."
 eep_mothership:0 "Nave nodriza de devastación de Vivhite"
 eep_mothership_desc:0 "Armas, defensas y tecnología nuclear de acorazado de clase Reliquia, con un motor de salto funcional, propulsión de materia oscura y diez astilleros móviles. Gana un nivel de evolución sin tope por cada 10 de materia consumida. Los valores reales dependen de los modificadores del imperio."
 NAME_EEP_Baiqi_Mothership:0 "Veredicto de Vivhite"
 NAME_EEP_Throne_World:0 "Tributo al Trono"
 eep_mothership_ship:0 "Nodriza Veredicto"
 eep_mothership_ship_plural:0 "Nodrizas Veredicto"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Trasladar el Trono Aquí"
 decision_eep_migrate_core_desc:0 "La voluntad de Vivhite no está atada a la tierra. Establece este mundo como el nuevo mundo natal y traslada aquí tanto el trono como la capital imperial."
 eep_migration_required:0 "El mundo natal actual debe permanecer bajo nuestro control. El destino debe ser una colonia propia apta, libre de ocupación y combate terrestre, que no sea artificial ni esté siendo devorada, y no debe albergar otro trono."
 eep_migration_effect:0 "Traslada aquí la vinculación del mundo natal, la capital imperial, la bonificación de trabajo del trono, la capacidad de distritos acumulada y la cola adicional de construcción en paralelo otorgada. La población, los edificios, las reservas y los registros de devoración se conservan. Otras tareas de desmantelamiento continúan y entregan sus beneficios al nuevo mundo natal. §RSi el devoramiento automático a nivel de imperio está activado, el antiguo mundo natal puede ser desmantelado automáticamente a continuación.§!"
 decision_eep_cancel_devour:0 "Cancelar el desmantelamiento de este mundo"
 decision_eep_cancel_devour_desc:0 "Retira la orden de desmantelar este mundo. La Reina permite un cambio de mando, pero no borrará los costes ya pagados."
 eep_cancel_devour_effect:0 "Aborta de inmediato la situación de devoración de este mundo y elimina los bloqueos de desmantelamiento de este Mod, sin otorgar recompensas. La semilla fundadora ya reubicada y el daño Terravoro nativo permanecen. Exime a este mundo de la devoración automática para evitar un reinicio el mes siguiente; una decisión de reanudar o un inicio manual correcto retira la exención. Las demás tareas y el interruptor imperial se conservan."
 decision_eep_resume_auto_devour:0 "Reanudar aquí la devoración automática"
 decision_eep_resume_auto_devour_desc:0 "Revoca la suspensión temporal de este mundo y devuélvelo al mandato de devoración del imperio."
 eep_resume_auto_devour_effect:0 "Elimina solo la exención de devoración automática de este mundo. Si la devoración automática de todo el imperio está activada, el próximo escaneo mensual intentará un inicio normal; en caso contrario, sigue siendo necesario un inicio manual."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Rayo de Deconstrucción Voraz"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Desmantla una colonia natural para el planeta natal sin ejércitos. Ataca colonias propias no nucleares o colonias enemigas durante la guerra. Al completar el disparo otorga capacidad, población y crecimiento de la nave nodriza según el tamaño efectivo del mundo. El desmantelamiento genérico crea 100 de población fundadora por cada 6 de materia; los Terrácoros conservan las recompensas aleatorias nativas. Los disparos cancelados no otorgan nada."
 eep_colossus_target_required:0 "Requiere tu nave nodriza, un mundo natal disponible y una colonia natural propia que no sea núcleo o enemiga en tiempo de guerra con más de 0 de materia efectiva. Excluye los núcleos de mundos natales de todos los imperios, los mundos artificiales, la colonización en curso, las batallas terrestres, las tareas de devoración activas y los mundos ya contabilizados."
 eep_mothership_evolution:0 "Simbiosis Devoradora: Evolución Ilimitada"
 eep_mothership_evolution_desc:0 "Gana un nivel de evolución por cada 10 de materia efectiva acumulada, sin límite de nivel. Cada nivel añade +5% de daño, casco, blindaje y escudos, además de 0,1 de regeneración diaria de casco y blindaje."
 eep_evolution_report:0 "Nivel de evolución de la nave nodriza: [Root.eep_mothership_level]; materia hasta el siguiente nivel: [Root.eep_mothership_next]. Cada nivel añade +5% de daño, casco, blindaje y escudos. Un nivel por cada 10 de materia, sin límite de nivel.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "Desmantelar planeta"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "Preparando para desmantelar $PLANET|Y$"
 EEP_ADAPTIVE_SHIELD_CORE:0 "Núcleo de escudos adaptable"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "Cada rango añade un 10% de escudos. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_shield_core:0 "Núcleo de escudos adaptable"
 EEP_ADAPTIVE_ARMOR_CORE:0 "Núcleo de blindaje adaptable"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "Cada rango añade un 10% de blindaje. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_armor_core:0 "Núcleo de blindaje adaptable"
 EEP_ADAPTIVE_HULL_CORE:0 "Núcleo de casco adaptable"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "Cada rango añade un 10% de casco. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_hull_core:0 "Núcleo de casco adaptable"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "Núcleo de potencia de fuego adaptable"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "Cada rango añade un 5% de daño de armas. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_damage_core:0 "Núcleo de potencia de fuego adaptable"
 EEP_ADAPTIVE_TRACKING_CORE:0 "Núcleo de seguimiento adaptable"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "Cada rango añade 3 puntos de seguimiento. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_tracking_core:0 "Núcleo de seguimiento adaptable"
 EEP_ADAPTIVE_REGEN_CORE:0 "Núcleo de regeneración adaptable"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "Cada rango añade 0,2 de regeneración diaria fija de casco y 0,2 de blindaje. Cada cinco niveles de evolución, uno de los seis núcleos se elige con la misma probabilidad y gana un rango permanente. Este núcleo no añade consumo de energía ni costes de mantenimiento."
 eep_adaptive_regen_core:0 "Núcleo de regeneración adaptable"
 eep_component_report:0 "\n\n§HRegistro de mejoras de núcleos§!\nCorrespondientes: [Root.eep_component_entitled]; otorgadas: [Root.eep_component_rewards]; pendientes: [Root.eep_component_pending]\nÚltimos rangos confirmados: escudos [Root.eep_component_shield_level] / blindaje [Root.eep_component_armor_level] / casco [Root.eep_component_hull_level] / potencia de fuego [Root.eep_component_damage_level] / seguimiento [Root.eep_component_tracking_level] / regeneración [Root.eep_component_regen_level].\nCada cinco niveles mejora al azar y de forma permanente uno de los seis núcleos. Si se acumulan muchas mejoras pendientes, se otorgan por lotes. Cuando la nave nodriza está destruida o no disponible, las mejoras se detienen y se conserva el historial. Este historial no representa componentes activos. Si no hay registro, se muestra 0."
 eep_mothership_section:0 "Núcleo de nave nodriza clase Veredicto"
 eep_mothership_section_1019:0 "Casco simbiótico clase Veredicto"
