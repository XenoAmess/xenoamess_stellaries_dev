l_french:
 origin_heart_of_devouring:0 "Cœur du Dévorement"
 origin_heart_of_devouring_desc:0 "Notre civilisation n'a jamais considéré les mondes comme des frontières. Ce sont des nourritures à dépouiller. La Reine Vivhite règne d'une volonté glaciale : les vies aliens et les planètes entières finiront par appartenir à l'unique trône."
 origin_heart_of_devouring_effects:0 "§YNécessite Nemesis. Doctrines d'extermination uniquement.§! Les nouvelles parties accordent immédiatement §RDevenir la Crise§!, en conservant l'éligibilité vanilla pour les ascensions d'espèces comme le psionique. La production du poste de Trône commence à §G+10%§!, plus §G10 points de pourcentage§! par niveau de crise Nemesis natif (20%–60% aux niveaux 1–5, synchronisés à la prochaine mise à jour mensuelle).\nCommencez avec une file de construction civile parallèle supplémentaire sur la planète mère et un vaisseau-mère équipé d'un cuirassé de classe Relique, d'un propulseur à saut fonctionnel, d'une propulsion à matière noire et de dix chantiers navals mobiles. Les Essaims mentaux, les Intelligences artificielles et autres autorités reçoivent respectivement une planète mère de type Ruche, Machine ou Relique, sans colonie supplémentaire. Le vaisseau-mère gagne un niveau non plafonné pour 10 unités de matière effective consommée ; chaque niveau ajoute +5% de dégâts, coque, blindage et boucliers. Son Rayon de Déconstruction Vorace démantèle les colonies ennemies en temps de guerre pour la planète mère sans armées.\nLa planète mère démarre avec §G+2§! de capacité en districts. Dévorez vos colonies naturelles détenues et renvoyez la population fondatrice éligible ; chaque palier cumulatif de §Y4§! de matière native ajoute §G1§! district sur la planète mère. Le démantèlement générique crée §G100§! de population par palier cumulatif de §Y6§! de matière ; les Terravores conservent les récompenses aléatoires natives. Une taille typique de 15–25 mondes prend 3–5 ans et les districts utilisent des postes normaux.\nLes décisions coloniales offrent l'audience de la Reine, la relocalisation de la planète mère, l'annulation du démantèlement, les commutateurs de dévoration automatique et la suppression d'exemption locale. La dévoration automatique est §Ydésactivée par défaut§! ; après relocalisation, l'ancienne planète mère peut également être dévorée automatiquement. Les sauvegardes existantes ne reçoivent aucune récompense de démarrage rétroactive ni voie de crise."
 eep_requires_exterminator:0 "Requiert Essaim Dévorant, Exterminateur Déterminé, Purificateurs Fanatiques ou un civique d'extermination par terre brûlée."
 decision_eep_devour:0 "Dévorer : Offrir à l'Unique Trône"
 decision_eep_devour_desc:0 "Vivhite ne reconnaît aucune revendication alien sur un monde. Laissez assez de population fondatrice pour le digérer, puis ramenez ses habitants, sa croûte et son cœur fondu à la maison."
 eep_devour_effect:0 "La digestion prend Q × 2,4 mois effectifs, arrondis au supérieur. L'achèvement renvoie la population fondatrice admissible et détruit définitivement le monde ou le corps artificiel d'origine. La capacité augmente par tranche cumulée de 4 Q ; le démantèlement ordinaire crée 100 de population par tranche cumulée de 6 Q, avec report des restes entre mondes. Les Terravores conservent les récompenses aléatoires d'origine. La perte du noyau ou le combat suspend la progression ; le règlement final attend la fin de la purge."
 eep_source_required:0 "Requiert une colonie admissible, paisible et nous appartenant, hors noyau, ainsi qu'un monde natal sous notre contrôle. Les mondes naturels, ruches et machines, les habitats, les mondes annulaires et le Tour synaptique sont admis. Les arches et la spécialisation de monde nanotechnologique restent exclus."
 eep_seed_required:0 "La source doit compter au moins 100 de population fondatrice hors purge, ou le cœur doit disposer de plus de 100 pour combler le déficit. Ne relogez jamais la dernière population du cœur. Les travailleurs de digestion ne sont pas créés gratuitement."
 eep_material_required:0 "Matière native intacte requise."
 decision_eep_audience:0 "Audience avec la Reine Vivhite"
 decision_eep_audience_desc:0 "Entrez dans la cour du Cœur du Dévorement. Vivhite juge la matière ramenée à son trône et le prochain monde marqué pour la destruction."
 eep_audience_effect:0 "Lisez le cœur lié, la matière cumulée, la fabrication de population, les tâches actives et le statut d'ascension réel. Ce rapport n'accorde aucune récompense."
 eep_capacity:0 "Cœur du Dévorement : Matière Mondiale Cumulée"
 eep_capacity_desc:0 "La matière dévorée devient une capacité de district constructible réelle sans modifier la taille originale de la planète."
 d_eep_core:0 "Cœur du Dévorement : Trône de Vivhite"
 d_eep_core_desc:0 "La volonté de la Reine converge ici. Les bonus du Trône et la capacité cumulée de districts peuvent suivre une décision de relocalisation du monde originel. Les bonus de la Cour ne s'appliquent que tant que nous contrôlons le monde originel lié ; le perdre ne désigne jamais automatiquement un trône de remplacement."
 situation_eep_devouring:0 "Dévoration d’un monde"
 situation_eep_devouring_type:0 "Cœur du Dévorement : Digestion Planétaire"
 situation_eep_devouring_desc:0 "Aucune vie ne mérite d'être préservée. Aucune croûte ne mérite d'être gaspillée. Ce monde deviendra partie de l'unique planète d'origine."
 situation_eep_devouring_monthly_change_tooltip:0 "Gagnez 1 progression par mois effectif. La perte du cœur, l'occupation ou le combat au sol suspend la progression. Le règlement final attend que toute la purge standard se termine."
 eep_digesting:0 "Dépouiller le Monde"
 eep_digesting_desc:0 "Réduisez chaque but de ce monde à nourrir le trône."
 eep_devour_approach:0 "Obéir à la Reine"
 eep_devour_approach_desc:0 "Continuer la digestion jusqu'à ce que le monde se brise."
 eep_cancel_approach:0 "Suspendre la Digestion"
 eep_cancel_approach_desc:0 "Annule le démantèlement de ce monde et l'exempte des redémarrages automatiques. Les coûts déjà engagés pour la relocalisation des graines et ceux des Dévoreterres natifs ne sont pas remboursés, et aucune récompense n'est accordée. Une décision de reprise ou un lancement manuel réussi lève l'exemption."
 eep_monthly_ready:0 "Trône et colonie de digestion disponibles"
 eep_block_core:0 "Trône déconnecté : le cœur lié est hors de notre contrôle. La progression et le règlement sont suspendus jusqu'à la reprise de ce même monde."
 eep_block_combat:0 "La colonie de digestion est occupée ou en combat au sol. La progression est suspendue."
 eep_block_purge:0 "Digestion terminée. En attente de la fin de la purge standard ; pas de destruction prématurée de population ni de consommation répétée."
 mod_situation_eep_devouring_max_progress_add:0 "Mois de Digestion Requis"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "L'Unique Trône"
 eep.10.desc:0 "Vivhite se tient dans la cour d'obsidienne, contemplant la carte stellaire.\n\nDes frontières ? Sa voix ne porte aucune chaleur. Je ne trace pas de frontières autour de la nourriture.\n\nIl n'y a aucune promesse aux aliens, aucune pitié et aucune retraite. Tout doit nourrir ce cœur. Les mondes conquis livreront leurs vies, leur croûte et leur cœur. La Reine n'en regrettera rien."
 eep.10.a:0 "Au-delà du trône, tout peut être dévoré."
 eep.11.name:0 "Les Cendres d'un Monde"
 eep.11.desc:0 "La dernière croûte se détache. Les océans et les villes ont perdu leurs noms ; seule la quantité restituée au cœur demeure.\n\nVivhite parcourt le rapport sans plaisir. Suivant.\n\nMondes consumés : [Root.eep_worlds] ; matière native cumulée : [Root.eep_c] ; capacité ajoutée au cœur : [Root.eep_d] ; population fabriquée par démontage générique : [Root.eep_made]. Ces chiffres soldent la colonisation. Ce message n'accorde aucune récompense supplémentaire.\n\nCour : [Root.GetEEPCourtStage]. Dernier monde : capacité ajoutée [Root.eep_last_capacity] ; population fondatrice restituée [Root.eep_last_return] ; fabrication générique [Root.eep_last_manufactured]."
 eep.11.a:0 "Que les cendres nourrissent le cœur."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "L'horizon du cœur s'étend à nouveau. De nouveaux districts soutiennent logements et emplois réels ; les usines, chambres de ruche et centres neuronaux continuent de fonctionner.\n\nVivhite balaie d'un geste un territoire alien de la carte stellaire. Leur sol ancestral n'est que notre prochaine fondation.\n\nMatière cumulée : [Root.eep_c] ; capacité supplémentaire totale : [Root.eep_d] ; population fabriquée : [Root.eep_made]. La Reine enregistre une nouvelle étape de croissance sans seconde récompense économique."
 eep.13.a:0 "Qu'ils deviennent la fondation."
 eep.30.name:0 "Une Volonté Irrésistible"
 eep.30.desc:0 "Notre ascension psionique légitime est achevée. La conscience de la cour traverse le cœur ; la coordination psionique et les emplois normaux soutiennent son cœur grandissant.\n\nVivhite considère les échos aliens dans le Voile comme des résidus sans valeur. Il n'est pas besoin de les comprendre. Seulement de les soumettre à la fin.\n\nCe moment enregistre l'ascension standard déjà obtenue. Il n'accorde aucune population, capacité ou éligibilité d'ascension supplémentaire."
 eep.30.a:0 "La volonté est loi."
 eep.31.name:0 "Étoiles Forgées en Lames"
 eep.31.desc:0 "Notre progression de crise a débloqué les vaisseaux minéraux. Les minéraux dévorés nourrissent la flotte tandis que les alliages soutiennent la construction du cœur ; la guerre ferme les deux boucles de production.\n\nVivhite regarde la flotte passer au-dessus. Les pertes peuvent être remplacées. L'hésitation est interdite.\n\nLa disponibilité des vaisseaux, les coûts et les étapes ultérieures suivent les règles standard. La Reine ne contourne aucune exigence de DLC, d'ascension ou de projet spécial."
 eep.31.a:0 "Pointez la lame vers le prochain monde."
 eep.40.name:0 "Trône Déconnecté"
 eep.40.desc:0 "Le contrôle du cœur lié a été interrompu. La digestion s'arrête et les récompenses non réglées restent scellées.\n\nL'ordre de Vivhite est froid et direct. Reprenez-le. Le coût importe peu.\n\nReprendre le même cœur reprend les tâches. Déplacer la capitale ne peut créer un second cœur."
 eep.40.a:0 "Reprenez le trône à tout prix."
 eep.41.name:0 "Le Trône Restauré"
 eep.41.desc:0 "La planète d'origine est à nouveau sous notre contrôle. Les colonies de digestion survivantes reprennent leur progression ; chaque tâche en attente se règle une fois selon son propre reçu.\n\nVivhite ne célèbre pas. Continuez. Faites-les payer ce retard avec tout ce qu'ils ont."
 eep.41.a:0 "Continuez à dévorer."
 eep.42.name:0 "Le Cœur S'Arrête"
 eep.42.desc:0 "La planète d'origine n'est plus une colonie utilisable. Le Cœur du Dévorement n'a pas de trône de remplacement.\n\nLes tâches inachevées prennent fin. Pas de reliaison de capitale, de capacité copiée ou de population de remplacement. Les colonies survivantes continuent selon les règles standard. Le dernier ordre de la Reine ne laisse toujours aucune place à la pitié."
 eep.42.a:0 "Souvenez-vous de l'unique cœur."
 eep.100.name:0 "Reine Vivhite : Grand Livre de la Cour"
 eep.100.desc:0 "Je ne compte que ce qui est revenu au trône.\n\nNoyau lié : [eep_report_core.GetName] ; cour : [Root.GetEEPCourtStage]\nMatière C : [Root.eep_c] ; reliquat de capacité : [Root.eep_c_remainder]/4\nMatière générique G : [Root.eep_g] ; reliquat de population : [Root.eep_g_remainder]/6\nCapacité ajoutée totale D : [Root.eep_d] ; districts réellement libres : [eep_report_core.eep_free_districts]\nPopulation actuelle du noyau : [eep_report_core.eep_actual_pop] ; historiquement produite : [Root.eep_made]\nMondes consommés : [Root.eep_worlds] ; tâches actives : [Root.eep_tasks] ; règlements finaux en attente : [Root.eep_waiting]\nDernier monde : capacité ajoutée [Root.eep_last_capacity], population renvoyée [Root.eep_last_return], produite [Root.eep_last_manufactured]\nStatut du trône : [Root.eep_core_state] (0 disponible, 1 déconnecté, 2 terminé définitivement)\nAscension psionique légitime achevée : [Root.eep_psi] (0 non, 1 oui)\nNiveau de Crise Nemesis réel : [Root.eep_crisis] (2 corvettes, 3 destroyers, 4 croiseurs)\n\nRapport en lecture seule. Districts, logements, postes et entretien requièrent une gestion normale.\n\n$eep_evolution_report$"
 eep.100.a:0 "Congédié."
 eep.100.tasks:0 "Présentez les registres de digestion."
 eep.101.name:0 "Colonie de Digestion : [eep_report_source.GetName]"
 eep.101.desc:0 "La destruction n'est pas une excuse. Rendez compte de votre avancement.\n\nSource : [eep_report_source.GetName]\nVoie : [eep_report_source.GetEEPTaskPath]\nMatière gelée Q : [eep_report_source.eep_q]\nAvancement réel : [eep_report_source.eep_progress]/[eep_report_source.eep_months] mois effectifs\nBlocage : [eep_report_source.eep_block_state] (0 normal, 1 trône déconnecté, 2 combat ou occupation, 3 purge finale)\n\nModifiez l'approche dans l'interface de situation. Annulation ou perte de propriété n'accorde aucune récompense d'achèvement."
 eep_stage_0:0 "Trône Établi"
 eep_stage_1:0 "Couronne des Mondes Brisés"
 eep_stage_2:0 "Les Étoiles Reviennent au Cœur"
 eep_stage_3:0 "Cour des Mille Mondres"
 eep_path_native:0 "Terravore : consommation aléatoire vania"
 eep_path_generic:0 "Démantèlement générique : population issue de la matière cumulée"
 eep.32.name:0 "La prochaine lame de la Cour"
 eep.32.desc:0 "Vivhite examine la coque nouvellement déverrouillée. Leur résistance doit finir plus vite que celle du dernier monde.\n\nÉtape de Némésis actuelle : [Root.eep_crisis]. L'étape 3 déverrouille $crisis_destroyer$ ; l'étape 4 déverrouille $crisis_cruiser$. Coques, équipement et entretien restent vania. Ce message n'accorde aucune capacité ni récompense."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "Le trône de la Reine augmente la production des postes de la planète natale : +10% de base, plus 10 points de pourcentage par niveau de crise Nemesis natif. Les niveaux 1–5 donnent 20% / 30% / 40% / 50% / 60%, synchronisés lors de la prochaine mise à jour mensuelle. Le bonus suit le trône. Les sauvegardes existantes sans cette crise conservent les 10% de base."
 decision_eep_digest_report:0 "Consulter la Chronique de la Dévoration"
 decision_eep_digest_report_desc:0 "Présentez la progression de dépouillement de cette planète. Vivhite ne se soucie que de la valeur qui n'a pas encore atteint son trône."
 eep_digest_report_effect:0 "Consultez la progression de dévoration de cette planète, les raisons de pause et le règlement en attente. Le rapport n'accorde aucune récompense."
 decision_eep_auto_devour_enable:0 "Activer la Dévoration automatique à l'échelle de l'empire"
 decision_eep_auto_devour_enable_desc:0 "La Reine ordonne que chaque colonie éligible, à l'exception de la planète mère liée, soit dévorée. Les colonies nouvellement acquises obéiront également à cet ordre."
 eep_auto_devour_enable_effect:0 "Activez le commutateur à l'échelle de l'empire. Chaque mois, commencez à dévorer les mondes possédés éligibles autres que la planète mère liée, sous réserve des exigences de germe fondateur, de paix et de propriété du noyau. Désactivé par défaut ; les mégastructures et autres objets non éligibles sont ignorés."
 decision_eep_auto_devour_disable:0 "Désactiver la Dévoration automatique à l'échelle de l'empire"
 decision_eep_auto_devour_disable_desc:0 "Suspendre l'ordre d'expansion du trône. Choisissez vous-même le sort de chaque monde."
 eep_auto_devour_disable_effect:0 "Désactive le lancement automatique de nouvelles tâches dans tout l'empire. Les tâches de dévoration en cours se poursuivent ; annulez-en une via la décision de démantèlement de son monde d'origine ou l'approche de sa situation."
 eep_parallel_construction:0 "Cœur de la Dévoration : Construction parallèle"
 eep_parallel_construction_desc:0 "La Reine commande un projet de construction civil supplémentaire mené en parallèle sur la planète natale actuellement liée tant qu'elle reste sous notre contrôle. Ce bonus suit le trône."
 eep_mothership:0 "Vaisseau-mère de Dévastation de Vivhite"
 eep_mothership_desc:0 "Armes, défenses et technologie centrale de cuirassé de classe Relique, avec un propulseur à saut fonctionnel, une propulsion à matière noire et dix chantiers navals mobiles. Gagne un niveau d'évolution non plafonné pour 10 unités de matière consommée. Les valeurs réelles dépendent des modificateurs d'empire."
 NAME_EEP_Baiqi_Mothership:0 "Le Verdict de Vivhite"
 NAME_EEP_Throne_World:0 "Tribut au Trône"
 eep_mothership_ship:0 "Vaisseau-mère Verdict"
 eep_mothership_ship_plural:0 "Vaisseaux-mères Verdict"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Déplacer le trône ici"
 decision_eep_migrate_core_desc:0 "La volonté de Vivhite n'est pas liée au sol. Établissez ce monde comme nouvelle planète natale et déplacez-y le trône ainsi que la capitale impériale."
 eep_migration_required:0 "La planète natale actuelle doit rester sous notre contrôle. La destination doit être une colonie possédée éligible, sans occupation ni combat terrestre, ni artificielle ni en cours de dévoration, et ne doit pas abriter un autre trône."
 eep_migration_effect:0 "Transférez ici la liaison de planète natale, la capitale impériale, le bonus d'emploi du trône, la capacité de districts accumulée et la file de construction parallèle supplémentaire accordée. Population, bâtiments, réserves et livres de dévoration sont préservés. Les autres tâches de démantèlement se poursuivent et versent leurs gains à la nouvelle planète natale. §RSi la dévoration automatique à l'échelle de l'empire est activée, l'ancienne planète natale peut ensuite être démantelée automatiquement.§!"
 decision_eep_cancel_devour:0 "Annuler le démantèlement de ce monde"
 decision_eep_cancel_devour_desc:0 "Retire l'ordre de démanteler ce monde. La Reine autorise un commandement modifié, mais n'effacera pas les coûts déjà engagés."
 eep_cancel_devour_effect:0 "Interrompt immédiatement la situation de dévoration de ce monde et lève les verrous de démantèlement de ce Mod, sans accorder de récompense. Les graines fondatrices déjà relocalisées et les dégâts des Dévoreterres natifs demeurent. Exempte ce monde de la dévoration automatique afin d'empêcher un redémarrage le mois prochain ; une décision de reprise ou un démarrage manuel réussi lève l'exemption. Les autres tâches et le commutateur impérial sont conservés."
 decision_eep_resume_auto_devour:0 "Reprendre la dévoration automatique ici"
 decision_eep_resume_auto_devour_desc:0 "Lève le sursis temporaire de ce monde et le replace sous le commandement de dévoration de l'empire."
 eep_resume_auto_devour_effect:0 "Lève uniquement l'exemption de dévoration automatique de ce monde. Si la dévoration automatique de l'empire est activée, le prochain balayage mensuel tente un démarrage normal ; sinon, un démarrage manuel reste requis."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Rayon de Déconstruction Vorace"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Démantèle sans armées une colonie naturelle ou artificielle pour le monde natal, y compris les habitats, les mondes annulaires et le Tour synaptique. Cible les colonies possédées hors noyau ou ennemies en temps de guerre. Le tir achevé accorde capacité, population et croissance du vaisseau-mère selon la taille effective. Le démantèlement ordinaire crée 100 de population fondatrice par 6 de matière ; les Terravores conservent leurs récompenses aléatoires. Les tirs annulés n'accordent rien."
 eep_colossus_target_required:0 "Requiert votre vaisseau-mère, un monde natal disponible et une colonie possédée hors noyau ou ennemie en temps de guerre, avec plus de 0 de matière effective. Les corps artificiels fixes sont admis. Sont exclus les noyaux de tous les empires, arches, mondes nanotechnologiques, colonisations en cours, batailles terrestres, dévorations actives et cibles déjà comptabilisées."
 eep_mothership_evolution:0 "Symbiose Dévorante : Évolution Illimitée"
 eep_mothership_evolution_desc:0 "Gagne un niveau d'évolution par tranche de 10 unités de matière effective accumulées, sans plafond de niveau. Chaque niveau ajoute +5% aux dégâts, à la coque, à la blindage et aux boucliers, ainsi que +0,1 de régénération quotidienne de coque et de blindage."
 eep_evolution_report:0 "Niveau d'évolution de la Matriarche : [Root.eep_mothership_level] ; matière nécessaire pour le niveau suivant : [Root.eep_mothership_next]. Chaque niveau ajoute +5% aux dégâts, à la coque, au blindage et aux boucliers. Un niveau par tranche de 10 unités de matière, sans plafond.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "Démanteler la planète"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "Préparation du démantèlement de $PLANET|Y$"
 EEP_ADAPTIVE_SHIELD_CORE:0 "Noyau de bouclier adaptatif"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "Chaque rang ajoute 10% de boucliers. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_shield_core:0 "Noyau de bouclier adaptatif"
 EEP_ADAPTIVE_ARMOR_CORE:0 "Noyau de blindage adaptatif"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "Chaque rang ajoute 10% de blindage. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_armor_core:0 "Noyau de blindage adaptatif"
 EEP_ADAPTIVE_HULL_CORE:0 "Noyau de coque adaptatif"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "Chaque rang ajoute 10% de coque. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_hull_core:0 "Noyau de coque adaptatif"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "Noyau de puissance de feu adaptatif"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "Chaque rang ajoute 5% de dégâts d'armes. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_damage_core:0 "Noyau de puissance de feu adaptatif"
 EEP_ADAPTIVE_TRACKING_CORE:0 "Noyau de poursuite adaptatif"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "Chaque rang ajoute 3 points de poursuite. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_tracking_core:0 "Noyau de poursuite adaptatif"
 EEP_ADAPTIVE_REGEN_CORE:0 "Noyau de régénération adaptatif"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "Chaque rang ajoute 0,2 de régénération quotidienne fixe de coque et 0,2 de blindage. Tous les cinq niveaux d'évolution, l'un des six noyaux est choisi avec la même probabilité et gagne définitivement un rang. Ce noyau n'ajoute aucun coût d'énergie ni d'entretien."
 eep_adaptive_regen_core:0 "Noyau de régénération adaptatif"
 eep_component_report:0 "\n\n§HRegistre des améliorations de noyaux§!\nDues : [Root.eep_component_entitled] ; accordées : [Root.eep_component_rewards] ; en attente : [Root.eep_component_pending]\nDerniers rangs confirmés : boucliers [Root.eep_component_shield_level] / blindage [Root.eep_component_armor_level] / coque [Root.eep_component_hull_level] / puissance de feu [Root.eep_component_damage_level] / poursuite [Root.eep_component_tracking_level] / régénération [Root.eep_component_regen_level].\nTous les cinq niveaux, l'un des six noyaux est amélioré au hasard de façon permanente. Les améliorations dues en grand nombre sont accordées par lots. Si le vaisseau-mère est détruit ou indisponible, les améliorations cessent et l'historique est conservé ; celui-ci ne représente pas des composants actifs. Sans relevé, 0 est affiché."
