l_japanese:
 origin_heart_of_devouring:0 "吞噬の心臓"
 origin_heart_of_devouring_desc:0 "我が文明は世界を境界と見なしたことはなかった。それらはまだ皮を剥がされるべき食物にすぎない。女王ヴィヴィトは冷徹な意志で君臨する。異族の命と惑星そのもの、やがてすべてが唯一なる玉座に帰属する。"
 origin_heart_of_devouring_effects:0 "§YNemesisが必要です。絶滅の国是限定。§!新規ゲームは即座に§R天災への成り上がり§!を獲得し、霊能などの種族昇格に関するバニラ資格を保持します。王座ジョブの出力は§G+10%§!から始まり、Nemesis天災段階ごとに§G10パーセントポイント§!加算されます（段階1～5で20%～60%、次回月次更新で同期）。\n母星に追加の並列民生建造キューを1つ支給し、遺物級弩級戦艦装備、有効なジャンプドライブ、暗物質推進、10隻の機動造船所を備えた母艦を獲得します。巣心知性、機械知性、その他の政体はそれぞれ巣心世界、機械世界、遺物世界を母星として獲得し、追加の植民地は付与されません。母艦は実効物質10ごとに上限なしでレベルが上がり、各レベルでダメージ、艦体、装甲、シールドが+5%します。その貪欲解構ビームは、地上軍なしで戦時敵国の植民地を母星のために解体します。\n母星は§G+2§!の区画容量から始まります。領有する自然植民地を貪食し、該当する建国者人口を帰還させます。累計§Y4§!の原生物質ごとに母星区画を§G1§!追加します。一般解体は累計§Y6§!の物質ごとに§G100§!の人口を生成します。テラヴォアは元のランダム報酬を保持します。典型的な規模15～25の世界は3～5年を要し、区画は通常ジョブを使用します。\n植民地運営に関する決定は女王への謁見、母星移転、解体キャンセル、自動貪食の切り替え、現地免除解除を提供します。自動貪食は§Yデフォルトで無効§!です。移転後、旧母星も自動的に貪食される可能性があります。既存のセーブデータには遡及的な開始報酬や天災経路は付与されません。"
 eep_requires_exterminator:0 "貪食群 Swarm、確執抹殺者、狂信浄化者、または焦土絶滅国策が必要。"
 decision_eep_devour:0 "貪食：唯一なる玉座へ捧ぐ"
 decision_eep_devour_desc:0 "ヴィヴィトは異族のいかなる領有主張も認めぬ。消化に十分な始祖人口を残し、その住人と地殻、溶融核を順次母星へ持ち帰れ。"
 eep_devour_effect:0 "消化には Q × 2.4 の有効月を要し、切り上げて算出する。完了時に適格な始祖人口を戻し、供給元の惑星または人工天体を永久に破壊する。容量は累計Q4ごとに増加し、通常解体は累計Q6ごとに人口100を生成する。余剰は世界間で持ち越す。テラヴォアは元のランダム消費報酬を保持する。コアの喪失または戦闘は進行を停止し、最終精算は浄化の終了を待つ。"
 eep_source_required:0 "自国の管理下にある母星と、平穏な自国所有の適格な非コア植民地が必要。天然惑星、ハイヴ惑星、機械惑星に加え、軌道上居住地、リングワールド、シナプスの旋盤などの固定人工天体も対象。アークおよびナノテク惑星の指定は対象外。"
 eep_seed_required:0 "源星には非粛清の創始者人口が少なくとも100名必要である、もしくは母星側が不足分を供給する必要がある。母星の最後の人口を移住させてはならない。消化作業員はただでは生成されない。"
 eep_material_required:0 "無損傷の原生物質が必要。"
 decision_eep_audience:0 "女王ヴィヴィトへの謁見"
 decision_eep_audience_desc:0 "貪食の心臓の王庭に入る。ヴィヴィトが審問するのは、玉座へ還された物質と、次に破壊すべき世界である。"
 eep_audience_effect:0 "紐付けられた核、累計物質、人口製造、稼働中タスク、実際の飛昇状態を閲覧する。本報告は何ら報酬を授与しない。"
 eep_capacity:0 "貪食の心臓：蓄積された星壌"
 eep_capacity_desc:0 "貪食された物質は、惑星の原寸を変えることなく、真に建設可能な区画容量となる。"
 d_eep_core:0 "貪食の心臓：ヴィヴィトの玉座"
 d_eep_core_desc:0 "女王の意志がここに集う。王座の補正と蓄積された区画容量は、決議によって母星と共に移転できる。王宮の補正は、結びつけられた母星を自国が支配している間のみ有効である。母星を失っても、代替の王座が自動的に選ばれることはない。"
 situation_eep_devouring:0 "天体の貪食"
 situation_eep_devouring_type:0 "貪食の心臓：惑星消化"
 situation_eep_devouring_desc:0 "保存されるべき命はない。浪費されるべき地殻もない。この天体 は唯一無二の母星の一部となる。"
 situation_eep_devouring_monthly_change_tooltip:0 "有効月ごとに進行度1を獲得。核の喪失、占領または地上戦闘は進行を停止する。完了時、粛清が継続中であれば最終決済は待機する。"
 eep_digesting:0 "世界を剥ぐ"
 eep_digesting_desc:0 "この世界のあらゆる用途を、玉座への養分に帰結させる。"
 eep_devour_approach:0 "女王に従う"
 eep_devour_approach_desc:0 "世界が砕け散るまで消化を継続する。"
 eep_cancel_approach:0 "消化を停止"
 eep_cancel_approach_desc:0 "この惑星の解体中止と自動再開からの除外。既に行われた種子の移住および在来テラヴォアのコストは返還されず、報酬も付与されません。再開決議または手動での開始が成功すれば、除外は解除されます。"
 eep_monthly_ready:0 "玉座と消化コロニーが稼働可能"
 eep_block_core:0 "玉座が切断された：紐付けられた核が自国支配下にない。進行と決済は停止し、同一世界の奪還まで再開されない。"
 eep_block_combat:0 "消化コロニーが占領中または地上戦闘中。進行は停止する。"
 eep_block_purge:0 "物質の消化は完了した。バニラ粛清の終了を待機する。早期の人口抹消や反復消費は行わない。"
 mod_situation_eep_devouring_max_progress_add:0 "必要消化月数"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "唯一なる玉座"
 eep.10.desc:0 "ヴィヴィトは黒曜石の王庭に立ち、星図を俯瞰する。\n\n『境界？』その声には温もりがない。『食物に境界など引かん。』\n\n異族への約束も、慈悲も、退路もない。すべてはこの心臓の養分となるべきだ。征服された世界はその命と地殻、核を差し出すだろう。女王はそのいずれにも悔いることはない。"
 eep.10.a:0 "玉座の彼方、すべては貪り得られん。"
 eep.11.name:0 "一つの世界の灰"
 eep.11.desc:0 "最後の地殻が剥がれ落ちる。海も都市も名を持たず、母星へ還った分量だけが残る。\n\n白绮は一瞥する、愉悦の色もなく。『次。』\n\n吞噬した世界：[Root.eep_worlds]；累計原生物質：[Root.eep_c]；母星の追加容量：[Root.eep_d]；汎用解体が製造した人口：[Root.eep_made]。これらは完了した決算の記録であり、本通報に追加の褒賞は付与されない。\n\n王庭：[Root.GetEEPCourtStage]。直近の世界：追加容量 [Root.eep_last_capacity]；還ってきた創始者人口 [Root.eep_last_return]；汎用製造 [Root.eep_last_manufactured]。"
 eep.11.a:0 "灰よ、心臓の養分となれ。"
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "核の地平が再び広がる。新区画は真の居住と職業を支え、工場、巣室、神経中枢は稼働を続ける。\n\nヴィヴィトは星図から異族の領域を払いのける。『彼らの祖先の土壌など、我らの次なる基礎にすぎぬ。』\n\n累計物質：[Root.eep_c]；追加容量の合計：[Root.eep_d]；製造済み人口：[Root.eep_made]。女王は新たな成長段階を記録するが、追加の経済報酬は付与しない。"
 eep.13.a:0 "彼らを基礎とせよ。"
 eep.30.name:0 "抗いがたい意志"
 eep.30.desc:0 "正規のPSI飛昇が完了した。王庭の意識は核を貫き、PSI協調と通常職業とが膨張し続けるこの心臓を支える。\n\nヴィヴィトはシュラウドに響く異族の残響を無価値な渣と見る。『理解は不要。ただ終局へ従わせるのみ。』\n\nこの瞬間はすでに達成されたバニラ飛昇を記録する。追加の人口、容量、飛昇資格は付与されない。"
 eep.30.a:0 "意志は律法なり。"
 eep.31.name:0 "星々は刃へと鍛えられる"
 eep.31.desc:0 "天災進行により鉱物艦が実際に解放された。貪食された鉱物は艦隊へ流れ、合金は核の建設を支える。二つの生産連鎖は戦争の中で閉合する。\n\nヴィヴィトは頭上を通過する艦隊を見上げる。『損失は補い得る。躊躇は許されぬ。』\n\n艦の可用性、コスト、後続段階はバニラ規則に従う。女王はDLC、飛昇、特別計画の要件を一切迂回しない。"
 eep.31.a:0 "刃を次の星へ向けよ。"
 eep.40.name:0 "玉座の切断"
 eep.40.desc:0 "紐付けられた核の支配が中断された。消化は停止し、未決済の報酬は封印されたままだ。\n\nヴィヴィトの命令は冷徹で直接だ。『奪還せよ。代価は考慮せぬ。』\n\n同一核を奪還すれば任務は再開される。首都の移動は第二の心臓を生み出さない。"
 eep.40.a:0 "不惜代価、玉座を奪還せよ。"
 eep.41.name:0 "玉座の回帰"
 eep.41.desc:0 "原始母星が再び自国支配下に戻った。存続する消化コロニーは進行を再開し、待機中の任務はそれぞれの証憑に基づき一度だけ決済される。\n\nヴィヴィトは祝わない。『続けよ。この遅延の代償を、そのすべてで支払わせよ。』"
 eep.41.a:0 "貪食を続行せよ。"
 eep.42.name:0 "心臓の停止"
 eep.42.desc:0 "原始母星はもはや利用可能な植民地ではない。貪食の心臓には予備の玉座がない。\n\n未完了の任務は終了する。首都の再紐付け、容量の複製、人口の補填は行われない。存続する植民地はバニラ規則で経営を続ける。女王の最後の命令にも、慈悲の余地はない。"
 eep.42.a:0 "唯一なる心臓を銘記せよ。"
 eep.100.name:0 "女王ヴィヴィト：王庭帳簿"
 eep.100.desc:0 "私は玉座に還ったものだけを数える。\n\n紐づけられた母星：[eep_report_core.GetName]；王庭：[Root.GetEEPCourtStage]\n物質C：[Root.eep_c]；容量余剰：[Root.eep_c_remainder]/4\n一般物質G：[Root.eep_g]；人口余剰：[Root.eep_g_remainder]/6\n追加総容量D：[Root.eep_d]；実際の空き区画：[eep_report_core.eep_free_districts]\n現在の母星人口：[eep_report_core.eep_actual_pop]；これまでの製造数：[Root.eep_made]\n貪食済みの世界：[Root.eep_worlds]；進行中の任務：[Root.eep_tasks]；最終未決済：[Root.eep_waiting]\n直近の世界：追加容量 [Root.eep_last_capacity]、帰還人口 [Root.eep_last_return]、製造数 [Root.eep_last_manufactured]\n王座状態：[Root.eep_core_state]（0 利用可能、1 接続断絶、2 永久終結）\n合法的な霊能昇格完了：[Root.eep_psi]（0 いいえ、1 はい）\n実際のNemesis段階：[Root.eep_crisis]（2 コルベット、3 駆逐艦、4 巡洋艦）\n\n報告は読み取り専用です。区画、住宅、ジョブ、維持費は通常の管理が必要です。\n\n$eep_evolution_report$"
 eep.100.a:0 "下がれ。"
 eep.100.tasks:0 "消化コロニーの記録を呈上せよ。"
 eep.101.name:0 "消化コロニー：[eep_report_source.GetName]"
 eep.101.desc:0 "破壊は口実とはならぬ。進捗を報告せよ。\n\n源星：[eep_report_source.GetName]\n経路：[eep_report_source.GetEEPTaskPath]\n凍結物質 Q：[eep_report_source.eep_q]\n実際の進捗：[eep_report_source.eep_progress]/[eep_report_source.eep_months] 有効月\n阻害要因：[eep_report_source.eep_block_state]（0 通常、1 玉座失聯、2 戦闘または占領、3 最終粛清）\n\n情勢画面にて方針を変更せよ。中止あるいは所有権喪失には完成報酬が与えられない。"
 eep_stage_0:0 "玉座樹立"
 eep_stage_1:0 "砕けた星々の冠"
 eep_stage_2:0 "星々は心臓へ帰る"
 eep_stage_3:0 "無数の世界の廷"
 eep_path_native:0 "テラヴォア：バニラランダム消費"
 eep_path_generic:0 "汎用解体：累計物質からの人口生成"
 eep.32.name:0 "廷の次の刃"
 eep.32.desc:0 "ヴィヴァイトは新たに解放された船体を調べる。『彼らの抵抗は、前の世界よりも早く終わらせねばならない。』\n\n実際のネメシス段階：[Root.eep_crisis]。段階 3 で $crisis_destroyer$ が解放され、段階 4 で $crisis_cruiser$ が解放される。船体、艤装、維持費はバニラのままだ。このメッセージは何の能力や報酬も付与しない。"
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "女王の玉座は母星のジョブ出力を増加：基本+10％、ネイティブNemesis天災レベルごとに+10パーセンテージポイント。レベル1～5はそれぞれ20%／30%／40%／50%／60%、翌月更新で同期。ボーナスは玉座と共に移動。天災を持たない既存セーブは基本10%を維持。"
 decision_eep_digest_report:0 "捕食の年代記を読む"
 decision_eep_digest_report_desc:0 "この世界の剥離進捗を報告せよ。ヴィヴァイトは玉座に届いていない価値のみに関心を持つ。"
 eep_digest_report_effect:0 "この世界の捕食進捗、停止理由、保留中の決済を表示する。報告は報酬を付与しない。"
 decision_eep_auto_devour_enable:0 "帝国全体の自動捕食を有効化"
 decision_eep_auto_devour_enable_desc:0 "女王の命令：縛られた母星を除き、帝国のすべての資格あるコロニーを捕食する。新しく獲得したコロニーもこの命令に従う。"
 eep_auto_devour_enable_effect:0 "帝国全体のスイッチを有効化。毎月、縛られた母星以外の所有する資格ある世界の捕食を開始し、始祖シード、平和、中核所有の要件に従う。デフォルトでは無効；メガストラクチャや他の資格のない対象はスキップされる。"
 decision_eep_auto_devour_disable:0 "帝国全体の自動捕食を無効化"
 decision_eep_auto_devour_disable_desc:0 "王座の拡張命令を保留し、各星球の運命はあなた自身が決定する。"
 eep_auto_devour_disable_effect:0 "帝国内での新規任務の自動開始を無効化します。既進行中の捕食は継続されます。中止するには、対象惑星の解体決定、または各状況の当該アプローチから取り消してください。"
 eep_parallel_construction:0 "貪食の心：並行建設"
 eep_parallel_construction_desc:0 "女王陛下の命により、束縛された母星上では同時に一基の民生建造項目が追加で進行する。この恩恵は王座に従う。"
 eep_mothership:0 "白绮の毁灭母舰"
 eep_mothership_desc:0 "遺物級弩級戦艦の武器、防御、コア技術に加え、有効なジャンプドライブ、暗物質推進、10隻の機動造船所を備えます。10の物質消費ごとに上限なしで進化レベルが1つ上がります。実際の数値は帝国修正に依存します。"
 NAME_EEP_Baiqi_Mothership:0 "ヴィヴハイトの裁定"
 NAME_EEP_Throne_World:0 "玉座への貢物"
 eep_mothership_ship:0 "ヴェアディクト母艦"
 eep_mothership_ship_plural:0 "ヴェアディクト母艦"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "王座をここに移す"
 decision_eep_migrate_core_desc:0 "ヴィヴィトの意志は土に縛られない。この星を新たな母星と定め、王座と帝都を共に移そう。"
 eep_migration_required:0 "現在の母星は引き続き我が制御下になければならない。目的地は、自国の占拠する、占領されておらず地上戦が発生していない、人工天体でも貪られているわけでもない適格な植民地であり、他の王座を置いてはならない。"
 eep_migration_effect:0 "母星の縛り、帝都、王座の職務補正、蓄積された区画容量、授けられた追加の並行建造列をここへ移す。人口、建築物、在庫、貪食の台帳は維持される。他の解体作業は継続し、その成果は新母星へ届けられる。§R帝国内の自動貪食が有効化されている場合、旧母星は後に自動的に解体される可能性がある。§!"
 decision_eep_cancel_devour:0 "この惑星の解体を中止"
 decision_eep_cancel_devour_desc:0 "この惑星の解体命令を取り下げます。女王は命令の変更を許しますが、既に支払われた代価を抹消することはしません。"
 eep_cancel_devour_effect:0 "この惑星の捕食状況を直ちに中止し、本Modの解体ロックを解除します。報酬は付与されません。既に移送済みの始祖種子と在来テラヴォアの被害は維持されます。再来月の自動捕食を防ぐため、この惑星は自動捕食から除外されます。再開決議または手動での開始が成功すれば、除外は解除されます。他の任務および帝国全体スイッチは維持されます。"
 decision_eep_resume_auto_devour:0 "ここで自動捕食を再開"
 decision_eep_resume_auto_devour_desc:0 "この惑星の一時的な猶予を取り消し、帝国の捕食命令に従わせます。"
 eep_resume_auto_devour_effect:0 "この惑星のみの自動捕食除外を解除します。帝国全体の自動捕食が有効な場合、次の月次スキャンで通常通り開始を試みます。無効の場合は手動での開始が必要です。"
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "貪欲解構ビーム"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "天然または人工の植民天体を地上軍なしで解体し、母星に捧げる。軌道上居住地、リングワールド、シナプスの旋盤も対象。自国の非コア植民地または交戦中の敵国植民地に使用できる。発射完了時に実効規模に応じて容量、人口、母艦成長を精算する。通常解体は物質6ごとに始祖人口100を生成し、テラヴォアは元のランダム報酬を保持する。発射の中止は報酬を与えない。"
 eep_colossus_target_required:0 "自国の母艦、利用可能な母星、有効物質が0を超える自国の非コア植民地または交戦中の敵国植民地が必要。固定人工天体にも対応。いずれの帝国の母星コア、アーク、ナノテク惑星の指定、植民中、地上戦闘中、貪食中、精算済みの対象も攻撃できない。"
 eep_mothership_evolution:0 "貪食の共生：無限進化"
 eep_mothership_evolution_desc:0 "有効物質を10累積するごとに進化レベルを1獲得、上限なし。各レベルでダメージ・船体・装甲・シールドが+5%、船体と装甲の日常回復が+0.1増加。"
 eep_evolution_report:0 "母艦進化レベル：[Root.eep_mothership_level]；次レベルまでの物質：[Root.eep_mothership_next]。各レベルでダメージ・船体・装甲・シールドが+5%。10物質ごとに1レベル、上限なし。$eep_component_report$"
