 eep_component_report:0 "\n\n§Hコア強化記録§!\n獲得権利：[Root.eep_component_entitled]；付与済み：[Root.eep_component_rewards]；未付与：[Root.eep_component_pending]\n最後に確認されたランク：シールド [Root.eep_component_shield_level]／装甲 [Root.eep_component_armor_level]／船体 [Root.eep_component_hull_level]／火力 [Root.eep_component_damage_level]／追尾 [Root.eep_component_tracking_level]／再生 [Root.eep_component_regen_level]。\n5レベルごとに6種のコアから1種をランダムに永続強化する。大量の未付与分は分割して付与される。母艦が破壊された場合や利用できない間は強化を停止し、履歴を保存する。履歴は現在の装備を示すものではない。記録がない場合は0を表示する。"
