l_german:
 origin_heart_of_devouring:0 "Herz der Verschlingung"
 origin_heart_of_devouring_desc:0 "Unsere Zivilisation betrachtete Welten nie als Grenzen. Sie sind Nahrung, die noch zerlegt werden muss. Königin Vivhite herrscht mit eisigem Willen: Fremde Leben und ganze Planeten werden schließlich dem einzigen Thron gehören."
 origin_heart_of_devouring_effects:0 "§YErfordert Nemesis. Nur Auslöschungs-Staatselemente.§! Neue Spiele gewähren sofort §RZur Krise werden§!; die normalen Voraussetzungen für Speziesaufstiege wie Psionik bleiben bestehen. Der Thron erhöht den Arbeitsplatzertrag zunächst um §G10%§! und je Nemesis-Krisenstufe um weitere §G10 Prozentpunkte§! (20%–60% auf Stufe 1–5, spätestens beim nächsten Monatswechsel aktualisiert).\nZu Beginn erhält die Heimatwelt eine zusätzliche parallele zivile Bauwarteschlange und ein Mutterschiff mit Relikt-Dreadnought-Ausrüstung, funktionierendem Sprungantrieb, Dunkle-Materie-Antrieb und zehn mobilen Werften. Schwarmbewusstseine, Maschinenintelligenzen und andere Regierungsformen erhalten jeweils eine Schwarm-, Maschinen- oder Relikt-Heimatwelt, ohne zusätzliche Kolonie. Das Mutterschiff steigt je 10 verschlungene effektive Materie um eine Stufe ohne Obergrenze; jede Stufe gewährt +5% Schaden, Hülle, Panzerung und Schilde. Sein gefräßiger Dekonstruktionsstrahl zerlegt feindliche Kolonien im Krieg ohne Armeen zugunsten der Heimatwelt.\nDie Heimatwelt beginnt mit §G+2§! Distriktkapazität. Verschlingt eigene natürliche Kolonien und führt zulässige Gründerbevölkerung zurück. Je kumulierte §Y4§! Einheiten ursprünglicher Materie entsteht §G1§! Heimatdistrikt. Allgemeine Zerlegung erzeugt je kumulierte §Y6§! Einheiten §G100§! Bevölkerung; Terravore behalten ihre Zufallserträge. Welten der Größe 15–25 benötigen üblicherweise 3–5 Jahre; Distrikte nutzen normale Arbeitsplätze.\nEntscheidungen bieten Audienz, Heimatverlegung, Abbruch, automatische Verschlingung und die Aufhebung örtlicher Ausnahmen. Automatik ist §Ystandardmäßig aus§!; nach einer Verlegung kann auch die bisherige Heimatwelt automatisch verschlungen werden. Alte Spielstände erhalten weder Startgeschenke noch Krisenpfad nachträglich."
 eep_requires_exterminator:0 "Erfordert einen Verschlingenden Schwarm, Entschlossene Exterminatoren, Fanatische Säuberer oder ein Auslöschungs-Staatselement der verbrannten Erde."
 decision_eep_devour:0 "Verschlingen: Gabe an den einzigen Thron"
 decision_eep_devour_desc:0 "Vivhite erkennt keinen fremden Anspruch auf eine Welt an. Lasst genügend Gründerbevölkerung zur Verdauung zurück und bringt Bewohner, Kruste und geschmolzenen Kern nach Hause."
 eep_devour_effect:0 "Die Verdauung benötigt Q × 2,4 wirksame Monate, aufgerundet. Der Abschluss führt zulässige Gründerbevölkerung zurück und zertrümmert die Quelle dauerhaft. Kapazität entsteht je kumulierte 4 Q; allgemeiner Abbau erzeugt je kumulierte 6 Q genau 100 Bevölkerung. Reste werden zwischen Welten übertragen. Terravore behalten die ursprünglichen zufälligen Verbrauchserträge. Heimatverlust oder Kampf pausiert den Fortschritt; der endgültige Abschluss wartet auf das Ende der ursprünglichen Säuberung."
 eep_source_required:0 "Erfordert eine eigene, friedliche natürliche Kolonie außerhalb der gebundenen Heimat, einschließlich Schwarmwelten und Maschinenwelten; die Heimat muss unter unserer Kontrolle stehen. Megastrukturen, Archen, Ringsegmente, die Synaptische Lathe und Nanotechnologie-Welten sind ausgeschlossen."
 eep_seed_required:0 "Die Quellwelt benötigt mindestens 100 nicht zu säubernde Gründerbevölkerung; andernfalls muss die Kernwelt mehr als 100 besitzen, um die Lücke zu schließen. Ihre letzte Bevölkerung darf nicht umgesiedelt werden. Verdauer entstehen nicht kostenlos."
 eep_material_required:0 "Unbeschädigte ursprüngliche Materie ist erforderlich."
 decision_eep_audience:0 "Audienz bei Königin Vivhite"
 decision_eep_audience_desc:0 "Betretet den Hof des Herzens der Verschlingung. Vivhite beurteilt die zurückgebrachte Materie und die nächste zur Vernichtung bestimmte Welt."
 eep_audience_effect:0 "Zeigt gebundene Heimat, kumulierte Materie, erzeugte Bevölkerung, aktive Aufgaben und tatsächlichen Aufstiegsstatus. Dieser Bericht vergibt keine Belohnungen."
 eep_capacity:0 "Herz der Verschlingung: Gesammelte Weltmaterie"
 eep_capacity_desc:0 "Verschlungene Materie schafft tatsächlich bebaubare Distriktkapazität. Die ursprüngliche Planetengröße bleibt bestehen."
 d_eep_core:0 "Herz der Verschlingung: Vivhites Thron"
 d_eep_core_desc:0 "Hier sammelt sich der Wille der Königin. Thronboni und angesammelte Distriktkapazität können einer Heimatverlegung per Entscheidung folgen. Hofboni gelten nur unter unserer Kontrolle über die gebundene Heimatwelt; ihr Verlust bestimmt niemals automatisch einen Ersatzthron."
 situation_eep_devouring:0 "Verschlingung von [Target.GetName]"
 situation_eep_devouring_type:0 "Herz der Verschlingung: Planetenverdauung"
 situation_eep_devouring_desc:0 "Kein Leben verdient Bewahrung. Keine Kruste darf verschwendet werden. [Target.GetName] wird Teil der einzigen Heimatwelt."
 situation_eep_devouring_monthly_change_tooltip:0 "Jeder wirksame Monat gewährt 1 Fortschritt. Heimatverlust, Besatzung oder Bodenkampf pausieren den Fortschritt. Der Abschluss wartet auf das Ende aller ursprünglichen Säuberungen."
 eep_digesting:0 "Die Welt zerlegen"
 eep_digesting_desc:0 "Jeder Zweck dieser Welt wird auf die Versorgung des Throns reduziert."
 eep_devour_approach:0 "Der Königin gehorchen"
 eep_devour_approach_desc:0 "Die Verdauung bis zur Zertrümmerung fortsetzen."
 eep_cancel_approach:0 "Verdauung abbrechen"
 eep_cancel_approach_desc:0 "Bricht die Zerlegung dieser Welt ab und verhindert einen automatischen Neustart. Bereits erfolgte Samenumsiedlung und einheimische Terravore-Kosten werden nicht erstattet; es gibt keine Erträge. Die Entscheidung zum Fortsetzen oder ein erfolgreicher manueller Start hebt die Ausnahme auf."
 eep_monthly_ready:0 "Thron und Verdauungskolonie verfügbar"
 eep_block_core:0 "Thron getrennt: Die gebundene Heimat steht nicht unter unserer Kontrolle. Fortschritt und Abrechnung pausieren bis zur Rückeroberung derselben Welt."
 eep_block_combat:0 "Die Verdauungskolonie ist besetzt oder führt einen Bodenkampf. Der Fortschritt pausiert."
 eep_block_purge:0 "Die Verdauung ist abgeschlossen. Die ursprüngliche Säuberung wird abgewartet; keine vorzeitige Bevölkerungsvernichtung und kein wiederholter Verbrauch."
 mod_situation_eep_devouring_max_progress_add:0 "Erforderliche Verdauungsmonate"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "Der einzige Thron"
 eep.10.desc:0 "Vivhite steht im Obsidianhof und blickt auf die Sternenkarte.\n\nGrenzen? Ihre Stimme kennt keine Wärme. Ich ziehe keine Grenzen um Nahrung.\n\nKeine Versprechen an Fremde, keine Gnade, kein Rückzug. Alles muss dieses Herz versorgen. Eroberte Welten werden Leben, Kruste und Kern abtreten. Die Königin wird nichts davon bedauern."
 eep.10.a:0 "Jenseits des Throns darf alles verschlungen werden."
 eep.11.name:0 "Die Asche einer Welt"
 eep.11.desc:0 "Die letzte Kruste löst sich. Ozeane und Städte haben ihre Namen verloren; nur die heimgebrachte Menge bleibt.\n\nVivhite betrachtet den Bericht ohne Freude. Die nächste.\n\nVerschlungene Welten: [Root.eep_worlds]; ursprüngliche Materie: [Root.eep_c]; zusätzliche Heimatkapazität: [Root.eep_d]; durch allgemeinen Abbau erzeugte Bevölkerung: [Root.eep_made]. Dies sind abgeschlossene Abrechnungen. Die Nachricht gewährt keine zusätzliche Belohnung.\n\nHof: [Root.GetEEPCourtStage]. Letzte Welt: Kapazität +[Root.eep_last_capacity]; zurückgeführte Gründer [Root.eep_last_return]; allgemein erzeugt [Root.eep_last_manufactured]."
 eep.11.a:0 "Die Asche soll das Herz nähren."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "Der Horizont der Heimat wächst erneut. Neue Distrikte tragen tatsächlichen Wohnraum und Arbeitsplätze; Fabriken, Schwarmkammern und neuronale Zentralen arbeiten weiter.\n\nVivhite streicht fremdes Territorium von der Sternenkarte. Ihr angestammter Boden ist lediglich unser nächstes Fundament.\n\nKumulierte Materie: [Root.eep_c]; zusätzliche Gesamtkapazität: [Root.eep_d]; erzeugte Bevölkerung: [Root.eep_made]. Die Königin vermerkt eine neue Wachstumsstufe ohne zweite wirtschaftliche Belohnung."
 eep.13.a:0 "Macht sie zum Fundament."
 eep.30.name:0 "Ein unwiderstehlicher Wille"
 eep.30.desc:0 "Unser rechtmäßiger psionischer Aufstieg ist abgeschlossen. Das Bewusstsein des Hofes durchdringt die Heimat; psionische Koordination und normale Arbeitsplätze versorgen ihr wachsendes Herz.\n\nVivhite betrachtet fremde Echos im Schleier als wertlose Rückstände. Verstehen ist unnötig. Sie müssen nur dem Ende gehorchen.\n\nDieser Moment vermerkt bereits erworbene Fähigkeiten des Grundspiels. Er gewährt weder zusätzliche Bevölkerung oder Kapazität noch Aufstiegsberechtigung."
 eep.30.a:0 "Wille ist Gesetz."
 eep.31.name:0 "Sterne zu Klingen geschmiedet"
 eep.31.desc:0 "Unser Krisenfortschritt hat Mineralien-Schiffe freigeschaltet. Verschlungene Mineralien versorgen die Flotte, während Legierungen den Heimatbau tragen. Der Krieg schließt beide Produktionskreisläufe.\n\nVivhite betrachtet die vorbeiziehende Flotte. Verluste lassen sich ersetzen. Zögern ist verboten.\n\nVerfügbarkeit, Kosten und spätere Stufen folgen dem Grundspiel. Die Königin umgeht keine DLC-, Aufstiegs- oder Spezialprojektvoraussetzung."
 eep.31.a:0 "Richtet die Klinge auf die nächste Welt."
 eep.40.name:0 "Thron getrennt"
 eep.40.desc:0 "Die Kontrolle über die gebundene Heimat wurde unterbrochen. Die Verdauung stoppt, nicht abgerechnete Erträge bleiben versiegelt.\n\nVivhites Befehl ist kalt und eindeutig. Holt sie zurück. Die Kosten sind bedeutungslos.\n\nDie Rückeroberung derselben Heimat setzt Aufgaben fort. Eine neue Hauptstadt schafft kein zweites Herz."
 eep.40.a:0 "Den Thron um jeden Preis zurückholen."
 eep.41.name:0 "Der Thron kehrt zurück"
 eep.41.desc:0 "Die ursprüngliche Heimat steht wieder unter unserer Kontrolle. Verbliebene Verdauungskolonien setzen den Fortschritt fort; jede wartende Aufgabe wird anhand ihres eigenen Belegs einmal abgerechnet.\n\nVivhite feiert nicht. Weiter. Lasst sie für die Verzögerung mit allem bezahlen."
 eep.41.a:0 "Weiter verschlingen."
 eep.42.name:0 "Das Herz steht still"
 eep.42.desc:0 "Die ursprüngliche Heimat ist keine nutzbare Kolonie mehr. Das Herz der Verschlingung besitzt keinen Ersatzthron.\n\nUnfertige Aufgaben enden. Keine neue Heimatbindung, kopierte Kapazität oder Ersatzbevölkerung. Überlebende Kolonien werden nach dem Grundspiel betrieben. Auch der letzte Befehl der Königin lässt keinen Platz für Gnade."
 eep.42.a:0 "Das einzige Herz bewahren wir in Erinnerung."
 eep.100.name:0 "Königin Vivhite: Hofbuch"
 eep.100.desc:0 "Ich zähle nur, was zum Thron zurückgekehrt ist.\n\nGebundene Kernwelt: [eep_report_core.GetName]; Hof: [Root.GetEEPCourtStage]\nMaterie C: [Root.eep_c]; Kapazitätsrest: [Root.eep_c_remainder]/4\nAllgemeine Materie G: [Root.eep_g]; Bevölkerungsrest: [Root.eep_g_remainder]/6\nGesamte Zusatzkapazität D: [Root.eep_d]; tatsächlich freie Distrikte: [eep_report_core.eep_free_districts]\nAktuelle Kernbevölkerung: [eep_report_core.eep_actual_pop]; historisch erzeugt: [Root.eep_made]\nVerzehrte Welten: [Root.eep_worlds]; aktive Aufgaben: [Root.eep_tasks]; wartende Endabrechnungen: [Root.eep_waiting]\nLetzte Welt: Kapazität +[Root.eep_last_capacity], zurückgeführt [Root.eep_last_return], erzeugt [Root.eep_last_manufactured]\nThronstatus: [Root.eep_core_state] (0 verfügbar, 1 unterbrochen, 2 endgültig beendet)\nRechtmäßiger psionischer Aufstieg abgeschlossen: [Root.eep_psi] (0 nein, 1 ja)\nTatsächliche Nemesis-Stufe: [Root.eep_crisis] (2 Korvetten, 3 Zerstörer, 4 Kreuzer)\n\nNur lesender Bericht. Distrikte, Wohnraum, Arbeitsplätze und Unterhalt benötigen normale Verwaltung.\n\n$eep_evolution_report$"
 eep.100.a:0 "Wegtreten."
 eep.100.tasks:0 "Die Verdauungsberichte vorlegen."
 eep.101.name:0 "Verdauungskolonie: [eep_report_source.GetName]"
 eep.101.desc:0 "Zerstörung ist keine Ausrede. Legt Rechenschaft über den Fortschritt ab.\n\nQuellwelt: [eep_report_source.GetName]\nPfad: [eep_report_source.GetEEPTaskPath]\nEingefrorene Materie Q: [eep_report_source.eep_q]\nTatsächlicher Fortschritt: [eep_report_source.eep_progress]/[eep_report_source.eep_months] wirksame Monate\nHindernis: [eep_report_source.eep_block_state] (0 normal, 1 Thron unterbrochen, 2 Kampf oder Besatzung, 3 letzte Säuberung)\n\nAnsätze können in der Situationsansicht geändert werden. Abbruch oder Eigentümerwechsel gewähren keine Abschlussbelohnung."
 eep_stage_0:0 "Errichtung des Throns"
 eep_stage_1:0 "Krone zerschmetterter Welten"
 eep_stage_2:0 "Sterne kehren zum Herzen zurück"
 eep_stage_3:0 "Hof unzähliger Welten"
 eep_path_native:0 "Terravore: ursprüngliche zufällige Verzehrbelohnungen"
 eep_path_generic:0 "Allgemeiner Abbau: Bevölkerung aus angesammelter Materie"
 eep.32.name:0 "Die nächste Klinge des Hofes"
 eep.32.desc:0 "Vivhite prüft den neu freigeschalteten Schiffsrumpf. Ihr Widerstand muss früher enden als auf der letzten Welt.\n\nTatsächliche Nemesis-Stufe: [Root.eep_crisis]. Stufe 3 schaltet $crisis_destroyer$ frei, Stufe 4 $crisis_cruiser$. Schiffsrümpfe, Ausrüstung und Unterhalt bleiben unverändert. Diese Nachricht gewährt weder Fähigkeiten noch Belohnungen."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "Der Thron der Königin erhöht den Arbeitsplatzertrag der Heimatwelt: +10% Grundwert und weitere 10 Prozentpunkte je Nemesis-Krisenstufe. Stufe 1–5 ergeben 20% / 30% / 40% / 50% / 60%, spätestens beim nächsten Monatswechsel aktualisiert. Der Bonus folgt dem Thron. Alte Spielstände ohne diese Krise behalten den Grundwert von 10%."
 decision_eep_digest_report:0 "Verschlingungschronik lesen"
 decision_eep_digest_report_desc:0 "Legt den Abtragungsfortschritt dieser Welt vor. Vivhite interessiert nur der Wert, der ihren Thron noch nicht erreicht hat."
 eep_digest_report_effect:0 "Zeigt den Verschlingungsfortschritt dieser Welt, Gründe für Pausen und ausstehende Abrechnung. Der Bericht gewährt keine Belohnungen."
 decision_eep_auto_devour_enable:0 "Reichsweite automatische Verschlingung aktivieren"
 decision_eep_auto_devour_enable_desc:0 "Die Königin befiehlt, jede geeignete Kolonie außer der gebundenen Heimatwelt zu verschlingen. Auch neu erworbene Kolonien müssen gehorchen."
 eep_auto_devour_enable_effect:0 "Aktiviert den reichsweiten Schalter. Jeden Monat beginnt die Verschlingung geeigneter eigener Welten außer der gebundenen Heimatwelt, sofern Gründerbevölkerung, Frieden und Besitz des Kerns gegeben sind. Standardmäßig deaktiviert; Megastrukturen und andere ungeeignete Objekte werden übersprungen."
 decision_eep_auto_devour_disable:0 "Reichsweite automatische Verschlingung deaktivieren"
 decision_eep_auto_devour_disable_desc:0 "Setzt den Expansionsbefehl des Throns aus. Entscheidet selbst über das Schicksal jeder Welt."
 eep_auto_devour_disable_effect:0 "Verhindert reichsweit den automatischen Beginn neuer Aufgaben. Laufende Verschlingungen gehen weiter und können über die Entscheidung auf ihrer Ursprungswelt oder ihren Situationsansatz abgebrochen werden."
 eep_parallel_construction:0 "Herz der Verschlingung: Paralleler Bau"
 eep_parallel_construction_desc:0 "Die Königin lässt auf der aktuell gebundenen Heimatwelt unter unserer Kontrolle ein zusätzliches ziviles Bauprojekt gleichzeitig voranschreiten. Dieser Bonus folgt dem Thron."
 eep_mothership:0 "Vivhites Vernichtungsmutterschiff"
 eep_mothership_desc:0 "Waffen, Verteidigung und Kerntechnologie des Relikt-Dreadnoughts, mit funktionierendem Sprungantrieb, Dunkle-Materie-Antrieb und zehn mobilen Werften. Eine unbegrenzte Evolutionsstufe je 10 verschlungene Materie. Werte hängen von Reichsmodifikatoren ab."
 NAME_EEP_Baiqi_Mothership:0 "Vivhites Urteil"
 NAME_EEP_Throne_World:0 "Tribut für den Thron"
 eep_mothership_ship:0 "Urteil-Mutterschiff"
 eep_mothership_ship_plural:0 "Urteil-Mutterschiffe"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Den Thron hierher verlegen"
 decision_eep_migrate_core_desc:0 "Vivhites Wille ist nicht an Erde gebunden. Bestimmt diese Welt zur neuen Heimatwelt und verlegt Thron und Reichshauptstadt hierher."
 eep_migration_required:0 "Die bisherige Heimatwelt muss weiterhin unter unserer Kontrolle stehen. Das Ziel muss eine geeignete eigene Kolonie ohne Besatzung oder Bodenkampf sein, darf weder künstlich sein noch verschlungen werden und keinen anderen Thron beherbergen."
 eep_migration_effect:0 "Verlegt die Heimatweltbindung, Reichshauptstadt, den Arbeitsplatzertrag des Throns, die angesammelte Distriktkapazität und die gewährte zusätzliche parallele Bauwarteschlange hierher. Bevölkerung, Gebäude, Vorräte und Verschlingungsbilanzen bleiben erhalten. Andere Zerlegungen laufen weiter und liefern ihre Erträge an die neue Heimatwelt. §RBei reichsweit automatischem Verschlingen kann danach auch die bisherige Heimatwelt automatisch zerlegt werden.§!"
 decision_eep_cancel_devour:0 "Zerlegung dieser Welt abbrechen"
 decision_eep_cancel_devour_desc:0 "Widerruft den Befehl zur Zerlegung dieser Welt. Die Königin erlaubt einen geänderten Befehl, erstattet aber keine bereits bezahlten Kosten."
 eep_cancel_devour_effect:0 "Bricht die Verschlingung dieser Welt sofort ab und entfernt die Zerlegungssperren dieser Mod, ohne Erträge zu gewähren. Bereits umgesiedelte Gründerbevölkerung und einheimische Terravore-Schäden bleiben bestehen. Diese Welt wird vom automatischen Verschlingen ausgenommen, damit es im nächsten Monat nicht erneut beginnt. Die Entscheidung zum Fortsetzen oder ein erfolgreicher manueller Start hebt die Ausnahme auf. Andere Aufgaben und der reichsweite Schalter bleiben erhalten."
 decision_eep_resume_auto_devour:0 "Automatisches Verschlingen hier fortsetzen"
 decision_eep_resume_auto_devour_desc:0 "Widerruft den vorläufigen Aufschub dieser Welt und unterstellt sie wieder dem Verschlingungsbefehl des Reiches."
 eep_resume_auto_devour_effect:0 "Entfernt nur die Ausnahme dieser Welt vom automatischen Verschlingen. Ist dieses reichsweit aktiviert, versucht die nächste monatliche Prüfung einen regulären Start. Andernfalls ist weiterhin ein manueller Start nötig."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Gefräßiger Dekonstruktionsstrahl"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Zerlegt eine natürliche Kolonie für die Heimatwelt, ohne Armeen. Ziele sind eigene Kolonien außerhalb des Kerns oder feindliche Kolonien im Krieg. Erst der abgeschlossene Schuss gewährt Kapazität, Bevölkerung und Mutterschiffwachstum nach effektiver Weltgröße. Allgemeine Zerlegung erzeugt je 6 Materie 100 Gründerbevölkerung; Terravore behalten ihre nativen Zufallsbelohnungen. Abgebrochene Schüsse gewähren nichts."
 eep_colossus_target_required:0 "Benötigt das eigene Mutterschiff, eine verfügbare Heimatwelt und eine eigene natürliche Kolonie außerhalb des Kerns oder eine feindliche natürliche Kolonie im Krieg mit mehr als 0 effektiver Materie. Heimatweltkerne aller Reiche, künstliche Welten, laufende Kolonisierung, Bodenkämpfe, aktive Verschlingung und bereits abgerechnete Welten sind ausgeschlossen."
 eep_mothership_evolution:0 "Verschlingende Symbiose: Unbegrenzte Evolution"
 eep_mothership_evolution_desc:0 "Alle 10 angesammelten Einheiten effektiver Materie steigt die Evolutionsstufe ohne Obergrenze. Jede Stufe gewährt +5% Schaden, Hülle, Panzerung und Schilde sowie täglich 0,1 Hüllen- und Panzerungsregeneration."
 eep_evolution_report:0 "Evolutionsstufe des Mutterschiffs: [Root.eep_mothership_level]; Materie bis zur nächsten Stufe: [Root.eep_mothership_next]. Jede Stufe gewährt +5% Schaden, Hülle, Panzerung und Schilde. Eine Stufe je 10 Materie, ohne Stufenobergrenze."
 EEP_SYMBIOTIC_SHIELD_CORE:0 "Symbiotischer Schildkern (Flottenschnittstellenprobe)"
 EEP_SYMBIOTIC_SHIELD_CORE_DESC:0 "Versuchskomponente, die nur dem gebundenen Mutterschiff 10% zusätzliche Schilde verleihen soll. Zielfilter, Eigenwirkung, wiederholte Stapelung und Verhalten nach dem Laden benötigen native Laufzeitprüfungen. Keine automatische Vergabe."
 eep_symbiotic_shield_core:0 "Symbiotischer Schildkern (Flottenschnittstellenprobe)"
 EEP_SYMBIOTIC_SHIELD_CORE_SHIP:0 "Symbiotischer Schildkern (Schiffsschnittstellenprobe)"
 EEP_SYMBIOTIC_SHIELD_CORE_SHIP_DESC:0 "Versuchskomponente, die nur dem gebundenen Mutterschiff 10% zusätzliche Schilde verleihen soll. Zielfilter, Eigenwirkung, wiederholte Stapelung und Verhalten nach dem Laden benötigen native Laufzeitprüfungen. Keine automatische Vergabe."
 eep_symbiotic_shield_core_ship:0 "Symbiotischer Schildkern (Schiffsschnittstellenprobe)"
