 casus_belli_cb_expel_nomads: "划定边界"
 War_of_Demarcation: "定界战争"
 war_goal_wg_expel_nomads: "驱逐游牧"
 war_goal_wg_expel_nomads_desc: "发动战争以消除我方恒星系内的游牧活动，并从其驿站中缴获物资。"
 wg_expel_nomads_status_quo_effects: "在§Y[Root.GetName]§!（及其盟友）境内归属于§Y[From.GetName]§!的§Y$waystation_plural$§!被全部摧毁。\n在停战协定期间§Y[From.GetName]§!禁止在§Y[Root.GetName]§!（及其盟友）境内建造§Y$waystation_plural$§!。\n所有属于§Y[From.GetName]§!的舰船都将被强行驱逐出§Y[Root.GetName]§!。\n§Y[From.GetName]§!在接下来的§Y10年§!内将需要获得§Y[Root.GetName]§!（及其盟友）的边境通行权才能进入其国境。"
 wg_expel_nomads_subject_status_quo_effects: "在§Y[Root.GetName]§!（其盟友及附属国）境内归属于§Y[From.GetName]§!的§Y$waystation_plural$§!被全部摧毁。\n在停战协定期间§Y[From.GetName]§!禁止在§Y[Root.GetName]§!（及其盟友）境内建造§Y$waystation_plural$§!。\n所有属于§Y[From.GetName]§!的舰船将会被赶出§Y[Root.GetName]§!。\n在未来§Y10年§!内§Y[From.GetName]§!将需要§Y[Root.GetName]§!（及其盟友）的边境通行权。"
 wg_expel_nomads_effects: "在§Y[Root.GetName]§!（及其盟友）境内归属于§Y[From.GetName]§!的§Y$waystation_plural$§!被全部摧毁，没收其中的§Y$waystation_stockpile_plural$§!。\n在停战协定期间§Y[From.GetName]§!禁止在§Y[Root.GetName]§!（及其盟友）境内建造§Y$waystation_plural$§!。\n所有属于§Y[From.GetName]§!的舰船都将被强行驱逐出§Y[Root.GetName]§!。\n§Y[From.GetName]§!在接下来的§Y10年§!内将需要获得§Y[Root.GetName]§!（及其盟友）的边境通行权才能进入其国境。"
 wg_expel_nomads_subject_effects: "在§Y[Root.GetName]§!（其盟友及附属国）境内归属于§Y[From.GetName]§!的§Y$waystation_plural$§!被全部摧毁，没收其中的§Y$waystation_stockpile_plural$§!。\n在停战协定期间§Y[From.GetName]§!禁止在§Y[Root.GetName]§!（及其盟友）境内建造§Y$waystation_plural$§!。\n所有属于§Y[From.GetName]§!的舰船都将被强行驱逐出§Y[Root.GetName]§!。\n§Y[From.GetName]§!在接下来的§Y10年§!内将需要获得§Y[Root.GetName]§!（及其盟友）的边境通行权才能进入其国境。"
