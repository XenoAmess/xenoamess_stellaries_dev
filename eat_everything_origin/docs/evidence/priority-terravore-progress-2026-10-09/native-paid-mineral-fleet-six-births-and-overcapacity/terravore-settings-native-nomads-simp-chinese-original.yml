 create_outposts_in_waystation_systems_for_subject_tt: "\n所有位于§Y[event_target:settled_system.GetName]§!的$@arkship_subject_settle_outpost_range|Y0$次跃迁范围之内、且拥有£waystation£['concept_waystation']的无主星系都将建造一座['concept_outpost']，从而为我们的新['concept_subject']夺取这些星系的所有权。"
