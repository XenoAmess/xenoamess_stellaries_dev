 trait_defence_drones: "战斗同步"
 trait_defence_drones_desc: "每个单元都是工程师兼任战斗员。在战时，他们的同步协议能稳定全局，并确保关键系统得到修复与优化。"
 trait_defence_drones_effects: "在战争或天灾其间：每$pop_group_unit$拥有该特质的£pop£§H人口§!为殖民地增加§G+$@defence_drones_stability$§!£stability£$PLANET_STABILITY_TITLE$，最多§G+15§!$TABBED_NEW_LINE$—该效果只影响['concept_artificial_colonies']"
 trait_terraphobic: "恐地症"
 trait_terraphobic_desc: "由于已经适应了在人造环境中的生活，该物种对行星环境感到压抑。重力、大气层和地形会对他们脆弱的生理机能构成持续的挑战。"
