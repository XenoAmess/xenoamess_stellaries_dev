 contract_suntrip_passenger_2: "观星站"
 contract_suntrip_passenger_2_desc: "乘客中的业余天文学家发现了该星系中罕见的太阳活动，目前正在请愿要求在驻留轨道期间获得前排的观赏位置。"
 contract_suntrip_passenger_2_lore_issued: "§L“我带了七个镜片，但我还是没弄明白该从望远镜的哪一头看。”§!"
 contract_suntrip_passenger_2_lore_completed: "§L“当耀斑照亮整个观景台时，整整一分钟都没人说话。我已经预订了下一次的位置！”§!"
 contract_suntrip_passenger_2_lore_failed: "§L“他们说演出取消是因为‘恒星不活跃’。恒星明明就在那儿啊！”§!"
 contract_suntrip_passenger_2_chain_title: "$contract_suntrip_passenger_2$"
 contract_suntrip_passenger_2_chain_desc: "$contract_suntrip_passenger_2_desc$"
