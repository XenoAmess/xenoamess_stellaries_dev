 CONTRACT_SUNTRIP_passenger_2_PROJECT_DESC: ""
 contract_suntrip_passenger_3: "向阳飞船竞速赛"
 contract_suntrip_passenger_3_desc: "巡游舰正在举办一场围绕该星系恒星的穿梭机比赛。乘客们纷纷下注，挤满了每一个舷窗。"
 contract_suntrip_passenger_3_lore_issued: "§L\"我把一切都押在七号穿梭机上了。它的外壳上画着火焰，所以肯定飞得贼快。\"§!"
 contract_suntrip_passenger_3_lore_completed: "§L“三号穿梭机以一个机头的微弱优势险胜。我输了赌注，但收获了一项最爱的新运动。\"§!"
 contract_suntrip_passenger_3_lore_failed: "§L“比赛取消了。好像是因为什么‘太阳风预警’。可是说好了会有烈焰的！”§!"
 contract_suntrip_passenger_3_chain_title: "$contract_suntrip_passenger_3$"
 contract_suntrip_passenger_3_chain_desc: "$contract_suntrip_passenger_3_desc$"
