 council_agenda_agenda_arkship_engineering_civilian_name: "方舟舰发展"
 council_agenda_agenda_arkship_engineering_civilian_desc: "我们的方舟舰针对资源开采进行了优化，但在战备状态和科研能力上却缺乏投入。扩展我们的能力是一项战略重点。"
 agenda_arkship_engineering_civilian_modifier_tt: "方舟调查速度：§G+$@arkship_agenda_mult|0%$§!\n方舟闪避：§G+$@arkship_agenda_static|0$§!"
 council_agenda_agenda_arkship_engineering_science_name: "方舟舰发展"
 council_agenda_agenda_arkship_engineering_science_desc: "我们的方舟舰是一个能力出众的研究平台，但面对虚空，单靠科学才能是远远不够的。长期运行能力和战斗系统同样需要同等的投入。"
 agenda_arkship_engineering_science_modifier_tt: "方舟亚光速飞行速度：§G+$@arkship_agenda_mult|0%$§!\n方舟闪避：§G+$@arkship_agenda_static|0$§!"
 council_agenda_agenda_arkship_engineering_military_name: "方舟舰发展"
 council_agenda_agenda_arkship_engineering_military_desc: "我们的方舟舰专为作战行动而建，但在研究能力和后勤基础设施方面却缺乏投资。纠正这一不平衡将扩大我们的行动范围。"
