 waystation_pirate_hideout_tt: "\n§Y效果§!：\n£ship_h_slot£ 武器槽位：§G+1§!。\n根据恒星系内殖民地的产出提供资源。\n每个恒星系内殖民地：$TABBED_NEW_LINE$每月产出盗取：§G+1.5%§![GetPirateHideoutPiracyDesc]"
 waystation_pirate_hideout_piracy_cloaked_tt: "\n如果这个驿站没有启用隐身状态，殖民地所有者会§R怀疑存在海盗行为§!，对我们产生评价惩罚。"
 waystation_pirate_hideout_piracy_tt: "\n殖民地所有者将此§R怀疑为海盗行为§!，并对我们产生评价惩罚。"
 waystation_pirate_hideout_reaver_stronghold_tt: "§Y$sm_waystation_reaver_stronghold$§!产生的额外效果："
 sm_waystation_concealment_field: "匿踪力场"
 sm_waystation_concealment_field_desc: "先进的镶板工作将最大限度地减少信号和能量泄漏，从而加强我们的防御并优化我们的隐形系统。"
 sm_waystation_reaver_stronghold: "掠夺者要塞"
 sm_waystation_reaver_stronghold_desc: "我们海盗舰队的固定指挥所，这座强大的堡垒将帮助我们协调整个星系的突袭。"
