 contract_shoreleave_passenger_5: "邂逅野物"
 contract_shoreleave_passenger_5_desc: "下方星球上的自然保护区提供穿越其外星荒野的导览服务。乘客们可以从导览步道上近距离观赏外星动物群。"
 contract_shoreleave_passenger_5_lore_issued: "§L“我带了三台拍摄设备。如果它有超过四条腿，我要从各个角度拍下它。”§!"
 contract_shoreleave_passenger_5_lore_completed: "§L“其中一个嗅了嗅我。或者扫描了我。又或者向我求婚了。我不在乎，这太奇妙了。”§!"
 contract_shoreleave_passenger_5_lore_failed: "§L“没有野生动物游览了。我想我又要去九层甲板盯着鱼缸看了。”§!"
