 contract_shoreleave_crew_3: "补给品扫货"
 contract_shoreleave_crew_3_desc: "储备即将耗尽。船组小队将前往星球表面寻找备件、原材料，以及飞船制造机在几个周期前就已停止生产的各类补给品。"
 contract_shoreleave_crew_3_lore_issued: "[GetShoreleaveCrewLoreIssued3]"
 contract_shoreleave_crew_3_regular_lore_issued: "§L“物资申请单上一半是备件。另一半是我们自从上次靠港以来就没吃过的零食。”§!"
 contract_shoreleave_crew_3_machine_lore_issued: "§L“需求清单上一半是结构组件。另一半是我们三个周期前就耗尽的底盘润滑油。”§!"
 contract_shoreleave_crew_3_lore_completed: "[GetShoreleaveCrewLoreCompleted3]"
 contract_shoreleave_crew_3_regular_lore_completed: "§L“我们为电容器而来，却带走了成箱的不明糖果。行吧，就当作是任务完成了。”§!"
 contract_shoreleave_crew_3_machine_lore_completed: "§L“我们征收电容器，还带回了多余的处理核心。效率提升：出乎意料但大有裨益。”§!"
 contract_shoreleave_crew_3_lore_failed: "§L“补给任务已取消。那些电容器只能再坚持一个周期了。”§!"
 contract_shoreleave_crew_3_chain_title: "$contract_shoreleave_crew_3$"
 contract_shoreleave_crew_3_chain_desc: "$contract_shoreleave_crew_3_desc$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT: "$contract_shoreleave_crew_3$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT_DESC: ""
 contract_shoreleave_crew_4: "技术交换"
 contract_shoreleave_crew_4_desc: "当地工程师已开放他们的设施供考察。他们对常见工程问题的解决方案与我们的模型存在显著差异，而当地人也同样渴望研究方舟舰。"
 contract_shoreleave_crew_4_lore_issued: "[GetShoreleaveCrewLoreIssued4]"
 contract_shoreleave_crew_4_regular_lore_issued: "§L“他们的反应堆设计让我完全摸不着头脑。我必须亲自去看看。”§!"
 contract_shoreleave_crew_4_gestalt_lore_issued: "§L“他们的反应堆设计与我们数据库中的任何现有型号都不匹配。正在部署子个体直接对其进行检查。”§!"
 contract_shoreleave_crew_4_lore_completed: "[GetShoreleaveCrewLoreCompleted4]"
 contract_shoreleave_crew_4_regular_lore_completed: "§L“按我们的标准来看，他们的电网简直一团糟，但它确实能运作。我记了三页的笔记，对地面工程也有了全新的敬意。”§!"
 contract_shoreleave_crew_4_gestalt_lore_completed: "§L“外星工程解决方案已归档。数项设计已被标记为待整合。他们的方法虽然粗糙，却出人意料地有效。”§!"
 contract_shoreleave_crew_4_lore_failed: "[GetShoreleaveCrewLoreFailed4]"
 contract_shoreleave_crew_4_regular_lore_failed: "§L“没有技术交换。我只好继续好奇他们是如何在没有恒星散热器的情况下冷却反应堆的。”§!"
 contract_shoreleave_crew_4_gestalt_lore_failed: "§L“未进行交换。外星工程学仍未得到解析。他们的反应堆冷却方法只能以后再说了。”§!"
 contract_shoreleave_crew_4_chain_title: "$contract_shoreleave_crew_4$"
 contract_shoreleave_crew_4_chain_desc: "$contract_shoreleave_crew_4_desc$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT: "$contract_shoreleave_crew_4$"
