 arkship.1300.name: "必要的大起底"
 arkship.1300.desc: "方舟舰§Y[Root.GetName]§!上的高级工程队提交了一份结构评估报告，该报告呼吁已不能再拖延。我们的家园急需修缮。\n\n该提案是全面的：分段轮流大修，从发电基础设施开始，然后依次进行耕作甲板、防御区和居住区。居民需要暂时搬迁。设施将停止运行。工程估算显示，根据工作进度，全面检修大约需要十到十一个标准年。\n\n这项工作将具有破坏性。但另一种选择是，这艘船每经过一个秒差距，可靠性就会降低一分。"
 arkship.1300.desc.machine: "§Y[Root.GetName]§!上的诊断子程序已标记出主结构子系统的关键阈值。方舟舰急需维修。\n\n修复协议要求对各区段进行轮流大修。发电节点、种植区、防御基础设施和居住区将依次离线进行全面重建。在此过程中，运行连续性将有所下降。预计完成时间：以标准运行速度计算，约一百三十个月。\n\n修复不可推迟。"
 arkship.1300.desc.hive: "集体意识到方舟舰§Y[Root.GetName]§!的状况正在恶化：承重结构在不该弯曲的地方弯曲；电力管道正在腐蚀。数代人的累积疏忽已经达到我们无法再拖延的程度。\n\n我们需要一个全面的更新周期：逐段进行，从动力节点向外，依次经过补给舱、防御外壳和居住甲板。随着工程的进行，各个区段将被封闭，其居民将被迁离。更新周期将持续十到十一个标准年。"
 arkship.1300.a: "开始翻修。"
 arkship.1300.a.machine: "启动补救协议。"
 arkship.1300.a.hive: "[Root.GetName]必须重新焕新。"
 refurbishment_ongoing: "全面翻修：正在进行"
 refurbishment_ongoing_desc: "这艘方舟舰正在进行全面的结构翻新。多个区域的施工活动正在导致飞船范围内的稳定性中断和区域建造能力受损。"
 refurbishment_generator_offline: "$district_ark_generator$：翻新中"
 refurbishment_generator_offline_desc: ""
 arkship.1305.name: "栽培甲板"
 arkship.1305.desc: "发电基础设施已通过认证并恢复满负荷运行。施工人员已将设备运往较低的农业层。\n\n种植平台将逐段停用。这不仅是一项结构性挑战，也是一项后勤挑战：食物储备需要精心管理，建筑残渣将在公共区域滞留数月。\n\n工程师们说，最难的部分不是焊接，而是等待。"
 arkship.1305.desc.machine: "发电修复已通过认证并恢复到正常输出。运营范围现在转移到第二部门基础设施。\n\n指定区域将按顺序离线进行结构大修。受影响部门的运营输出在此过程中将按比例下降。\n\n修复工作继续在预计参数内进行。"
 arkship.1305.desc.hive: "发电机组全面恢复供电。\n\n我们的注意力转向内部，看向维持殖民地运作的巨大供养仓。飞船上的培养槽和营养循环器官必须依次离线，进行结构翻新。食物储备已准备就绪，以弥补期间的不足。\n\n在殖民地的“胃”重建期间，它将依靠储备食物维生。"
 arkship.1305.a: "这种破坏是必要的。"
 arkship.1305.a.machine: "按计划继续修复。"
 arkship.1305.a.hive: "更新循环仍要继续。"
 arkship.1305.a.tt: "消除翻修上一阶段产生的任何负面影响。\n\n"
 refurbishment_farming_offline: "$district_ark_basic$：翻新中"
 refurbishment_farming_offline_desc: ""
 arkship.1310.name: "防御区段"
 arkship.1310.desc: "随着种植甲板重建和粮食生产恢复正常，注意力转向了前线防御区。从武器舱到维修走廊，一切都已勘测完毕，都需要进行维修。\n\n在此阶段，海军战备将受到限制。负责确保飞船安全的船员们被要求暂时离开，因为他们的工作区域正在被拆开和重新组装。\n\n据大多数说法，他们对此表现出了非凡的耐心。"
 arkship.1310.desc.machine: "二级部门修复已完成。部门产出正恢复到运行基线。修复范围现已转向前方防御基础设施。\n\n武器舱、维护网络和安全部门设施将按顺序离线。在此阶段，海军战备指标将下降。\n\n修复工作按预计参数继续进行。"
 arkship.1310.desc.hive: "饲养室得到更新，蜂群殖民地的饥饿感得以持续。\n\n现在，我们的注意力转向甲壳：构成舰船外部防御的武器电池、维修巢穴和兵营。所有这些都必须拆除重建。战斗准备状态将会减弱。\n\n集体接受这种暂时的脆弱性。"
 arkship.1310.a: "$arkship.1305.a$"
 arkship.1310.a.machine: "$arkship.1305.a.machine$"
 arkship.1310.a.hive: "$arkship.1305.a.hive$"
 refurbishment_military_offline: "$district_ark_military$：翻新中"
 refurbishment_military_offline_desc: ""
 arkship.1315.name: "生活区"
 arkship.1315.desc: "防御区已经检查完毕，加固并重新投入使用。负责这项工作的船员们看起来，如果非要说的话，松了一口气，终于又有事情可做了。\n\n现在进入最后阶段：城市区本身。构成方舟舰生命核心的住宅区、市政厅和商业走廊。其他一切都是基础设施。这是居民们称之为家的地方。\n\n施工围栏将最后一次竖起。胜利在望。"
 arkship.1315.desc.machine: "防御区段的修复已确认完成。海军战备指标正恢复到基线水平。行动范围现在转向住宅和市政区基础设施。\n\n单位处理通道将按顺序离线进行最终检修。受影响区域将需要人口疏散。\n\n修复工作进入最后阶段。"
 arkship.1315.desc.hive: "甲壳已经硬化，集体的准备状态也已恢复。\n\n更新现在转向其最后的工作：育婴室、公共筑巢地穴和连接通道，它们构成了飞船的生命核心。这些空间是殖民地睡觉、繁殖和聚集的地方。在我们从内部重建时，一些区域将被封闭。\n\n更新周期即将结束。"
 arkship.1315.a: "最后一搏。"
 arkship.1315.a.machine: "翻新协议的最终部分。"
 arkship.1315.a.hive: "最后的新生开始了。"
 refurbishment_city_offline: "$district_ark_city$：翻新中"
 refurbishment_city_offline_desc: ""
 arkship.1320.name: "部门分配争议"
 arkship.1320.desc: "由于住宅层因结构调查而被封锁，工程团队已开始了一项令人头疼的任务，即在飞船的其余部分重新安置数千名居民。最初有序的流程已演变为相互竞争的排队、管辖权争议，以及至少一份关于无法进入水培舱一个特别受欢迎区域的正式投诉。\n\n飞船的社会协调员正在请求指导。"
 arkship.1320.desc.machine: "单位向可用作战区域的重新部署遇到了处理瓶颈。单位正在做出实时决策以弥补，导致优先级冲突。再部署节点的效率指标已下降。\n\n需要指导。"
 arkship.1320.desc.hive: "子个体的迁移扰乱了蜂群的凝聚力。由于流离失所的子个体在过度拥挤的次要区域争夺筑巢区和工作分配，领地本能显现出来。在整个临时住所中都可以检测到压力和不安的信息素痕迹。\n\n蜂群需要指导。"
 arkship.1320.a: "工程师会想办法解决。"
 arkship.1320.b: "建立一个公平的分配机制。"
 arkship.1320.a.tt: "\n绕过标准流程。最终工作质量可能会受到影响。"
 arkship.1325.name: "墙后的东西"
 arkship.1325.desc: "拆除发电机区的导管套管后，发现了一些原始图纸中没有显示的东西：一段三米长的结构主梁，出现了严重的疲劳断裂。材料测定表明，这种损坏已经存在了几十年，但一直未被发现。\n\n扩大施工范围以解决损坏问题将需要额外的时间。"
 arkship.1325.a: "记录下来，然后按原计划进行。"
 arkship.1325.b: "扩大翻修范围。将这处断裂处妥善处理。"
 arkship.1325.b.tt: "扩大翻修范围以妥善处理结构损坏需要额外的时间，但能避免日后出现更大的问题。"
 arkship.1330.name: "延误津贴"
 arkship.1330.desc: "未受持续翻新工程影响的居民抱怨不得不与搬迁人员共用住所。\n\n他们要求增加资源分配，优先使用娱乐设施，并立即移除一个自动化广播系统，该系统每三小时提醒他们，他们的不便是“暂时的且受到感谢的”。"
 arkship.1330.desc.machine: "由于人口重新分配，分配给过度拥挤的次级区域的单位凝聚力读数已显著下降。生产力产出低于最佳阈值。预测模型表明，如果不进行干预，这种趋势将恶化。\n\n已建议有针对性地分配额外资源以恢复基线凝聚力。"
 arkship.1330.desc.hive: "过度拥挤的次级筑巢区信息素应激水平自迁徙开始以来稳步上升。被迁集群和常驻种群之间的领土紧张关系显著加剧。随着本能骚动在受影响区域蔓延，蜂巢的集体生产力正在下降。\n\n已建议增加补充资源以缓解拥挤。"
 arkship.1330.a: "这要不了太久。我们能够管控这一局势。"
 arkship.1330.b: "分配必要的资源。"
 refurbishment_allowances_granted: "重新分配资源"
 refurbishment_allowances_granted_desc: "资源正被分配到因新居民涌入而不堪重负的地区。"
 refurbishment_low_morale: "搬迁导致不满情绪"
 refurbishment_low_morale_desc: "拥挤的环境和对流离失所居民的支持不足正在影响全船士气和稳定。"
 refurbishment_low_morale_2: "搬迁导致严重的不满情绪"
 refurbishment_low_morale_2_desc: "反复出现的干扰和不足的支持已严重恶化了船上的士气和稳定性。"
 refurbishment_low_morale_3: "搬迁导致不满情绪已达峰值"
 refurbishment_low_morale_3_desc: "士气和稳定跌至谷底。流离失所的居民在经历了反复的动荡后，看不到解决的希望，感到身心俱疲，怨声载道。"
 arkship.1335.name: "二度轮换"
 arkship.1335.desc: "为赶上施工进度，首席工程师提议实行三班倒，24小时不间断施工。施工区域附近的住宅区报告称，噪音水平已导致居民连续十一天难以休息。三名施工人员已因疲劳相关事故接受治疗。\n\n施工队本身也出现了疲劳的迹象。虽然速度可能更快了，但负责人对疲惫的施工队所完成的工作质量并不抱太大信心。"
 arkship.1335.desc.machine: "为维持进度，已在所有活跃工区施工单位中提出连续作业周期。来自邻近居民区的噪声和振动数据显示，持续干扰已超过容忍阈值。已记录到多起设备运行故障。\n\n质量保证指标正与周期延长成比例下降。连续作业虽然更快，但错误率显著增加。"
 arkship.1335.desc.hive: "为维持更新周期，活跃施工区域的无人机已被指示长时间运行。相邻筑巢区的振动和噪音水平已连续十一个周期超出可容忍阈值。几架无人机已出现疲劳性故障迹象。\n\n持续工作确实加快了施工速度，但群体的生物极限对工作质量造成了可衡量的损失。"
 arkship.1335.a: "维持现在的施工节奏。"
 arkship.1335.b: "建立适度的轮换排班机制。"
 refurbishment_construction_fatigue: "建造乏力"
 refurbishment_construction_fatigue_desc: "施工人员正从一段时间的连续作业中恢复过来。在新排班表生效期间，所有工种的产出都会降低。"
 refurbishment_construction_fatigue_2: "建造严重乏力"
 refurbishment_construction_fatigue_2_desc: "长时间的过度劳累使建筑工人长期处于疲惫状态。士气和产量都大幅下降。"
 refurbishment_construction_fatigue_3: "建造乏力已达峰值"
 refurbishment_construction_fatigue_3_desc: "施工队超负荷运作。士气崩溃，所有工种的产出都受到严重影响。"
 arkship.1340.name: "导管失效"
 arkship.1340.desc: "一根主电源导管在拆除旧外壳时破裂。整个区域，包括住宅层、次级医务室和两个食品加工单元，现在仅靠应急照明运行。\n\n我们的[Owner.GetEngineerPlural]认为，有可能在几个月内恢复全部电力。或者，可以通过绕过导管的路径，从相邻的发电机组获取电力。这种方法更快，但这会在电网中引入一个永久性的应急改动。"
 arkship.1340.a: "飞线绕过去。"
 arkship.1340.b: "优先进行全面修复。"
 refurbishment_bypass_routing: "绕过导管路径"
 refurbishment_bypass_routing_desc: "一根破损的电力管道被绕开而不是修复。这个变通方案是稳定的，但给电网带来了持续的低效率。"
 arkship.1345.name: "主要担忧"
 arkship.1345.desc: "项目首席结构工程师提交了一份正式担忧：目前的工期虽然可以实现，但产出的工作成果[Owner.Ruler.GetSheHe]本人不会认证为合格。\n\n非关键连接点正在被密封而不是适当加固。公差裕度被设定为“可接受”而非“推荐”。"
 arkship.1345.desc.machine: "质量保证监督子程序已标记出一个结构性问题：当前的施工参数在最低容差阈值内运行，而非推荐规格。非关键连接节点正在被结项，而非优化。长期结构余量预测低于首选目标。\n\n已登记正式日志条目。未显示即时故障风险。"
 arkship.1345.desc.hive: "目前的翻新速度使得工作成果仅达到最低可行标准，而非推荐规格。连接节点被简单地封固，而非得到妥善加固。长期结构韧性被牺牲以换取短期速度。\n\n目前没有迹象表明存在即时故障风险。相关担忧已记录在案。"
 arkship.1345.a: "日程表保持不变。只要看上去过得去，那就过去。"
 arkship.1345.b: "注意警告。校正参数。"
 refurbishment_power_restoration: "全面恢复供电"
 refurbishment_power_restoration_desc: "全面恢复供电需要额外时间。"
 arkship.1350.name: "第一区段上线"
 arkship.1350.desc: "首个完成大修的区段已被宣布结构上合格，并获准重新使用。这项工作确实令人印象深刻：新的框架、现代化的管道、以及绝不会一碰即碎的绝缘材料。\n\n工程团队渴望继续推进。居民们也迫不及待地想搬回来。然而，全套系统测试尚未完成。需要做出一个决定。"
 arkship.1350.desc.machine: "一次重大结构翻修已经完成。初步认证表明该区段符合最低重新占用标准。全面的诊断测试规程仍未完成。重大入住后故障的可能性较低但并非可以忽略。\n\n无论是否完成诊断，都需要授权才能继续。"
 arkship.1350.desc.hive: "首个完成结构更新的区段已通过初步检查。它达到了重新使用的最低门槛。其重建系统的完整生物验证周期尚未完成。重新使用后的故障概率很低，但并非可以忽略不计。\n\n从该区域撤离的无人机已在屏障处施压。"
 arkship.1350.a: "这些测试没有必要。"
 arkship.1350.b: "完成所有测试序列。"
 refurbishment_extended_displacement: "延长搬离期"
 refurbishment_extended_displacement_desc: "已竣工区段在获得全面的系统认证前维持关闭。"
 arkship.1355.name: "修复清单"
 arkship.1355.desc: "项目主管已经编制了最终的维修清单：在正式结构签收前还有四十七个未完成项目。清单上的项目范围很广，从重要的，例如后部区域的三个承重连接升级，到美观性的，包括十九处面板未对齐和一处通风格栅装反了。\n\n完成清单上的每一项都需要额外的时间。但这份清单之所以存在，正是因为这些事情很重要。"
 arkship.1355.desc.machine: "质量保证协议已经生成了一份补救清单，其中包含四十七项待正式认证的项目。这些项目从结构重要性（如接点加固）到外观面板对齐都有涉及。\n\n全面完成将需要延长运营时间。只涵盖结构项目，形成一个次优化的分项认证是一个可选方案。"
 arkship.1355.desc.hive: "维修工蜂已编制了一份最终清单：在最近完成的区段中，有四十七处胞元修复不完整。这些修复工作从承重连接处的关键结构加固，到表面胞元内衬和美容腔体修复，不一而足。\n\n全面完成将延长更新周期。我们也可以考虑只获得部分认证，仅涉及结构修复部分。"
 arkship.1355.a: "仅处理结构性项目。"
 arkship.1355.b: "完成整个修复清单的任务。"
 arkship.1360.name: "归乡"
 arkship.1360.desc: "最新翻修部分的流离居民已经收到了他们迁回的日期。那些被封闭了数月的走廊再次开放，散发着新鲜复合材料和新绝缘材料的气味。那些在临时住所待了数月的婴儿们第一次看到了他们的家。\n\n船上的气氛是自翻修开始以来最好的。领导层意识到这种善意不会持久。问题是如何利用它。"
 arkship.1360.desc.machine_ind: "密封的走廊再次开放。下层甲板的脚手架正在拆除。对大多数人来说，这是回家。对一些人来说，却是别样的体验。\n\n在迁徙期间新近启动的单元正在进入那些仅存在于其数据库图纸中，但从未出现在其感官日志中的走廊。\n\n自翻新开始以来，热情达到了顶峰。领导层知道这不会持久。问题是如何利用它。"
 arkship.1360.desc.machine: "分配到修复期间临时作业区的单位正在返回其主要处理区域。受影响区域的基线操作参数正在恢复。效率指标呈上升趋势。\n\n飞船范围内已记录到可测量的凝聚力提升。此类提升是暂时的。分析表明有两种可行方法：将提升重定向以加速剩余的修复工作，或允许自然稳定并使凝聚力稳定在更高的基线水平。"
 arkship.1360.desc.hive: "流离失所的工蜂正回流到它们修复好的区域。曾经散发着几个周期建筑材料气味的走廊，现在充满了熟悉的嗅觉标记。结合化学作用趋于稳定。领地紧张感消散。\n\n集体共鸣激增。蜂巢正在恢复原状，这种回归的能量是真实的。它可以被导向外部，进入剩余的建筑区。或者，也可以让它安定下来，给蜂群时间在工作恢复之前完全找回自我。"
 arkship.1360.a: "将重点重新放回工作上。"
 arkship.1360.b: "让他们享受这一刻吧。"
 arkship.1365.name: "漫长等待"
 arkship.1365.desc: "居民区翻新工程已进入最后阶段，但“最后”这个词的含义已经今非昔比。从市区迁出的居民在临时住所居住的时间已经超出了最初的估计。\n\n现在有要求提供额外资源：更好的临时家具、优先使用娱乐设施，以及少量额外资源分配。这并不能解决任何结构性问题。但它可能会让等待变得更容易忍受。"
 arkship.1365.desc.machine: "从居民区被迫搬离的人员凝聚力数据正低于可接受的阈值。最终改造阶段已超出其预计持续时间。预测模型显示，如不进行有针对性的资源干预，情况将持续恶化。\n\n补充拨款申请已提交审核。"
 arkship.1365.desc.hive: "最终居住区的信息素压力读数已超过可接受的阈值。上一次翻新阶段已超出其预计周期。长期脱离既定模式会扰乱结合化学并损害集体凝聚力，且随着时间推移情况会恶化。\n\n已请求额外资源分配以缓解拥挤。"
 arkship.1365.a: "在工作完成前我们可以忍耐。"
 arkship.1365.b: "批准额外拨款。"
 refurbishment_administrative_burden: "行政负担"
 refurbishment_administrative_burden_desc: "管理长期搬离原住所的居民的福利项目给专业人员带来了巨大的压力。采购物流、投诉处理和分配管理正在分散技术人员的精力，使其无法专注于主要职责。"
 arkship.1370.name: "未授权的改装"
 arkship.1370.desc: "在住宅区中部拆除非承重墙时，装修工人发现了一些异常情况：几十年来未经授权的改动。隐藏的房间、私自搭建的壁龛、被改造成储藏室或居住空间的封闭走廊。这些都不在原始设计图中，而且其中一些还是承重结构。\n\n首席工程师正在请求决策。拆除所有不在原始计划中的部分是正确的做法。这将需要时间。绕过这些改动会更快，但会引入结构不规则性，这将很难向未来的工程师解释。"
 arkship.1370.desc.machine: "对住宅部门非结构性元素的拆解过程中，我们发现了大量未经授权的建筑改造。在多个区域发现了未经备案的隔断、通道改动和临时承重装置。这些都没有在原始设计规范中记录。\n\n完全拆除在结构上是正确的，但耗时。文档记录和变通路线可作为替代方案。"
 arkship.1370.desc.hive: "拆除中层居住区的内墙后，我们发现了数代未经授权的殖民地改造。隐蔽的洞穴、自行挖掘的通道、改作巢穴的密封空间，所有这些都完全不在飞船的正式结构中。其中一些是承重结构。正确移除是正确的做法，但耗时。绕开它们更快，但会引入结构不规则性，这将给未来的巢穴管理员带来麻烦。"
 arkship.1370.a: "能记录的记录下来。剩下的想办法解决。"
 arkship.1370.b: "移除所有不符合原始规划的内容。"
 arkship.1370.c: "我们当时在想什么？"
 refurbishment_rework_zone: "活跃的施工区域"
 refurbishment_rework_zone_desc: "这些区域活跃的施工工作阻碍了新的区域开发，直至修复完成。"
 arkship.1375.name: "最后一层甲板"
 arkship.1375.desc: "最后一层甲板已通过初步检查。下方部分的脚手架已开始拆除。从大多数方面来看，翻修工作已完成。\n\n工程主管要求进行全面的二次检查，之后[Owner.Ruler.GetSheHe]才会签署结构认证。他们承认，这在很大程度上只是一种形式。甲板几乎肯定没有问题。\n\n然而，“几乎”这个词往往会带来后果。"
 arkship.1375.desc.machine: "最终的住宅区已通过初步检查协议。低层区域的脚手架拆除工作已经开始。结构认证正等待完整的二次诊断协议。\n\n二次检查几乎是肯定是不会有问题的，但获得完全认证的是全面完工的正式先决条件。"
 arkship.1375.desc.hive: "最终的巢穴甲板已通过初步检查。工蜂正在拆除低层的脚手架。从所有可观察到的迹象来看，翻修已完成。在最终认证前，还需要进行全面的二次验证循环。\n\n我们几乎可以肯定——但并非完全肯定——二次验证和初次检查的结果将保持一致。"
 arkship.1375.a: "几乎完工就已经算完工了。"
 arkship.1375.b: "完成全部检测流程。"
 refurbishment_inspection_hold: "检验导致施工暂缓"
 refurbishment_inspection_hold_desc: "在最终结构认证完成之前，所有安装和施工工作已暂停。"
 arkship.1380.name: "结构大修完成"
 arkship.1380.desc.full: "方舟舰§Y[Target.GetName]§!的最后一个区段已完成清理、认证，并已归还给居民。虽然最初出于必要性我们对部分区域实行了破坏工程，但最终我们的工程铸就了一项伟大的成就。飞船给人的感觉焕然一新：不仅结构坚固，而且在某种程度上更像是它本应成为的飞船。\n\n工程兵团已提交最终报告，并附有几项强烈建议。如何利用这项工作的成果，将由领导层决定。"
 arkship.1380.desc.partial: "方舟舰§Y[Target.GetName]§!的检修已宣布完成。结构完整性评估证实，与基准相比，性能有了显著改善，尽管熟悉最初提案的人会注意到并非所有需求规格都已达成，也并非所有公差都已优化。\n\n项目取得了成果。但本可以做得更好。"
 arkship.1380.desc.rushed: "方舟舰§Y[Target.GetName]§!的检修已完成。文件已签署，脚手架已拆除，施工组成员也已离开。\n\n结构审查委员会以某种外交辞令指出，最终产品在所有评估类别中都达到了最低认证标准。这艘船比以前更好了。至于它是否达到了最佳状态，工程兵团选择了不公开质疑。"
 arkship.1380.desc.full.machine: "§Y[Target.GetName]§!的修复工作已完成。所有区域均已通过认证并恢复全面运行状态。结构完整性评估证实，在所有测量类别中，输出均超过修复前的基线。\n\n最终报告已记录。优化建议可供实施。"
 arkship.1380.desc.partial.machine: "§Y[Target.GetName]§!的修复已确认完成。结构完整性评估证实，修复后情况较修复前基线有所改善。然而，有几个参数是在最低阈值而非建议规范下最终确定的。\n\n结果在可接受范围内。"
 arkship.1380.desc.rushed.machine: "§Y[Target.GetName]§!的修复已记录为最终完成。结构审查子程序已认证该结果符合所有评估类别的最低标准。\n\n相对于基线的运行改进已确认。优化潜力未完全实现。"
 arkship.1380.desc.full.hive: "§Y[Target.GetName]§!的翻新已完成。每个部分都经过验证、重建，并已归还给殖民地。集体以新的连贯性共鸣着，熟悉的重量如同一个再次完整的容器，从最深处的能源节点到最高的筑巢室都结构完好。\n\n我们完整了。殖民地选择将其新生的力量导向何处。"
 arkship.1380.desc.partial.hive: "§Y[Target.GetName]§!的续建已宣布完成。结构评估证实，相较于该船之前的状态，它确实得到了改善。我们不安地意识到，并非所有规范都得到了满足，也并非所有结构裕度都得到了充分优化。\n\n殖民地变得更强大了。尽管它本可以更强大。"
 arkship.1380.desc.rushed.hive: "§Y[Target.GetName]§!的翻新已经完成。脚手架已拆除，区域已开放，被转移的工蜂已返回指定位置。我们不安地意识到，我们在所有评估类别中仅达到了最低认证标准。\n\n翻新达到了其目的。至于它是否发挥了其潜力，我们选择不去深究。"
 arkship.1380.a: "委托电网改进项目。"
 arkship.1380.b: "将资源直接用于栽培系统。"
 arkship.1380.c: "投资防御系统的大修。"
 arkship.1380.d: "着重于居民区的扩建。"
 refurbishment_ongoing_gestalt: "全面翻修：正在进行"
 refurbishment_ongoing_gestalt_desc: "这艘方舟舰正在进行全面的结构翻修。多个区域的施工活动正在导致飞船范围内的稳定性、子个体生产力和区域建造能力的全面中断。"
 refurbishment_city_offline_gestalt: "$district_ark_city$：翻新中"
 refurbishment_city_offline_gestalt_desc: "方舟舰的主要居住区因结构工程已被封锁。我们都挤在剩余的区域，住房和工人生产力都承受着巨大压力。"
 refurbishment_low_morale_gestalt: "搬迁导致不满情绪"
 refurbishment_low_morale_gestalt_desc: "拥挤的环境和不足的支援正在损害全船的稳定性和凝聚力。"
 refurbishment_construction_fatigue_gestalt: "建造乏力"
 refurbishment_construction_fatigue_gestalt_desc: "我们正从一段持续运行的时期中恢复过来。在新运行周期确立期间，产量会有所下降。"
 refurbishment_administrative_burden_gestalt: "行政负担"
 refurbishment_administrative_burden_gestalt_desc: "管理福利项目对中央复合思维提出了很高的要求。"
 refurbishment_power_grid: "优化电网"
 refurbishment_power_grid_desc: "发电机区域的检修已达到最高标准。翻新的基础设施显著提高了整艘船的能源输出。"
 refurbishment_power_grid_partial: "改进电网"
 refurbishment_power_grid_partial_desc: "发电区划的改造显著提升了能源输出，尽管并非所有指标都完全达到。"
 refurbishment_power_grid_weak: "修补电网"
 refurbishment_power_grid_weak_desc: "发电区划在翻修后已通过验收并投入运营。一些计划中的升级改造尚未完成，但能源输出比基线略有提高。"
 refurbishment_cultivation_decks: "改建栽培甲板"
 refurbishment_cultivation_decks_desc: "农业区划的彻底改造已按最高规格完成。"
 refurbishment_cultivation_decks_partial: "改良栽培甲板"
 refurbishment_cultivation_decks_partial_desc: "农业革新显著改善了粮食生产，尽管有几项计划中的升级被推迟或简化了。"
 refurbishment_cultivation_decks_weak: "修补栽培甲板"
 refurbishment_cultivation_decks_weak_desc: "该区划在翻新后获得了验收。产量略有提高，但许多计划中的升级并未完全实施。"
 refurbishment_defense_systems: "强化防御系统"
 refurbishment_defense_systems_desc: "这个区段的检修已按最高标准完成。这艘方舟舰在战斗中变得更加坚韧了。"
 refurbishment_defense_systems_partial: "改良防御系统"
 refurbishment_defense_systems_partial_desc: "防御系统的翻新显著提升了方舟舰的作战能力。尽管一些结构余量被设定为可接受而非推荐的公差。"
 refurbishment_defense_systems_weak: "修补防御系统"
 refurbishment_defense_systems_weak_desc: "经过翻修，防御区段已通过验证。然而，几项计划中的加固升级尚未完成。"
 refurbishment_power_grid_gestalt: "优化电网"
 refurbishment_power_grid_gestalt_desc: "发电区划的检修已按照最高标准完成。翻新后的基础设施显著提高了整个集体的能源产量和运营效率。"
 refurbishment_power_grid_partial_gestalt: "改进电网"
 refurbishment_power_grid_partial_gestalt_desc: "发电区划的翻新显著提升了能源输出和运营效率，尽管一些导管升级达到了可接受而非最佳的公差。"
 refurbishment_power_grid_weak_gestalt: "修补电网"
 refurbishment_power_grid_weak_gestalt_desc: "发电区划在翻修后已获得正式运营的验收。然而，一些计划中的升级改造尚未完成。"
 refurbishment_cultivation_decks_gestalt: "改建栽培甲板"
 refurbishment_cultivation_decks_gestalt_desc: "农业区划改造已按最高标准完成。舰船上的产量和质量都显著提高。"
 refurbishment_cultivation_decks_partial_gestalt: "改良栽培甲板"
 refurbishment_cultivation_decks_partial_gestalt_desc: "我们对生产环境进行了显著改进，尽管有几项计划中的升级被推迟或简化了。"
 refurbishment_cultivation_decks_weak_gestalt: "修补栽培甲板"
 refurbishment_cultivation_decks_weak_gestalt_desc: "这个区划在翻新后获得了验收。生产力略有提高，尽管许多计划中的升级并未完全实施。"
 refurbishment_residential_expansion_gestalt: "居民区扩建"
 refurbishment_residential_expansion_gestalt_desc: "居住区大修已按最高标准完成。现代化支持系统改善了船上各处的状况。"
 refurbishment_residential_expansion_partial_gestalt: "居民区部分扩建"
 refurbishment_residential_expansion_partial_gestalt_desc: "住宅翻修显著改善了集体凝聚力，尽管原计划的扩建并未完全实现。"
 refurbishment_residential_expansion_weak_gestalt: "居民区旧房改造"
 refurbishment_residential_expansion_weak_gestalt_desc: "该区划在翻修后获得了验收，尽管许多计划中的升级并未完全实施。"
 refurbishment_fleet_capacity: "扩大舰队容量"
 refurbishment_fleet_capacity_desc: "近期方舟舰的改造加强了其军事基础设施，引入了许多现代化的设计，使得更广泛的舰队能够以更大的容量运行。"
 refurbishment_residential_expansion: "居民区扩建"
 refurbishment_residential_expansion_desc: "住宅区的全面整修已达到了最高标准。现代化的支持系统显著改善了所有居民的生活条件。"
 refurbishment_residential_expansion_partial: "居民区部分扩建"
 refurbishment_residential_expansion_partial_desc: "尽管未实现预期的全面扩张，但住宅翻修显著改善了居住条件并提升了管理效率。"
 refurbishment_residential_expansion_weak: "居民区旧房改造"
 refurbishment_residential_expansion_weak_desc: "该住宅区在翻修后获得了验收。住房容量略有改善，尽管许多计划中的升级未能完全实施。"
 # Star-Crossed Lovers
 arkship.1385.name: "舱体"
 arkship.1385.desc: "我们的远程扫描仪发现了一个在系统边缘漂浮的物体。进一步检查发现其外表下存在精确的几何不一致，以及厚厚岩石外壳下埋藏的休眠能量信号。\n\n这是一个来源不明的救生舱，其外部经过伪装，以躲避广阔太空中的探测。未检测到任何主动传输，但舱内仍存在微弱的生命维持痕迹。无论里面是什么，都已经漂浮了很长时间。"
 arkship.1385.a: "让我们看看里面有什么。"
 arkship.1385.b: "就把这石头当石头看吧。"
 arkship.1390.name: "吾之挚爱"
 arkship.1390.desc: "矿物外壳之下，我们发现了一个严重受损的休眠舱。舱内有一名乘员，早已死亡。此人的身体披着华丽的仪式长袍，不适合太空旅行。看来此人是被仓促地强行塞进去的。\n\n休眠舱内部有明显的暴力痕迹。几处内部束缚装置曾被强行使用。这个容器并非避难所，而是一个囚牢。只找到了两件物品：一组坐标和一封密封的信件。上面刻着简单的铭文：\n\n§H“致吾爱。”§!"
 arkship.1390.a: "设置前往该坐标的航线。"
 arkship.1390.b: "我们不应该在这上面浪费时间。"
 arkship.1395.name: "最后幸存者"
 arkship.1395.desc: "我们终于抵达了由恢复的坐标所指向的休眠舱。在里面，我们发现了另一个生物，它还奄奄一息。\n\n身体损伤非常严重。长期的休眠失败让[event_target:star_crossed_survivor.GetHimHer]濒临死亡。两个休眠舱显然很久以前就已分离，从未抵达目的地。\n\n我们已经稳定住了这个外星人，它要求我们称呼[event_target:star_crossed_survivor.GetHimHer]为[event_target:star_crossed_survivor.GetName]。完全康复仍遥遥无期。"
 arkship.1395.a: "确保[event_target:star_crossed_survivor.GetHeShe]能够康复。"
 arkship.1400.name: "大屠杀"
 arkship.1400.desc: "[event_target:star_crossed_survivor.GetName]的证词是在[event_target:star_crossed_survivor.GetHisHer]康复期间记录的：\n\n§H“发生了一场大屠杀。整个家庭被抹去。根据官方通告，那是一个敌对帝国的袭击。但那是一个谎言。当权者自己策划了这一切，一个捏造的暴行，只为了一场毫无意义的战争辩护。我的爱人和我找到了证据。内部指令。未篡改的日志。\n\n“我们发布了它。我们预料到了后果。我们没有预料到的是流放。”§!\n\n休眠舱数据库虽然有所损坏，但该记录可恢复。这份记录现在掌握在我们手中。"
 arkship.1400.a: "我们找到了你爱人的留言。"
 arkship.1405.name: "血腥的战争"
 arkship.1405.desc: "[event_target:star_crossed_survivor.GetName]的证词在[event_target:star_crossed_survivor.GetHisHer]康复期间被完整记录下来：\n\n§H“舰队已然逼近，我们早在他们抵达之前就看到了。自我们拒绝[event_target:star_crossed_empire.GetName]的臣服要求以来，他们已经对我们发动了多年的战争。我们的军队实力悬殊，根本无法匹敌。\n\n“最终，我的父母将他们的希望寄托在这些休眠舱上。他们把我和我所爱的人强行送入虚空，我们的生存渺茫，我们的重逢只能听天由命，只希望能重新开始。”§!\n\n对休眠舱系统进行调查后，我们发现了许多战时工程数据。"
 arkship.1405.a: "$arkship.1400.a$"
 arkship.1410.name: "危险的发现"
 arkship.1410.desc: "[event_target:star_crossed_survivor.GetName]在[event_target:star_crossed_survivor.GetHisHer]康复期间，完整地记录了其陈述：\n\n§H“我们的帝国曾以尊重生命和死亡为荣。我们的宗旨是延长生命，并减轻生死之间的过渡，但绝不是完全超越它。通过机械飞升实现永生，是对我们信仰的亵渎。这种知识本不该被掌握。但好奇心在民众中蔓延开来。当它无法再被遏制时，统治当局认为风险不可接受。\n\n“他们选择了抹除。我们的帝国被摧毁以埋葬真相。只有我和我的爱人幸免于难，被迫进入这些休眠舱，注定在生与死之间漂泊。”§!\n\n休眠舱的数据核心也已解密。"
 arkship.1410.a: "$arkship.1400.a$"
 arkship.1415.name: "野望"
 arkship.1415.desc: "[event_target:star_crossed_survivor.GetName]在[event_target:star_crossed_survivor.GetHisHer]康复期间记录下了这份自述：\n\n§H“我有个同事。一个朋友，至少我是这么认为的。我们一起工作了好几年。当我被任命领导这个项目时，[event_target:star_crossed_survivor.GetHeShe]向我表示了祝贺。\n\n“一个月后，我和我的爱人被捕了。莫须有的罪名。没有审判。我还没来得及问为什么，我们就被关进了休眠舱。我现在明白了，野心不需要理由。它只需要一个机会。”§!\n\n来自休眠舱内部系统的个人日志为我们提供了帝国治理的详细记录。"
 arkship.1415.a: "$arkship.1400.a$"
 arkship.1420.name: "害虫"
 arkship.1420.desc: "[event_target:star_crossed_survivor.GetName]的陈述在[event_target:star_crossed_survivor.GetHisHer]康复期间被完整记录下来：\n\n§H“一种无情的病毒席卷了我们的帝国。我们的人民迅速而无情地死去。据信它起源于我们庞大的垃圾填埋场之一，这是我们自身过度和粗心大意的后果。我所爱的人和我在末日来临之前选择与我们的人民站在一起。\n\n“但我的父母介入了。违背我们的意愿，我们被迫进入这些休眠仓，被抛弃。这项技术本应保存我们。看来它失败了。”§!\n\n已回收休眠仓生命维持系统中的生物残留物。"
 arkship.1420.a: "$arkship.1400.a$"
 arkship.1425.name: "隐藏的协定"
 arkship.1425.desc: "[event_target:star_crossed_survivor.GetName]在康复期间完整记录了[event_target:star_crossed_survivor.GetHisHer]的叙述：\n\n§H“我的父母知道[event_target:star_crossed_empire.GetName]即将苏醒。为了获得它的青睐，他们不惜一切代价达成了一项交易。我们四分之一的人口被献祭，以换取力量。我和我的爱人发现了他们的阴谋。\n\n“但很少有人听信，而那些听信的人则被灭口。我们被迫进入这些休眠舱，被投入虚空，如同之前许多人一样，被抛弃了。”§!\n\n休眠舱密封舱室中的文件已被发现。"
 arkship.1425.a: "$arkship.1400.a$"
 arkship.1430.name: "禁忌的结合"
 arkship.1430.desc: "[event_target:star_crossed_survivor.GetName]在[event_target:star_crossed_survivor.GetHisHer]康复期间，完整地记录了他的陈述：\n\n§H“我并非因我所做之事而被流放。我是因我所爱之人而被流放。\n\n“我们的人民正在交战。我们已交战了数代。在我们人民眼中，我们的结合是一种无法被忽视的逾矩。我们拒绝分开，相信我们的结合或许能展示和平的价值。\n\n“我们被迫进入这些休眠舱，被投入无尽的虚空。但我们的爱无法被割裂。”§!\n\n在该休眠舱中发现了两位流亡者之间的私人通信。阅读它们令人深受鼓舞。"
 arkship.1430.a: "$arkship.1400.a$"
 arkship.1435.name: "虚空中的低语"
 arkship.1435.desc: "[event_target:star_crossed_survivor.GetName]的自述在[event_target:star_crossed_survivor.GetHisHer]康复期间被完整记录下来：\n\n§H“它最初只是思绪边缘的一个存在。后来我听到了声音。低语声一直跟着我，随着时间的推移变得越来越清晰，说的是一些零碎的词句。我的人民害怕我变成了什么样子，但我的爱人一直在我身边。\n\n“我们一起被迫进入这个逃生舱，被抛入虚空，在任何可能触及我心智的东西扩散之前就被移走了。即使现在，我仍然能听到它。低语着。”§!\n\n逃生舱的传感器日志揭示了大量有趣的数据。"
 arkship.1435.a: "$arkship.1400.a$"
 arkship.1440.name: "最后的遗言"
 arkship.1440.desc: "[event_target:star_crossed_survivor.GetName]的状况迅速恶化。就在其临终前不久，我们解密了伴侣舱发出的加密信息。信息内容如下：\n\n§H“我的挚爱，\n\n如果你听到这段话，那么命运对你比对我更仁慈。请知道，即使在虚空中，我也从未孤单，我始终与你同在。”§!\n\n信息结束后不久，[event_target:star_crossed_survivor.GetName]的生命体征停止了。自从苏醒以来，[event_target:star_crossed_survivor.GetHisHer]的表情第一次如此平静。"
 arkship.1440.a: "安息吧，[event_target:star_crossed_survivor.GetName]。"
 arkship.1440.a.tooltip: "他们的最终证词为我们提供了关于[event_target:star_crossed_empire.GetName]的宝贵情报。"
 star_crossed_lovers_chain_title: "亡命鸳鸯"
 star_crossed_lovers_chain_desc: "一个密封的信息和一组从漂流的休眠舱中回收的坐标。无论它们背后隐藏着什么故事，它都等待了很长时间才被世人发现。"
 STAR_CROSSED_POD_PROJECT: "扫描舱体"
 STAR_CROSSED_POD_PROJECT_DESC: "我们必须仔细扫描该物体，以确定其来源以及内部是否有任何东西在漫长的虚空漂流中幸存下来。"
 star_crossed_pod_object: "神秘的舱体"
 star_crossed_pod_object_tooltip: "神秘的舱体"
 star_crossed_pod_object_desc: "一个构成奇特的物体，其外部伪装成一颗普通的陨石。仔细检查会发现在岩石之下存在精确的几何不规则性。休眠的能量信号持续存在于其中。"
 star_crossed_survivor_pod_object: "救生舱"
 star_crossed_survivor_pod_object_tooltip: "救生舱"
 star_crossed_survivor_pod_object_desc: "第二个休眠舱，在虚空中漂流。它的系统状况比第一个稍好，但也仅此而已。微弱的生命支持迹象仍在其中闪烁。"
 STAR_CROSSED_SURVIVOR_POD_PROJECT: "扫描救生舱"
 STAR_CROSSED_SURVIVOR_POD_PROJECT_DESC: "我们必须飞到指定恒星系并扫描逃生舱，以确定其乘员是否还活着。"
 STAR_CROSSED_POD_PROJECT_REQUIREMENT: "轨道上有$COUNT$/$REQUIRED$艘方舟或者科研船。"
 star_crossed_survivor_pod_poi: "救生舱"
 star_crossed_survivor_pod_poi_desc: "从同伴的舱体中找回的坐标指向了这个恒星系。第二个救生舱漂浮在这里，其乘员不明。"
