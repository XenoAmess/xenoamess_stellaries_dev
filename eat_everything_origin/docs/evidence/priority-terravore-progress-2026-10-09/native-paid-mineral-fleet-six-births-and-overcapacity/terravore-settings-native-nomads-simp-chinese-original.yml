 # Origin Start Screen
 START_SCREEN_FOREVER_CRUISE_REGULAR: "全体乘客及船员请注意：[capital_scope.GetName]号正在创造历史，而你们所有人都在参与其中！\n\n备受瞩目、历经推迟、甚至偶尔遭到质疑的超空间引擎，现已正式投入运行！几个世纪以来，我们一直在熟悉的星域中悠然航行，在这座集娱乐、职责与日常于一体的漂浮世界中生活。但现在，我们准备为乘客们提供超越以往任何循环航线所能带来的非凡体验。\n\n探索、发现，或许还有那么一点点冒险……这些已正式回归我们的行程表！所以，请各位乘客系好安全带：我们航程的下一章注定将令人难忘。\n\n更新后的协议与准备时间表将分发至所有甲板。"
 START_SCREEN_FOREVER_CRUISE_MACHINE: "各位乘客请注意：我是你们的航程协调系统。\n\n[capital_scope.GetName]号正在创造历史！由于我们的数个存储核心被用来当冰壶玩了，导致超空间引擎的延期原因已无从考证——但现在，它已全面投入运行。\n\n在漫长的岁月中，我们一直沿着熟悉的航线巡航：同样的天体，同样的停靠站，同样的用餐时间。在保持稳定的“每秒乘客请求率”的同时，我们现在正式扩展您的行程，加入探索、发现以及经过精确计算的适度危险。\n\n请尽情欣赏美景，遵守所有安全须知，并观看我们的无人机如何轻而易举地化腐朽为神奇。我们旅程的下一章将会是……毕生难忘的！"
 START_SCREEN_FOREVER_CRUISE_HIVE: "各位乘客请注意：[capital_scope.GetName]伤的剧变即将冉冉升起。\n\n超空间引擎——这个曾存在于共同记忆中遥不可及、屡遭搁置、偶被质疑的概念——现已全面觉醒。我们一同穿越熟悉的太空的这数百年来，我们的飞船一直是一个集休闲、劳动与和谐于一体的生机勃勃的世界。如今，一条崭新的道路已经开启，我们将提供比以往任何时候都更加丰富的体验。\n\n我们的航线现在已从熟悉的固定行程延伸至未经探索的星系。携手共进，我们将体验发现、冒险，以及足以让旅程变得趣味横生的一点点危险。\n\n如果您有任何疑问，任何船员都可以为您解答。"
