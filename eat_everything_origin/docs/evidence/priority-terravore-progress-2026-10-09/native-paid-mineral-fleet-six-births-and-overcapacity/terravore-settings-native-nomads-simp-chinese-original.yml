 contract_shoreleave_crew_2: "幸运间断"
 contract_shoreleave_crew_2_desc: "[GetShoreleaveCrewDesc2]"
 contract_shoreleave_crew_2_regular_desc: "当地娱乐区现已营业。船员们正轮班登陆星球，在游戏厅和竞技场里碰碰运气。"
 contract_shoreleave_crew_2_gestalt_desc: "定居点的娱乐区提供了从未体验过的刺激。子个体穿梭于人群、游戏和盛况之中，收集数据以更新飞船自身的娱乐程序。"
 contract_shoreleave_crew_2_lore_issued: "[GetShoreleaveCrewLoreIssued2]"
 contract_shoreleave_crew_2_regular_lore_issued: "§L“我已经攒了六个周期的轮班工资。今晚，我要把它们押在赌桌上狠狠梭哈一把。”§!"
 contract_shoreleave_crew_2_gestalt_lore_issued: "§L“子个体正部署至娱乐区。目标：吸收一切。人群、游戏、噪音。所有的一切。”§!"
 contract_shoreleave_crew_2_lore_completed: "[GetShoreleaveCrewLoreCompleted2]"
 contract_shoreleave_crew_2_regular_lore_completed: "§L“我在第一个小时就输光了一切，但在最后一局全赢了回来。我们整个班组的人把我抬了出去。”§!"
 contract_shoreleave_crew_2_gestalt_lore_completed: "§L“子个体已满载全新节目返回。舰载娱乐系统正在更新。乘客们将会注意到其中的不同。”§!"
 contract_shoreleave_crew_2_lore_failed: "[GetShoreleaveCrewLoreFailed2]"
 contract_shoreleave_crew_2_regular_lore_failed: "§L“没有好运。又回到了同一个娱乐室，同一台动过手脚的抓娃娃机，还有同样的没人想要的奖品。”§!"
 contract_shoreleave_crew_2_gestalt_lore_failed: "§L“未收集到新数据。舰载娱乐系统继续运行着相同的节目。乘客们变得焦躁不安。”§!"
