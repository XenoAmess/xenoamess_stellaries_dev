 bombardment_plundering: "打劫"
 bombardment_plundering_desc: "$bombardment_plundering$轨道轰炸方式会用特殊的劫掠艇攻击敌方基础设施，掠夺资源。\n—对§Y陆军§!造成§E非常轻微§!伤害\n—对§Y行星§!造成§E中等§!伤害\n—在§Y70%荒废度§!状态下：每月有几率§Y窃取§!该§Y星球§!所产出资源的§G40%§!。星球上每多一支陆军都会相应降低此几率。"
 councilor_master_gunner: "火炮大师"
 councilor_master_gunner_desc: "他们致力于防守前哨，作为一名资深炮手，他们确保储备充足的炸药、炮弹和各种致命武器。"
