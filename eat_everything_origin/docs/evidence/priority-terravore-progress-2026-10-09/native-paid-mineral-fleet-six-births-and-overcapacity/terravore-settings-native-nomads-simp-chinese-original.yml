 tech_planetary_engineering: "行星工程学"
 tech_planetary_engineering_desc: "材料收集和加工方面的进步使得我们的方舟舰能够进行行星规模的资源开采，甚至根据需要重塑整个生物群落。"
 TECH_UNLOCK_CLEAR_BLOCKER_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§! $contract_clear_blockers$"
 TECH_UNLOCK_CLEAR_BLOCKER_CONTRACT_DESC: "$contract_clear_blockers$合约让我们清除阻碍殖民地发展的最常见障碍，以此来帮助星球上的居民。"
 TECH_UNLOCK_STELLAR_IGNITION_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§! $contract_stellar_ignition$"
 TECH_UNLOCK_STELLAR_IGNITION_CONTRACT_DESC: "$contract_stellar_ignition$合约允许我们将气态巨行星转化为新生恒星，为该恒星系解锁巨大的能源和研究资源。"
 TECH_UNLOCK_DEEP_SCAN_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§!$contract_deep_scan$"
 TECH_UNLOCK_DEEP_SCAN_CONTRACT_DESC: "$contract_deep_scan$合约能帮助我们在恒星系中发现更多未知事物。"
