 contract_espionage_support_passenger_2: "线人"
 contract_espionage_support_passenger_2_desc: "[GetEspionageSupportPassenger2]"
 contract_espionage_support_passenger_issuer_2_desc: "[GetEspionageSupportPassengerIssuer2]"
 contract_espionage_support_passenger_2_regular_desc: "我们正在策划一场全舰范围的情报行动。船员志愿者将被安插在各个甲板上，作为“叛逃者”向乘客小组输送机密简报。"
 contract_espionage_support_passenger_2_gestalt_desc: "各层甲板上的子个体将化身为来自下方星球的叛逃者，在完美的协同下，向不同的乘客群体同时提供机密简报。"
 contract_espionage_support_passenger_2_lore_issued: "§L“我的简报官在餐桌底下塞给我一张加密纸条。我的同桌们嫉妒极了。”§!"
 contract_espionage_support_passenger_2_lore_completed: "§L“有人告诉我，我帮助推翻了一个影子谍报网络。我知道那是假的。我依然感到自豪。”§!"
 contract_espionage_support_passenger_2_lore_failed: "§L“线人根本没出现。我在指定的卡座里坐了三个小时，就喝着同一杯酒。”§!"
 contract_espionage_support_passenger_2_chain_title: "$contract_espionage_support_passenger_2$"
 contract_espionage_support_passenger_2_chain_desc: "$contract_espionage_support_passenger_2_desc$"
