 sm_arkship_dark_matter_detector: "$sm_dark_matter_detector$"
 sm_arkship_dark_matter_detector_desc: "$sm_dark_matter_detector_desc$"
 sm_arkship_offspring_outlook: "$sm_offspring_outlook$"
 sm_arkship_offspring_outlook_desc: "一个允许后代监督和管理恒星系内正在进行的战斗，同时指挥方舟舰上孵化行动的模块。"
