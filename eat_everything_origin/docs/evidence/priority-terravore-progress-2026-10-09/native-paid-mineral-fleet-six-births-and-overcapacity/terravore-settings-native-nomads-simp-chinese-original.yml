 ##################
 civic_caravan_masters: "行商师傅"
 civic_caravan_masters_desc: "贸易是帝国的命脉，而贸易在稳定的中继站和商队的网络上发展得最好。"
 civic_caravan_masters_effects: "$t$—$GUARANTEED_RESEARCH_OPTION_STRING$ £engineering_research£ ['technology:tech_waystation_2']$TABBED_NEW_LINE$—家园星系：开局在一个较为富裕的星系，既有一座§H$starbase_waystation_1$§!已经建造完毕。"
 civic_caravan_masters_corporate: "动态后勤"
 civic_caravan_masters_corporate_desc: "一个由特许经营的深空商队客栈网络支持着这个游牧巨型企业的成长。"
 civic_caravan_masters_effects_corporate: "$civic_caravan_masters_effects$$TABBED_NEW_LINE$—£building£ §Y$building_commercial_forum$§!$megacorp_civic_branch_office_building_effect$"
 councilor_waystation_bosun: "驿站舵手"
 councilor_waystation_bosun_desc: "舵手会监控即使是最偏远的驿站，与独立的贸易商协调以确保所有站点都供应充足。"
 councilor_waystation_quota_auditor: "驿站配额审计署"
 councilor_waystation_quota_auditor_desc: "驿站的经理们深知不应引起审计员的注意，他们会充分发挥员工的才能，以确保始终完成定额。"
 civic_deep_sleep: "深度睡眠"
 civic_deep_sleep_desc: "这些游牧者是人体冷冻方面的专家，只在他们的方舟舰船员效率最高时才将其唤醒。"
 councilor_deep_sleep: "冷冻学主管"
 councilor_deep_sleep_desc: "低温休眠总监是个孤独的职业，漫长的旅途中必须保持清醒，只唤醒社会所需之人。"
 civic_corporate_deep_sleep: "冻结资产"
 civic_corporate_deep_sleep_desc: "这家游牧型巨型企业是冷冻领域的专家，只在预测有利可图时才解冻船员和客户。"
 councilor_corporate_deep_sleep: "首席休眠官"
 councilor_corporate_deep_sleep_desc: "首席人力资源官利用预测算法和员工效率值来优化员工的冷冻保存。"
