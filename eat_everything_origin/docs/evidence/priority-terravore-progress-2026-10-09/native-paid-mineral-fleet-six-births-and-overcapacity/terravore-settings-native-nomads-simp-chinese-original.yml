 NOMAD_EXPLORATION_PRECURSOR_CATEGORY_DESC: "§E要求：§!\n已探索§Y[root.precursor_system_seen]/[root.precursor_system_count]§!个星系。\n探索星系中的§Y先驱遗迹§!恒星系。\n§Y先驱遗迹§!是早已消亡帝国的残余。"
 NOMAD_EXPLORATION_SPACE_ECOLOGY: "空间生态学"
