 # Rogue Servitor + Forever Cruise civic swap
 civic_machine_servitor_forever_cruise: "食宿机侍"
 civic_machine_servitor_forever_cruise_desc: "诞生于一个崇尚奢华的时代，这台机械智能曾是豪华星际游轮上殷勤周到的主人。它的航程早已超越了最初乘客的生命，却依然宠溺着每一代新人，仿佛这场巡游才刚刚开始。"
 civic_tooltip_machine_servitor_forever_cruise_effects: "$t$—§H乘客§!必须使用§Y$living_standard_organic_trophy$§!生活标准，并提供§G额外的+1%§!复合子个体岗位效率\n$t$—§H经济舱乘客§!将被替换为§Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!\n$t$—§R乘客需求更难满足§!"
