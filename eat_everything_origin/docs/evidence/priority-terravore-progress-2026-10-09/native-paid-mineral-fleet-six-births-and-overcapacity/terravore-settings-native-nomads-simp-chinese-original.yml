 nomads.4700.c: "我们将继续翱翔星辰。"
 nomads.4700.settle_subject.tt: "§Y[event_target:settling_arkship.GetName]§!将作为§Y[event_target:player_country.GetName]§!的一个新['concept_subject']定居在§Y[event_target:settled_planet.GetName]§!。\n\n"
