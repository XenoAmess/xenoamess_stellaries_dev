 contract_suntrip_passenger_1: "日光游"
 contract_suntrip_passenger_1_desc: "我们将进入轨道，让乘客们沉浸在陌生太阳的光辉之中。"
 contract_suntrip_passenger_1_lore_issued: "§L“面对脉冲星，你需要多高的防晒指数？”§!"
 contract_suntrip_passenger_1_lore_completed: "§L“我们能不能一直留在轨道上？自从登舰以来，我就没觉得这么温暖过。”§!"
 contract_suntrip_passenger_1_lore_failed: "§L“看来丽都甲板上的紫外线灯只能将就一下了。又得这样。”§!"
