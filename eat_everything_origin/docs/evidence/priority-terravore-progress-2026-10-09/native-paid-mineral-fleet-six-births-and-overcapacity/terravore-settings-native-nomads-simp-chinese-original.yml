 contract_suntrip_crew_5: "水循坏利用"
 contract_suntrip_crew_5_desc: "水循环系统需要进行一次高强度的紫外线杀菌，此过程只有在近恒星轨道上才能高效完成。疗愈中心与游泳池现已关闭，各层甲板均实行限量供水。"
 contract_suntrip_crew_5_lore_issued: "[GetSuntripCrewLoreIssued5]"
 contract_suntrip_crew_5_regular_lore_issued: "§L“现在正在排空泳池和疗愈池。如果乘客问起，就说是深度清洁日。我们不要提及细菌读数。”§!"
 contract_suntrip_crew_5_gestalt_lore_issued: "§L“正在排空泳池和水疗池。已告知乘客今天是常规深度清洁日。细菌读数未公开。”§!"
 contract_suntrip_crew_5_lore_completed: "[GetSuntripCrewLoreCompleted5]"
 contract_suntrip_crew_5_regular_lore_completed: "§L“回收槽已清理。水流已恢复清澈。在其他人提出正式投诉之前，正在为水池重新注水。”§!"
 contract_suntrip_crew_5_gestalt_lore_completed: "§L“回收水箱已清空。水质正常。泳池与水疗池正在注水。”§!"
