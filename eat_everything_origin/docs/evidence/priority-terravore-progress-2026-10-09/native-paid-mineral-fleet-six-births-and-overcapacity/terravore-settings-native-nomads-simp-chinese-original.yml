 contract_shoreleave_passenger_3: "文化考察"
 contract_shoreleave_passenger_3_desc: "该星球的首都设有一座享誉星系的博物馆。乘客们一直在请愿，要求安排带有导游的游览活动，以参观其中的纪念碑和历史展品。"
 contract_shoreleave_passenger_3_lore_issued: "§L\"我把旅行指南读了三遍。我还是看不懂他们的历法，但建筑看起来令人惊叹。\"§!"
 contract_shoreleave_passenger_3_lore_completed: "§L\"他们的战争纪念碑发人深省。他们的美术馆令人费解。我热爱其中的每一刻。\"§!"
 contract_shoreleave_passenger_3_lore_failed: "§L\"我看了那么多遍旅游指南，感觉自己好像已经去过了。也许这更糟。\"§!"
