 sm_arkship_armor: "装甲覆层"
 sm_arkship_armor_desc: "厚重的装甲板用螺栓固定在方舟舰最暴露的部位。这些重量对各个系统提出了更高的要求，但方舟舰承受住了。"
 sm_arkship_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些通用槽位将会装有§Y装甲§!并自动升级到我们最新的科技水平。"
 sm_arkship_lm_armor: "再生$sm_arkship_armor$"
 sm_arkship_lm_armor_desc: "活体金属穿梭于舰体装甲之中，在缺口出现的瞬间便将其封闭。"
 sm_arkship_lm_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_LM_ARMOR_1$§!并自动升级到我们最新的科技水平。"
 sm_arkship_archaeo_armor: "$tech_archaeoarmor$"
 sm_arkship_archaeo_armor_desc: "挖掘出的未知合金成分制造的舰壳板。无论是什么文明建造了这些飞船，都没打算让它们轻易被摧毁。"
 sm_arkship_archaeo_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_ARCHAEO_ARMOR$§!。"
 sm_arkship_shield: "护盾阵列"
 sm_arkship_shield_desc: "遍布舰体的发射器阵列投射出重叠的护盾力场，吸收敌人向我们倾泻的最猛烈的火力。"
 sm_arkship_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y护盾§!并自动升级到我们最新的科技水平。"
 sm_arkship_psi_shield: "$tech_psionic_shield$"
 sm_arkship_psi_shield_desc: "灵能护盾触及了常规偏导护盾无法触碰的现实层面。本该命中的冲击，却落空了。"
 sm_arkship_psi_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_PSI_SHIELD$§!。"
 sm_arkship_archaeo_shield: "$tech_archaeoshield$"
 sm_arkship_archaeo_shield_desc: "打捞回收的未知设计的护盾发生器，比现代工程学制造的任何设备都要高效。"
 sm_arkship_archaeo_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y$LARGE_ARCHAEO_SHIELD$§!。"
 sm_arkship_crystal_plating: "$tech_crystal_armor_1$"
 sm_arkship_crystal_plating_desc: "致密的晶体复合面板附着在外部船体上，可针对所有形式的来袭伤害提供强大的防护。"
 sm_arkship_crystal_plating_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$这些专用槽位将会装有§Y晶体覆层§!并自动升级到我们最新的科技水平。"
 sm_arkship_afterburner: "$tech_afterburners_1$"
 sm_arkship_afterburner_desc: "当常规推进器不足时，用于拉近距离或脱离交战的紧急推力系统。"
 sm_arkship_afterburner_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备§Y$tech_afterburners_1$§!，并会自动升级至我们的最新技术。"
 sm_arkship_armor_hardener: "$tech_armor_hardeners_1$"
 sm_arkship_armor_hardener_desc: "能够在撞击前的瞬间选择性硬化船体的反应装甲。"
 sm_arkship_armor_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备§Y$tech_armor_hardeners_1$§!，并会自动升级至我们的最新技术。"
 sm_arkship_shield_hardener: "$tech_shield_hardeners_1$"
 sm_arkship_shield_hardener_desc: "能够在战斗中切换护盾谐波的频率调制器，可降低那些旨在绕过护盾的武器所造成的穿透力。"
 sm_arkship_shield_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$这些专用辅助槽位将装备 §Y$tech_shield_hardeners_1$§!，并自动升级至我们的最新技术。"
 tech_nomads_titans: "$tech_titans$"
 tech_nomads_titans_desc: "$tech_titans_desc$"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§!方舟光环"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_DESC: "§H方舟光环§!\n舰队支援技术的进步使方舟舰现在能够装备与泰坦巨舰使用的同类型光环。"
 sm_arkship_quantum_destabilizer: "$SHIP_AURA_QUANTUM_DESTABILIZER$"
 sm_arkship_quantum_destabilizer_desc: "方舟舰的质量使其能够投射出力场，干扰附近敌舰的武器系统，从而降低其射速。"
 sm_arkship_subspace_snare: "$SHIP_AURA_SUBSPACE_SNARE$"
 sm_arkship_subspace_snare_desc: "由方舟舰投射的子空间锚定场，可阻止敌方舰船通过超光速手段逃脱。"
 sm_arkship_shield_dampener: "$SHIP_AURA_SHIELD_DAMPENER$"
 sm_arkship_shield_dampener_desc: "安装在舰体各处的干扰发射器会压制附近敌舰的护盾，限制其最大防护能力。"
 tech_nomads_juggernaut: "$tech_juggernaut$"
 tech_nomads_juggernaut_desc: "$tech_juggernaut_desc$"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§!方舟光环"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_DESC: "§H方舟光环§!\n舰队支援技术的进步使方舟舰现在能够装备与主宰巨舰使用的同类型光环。"
 sm_arkship_aura_strike_craft: "$SHIP_AURA_STRIKE_CRAFT$"
 sm_arkship_aura_strike_craft_desc: "方舟舰广播飞行协调信号，提升附近友方舰载机的战斗力。"
 sm_arkship_aura_hyperlane: "$SHIP_AURA_HYPERLANE$"
 sm_arkship_aura_hyperlane_desc: "方舟舰投射的导航信标改进了舰队中所有舰船的超空间引擎计算。"
 sm_arkship_aura_pd_penetration: "$SHIP_AURA_PD_PENETRATION$"
 sm_arkship_aura_pd_penetration_desc: "方舟舰发出的电子反制广播扰乱了敌方的点防御瞄准，使我方武器得以突破拦截。"
 sm_arkship_aura_bombardment: "$SHIP_AURA_BOMBARDMENT$"
 sm_arkship_aura_bombardment_desc: "由方舟舰部署的火控中继提升了整个舰队的轨道轰炸精度。"
 sm_arkship_aura_range: "$SHIP_AURA_RANGE$"
 sm_arkship_aura_range_desc: "方舟舰阵列共享的瞄准数据扩大了舰队中每艘舰船的有效交战距离。"
 sm_arkship_energy_hub: "超导线圈"
 sm_arkship_energy_hub_desc: "超导电缆网格贯穿船体，消除了电阻损耗，并最大化了向各个系统的电力输送。"
 sm_arkship_food_hub: "气候优化控制站"
 sm_arkship_food_hub_desc: "将每一个种植舱和水培甲板推至运行极限的环境控制系统。"
 sm_arkship_hydroponics_bay: "扩建栽培甲板"
 sm_arkship_hydroponics_bay_desc: "船体的部分区段被改造用于大规模水培种植。"
 sm_arkship_harvest_processing_arrays: "采集品处理阵列"
 sm_arkship_harvest_processing_arrays_desc: "专用处理阵列与舱外活动整备设施，显著增强了方舟船在轨道沉积物收集与提炼方面的作业能力。"
 sm_arkship_trade_hub: "外部后勤系统"
 sm_arkship_trade_hub_desc: "外部舰体上的货运轨道与磁力对接系统优化了方舟舰与合作舰船之间的资源传输。"
 sm_arkship_bureaucracy_hub: "行政协调中心"
 sm_arkship_bureaucracy_hub_desc: "行政处理中心分布在多个甲板上，让我们的治理运作如同引擎般顺畅。"
 sm_arkship_synapse_hub: "突触中继器"
 sm_arkship_synapse_hub_desc: "加速方舟舰上共享意识决策的神经中继集群。"
 sm_arkship_maintenance_hub: "维护中枢"
 sm_arkship_maintenance_hub_desc: "专用维修舱确保每个部件在出现问题之前都能得到监控、维护和更换。在太空中，小故障与灾难之间只有一线之隔。"
 sm_arkship_consumer_goods_hub: "产业装配线"
 sm_arkship_consumer_goods_hub_desc: "装配线被重新用于消费品生产，在满足民众基本需求的同时，提供他们想要的商品。"
 sm_arkship_alloys_hub: "高能熔炉"
 sm_arkship_alloys_hub_desc: "合金熔炼设施的运行已达到船体所能安全承受的极限。"
 sm_arkship_psi_corps: "灵能军团"
 sm_arkship_psi_corps_desc: "这座设施深藏于方舟舰的船体深处，与人口聚居的环形区域相隔绝，专门用于训练具有灵能天赋的个体，使灵能军团得以对全体居民保持密切监视。\n\n§Y灵能军团是你的朋友。信任军团。§!\n\n£job_telepath£ $job_telepath_plural$可产出£unity£ §Y$unity$§!，降低 £crime£ §Y$PLANET_CRIME_TITLE$§!，并提升$mod_psionic_pop_bonus_workforce_mult$。\n"
 sm_arkship_psi_corps_hive_mind: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_hive_mind: "这座设施位于方舟舰深处，远离人口稠密的环带，专门用于训练有心灵异能天赋的工蜂，并让这批灵能军团监视蜂群。\n\n§Y这批灵能军团能够保护你，相信它们。§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_psi_corps_machine_intelligence: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_machine_intelligence: "这座设施位于方舟舰深处，远离人口稠密的环带，专门用于训练有灵能天赋的单位，并让这批灵能军团巡检无人机群。\n\n§Y这批灵能军团能够保护你，相信它们。§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_shield_generator: "护盾增幅器"
 sm_arkship_shield_generator_desc: "强化主护盾网的次级发射器阵列，为船体增加了另一层保护。"
 sm_arkship_galactic_stock_exchange: "证券交易所"
 sm_arkship_galactic_stock_exchange_desc: "一个全天候运作的交易大厅，将我们的市场与我们途经的每一个帝国的市场连接起来。"
 sm_arkship_embassy_complex: "使馆综合体"
 sm_arkship_embassy_complex_desc: "接待来自星系各地使节的外交套房与接待大厅。好客之道，四海皆通。"
 sm_arkship_noble_estates: "贵族庄园"
 sm_arkship_noble_estates_desc: "专为贵族保留的镀金居住区，其财富与权势随船同行。"
 sm_arkship_slave_processing_facility: "轨道奴隶处理中心"
 sm_arkship_slave_processing_facility_desc: "用于管理奴隶人口的处理设施，确保在我们访问的每一个星系中都能保持高效的劳动力分配。"
 sm_arkship_resource_silo: "$sm_resource_silo$"
 sm_arkship_resource_silo_desc: "$sm_resource_silo_desc$"
 sm_arkship_listening_post: "$sm_listening_post$"
 sm_arkship_listening_post_desc: "$sm_listening_post_desc$"
 sm_arkship_fleet_academy: "$sm_fleet_academy$"
 sm_arkship_fleet_academy_machine_intelligence: "$sm_fleet_academy_machine_intelligence$"
