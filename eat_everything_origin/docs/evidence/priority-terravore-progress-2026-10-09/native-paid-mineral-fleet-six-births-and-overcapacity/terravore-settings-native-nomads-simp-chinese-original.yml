 CONTRACT_SUNTRIP_passenger_4_PROJECT_DESC: ""
 contract_suntrip_passenger_5: "星光盛典"
 contract_suntrip_passenger_5_desc: "一场盛大的正式舞会将在观景甲板上举行，沐浴在直射的星光下。这是此次航程中的社交盛事。"
 contract_suntrip_passenger_5_lore_issued: "§L“他们要为此打开全景视窗了。终于有理由把正装翻出来了。”§!"
 contract_suntrip_passenger_5_lore_completed: "§L“我在异星太阳的光芒下跳过舞。这艘船上没有任何事物能超越它。”§!"
 contract_suntrip_passenger_5_lore_failed: "§L“盛典推迟了。我的礼服绶带白熨了。”§!"
