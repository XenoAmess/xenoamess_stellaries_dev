 ADDS_ARKSHIP_L_UTILITY_SLOTS: "£ship_l_slot£通用槽位：§G+3§!"
 ADDS_ARKSHIP_AUX_SLOTS: "£ship_a_slot£辅助槽位：§G+3§!"
