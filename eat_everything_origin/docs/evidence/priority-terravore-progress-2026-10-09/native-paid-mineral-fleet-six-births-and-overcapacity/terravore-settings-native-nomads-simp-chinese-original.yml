 ARKSHIP_SPINAL_MOUNT: "轴基挂载"
 ADDS_ARKSHIP_T_SLOTS: "额外£ship_t_slot£武器槽：§G+1§!"
 sm_arkship_spinal_devastator_mount: "毁灭者挂载"
 sm_arkship_spinal_devastator_mount_desc: "它的电力需求如此巨大，以至于仅一次发射就让数百万家庭陷入数小时的黑暗。下达开火的决议从来不是一件轻松事。"
 sm_arkship_spinal_devastator_mount_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$该轴基挂载装配了§Y$ARKSHIP_DEVASTATOR_WEAPON$§!。"
 ARKSHIP_DEVASTATOR_WEAPON: "毁灭者大炮"
 sm_arkship_capital_shipyard: "主力舰船坞"
 sm_arkship_capital_shipyard_desc: "这些船厂坐落在方舟舰的核心地带，让我们在穿越繁星的同时，建造规模空前的舰船。"
 sm_arkship_capital_shipyard_tt: "船坞：§Y允许建造主力舰§!"
 arkship_capital_shipyard_trigger: "$TRIGGER_FAIL$§R需要§Y$sm_arkship_capital_shipyard$§!轴基挂载。§!"
 sm_arkship_planetary_refinery: "行星再处理器"
 sm_arkship_planetary_refinery_desc: "较小的天体可以在这些巨大的齿轮中被粉碎和加工，为我们提供丰富的材料。"
 sm_arkship_planetary_refinery_tt: "$sm_arkship_mining_array_tt$$TABBED_NEW_LINE$['scripted_action:arkship_reprocess_planet']"
 tech_arkship_planetary_refinery: "$sm_arkship_planetary_refinery$"
 tech_arkship_planetary_refinery_desc: "$sm_arkship_planetary_refinery_desc$"
 sm_arkship_stellar_igniter: "恒星引擎"
 sm_arkship_stellar_igniter_desc: "一个能够触发恒星级聚变事件的暗物质注入系统。这玩意可没有安全保险。"
 sm_arkship_stellar_igniter_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_stellar_ignition']"
 tech_arkship_stellar_igniter: "$sm_arkship_stellar_igniter$"
 tech_arkship_stellar_igniter_desc: "$sm_arkship_stellar_igniter_desc$"
 sm_arkship_system_scanner: "亚空间成像阵列"
 sm_arkship_system_scanner_desc: "虚空在低语，对于那些懂得聆听的人，它正呢喃着其怀抱中无数星球的秘密。"
 sm_arkship_system_scanner_tt: "$sm_arkship_sensor_array_tt$$TABBED_NEW_LINE$['scripted_action:arkship_subspace_image']"
 tech_arkship_system_scanner: "$sm_arkship_system_scanner$"
 tech_arkship_system_scanner_desc: "$sm_arkship_system_scanner_desc$"
 sm_arkship_exodus_jump: "大迁徙跃迁协调仪"
 sm_arkship_exodus_jump_desc: "大迁徙跃迁协调仪目前在很大程度上仍是一个原型，在未来的某一天，它将使我们能够在眨眼之间穿越到不同的星系。"
 sm_arkship_exodus_jump_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_exodus_jump']"
 tech_arkship_exodus_jump: "$sm_arkship_exodus_jump$"
 tech_arkship_exodus_jump_desc: "$sm_arkship_exodus_jump_desc$"
