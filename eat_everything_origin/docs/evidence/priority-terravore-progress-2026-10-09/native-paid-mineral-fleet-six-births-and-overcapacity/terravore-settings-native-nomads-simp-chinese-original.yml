 # Stellar Cannon crisis responses
 nomads.8050.name: "火控改写"
 nomads.8050.desc: "锁定方案：异常。\n\n已进行校正。\n\n威胁重评估：无。"
 nomads.8050.a: "我们的方案已被驳回。"
 nomads.8055.name: "穿过面纱的礼物"
 nomads.8055.desc: "更多。\n\n祢将力量如赠与般倾倒。我们感受到了。我们会成长……绝不止步。"
 nomads.8055.a: "我们只是使其变强。"
 nomads.8060.name: "失望"
 nomads.8060.desc: "你们如此竭尽全力而最终我也毫发无损……\n\n真是浪费。我本对你们有更高的期望。不要把你的力量浪费在不会受到伤害的事物上。"
 nomads.8060.a: "她对我们有更好的期望。"
 nomads.8065.name: "反上一课"
 nomads.8065.desc: "又来。一样的浪费，一样的结果。\n\n我把你们所消耗的还给了你们，不是为了伤害你们，而是让你们感受到它的分量。事不过三。我不想看到你们再一次浪费自我。"
 nomads.8065.a: "这是我们需要学习的一课。"
