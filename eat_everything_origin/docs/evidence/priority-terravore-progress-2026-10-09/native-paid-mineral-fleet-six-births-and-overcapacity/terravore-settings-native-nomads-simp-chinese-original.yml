 tech_civilian_arkship_desc: "$civilian_arkship_class$方舟舰不仅仅是一艘飞船，它本身就是一个独立的世界。其基础设施足以支撑一个航行中的完整社会，携带着在星海间繁衍生息所需的一切。"
