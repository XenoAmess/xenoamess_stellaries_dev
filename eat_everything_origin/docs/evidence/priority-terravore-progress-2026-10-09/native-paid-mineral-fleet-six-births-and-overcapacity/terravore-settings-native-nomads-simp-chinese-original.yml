 nomads.50.name: "[GetStartingDrivePluralCap]启用"
 nomads.50.default.desc: "随着在§Y[root.capital_scope.GetName]§!上安装了[GetStartingDrive]，我们的工程[GetCrew]已完成对方舟舰上的老化系统的全面检查，以为真正的星际旅行做准备。目前已在舰船各处发现多处故障。"
 nomads.50.shields: "$NEW_LINE$护盾诊断显示有几个发射器未对准，需要重新校准。"
 nomads.50.sensors: "$NEW_LINE$多个传感器阵列检测到持续的干涉模式。"
 nomads.50.hangars: "$NEW_LINE$多个机库早已被改作仓库之用，限制了我方机组人员的作战备勤能力。"
 nomads.50.comms: "$NEW_LINE$一个来自未经探索的恒星系的信号，已开始在我们的通信数据库中自我复制。"
 nomads.50.coolant: "$NEW_LINE$腐蚀性冷却液泄漏正在危及船体完整性。"
