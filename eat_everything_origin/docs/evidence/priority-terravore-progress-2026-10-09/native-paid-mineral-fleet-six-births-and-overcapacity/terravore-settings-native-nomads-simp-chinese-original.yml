 civic_hive_deep_sleep: "交替休眠"
 civic_hive_deep_sleep_desc: "这个游牧蜂巢将其意识的一部分交替地置于休眠状态，只唤醒方舟舰当前任务所需的组织和工蜂。"
 civic_machine_deep_sleep: "待命协议"
 civic_machine_deep_sleep_desc: "这个游牧的机械智能通过关闭无效单元来优化其路线，只在需要时才启动它们。"
