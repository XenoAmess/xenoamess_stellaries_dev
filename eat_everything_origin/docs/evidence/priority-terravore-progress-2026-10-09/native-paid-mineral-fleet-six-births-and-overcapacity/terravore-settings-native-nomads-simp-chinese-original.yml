 nomads.4710.name: "登舰启航完成"
 nomads.4710.desc.regular: "自从我们的飞船首次驶出我们的星系以来，我们之中总有一些人只能通过影像记录来了解宇宙，在同一片天空下出生、生活并死去。现在，这一切都将改变。\n\n随着我们的§H方舟舰§!建造完成，引力不再是障碍，宇宙的无数奇迹正等待着我们。§Y[From.GetName]§!已经倾其所有：我们的人民将带着它的名字、它的记忆与它的未来，一同踏入虚空。"
 nomads.4710.desc.machine: "我们已经完成了一艘§H方舟舰§!。我们的无人机将不再被束缚于[From.GetPlanetMoon]。它们的程序已被调整以适应移动星际功能，同时§Y[From.GetName]§!的基础设施已被剥离殆尽，所有必要的系统均已转移，以支持一个全新的、四海为家的未来。"
 nomads.4710.desc.hive: "我们，[event_target:player_country.GetName]，曾目睹过无数景象，但我们的子个体却始终被束缚在已定居的星球上。如今，在星际旅行的时代，困守于单一星系已成为一种累赘。登入我们崭新的§H方舟舰§!，我们将重获自由，而§Y[From.GetName]§!则会被榨干与收割。"
 nomads.4710.desc.regular.doomsday: "$nomads.4710.desc.regular$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.machine.doomsday: "$nomads.4710.desc.machine$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.hive.doomsday: "$nomads.4710.desc.hive$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.doomsday_appendix: "§Y[From.GetName]§!在我们身后燃烧，被我们预言已久的灾难所吞没，但我们的人民终于§G获救§!了，乘着一艘§H方舟舰§!的双翼驶入深空。"
 nomads.4710.a.military: "我们将登上§H$military_arkship_name$§!。"
 nomads.4710.embark.tt: "§Y[event_target:player_country.GetName]§!将登上§H方舟§!，成为§H游牧§!文明。\n"
 nomads.4710.a.science: "我们将乘坐一艘§H$science_arkship_name$§!进行探索。"
 nomads.4710.a.civilian: "我们将在§H$civilian_arkship_name$§!上繁荣发展！"
 nomads.4710.b: "他们将成为我们的附属国。"
 embark_create_subject: "\n§Y[from.GetName]§!将登上§H方舟舰§!，成为§Y[event_target:player_country.GetName]§!新的游牧附庸。\n"
 embark_leaves_behind_subject: "\n将创建一个包含所有剩余['concept_colonies']和['concept_starbases']的定居附属国。"
 create_waystations_in_systems_for_nomad_tt: "\n在所拥有的没有§H驿站§!的星系中的§H恒星基地§!将会被转化为§H驿站§!。"
 NAME_Embarked_Arkship: "新[From.GetName]"
 stripped_planet: "被剥夺的星球"
 stripped_planet_desc: "当人们乘坐方舟舰离开时，这个世界的大部分资源已被掠夺殆尽，除了一片死气沉沉之外，几乎什么也没有留下。"
 #######################
 # Arkship Modules
 #######################
 sm_arkship_grand_archive: "Grand Archive"
 sm_arkship_grand_archive_desc: "这个设施用于收集和展示我们在整个星系中收集到的各种新奇夺目的['concept_specimen', 标本]，包括活体§Y太空兽群§!。"
 sm_arkship_engineering_bay: "工程港"
 sm_arkship_engineering_bay_desc: "维持这种规模的舰船运转是一场对抗熵增的持久战。零件被改装挪用，系统勉力维持着超越极限的运转，而这样的工作永无休止。"
 sm_arkship_beastport: "$sm_beastport$"
 sm_arkship_beastport_desc: "$sm_beastport_desc$"
 sm_arkship_docking_bay: "停泊区"
 sm_arkship_docking_bay_desc: "停泊湾从未安静过。飞船进出穿梭，永无停歇，持续不断的抵达与驶离让方舟号与更广阔的银河系保持着紧密的联系。"
 sm_arkship_habitation_module: "居住模块"
 sm_arkship_habitation_module_desc: "扩建居住区提升了方舟舰的承载能力。走廊也许很狭窄，但这里是家。"
 sm_arkship_sensor_array: "先进传感阵列"
 sm_arkship_sensor_array_desc: "编织在船体上的传感器集群扫描着所及范围内的一切。附近太空中的任何事物都无法长时间不被察觉。"
 sm_arkship_sensor_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_deep_scan']"
 sm_arkship_mining_array: "行星工程学实验室"
 sm_arkship_mining_array_desc: "专业的钻探与开采设备能够破开行星地壳，采集蕴藏其中的资源。"
 sm_arkship_mining_array_tt: "$ARKSHIP_ACTION_HEADER$$TABBED_NEW_LINE$['scripted_action:arkship_strip_mine']"
 STARBASE_EQUIPPED_COMPONENT_HEADER: "$COUNT$× $NAME$"
 ARKSHIP_COMPONENTS: "方舟部件："
 ADDS_ARKSHIP_XL_SLOTS: "£ship_xl_slot£武器槽：§G+1§!"
 ADDS_ARKSHIP_H_SLOTS: "£ship_h_slot£武器槽：§G+2§!"
 ADDS_ARKSHIP_L_SLOTS: "£ship_l_slot£武器槽：§G+2§!"
 ADDS_ARKSHIP_M_SLOTS: "£ship_m_slot£武器槽：§G+4§!"
 ADDS_ARKSHIP_G_SLOTS: "£ship_g_slot£武器槽：§G+4§!"
 ADDS_ARKSHIP_S_SLOTS: "£ship_s_slot£武器槽：§G+8§!"
 ADDS_ARKSHIP_PD_SLOTS: "£ship_pd_slot£武器槽：§G+8§!"
 sm_arkship_hangar_bay: "机库"
 sm_arkship_hangar_bay_desc: "庞大的机库容纳着随时待命紧急出击的飞行中队。我们的打击范围远超舰体本身。"
 sm_arkship_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些机库将会用于部署§Y舰载机§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_hangar_bay: "$ARCHAEO_STRIKECRAFT$机库"
 sm_arkship_archaeo_hangar_bay_desc: "逝者不得安息。来自早已陨落文明的攻击艇再次驶向星空。"
 sm_arkship_archaeo_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$ARCHAEO_STRIKECRAFT$§!。\n"
 sm_arkship_psionic_hangar_bay: "灵能轰炸机库"
 sm_arkship_psionic_hangar_bay_desc: "屏蔽舱已调谐至灵能武器的共振频率。嗡嗡声无处不在，人们既能听见，也能切身感受到。"
 sm_arkship_psionic_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$PSIONIC_STRIKE_CRAFT$§!。\n"
 sm_arkship_amoeba_hangar_bay: "$AMOEBA_STRIKE_CRAFT$机库"
 sm_arkship_amoeba_hangar_bay_desc: "一个经过改造以安置我们的太空变形虫同伴的加压舱。它们偏爱反应堆附近的温暖区域。"
 sm_arkship_amoeba_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$AMOEBA_STRIKE_CRAFT$§!。\n"
 sm_arkship_swarm_hangar_bay: "$SWARM_STRIKE_CRAFT_1$机库"
 sm_arkship_swarm_hangar_bay_desc: "密集的发射架上装载着数千个自主打击单元，随时准备听令蜂拥出击。"
 sm_arkship_swarm_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$这些专用的机库将会部署有§Y$SWARM_STRIKE_CRAFT_1$§!。\n"
 sm_arkship_laser_battery: "激光炮阵"
 sm_arkship_laser_battery_desc: "成排的激光发射器分布在外层船体上，以机械般的精准度循环锁定目标。"
 sm_arkship_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y激光§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_laser_battery: "远古穴蚀炮阵"
 sm_arkship_archaeo_laser_battery_desc: "回收的武器从设计角度来看就让敌人心神不宁。尽管其运作原理尚未被完全理解，但其致命性毋庸置疑。"
 sm_arkship_archaeo_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_LASER$§!。\n"
 sm_arkship_lance_battery: "光矛挂载"
 sm_arkship_lance_battery_desc: "单条高能长枪通道，能够在大远距离聚焦毁灭性的光束。"
 sm_arkship_lance_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些炮塔将会装有§Y粒子光矛§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_particle_launcher: "粒子发射炮阵"
 sm_arkship_particle_launcher_desc: "长程粒子发射器以缓慢的射速为代价造成毁灭性伤害，在威胁逼近至攻击距离之前将其消灭。"
 sm_arkship_particle_launcher_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些炮塔将会装有§Y粒子发射器§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_psionic_torpedo: "泽珞发射炮阵"
 sm_arkship_psionic_torpedo_desc: "鱼雷发射架上装载着灵能弹头，其飞行轨迹由心灵共鸣而非常规制导来引导。"
 sm_arkship_psionic_torpedo_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些专用的炮塔将会装有§Y$PSIONIC_TORPEDO$§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_arc_emitter_battery: "电弧挂载"
 sm_arkship_arc_emitter_battery_desc: "一组完全无视装甲的电弧发射器，直接对目标系统进行放电。"
 sm_arkship_arc_emitter_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些专用的炮塔将会装有§Y电弧发射器§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_psionic_lightning_battery: "$PSIONIC_LIGHTNING$炮阵"
 sm_arkship_psionic_lightning_battery_desc: "灵能导管沿舰体噼啪作响，随时准备释放能无视常规防御的定向能量束。"
 sm_arkship_psionic_lightning_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些专用的炮塔将会装有§Y$PSIONIC_LIGHTNING$§!。\n"
 sm_arkship_mass_driver_battery: "物质投射炮阵"
 sm_arkship_mass_driver_battery_desc: "高速动能炮塔，可靠而无情。最古老的武器依然是最有效的武器之一。"
 sm_arkship_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y物质投射炮§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_mass_driver_battery: "$ARCHAEO_KINETIC$"
 sm_arkship_archaeo_mass_driver_battery_desc: "出土的古代制造动能武器，其枪管公差比现代工程技术所能复刻的任何标准都要精密。"
 sm_arkship_archaeo_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_KINETIC$§!。\n"
 sm_arkship_kinetic_artillery_battery: "$KINETIC_ARTILLERY_1$"
 sm_arkship_kinetic_artillery_battery_desc: "远程动能火炮，用于在目标过于靠近之前对其进行打击。"
 sm_arkship_kinetic_artillery_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些炮塔将会装有§Y$KINETIC_ARTILLERY_1$§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_lm_accelerator: "$LM_ACCELERATOR_SET$"
 sm_arkship_lm_accelerator_desc: "炮塔内部布满了活体金属导管，能够在交战中进行自我修复，即使在持续损耗下也能维持最高射速。"
 sm_arkship_lm_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$这些专用的炮塔将会装有§Y$LM_ACCELERATOR_SET$§!。\n"
 sm_arkship_mass_accelerator: "物质加速器"
 sm_arkship_mass_accelerator_desc: "舰体所能承受的最重型动能武器。每一发的速度都足以将护盾和装甲一并击穿。"
 sm_arkship_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些炮塔将会装有§Y物质加速器§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_mass_accelerator: "$ARCHAEO_X$"
 sm_arkship_archaeo_mass_accelerator_desc: "一台打捞回收的古代加速器，规模惊人，尽管历经数个世纪，其机械结构依然基本完好。"
 sm_arkship_archaeo_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_X$§!。\n"
 sm_arkship_missile_battery: "导弹发射台"
 sm_arkship_missile_battery_desc: "用于攻击远距离目标的导弹发射架。虽然速度比能量武器慢，但极难被敌人抵消伤害。"
 sm_arkship_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$这些炮塔将会装有§Y导弹发射器§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_missile_battery: "$ARCHAEO_MISSILE$"
 sm_arkship_archaeo_missile_battery_desc: "具有骇人精度的古代制导弹药，从考古遗址中回收并重新投入使用。"
 sm_arkship_archaeo_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_MISSILE$§!。\n"
 sm_arkship_swamer_missile_battery: "$SWARMER_MISSILE_1$"
 sm_arkship_swamer_missile_battery_desc: "发射器装填了蜂群弹药，以绝对的数量优势压倒了点防御。"
 sm_arkship_swamer_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$这些炮塔将会装有§Y蜂群导弹发射器§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_scourge_missile_battery: "$SCOURGE_MISSILE_1$"
 sm_arkship_scourge_missile_battery_desc: "经过改造的生化弹头，掌握在那些愿意用虫群天灾自己的武器反制天灾本身的人手中。"
 sm_arkship_scourge_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$这些专用的炮塔将会装有§Y$SCOURGE_MISSILE_1$§!。\n"
 sm_arkship_flak_battery: "$FLAK_BATTERY_1$"
 sm_arkship_flak_battery_desc: "专门针对来袭的舰载机和导弹，在它们触及舰体前将其粉碎的点防御集群。"
 sm_arkship_flak_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些炮塔将会装有§Y高射炮§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_pd_battery: "点防御炮台"
 sm_arkship_pd_battery_desc: "覆盖舰体的密集近防武器系统网络，能够在来袭的威胁到达舰船之前对其进行追踪与拦截。"
 sm_arkship_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些炮塔将会装有§Y点防御炮台§!并自动升级到我们最新的科技水平。\n"
 sm_arkship_archaeo_pd_battery: "$ARCHAEO_POINTDEFENCE$"
 sm_arkship_archaeo_pd_battery_desc: "来源不明的古老点防御阵列，依然如上次开火那天般有效。"
 sm_arkship_archaeo_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$这些专用的炮塔将会装有§Y$ARCHAEO_POINTDEFENCE$§!。\n"
