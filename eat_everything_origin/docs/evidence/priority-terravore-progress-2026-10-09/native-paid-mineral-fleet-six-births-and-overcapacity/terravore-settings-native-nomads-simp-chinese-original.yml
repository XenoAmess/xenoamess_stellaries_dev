 # Gundersen Research Society (GRS)
 START_SCREEN_GRS: "风信子号生来就不是为了驻足在某个地方的。\n\n她是“尤利西斯计划”的第六艘，也是最后一艘方舟舰。那个本该将我们送往新殖民世界的虫洞打散了我们的舰队，而在穿越后瞬间发生的灾难性动力故障，让我们陷入了孤独漂流的境地。\n\n冈德森船长做出了一个决定。风信子号将成为我们的家，并且它将对外开放。那场失散中的其他幸存者找到了我们：研究员、殖民者，以及无处可去的流浪者。我们收留了他们。无论他们通过气闸舱带来了什么，冈德森家族都能将其物尽其用。\n\n如今[Ruler.GetTitle]依然是冈德森家族的一员。漫长的漂流让我们绕了一大圈，又回到了虫洞最初将我们抛下的那片星域。我们之所以回来，是因为这里是一切疑问开始的地方。"
 EMPIRE_DESIGN_humans3: "刚德森研究学会"
 EMPIRE_DESIGN_humans3_desc: "作为由联合国赞助的“尤利西斯计划”的第六艘也是最后一艘方舟舰，“风信子”号在穿过那个将人类散布到星辰之中的虫洞后的瞬间，遭遇了灾难性的动力故障。罗纳德·F·冈德森舰长凭借着毅力与智慧拯救了所有人，并在此过程中建立了一个王朝。\n\n一个世纪后，冈德森研究学会依然以“风信子”号为家。这艘飞船经历了如此多的重建与扩建，以至于有些人开始称它为“忒修斯”号。他们的欢迎是真诚的，好奇心是广泛的；无论任何人通过气闸舱带来什么，都由冈德森家族决定该如何使用。如今，漫长的漂流让他们回到了原点，回到了虫洞最初将他们送达的那个星系角落。"
