 # Traits
 trait_photoadaptive: "光适应"
 trait_photoadaptive_desc: "这一物种与星光共鸣。当他们在群星间穿行时，恒星光度的变化会微妙地重塑他们的生物性。"
 trait_solar_cells: "太阳能"
 trait_solar_cells_desc: "该物种发展出了专门的太阳能电池，能够以独特的方式吸收不同类型的恒星辐射，从而带来了适应每种恒星类型的各种增益。"
 concept_trait_photoadaptive_stars: "恒星类型"
 concept_trait_photoadaptive_stars_desc: "有些物种可从恒星['concept_star_luminosity']获得$worker_and_simple_drone_cat_bonus_workforce_mult$。\n\n—$pc_pulsar_plural$或$pc_neutron_star_plural$：§G+15%§!\n—$pc_b_star_short$、$pc_a_star_short$或$pc_f_star_short$恒星：§G+10%§!\n—$pc_g_star_short$或$pc_k_star_short$恒星：§G+5%§!\n—$pc_m_star_plural$：§R-5%§!\n—$pc_t_star_short_plural$、$pc_protostar_plural$或$pc_black_hole_plural$：§R-15%§!"
 trait_photoadaptive_effects: "['concept_trait_photoadaptive_stars']产生的$MOD_POP_BONUS_WORKFORCE_MULT$：$TABBED_NEW_LINE$$t$—$pop_cat_worker_plural$&$pop_cat_simple_drone_plural$：最低：§R-15%§!，最高：§G+15%§!$TABBED_NEW_LINE$$t$§Y$pc_black_hole_plural$§!，物理学家岗位：§G+15%§!$TABBED_NEW_LINE$$t$—§Y$pc_m_star_plural$§!，工程学家岗位：§G+15%§!"
 trait_recursive_learners: "递归学习者"
 trait_recursive_learners_desc: "该物种诞生于$arkship_cap$，在世代循环中不断提炼知识，每一代都在上一代的基础上进行改进，以满足其船只的独特需求。"
 trait_structural_awareness: "结构感知"
 trait_structural_awareness_desc: "这些机器专为居住在$arkship_cap$内而设计，持续监测其内部应力、流量和常规运作。不同的方舟舰设计会产生不同的模式，而它们会不断迭代优化自身行为，以适应其所居住的舰船。"
 trait_recursive_learners_effects: "依据$arkship_cap$类型，每个£district£ §Y$DISTRICT$§!产生§G+1.25%§!$MOD_POP_BONUS_WORKFORCE_MULT$（最多§G+25%§!）$TABBED_NEW_LINE$—§Y$civilian_arkship_name_plural$：§!['concept_planet_metallurgists']、['concept_planet_artisans']以及$job_ark_harvester_plural$$BONUS_WORKFORCE_FOR$$TABBED_NEW_LINE$—§Y$science_arkship_name_plural$：§!['concept_planet_researchers']$BONUS_WORKFORCE_FOR$$TABBED_NEW_LINE$—§Y$military_arkship_name_plural$：§!['concept_planet_engineers']和['concept_planet_soldiers']$BONUS_WORKFORCE_FOR$"
 trait_interconnected: "人船一体"
 trait_interconnected_desc: "历经数代之后，$arkship_cap$与住民之间的界限已不再分明。这艘船成为了他们感官与肢体的延伸；而他们则成为了船体中的官能部件。"
 trait_interconnected_effects: "在$arkship_cap_plural$上：$TABBED_NEW_LINE$$t$—$mod_planet_pops_robotics_upkeep_mult$：下限：§G-15%§!，上限：§R+5%§!$TABBED_NEW_LINE$$t$—$MOD_POP_AMENITIES_USAGE_MULT$：下限：§G-10%§!，上限：§Y0%§!$TABBED_NEW_LINE$—该效果与殖民地中具有该特质的£pop£§H人口§!数量成正比。"
 trait_reavers: "掠夺者"
 trait_reavers_desc: "这一物种的进化历程由狡诈而非团结所塑造。每一次互动都是一场意志的较量，而生存权则属于最无情的个体。"
 trait_reavers_effects: "非§Y$ethic_xenophile$§!或§Y$ethic_pacifist$§!的£commander£§Y$commander_plural$§!初始拥有['leader_trait:leader_trait_plunderer']特质"
 leader_trait_plunderer: "掠夺者"
 leader_trait_plunderer_desc: "没有必要白白浪费敌方船只的残骸。足智多谋的舰队司令能够精准地将它们变废为宝。"
