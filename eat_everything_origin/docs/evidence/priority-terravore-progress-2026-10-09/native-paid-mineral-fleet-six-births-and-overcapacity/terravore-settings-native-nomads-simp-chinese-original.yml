 contract_suntrip_crew_1_lore_issued: "§L“是的，太阳能阵列会挡住所有观察窗。不，我们无法调整它们的角度。”§!"
 contract_suntrip_crew_1_lore_completed: "§L“发电机已重新上线并运行在容差范围内。把它记录下来，然后继续处理清单上的下一项。”§!"
