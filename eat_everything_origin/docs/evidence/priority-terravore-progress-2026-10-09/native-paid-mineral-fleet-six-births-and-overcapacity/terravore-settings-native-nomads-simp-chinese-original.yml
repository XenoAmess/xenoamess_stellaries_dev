 contract_shoreleave_passenger_1: "落脚点"
 contract_shoreleave_passenger_1_desc: "乘客们渴望踏上坚实的土地，去探索下方的外星城市。我们已经安排了由向导带领的进城游览。"
 contract_shoreleave_passenger_1_lore_issued: "§L“没有墙他们是怎么留住大气的？这看起来很不安全。”§!"
 contract_shoreleave_passenger_1_lore_completed: "§L“我买了一个纪念品。我不知道这是什么。但我很喜欢。”§!"
 contract_shoreleave_passenger_1_lore_failed: "§L“城市就在那里。就-在-那-里。”§!"
