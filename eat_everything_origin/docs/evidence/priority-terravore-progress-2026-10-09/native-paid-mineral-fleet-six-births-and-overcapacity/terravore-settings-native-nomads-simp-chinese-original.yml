 contract_shoreleave_passenger_4: "集市日"
 contract_shoreleave_passenger_4_desc: "地表上一个庞大的露天市场交易着来自整个星域的商品。乘客们迫不及待地想要去逛一逛并讨价还价。"
 contract_shoreleave_passenger_4_lore_issued: "§L“我带了三个包和严格的预算。但我需要的是六个包，而且不能有预算。\"§!"
 contract_shoreleave_passenger_4_lore_completed: "§L“我为一个不需要的小玩意讨价还价了二十分钟。这是我这辈子最棒的一次购物。”§!"
 contract_shoreleave_passenger_4_lore_failed: "§L“市场在召唤我。这是不可饶恕的。”§!"
