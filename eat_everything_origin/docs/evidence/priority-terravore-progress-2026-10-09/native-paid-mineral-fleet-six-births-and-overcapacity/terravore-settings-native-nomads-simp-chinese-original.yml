 nomad_deterrence_do_no_harm: "不造成伤害"
 nomad_deterrence_do_no_harm_desc: "我们放过了那艘失去行动能力的方舟舰，未对其船员或舰体造成任何损伤。这一仁慈之举并未让我们付出任何代价，反而有可能为我们赢得善意。"
