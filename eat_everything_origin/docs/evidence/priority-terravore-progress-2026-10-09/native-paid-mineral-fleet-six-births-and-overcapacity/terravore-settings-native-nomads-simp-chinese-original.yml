 contract_espionage_support_passenger_1: "谍报剧院"
 contract_espionage_support_passenger_1_desc: "为了娱乐乘客，我们将在指定的恒星系中部署一颗非功能性的“间谍卫星”。"
 contract_espionage_support_passenger_1_lore_issued: "§L“你得给我保证，这里会有一场追逐戏！”§!"
 contract_espionage_support_passenger_1_lore_completed: "§L“我亲自拦截了三次加密传输。好吧，屏幕上是这么说的。”§!"
 contract_espionage_support_passenger_1_lore_failed: "§L“所以那颗间谍卫星是不是该做点什么，还是说刚才那就是全部戏码了？”§!"
