 contract_shoreleave_crew_5: "船员的才艺展示"
 contract_shoreleave_crew_5_desc: "[GetShoreleaveCrewDesc5]"
 contract_shoreleave_crew_5_regular_desc: "定居点已向船员开放其露天剧场、广场和公共舞台。"
 contract_shoreleave_crew_5_gestalt_desc: "定居点已开放其公共场所。子个体将会部署出动，在向乘客推出之前，先在当地居民身上实地测试实验性的娱乐程序。"
 contract_shoreleave_crew_5_lore_issued: "[GetShoreleaveCrewLoreIssued5]"
 contract_shoreleave_crew_5_regular_lore_issued: "§L“我报名了喜剧表演。我们整个班次的同事都会来。如果他们不笑，我就申请调换部门。”§!"
 contract_shoreleave_crew_5_hive_lore_issued: "§L“工蜂占据了定居点的每一个舞台。没有笑点的喜剧，故意演砸的杂技。我们想看看是什么能让他们发笑，又是什么会让他们离场。”§!"
 contract_shoreleave_crew_5_machine_lore_issued: "§L“娱乐子程序已部署至所有定居点场所。喜剧模块：有铺垫无包袱。杂技模块：落地动作被设定为必然失败。观众监控已激活。”§!"
 contract_shoreleave_crew_5_lore_completed: "[GetShoreleaveCrewLoreCompleted5]"
 contract_shoreleave_crew_5_regular_lore_completed: "§L“我讲了个关于冷却泵的笑话，有一千个陌生人笑了。飞船上可从来没人觉得这个笑话好笑。”§!"
 contract_shoreleave_crew_5_gestalt_lore_completed: "§L“令人费解的结果。子个体表演了没有笑点的段子，观众却依然大笑。搞砸的杂技引来了最热烈的欢呼声。我们尚未完全理解，但采集到的数据很丰富。”§!"
 contract_shoreleave_crew_5_lore_failed: "[GetShoreleaveCrewLoreFailed5]"
 contract_shoreleave_crew_5_regular_lore_failed: "§L“演出取消了。我为我的戏份排练了一个月。冷却泵永远也得不到它们应有的认可。”§!"
 contract_shoreleave_crew_5_gestalt_lore_failed: "§L“没有实地测试。我们的子个体在整个聚居地的空荡平台上待命。乘客们将在又一个周期中继续忍受那令人厌倦的枯燥日常。”§!"
