 contract_suntrip_crew_4_regular_lore_issued: "§L“正在将娱乐带宽重定向至传感器网格。准备迎接乘客的投诉：三、二、一……”§!"
 contract_suntrip_crew_4_gestalt_lore_issued: "§L“正将娱乐带宽重新分配至传感器网络。已预见并接受乘客的不满。”§!"
 contract_suntrip_crew_4_lore_completed: "§L“校准已锁定。导航精度已恢复至可接受的范围内。”§!"
 contract_suntrip_crew_4_lore_failed: "[GetSuntripCrewLoreFailed4]"
 contract_suntrip_crew_4_regular_lore_failed: "§L“校准未完成。导航数据依然模糊，但至少全息屏幕又亮了。”§!"
 contract_suntrip_crew_4_gestalt_lore_failed: "§L“校准未完成。导航数据降级。乘客娱乐带宽已恢复。”§!"
