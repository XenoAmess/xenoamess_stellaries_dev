 MESSAGE_NOMAD_EXPLORATION_TITLE: "游牧探险"
 NOMAD_EXPLORATION_WONDERS_DESC: "$SYSTEM|Y$星系包含一个非凡的§Y古代奇迹§!。\n令人振奋的景象。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_THREAT_DESC: "$SYSTEM|Y$星系中隐藏着一个危险的§Y远古威胁§!。\n我们在这里最好多加小心。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_ENCLAVE_DESC: "$SYSTEM|Y$星系中存在着一个非凡的§Y太空城邦§!。\n他们或许愿意进行通讯。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_LANDMARK_DESC: "$SYSTEM|Y$星系拥有一处非凡的§Y星海地标§!。\n真是美妙的景象。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_MARAUDERS_DESC: "$SYSTEM|Y$星系属于骄傲的§Y掠夺者§!。\n我们应当谨慎行事。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_SPECTACLE_DESC: "$SYSTEM|Y$星系是一处非凡的§Y自然胜景§!。\n它的美丽无与伦比。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_PRECURSOR_DESC: "$SYSTEM|Y$星系中暗藏着古老§Y先驱者§!的踪迹。\n这些庄严的遗迹令人心生敬畏。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 NOMAD_EXPLORATION_ECOLOGY_DESC: "$SYSTEM|Y$星系在§Y空间生态学§!体系中扮演着有趣的角色。\n这里有很多值得我们学习的地方。\n\n获得了§G少量§!的§Y凝聚力§!奖励。"
 nomads.4715.name: "值得观赏的景色"
 nomads.4715.desc: "游牧生活与无尽的漫游带给我们的最大回报之一，就是发现新的天地。即使在漫长的旅途之后，依然存在着未曾见过的风景，不论是绝美的还是令人惶恐的。我们的好奇心总是渴望去发掘这些奇观。\n\n然而，对于我们的方舟来说，每一处新景象不仅仅是供其观赏的奇特事物，更是一次学习新知、反思与成长的机会。"
 nomads.4715.a: "这个星系浩瀚而充满奇迹。"
 nomads.4715.b: "这个星系既浩瀚无垠又杀机四伏。"
