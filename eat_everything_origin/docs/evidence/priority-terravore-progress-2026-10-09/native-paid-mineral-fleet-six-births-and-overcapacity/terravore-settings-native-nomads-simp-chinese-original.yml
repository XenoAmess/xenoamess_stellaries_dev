 civic_champions_forge_enclave: "广播城邦"
 civic_champions_forge_enclave_desc: ""
 military_arkship_champions_forge: "$military_arkship_tier_3$"
 military_arkship_champions_forge_plural: "$military_arkship_tier_3_plural$"
 military_arkship_champions_forge_cap: "$military_arkship_tier_3_cap$"
 NAME_Champions_Forge_Arkship: "$civic_champions_forge_enclave$"
 NAME_Champions_Forge_Arena: "冠军之铸工作室"
 gov_champions_forge_enclave: "广播城邦"
 gov_champions_forge_enclave_desc: "一个游牧式的巨型企业在整个星系广播壮观的舰船竞赛，将战斗转化为娱乐，将冠军转化为商品。"
 NAME_Champions_Forge_Enclave: "冠军之铸现场秀！" #empire
 NAME_Champions_Forge_Enclave_adj: "冠军之铸现场秀" #empire, e.g. 'an Artisan starbase'
 RT_ETERNAL_CHAMPION: "传奇铸匠"
 champions_forge_tournament_chain_title: "冠军之铸现场秀！比武会"
 champions_forge_tournament_chain_desc: "几十年过去了，一场新的锦标赛即将拉开帷幕。派你的舰队进入聚光灯下，向星系证明你的智慧、力量和决心。"
 CHAMPIONS_FORGE_TRAVEL: "虫洞：冠军之铸现场秀！"
 CHAMPIONS_FORGE_TRAVEL_DESC: "冠铸秀已为前往赛场准备了专用虫洞。请在截止日期前将您的舰队送达指定地点，准备铸就属于您的传奇！"
 NAME_Contestant_Fleet: "[event_target:champions_forge_contestant.GetName]冠军"
 nomads.160.desc: "欢迎加入冠铸秀！这里是铸就传奇的摇篮，也是星际梦想启航的地方。我们漫游于星辰之间，为这个厌倦了安逸与平庸的星系提供惊险与盛况。\n\n你的杀手锏是什么？是身手敏捷的飞行员？是令人震撼的火力？还是单纯对利润和掌声的渴望？立即报名，我们将把你塑造成一颗璀璨之星。"
 nomads.100.name: "§Y太空城邦：§!冠军之铸现场秀！"
 nomads.100a.desc: "啊，一位熟悉的老对手回到了演播室！但你是否带上了什么新式武器？\n\n我们的观众和星系竞技场都在拭目以待！"
 nomads.100b.desc: "欢迎回来，选手！赌池已经热火朝天，粉丝们正渴望看到更多精彩表现，而我们刚刚清理完残骸。\n\n想再破一次收视纪录吗？"
 nomads.100c.desc: "哎呀呀！这不是我们最爱的战争贩子兼公共表演赞助人吗。我们正在筹备下一场舰队肉搏战……\n\n你想参与到主场赛事吗？"
 nomads.100.a.invitation: "我们§Y登记§!报名，准备参加下一轮比武会。"
 nomads.100.a.stop: "§Y停止§!发出比武会邀请函。"
 nomads.100.b: "更换场地要花多少钱？"
 nomads.100.b.tt: "$opinion10$\n我们将有§Y5 年§!时间发布一份特别§Y合约§!，指定承办下一届冠铸秀赛事的恒星系。"
 hosting_cfl_cooldown_tt: "冠铸秀锦标赛许可证下次可用时间为§Y[champions_forge_enclave_country.cfl_cooldown_timer]§!"
 nomads.100.b.reply: "看来我们迎来了新的主角！我们迫不及待想看到你在舞台上的表现了。\n\n只需在你选择的星系中为我们发布一份§Y合约§!，剩下的就交给我们来行动！"
 nomads.100.c: "为我们§Y引荐§!一下。"
 nomadic_paragon_cooldown_tt: "§R我们可以在§Y[root.nomadic_paragon_timer]§!后请求再次进行引荐。§!"
 nomadic_paragon_already_hired: "§R我们已经雇佣了一位游牧领袖为我方效力。§!"
 nomadic_paragon_all_hired: "§R$RT_ETERNAL_CHAMPION$已经耗尽了全部联络。§!"
 nomadic_paragon_explanation: "\n一位游牧领袖将会与我们接洽。"
 champions_forge_trust_tt: "我们必须赢得§Y$RT_ETERNAL_CHAMPION$§!的信任。"
 nomads.100.d: "§Y详细说说§!你们的活动赛事。"
 nomads.100.d.reply: "大约每隔二十五年，志在成为传奇的强者们便会展开巅峰对决！他们率领各自的舰队悉数登场，比赛地点轮番更替，而那些激烈的搏杀从未让人失望！\n\n胜者将赢得丰厚的奖励、至高的声望，并在我们的积分榜上占据一席之地。\n\n错过召集，就意味着错失良机。我们从不守候。"
 nomads.100.e: "§Y购买§!我们宿敌的战斗数据。"
 nomads.100.e.reply: "战斗数据，刚刚传回！我们的分析师仔细研究了你们对手舰队交战的每一个片段。规律、破绽、弱点。我们将数据包交给你们，剩下的就看你们炮手的了。"
 cfl_combat_data: "冠铸秀战斗简报"
 cfl_combat_data_desc: "从“冠军之铸现场秀！”制作团队购买的详细交战分析，揭露了我们竞争对手的战斗模式。"
 contract_host_cfl_tournament: "提名冠铸秀锦标赛的举办恒星系"
 contract_host_cfl_tournament_issuer_desc: "我们已经购买了下一届“冠军之铸现场秀！”锦标赛的场地权。或许我们可以利用这一点为我们谋取优势。"
 contract_host_cfl_tournament_desc: "$contract_host_cfl_tournament_issuer_desc$"
 contract_host_cfl_tournament_chain_title: "$contract_host_cfl_tournament$"
 contract_host_cfl_tournament_chain_desc: "$contract_host_cfl_tournament_desc$"
 champions_forge_tournament_ongoing_tt: "$TRIGGER_FAIL$§R 冠铸秀正在举行锦标赛，我们需要等待§!"
 nomads.105.name: "[from.GetName]" #country - may return as an unknown name
 nomads.105.desc: "冠军之铸太空城邦没有回应我们的呼唤。"
 nomads.105.desc.unknown: "别说翻译了，只要我们发给[From.GetName]讯息，他们就立马下线，拒绝与我们交流。"
 nomads.105.a: "他们怎敢？！"
 nomads.110.desc: "我就知道你可以的！\n\n我们会再联系。"
 nomads.115.desc: "把赢到的奖金留在桌上不拿？真是太浪费了！\n\n不过，如果你改变主意并且能找到我们，冠铸秀始终欢迎赢家。"
 nomads.120.desc: "啊，你是在找个新人吗？战士、掮客、旅者……他们可不是那种你看一眼就会过忘的货色，这星系也难得让他们销声匿迹太久。我们在旅途中确实遇到过几位。但朋友，在这片地界，天下没有免费的午餐。付了我们的猎头费，我就为你安排见面。"
 nomads.120.a: "我们很感兴趣。"
 nomads.125.name: "冠铸秀：战斗简报大放送"
 nomads.125.desc: "嘿，挑战者！你的战斗简报已经过时，而战术局势总是瞬息万变。新对手、新舰队战术，还有新出现的突破口。\n\n我们的分析师已经为你准备了一份署着你名字的全新档案。条件不变，火力优势不变。想要吗？"
 nomads.125.a: "§Y更新§!简报。"
 nomads.125.b: "暂时先跳过。"
 nomads.255.name: "冠铸秀：重燃铸火"
 nomads.255.desc: "欢迎收看“冠军之铸”现场秀！这里是全星系最顶尖的视觉与毁灭盛宴。\n\n位于§Y[champions_forge_enclave_system.GetName]§!星系的下一届冠铸秀现已开放报名。一场壮丽的大乱斗正等待着大家。\n\n准入要求：一支规模最多§H[champions_forge_enclave_country.GetCFLFleetSizeRequirement]舰队规模§!的舰队。\n\n胜者将赢得奖励、名望以及至高无上的冠铸秀的大奖杯。\n\n想要锻造属于你的传奇？那就报名参赛。\n\n想要安宁与清静？没门！"
 nomads.255.desc.relic: "$nomads.255.desc$\n\n此外，我们还打算要回奖杯。"
 nomads.255.a: "算上我们！我们必将胜利。"
 nomads.255.a.tooltip: "在§H[capital_scope.solar_system.GetName]§!研究特殊项目。"
 nomads.255.b: "下次一定。"
 nomads.255.c: "别再发邀请函过来了。"
 nomads.255.c.tooltip: "联系§H$NAME_Champions_Forge_Enclave$§!可以再次启用比武会邀请。"
 CFL_NO_TOURNAMENT_TITLE: "锦标赛取消"
 CFL_NO_TOURNAMENT_DESC: "由于缺乏合格的参赛者，§Y冠军之铸现场秀！§!已决定取消本次锦标赛。"
 CHAMPIONS_FORGE_TRAVEL_FLEET_REQ: "准入要求：一支具有至多§H[event_target:champions_forge_enclave_country.GetCFLFleetSizeRequirement]舰队规模§!的舰队。"
 cfl_fleet_size_heavy_late: "500"
 cfl_fleet_size_medium_late: "200"
 cfl_fleet_size_medium_mid: "100"
 cfl_fleet_size_small_mid: "50"
 cfl_fleet_size_small_early: "25"
 nomads.270.name: "冠军之铸开幕"
 nomads.270.desc: "“星系各地的岩石生物、有机生命和战争机器们——欢迎回到‘冠军之铸’锦标赛的直播现场！\n\n§Y[event_target:champions_forge_enclave_system.GetName]§!星系的闲杂人等已经清理完毕，赌池也正炙手可热，我有一种预感，我们即将亲眼见证一些造价极其高昂的硬件烧毁报废。\n\n各位屏幕前的观众请记住：这可不是什么例行巡逻或边界摩擦。这里是铸炉！没人能带着完整的尊严撤离。\n\n参赛者们……创造！传奇！吧！”"
 nomads.285.desc.intro: "狂热的混战终于在§Y[event_target:champions_forge_enclave_system.GetName]§!星系平息下来。铸炉熄灭了。残骸在渐冷的星光中漂流，应急信标断断续续地重新亮起。\n\n“多么壮观的场面！”冠铸秀解说员嘶吼着，声音因真情流露而变得沙哑。“这就是我们来的目的！这就是全星系观众拭目以待的时刻！”"
 nomads.285.name: "冠军之铸落幕"
 nomads.285.desc: "$nomads.285.desc.intro$\n\n第三名并不可耻，这恰恰证明了我们有资格站在转播镜头前。即便身处领奖台的最底层，我们依然可以俯视那些被我们击溃的舰队。"
 nomads.285.a: "我们的舰队飞行得很好！"
 nomads.290.name: "冠军之铸落幕"
 nomads.290.desc: "$nomads.285.desc.intro$\n\n第二名索然无味！我们伸出[Species.GetHandName]想要夺取奖杯，却眼睁睁看着它被别人抢走。好吧，让他们庆祝去吧。我们会记住这一切。当锻炉再次召唤时，我们绝不会再输。"
 nomads.290.a: "要是我们当时再把舰队升级一下就好了……"
 nomads.295.name: "冠军之铸落幕"
 nomads.295.desc: "$nomads.285.desc.intro$\n\n第一名！在全星系的崇拜目光中，我们从冠铸秀组委会手中夺走了奖杯并将其高高举起。这次胜利的余响将远传至赛场之外。\n\n现在，整个星系都将对我们的舰队心生畏惧。"
 nomads.295.a: "难道还有悬念吗？"
 nomads.305.name: "冠军之铸落幕"
 nomads.305.desc: "$nomads.285.desc.intro$\n\n我们没有获得名次。奖杯上不会刻下我们的名字，观众们也将转向更耀眼的明星。我们必须回去。"
 nomads.305.a: "谁会在乎这种无意义的比赛？"
 nomads.306.name: "冠军之铸歇战"
 nomads.306.desc: "§Y[event_target:champions_forge_enclave_system.GetName]§!恒星系内的比赛局势胶着、难解难分。舰队濒临崩溃彼此追逐环绕，无人能打出决定性一击。\n\n但没有胜利的结局，没有人举起奖杯，也没有人登上领奖台。冠军之铸团队终于承认：无法确定胜者。参赛队伍被遣散回家，转播悄然切回重播。"
 nomads.306.a: "空洞的结尾。"
 nomads.405.desc: "随着冠铸秀方舟舰的引爆，广播信号切断为黑屏。我们搜查了§Y[champions_forge_destruction_system.GetName]§!星系中的残骸，并打捞了他们那满溢的储物仓。\n\n他们最后的“奇观”相当有利可图……对我们而言。"
 nomads.405.desc.relic: "$nomads.405.desc$\n\n我们的名字将永远作为最后一批刻在奖杯上的人……随着冠铸秀那帮蠢货的消失，再也不会有下一位冠军来挑战我们的地位了。"
 nomads.410.desc: "在短短几秒钟内，星系目睹了冠铸秀的最后一场演出。\n\n画面剧烈晃动，伴随着解说员的尖叫，随后一堵火墙吞噬了方舟舰。\n\n接着：画面切断。\n\n冠军之铸现场秀！位于§Y[champions_forge_destruction_system.GetName]§!星系的太空城邦被§Y[champions_forge_destroyer.GetName]§!摧毁。"
 nomads.410.desc.relic: "$nomads.410.desc$\n\n我们的名字将永远是刻在奖杯上的最后一批……随着冠铸秀的消亡，再也不会有新的冠军来挑战我们的地位了。"
 nomads.410.a: "星系总会找到新的乐子。向来如此。"
