 # Clues of the Chrysanthemum
 clues_chrysanthemum_title: "秋菊号的线索"
 clues_chrysanthemum_desc: "联合星，我们终于有了关于秋菊号下落的线索。我们必须去看看我们的姐妹舰如今以何处为家。"
 nomads.9000.name: "往日之声"
 nomads.9000.desc: "风信子号的远程接收器在“尤利西斯计划”的紧急频率上截获了一段广播。\n\n这个信号非常古老——至少有一个世纪之久——但信息十分清晰。尤利西斯计划的第五艘“秋菊号”在失散中幸存了下来。殖民者们发现了一个世界，他们将其命名为“联合星”。\n\n广播不断重复着：“秋菊号殖民地呼叫所有尤利西斯计划的船只。我们已在一个宜居世界登陆。这颗星球非常美丽。我们正在这里建设新的家园。回家吧。”\n\n从这里无法确定信号的源头，但用于传输该信号的中继浮标应该是可追踪的。对附近星系进行勘测或许能找到其中一个。"
 nomads.9000.a: "开始对信号源进行三角定位。"
 nomads.9000.b: "那都是陈年旧事了，记录下来，然后继续前进。"
 chrysanthemum_poi_1: "信号中继器"
 chrysanthemum_poi_1_desc: "一个可能包含尤利西斯计划中继浮标的恒星系。对风信子号进行调查可能有助于更准确地定位信号来源。"
 nomads.9005.name: "发现信号"
 nomads.9005.desc: "尤利西斯计划的一个中继浮标漂浮在这个星系中——破损不堪，勉强运转，但仍在发送广播。\n\n除了最初的宣告外，浮标还载有两条后来的通讯。第二条的日期大约在第一条的十年后。\n\n殖民地人口：二十六万。农业已建立。基础设施正在扩建。\n\n第三条通讯的日期是第9182天——大约在登陆后的第二十五年。“我们还在这里。联合星的环境比最初的调查显示的更具挑战性。我们失去了一些同伴。如果有任何尤利西斯计划的飞船收到此广播，请回复。我们在这里。我们仍在坚持。”\n\n联合星位于天津四星系，距离这里仅有几次超空间跳跃的航程。"
 nomads.9005.a: "设定航向前往天津四。"
 chrysanthemum_poi_2: "天津四"
 chrysanthemum_poi_2_desc: "秋菊号方舟舰的殖民地建立于此。尤利西斯计划中继浮标记录了坐标，风信子号必须前往。"
 nomads.9010.name: "合一"
 nomads.9010.desc: "天津四星系一片寂静。\n\n“风信子”号脱离跃迁，发现没有信标，没有信号，也没有在星球间穿梭的飞船。奥林波斯星悬浮在半远处，庞大而冷漠。\n\n有一颗卫星不对劲。殖民地的广播曾描述那里有绿色的大陆和广阔的水域，而扫描仪显示的却是一个死寂的世界——那是被核武器摧毁后的星球特有的无可错认的灰褐色。那里没有任何生命。\n\n在近地轨道上，缓慢而暗淡地漂浮着的是“秋菊”号。它没有被毁。只是空无一人。每一扇舷窗都漆黑一片。这艘曾运载着二十五万殖民者来到这个世界的飞船，已经在这里停滞了数十年。"
 nomads.9010.a: "开始地表与残骸分析。"
 chrysanthemum_object: "CNS 秋菊" # Commonwealth Navy Ship
 chrysanthemum_object_tooltip: "$chrysanthemum_object_desc$"
 chrysanthemum_object_desc: "尤利西斯计划的第五艘方舟舰。它搭载了后来建立“联合星”的殖民者。它在冰冷与无人的状态下，已经漂流了不知多少个十年。"
 # Chrysanthemum Digsite
 site_chrysanthemum_colony: "联合星殖民地残骸"
 site_chrysanthemum_colony_desc: "联合星殖民地在失去联系前大约运作了二十五年。无论这里发生了什么，记录都保存了下来。殖民地的档案管理员一直坚持记录到了最后。"
 nomads.9015.name: "白热化"
 nomads.9015.desc: "殖民地的数据核心幸存了下来——被封存在玻璃化表岩屑下方的地下档案馆中。\n\n第9251天：发现了一种新的掘地变种。外围墙体的防护等级不足以抵御地下突破。已向“秋菊”号请求工程支援。请求待批复。\n\n第9389天：外环已撤离。地下居住区已确认安置了214,000名殖民者。部分区域失去联系。\n\n第9441天：与7至12区的通讯中断。民兵伤亡：892人。\n\n第9484天：地下四层的电力已中断。团队被要求停止记录。档案管理员予以拒绝。\n\n第9514天：我们没有足够的时间了。"
 nomads.9015.a: "保存殖民地记录。"
 nomads.9020.name: "投票"
 nomads.9020.desc: "议事厅是为容纳两百人而建造的。最后一次会议只召集到了十七人。档案员仍在进行记录。\n\n会议持续了六个小时。共投出十二张选票——六票赞成轨道轰炸，六票反对。一名委员弃权。三人缺席；他们所在的防区三天前就已沦陷。\n\n反对者争辩说，撤离仍然可行。“秋菊号”可以在地表殖民地的下层被攻破前分批撤离幸存者。\n\n多数人则不这么认为。该生物已经到达了下层通道。任何停靠的飞船都会将污染带离这个星球。现在的选择已经不再是拯救部分人还是拯救所有人，而是失去一个世界，还是失去随后的每一个世界。\n\n殖民地安全主管博克莱尔指挥官投下了决定性的一票。动议通过。殖民地宪章规定少数服从多数。那份宪章是他们在第一年亲自起草的，那时的未来看起来还是另一番光景。"
 nomads.9020.a: "记录委员会的决定。"
 nomads.9025.name: "日志"
 nomads.9025.desc: "舰桥日志始于第9516天——即投票两天后。\n\n11名船员留下来确认地表清除情况。辐射水平。人口预估被下调，随后再次下调。第9519天：授权轰炸。第9521天：确认扇区清除完毕，40%。第9558天：地表已彻底净化。未探测到生命迹象。评估结果：全体一致。\n\n船员们又花了四年时间进行天体物理学勘测。科学家们借此打发时间。\n\n最后一篇日志的日期是第11204天。值班军官描述了一个晴朗的日子。她写道，在这么近的距离看天津四，与当初靠近它时所见的模样截然不同。记录到此结束。\n\n最后的记录只有一个时间戳，没有歉意，也没有反思。仅仅是对星光的一句观察。"
 nomads.9025.a: "关闭档案。"
 # First Contact
 action.1.desc_112: "ISA-06……风信子号。我们与全部六艘飞船都失去了联系，很长一段时间里，我们做好了最坏的打算。能在这里找到你们，看到你们还活着……请原谅我的失态。\n\n我代表[From.GetHomeWorldName]和联合国大会，请接受我们伸出的友谊之手。无论“尤利西斯计划”让你们踏上了怎样的道路，你们现在都已经回到同胞身边了。\n\n我们有很多事情要谈。请把一切都告诉我们吧。"
 action.1.desc_113: "[From.GetRulerTitle][From.GetRulerName]，来自冈德森研究学会。“风信子”号向您致意。我们很高兴看到地球依然屹立。\n\n我们花了一个世纪的时间，追寻被虫洞散落在这片星系中的事物。这项工作浩大无边，并且我们发现，宇宙绝不会向缺乏好奇心的人展露它的秘密。每一个加入我们的人都深谙此道。这也是我们提出的唯一条件。\n\n[From.GetHomeWorldName]曾孕育出愿意乘坐方舟舰穿越虚空的科学家与探险家。我们相信如今依然如此。“风信子”号的大门向任何怀揣这种精神的人敞开。把你们最优秀的人才派给我们吧。这里从来都不缺问题。"
