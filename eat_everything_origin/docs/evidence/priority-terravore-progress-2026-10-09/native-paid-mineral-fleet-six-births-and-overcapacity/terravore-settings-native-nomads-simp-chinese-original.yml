 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT_DESC: ""
 contract_espionage_support_passenger_3: "突发线索"
 contract_espionage_support_passenger_3_desc: "乘客们在导游的带领下前往下方的城市游览，船组特工已在预定地点放置了虚假的情报包裹，供他们去发现。"
 contract_espionage_support_passenger_3_lore_issued: "§L“他们给了我们档案和代号。我的是‘破晓者’。我从未感觉如此充满活力。”§!"
 contract_espionage_support_passenger_3_lore_completed: "§L“我在一个外星人雕像后面找到了那个包裹。我的队伍欢呼了起来。当地人看起来非常困惑。”§!"
 contract_espionage_support_passenger_3_lore_failed: "§L“没有突发线索，没有代号，没有任务。只是在又一个循环里盯着相同的走廊。”§!"
 contract_espionage_support_passenger_3_chain_title: "$contract_espionage_support_passenger_3$"
 contract_espionage_support_passenger_3_chain_desc: "$contract_espionage_support_passenger_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT: "$contract_espionage_support_passenger_3$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT_DESC: ""
 contract_espionage_support_passenger_4: "抓内鬼"
 contract_espionage_support_passenger_4_desc: "全船各层甲板已通报发生一起模拟的安全事件。乘客们被招募参与一场全船范围的调查游戏，以找出安插在船员中的“外来特工”。"
 contract_espionage_support_passenger_4_lore_issued: "§L“他们告诉我们这层甲板上有人是间谍。我已经拟定了一份嫌疑人名单。”§!"
 contract_espionage_support_passenger_4_lore_completed: "§L“我抓到了内鬼。好吧，其他成千上万名乘客也抓到了。但我是最先抓到的！”§!"
 contract_espionage_support_passenger_4_lore_failed: "§L“还没等我出示证据，抓内鬼的行动就被取消了。我连图表什么的都准备好了。”§!"
 contract_espionage_support_passenger_4_chain_title: "$contract_espionage_support_passenger_4$"
 contract_espionage_support_passenger_4_chain_desc: "$contract_espionage_support_passenger_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT: "$contract_espionage_support_passenger_4$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT_DESC: ""
 contract_espionage_support_passenger_5: "拦截信号"
 contract_espionage_support_passenger_5_desc: "观景台已被改造为监听站。乘客们驻守在这些站点，破译着船员们从底层甲板秘密发送的、预先编排好的外星信号。"
 contract_espionage_support_passenger_5_lore_issued: "§L“他们递给我一副耳机，并告诉我星系的命运取决于我接下来听到的内容。我相信他们。”§!"
 contract_espionage_support_passenger_5_lore_completed: "§L“他们告诉我们这些通讯是事先编排好的。那为什么当我解码最后一条时，船员们看起来那么紧张？”§!"
 contract_espionage_support_passenger_5_lore_failed: "§L“监听站在我换班前就陷入了沉寂。我甚至都没来得及戴上耳机。”§!"
