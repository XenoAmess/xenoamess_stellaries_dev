 civic_flight_schools: "飞行学校"
 civic_flight_schools_desc: "飞行员一直是人们心中的英雄，激励着许多人努力成为像他们一样的人。不久之后，成为飞行员会被认为是身份的象征，并由此诞生了一代又一代的王牌飞行员，他们的成就就是最好的证明。"
