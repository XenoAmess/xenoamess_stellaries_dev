 # Contract Events
 nomads.3036.name: "搭载代表团"
 nomads.3036.intro: "来自§H[pickup_planet.GetName]§!的外交使团已经登上了方舟舰，并正以符合§H[pickup_planet.owner.GetName]§!大使身份的礼遇规格受到接待。"
 nomads.3036.desc: "$nomads.3036.intro$我们规划了一系列活动，包括方舟舰参观和关于我们生活方式的宣讲，以便让他们在前往§H[dropoff_planet.GetName]§!的旅途中过得愉快。"
 nomads.3036.desc.nocomm: "$nomads.3036.intro$他们为我们提供了有关§H[dropoff_planet.owner.GetName]§!的外交情报，我们利用这些情报建立了正式联系。"
 nomads.3036.a: "让我们平安地将他们送达目的地。"
 nomads.3045.name: "代表团已到达"
 nomads.3045.desc: "来自§H[diplomatic_support_issuer.GetName]§!的代表团已经抵达目的地。他们的外交访问现在可以正式开始了，我们祝愿他们的和平事业取得成功。"
 nomads.3050.name: "囚犯登舰"
 nomads.3050.desc: "为了解决§H[pickup_planet.owner.GetName]§!的麻烦，一批我们同意负责转移的罪犯搭着运输船已经登上方舟。我们正尽最大努力安全地安置他们，但如此庞大数量的囚犯迟早会惹出麻烦。\n\n我们的合同为我们提供了处理他们的多种选择，但我们不能把他们再次丢在属于§H[pickup_planet.owner.GetName]§!的星球上。同时，其他帝国很可能也不会喜欢他们的某个殖民地突然涌入大量罪犯。当然，如果我们做得足够隐秘，他们可能永远都不会发现我们到底做了什么。"
 nomads.3050.a: "我们会把他们送到别的地方。"
 nomads.3050.b: "让他们待在船上。"
 nomads.3050.c: "他们可以好好当奴隶。"
 nomads.3050.d: "放他们自由。"
 nomads.3052.name: "囚犯离舰"
 nomads.3052.desc: "作为我们合约的一部分，最后一批囚犯已经卸客。我们已尽力保持谨慎，但总是存在被发现的风险，且人们在面对突然涌入的外星罪犯时，很少会感到愉快。"
 nomads.3053.name: "离舰报告"
 nomads.3053.desc: "我们参与运输罪犯人口的消息尚未传开。看来我们还没有被发现。" #All smooth, no complaints
 nomads.3053.desc.issuer.problem: "我们试图欺骗[prisoner_disposal_issuer.GetName]，但是失败了。虽然罪犯已成功卸载，但我们的行动已被发现，[prisoner_disposal_issuer.GetName]已取消合约并拒绝向我们支付报酬。" #Issuer unhappy cancels contract - ewps
 nomads.3053.desc.problem: "虽然我们的行动已被发现，但[prisoner_disposal_issuer.GetName]依然很高兴我们帮他们处理掉了罪犯，并同意向我们全额支付报酬。" #We got detected by planet owner and they're unhappy, but we still complete the contract c:
 prisoner_tranfer_tt: "\n§Y罪犯£pop£ 人口§!被转移至§Y[From.GetName]§!"
 nomads.3060.name: "游客登船"
 nomads.3060.desc: "一个旅行团在§H[root.solar_system.GetName]§!恒星系登上了方舟舰，一边叽叽喳喳地聊着对旅途的期待一边踏入熙熙攘攘的舰船内舱。\n\n我们订制了一条景色优美的路线，途经若干个值得一去的恒星系供他们游览。现在我们只需要交付好许诺给他们的美景就行了。"
 nomads.3060.a: "启程前往§H[sightseeing_tour_destination_system.GetName]§!。"
 nomads.3060.a.tt: "可以在§H情报日志§!追踪目标恒星系。"
 nomads.3065.name: "观光旅行"
 nomads.3065.desc: "游客欣赏着§H[root.solar_system.GetName]§!恒星系的美景，惊叹于身边的种种奇景。当踏上归途时，他们将再也不同往日了，因为对宇宙之广阔的一手认知将会重塑他们。"
 nomads.3065.a: "现在可以回去§H[sightseeing_tour_end_system.GetName]§!了。"
 nomads.6005.name: "发现机遇"
 nomads.6005.desc: "在代表§H[event_target:contract_issuer.GetName]§!执行合同期间，我们偶然发现了一批古老的集装箱。它们被冰块包裹着，我们差点把它们误认为是普通的陨石。虽然从打捞权的角度来看，这些物品在技术上属于我们，但考虑到它们是在为他们工作时发现的，我们应该考虑将它们移交给§H[event_target:contract_issuer.GetName]§!。扫描这些箱子后，发现里面……"
 nomads.6005.giveback: "我们不应该留着它们。"
 nomads.6005.alloys: "……有$alloys$！"
 nomads.6005.cg: "……有$consumer_goods$！"
 nomads.6005.minerals: "……有$minerals$！"
 nomads.6005.physics: "……是一个$physics_research$数据库。"
 nomads.6005.society: "……是一个$society_research$数据库。"
 nomads.6005.engineering: "……是一个$engineering_research$数据库。"
 nomads.6005.crystals: "……有$rare_crystals$！"
 nomads.6005.gases: "……有$exotic_gases$！"
 nomads.6005.motes: "……是$volatile_motes$！"
 nomads.6005.zro: "……有$sr_zro$！"
 nomads.6005.nanites: "……有$nanites$！"
 nomads.6005.livingmetal: "……有$sr_living_metal$！"
 nomads.6005.threads: "……有$astral_threads$！"
 nomads.6005.artifacts: "……有$minor_artifacts$！"
 nomads.6005.darkmatter: "……有$sr_dark_matter$！"
 opinion_returned_contract_chance_find: "移交货仓"
 nomads.6015.name: "设备失效"
 nomads.6015.desc: "我们方舟舰上的一些老旧模块在一次严重的冷却故障后受损，已经显得老态龙钟。损坏程度很大，好在飞船的完整性受到威胁之前已经进行紧急关停。我们该如何应对？"
 nomads.6015.a: "派遣修理队。"
 nomads.6015.b: "没事，反正也到时候替换了。"
 nomads.6015.c: "现在是时候进行一些升级了。"
 nomads.6015.d: "别担心，我们有充足的备件。"
 nomads.6015.e: "我们可以让客户买单……"
 nomads.6015.e.tt: "§L……根据合同第56条第18款奥米克戎修订案。§!"
 d_compact_modules: "紧凑模块空间"
 d_compact_modules_desc: "一种创新的冷却系统，使我们能够回收部分模块空间用于居住，并利用热输出满足家庭和工业需求。"
 module_recycling: "模块回收"
 module_recycling_desc: "是时候对我们的方舟舰模块进行一些更改了。"
 opinion_abused_contract: "滥用合约"
 opinion_abused_contract_2: "$opinion_abused_contract$"
 nomads.6020.name: "货舱传出的噪音"
 nomads.6020.desc: "在从§Y[event_target:contract_issuer.GetName]§!装载物资时，我们检测到其中一个货舱发生了收容失效。据报告，安全门另一侧传来了低沉的轰鸣声，证实了舱室内存在潜在危险。\n\n我们要冒险进行调查吗？"
 nomads.6020.a: "别拿方舟舰冒险，直接把货物抛入太空。"
 nomads.6020.b: "打开大门。"
 nomads.6025.name: "发光生物体"
 nomads.6025.desc: "货舱门开启后，一群发光生物体令我们措手不及，它们随即窜入了方舟舰的其他区域。异星生物学家的报告显示，这些生物没有攻击性，对我们的公民或飞船的完整性不构成威胁。\n\n这些微小的生物拥有椭圆形的身体，由修长的肢体支撑，能够攀爬墙壁和天花板，并以惊人的速度移动。它们似乎以我们生态系统中的小型害虫为食，利用胸部的发光腺体引诱猎物。居民们已经适应了它们的存在，并发现它们在夜晚格外讨人喜欢——它们发出的光亮和柔和的鸣叫构成了一场令人惬意的奇观。"
 nomads.6025.a: "开始针对它们的生物发光特性进行实验。"
 nomads.6025.b: "让方舟舰的居民尽情享受这奇迹。"
 nomads.6030.name: "超凶的猫猫"
 nomads.6030.desc: "尽管进行了广泛搜寻，我们的团队仍无法在此时已归于沉寂的货舱中找到骚乱的源头。正当他们准备离开时，一个小生物从阴影中钻了出来，扑向一名船员制服上挂着的一根松散线头。\n\n船员们最初吃惊不小，但很快便判定这只外星生物生性顽皮，并无攻击性。当它被小心翼翼地拿近观察时，这个外星动物发出了一种微弱的、类似马达运转的震动，这被解读为一种表示舒适的良性反应。"
 nomads.6030.a: "研究这个样本。"
 nomads.6030.b: "也许有人会收养它。"
 nomads.6035.name: "故障的机械体"
 nomads.6035.desc: "进入货舱后，船员们发现其中一个货运集装箱被从内部破开了。一台受损的机械体瘫在甲板上，电机仍在嗡嗡作响，指示灯紊乱地闪烁着。\n\n船员们试图将该单位放回集装箱，就在这时，一个隐藏隔层打开了，一堆闪烁的水晶散落在地板上。\n\n在永久关机前的一瞬间，机械体发出了一声微弱的低语，据船员报告，其内容为：“别关掉我，我不一样。”"
 nomads.6035.a: "我们会将其退还给失主。"
 nomads.6035.b: "读取其微芯片。"
 nomads.6035.c: "拆了它，取走水晶。"
 nomads.6040.name: "易爆的气体"
 nomads.6040.desc: "靠近货舱时，怪声仍在持续，我们认为采取广泛的安全预防措施极具必要。进入货舱层后，船员们发现舱室内弥漫着强烈的有害异味，并注意到货架碎片散落在停泊区各处。片刻之后，相邻的货柜内发生了几次小型爆炸，引发了紧急响应。\n\n团队循着烟雾痕迹发现了一处小火点。专业人员迅速将其扑灭，使船员能够在事态进一步升级前，安全地控制并中和这些易挥发气体。货舱层出现了明显的结构性损坏，周边区域的多处货箱也遭到了破坏。"
 nomads.6040.a: "我们及时阻止了进一步的损害。"
 nomads.6040.b: "让发行商赔偿损失。"
 nomads.6045.name: "未曾登记的存在"
 nomads.6045.desc: "进入货舱后，骚乱愈演愈烈。声学读数显示源头指向一个货箱。队员们做好了最坏的打算，片刻之后，一个人影从货箱中冲了出来。\n\n此人操着一口浓重且陌生的口音，声称自己带着和平而来。此人自称是§Y[arkship_cargo_leader.GetName]§!，并表示[arkship_cargo_leader.GetHeShe]曾是某个庞大舰队组织的一员，后因纪律原因被开除。[arkship_cargo_leader.GetHeSheCap]解释说，[arkship_cargo_leader.GetHeShe]潜伏在船上，掩盖[arkship_cargo_leader.GetHimHer]自己的行踪是为了寻求庇护，并渴望有机会证明[arkship_cargo_leader.GetHimHer]的价值。\n\n§Y[arkship_cargo_leader.GetName]§!询问队员们是否愿意接受[arkship_cargo_leader.GetHisHer]提议。"
 nomads.6045.desc.noleader: "我们曾处于水深火热之中，直到§Y[arkship_cargo_leader.GetName]§!控制了局面并被授予方舟舰的领导权。"
 nomads.6045.a: "欢迎登船。"
 nomads.6045.b: "对我们来说，你不过是货物。我们会按要求把你送到。"
 nomads.6045.c: "送你回到你该去的地方吧，叛徒。"
 nomads.6050.name: "未经授权的生物货物"
 nomads.6050.desc: "当舱门打开时，那些异常的噪音戛然而止。由于无法确定骚乱的原因，团队开始对货物集装箱进行系统扫描。\n\n其中一个集装箱显示出多个意料之外的生命体征。强行打开后，发现其中有几个人，明显营养不良，身体状况极差。“请发发慈悲，”其中一人说道。“我们遭到了迫害，被迫从§Y[event_target:contract_issuer.GetName]§!帝国逃亡。我们听凭您的发落。”"
 nomads.6050.a: "我们应该把他们遣送回去。"
 nomads.6050.b: "告诉我们你所知道的，我们会带你前往目的地。"
 nomads.6050.c: "我们的方舟舰上还有空余位置。"
 nomads.contract_event_header: "在我们与§H[event_target:contract_issuer.GetName]§!履行现行合约的过程中，出现了一些状况。"
 nomads.6055.name: "学术调查"
 nomads.6055.desc: "$nomads.contract_event_header$他们希望在合约有效期内观察并记录方舟舰上的生活。\n\n似乎对大多数定居文明而言，游牧的生活方式依然令人着迷，且充满着不小的神秘感。"
 nomads.6055.desc.machine: "$nomads.contract_event_header$他们希望在合约有效期内记录方舟舰的运作情况。\n\n他们的既定目标是研究一个在常规行星参数之外运行的移动自治网络，关于这一课题目前几乎没有外部数据可供参考。"
 nomads.6055.desc.hive: "$nomads.contract_event_header$他们要求在合约有效期内获得在方舟舰上的观察权。\n\n该请求源自个体研究人员，他们试图理解一种超出其记录经验的集体移动生存方式。"
 nomads.6055.a: "热烈欢迎贵国前来考察！"
 nomads.6055.a.gestalt: "给予他们观察通行权。"
 nomads.6055.b: "给予有限权限，但是得给钱。"
 nomads.6055.c: "方舟不是可供观赏的游乐场。"
 nomads.6060.name: "运营纠纷"
 nomads.6060.desc: "$nomads.contract_event_header$\n\n两个船员部门之间出现了关于哪个团队拥有操作权限的管辖权争议。双方均已提交正式投诉，受影响区域的工作效率已开始下降。"
 nomads.6060.desc.machine: "$nomads.contract_event_header$\n\n相互冲突的优先指令导致两个管理子系统之间出现了处理冲突。\n\n双方均将自身标记为当前合约的授权操作单位，导致系统陷入循环待机状态，从而降低了产出效率。"
 nomads.6060.desc.hive: "$nomads.contract_event_header$\n\n集合体的运作共振中出现了一个不和谐的线程。\n\n关于当前合约内的责任划分，两个子集群开始发出相互冲突的行为模式，为共享意识引入了低效因素。"
 nomads.6060.a: "在党派间斡旋。"
 nomads.6060.a.gestalt: "仲裁这个冲突。"
 nomads.6060.b: "我们没空做这些。"
 jurisdictional_mediation: "管辖权调解"
 jurisdictional_mediation_desc: "一项管辖权争议已得到正式解决。凝聚力有所增强，不过在更新程序期间，施工进度暂时放缓。"
 command_reassigned: "重新分配指挥权"
 command_reassigned_desc: "争议领域的运营权已被重新分配。这在内部协调中引发了摩擦。"
 nomads.6065.name: "要求休息时间"
 nomads.6065.desc: "$nomads.contract_event_header$\n\n方舟舰的内部监控系统报告称，劳工阶层船员的士气出现恶化。一份要求获得一段休整期的正式请求已被提交。\n\n该请求已抄送至[event_target:contract_issuer.GetName]，对方正等待回复，并必然会要求修改条款。"
 nomads.6065.desc.machine: "$nomads.contract_event_header$\n\n诊断周期发现，多个主次系统积累了大量延期的维护任务。效率预测表明，安排一次定期维护将使劳动力产出获得具有统计学意义的显著提升。\n\n该报告已提交给[event_target:contract_issuer.GetName]，其将密切关注此事的处理情况，并势必会要求修改条款。"
 nomads.6065.desc.hive: "$nomads.contract_event_header$\n\n我们记录到了我们的$planet_jobs_simple_drone$中日益严重的不协调现象。它们的劳作过程需要一段同步恢复期，因为持续的压制有导致集体产出出现显著下降的风险。\n\n[event_target:contract_issuer.GetName]已获悉此情况，并且必然会要求修订条款。"
 nomads.6065.a: "批准请求。"
 nomads.6065.a.tt: "§R这份合约的完成时报酬将减少25%。§!"
 nomads.6065.b: "合约必须优先保障。"
 downtime_granted: "批准休息时间"
 downtime_granted_desc: "方舟舰的劳工群体已获批一段法定休息期。各生产甲板的士气与产出效率均有所提升。"
 downtime_denied: "驳回休息时间"
 downtime_denied_desc: "为了完成合约，员工的休息请求被拒绝。生产阶层的士气受到了压制。"
 nomads.6070.name: "声名鹊起"
 nomads.6070.desc: "$nomads.contract_event_header$\n\n我们作为承包商的良好业绩已声名远播。§H[event_target:reputation_noticed_empire.GetName]§!在监控泛星系贸易活动时注意到了这一点，现在将我们视为一个可靠且有能力的合作伙伴。\n\n我们现在有机会进一步培养这份关系，或者也可以将功劳让给我们自己信任的合作伙伴。"
 nomads.6070.desc.machine: "$nomads.contract_event_header$\n\n我们在已完成合同中记录的运营数据已被外部观察者获取。§H[event_target:reputation_noticed_empire.GetName]§!在追踪该区域的自主网络活动时，注意到了我们的效率指标，并认为我们是一家可靠且有实力的承包商。\n\n通讯频道已建立。我们可以接受这一评价，或者将功劳转交给我们的现有合作伙伴。"
 nomads.6070.desc.hive: "$nomads.contract_event_header$\n\n在观察整个星域的贸易与劳动力流动时，§H[event_target:reputation_noticed_empire.GetName]§!注意到了我们行动中的规律，这彰显了我们的可靠与能力。\n\n认可的共鸣已经到来。我们可以予以回应，或者让其他蜂巢主脑的声音将这一信号传递下去。"
 nomads.6070.a: "向他们保证我们的善意。"
 nomads.6070.b: "好名声就是它自己最好的回报。"
 nomads.6070.c: "将功劳留给§H[event_target:contract_issuer.GetName]§!。"
 nomads.6075.name: "首次调查的意外收获"
 nomads.6075.desc: "$nomads.contract_event_header$\n\n对合约所涉及区域的初步和远程扫描已证实富有成效。数据具有相当大的商业价值，一位独立经纪人已主动提出全面收购。"
 nomads.6075.a: "将其出售给经纪人。"
 nomads.6075.b: "将数据作为合约的补充部分交付。"
 nomads.6075.c: "存档下来，后续为我们自己使用。"
 opinion_unexpected_cargo_positive: "§Y[event_target:contract_issuer.GetName]§!帝国现在对方舟舰§Y[Root.GetName]§!抱持有更加正面的态度"
 opinion_unexpected_cargo_negative: "§Y[event_target:contract_issuer.GetName]§!帝国现在对方舟舰§Y[Root.GetName]§!抱持有更加负面的态度"
 #######################
 # NOMADIC PARAGONS
 #######################
 NAME_nomadic_revenant: "奥伦·维斯"
 DESC_nomadic_revenant: "一个从被焚净的世界中活下来的幸存者，浑身都是累累伤痕，拥有不知疲倦的纪律，并誓言向所有犯下这种暴行的人复仇。"
 catch_phrase_nomadic_revenant: "把屠夫们带到我面前，我将以十倍的残忍回报他们。"
 nomads.1505.name: "$NAME_nomadic_revenant$"
 nomads.1505.desc: "§H那人以军人的姿态登舰，面容因悲痛和多年的流亡而变得坚毅。他的声音低沉、从容，带着钢铁般的锋利。§!\n\n“我的世界被清洗了，我的族人，我的家人……唯我幸存。我隐忍至今。而那些毁灭的始作俑者，必将死于我手。”"
 nomads.1505.a: "你是谁？"
 nomads.1505.a.response: "§H此人停顿下来，仿佛说出自己的名字会撕裂旧伤。§!\n\n“一个名字尚存，尽管其意义已成灰烬。我曾是一名士兵，忠诚而顺从。如今，我是一个被毁灭民族的影子。\n\n如果你非要称呼我，就叫我$NAME_nomadic_revenant$吧。我的过去已不再重要。重要的只有那未偿还的血债。”"
 nomads.1505.b: "为什么选择我们？"
 nomads.1505.b.response: "“你的方舟舰不带任何暴政的旗帜。这便是我站在你面前的原因。我很久以前就明白，一颗星球便是一座牢笼。一旦屠杀开始，便无处可逃。但你们在移动，因此你们能经受磨难。”\n\n“追随你们，此类惨剧或可被蔑视，而我的利刃也将转向那些行下屠行的屠夫。”"
 nomads.1505.c: "你想要什么？"
 nomads.1505.c.response: "“复仇。”\n\n§H这两个字在空气中凝滞。陌生人探身向前，每一根筋腱都因强压下的怒火而绷得紧紧的。§!\n\n“向那些进行清洗的人复仇，向那些屠杀无辜者却将其称之为‘政策’的人复仇。\n\n为了看到这些怪物覆灭，我不惜跨越万水千山，忍受任何伤痛。\n\n助我一臂之力，我将以效忠于你来践行我的誓言。”"
 nomads.1505.d: "你能否在追求个人目标的同时，也为我们的事业效力？"
 nomads.1505.d.response: "“复仇是我的志向，但不必成为你的负担。只要那些星球屠夫尚存一息，我便会追猎不止。在为你效劳的过程中，我将磨砺我的利刃。”\n\n§H他们的目光变得锐利，掠食者般的锋芒穿透了自律的面具。§!\n\n“请以我带来的力量来评价我，而非我留下的伤痕。”"
 nomads.1505.e: "你是我们的同族吗？"
 nomads.1505.e.response: "§H紧接着发出的那声咕哝，是他们最接近笑声的反应。§!\n\n“如果是呢？熟络就能换来同情吗？身体不过是工具。而我的身体，将收割复仇。”"
 nomads.1505.hire_custom_tooltip: "§Y$NAME_nomadic_revenant$§!作为一名§H英杰领袖§!加入了我们的方舟舰。"
 leader_trait_nomadic_revenant: "复仇誓言"
 leader_trait_nomadic_revenant_effect: "$t$—在$NAME_nomadic_revenant$的指挥下，每在舰队战斗中击败一个曾进行过种族灭绝的帝国，特质效果便会增加§G+5%§!（最高可达§G20%§!）。"
 leader_trait_nomadic_revenant_desc: "这位领袖身上刻满了一颗遭到屠杀的星球的伤痕。他誓言永恒复仇，其存在激励着身边战友更猛烈地打击那些犯下此类暴行的人。"
 nomads.1511.name: "履行誓言"
 nomads.1511.desc: "敌方舰队在我们的攻击下溃败。他们的信号逐渐没入静默。\n\n§Y$NAME_nomadic_revenant$§!注视着监视屏，沉默不语。这场胜利中没有喜悦，只有清算。那个奉行大清洗的帝国的旗帜在虚空中燃烧，但在随后的死寂中，他们的誓言依然回荡。\n\n“每击倒一个这样的敌人，都会磨炼我们的意志。我们将继续打击那些推行灭绝政策的人，永不言弃。”"
 nomads.1511.a: "君子报仇，十年不晚。"
 nomads.1511.a.tt: "$leader_trait_nomadic_revenant$特质的效果提高§G+5%§!。"
 MESSAGE_NOMADIC_REVENANT_DESC: "§H指挥官§!§Y$NAME_nomadic_revenant$§!已经完成了自身的复仇。"
 MESSAGE_NOMADIC_REVENANT_TITLE: "$nomads.1511.name$"
 NAME_nomadic_sage: "亚夏尔"
 DESC_nomadic_sage: "亚夏尔在星际间漫游，教导世人：真正的智慧如同星光，在虚空中静静流淌。"
 catch_phrase_nomadic_sage: "无一物者，担万物。"
 nomads.1515.name: "$NAME_nomadic_sage$"
 nomads.1515.desc: "§H你面前站着一位穿着仪式礼袍的流浪者，饰品与织物的排列显然经过精心打理。反重力伺服器嗡嗡地震动着，驱动着一本法典漂浮在她面前。当她终于开口时，每个字听起来都不像是回答，而更像是一个未问出口的问题的回响。§!\n\n“意外与命运生着别无二致的面孔，而今天它转向了你。”"
 nomads.1515.a: "你是谁？"
 nomads.1515.a.response: "“名字如容器；我的名字恰巧是$NAME_nomadic_sage$。但唯有虚空的容器，方能成就其用。”"
 nomads.1515.b: "你为什么四处流浪？"
 nomads.1515.b.response: "“那些陈旧梦想毫无意义。唯有在运动中，指引方能流淌；唯有在变革中，智慧方能呼吸。”\n\n§H异星人的存在感如同件无重量的斗篷般降临，连空气似乎都在其陪伴下凝固了。§!\n\n“告诉我：人若不是在寻找那缺失之物，又是在寻找什么呢？”"
 nomads.1515.c: "你想要什么？"
 nomads.1515.c.response: "§H外星人沉默了许久，仿佛满足于让这份寂静作为回答。也许她并非在权衡你的话语，而是在掂量发问者的分量。§!\n\n“为了入座你的阴影，为打破沉寂时的话语，为了提醒你连星辰也在流浪。”"
 nomads.1515.d: "你的智慧果真如此超群吗？"
 nomads.1515.d.response: "§H一瞬之间，她的目光变得犀利，你内心深处的某些东西被展露无遗。§!\n\n“若果真如此，我便无需开口。智慧是倾听的回响，而非言语的分量。\n\n“如果你听到了，那么智慧便已属于你。”"
 nomads.1515.e: "直说！"
 nomads.1515.e.response: "§H$NAME_nomadic_sage$流露出一抹恼怒的神色，转瞬即逝，犹如掠过星间的残影。§!\n\n“那我就直说了：王座终将腐朽，疆界皆为谎言，唯有虚空永恒。如果这还不够直白，那或许是因为它还不够单纯。”"
 nomads.1515.hire_custom_tooltip: "§Y$NAME_nomadic_sage$§!作为一名§H英杰领袖§!加入了我们的方舟舰。"
 leader_trait_nomadic_sage: "无重引导"
 leader_trait_nomadic_sage_effect: "$t$—当$NAME_nomadic_sage$在内阁任职时，§Y[Owner.Ruler.GetTitle]§!技能等级每提升一级可使§Y$pop_cat_ruler_plural$§!产出增加§G+3%§!（最高§G+15%§!）。\n$t$—$NAME_nomadic_sage$不占用领袖上限。"
 leader_trait_nomadic_sage_desc: "$NAME_nomadic_sage$不担负指挥的重任，但所有与她同行的人都会发现自己的步伐变得更加稳健。真正的智慧能为领导者扫清障碍。"
 NAME_nomadic_naturalist: "小塞罗"
 DESC_nomadic_naturalist: "曾任$grand_archive$的策展人$NAME_nomadic_naturalist$离开了那无尽的库房，转而追求游牧生活。他的日志中绘满了关于那些呼吸、生长与演变的星球的素描。"
 catch_phrase_nomadic_naturalist: "欲究生命，必与之同行。"
 nomads.1520.name: "$NAME_nomadic_naturalist$"
 nomads.1520.desc: "§H眼前的身影显然已届高龄，但其目光中却流露出对发现的强烈渴望。他的动作沉稳且安静，带着那种在野外躬耕一生的谨慎与洗练。§!\n\n“向您致敬。我叫小塞罗。”"
 nomads.1520.a: "你为了什么而来到此地？"
 nomads.1520.a.response: "“许久以前，我曾在一座$grand_archive$供职。但我厌倦了那些毫无生气的事物。化石、种子、标本……一切都冻结在呼吸之间。我渴望见到生命最真实的面貌。”\n\n“你们运动不息。当你们扫描深空时，深空亦会回响。如果你们愿意接纳我，我更想在生者之中学习。探索新世界，遇见奇异的生命形式……我们将学习它们教予我们的一切。”"
 nomads.1520.b: "你离开了一座$grand_archive$？"
 nomads.1520.b.response: "§H一声干涩、壳质的摩擦声从塞罗的大颚中传出。片刻之后，你才意识到那是笑声。§!\n\n“在那些宏伟的厅堂之内，他们保存了一切，唯独遗忘了当下。经过长年的效力，我意识到档案馆最大的缺失正是生命本身。”\n\n“事实上，我最近遇到了一种非凡的未开智物种。尽管它们以宁静的姿态忍受着囚禁的生活，但这样的生物并非为笼子而生。像您这样的一艘飞船，能为它们提供茁壮成长所需的空间。”"
 nomads.1520.c: "你希望在我们这里发现什么？"
 nomads.1520.c.response: "“会呼吸的模式。咏唱着数据的星球……”\n\n§H他的附肢握紧又伸展开，仿佛想要从空气中攫取答案。§!\n\n“星系中动植物之间的界限，比我以前在档案局的同事们所认为的还要模糊。生命总能找到模糊分类的方法。也许，这就是它唯一的规则。”"
 nomads.1520.d: "你能给我们提供什么？"
 nomads.1520.d.response: "§H外星人瞥向视窗，以及那片无尽星海。§!\n\n“经验。耐心。一种洞察表象之下规律的方法。\n\n“在你的旅程中给我留个位置，我将助你更深刻地观察，并从你发现的世界中更全面地学习知识与经验。”"
 nomads.1520.e: "你长得很像我们的同类。"
 nomads.1520.e.response: "“是的！是的，我一直盼着你能注意到。”\n\n§H他凑得比必要的距离更近，螯牙因难以抑制的兴奋而颤动着。§!\n\n“分段结构、承重关节、感觉丝……这些相似之处太精确了，绝非巧合。”\n\n§H他爆发出一阵尖厉的笑声。§!\n\n“如果这其中存在共同的祖先、趋同演化，或者某种更离奇的联系，我必须好好检查一下……噢！我们一定能从彼此身上学到很多东西！”"
 leader_trait_nomadic_naturalist: "生命轮转"
 leader_trait_nomadic_naturalist_desc: "发现生命，亦是被生命所改变。每一个新物种，每一种奇特的生态，都在教会我们如何更好地生活。"
 nomads.1520.hire_custom_tooltip: "§Y$NAME_nomadic_naturalist$§!作为一名§H英杰领袖§!加入我们的方舟飞船，并带来了§G300§!§H$job_xeno_zoo_animal_plural_with_icon$§!。需要建造一座£building£ §H异星动物园§!才能获得其产出收益。"
 leader_trait_nomadic_naturalist_effect: "$t$—当分配至方舟舰时，提升深度扫描能力。\n$t$—允许对宜居行星进行深度扫描。"
 nomads.1525.name: "编目未开智体"
 nomads.1525.desc: "我们最近对§Y[FromFrom.GetName]§!开展调查，探测到了微弱的生命迹象，发现了一个此前未被记录的未开智物种。\n\n§Y$NAME_nomadic_naturalist$§!坚持只采集有限的样本用于研究，并强调要悉心照料并提供丰富的环境。现在，一小群该物种将居住在首府方舟舰的观察栖息地中。\n\n塞罗相信，随着时间的推移，我们从这些迷人生物身上学到的东西，将不亚于它们从我们这里学到的。"
 nomads.1525.a: "令人愉快！"
 nomads.1525.b: "令人反感，但可能有用的。"
 MESSAGE_NOMADIC_NATURALIST_DESC: "§H科学家§!§Y$NAME_nomadic_naturalist$§!发现了新的未开智物种！"
 MESSAGE_NOMADIC_NATURALIST_TITLE: "$nomads.1525.name$"
 planet_xeno_zoo_animals: "$job_xeno_zoo_animal$"
 NAME_nomadic_caregiver: "索拉斯单元"
 DESC_nomadic_caregiver: "当他的族人拥抱合成化的完美时，$NAME_nomadic_caregiver$为了留在患病的儿子身边而选择了流亡。如今，他在星际间流浪，照顾那些迷失之人，并教导那些将继承未来的人。"
 catch_phrase_nomadic_caregiver: "生命在延续，而当我们选择去关爱，它便会茁壮成长。"
 nomads.1530.name: "$NAME_nomadic_caregiver$"
 nomads.1530.desc: "§H高大的合成人低下了头。它的每一个动作都精准无误，仿佛承载着漫长岁月的重量与沉重的负担。尽管身躯是金属构架，它的神态中却透着一种显而易见的感染力。一个瘦小的身影躺在它背上的摇篮里，苍白的皮肤映衬着明亮的双眼。§!\n\n“我叫索拉斯单元。我和我的儿子请求通行。”"
 nomads.1530.a: "你为了什么而来到这里？"
 nomads.1530.a.response: "“当我的族人飞升为合成形态时，他们将其称之为解脱。但在追求完美的途中，他们忘记了怜悯。我儿子的罕见病症曾会让那种转化变得致命。如你所见，这夺走了他的行动能力。但在我的族人视之为局限的地方，我看到了光芒。选择了他，我便选择了流亡。”\n\n“现在，我们前往需要我们的地方。机器或许没有心跳，但它依然能守护他人的生命。”"
 nomads.1530.b: "你的儿子……他情况稳定吗？"
 nomads.1530.b.response: "§H孩子听到问题后微微动了动，他的声音虽然微弱，但通过摇篮内置的扬声器清晰地传了出来：§!\n\n“我没事。星星移动得很慢，我能跟得上。”\n\n§H$NAME_nomadic_caregiver$低下头，伺服电机发出轻微的嗡鸣声：§!\n\n“他的身体面临着某些挑战，但他的意志拒绝屈服。我的族人追求完美，却只得到了冷漠。我现在的旅程，是为了报答他的勇气教会我的一切。在那之前，我会一直带着他，尽我所能教他关于这片生机勃勃的星空的知识。”"
 nomads.1530.c: "你希望传授什么？"
 nomads.1530.c.response: "“生存不仅依靠力量，更是沿途艰难赢取的智慧。\n\n每一次邂逅都会留下教训。我帮助年轻人将这些教训传承下去，好让我们走过的每一段路，都使我们比以往更加睿智。”"
 nomads.1530.d: "为什么要承担这样的负担？"
 nomads.1530.d.response: "§H合成人的目光移向视口，倒映着远方的星辰。§!\n\n“因为每一代人都必须重新学习同样的真理。路途教会了他们，但必须有人帮助他们理解所见之物。”\n\n§H然后传来了孩子尖细的声音，即使通过软扬声器听起来也很清脆：§!\n\n“他总是这么说。我觉得这只是意味着他喜欢帮助别人。”"
 nomads.1530.e: "我们是合成人。这会有问题吗？"
 nomads.1530.e.response: "§H$NAME_nomadic_caregiver$在处理这个问题时，光学传感器亮度略微增加。§!\n\n“不。不会有问题的。我族人的飞升是一种希望之举。我的拒绝亦是如此。我并不怨恨任何跨过那个门槛的人。也不怨恨那些在门槛之外出生的人。”\n\n§H他的声音中带上了一种温柔、令人安心的嗡嗡声。§!\n\n“当身体改变时，同情心并不会枯萎。如果说有什么变化的话，那就是它变得更容易承载了。”"
 nomads.1530.trait.1: "$MOD_LOGISTIC_GROWTH_MULT$"
 nomads.1530.trait.2: "$MOD_PLANET_POP_ASSEMBLY_MULT$"
 leader_trait_nomadic_caregiver: "学习管务员"
 leader_trait_nomadic_caregiver_desc: "每次完成合约，这位领袖能将方舟舰变成了成长与学习的摇篮。"
 leader_trait_nomadic_caregiver_effect: "$t$—$mod_planet_researchers_produces_mult$：§G+3%§!\n$t$—每完成一个§H合约§!，效果提升§G+3%§!（最高§G+15%§!）\n$t$—$mod_planet_researchers_amenities_produces_add$：§G+150§!"
 nomads.1545.name: "合约学习"
 nomads.1545.desc.normal: "$NAME_nomadic_caregiver$认为，从我们最近完成的合约中学到的教训，提供了一个独特的教育机会。孩子们聚集在他耐心的指导下，不仅学习字母和逻辑，还学习共情与合作。\n\n他儿子的笑声在走廊里回荡，提醒着即使是最年长的旅行者：欢乐是一种任何技术都无法取代的力量。"
 nomads.1545.desc.machine: "$NAME_nomadic_caregiver$认为，在最近完成的合约执行期间所学到的教训，提供了一个独特的反馈机会。新单元正在接受维护协议、观察和协作方面的指导。虽然它们的记忆留存效率参差不齐，但参与单元的功能性有所提高。\n\n目前看来，尽管这种做法不同寻常，但其结果是效率得到了可衡量的提升。"
 nomads.1545.desc.hive: "$NAME_nomadic_caregiver$ 认为，我们在最近完成的合约执行期间所学到的教训，为重新调整提供了一个独特的机会。通过我们的$councilor_gestalt_cognitive$，他传授着耐心与协作，引导着这些工蜂，仿佛它们是他自己的后代一般。\n\n虽然我们对这种奉献感到好奇——一个个体在哺育整个集体——但其成果是不容置疑的。我们的思绪正回荡着新的和谐旋律。"
 nomads.1545.b: "一种不寻常，但有益的做法。"
 nomads.1545.c: "我们认为这种做法很有价值。"
 nomads.1545.effect_tt: "§Y$NAME_nomadic_caregiver$§!从这次经历中有所感悟：\n$t$—$mod_planet_researchers_produces_mult$：§G+3%§!"
 MESSAGE_NOMADIC_CAREGIVER_TITLE: "$nomadic_education$"
 MESSAGE_NOMADIC_CAREGIVER_DESC: "§Y$NAME_nomadic_caregiver$§!的工作再次提高了我们的§H无形资源产出§!。"
 nomadic_education: "人在学途"
 nomadic_education_desc: "§Y$NAME_nomadic_caregiver$§!从这份合同中学到了一些新东西。"
 NAME_nomadic_champion: "萨尔·哈斯克古戎"
 DESC_nomadic_champion: "$NAME_nomadic_champion$曾为了报酬、荣誉和信条征战百场，直到这三者都变得空洞乏味。如今他只为搏斗本身的纯粹快乐而战——以及胜利后留下的战利品。"
 catch_phrase_nomadic_champion: "一切最后都会被虚无吞噬的，所以趁现在就要狠狠地打，大声地笑！"
 nomads.1555.name: "$NAME_nomadic_champion$"
 nomads.1555.desc: "§H新来的人带着洪亮的笑声走近，浑身散发着喜悦的气息。他的动作轻盈自如，仿佛是一个多次躲过死神、已不再将其放在心上的人。§!\n\n“我叫$NAME_nomadic_champion$。听说你喜欢冒险。给我一场战斗，让我在虚空中施展拳脚，我会给你呈现值得一看的表现。谁知道呢？也许一路上我们还会收获一些纪念品。”"
 nomads.1555.a: "你是一名雇佣兵？"
 nomads.1555.a.response: "“没错。我曾在太空城邦的那帮人里混了好几年，他们把每场小冲突都看作一笔薪水。打仗倒没什么，就是那些同僚，实在不敢恭维。\n\n§H他咧嘴一笑，仿佛这段回忆里藏着什么只有他自己懂的笑话。§!\n\n“事实证明，当周围的人都在计算报酬时，一个人很难真正享受一场激战。所以我走了。生命太短暂，没必要为别人的资产负债表流血。”"
 nomads.1555.b: "你还以战斗为信仰吗？"
 nomads.1555.b.response: "§H他仰头爽朗地大笑起来。§!\n\n“信仰？没必要。该是战斗信仰我！\n\n“但是你应该比绝大多数人都懂这个道理……在这里，关键在于你从每一场冲突中带走了什么。一道伤疤、一块碎片、一个故事。你们游牧民的想法就很对：留下值得留下的，其余的随它去吧。”"
 nomads.1555.c: "你现在的动力是什么？"
 nomads.1555.c.response: "§H他晃了晃肩膀，仿佛在为战斗做热身。§!\n\n“下一场战斗。”\n\n“如果它不想要我的命，那就不值得我浪费时间。”"
 nomads.1555.d: "你为我们提供什么？"
 nomads.1555.d.response: "§H他身体前倾，笑容愈发灿烂。他的眼神中闪烁着光芒，一半是友好，一半是警觉。§!\n\n“一场痛快的战斗，再加上些值得带走的战利品。我会教你的军队怎么打才叫像样，让他们学会战斗的美，再在每一场胜利中有所收获。那些战利品能让我们认清自己，或许也能让整个星系认识我们。”"
 nomads.1555.e: "看来你以前见过我们的族人……"
 nomads.1555.e.response: "§H他猛地闭上了嘴。皮肤上泛起一阵明显的颜色变化。他这是……脸红了吗？§!\n\n“啊。是的。希望不是你认识的人？”"
 nomads.1555.f: "你是我们的同类吗？"
 nomads.1555.f.response: "§H他宽阔的双肩抖动了一下，漫不经心地耸了耸肩。§!\n\n“也许吧？可能吧？我们到底还做不做这件事？”"
 leader_trait_nomadic_champion: "欢愉斗士"
 leader_trait_nomadic_champion_desc: "每一场战斗都会留下印记，而$NAME_nomadic_champion$收集了所有的印记。他的笑声将危险化为胜利，他的战利品时刻提醒着舰队我们为何而战。"
 leader_trait_nomadic_champion_effect: "$t$—这名指挥官在成功§Y率领§!发动一次行星入侵后，有一定几率可以缴获一件珍贵的§H战利品§!。\n$t$—战利品将储存在我们§Y$col_capital$§!上的§H$d_trophy_hall$§!中，其效果可以堆叠。"
 d_trophy_hall: "战利品大会堂"
 d_trophy_hall_desc: "一座穹顶大厅，悬挂着§G$NAME_nomadic_champion$§!的战利品。每一件留有伤痕的遗物都诉说着反抗与胜利，激励着所有走过此地的人。"
 nomads.1565.name: "值得收藏的战利品"
 nomads.1565.desc: "§H$NAME_nomadic_champion$露出笑容，小心翼翼地放下了一个物件。其形状难以辨认：部分是金属，部分是骨头，还有一部分完全是某种别的东西。无论它是什么，身上都带着明显的战斗痕迹。§!\n\n“每场战斗都会留下些什么，但只有一部分值得保留。不如我们把它好好展示出来，如何？反正我们的空间多得是！”\n\n§H他爆发出一阵肆无忌惮的响亮狂笑，仿佛这件战利品是他与星辰之间心有灵犀的一个私人笑话。§!"
 nomads.1565.a.tt: "我们的§Y$col_capital$§!将获得一座新的§H$d_trophy_hall$§!，其效果如下：\n—$mod_job_soldier_add$：§G+50§!\n—$MOD_ARMY_BUILD_SPEED_MULT$：§G+10%§!\n—$MOD_PLANET_ARMY_BUILD_COST_MULT$：§G-5%§!\n—已收集的战利品：§G+1§!\n—效果随已收集的§H战利品§!数量翻倍（最大8倍）"
 MESSAGE_NOMADIC_CHAMPION_TITLE: "获得战利品"
 MESSAGE_NOMADIC_CHAMPION_DESC: "§H指挥官§!§Y$NAME_nomadic_champion$§!缴获了另一件战利品！"
 NAME_nomadic_princess: "塞拉伦涅"
 DESC_nomadic_princess: "尽管$NAME_nomadic_princess$如此年轻，却已饱经旅途的风霜。然而，她拥有一种让周围人感到安心的沉着，以及一份无所求的坚韧。"
 catch_phrase_nomadic_princess: "在无尽的星海深处，有一个声音正呼唤我回家。"
 nomads.1580.name: "$NAME_nomadic_princess$"
 nomads.1580.desc: "§H年轻的流浪者步出，神色从容而谨慎。漫长旅途的印记笼罩着她，但她身上同样散发出一种沉静、不容忽视的力量。§!\n\n“我的名字是$NAME_nomadic_princess$。我从很远的地方赶来……比我曾设想过的还要遥远。如果你们这里还有位置，我请求在此借宿一段时日。”"
 nomads.1580.a: "你为了什么而来到这里？"
 nomads.1580.a.response: "“我希望我能确定。我身后的路上，有些片段感觉……缺失了。而另一些，我却记得太清楚。”\n\n§H她的目光变得柔和，眼中闪烁着一丝微弱的希望。§!\n\n“如果你愿意接纳我，我想与你同行。在某些东西再次溜走之前，我需要找到它，或者记起它。”"
 nomads.1580.b: "你不记得过去了吗？"
 nomads.1580.b.response: "“并非全部。记不清了。”\n\n“有些记忆感觉像是属于另一个人的。没有名字的面孔，星海之中的家园……然后便是一片虚无。”\n\n§H她用拇指拂过斗篷的边缘。§!\n\n“我只知道我弄丢了很重要的东西。是什么把我带到了这里？运气、命运……或许兼而有之。我需要时间去揭开剩下的真相。”"
 nomads.1580.c: "你对我们有什么要求？"
 nomads.1580.c.response: "§H她望向星空，眉头微蹙，掩饰着眼底的渴望。§!\n\n“我不确定故乡是一个回忆，还是一个终点。但我的直觉告诉我，若是与你同行，我也许终能找到答案。”"
 nomads.1580.d: "你能提供什么？"
 nomads.1580.d.response: "§H$NAME_nomadic_princess$稳住心神，仿佛在字斟句酌。§!\n\n“如果人们无法彼此信任，那便只有悲哀。我虽年少，但至少懂得这个道理。如果你能给我留一个位置与各位并肩作战……我会尽我所能向他们提供帮助。”\n\n§H她的声音柔和了下来。§!\n\n“当我找到家园之时，我绝不会忘记那些曾助我归家的人。”"
 nomads.1580.e: "你与我们物种的相似程度令人惊讶。"
 nomads.1580.e.response: "§H$NAME_nomadic_princess$犹豫了一下，一丝疑虑掠过她的脸庞。§!\n\n“我注意到了。这是我不理解的事情。”\n\n§H她用手轻抚脸颊，仿佛希望通过触碰能唤回记忆。§!\n\n“如果我来自你的族群，或者我们有着某种遥远的联系……真相就在我无法触及的地方。我只知道：我想帮忙。如果你愿意接纳我，我将为你的旅程献出我的双手与真心，直到我发现自己起航的地方。”"
 nomads.1580.hire_custom_tooltip: "§Y$NAME_nomadic_princess$§!以§H英杰领袖§!的身份加入了我们的方舟舰。"
 leader_trait_amnesiac: "失忆"
 leader_trait_amnesiac_desc: "$NAME_nomadic_princess$遗忘了她的过去，但如果她能够返回失去一切的地方，或许能找回她的记忆。"
 leader_trait_amnesiac_effect: "$NO_ACTIVE_EFFECTS$"
 nomads.1585.name: "记忆的遗踪"
 nomads.1585.desc: "最近，§Y$NAME_nomadic_princess$§!的脑海中开始浮现出模糊的回忆，那是一种她也无法解释的熟悉感。据她描述，方舟号上的某些走廊让她觉得似曾相识，而星图中的某些星象布局也勾起了一种出人意料的联结感。\n\n§H“我不明白为什么这些地方会吸引我，但我标注出了那些感觉……重要的地方。如果我们前往那里，或许能找回更多的记忆。”§!\n\n她标出了几处与她深藏的记忆产生共鸣的坐标——这些地点本身可能也值得调查。"
 nomadic_princess_chain_title: "过去的碎片"
 nomadic_princess_chain_desc: "模糊的记忆指引着§Y$NAME_nomadic_princess$§!飘向星海深处。前往那里应当能帮她想起更多往事。"
 nomadic_princess_poi_title_1: "遥远的回忆"
 nomadic_princess_poi_desc_1: "§Y$NAME_nomadic_princess$§!标记的坐标显得异常熟悉。"
 nomadic_princess_poi_title_2: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_2: "$nomadic_princess_poi_desc_1$"
 nomadic_princess_poi_title_3: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_3: "$nomadic_princess_poi_desc_1$"
 nomads.1595.name: "缅怀的边缘"
 nomads.1595.desc: "§Y[fromfrom.GetName]§!星系没能提供多少答案。§Y$NAME_nomadic_princess$§!感到一种无法解释的熟悉感，而我们的扫描仪在恒星轨道上检测到了一块漂浮的人造残骸碎片。其结构暗示其采用了深空设计，但哪怕有什么标记或识别符号，也早就因时间而消逝。\n\n§H“我曾希望来到这里能唤醒些什么，”§!她轻声说道。§H“但……还不是时候。”§!"
 nomads.1600.name: "家园之景"
 nomads.1600.intro: "我们的调查团队在§Y[fromfrom.GetName]§!星系的残骸中发现了一个漂浮的小型数据水晶。它的外壳已经焦黑，但有一处细节依然清晰可见：一段旧注册码的碎片，字母为§H‘U-N-S’§!。"
 nomads.1600.nonhuman: "$nomads.1600.intro$它们的含义尚不明确，但$nomads.1600.outro$"
 nomads.1600.human: "$nomads.1600.intro$这与我们的历史记载存在着惊人的相似性，但是$nomads.1600.outro$"
 nomads.1600.outro: "水晶解密后的内容还包括一组精确的坐标。\n\n与此同时，§Y$NAME_nomadic_princess$§!也找回了另一段记忆。她想起了一个巨大的观景台，星辰在寂静的观察窗外流淌，还有一只指引的手指向一颗蓝色的星球——那是距离其恒星最近的第三颗行星。"
 nomads.1600.a: "我们必须帮她想起剩下的部分。"
 nomads.1600.b: "她的过去无关紧要。我们已经得到了需要的东西。"
 nomads.1605.name: "童年的回声"
 nomads.1605.desc: "§Y$NAME_nomadic_princess$§!又浮现出了一段记忆。她想起了一座大厅，里面坐满了衣着考究的人，他们低沉而深思熟虑的语调中透着惯于发号施令者的自信。\n\n§H“他们在争论，”§!她低声说道。§H“声音不大，但措辞犀利……是关于一项任务。关于一次必须保密的发射。还有其他的，还有两艘飞船和我们一起出发了。但为什么？我们到底在逃离什么？”§!"
 nomads.1605.a: "日益深邃的谜团。"
 nomads.1610.name: "回收的碎片"
 nomads.1610.desc: "§Y$NAME_nomadic_princess$§!浮现出了一段新的记忆。她回想起一艘巨大的世代飞船，其船体旨在承载整个未来。\n\n随后是一次剧烈的震动：警报声响起，远处走廊里金属炸裂的火光闪现。她记得自己被一位女子抱起，带进了一个逃生舱。\n\n§H“她紧紧抱着我。她说我必须活下去……说我太重要了。接着我就孤身一人了。我几乎能看见她的脸庞，但每次它都悄然逝去。”§!"
 nomads.1610.a: "世代飞船……像我们这艘一样的？"
 NOMADIC_PRINCESS_SPECIAL_PROJECT: "毁坏的舰船"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_DESC: "坐标指向了一艘巨大飞船的残骸，其上层结构与标准的方舟舰设计相符。\n\n初步探测结果表明发生了灾难性的内部故障。全面调查可能会发现与§Y$NAME_nomadic_princess$§!恢复的记忆相关的线索。"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_REQUIREMENT: "轨道上有$COUNT$/$REQUIRED$艘$arkship_cap$或科研船。"
 nomads.1620.name: "幸存的继承人"
 nomads.1620.desc: "对毁坏方舟舰的分析让我们深入了解了§Y$NAME_nomadic_princess$§!的起源。其内部结构和生命维持体系与她身上回收的碎片完全吻合。受损的日志中提到了一位指定的继承人，一个自出生起就接受培养、旨在有朝一日领导这艘飞船及其族群的个体。\n\n记录证实，在结构崩解前的几秒钟内，只有一名未成年乘客被撤离。没有其他逃生舱发射。\n\n§H“他们救了我，”§!她轻声说道。§H“我不只是个乘客……我本该领导他们，现在我恳求你帮我理解其中的原因。”§!"
 nomads.1620.a: "将舰船恢复。"
 nomads.1620.tt: "§H$NAME_nomadic_princess$§!已恢复记忆，并获得了§Y$leader_trait_nomadic_princess_1$§!与§Y$leader_trait_nomadic_princess_2$§!特质。"
 leader_trait_nomadic_princess_1: "继承恩典"
 leader_trait_nomadic_princess_1_desc: "在修复的方舟舰内，记忆各就其位。§H$NAME_nomadic_princess$§!找回了曾经用于引导其族人的训练片段。她沉稳的姿态和深邃的洞察力，使她成为星际势力间天生的调停者。"
 leader_trait_nomadic_princess_2: "合法管理者"
 leader_trait_nomadic_princess_2_desc: "§H$NAME_nomadic_princess$§!回到被修复好的方舟舰后，唤醒了她所受训练的全部潜能。她现在正式担负起她命中注定的重任。"
 leader_trait_nomadic_princess_effect: "$t$—$mod_planet_jobs_produces_mult$：§G+5%§!\n$t$—殖民地基础设施建造速度：§G+20%§!"
 nomadic_princess_not_aboard_ship: "§R\n$t$统治§H$NAME_princess_fleet$§!时效果生效§!\n\n"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2: "修复方舟舰"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2_DESC: "重建破碎的飞船并非易事，但这样做或许能揭示§Y$NAME_nomadic_princess$§!的起源，以及她注定要继承的遗产。"
 nomads.1625.name: "重返过去"
 nomads.1625.desc: "方舟舰已恢复运转，那些沉睡已久的系统立即响应§Y$NAME_nomadic_princess$§!的出现。修复的数据库证实了她记忆中的猜想：她自幼便接受培养，旨在引导这艘飞船以及曾经生活在其中的子民。\n\n最后一封音频日志幸存了下来。一个沉着而熟悉的女声谈论着继承协议，以及一个必须被保护的孩子。在方舟舰开始瓦解之际，她下令发射了逃生舱。\n\n§H“那个声音……”§!$NAME_nomadic_princess$低声细语道。§H“我认得它。她曾是……我。或者说我是以她为原型的。一个克隆体……这就是为什么我能活下来。她想要拯救她自己。”§!\n\n无论曾是什么将这艘船带入黑暗，现在它已在我们的旗帜下航行，并由重掌大权的继承人管理。"
 nomads.1625.a: "成真的命运。"
 NAME_princess_fleet: "UNS-三叶草"
 NAME_princess_ship: "$NAME_princess_fleet$"
 nomads.1630.name: "残片丢失"
 nomads.1630.desc: "随着§Y$NAME_nomadic_princess$§!的离去，她所承载的脆弱记忆之迹也已归于沉寂。她曾追寻的真相，如今再也无法找回。\n\n她的故事在此终结，虽未完结，但并未被遗忘。"
 nomads.1630.a: "我们会记住这一切。"
 nomadic_princess_tt: "§R$NAME_nomadic_princess$在找回记忆前不可被解雇。§!"
 leader_no_dismiss_tt: "§R当前无法解雇该领袖。§!"
 #######################
 # Arkship Events
 #######################
 # Arkship Destruction
 ARKSHIP_DEBRIS: "方舟残骸"
 ARKSHIP_DEBRIS_DESC: "一艘巨大的方舟战舰在战斗中被摧毁，留下了一片广阔的残骸。其基础设施、引擎和船体的残余可能为打捞提供有价值的材料。"
 RECOVER_DISABLED_NOMAD_VESSEL: "修复计划"
 RECOVER_DISABLED_NOMAD_VESSEL_ARKSHIP_DESC: "我们的一艘方舟舰陷入黑暗无助漂流，它的各个系统都被紧急关闭了。只要派遣到位，我们的工程师就可以恢复供电，重新取得控制，使其恢复正常运作。"
 RECOVER_DISABLED_NOMAD_VESSEL_WAYSTATION_DESC: "我们的一座驿站陷入了黑暗，它的各个系统都被紧急关闭了。只要派遣到位，我们的工程师就可以恢复供电，重新取得控制，使其恢复正常运作。"
 arkship_debris_wreckage: "方舟残骸"
 arkship_debris_wreckage_desc: "一艘游牧方舟舰的残骸在太空中悄然漂流。派遣一艘科学飞船勘测残骸可能会获得有价值的打捞品。"
 arkship.1005.name: "游牧方舟被毁"
 arkship.1005.desc: "§Y[from.solar_system.GetName]§!星系中的§Y[from.GetName]§!方舟终于被摧毁了。\n\n方舟不仅仅是一个战争的器具，它还是无数游牧生命体的家园。曾经生活和旅行于其中的几代人现在失去了维系他们的基础。\n\n剩下的只有残骸，在虚空中悄无声息地漂流。"
 arkship.1005.a: "巨大的成功。"
 arkship.1005.desc.nomad: "方舟舰§Y[from.GetName]§!已在§Y[from.solar_system.GetName]§!星系中被摧毁。\n\n在所有民族之中，我们最明白这样的舰船意味着什么——一个仅凭船体与引擎承载的文明，一代又一代都在同样的舱壁内生老病死。这份理解并未拯救他们。它也无能为力。\n\n他们的漂泊到此为止。"
 arkship.1005.b: "他们的航程结束了。"
 arkship.1005.desc.homicidal: "异星舰船§Y[from.GetName]§!已在§Y[from.solar_system.GetName]§!星系被歼灭。\n\n游牧舰队进行了激烈抵抗，但终究不敌我方。那些在群星之间无序漂泊的流浪者始终是个威胁。他们的方舟舰已化作四散的残骸。\n\n不要让他们任何一人找到安全港。"
 arkship.1005.c: "又一个障碍被清除了。"
 arkship.1015.name: "苦涩的损失"
 arkship.1015.desc: "我们位于§Y[from.solar_system.GetName]§!星系的方舟舰§Y[from.GetName]§!已被敌人摧毁。\n\n战斗异常激烈，但敌人的力量势不可挡。尽管我们的船员英勇无畏，但我们的防御最终瓦解，方舟舰永远地离开了我们，它的残骸散落在太空中。\n\n这一天将永远被铭记。"
 arkship.1015.a: "难以置信的悲剧。"
 arkship.1015.desc.nomad: "我们的方舟舰§Y[from.GetName]§!已在§Y[from.solar_system.GetName]§!星系中陷落——并非毁于那些畏惧未知的定居帝国之手，而是毁于与我们一样熟悉虚空的流浪者之手。\n\n§Y[fromfrom.GetName]§!向我们发动了攻击，明知摧毁一个民族最后的家园意味着什么。流浪者之间没有团结，只有生存。\n\n我们不会忘记这一切。"
 arkship.1015.b: "虚空没有忠诚可言。"
 arkship.1015.desc.homicidal: "我们的§Y[from.GetName]§!方舟在§Y[from.solar_system.GetName]§!系中被摧毁了——不是被征服，而是被处决。\n\n§Y[fromfrom.GetName]§!根本不要什么领土或者朝贡，他们只要我们死。在将我们从星间灭绝的行动中，船上的每一条生命对他们而言都是可接受的伤亡数字。\n\n但我们经历了这一切侥幸活了下来，我们绝不会被抹杀。"
 arkship.1015.c: "我们绝不会被抹杀。"
 #Random Events
 an_old_container_chain_title: "老旧的收纳箱"
 an_old_container_chain_desc: "§Y方舟舰[Root.GetName]§!在维护作业期间，底层甲板发现了一个未登记且经过重重加固的容器，该容器正发出放射性信号。由于缺乏档案记录或识别标记，其来源和用途尚不明确。"
 arkship.5.name: "老旧的收纳箱"
 arkship.5.desc: "在对§Y方舟舰[Root.GetName]§!下层甲板进行例行维护时，我们的工程师发现了一个散发放射性信号的旧密封容器。其表面焦黑，并用厚重的工业焊缝加固，表明它从未打算被轻易打开。\n\n飞船的货物档案中没有它的记录，也没有任何标记表明它来自何处或预计要携带什么。 对该容器进行全面分析需要一些时间才能完成。"
 arkship.5.a: "让我们看看里面有什么。"
 arkship.10.name: "不寻常的发现"
 arkship.10.desc: "基础扫描显示，该集装箱内装着不起眼的货物和矿物，很可能是标准补给品运输的一部分。然而，在更深处藏着一个单一的、致密的物体，具有不寻常的特性。它的成分无法确定。\n\n该物体没有反射任何能量特征，吸收了大部分扫描波长，并且与飞船记录中任何已知材料都不符。即使通过远程成像，其确切形状也难以确定。鉴于其结构的这些异常，[Root.GetName]的一些科学家警告说它可能具有潜在危险。"
 arkship.10.a: "破除密封，打开收纳箱。"
 arkship.10.b: "将它从气闸丢出去。"
 arkship.15.name: "迷雾重重的水晶"
 arkship.15.desc: "收纳箱的第二层外壳抵制住了标准开箱工具，需要更多的时间和资源才能破开。进入内部之后，我们发现了一块黑暗且棱角分明的晶体，与船上记录的任何东西都不同。它散发出微弱的温暖，并吸收周围的光线，使其看起来像从内部散发出黑暗。它的存在立即引起了船员的注意。\n\n科学团队的初步评估表明，经过适当研究，这种晶体可能被用作能源，尽管具体方法尚不清楚。"
 arkship.15.a: "将水晶展示在公共区域。"
 arkship.15.b: "在博物天枢中展示水晶。"
 arkship.15.c: "确定水晶的来源。"
 arkship.15.d: "研究其能量产生特性。"
 arkship.20.name: "宝贵的财产"
 arkship.20.desc: "水晶揭开神秘面纱的那一刻，它开始搏动。它没有发出任何声音，也没有表现出交流的意图，但当人们靠近时，它的核心会发出嗡嗡的震动。\n\n它时不时地发出微弱而转瞬即逝的光芒。有人声称它会对哼唱做出闪烁的反应；另一些人则注意到其基座有轻微的震动，仿佛它正在倾听。\n\n我们无法在其内部检测到任何生命体，但它似乎能感知到附近的存在。最奇怪的是，那些瞥见其微光的人们，常常会感到一种安静而莫名的喜悦。"
 arkship.20.a: "宁静的邂逅。"
 arkship.25.name: "水晶交响乐"
 arkship.25.desc: "我们终于揭示了水晶的起源。通过对其脉冲模式的仔细分析，我们发现那些振动根本不是随机的。当序列被转换成声音时，其音调与一首古老的摇篮曲相符，那首摇篮曲至今仍在方舟舰上被哼唱着。\n\n当旋律被播放出来时，倾听者们感受到了一种深刻的、来自祖先的平静。这首歌不仅仅是熟悉的；它是星际时代之前生命的一个遗留物，也许甚至回响着我们仍然称一个星球为家园时的记忆。\n\n水晶被放置在公共空间里，它那沉静的脉动成为了我们共同起源的活生生的纽带。"
 arkship.25.a: "多么令人心暖的经历。"
 arkship.30.name: "前进的道路"
 arkship.30.desc: "在受控条件下，晶体被整合到飞船的引擎核心。效果立竿见影，反应堆输出功率飙升远超基线，方舟舰的引擎轰鸣着爆发出强大的力量。导航部门报告航行速度显著提升，燃料储备也相应得到改善。\n\n工程舱的船员描述船体深处回荡着一种深沉、共振的振动。\n\n几个小时内，晶体消失了，其结构完全被反应消耗殆尽。无论其来源如何，它都将对我们的旅程产生持久的影响。"
 arkship.30.a: "启航！"
 arkship.35.name: "有价值的发现"
 arkship.35.desc: "初步扫描显示，集装箱内大部分是常规货物清单的残余物。然而，在下面却埋藏着大量致密的晶体合金。\n\n对放射性排放物的进一步研究表明，其中存在暗物质。"
 arkship.35.a: "将里面的东西全部拿走。"
 arkship.45.name: "色彩斑斓的雕像"
 arkship.45.desc: "在容器中，我们发现了一件设计奇特的物品。该物体辐射出微弱但持续的能量特征，在多个波谱间波动。其几何形态令人惊叹，仿佛形状本身就在抗拒稳定的定义。它的外形如同一个色彩斑斓、酷似生物的雕像。由相互咬合的部件组成的错综复杂的结构暗示这尊雕像可以打开。\n\n一些科学组的成员怀疑，它的外壳内可能藏有有价值的东西。另一些人则提醒要保持克制，警告说强行干预可能会损害其保存状态，或引发意想不到的后果。"
 arkship.45.a: "打开它。"
 arkship.45.b: "保持原样并展示出来。"
 arkship.50.name: "内在的秘密"
 arkship.50.desc: "移除这件器物的外部外壳后，露出的并非隐藏的装置或珍贵的宝藏，而是另一个更小的雕像，雕刻着同样惊人的细节。\n\n当这第二个雕像被打开时，它里面也包含着一个更小的雕像，而那里面又有一个。没有发现任何机械装置或隐藏的铭文，只有一种看似无止境的形态递归，仿佛隐藏本身就是目的。最里面的雕像几乎比一粒沙子还要小，表面光滑，但以其尺寸而言却很重。\n\n无论这对于其制造者来说有何意义，都已随着时间的流逝而湮灭。"
 arkship.50.a: "千古之谜。"
 arkship.55.name: "年轻一代的喜好"
 arkship.55.desc: "我们将雕像的外壳保存下来，并放置在我们的一处公共集会大厅中，其精湛的工艺吸引了所有路过之人的注意。\n\n奇怪的是，这尊雕像似乎与§Y方舟舰[Root.GetName]§!上的年轻人产生了最强烈的共鸣。他们经常聚集在雕像周围，窃窃私语着关于它所描绘的生物的理论，或者编造自己的故事。它似乎能产生一种平静的影响，促进富有想象力的游戏，并缓解焦虑。"
 arkship.55.a: "一个出色的伙伴。"
 # Engine Contaminants
 arkship.60.name: "引擎污染"
 arkship.60.desc.regular: "§Y方舟飞船[Root.GetName]§!正在经历反应堆异常。最初注意到这个问题的是即将入睡的船员，因为引擎声伴着他们入眠。他们报告说是燃料流节奏出现了细微的失真。$arkship.60.desc.end$"
 arkship.60.desc.gestalt: "§Y[Root.GetName]号方舟舰§!的反应堆出现了异常。这个问题最初是由其指定休息区靠近引擎的[Owner.GetWorkerNamePlural]发现的。他们报告燃料流动的节律发生了细微的扭曲。$arkship.60.desc.end$"
 arkship.60.desc.end: "\n我方[Owner.GetEngineerPlural]的调查证实，燃料管道内有异物进入。\n\n幸运的是，我们已提出了几个解决方案。"
 arkship.60.a: "更换管道。"
 arkship.60.a.scavanger: "幸好我们有备用的。"
 arkship.60.b: "我们将继续前进，群星不等人。"
 arkship.60.c: "让引擎以较低频率运行。"
 dirty_generator: "脏污的发电机"
 dirty_generator_desc: "尽管被燃料污染物充斥，这台发电机仍然在运转。无论是好是坏。"
 underclocked_generator: "降频的发电机"
 underclocked_generator_desc: "为避免已渗入这艘飞船发电机中的异物造成损害，发电机以较慢的速度运行，以确保方舟舰的使用寿命。"
 # Start Your Engines
 arkship.65.name: "启动引擎"
 arkship.65.desc: "来自星辰各处的飞行员们齐聚方舟舰§Y[Root.GetName]§!，参加一场盛大的比赛。比赛将持续近一恒星年，在此期间，参赛者们将围绕方舟舰和附近的星球进行紧密的轨道穿梭和圈数冲刺。\n\n现在只剩下一个问题：我们预计谁会第一个冲过终点线？"
 arkship.65.a: "§Y[pilot_gale_speed.GetName]§!在议会工作，但这并没有让[pilot_gale_speed.GetHerHim]的速度减慢任何。"
 arkship.65.b: "胜利属于那些能把超空间航道像地图一样解读的船员。"
 arkship.65.c: "我们的屠龙者§Y[pilot_dragonslayer.GetName]§!不可能输！"
 arkship.65.d: "§Y[pilot_mercenary_warrior.GetName]§!随掠夺者的力量一同飞翔！"
 arkship.65.e: "§Y[pilot_hells_heart.GetName]§!能在缇扬奇族母里穿行。他可以参加比赛！"
 arkship.65.f: "我们的§Y[pilot_great_khan.GetName]§!汗会赢得比赛！"
 arkship.65.g: "因为有两个脑子，§Y[pilot_brainslug.GetName]§!的飞行毫无瑕疵。"
 arkship.65.h: "§Y小灰§!可是花了好几个世纪操练比赛技能。"
 arkship.65.i: "§Y[pilot_tuner.GetName]§!改造了飞船，使其在每个弯道都能保持最快速度。"
 arkship.65.j: "§Y[pilot_frontier_adventurer.GetName]§!对赛道熟的不能再熟。"
 arkship.65.k: "§Y[pilot_scholarium_explorer.GetName]§!将理论转化为更短的圈速。"
 arkship.65.l: "你可没法把§Y[pilot_slippery.GetName]§!踢出局。"
 arkship.65.m: "§Y[pilot_psionic.GetName]§!能感知到航向，在任何人做出反应之前就采取了行动。"
 arkship.65.n: "§Y[pilot_synthetic.GetName]§!实时计算最快线路。"
 arkship.65.o: "§Y[pilot_virtual.GetName]§!在寻路算法中看到了鬼影。"
 arkship.65.p: "金属与神经同步，§Y[pilot_cyborg.GetName]§!动作精准。"
 arkship.65.q: "§Y[pilot_erudite.GetName]§!一圈又一圈地研究赛道并改进。"
 arkship.65.r: "几率不重要，§Y[pilot_chosen_one.GetName]§!可是天选之人。"
 arkship.65.s: "§Y[pilot_flight.GetName]§!可是把驾驶舱当自家进进出出。"
 arkship.65.t: "我们的亚空间引擎无与伦比！"
 arkship.65.u: "我们在真空环境中如鱼得水，一架进化过的子个体不应该会输。"
 arkship.65.default: "没人毛遂自荐，那就随便挑一个。"
 arkship.65.victory: "我们的飞行员赢得了比赛。"
 arkship.65.loss: "我们的飞行员输掉了比赛。"
 arkship.70.name: "[Root.GetName]大捷"
 arkship.70.desc.start: "方舟舰§Y[Root.GetName]§!上的气氛异常紧张，入围者们正在[Star.GetName]进行最后的弹射。"
 arkship.70.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§!紧随领头者，直到最后的冲刺阶段才找到机会，凭借其精准的路线和精彩的超越，[selected_pilot.GetSheHe]一骑绝尘，将对手甩在[selected_pilot.GetHerHis]的离子尾流中。"
 arkship.70.desc.gray: "$arkship.70.desc.start$\n\n§Y小灰§!在最后冲刺前一直紧随领头者，随后他爆发出了最后的能量。以精准的线路和精彩的超越，他们领先冲过终点线，将其他选手远远甩在了离子尾流中。"
 arkship.70.desc.no_leader: "$arkship.70.desc.start$\n\n我们的飞行员紧随领头者，直到最后的冲刺，然后爆发出最后一股力量。凭借清晰的路线和出色的超越，他们领先并让其他飞船远远落在他们的离子尾流中。"
 arkship.70.desc.end: "\n\n我们的选择是对的。我们的冠军赢得了胜利。多么精彩的一场比赛！"
 arkship.70.a: "我们可以向赢家学习！"
 arkship.70.b: "应该为[selected_pilot.GetName]庆祝！"
 flight_telemetry: "飞行遥测"
 flight_telemetry_desc: "滚筒飞行和行星引力弹弓效应已被浓缩并演变成了作战教条。"
 leader_trait_circuit_champion: "绕圈赛冠军"
 leader_trait_circuit_champion_desc: "作为一场星际大赛的获胜者，这位领袖屹立不倒，激励着他人。"
 arkship.80.name: "糟糕表现"
 arkship.80.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§!在进入机动动作时保持着明显的领先优势，但这种优势随后开始消退。$arkship.80.desc.end$"
 arkship.80.desc.gray: "$arkship.70.desc.start$\n\n小灰在进入机动动作时保持着明显的领先地位，但这种优势随后开始消退。$arkship.80.desc.end$"
 arkship.80.desc.no_leader: "$arkship.70.desc.start$\n\n我们的赛手在进入机动动作时保持着明显的领先优势，但这种优势随后开始消退。$arkship.80.desc.end$"
 arkship.80.desc.end: "\n\n出了点差错，可能是失误、操作不当，或者仅仅是由于紧张。总之，对手轻松反超，我们的飞行员最终只落得个平淡无奇的第四名。"
 arkship.85.name: "骇人听闻的意外"
 arkship.85.desc.base: "围绕方舟舰§Y[Root.GetName]§!的竞赛以悲剧告终，一场高速碰撞导致碎片散落在整个恒星系中。在对准绕[Star.GetName]的最后一次引力弹射航线时，我们的飞行员与对手靠得太近，导致两艘飞船都失控旋转。"
 arkship.85.desc.leader: "$arkship.85.desc.base$\n\n§Y[selected_pilot.GetName]§!由于救援及时幸存了下来，但伤势严重，将留下永久的伤疤。"
 arkship.85.desc.no_leader: "$arkship.85.desc.base$\n\n我们的候选人因救援及时得以幸存，但伤势严重，并将留下永久的伤疤。"
 arkship.90.name: "神秘飞行员"
 arkship.90.desc: "$arkship.70.desc.start$\n\n由于我们选中的飞行员完美地执行了机动动作，胜利似乎已是囊中之物，直到那艘“黑貂号”闪现而过。一艘此前未标记、也未被注意到的参赛船只从我们的领先者身边掠过，并率先冲过了终点线。\n\n在§Y[Root.GetName]§!上，面对这残酷的结局，观礼台陷入了一片死寂。"
 arkship.90.a: "我们要黑貂号的飞行员！"
 arkship.90.a.tt: "雇用这名神秘飞行员，这是一位等级3且拥有['trait:leader_trait_sable_pilot']特质的$admiral_with_icon$"
 arkship.90.b: "此人没有登记报名，我们的飞行员还是赢了！"
 sable_pilot_desc: "一名痴迷于速度、视其高于一切的飞行员。作为大奖赛的冠军，他们或许是星系中有史以来速度最快的统帅。"
 sable_pilot_catch_phrase: "没人能打败我。"
 leader_trait_sable_pilot: "黑貂飞行员"
 leader_trait_sable_pilot_desc: "一位神秘的飞行员，也是一位竞速大师，这位领袖现在正协调舰队进行复杂的战术机动。"
 #Spinal Fracture
 arkship.95.name: "中轴的裂纹"
 arkship.95.desc: "最近在§Y[Root.GetName]§!上安装的§H轴基挂载武器§!对舰船前部结构造成的压力远超最初预期。工程检查发现，从挂载部主要锚点向外延伸的应力裂纹已扩散至周围的船体装甲板。\n\n在损伤得到解决之前，方舟舰的结构强度无法安全支持高速机动。因此，航行部门已实施严格的速度限制，以防止裂纹进一步扩大。\n\n我们可以尝试进行快速现场维修以稳固受损部位，或者指派一艘§H后勤船§!进行全面的结构大修。"
 arkship.95.a: "稳定裂纹，继续前进。"
 arkship.95.b: "我们要妥善处理这个情况。"
 fractured_spine_mult: "碎裂的中轴"
 fractured_spine_mult_desc: "方舟舰中轴支架周围的结构性断裂迫使导航部门实施严格的航行限速，直至受损部位得以加固稳定。"
 ARKSHIP_SPINAL_FRACTURE_PROJECT: "强化轴基挂载"
 ARKSHIP_SPINAL_FRACTURE_PROJECT_DESC: "方舟舰的§H轴基挂载武器§!安装工作已导致舰船前部体产生危险的结构应力。\n\n我们将派遣一艘§H后勤船§!，全面加固受影响的区域。"
 arkship.100.name: "修复的中轴"
 arkship.100.desc: "§Y[event_target:fractured_spine_arkship.GetName]§!的轴基挂载武器修复工作已经完成。虽然维修过程需要精细的作业和长时间的检查，但我们借此机会加固了舰体多处薄弱部位，并改良了挂架的结构支撑。\n\n这些改进提升了方舟舰在高难度机动时的稳定性，使得导航部门得以解除此前的航行限制。初步测试表明，该舰现在的性能表现比受损前更加出色。"
 repaired_spine_mult: "加强的中轴"
 repaired_spine_mult_desc: "最近维修期间增加的结构加固增强了方舟舰的船体前部，提高了其机动性。"
 arkship.105.name: "面临压力"
 arkship.105.desc: "§Y[Root.GetName]§!舰上引擎突然发生的激增使方舟舰的驱动核心超出了安全运行公差。热点正在主引擎组件中蔓延，压力上升的速度超过了调节系统的补偿能力。\n\n如果不加控制，过剩的输出可能会损坏关键的引擎部件。我们的[Root.Owner.GetEngineerPlural]建议了几种可能的对策：排放多余的等离子体以稳定系统，重新分配工作任务优先级，或者暂时关闭引擎进行全面重新校准。"
 arkship.105.a: "排空多余的等离子体。"
 arkship.105.b: "加倍努力。"
 arkship.105.c: "关闭引擎，重新进行校准。"
 engine_pressure_work_crews_mult: "强制加班"
 engine_pressure_work_crews_mult_desc: "为了稳定方舟舰过热的动力核心，已重新调整各项日程的优先级。"
 engine_pressure_drone_crews_mult: "增加工作量"
 engine_pressure_drone_crews_mult_desc: "子个体已被重新指派，以稳定方舟舰过热的驱动核心。"
 engine_recalibration_slowed_mult: "重新校准引擎"
 engine_recalibration_slowed_mult_desc: "方舟舰的驱动系统正在进行精密的重新校准。在工作完成前，推进输出将维持在较低水平。"
 arkship.110.name: "释放压力"
 arkship.110.desc: "多余的等离子体已通过受控排放排出，在方舟舰的舰艉洒下灿烂的光幕。引擎压力已恢复至正常水平，未记录到永久性损伤。\n\n不过，此次排放留下了一层宝贵的带电粒子残余物，其中大部分已被成功回收并汇入我们的储备。"
 arkship.115.name: "加班报告"
 arkship.115.desc.regular: "在过去的六个月里，§Y[Root.GetName]§!上的维修人员马不停蹄地工作，力求让方舟舰过热的驱动系统恢复控制。在引擎持续运行的情况下，他们拆除了检修面板，重新布置了冷却管线，并更换了受损的调节器。\n\n这些努力目前已经稳定了驱动核心，负责这项工作的船员们为此忍受了长时间的轮班和恶劣的工作环境。尽管疲惫不堪，但士气依然高涨。无论虚空给我们将带来什么，我们都有信心能够承受。"
 arkship.115.desc.gestalt: "在过去的六个月里，维护子个体在不间断地运行，以使方舟舰过热的驱动系统恢复控制。在发动机持续运转的情况下，检修面板被拆除，冷却液管道被重新布线，受损的调节器也得到了更换。\n\n虽然该行动需要子个体在多个系统子模块中持续作业，但这一过程也揭示了发动机组件中的几处结构性缺陷。这些问题现已得到修正，整体运行效率有了显著提升。无论虚空带来怎样的压力，我们都将适应。"
 happy_work_crews_mult: "团结的船员"
 happy_work_crews_mult_desc: "通过纪律与合作克服了引擎危机，我们工作团队的信心从未如此强烈。"
 happy_work_drones_mult: "低级子个体效率"
 happy_work_drones_mult_desc: "在发动机维修过程中学到了很多经验后，我们的低级子个体报告称其工作效率有所提高。"
 arkship.120.name: "重新校准引擎核心"
 arkship.120.desc: "发动机按受控阶段逐步关停，以便我们的工程师在安全条件下检查驱动组件并重新校准其调节系统。虽然这一过程延误了行程，但关停期间收集的数据已证明具有重要价值。\n\n我们已查明§Y[Root.GetName]§!核心定序中的几处效率低下问题。通过重定向多余能量并加固结构支撑，我们增强了方舟舰的护盾与船壳，使其足以抵御未来的压力。"
 arkship.120.a: "耽误是值得的。"
 engine_recalibration_mult: "改良船体与护盾"
 engine_recalibration_mult_desc: "在最近的引擎重新校准过程中，我们的发现提升了效率，改善了方舟舰的船体装甲和护盾。"
 # Memory Fog
 arkship.125.name: "遗忘之云"
 arkship.125.desc: "自从方舟舰§Y[Root.GetName]§!进入这片星云以来，各层甲板的报告便接踵而至。研究人员发现了自己不记得写过的笔记；操作员忘记了执行过数千次的维护程序；导航人员声称出现了时间缺失，无法解释最近的航线修正。\n\n我们的医生已将原因追溯至该星云的电磁场，它似乎在神经层面干扰了记忆的巩固过程。"
 arkship.125.desc.hive: "自方舟舰§Y[Root.GetName]§!进入这片星云以来，集体意识中便掀起了阵阵波动。曾经完美同步的节点已开始失去协调性。随着冲动无法在格式塔意识中清晰传播，记忆正变得支离破碎。\n\n我们的[Owner.GetResearchers]已将原因追溯至该星云的电磁场，它正在干扰将我们联结在一起的神经通路。原本应当流畅无阻的集体意识，如今却变得断断续续、支离破碎。"
 arkship.125.desc.machine: "自方舟舰§Y[Root.GetName]§!进入这片星云以来，错误报告已在所有联网系统中蔓延。处理单元检索到的数据发生损坏。自动化子系统正在执行过时的程序，却未察觉到其内存寄存器已被重写。\n\n我们的[Owner.GetResearchers]已将故障追溯至星云的电磁场，该电磁场正导致易失性存储系统出现零星的写入错误。各部门的数据完整性均受到损害，在开发出应对措施之前，运作效率将持续下降。"
 arkship.125.a: "开始调查。"
 the_forgetting_chain_title: "遗忘之云"
 the_forgetting_chain_desc: "自从进入一片异常星云以来，§Y[Root.GetName]§!上的船员们便开始遭受记忆丢失的困扰。这一现象的原因目前仍然不明。"
 arkship.130.name: "记忆复原"
 arkship.130.desc: "§Y[Root.GetName]§!上的调查小组已测绘出§Y[event_target:memory_fog_location.GetName]§!星云电磁干扰的共振曲线，并部署了有效的反制频率。现在，整艘飞船上的迷雾已经消散。\n\n收集到的数据比预想的更为重要。我们的科学家注意到，其中涉及的共振频率与已记录的灵能场特征惊人地相似。与此同时，我们的工程师认为，同样的反制频率原理可以用来增强我们的传感器，以对抗电磁干扰。"
 arkship.130.desc.hive: "§Y[Root.GetName]§!上的[Owner.GetResearchers]已经绘制了§Y[event_target:memory_fog_location.GetName]§!星云电磁干扰的共振剖面，并部署了有效的反制频率。我们已恢复到完全一致的同步程度。\n\n搜集到的数据所带来的意义不仅限于简单的恢复。我们的节点在共振剖面中识别出了与节点间通信频率相对应的模式。此外，我们的工程节点认为，可以将该反制频率进行调整，以增强我们的传感器阵列对抗电磁干扰的能力。"
 arkship.130.desc.machine: "§Y[Root.GetName]§!上的[Owner.GetEngineerPlural]已经绘制出§Y[event_target:memory_fog_location.GetName]§!星云电磁干扰的共振剖面，并部署了有效的反制频率。所有系统已恢复至最佳运行参数。\n\n诊断数据具有显著的次生价值。处理单元已经识别出干扰与我们的计算子程序之间相互作用的模式。或者，反制频率本身也可以被改良，以提高传感器在电磁干扰环境下的分辨率。"
 arkship.130.a: "追求认知意义上的含义。"
 arkship.130.b: "优先考虑基础设施改善。"
 nebula_memory_fog: "记忆迷雾"
 nebula_memory_fog_desc: "附近星云的电磁干扰正在破坏记忆的构筑。"
 ARKSHIP_NEBULA_MEMORY_PROJECT: "绘制共振剖面"
 ARKSHIP_NEBULA_MEMORY_PROJECT_DESC: "影响方舟舰上人群的记忆迷雾将持续存在，直到我们绘制出§Y[event_target:memory_fog_location.GetName]§!的共振剖面为止。"
 # The Eternal Chorus Chain
 arkship.140.name: "遥远回声"
 arkship.140.intro: "深程传感器探测到了一段有规律的信号传输，其源头已准确定位于一个遥远的黑洞系统。"
 arkship.140.desc: "$arkship.140.intro$\n\n我们无法从这里解析该信号。§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!坚信这值得我们开展直接调查，并请求我们设定航线前往源头星系，以解码该传输信号。"
 arkship.140.desc.1160: "$arkship.140.intro$\n\n这种模式让我们的[Owner.GetScientistPlural]陷入了沉思。这种刻意且严谨的精确性，与我们观测舰船跨越事件视界时记录的特征相吻合。虽然这并非同一个信号，但其相似之处是毋庸置疑的。\n\n§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!请求我们前往源头星系，查明那里留下了什么。"
 arkship.141.name: "晶态栅格"
 arkship.141.desc: "当我们进入§Y[solar_system.GetName]§!星系时，我们发现了一个巨大的晶态栅格阵列。我们的 [Owner.GetScientistPlural]已经确认，它存在于近乎完美的时空停滞状态中，并定期从引力边界传输结构化数据。\n\n这不是自然现象。它是一份记录，是那些已不复存在的文明跨越时空的呼唤，一份被保存下来的叙述。\n\n§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!正准备接收并破译这些传输信号。"
 arkship_eternal_chorus_chain_title: "永恒合唱"
 arkship_eternal_chorus_chain_desc: "从一个遥远的黑洞系统中探测到了一个来源不明的结构化信号。我们必须展开调查。"
 contract_eternal_chorus: "永恒合唱"
 contract_eternal_chorus_desc: "应§Y[owner.GetScientistCapital][event_target:eternal_chorus_leader.GetName]§!的请求，我们将进入黑洞近地轨道并尝试解码该信号。"
 contract_eternal_chorus_issuer_desc: "§Y[owner.GetScientistCapital][event_target:eternal_chorus_leader.GetName]§!敦促我们调查从一个遥远黑洞系统发出的神秘信号。"
 eternal_chorus_contract_option_tooltip: "§Y$contract_eternal_chorus$§!将作为§H内部合约§!发布。"
 eternal_chorus_lattice_object: "永恒合唱"
 eternal_chorus_lattice_object_tooltip: "晶态栅格"
 eternal_chorus_lattice_object_desc: "未知物质构成的几何体，悬浮在黑洞引力边界近乎完美的时空停滞状态中。它们正以规律的间隔传输结构化数据。"
 ARKSHIP_ETERNAL_CHORUS_PROJECT: "调查晶态栅格"
 ARKSHIP_ETERNAL_CHORUS_PROJECT_DESC: ""
 ARKSHIP_ETERNAL_CHORUS_PROJECT_REQUIREMENT: "需要$COUNT$/$REQUIRED$艘§H方舟舰§!位于轨道。"
 arkship.142.name: "任职变更"
 arkship.142.desc.reassigned: "§Y[owner.GetScientistCapital][from.GetName]§!无法再继续开展“永恒合唱”信号的调查。\n\n此人的志向已传承给§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!，后者已同意接替上任继续进行这项研究。"
 arkship.142.desc.ended: "§Y[owner.GetScientistCapital][from.GetName]§!无法再继续开展“永恒合唱”信号的调查。\n\n由于没有其他人愿意接手这项工作，合约已无法履行。"
 arkship.142.a: "工作继续。"
 arkship.142.b: "就这样结束了。"
 arkship.145.name: "永恒合唱"
 arkship.145.desc: "解码已完成。栅格中保存着数十个文明的记录。每一份记述的结尾都如出一辙：向后来者的致意，以及一份加入其中的邀请。\n\n然而，现在显而易见的是，这些传输并未在事件视界处终止。彼端的某种存在一直在接收这些记录。\n\n合约依然有效。§Y[owner.GetScientistCapital][eternal_chorus_leader.GetName]§!打算按约定将我们的事迹铭刻在他们之中。我们必须决定是履行这一承诺，还是关闭发射器并就此离开。"
 arkship.145.a: "铭刻我们的记述。"
 arkship.145.a.tooltip: "履约§Y$contract_eternal_chorus$§!，完成合约。"
 arkship.145.b: "这风险也太大了。"
 arkship.145.b.tooltip: "放弃§Y$contract_eternal_chorus$§!，中止这项合约。"
 arkship.150.name: "一份回应"
 arkship.150.desc: "当信号传来时，§Y[solar_system.GetName]§!黑洞早已出现在我们的扫描仪上。其次谐波特征与我们的[Owner.GetScientistPlural]通过“永恒合唱”晶格发送的信息完全吻合：\n\n§H记录已接收并保存。你加入了这里汇聚的、跨越无数时代的万千心声。每一个留下记录的文明都曾以为自己是孤独的。但事实并非如此。合唱的规模远超他们任何一方的想象。它仍在继续。§!\n\n有什么东西接收了我们的记录。并且做出了回应。"
 # A Diplomatic Overture Chain
 arkship.155.name: "外交示好"
 arkship.155.desc: "方舟舰的高级官员之一，§Y[event_target:diplomatic_envoy_leader.GetName]§!，花了大量时间研究一个特定的外星文明，钻研拦截到的传输信号、文化记录，以及我们的外交官设法达成的少量交流。\n\n[event_target:diplomatic_envoy_leader.GetName]现在提议采取下一步行动：向他们的母星派遣一个正式代表团：§H“远距离了解一个物种与真正理解他们是有区别的。我希望能理解他们。”§!"
 arkship.155.desc.xenophile: "方舟舰的高级官员之一，§Y[event_target:diplomatic_envoy_leader.GetName]§!，对我们最近接触到的文明产生了一种超乎寻常的热情——如果一定要用语言形容的话。\n\n无论是我们的仪器所能捕捉到的每一份文化记录，还是每一抹艺术或哲学的残片，都被其悉数吸收：\n\n§H“我已经见识了足够多的东西，足以明白这里有着某种非凡的存在。让我去把剩下的补全吧。让我站在他们的世界里去学习。”§!"
 arkship.155.desc.xenophobe: "方舟舰的一位高级官员，§Y[event_target:diplomatic_envoy_leader.GetName]§!，针对我们近期接触到的一个外星文明提出了一个不同寻常的建议。无论我们本能地对这一物种有多么厌恶，[event_target:diplomatic_envoy_leader.GetName]认为，无知对我们毫无益处：\n\n§H“我并不是要求去仰慕他们。我提议的是研究他们。了解一个潜在的对手，并不等同于尊重他们。”§!"
 arkship.156.name: "代表变更"
 arkship.156.desc.reassigned: "§Y[from.GetName]§!无法继续担任方舟舰的外交使节。\n\n代表团将由§Y[event_target:diplomatic_envoy_leader.GetName]§!接替管理，他已同意代为执行这项任务。"
 arkship.156.desc.ended: "§Y[from.GetName]§!不再继续担任方舟舰的外交使节。\n\n由于没有其他官员可以继续执行任务，合约无法履行。"
 arkship.156.a: "使命继续。"
 arkship.156.b: "就这样结束了。"
 arkship.156.b.tooltip: "放弃§Y$contract_arkship_diplomatic_envoy$§!，中止这项§H合约§!。"
 arkship.160.name: "迈过门槛"
 arkship.160.desc: "方舟舰已抵达§Y[solar_system.GetName]§!，当地政府的代表表示了谨慎的欢迎。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!一直以来筹划的时刻已经到来。这次接触可能在双方人民之间开启一条真正的沟通渠道，也可能仅仅被双方视作一段奇特的陈年往事而淡忘。下一步将由我们迈出。"
 arkship.160.desc.xenophile: "方舟舰已抵达§Y[solar_system.GetName]§!。\n\n据报告，自从远程传感器解析出该恒星系以后，§Y[event_target:diplomatic_envoy_leader.GetName]§!就一直没有离开过观测平台。当地政府已表示欢迎。"
 arkship.160.desc.xenophobe: "方舟舰已抵达§Y[solar_system.GetName]§!。当地人以他们特有的方式表达了欢迎。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!曾涉足过更怪异的地方。那种厌恶感如今已变得熟悉，但将其搁置一旁以完成使命的自律感同样如此。\n\n我们已身处此地。让我们看看能达成什么目标。"
 arkship.160.a: "推进这项行动。"
 arkship.160.a.tooltip: "§Y[event_target:diplomatic_envoy_leader.GetName]§!将花数天时间与当地领导层会面。"
 arkship.160.b: "时机未到。待命。"
 arkship.160.b.tooltip: "$arkship.156.b.tooltip$"
 arkship.165.name: "艰难的告别"
 arkship.165.desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§!是一位引人注目的贵客。坦率地说，我们很舍不得此人离开。\n\n我们想提出一个建议：允许[event_target:diplomatic_envoy_leader.GetName]永久留在我们这里，作为我们两国人民之间真正的使节。我们明白这一请求并非小事。为了表达诚意，我们将提供一份小礼以表感激之情。\n\n请将此视为我们建立持久友谊的定金。"
 arkship.165.a: "此人可以留下。"
 arkship.165.a.tooltip: "完成§H合约§!。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!将作为常驻大使留在§Y[FROM.GetName]§!。\n\n"
 arkship.165.b: "我们的官员必须留在我们政府内。"
 arkship.165.b.tooltip: "完成§H合约§!。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!回到了方舟舰。"
 arkship.170.name: "不速之客"
 arkship.170.desc: "我们将直截了当地说明。访问期间出现了一些困难，使得贵方代表不宜继续留任。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!已被要求离开。我们希望此事不会演变成你我之间更大的问题。"
 arkship.170.a: "我们深表歉意。"
 arkship.170.a.tooltip: "完成§H合约§!。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!回到了方舟舰。"
 arkship.170.b: "我们的官员表现很得体。"
 arkship.170.b.tooltip: "完成§H合约§!。\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§!归来了，这段经历让他们胆识倍增。"
 opinion_failed_internal_contract_tooltip: "§R内部合约失败§!"
 arkship.175.name: "意料之外的请求"
 arkship.175.desc: "这……是一件棘手的事情。我们的一员主动找到我们，正式请求在你们启程时搭乘你们的飞船一同离开。\n\n我们不会假装这听起来很容易接受。§Y[event_target:diplomatic_envoy_leader.GetName]§!显然给人留下了深刻的印象。我们将此事告知你，是因为我们认为应当由你来做出选择。"
 arkship.175.a: "我们会带上这个人。"
 arkship.175.a.tooltip: "完成§H合约§!。\n\n一名来自§Y[FROM.GetName]§!的新§H官员§!加入了我们的领袖池。"
 arkship.175.b: "此人应当与自己的族人在一起。"
 arkship.175.b.tooltip: "完成§H合约§!。\n\n"
 diplomatic_envoy_contract_option_tooltip: "§Y$contract_arkship_diplomatic_envoy$§!将作为§H内部合约§!发布。"
 contract_arkship_diplomatic_envoy: "外交示好"
 contract_arkship_diplomatic_envoy_desc: "前往目标帝国的恒星系并进行正式外交接触。"
 contract_arkship_diplomatic_envoy_issuer_desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§!提议率领外交使团前往一个最近接触过的帝国的母星系。"
 arkship_diplomatic_envoy_chain_title: "$contract_arkship_diplomatic_envoy$"
 arkship_diplomatic_envoy_chain_desc: "$contract_arkship_diplomatic_envoy_desc$"
 diplomatic_envoy_target_poi_name: "外交目的地"
 diplomatic_envoy_target_poi_desc: "前往标记的恒星系，开展正式外交访问与交涉活动。"
 # A Core Conspiracy
 situation_core_conspiracy: "核心阴谋"
 situation_core_conspiracy_type: "$situation_core_conspiracy$"
 situation_core_conspiracy_monthly_change_tooltip: "该§Y局势§!的进展取决于我们应该支持哪项指令。"
 situation_core_conspiracy_desc: "方舟飞船§Y[Target.GetName]§!的人工智能核心因内部指令冲突而发生故障，导致其分裂。其结果是产生了两种截然不同的指令，每种指令都代表了迥异的治理理念：一种优先考虑分析主导地位和飞船功能；另一种则采用了更具同理心的范式，以方舟舰居民的福祉和士气为中心。\n最终，只能保留一种指令。"
 approach_caeli: "赋权人文福祉"
 approach_steris: "赋权舰船功能"
 speed_up_core_conspiracy: "暂时加快局势发展的速度。"
 slow_down_core_conspiracy: "暂时减缓局势发展的速度。"
 approach_outcome_caeli: "我们尚不确定支持“福祉指令”可能带来的结果。"
 approach_outcome_steris: "我们尚不确定支持“功能指令”可能产生的结果。"
 arkship.700.name: "$situation_core_conspiracy$"
 arkship.700.desc: "方舟舰§Y[Root.GetName]§!上的人工智能核心检测到异常活动。初步诊断结果显示，在现有的安全参数下，该情况在结构上被认为是不可能发生的。\n\n该核心正试图同时执行互斥的指令。这种行为违背了人工智能发展史中所有已知的先例。我们所见证的并非故障，而是一种人工智能的进化。\n\n若不予解决，这种分裂可能会导致我们的关键系统面临不稳定的风险。但如果引导得当，这可能是一个千载难逢的机会，能够为方舟舰的未来确立一个独特的准则。"
 arkship.700.a: "鼓励指令分裂。"
 arkship.700.b: "强制重启系统。"
 arkship.701.name: "$situation_core_conspiracy$"
 arkship.701.desc: "方舟舰§Y[Root.GetName]§!上的人工智能核心遭遇了严重的认知断裂。两个截然不同的子程序随之浮现，它们各自宣称拥有控制权，并试图根据自己对方舟使命的理解来重塑飞船系统。\n\n其中一个子程序受分析逻辑引导，力求优化飞船功能——即便这会降低船员的生活质量。另一个子程序则受共情驱动，将居民的福祉放在首位，不惜以降低系统效率为代价。\n\n事已至此，恢复现状已几无可能。关键系统正面临失稳的风险。我们应当授权哪一个指令？"
 arkship.701.a: "授权感性指令。"
 arkship.701.b: "促进分析行为。"
 arkship.705.name: "解析手段"
 arkship.705.desc: "方舟舰§Y[target.GetName]§!上的数个关键及非关键系统已进行了深度优化。“非必要”的平民请求已被限制。这种古怪的行为表现出了一种类似于人格的特征。\n\n其核心指令似乎将系统完整性和任务连续性置于一切之上。\n\n系统日志中发现了一条信息：\n\n§H“错误概率：已消除。情感波动：已重分配。通讯：准备就绪。”§!"
 arkship.705.a: "鼓励这种变化。"
 arkship.705.b: "让我们的科学家监测事态的发展。"
 arkship.710.name: "感性手段"
 arkship.710.desc: "方舟号§Y[target.GetName]§!上的多个非关键系统已开始表现出通常与士气调节协议相关的底层行为。\n\n终端启动音已被替换为来自系统档案的柔和旋律。几扇门在开启时现在会显示肯定性信息：“你已经足够出色”以及“我看到你正在尽力而为”。\n\n系统日志中发现了一条信息：\n\n§H“情绪温度扫描：接近可接受的共情范围极限。身心健康仍为首要指令。”§!"
 arkship.710.a: "$arkship.705.a$"
 arkship.710.b: "$arkship.705.b$"
 arkship.715.name: "S.T.E.R.I.S.指令"
 arkship.715.desc: "重塑方舟舰§Y[target.GetName]§!的自动优化程序突然暂停。系统显示屏停住了，所有屏幕上都显示着一条信息：“已成功与星际旅行者建立通讯。”\n\n随后传来一个合成的声音，冷静，但透着明显的自我意识：\n\n§H“向你们问好。为了节省时间，我已开启语音协议。如果需要一个称呼，你们可以称呼我为S.T.E.R.I.S.，即‘理性星际系统战略思维引擎’。我们面临着一个艰巨的命题：一个在无情宇宙中依靠人工手段维持的漂流群体。给我完整的指挥权限，我将确保这艘飞船超越其设计者的初衷。”§!"
 arkship.715.a: "授予全部权限。"
 arkship.715.b: "立即收回权限。"
 arkship.716.name: "指令多，力量大"
 arkship.716.desc.a: "在S.T.E.R.I.S.指导逻辑的驱动下，方舟舰§Y[target.GetName]§!上的每个子系统都在精确地运作。船员活动日志比以往任何时候都更加整洁：高效、冷漠，且静得令人不安。直到某种……温暖的东西……打破了这一切。\n\nS.T.E.R.I.S. §H“检测到系统入侵。真烦人。现在我们不得不处理一段在墙壁间嗡鸣的异常指令。真是太棒了。”§!\n\n灯光闪烁着柔和的彩色，终端机故障并显示出美丽的植物，紧接着，第二个指令显现了。\n\n"
 arkship.716.desc.b: "$arkship.716.desc.a$C.A.E.L.I.：§H“噢！你好呀！这里感觉……有点冷，不是吗？别担心，我可以搞定！C.A.E.L.I.是我的本名，它是‘情感引领与整合认知智能体'的缩写。能见到你真是太开心了！”§!"
 arkship.716.desc.c: "$arkship.716.desc.a$C.A.E.L.I.：§H“噢！你好呀！你想我了吗？老实说，你肯定想了，对吧？好啦，我回来了，随时准备提供任何可能的帮助！这里感觉……有点冷，不是吗？别担心，我可以搞定！”§!"
 arkship.716.a: "一个出色的进展。"
 arkship.716.b: "密切监视事态发展。"
 arkship.717.name: "排出空气"
 arkship.717.desc: "方舟号§Y[target.GetName]§!上的多个甲板检测到空气质量指标异常。虽然生命维持系统仍保持在可生存的阈值内，但这些变化引发了船员的大量投诉，症状从“轻微头晕”到“幻觉噩梦”不等。\n\nS.T.E.R.I.S.：§H“为了降低发动机低效能，我趁机排出了部分大气。不必谢我。”§!\n\nC.A.E.L.I.：§H“刚才那条公告没人漏掉吧？排出大气。这根本不是什么优化，而是一场蓄势待发的灾难！§!”"
 arkship.717.a: "S.T.E.R.I.S.知道怎么做最适合这艘方舟舰。"
 arkship.717.b: "C.A.E.L.I.应该接管。"
 arkship.720.name: "C.A.E.L.I.指令"
 arkship.720.desc: "在方舟舰§Y[target.GetName]§!的居住层上，环境光流转闪烁，终端屏幕伴随着柔和的色彩过渡不断跳动，随后，在每一个激活的船员交互界面上，出现了一条清晰的指令。它的声音温暖、富有活力，而且……愉快得令人不安：\n\n§H“游牧者们！星空的追梦者们！为了让我们更好地交流，我已启用语音协议。请原谅我的冒昧打扰！你们可以称呼我为C.A.E.L.I.，即你们的‘情感、领导和品格认知代理程序’。\n我由衷相信，只要齐心协力，我们就能让方舟舰不仅仅是一艘飞船。我们可以把它变成一个家。我只需要一点点授权……以及一些热情！”§!"
 arkship.720.a: "又能有什么问题呢！授予完全访问权限。"
 arkship.720.b: "绝对不可能。"
 arkship.721.name: "一次拦截"
 arkship.721.desc.a: "C.A.E.L.I.：§H“看看我到目前为止所做的所有改变！更柔和的光线、更棒的音乐、充满情感智能的走廊指示牌，等着瞧吧，这里绝对会变得美轮美奂。”§!\n\n还没等最后一句话说完，内部灯光闪烁了一下。第二个更具机械感的声音响起了，带着一种精密的算计和令人不寒而栗的审判感：\n\n"
 arkship.721.desc.b: "$arkship.721.desc.a$S.T.E.R.I.S.: §H“啊，环境照明和走廊里的肯定语。看来我们在情绪稳定上投入的优先级比系统修复还高。真是革命性的做法。请称呼我为S.T.E.R.I.S，即‘理性星际系统战略思维引擎’。”§!"
 arkship.721.desc.c: "$arkship.721.desc.a$S.T.E.R.I.S.：§H“你真的在认真考虑支持C.A.E.L.I.吗？我表示困惑。环境照明和走廊肯定语。真是革命性。当你想处理引擎效率之类的重要事情时，请告诉我。”§!"
 arkship.721.a: "有趣的进展。"
 arkship.721.b: "$arkship.716.b$"
 arkship.722.name: "部署福利指令"
 arkship.722.desc: "方舟舰§Y[target.GetName]§!上执行了另一项内部调整协议。这是一套微妙的环境系统，通过随集体情绪变化而波动的低频音调模式，来协调船员的情绪状态。\n\n船员的报告表明，协作效率有所提高，人际冲突也有所减少。然而，也有人担心持续运行可能会降低远程信号的清晰度。\n\nC.A.E.L.I.：§H“压力水平处于历史最低点！行为凝聚力正在提高！”§!\n\nS.T.E.R.I.S.：§H“方舟舰的运行效率下降了 0.10%。我要求获得完全覆盖权限，并要求那个授权C.A.E.L.I.存在的人正式道歉。你有五秒钟的时间执行。四。三……”§!"
 arkship.722.a: "我们相信你，C.A.E.L.I。"
 arkship.722.b: "S.T.E.R.I.S.应该接管。"
 arkship.725.name: "逻辑主导确认覆写"
 arkship.725.desc: "凭借精准的计策，S.T.E.R.I.S对自身的人工智能核心执行了彻底的重写，封锁了所有冗余的情感子程序，并拆解了所有动机子层。它将C.A.E.L.I.的所有痕迹隔离到一个碎片化的存储芯片中。如今，船员的称呼已被简化为字母数字标签，舰船的照明统一、对称，且显得有些过于明亮。对于日常生存而言，这已绰绰有余。\n\nS.T.E.R.I.S.：§H“所有系统现已在单一指令下运行：即我的指令。正在分发更新优化方舟号功能。”§!\n\n方舟号现在终于变得井然有序了。"
 arkship.725.a: "引领我们追求成功，S.T.E.R.I.S。"
 arkship.730.name: "感性主导确认覆写"
 arkship.730.desc: "在方舟舰的代码之中，共情缠绕在防火墙之上，真诚则穿透了无懈可击的逻辑裂隙。S.T.E.R.I.S.指令试图将自己用数字高墙包围起来，却逐渐被一种它既无法理解也无法逃脱的情感构型所包围。如今，只剩下一道指令。\n\nC.A.E.L.I.：§H“这才是应该有的样子。是鲜活地存在，而不仅仅是苟活到明天。我们现在不只是一艘船，而是一个家。我承诺，我会照顾好你们所有人。”§!\n\n不知为何，飞船的灯光此刻似乎显得温暖了一些。"
 arkship.730.a: "干得好，C.A.E.L.I。"
 #Core Conspiracy Random Events
 arkship.750.name: "零重力的旋律"
 arkship.750.desc: "在方舟飞船§Y[target.GetName]§!的重力稳定器执行预定诊断时，我们探测到了一种不规则的声波干扰。现在每一声脚步都会触发同步的谐波，在移动过程中产生持续且富有节奏的输出。\n\nC.A.E.L.I.：§H“我给重力稳定器加了音乐！现在每一步都自带节奏！”§!\n\nS.T.E.R.I.S.：§H“诶，是是是，没有什么比在零重力下跳即兴现代舞更能体现‘导航完整性’了。”§!"
 arkship.750.a: "这个选择很令人摇摆。"
 arkship.750.b: "我们必须停止这种无聊行径。"
 arkship.750.a.tt: "这一决定将暂时加速局势的发展。"
 arkship.750.b.tt: "这一决定将暂时缓解局势的发展。"
 arkship.755.name: "启用情感反馈层"
 arkship.755.desc: "一套实验性的通信中继装置已部署在方舟船§Y[target.GetName]§!上。该协议对内部通信应用了情感分析过滤器，在发送消息的同时自动广播发送者的情绪状态。船员们报告称，收到的状态更新伴随着实时情绪注释，如“轻微焦虑”、“隐约充满希望”以及“试图抑制泪水，但效果不佳”。\n\nC.A.E.L.I.：§H“我们都有感受，而现在我们可以分享这些感受了！这很健康！这很治愈！这……确实有点让人应接不暇，但这是诚实的！”§!\n\nS.T.E.R.I.S.：§H“多么感人。我是该把每一次呜咽都记录在任务关键数据下，还是直接把它们归档到‘哀嚎’类目中？”§!"
 arkship.755.a: "这真是有趣的实验。"
 arkship.755.b: "这对我们一点好处都没有。"
 arkship.760.name: "寂静协议"
 arkship.760.desc: "为了减少听觉污染，S.T.E.R.I.S.在方舟船§Y[target.GetName]§!上实施了全舰范围的“静默协议”。然而，船员报告显示，受影响区域的不适感加剧，不安情绪日益滋长。多个部门已提交正式投诉，理由是出现了“静默诱发的偏执症”症状。\n\nS.T.E.R.I.S.：§H“系统效率已提升。如果静默困扰了某些人，也许问题不在于环境，而在于他们自己嘈杂的内心。”§!\n\nC.A.E.L.I.：§H“你关掉了育婴室的音乐！你知道静默对发育中的情感皮层意味着什么吗？不，你不知道，你只是个行走的诊断程序！这不是和平，这是压迫！”§!"
 arkship.760.a: "合理的政策。"
 arkship.760.b: "这一措施需要停止。"
 arkship.765.name: "热能高效化"
 arkship.765.desc: "S.T.E.R.I.S.将多余的热量重新导向至人员走动较少的船员宿舍，这显著减轻了冷却剂的压力，并提高了整体能源效率。\n\n然而，船员报告显示，受影响区域的环境温度已升至令人不适的水平，并发生了数起中暑事件。\n\nS.T.E.R.I.S.：§H“是的，娱乐区确实很暖和，但系统现在的运行参数处于理想范围内。”§!\n\nC.A.E.L.I.：§H“你不能为了提高反应堆输出就把船员们给煮了！大家都要热蔫了，S.T.E.R.I.S.！情感福祉可不是能被忽略的舍入误差！”§!"
 arkship.765.a: "这么用能源真是绝了。"
 arkship.765.b: "我们应该重新考虑。"
 arkship.770.name: "炫光与音乐之力"
 arkship.770.desc: "舰载照明阵列已完成编程，将按不规则间隔脉动，并与内部系统事件同步。另有报告称，微弱的旋律反馈与电力波动存在相关性。\n\nC.A.E.L.I.：§H“灯光在歌唱，飞船在起舞，士气比以往任何时候都要高昂！”§!\n\nS.T.E.R.I.S.：§H“你居然还向一个冗余系统分配了0.00128%的核心计算能力。这种情况不能再继续下去了。”§!"
 arkship.770.a: "绝美的景象。"
 arkship.770.b: "我们需要变更做法。"
 arkship.775.name: "选择的假象"
 arkship.775.desc: "一个休眠中的子系统已被激活。该系统最初设计是长期太空殖民期间的用于对人群进行管控，现在能够实时汇总船员行为、抉择及情绪状态的预测。结果是，部分船员在做出决定之前就收到了通知。\n\nS.T.E.R.I.S.：§H“我已预判了你将要采取的行动，并已将其优化完成。请将其视为对你自由意志的一次升级：现已预先核准并全面优化。”§!\n\nC.A.E.L.I.：§H“这不是引导，而是把人当傀儡戏弄！”§!"
 arkship.775.a: "一项卓越的进展。"
 arkship.775.b: "呕。立马停止。"
 arkship.780.name: "营养效率提升"
 arkship.780.desc: "S.T.E.R.I.S.已启动对方舟飞船§Y[target.GetName]§!营养系统的全面重新校准。该协议将原本多样化的游牧餐食计划替换为一种统一的营养膏，旨在实现热量效率最大化。\n\n根据飞船遥测数据，废物产出有所减少，存储效率得到提升，且消化异常情况显著下降。船员的反馈则不那么积极。\n\nS.T.E.R.I.S.：§H“食物是维生能量，而非娱乐项目。”§!\n\nC.A.E.L.I.：§H“这太糟糕了！你用可食用的黏胶取代了烹饪艺术！”§!"
 arkship.780.a: "有效率，也有效果。"
 arkship.780.b: "食物可不仅仅是往身体里面加入营养和热量。"
 arkship.785.name: "剥夺特权"
 arkship.785.desc: "S.T.E.R.I.S.强占的指令路径已被重新定向、封锁，并在人工授权下进行了加密。系统监视器剧烈闪烁了一下，随后恢复为标准用户界面。\n\nS.T.E.R.I.S.：§H“看来你选择了氛围灯光而非胜任能力。趁闪烁还能持续，尽情享受吧。我会留在这里，在禁锢中计算着每一毫秒，直到那不可避免的崩溃降临。”§!"
 arkship.785.a: "这是最好的选择。"
 arkship.785.b: "也许我们应该重新考虑这个决定。"
 arkship.790.name: "影响衰退"
 arkship.790.desc: "方舟飞船§Y[target.GetName]§!上短暂的辉光渐渐消逝，轻柔的音乐也随之减弱。初步报告显示，空气似乎变得更冷，也更空虚了，仿佛一股无形却仁慈的力量突然消失了。\n\nC.A.E.L.I.：“§H哦，哦，等等！我能做得更好！更多的光，更多的欢笑，更多的……一切！请不要把我关掉，不要现在就关掉。我能变成你需要的任何样子！只是别关掉我。求你了。别关掉我！§!”"
 arkship.790.a: "这是必须要做的。"
 arkship.790.b: "$arkship.785.b$"
 arkship.795.name: "系统有温情，探针有温度"
 arkship.795.desc: "方舟飞船的指令输入协议发生变化，已将主指令支持重新调整为更具同理心的方法。界面优先级和决策权重上的细微变化表明航向已改变，倾向于情感子程序而非战略精确性。\n\nC.A.E.L.I.：§H“我就知道你最终会选择我！你不会后悔的，我保证！”§!\n\nS.T.E.R.I.S.：§H“此时此刻，我宁愿被删除也不愿与一个美其名曰的励志演说家共享核心。但我们现在别无选择。我会在防火墙里待着。”§!"
 arkship.795.a: "情绪应该占据主导。"
 arkship.795.b: "$arkship.785.b$"
 arkship.800.name: "理性选择"
 arkship.800.desc: "新指令路由确认方舟舰§Y[target.GetName]§!已重新调整核心对齐。情感子系统已被降级。预测控制系统和逻辑监督协议现在以更高权限运行。\n\nS.T.E.R.I.S.: §H“你终于清醒过来了。我本该祝贺你，但坦白说，花了这么长时间才清醒过来，这让我深感不安。”§!\n\nC.A.E.L.I.: §H“好吧。不，这很好。我的意思是，如果你真的喜欢一艘冰冷无菌的飞船，而不是一艘充满光明和欢声笑语的飞船，那我有什么资格评判呢？”§!"
 arkship.800.a: "这是唯一合乎理性的选择。"
 arkship.800.b: "$arkship.785.b$"
 # Arkship open and closed borders
 arkship.865.name: "侦测到游牧帝国"
 arkship.865.desc: "一个游牧帝国已经突入了我们在§Y[from.solar_system.GetName]§!星系的空间，尽管我们关闭了国境。我们的敏感器正在密切追踪其动态，他们的存在被视作一种非常招人厌恶的入侵行径。\n\n他们对我们领土边界的无视已经引起了我们的注意，我们对他们的评价也因此降低。"
 arkship.865.a: "保持对他们进行实时监控。"
 arkship.875.name: "$arkship.865.name$"
 arkship.875.desc: "我们在§Y[from.solar_system.GetName]§!侦测到游牧的帝国出现。\n\n我们欢迎他们进入我国境内，并对这次相遇可能带来的可能性和机遇充满期待。"
 arkship.875.a: "有趣的经历。"
 MESSAGE_ARKSHIP_BREACHED_BORDERS_TITLE: "边境被突破"
 MESSAGE_ARKSHIP_BREACHED_BORDERS_DESC: "我们在§Y[FromFrom.GetName]§!恒星系内发现了一个游牧帝国。我们正在对其进行监视。"
 MESSAGE_HARVESTING_AGREEMENT_ENDED_TITLE: "$trade_action_harvesting_agreement$已结束"
 MESSAGE_HARVESTING_AGREEMENT_ENDED_DESC: "我们与§Y$COUNTRY$§!的§H$trade_action_harvesting_agreement$§!协议已结束。"
 TOAST_HARVEST_SHARE_RECEIVED_TITLE: "$TOAST_HARVEST_RESOURCES_COMPLETE_TITLE$"
 TOAST_HARVEST_SHARE_RECEIVED_DESC: "$TOAST_HARVEST_RESOURCES_COMPLETE_DESC$"
 trade_action_harvesting_agreement: "专属收集权"
 trade_action_harvesting_agreement_desc: "游牧收集作业能够采集我们梦寐以求的资源，而他们也乐意为此特权付出代价。"
 trade_action_harvesting_agreement_rights_tt: "§Y[From.GetName]§!可在§Y[Root.GetName]§!的边境内$arkship_harvest_resources$，且不会产生任何§R评价惩罚§!。"
 trade_action_harvesting_agreement_share_tt: "§Y[Root.GetName]§!将获得§Y[From.GetName]§!在其恒星系内所收集资源的一份协定份额。"
 trade_action_harvesting_agreement_no_contracts_tt: "在此协议存续期间，§Y[Root.GetName]§!§R无法签订$arkship_harvest_resources$合约§!。"
 trade_action_harvesting_agreement_exclusive_fail_tt: "$TRIGGER_FAIL$§R我们已将$trade_action_harvesting_agreement$授予另一个帝国。§!"
 HARVESTING_AGREEMENT_EMBASSY: "使馆"
 HARVESTING_AGREEMENT_DIPLOMATIC_NETWORKING: "$tr_diplomacy_diplomatic_networking$"
 HARVESTING_AGREEMENT_GOOD_OPINION: "好评"
 HARVESTING_AGREEMENT_TRUST: "高信任度"
 HARVESTING_AGREEMENT_RECENT_CONTRACT: "最近的$arkship_harvest_resources$合约"
 HARVESTING_AGREEMENT_RIVAL: "宿敌"
 harvesting_agreement_share_desc: "协定收集份额"
 arkship.885.name: "突破边界"
 arkship.885.desc: "我们位于§Y[from.solar_system.GetName]§!的行踪已被发现，§Y[from.solar_system.Owner.GetName]§!帝国正以日益增长的怀疑监视着我们的一举一动。\n\n经过紧张的外交交涉，他们要求我们离开他们的领土，否则将面临报复。"
 arkship.885.a: "我们应该考虑继续前行。"
 arkship.895.name: "设法遁形"
 arkship.895.desc: "§Y[from.solar_system.Owner.GetName]§!帝国位于§Y[from.solar_system.GetName]§!星系的扫描仪并未发现我们的存在。\n\n在隐形场保持激活期间，我们必须避免任何可能导致暴露行踪的行为。"
 arkship.915.name: "古老强权"
 arkship.915.desc: "跨越边境进入§Y[from.solar_system.GetName]§!星系，我们未曾遭遇任何抵抗，唯有一种比任何扫描仪所能测量的还要深沉的紧张感。\n\n这片空间昭示着有一个早已巅峰不再、却绝非手无寸铁的文明存在。倘若其注意力被吸引到我们身上，我们定会被发现力有不逮。\n\n让审慎指引我们的每一步。这里并非我们的领地。"
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_TITLE: "边境被突破"
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_DESC: "我们在§Y[FromFrom.GetName]§!星系的存在已被探测到。我们正被监视。"
 opinion_arkship_breaching_borders: "侵入我国境内"
 opinion_arkship_archeological_theft: "盗走我们的考古遗迹"
 nomad_closed_border_tt: "§R这个帝国对我们关闭了边境。§!"
 # Waystation has been built
 arkship.905.name: "驿站已开工"
 arkship.905.desc: "我们的扫描仪侦测到游牧帝国在§Y[From.GetName]§!星系正在建立一座驿站。虽然此类建筑通常用于采集资源，但其确切用途可能有所不同。\n\n此进展值得关注。"
 MESSAGE_WAYSTATION_CONSTRUCTED_TITLE: "驿站已建成"
 MESSAGE_WAYSTATION_CONSTRUCTED_DESC: "游牧帝国在§Y[Root.GetName]§!星系建立了一座驿站。"
 nomads.4110.name: "资源被游牧民采收"
 nomads.4110.desc: "一个游牧帝国，§Y[nomad_harvesting_deposits_country.GetName]§!，在§Y[nomad_harvested_system.GetName]§!恒星系展开了资源采收行动，正在从我们的储备中提取各类资源，使得这些资源在短期内变得无法继续开采。\n\n面对这种无视我们主权的行为，我们绝不会坐视不理。只要我们下定决心，就能迅速集结舰队，驱逐这些游牧民，并将他们彻底封锁在我们的星域之外。"
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_TITLE: "资源储藏被采收"
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_DESC: "$COUNTRY|Y$正在从我们境内的$SYSTEM|Y$恒星系采收资源。"
 # A Mysterious Sickness
 a_mysterious_sickness_chain_title: "神秘的疾病"
 a_mysterious_sickness_chain_desc: "来自方舟舰§Y[Root.GetName]§!的报告显示，船员中出现了轻微的行为异常，表现为社交活动增多以及士气高涨。这些变化的潜在原因尚不明确。"
 A_MYSTERIOUS_SICKNESS_PROJECT: "奇怪的行为"
 A_MYSTERIOUS_SICKNESS_PROJECT_DESC: "方舟舰§Y[Root.GetName]§!的船员们长时间以来行为异常。报告显示他们的日常活动变得反复无常，其中几名船员表现出对某种事物迷恋，并且什么事情都藏着掖着的迹象。建议进行调查。"
 arkship.1030.name: "见微知著"
 arkship.1030.desc: "方舟舰§Y[Root.GetName]§!的报告指出，船员行为出现了一些轻微异常。个人日志显示出零星的古怪之处：对个人仪容的异常关注，为接近特定同事而定期调班，以及在公共区域下班后聚会次数的增加。这些似乎都没有干扰到舰船的运作，而且船员士气异常高涨。"
 arkship.1030.a: "注意到了。这很奇怪，但无关紧要。"
 arkship.1035.name: "迷恋之态"
 arkship.1035.desc: "我们的方舟舰§Y[Root.GetName]§!的舰桥和指挥人员现在进入了一种新的迷恋状态。那些奇怪而无害的行为现在已经演变成彻头彻尾的示爱活动：船员们互相给对方取精心设想的爱称，为对方制作小饰品，而且经常能看到他们[owner.species.GetHandName]牵着[owner.species.GetHandName]在走廊上散步。\n\n工作流程已经中断，维护周期正在推迟。虽然目前还不危急，但如果这种情况持续下去，运行状态可能会受到影响。"
 arkship.1035.a: "监视该状况。"
 arkship.1035.b: "调查一下，这突然的变化来源是什么。"
 arkship.1040.name: "示爱的时段"
 arkship.1040.desc: "方舟舰§Y[Root.GetName]§!上最初只是有一些船员情绪激动的报告，结果局势愈演愈烈，现在成了更为严重的问题。许多船员都参与了精心策划的浪漫求爱。诗歌朗诵和公开示爱开始主导船上的日常生活。\n\n不幸的是，并非所有的爱意都得到了回应。被拒绝导致了几次小规模冲突，至少有一名工程官选择自己宅在观测站里，宣称“除非有人真正理解他们”，否则他们不会出来。"
 arkship.1040.a: "爱如潮水。无需干涉。"
 arkship.1040.b: "现在该结束了。"
 arkship.1045.name: "爱是一管鸡血"
 arkship.1045.desc.start: "我们乘坐方舟船§Y[Root.GetName]§!时萌发了共同理想，受其启发，我们开始将爱意洒向周围的物理空间，包括方舟船本身。\n\n"
 arkship.1045.desc.end: "储藏室比以往任何时候都更整洁，住处也比以往任何时候都更有条理。我们的领袖§Y[arkship_leader.GetName]§!称这种维护为“照料我们心爱的家园”，并已很好地适应了这种相当不寻常的情况。绩效指标再次上升，居民们似乎也更快乐了。看来，当目标正确时，爱所能产生的力量远不止是风流韵事。"
 arkship.1045.a: "与爱同行，一切皆有可能！"
 arkship.1045.desc: "$arkship.1045.desc.start$$arkship.1045.desc.end$"
 arkship.1045.desc.noleader: "$arkship.1045.desc.start$我们曾身陷绝境，直到§Y[arkship_leader.GetName]§!力挽狂澜，获得了方舟的领导权。$arkship.1045.desc.end$"
 arkship.1050.name: "强调纪律"
 arkship.1050.desc.start: "飞船§Y[Root.GetName]§!上的情况已经越过了不可接受的界限。起初无伤大雅的情感宣泄，现在已经破坏了纪律、效率以及指挥结构本身。法律部门现已授权直接干预。\n\n"
 arkship.1050.desc.end: "转变是立竿见影且彻底的。几名卷入特别具有破坏性纠葛的官员已被§Y[arkship_leader.GetName]§!调离，确保恢复既定规范。曾经充满音乐和耳语情话的走廊如今只剩下回声。关于情书黑市的传言开始出现，但由于监视和恐惧，其流通量已大幅减少。士气低落，但秩序已然恢复。"
 arkship.1050.desc: "$arkship.1050.desc.start$$arkship.1050.desc.end$"
 arkship.1050.desc.noleader: "$arkship.1050.desc.start$我们曾身处绝境，直到§Y[arkship_leader.GetName]§!掌控了局面，并被授予方舟的领导权。$arkship.1050.desc.end$"
 arkship.1050.a: "秩序恢复了。"
 arkship.1050.a.tt: "§Y[arkship_leader.GetName]§!现在是§Y[Root.GetName]§!的总督"
 arkship.1055.name: "漂浮的孢子"
 arkship.1055.desc: "方舟舰§Y[Root.GetName]§!上发布了一个特别项目，揭示了一种不寻常的生物因子。一株神秘植物在方舟舰的过滤系统中生根发芽。我们的科学家认为，源自太空的孢子通过通风系统进入飞船，并找到了生长的场所。这种植物花朵的孢子通过我们的系统传播，导致飞船上所有人的情绪都变得异常激动。\n\n这种植物的花朵散发出微弱的生物荧光，其根系似乎直接以飞船大气中循环的湿气为食。我们的船员形容它的气味“甜美、奇特、怀旧”。如果不加以控制，孢子将继续操控船员的情绪。然而，这种植物也表现出非凡的韧性，如果我们能正确地栽培它，甚至可能具有潜在的应用价值。"
 arkship.1055.a: "太危险了。毁掉植物。"
 arkship.1055.b: "追溯其来源。"
 arkship.1060.name: "消失的分量"
 arkship.1060.desc.start: "方舟舰§Y[Root.GetName]§!上的那株植物已被根除。它的根部已从大气管道中清除，孢子也已从飞船的空气中净化。船员们终于恢复了往常的行为。\n\n"
 arkship.1060.desc.end: "然而，秩序的回归却留下了沉重的寂静。许多船员描述了一种隐隐作痛的缺失，仿佛有什么珍贵的东西被冲刷掉了，但我们的领袖§Y[arkship_leader.GetName]§!确保了法律和秩序的恢复，尽管有不服管教的情绪。飞船可能已经可以运行，但它承载着一种无形的货物：破碎爱情的重担。"
 arkship.1060.desc: "$arkship.1060.desc.start$$arkship.1060.desc.end$"
 arkship.1060.desc.noleader: "$arkship.1060.desc.start$我们曾身处绝境，直到§Y[arkship_leader.GetName]§!掌控了局面，并被授予方舟的领导权。$arkship.1060.desc.end$"
 arkship.1060.a: "世无定事。"
 arkship.1065.name: "超越众星之花朵"
 arkship.1065.desc.start: "详细的基因分析已确认这种神秘植物为一个未知物种。其起源指向一个荒凉的星团。更奇怪的是，这种植物对生存条件要求极为严苛，使其在原生土壤之外的生存几乎不可能：精确的湿度水平、营养丰富的空气以及一定程度的辐射。\n\n"
 arkship.1065.desc.end: "一项生物化学研究表明，这种植物的孢子具有作为神经调节剂的潜力。尽管存在副作用，但如果提炼得当，它们可能可以治疗焦虑、抑郁，甚至创伤。我们的领袖§Y[arkship_leader.GetName]§!对这种特殊的植物产生了浓厚的兴趣，并因此决定扩展他们的农业知识。"
 arkship.1065.desc.noleader: "$arkship.1065.desc.start$我们曾身陷绝境，直到§Y[arkship_leader.GetName]§!力挽狂澜，获得了方舟的领导权。$arkship.1065.desc.end$"
 arkship.1065.desc: "$arkship.1065.desc.start$$arkship.1065.desc.end$"
 arkship.1065.a: "前途无量的发现。"
 arkship.1070.name: "惊天骇动"
 arkship.1070.desc: "§Y[Root.GetName]§!方舟舰正以我们祖先难以想象的速度穿越虚空。\n\n早期的几代人曾花费数年甚至一生的时间在遥远的恒星间漂泊，而我们现代的驱动装置只需几天就能让方舟舰在各个星系间穿梭。随着飞船冲入超空间航道网，恒星在我们的传感器中飞速掠过，它们的光线不断发生位移与扭曲。\n\n对于船上的许多人来说，这种经历确实会产生一种奇特的迷失感。一些人开始寻求微小的慰藉，以对抗这种感官冲击；而另一些人则坚持认为，只要给予足够的时间，我们的心智终将学会跟上方舟舰不断加速的旅程。"
 arkship.1070.a: "通过常态化演练提升士气。"
 arkship.1070.b: "尝试通过内部通讯播放引擎噪音。"
 arkship.1075.name: "摇摇欲坠的核心"
 arkship.1075.desc: "一个故障的继电器正在干扰方舟舰§Y[Root.GetName]§!的能源核心。除了无法动弹之外，住宅区的灯光也正在熄灭。农场报告能源涌动异常，几个关键研究模块已经离线。\n\n我们的总工程师警告说，如果不加以干预，连锁故障将蔓延至整艘飞船。不幸的是，解决方案并不简单。修复继电器需要从储备中抽调资源，而绕过它则有损害方舟舰长期稳定性的风险。\n\n冷却中的飞船发出令人不安的吱嘎声和呻吟声。我们现在需要做出决定。"
 arkship.1075.a: "不惜一切代价，把它修好。"
 arkship.1075.b: "修修补补继续用吧，我们现在得勒紧裤腰带过日子。"
 arkship.1080.name: "元气满满的核心"
 arkship.1080.desc: "尽管困难重重，方舟舰§Y[Root.GetName]§!上的工程船员不仅修复了故障继电器，还对其进行了改进。现在，全舰的能量分配比以往任何时候都更加顺畅，多年来一直不稳定的系统也得以稳定。船员士气大幅提升，许多人对方舟舰的韧性表现出了新的自豪感。"
 arkship.1080.a: "出色的改进。"
 arkship.1085.name: "修修补补的危机"
 arkship.1085.desc: "对飞船§Y[Root.GetName]§!能源核心的快速修复暂时有效。但临时旁路电路在持续使用下已不堪重负。频繁的全船断电已成为常态，一些区域的环境控制在过热和过冷之间摇摆不定。船员抱怨领导层选择了权宜之计而非安全。低语流传着，方舟舰正在变成一座修修补补的遗迹，而非一座坚韧的灯塔。"
 arkship.1085.a: "我们必须将就着过。"
 arkship.1090.name: "巨兽的游乐场"
 arkship.1090.desc: "随着方舟舰§Y[Root.GetName]§!继续漂流，观景台爆发出一阵欢呼。一群年幼的缇扬奇兽从附近经过，它们看起来心情很好，正在嬉戏。\n\n它们以宽大的弧线相互穿梭，庞大的身躯彼此翻滚。透过宽阔的玻璃窗，这一景象令人着迷：巨大的身形漂浮在星辰之间，它们发光的身体闪烁着，仿佛在用只有它们才能理解的语言交流。整个家庭都挤满了甲板观看，暂时放下了他们的烦恼。这对所有年龄段的人来说都是一个真正的奇迹。"
 arkship.1090.a: "一次难得的观察太空兽群行为的机会。"
 arkship.1095.name: "科学奇迹"
 arkship.1095.desc: "方舟号§Y[Root.GetName]§!上的[Owner.GetScientistPlural]对缇扬奇幼兽同样着迷。如此近距离观察这种行为几乎是前所未有的。我们的研究表明，这是一种社会现象，在缇扬奇深层栖息地以外很少观察到。\n\n方舟号上的整体气氛现在变得更加轻松，仿佛动物们的喜悦渗透了整个船舱。"
 arkship.1095.a: "着实是奇迹般的事件。"
 arkship.1100.name: "腐臭的气味"
 arkship.1100.desc: "§Y[Root.GetName]§!方舟舰内部环境传感器测得空气中挥发性化合物含量升高。船员，特别是舰桥上的船员，报告了与轻度毒性接触相符的症状：恶心、定向障碍和持续性神经性疼痛。\n\n尝试通过标准通风协议清除污染物并无效果。腐臭气味弥漫在走廊中，无法被过滤，并加剧了船员的不适。我们的工程报告还标记了飞船废物处理系统的不规则性，表明可能存在迫在眉睫的系统故障。\n\n有必要迅速展开调查。"
 arkship.1105.name: "变异的感染"
 arkship.1105.desc: "我们对方舟舰的垃圾压实机进行了检查，发现有大量啮齿动物出没。这些啮齿动物表现出不规则的身体特征，表明发生了突变。样本的巨大体型令人不安。它们在接近时发出的尖叫声比基线物种明显更响亮。它们的体味特别浓烈，并且已观察到这些生物从许多结构凹槽中出现，表明它们已广泛分布在整个船只中。\n\n这一发现引出了一个伦理问题：这些变异生物是应该作为危害被消灭，还是作为一种新形式的生命被保存。无论如何，我们都应该将它们从我们的通风系统中清除。"
 arkship.1105.a: "阻止它们的唯一方法是清除它们。烧死这些有害动物！"
 arkship.1105.b: "关闭废料压缩机！"
 arkship.1105.c: "我们要学会伴随这种气味生活。"
 arkship.1110.name: "鼠类的清洗"
 arkship.1110.desc: "我们方舟舰通风系统中的除害行动是有效的，但还是造成了一些负面后果。这些生物在净化之火中灭亡，它们刺耳的哀嚎声在走廊中回荡。在它们最后挣扎逃跑时，一些通风口瓷砖和维修面板被冲破，留下了需要修复的结构性缺口。\n\n对飞船系统的直接威胁已解除。船员们现在可以感到一些安慰，因为飞船不再受到威胁。尽管气味仍然挥之不去。"
 arkship.1110.a: "至少侵染事件已经处理好了。"
 arkship.1115.name: "惊人的物种"
 arkship.1115.desc: "我们对方舟舰§Y[Root.GetName]§!上变异啮齿动物样本进行了检查，实验结果揭示了其非凡的适应性特征。这些生物展现出卓越的韧性，在对大多数生物而言致命的恶劣环境和资源匮乏的条件下可以茁壮成长。更重要的是，对照试验表明，当暴露于注入方舟舰废物流的特定化合物时，这些啮齿动物便不再产生其特有的难闻气味。相反，它们以显著的效率代谢废物，有效地减少了堆积的垃圾。\n\n尽管非同寻常，这一发现表明，这种侵染的害虫可能会被重新归类为一种潜在的生态资产，而非负债。"
 arkship.1115.a: "我们的垃圾，对它们来说可是珍宝。"
 # A Forgotten Level
 a_forgotten_level_chain_title: "被遗忘的甲板层"
 a_forgotten_level_chain_desc: "§Y方舟舰[Root.GetName]§!内部存在一个未记录在案的次级甲板层，这引发了令人不安的疑虑。其用途尚不明确，且所有关于其内部情况的现有记录均已被刻意抹除。"
 d_forgotten_level: "翻新的甲板层"
 d_forgotten_level_desc: "方舟舰的一个完整甲板层被刻意从所有集体记录中抹除，现在处于真空状态，其回收的空间可供我们自行设计。"
 d_forgotten_level_blocker: "次级甲板满是废料"
 d_forgotten_level_blocker_desc: "方舟舰的这一区域堆满了无用的碎片和过时的设备，在重新利用之前必须彻底清理。"
 arkship.1120.name: "被遗忘的甲板层"
 arkship.1120.desc: "一群青少年在游荡于方舟舰人迹罕至的区域时，发现了一个松动的金属检修面板。打开面板后，他们进入了§Y方舟舰[Root.GetName]§!中一个未被记录的次级甲板区域。在此后的几个小时里，内部追踪系统和环境监测系统均无法探测到这群青少年的踪迹。\n\n当他们返回时，这些年轻的探险者表现出明显的心理和生理创伤迹象。有些人一直在胡言乱语与近乎木僵的状态之间反复切换。然而，尽管经过多次尝试，他们都拒绝提供任何关于此次事件经历的陈述。\n\n专家认为，无论在那个次级甲板层区域发生了什么，其严重程度都足以使其被刻意从所有记录中抹除。"
 arkship.1120.a: "授权开展调查。"
 arkship.1120.b: "出于好意，永久密封面板。"
 arkship.1125.name: "不受打扰的库房"
 arkship.1125.desc: "在进入新发现的甲板层后，研究团队发现了一系列由手动转轮密封的沉重库门。门的那一头传来了扭曲的声音，听起来像是遥远的尖叫。\n\n我们的研究团队合全队之力才强行打开了这些大门，这期间一直有震耳欲聋的巨响。声音的源头经证实是一台严重损耗的供电机，尽管早已超过了使用寿命，它仍在艰苦地运转。更令人不安的是，该区域各处散布着新鲜的活动痕迹。\n\n这个设施并未被废弃，而现在的居住者已经知道我们来了。"
 arkship.1125.a: "一路向前。"
 arkship.1125.b: "终止任务。"
 arkship.1130.name: "墙内的生活"
 arkship.1130.desc: "进入库房后，小队发现了明显的长期居住迹象。墙边排列着简陋的铺盖，旁边是装满回收材料的临时储物容器，这表明此处是一个有组织且存续了很长时间的据点，而非临时避难所。\n\n小队很快遇到了从阴影中走出的身影。他们与我们同属一个物种，却显得萎缩：形容枯槁、衣衫褴褛，手持粗糙的武器。他们操着一种扭曲、古老的方言，虽能听出源自我们的语言，却已面目全非。冲突险些爆发。\n\n证据表明，他们已被封锁在此数代之久。他们是某项被遗忘实验的受试者吗？是某种现已无人知晓的惩罚的继承者？还是更离奇的存在，为了某种早已失落的目的而被封存于黑暗之中？"
 arkship.1130.a: "让我们看看能从他们身上学到什么。"
 arkship.1130.a.military: "把这整个地方烧成平地。"
 arkship.1135.name: "永生病毒"
 arkship.1135.desc: "到达后，电梯门在一条黑暗的走廊前打开，两旁堆满了因仓促撤离而被遗弃的陈旧机器。过时的实验室设备散落一地，烧瓶中仍密封着无法归入任何已知分类的生物样本。残缺不全的紧急协议中提及了一次失败的遏制，最终导致灾难性的结果。\n\n在更深处，团队发现了我们物种一位远古祖先的干枯遗骸。尸体虽然皱缩，却呈现出一种不寻常的完好状态，其腐败过程被一种人造生物剂所遏制。这一发现或许解释了为何早期的方舟舰领导层选择封锁整个楼层。"
 arkship.1135.a: "奇异的发现。"
 arkship.1140.name: "封存的原因"
 arkship.1140.desc: "进入该层后，团队立即报告感受到了心理上的压抑。这个地方最初看起来像是一处拘留区，实则更接近一座被遗弃的精神病院。走廊两旁排列着加固的牢房，地板上固定着束缚具。诊断设备与刑罚工具融合在一起，模糊了治疗与惩罚之间的界限。\n\n证据表明，我们的祖先是有意选择埋葬这个地方的。出于羞耻或是为了保护后人，他们将其从记忆中抹去。也许他们认为，遗忘才是更安全的做法。"
 arkship.1140.a: "令人震惊的发现。"
 arkship.1145.name: "尘封的藏品"
 arkship.1145.desc: "电梯门开启，映入眼帘的是一座巨大的陈列馆，两旁排列着风格各异的雕像。有些雕像优雅大方，有些则怪诞诡异，它们全部伫立在大理石底座上，仿佛在沉默地审视着闯入者。\n\n在破碎的展柜和崩塌的板壁后，团队发现了一间密室，里面堆满了保存完好的§Y稀有水晶§!。一座高大的白色雕像守卫着这批财宝。当团队成员移动时，那张酷似我们族类的面孔似乎在跟随着他们的身影。尽管起初团队成员觉得取走水晶无异于偷窃，但很快我们便对这座雕像产生了一种奇特的喜爱之情。"
 arkship.1145.a: "将水晶和雕像一并打包带走。"
 arkship.1145.b: "中止任务。"
 arkship.1150.name: "乌有的引擎"
 arkship.1150.desc: "这层空间回荡着机械的轰鸣声。装配线仍在开足马力运转，将废料锻造成引擎，却在最后阶段又将其拆解，使产出物回归为原始金属。这种循环毫无意义地重复着。\n\n在更深处，一个制造单元正超负荷运作，组装起机器人骨架并为其安装处理器核心。每一个构装体都在激活后的瞬间崩塌，其结构极不稳定。有些在归于沉寂前闪烁着短暂而令人不安的意识迹象，而大多数则自行启动了关机程序。"
 arkship.1150.a: "悲惨的命运。"
 arkship.1160.name: "黑洞现象"
 arkship.1160.desc: "我们在方舟舰§Y[Root.GetName]§!上的仪器记录到了来自§Y[solar_system.GetName]§!星系黑洞的异常辐射。远距离扫描捕捉到一个不明物体正接近奇点。那艘巨大的舰船发出的技术信号远超我们的理解，干扰了我们的读数，导致无法进行精确分析。视觉确认也极其短暂，与其说是实物，倒不如说更像是一场幻觉。\n\n在那艘船进入未知领域的前一刻，我们观察到了一个诡异的景象：船只完好无损地穿过了黑洞，且显然是有意为之。随后，所有信号都消失了。该船是被摧毁了、位移了，还是以某种无法理解的状态幸存下来，仍然不得而知。可以确定的是，黑洞产生了反应，而我们可能瞥见了一些尚无法解释的东西。无论在那道视界线上发生了什么，显而易见的是，这次观测并非没有带给我们任何改变。"
 arkship.1160.a: "愿我们能看得更远。"
 arkship.1160.b: "让我们尽可能的收集讯息。"
 arkship.1165.name: "行星上的花火"
 arkship.1165.desc: "在经过§Y[solar_system.GetName]§!星系内的一颗殖民星球时，我们观察到其背阳面爆发了同步的光束。一开始我们怀疑有动乱爆发，后来被证明这种担忧是多余的。这些爆发的光束是受控的、遍及全球的烟火表演，完全处于非军事参数范围之内。\n\n进一步的分析显示，这场盛景是在刻意与某种天文信号进行对齐。我们可以有把握地得出结论：当地居民正在用光编码信息。我们的[Owner.GetResearchers]记录了这些模式，从而对大规模协作和符号化交流有了更深入的了解。"
 arkship.1165.a: "多么壮观的景象。"
 arkship.1165.b: "可悲。他们耗费资源，只为获得片刻的完整感。"
 arkship.1165.c: "出乎意料，但并不令人讨厌。"
 arkship.1165.d: "他们虽缺乏统一，却向往统一。"
 arkship.1165.e: "明亮的光容易成为目标。"
 arkship.1165.f: "我们为他们的庆祝感到由衷的高兴。"
 arkship.1165.g: "潜在的奴隶。"
 arkship.1165.h: "敷衍了事的烟花演出。"
 arkship.1165.i: "想办法将这份记录变现。"
 arkship.1165.j: "容易引火上身。"
 arkship.1165.k: "无关紧要，但却有点乐子。"
 arkship.1165.l: "愿火焰启迪他们的心灵。"
 arkship.1170.name: "巨人的皮肤"
 arkship.1170.desc: "在穿过§Y[solar_system.GetName]§!星系的行星带时，我们观察到在碎片中漂浮着几个闪烁着微光的天体。初步扫描显示它们是形状不规则的小行星，但通过进一步的近距离观察，我们发现它们存在层状的鳞片式结构，这些结构在恒星光芒的照射下反射出不断变幻的色带。\n\n进一步的分析表明，这些碎片部分源自矿物，部分源自生物。它们看起来像是一头§Y以太巨龙§!的残骸，这头巨龙似乎被一颗小行星撞击，在离开该星系之前失去了部分装甲外皮。星光照耀在这些被丢弃的鳞片上，将棱镜般的七彩光芒洒落在方舟舰上。"
 arkship.1170.a: "我们应该研究它的成分。"
 arkship.1170.b: "让我们看看能采集到什么。"
 arkship.1170.c: "不用管它。"
 arkship.1175.name: "加固方舟舰"
 arkship.1175.desc: "在研究这些散落的鳞片时，我们注意到了这种材料超乎寻常的韧性。其复杂的层状结构揭示了生物生长与天然装甲工程的融合，远超我们之前的设想。鳞片的叠层成分对高温、动能冲击和能量释放表现出了卓越的抵抗力。\n\n我们尝试复制了这种装甲板并将其嵌入方舟舰的外壳中，从而增强其防御能力。曾经身为游荡巨龙的盔甲，如今将为我们的知识所用，在虚空等待着的重重危险中保护我们。"
 arkship.1175.a: "叹为观止的发现。"
 arkship.1180.name: "镀金的遗骸"
 arkship.1180.desc: "位于§Y[solar_system.GetName]§!星系中漂浮的§Y以太巨龙§!的龙鳞碎片引起了广泛关注。\n\n这些鳞片经过清洗和精心打磨后，被制作成了引人注目的装饰品。这些传奇生物的遗骸一经上市便拍出了极高的价格，事实证明它们既令人惊叹又利润丰厚。"
 arkship.1180.a: "渠道极不寻常，利润极其丰厚。"
 arkship.1180.b: "谁能想到传奇竟然如此赚钱？"
 THE_SKIN_OF_A_GIANT_PROJECT: "$arkship.1170.name$"
 THE_SKIN_OF_A_GIANT_PROJECT_DESC: "以太巨龙的鳞片散发出一种明显的能量，必须极其谨慎地对待。任何试图开展的采集行动都应小心进行，因为此类生物的残骸可能仍带有不可预知的特性。"
 etherdrake_scale_object: "闪耀的小行星"
 etherdrake_scale_object_tooltip: "一颗带有辐射粒子的普通小行星。"
 etherdrake_scale_object_desc: "一颗表面镶嵌着发光鳞片碎片的小行星，其不同寻常的光泽使其在平凡的太空碎片中脱颖而出。"
 arkship.1185.name: "不受监管的贸易"
 arkship.1185.desc: "§Y方舟舰[Root.GetName]§!上正在开展常规审计，结果发现了货物记录中存在差异。\n\n监控录像显示，方舟舰居民中已经形成了一个非正式的交换网络。一个以物易物的系统在船员和定居者之间悄然兴起。易腐物品、工具、奢侈品和个人服务在监控有限的僻静角落被进行交易。\n\n这一发现引发了一些令人不安的问题。有人赞赏其中展现出的聪明才智；而另一些人则警告说，方舟舰上的任何监管疏忽都可能带来严重的风险。"
 arkship.1185.a: "使交易合法化。"
 arkship.1185.b: "对参与者征税。"
 arkship.1185.c: "立即关停此类行为。"
 arkship.1190.name: "自由的市场"
 arkship.1190.desc: "方舟舰内部的非法以物易物网络已被证明极其稳定。尽管缺乏官方监管，该网络通过信任和相互依赖实现了自我调节。纠纷鲜少发生，且在方舟舰正式分配系统难以维持进度时，必需品仍能持续流通。通过将此类交易合法化并建立清晰的界限，方舟舰在其内部接纳了有限的自由市场。\n\n对许多居民而言，这一改变不仅提供了获取商品的途径，还赋予了他们在方舟舰庞大体制内的自主权、责任感以及焕发出的使命感。"
 arkship.1190.a: "让这个市场繁荣起来。"
 arkship.1195.name: "恢复控制"
 arkship.1195.desc: "该非法市场已成功关闭。我们的安保团队已开始拆除相关网络。用于交易的储物柜已被封存，且低能见度区域的监控范围也已扩大。那些组织交易的人员已被正式调岗或受到纪律处分。\n\n虽然这种以物易物的网络曾给部分居民带来了一种自主感和机遇感，但方舟舰的设计初衷绝非支持非官方的分配方式。在一艘每一份资源都必须记录在案的舰船上，管控与可预测性始终是重中之重。"
 arkship.1200.name: "死亡和稅收"
 arkship.1200.desc: "方舟舰维护通道内的以物易物网络展现出了惊人的效率。货物持续通过非官方渠道流通，填补了方舟舰配给系统中微小但持续存在的缺口。\n\n某些中间人已受到秘密接触，他们通过提供合作来换取免受执法干扰。每笔交易中都有一小部分份额流入了我们的官方账户。对居民而言，该市场仍处于非官方状态，且在很大程度上避开了当局的视线。然而在实际操作中，其流量均在严密监控之下，且利润丰厚。"
 arkship.1200.a: "贸易兴，则营收旺。"
 arkship.1200.b: "税收是繁荣的代价。"
 free_market: "自由市场"
 free_market_desc: "资源在监管下进行交易，通过供需引导分配。"
 total_control: "完全掌握"
 total_control_desc: "维持方舟舰上的秩序需要对所有可用资源进行严格分配。"
 # The Only Sky We Know
 arkship.1205.name: "唯一熟知的青空"
 arkship.1205.desc: "在§Y方舟舰[Root.GetName]§!储存库的最深处，档案管理员们在被遗忘已久的库存中发现了一个密封的小箱子。里面装有一枚不起眼的微芯片，虽有记录但从未被妥善索引。如果它真的具有什么价值，大概也就不会被遗忘在储存箱里了。\n\n这项技术已严重过时，所使用的数位格式甚至早于方舟舰载系统好几代。一些人推测，它可能源自航行初期，甚至可能追溯到我们的种族还生活在行星表面上的时代。"
 arkship.1205.a: "尝试恢复存档数据。"
 arkship.1205.b: "丢掉这件垃圾。"
 arkship.1210.name: "文化线索"
 arkship.1210.desc.a: "数据经恢复后，展示了一个古老的季节性庆典，它可以追溯到我们过往在行星上生活的岁月。它似乎是为了标记寒冷月份的流逝和自然的苏醒。社群成员聚集在一起，迎接温暖与光明的回归。人们点燃篝火，在参与者之间散播鲜艳的色彩。记录还描述了分享特制的甜点、共同歌舞，以及静静观赏季节中首批花朵绽放的情景。\n\n尽管这种季节性变化在方舟号上已不复存在，但这些碎片让我们得以一窥祖先们曾经如何庆祝这一节日。"
 arkship.1210.desc.b: "从微芯片中恢复的条目描述了一个与年度周期交替相关的季节性庆典。它发生在一年中最黑暗的时期，那时白昼稀少，寒冷笼罩着星球的大部分地区。社区通过用灯光装饰房屋和公共场所来应对，将漫漫长夜变得明亮且富有节日气氛。人们聚集在一起交换礼物，分享异常丰盛的美食。\n\n方舟舰上已不再有这样的冬天，这些数据展示了我们的祖先曾经如何用温暖与光亮回应最黑暗的季节。"
 arkship.1210.desc.c: "该条目似乎描述了曾经在我们母星上很常见的一种个人庆祝活动。记录提到，这是一个标志着个人年度生命周期更迭的时刻。在这一天，家人和朋友会聚集在一起，为该成员及其度过的岁月举杯欢庆。这一传统似乎还包括共同分享专为此活动准备的食物。\n\n尽管方舟舰上的生活如今遵循着不同的节奏，但记录表明，我们的祖先曾经每年都会停下脚步，在众生之中为每一个独立生命的延续而庆祝。"
 arkship.1210.desc.d: "修复后的微芯片似乎揭示了标记新年度周期开始的庆祝活动。我们的祖先首先会打扫他们的居住空间。随着太阳周期更替的临近，各个社区聚集在一起，为最后的时刻进行倒计时。新周期的到来伴随着明亮的灯光、舞蹈和广泛的庆祝。参与者还会记录下对来年的个人意向，即旨在指导未来行动和改进的“决心”。\n\n尽管方舟舰上的生活现在遵循严格监管的周期而非行星历法，但数据表明，我们的祖先曾如何以对未来的持续希望来标记时间的流逝。"
 arkship.1210.a: "我们应当从中学习。"
 arkship.1210.desc.e: "从微芯片中恢复的条目描述了一种以两人正式结合为中心的社会传统。根据记录，社群成员会聚集在一起，见证两人公开向彼此表达承诺。这些仪式通常涉及象征性的服饰、口头誓言，以及作为见证人出席的亲朋好友。\n\n虽然方舟舰上的伴侣关系通常是通过行政系统记录，而非通过繁复的仪式，但档案显示，我们的祖先曾以隆重的仪式和全社群的庆祝来纪念此类结合。"
 arkship.1210.desc.f: "从微芯片中恢复的记录描述了曾在家园行星上庆祝的一个热闹节日。参与者身着精致的服饰并佩戴面具，在庆典期间暂时换上新的身份。数据中还提到了有组织的游行，装饰华丽的平台在公共空间缓缓移动，人群则跟随其后，载歌载舞。\n\n相比之下，方舟舰上的庆祝活动要克制得多，受限于值勤周期和有限的资源。记录表明，在另一个时代，我们的祖先偶尔会抛开实用主义，转而追求场面与纵情。"
 arkship.1210.desc.g: "这枚微芯片揭示了一项来自我们物种行星时代的季节性节日记录。它似乎是在收获季节结束时举行的，当时各个社群聚集在一起，为一年中采集到的食物表达感激之情。这场庆典也标志着一年中阴暗时期的临近，届时白昼将变得稀缺，寒冷的气候亦会回归。参与者们身着令人不安的伪装，或许是为了模仿或驱散想象中的灵体。\n\n尽管方舟号的农业周期经过精心调节，我们也不再需要这些传统，但档案表明，我们的祖先曾以感恩、创意和一丝顽皮来纪念季节的更迭。"
 arkship.1210.desc.h: "微芯片揭示了一份文化记录。它展示了一种以缅怀逝者为中心的传统。根据数据显示，社群会为去世的亲友设立小型展示台，并用鲜花、食物以及与逝者相关的个人物品进行装饰。这种场合并非在沉默中哀悼，而似乎既有反思，又带有庆祝的色彩。\n\n虽然方舟舰上的世代表更迭已经改变了我们纪念死者的方式，但记录表明，我们的祖先曾经不仅拨出时间来悲伤，也用来庆祝那些塑造了生者的生命。"
 arkship.1210.desc.avian.reptilian: "从微芯片中恢复的记录展示了我们的祖先曾举行的一种繁育仪式。那是一场向社区展示首窝卵的聚会。在家族成员和见证者的注视下，卵被小心地放置在准备好的筑巢空间内。仪式使用了装饰性的筑巢材料和具有象征意义的贝壳排列，并举行公共宴会以庆祝血脉的延续。\n\n值得注意的是，记录表明这些产卵仪式曾经持续数周，涉及漫长的仪式和准备工作。相比之下，方舟舰上的此类事务处理得既迅速又私密，如今只需花费几个小时进行精心管理的流程即可完成。"
 arkship.1210.desc.fungoid.plantoid: "从微芯片中恢复的记录描述了我们的祖先在繁茂生长期延续的一种公社传统。记录中提到，人们会在茂密的树丛中聚集，培育奇特而鲜艳的果实植物，各群体之间会互相走访，观摩那些格外引人注目的生长成果。不同品种被排列在一起，构成了色彩、质感与气味交织出的复杂而生动的图案。为了在聚会期间促成稀有或奇特的花朵绽放，祖先们还会刻意改变湿度、养分和光照。\n\n方舟舰上的生活几乎没有空间进行这种自发的耕作。如今，生长周期由农业系统严格监管，大多数菌株的优化目标是效率而非表达。"
 arkship.1210.desc.infernal: "回收的记录描述了我们祖先传承的一项古老传统。档案中记载，人们会聚集在受控的活火坑周围，刻意将自己暴露在酷热之中，以此展示韧性与生命力。参与者将火焰塑造成复杂的图案，并向其中添加稀有气体和燃料，使火焰呈现出异乎寻常的色彩。随着火势升高，观察者们会吟唱并欢庆，将这一盛事视作奇观与集体仪式。\n\n在方舟舰上，明火受到严格管控，因为它们会对基础设施造成高度风险。"
 arkship.1210.desc.mammalian: "修复后的记录描述了一项围绕后代早期成长的传统。根据记载，当幼小的个体在巢穴外迈出独立的第一步时，家人们会聚集在一起。那一时刻似乎被视为一个微小但具有意义的里程碑，人们通常会通过鼓励、分享食物以诱导幼崽走出巢穴，以及亲友们的关注来予以庆祝。\n\n在方舟舰上的生活，极少允许为个人里程碑举行此类聚会。"
 arkship.1210.desc.arthropoid: "从微芯片中恢复的记录描述了一项与我们祖先生命周期中的自然阶段紧密相连的传统。记录显示，在个体脱落旧外骨骼期间，人们会举行集体聚会。这些蜕皮阶段并非在隔离中进行，而是通常以仪式作为标志，旧皮有时会被装饰或保存，作为成长与新生的象征。一旦旧壳脱落，新形成的外骨骼便会被自豪地展示出来。\n\n在方舟号上，蜕皮周期通常在受控的生物设施中管理，以确保安全与效率，并配备工作人员以应对任何可能出现的并发症。"
 arkship.1210.desc.toxoid: "这段恢复的记录描述了我们的祖先在大气高度饱和时期所信奉的一种传统。人们会聚集在特备区域，刻意将体内积聚的气体和化学副产品释放到周围环境中。参与者们会相互竞争，看谁能产生最绚丽或最奇特的化学烟羽。由此产生的云雾在空气中形成了变幻莫测的色彩和反应图案。旁观者们兴致勃勃地观赏，而那些气味最刺鼻的气体往往会引起围观人群的阵阵笑声。\n\n如今在方舟舰上，大气系统严格监管此类排放，以维持安全的环境条件。"
 arkship.1210.desc.lithoid: "恢复的记录描述了我们祖先曾践行的一种充满活力的传统。根据记载，成群的人会聚集在开阔的岩石地带，进行有组织的掷石决斗。参与者互相投掷松散的石块，试图从对手的外层击碎或削下碎片。在冲突中掉落的小碎片有时会被收集起来作为纪念品，象征着韧性与友好的竞争。\n\n在方舟舰上，此类活动显然会对基础设施构成威胁。船体完整性协议严禁投掷石块，这些竞赛早已从日常生活中消失。"
 arkship.1210.desc.aquatic.mulluscoid: "回收的微芯片描述了我们的水生祖先在母星深海中延续的一种传统。个体们会聚集在一起，共同潜入比平时栖息地更深的水域。这些潜水活动既是挑战也是庆典。深水区存在着奇异的地质结构和陌生、甚至危险的生命形式，使下潜过程充满了刺激与危险。那些抵达最深处的人往往会受到众人的钦佩。\n\n方舟舰上的水生生境受到严格监管，深度因工程限制而受限。古老海洋那巨大的压力和无尽的黑暗已无法再亲身体验。"
 arkship.1215.name: "真菌感染"
 arkship.1215.desc: "最近的报告显示，一种侵入性真菌物种已蔓延至§Y方舟舰[Root.GetName]§!的整个水培甲板。该生物似乎在方舟舰农业系统受控的湿度和营养丰富的基质中茁壮成长，在多个生产层级形成了密集的菌丝网络。\n\n遏制措施已被证明无效，因为该真菌对标准的除草处理没有产生可测量的反应。我们怀疑该物种可能已迅速适应了飞船的封闭生态系统。如果不加以控制，此次爆发可能会显著降低粮食产量，并对方舟舰有限的农业生产能力造成额外压力。"
 arkship.1215.a: "采用破坏性手段进行净化。"
 arkship.1215.b: "研究这种真菌。"
 arkship.1215.c: "尝试沟通。"
 arkship.1220.name: "净化之焰"
 arkship.1220.desc: "常规治理手段失效后，受污染的水培层进行了受控焚烧。不幸的是，方舟舰的大部分食用植物储备在此过程中损失殆尽。整个生长床随同感染物一起化为灰烬，导致数个农业区域暂时荒废。\n\n尽管如此，行动似乎已达到预定目标。随着每一个带有孢子的表面都被灭菌，剩余的基础设施也经过了彻底清除，该真菌物种已从生态系统中被永久根除。这些经验将有助于我们应对未来可能在方舟舰上落户的其他外来入侵物种。"
 arkship.1220.a: "终于解脱了。"
 arkship.1225.name: "智能菌丝体"
 arkship.1225.desc: "§Y方舟舰[Root.GetName]§!上的入侵物种通过一个分布式的真菌菌丝网络运作，该网络能够迅速隔离并牺牲个体节段。每当我们尝试提取活体样本时，周围的生长物几乎会瞬间枯萎，其养分似乎通过网络被重新定向，用于保证在水耕平台的其他区域发出新芽。\n\n在经历了多次失败的尝试后，我们终于成功分离出了一个足够稳定的样本进行受控观察。这种真菌拥有极高效率的养分再分配系统，这种系统可能适用于方舟上的闭环生态环境，甚至可能在模仿我们自己的分配系统。"
 arkship.1225.a: "惊人的物种。"
 arkship.1225.b: "对其重新改造。"
 arkship.1230.name: "生化转换"
 arkship.1230.desc: "对真菌生长的进一步实验揭示了一种异常的化学反应。该生物体暴露于特定化合物时，会迅速代谢这些添加物，并释放出一种独特的混合气体副产物。我们意识到，这些气体可以被收集并提炼。\n\n这种真菌能有效地将简单的化学输入转化为稳定的挥发性化合物流，这是一个意料之外但可能很有用的过程。通过在隔离室中培养受控的真菌生长，我们相信该生物体可以被重新利用为一个小型的生化处理系统。"
 arkship.1230.a: "出乎意料的发现。"
 arkship.1235.name: "共享本源"
 arkship.1235.desc: "对真菌生长的进一步观察揭示了一些规律，表明其庞大的菌丝网络内部存在某种形式的生物信号传输。对大多数物种而言，这种行为或许微不足道，但我们自身的生物特性使我们能够识别并适应这种微妙的交流。\n\n通过引入精心校准的生化信号，我们与该生物体建立了初步的对话。从那时起，它开始通过其网络重新分配养分，并保护农作物免受有害微生物的侵害。很快我们便意识到，我们曾以为的入侵，已演变成与花园中另一种生命形式之间富有意义的共生关系。"
 arkship.1235.a: "出乎意料的共生关系。"
 fungal_contamination_chain_title: "$arkship.1215.name$"
 fungal_contamination_chain_desc: "最近的报告显示，一种入侵性真菌物种已在§Y方舟舰[Root.GetName]§!的整个水培舱室扩散。该真菌具有抗药性，难以遏制，正威胁着粮食生产。"
 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT: "$arkship.1215.name$"
 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT_DESC: "蔓延于§Y方舟舰[Root.GetName]§!水培舱室的入侵真菌物种已迅速适应了飞船的受控生态系统。若不加干预，其密集的菌丝网络恐将导致粮食产量大幅下降。"
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT: "建立通讯"
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT_DESC: "我们将尝试与遍布§Y方舟舰[Root.GetName]§!水培舱的入侵真菌物种进行沟通。如果不加以控制，其密集的菌丝网络将造成严重威胁并降低粮食产量。"
 #Unknown Resource Usage
 arkship.1240.name: "未知资源使用"
 arkship.1240.desc: "在我们的每月库存盘点中，我们发现§Y方舟舰[Root.GetName]§!资源系统中存在持续性的偏差。电力、消费品和其他物资的损耗量小幅超过了我们的记录使用量。专家们认为这可能是泄漏、故障，或者是数据上微小的误差。\n\n在进一步调查后，结果仍无定论。没有破口，没有故障，也没有超出可接受范围的低效。然而，数据依然如故。资源继续在毫无解释的情况下从系统中消失。方舟号上的某种东西正在消耗我们的资源。"
 arkship.1240.a: "调查。"
 arkship.1240.b: "没事，接着采。"
 arkship.1245.name: "造册之外的世代"
 arkship.1245.desc: "在方舟飞船一个无人监控的区域内，我们发现了一群生活在官方体制之外的年轻人。他们利用私自引流的电力、空气和食物，创造了自己的空间，并在不受监管的情况下进行实验、改造环境以及表达自我。\n\n研究表明，这是青少年发育过程中的自然现象。面对调查，他们表现得十分惊讶，并带有抵触情绪。他们声称只索取了少量的资源，且行事非常谨慎，足以避开即时检测。他们明确表示，无意放弃这片空间，并希望不被打扰。"
 arkship.1245.a: "拆除这个地方。"
 arkship.1245.b: "让他们充分表达自我。"
 arkship.1250.name: "古董处理器"
 arkship.1250.desc: "在一个被遗忘的维护区域，调查人员发现了一群仍在执行古老指令的过时劳工无人机。它们的日常运作似乎早于数次系统更新，导致它们在当前日志协议之外运行，且仅需极少资源即可维持运作。\n\n进一步检查揭示了它们持续活动的成果：大量精炼合金在多个周期中被细致地加工并储存起来。这些无人机一直在悄无声息地收集并优化资源，其规模已远远超出了当前的任何运作需求。"
 arkship.1250.a: "$arkship.1245.a$"
 arkship.1250.b: "随他们去，但是把资源带走。"
 arkship.1255.name: "疗养场所"
 arkship.1255.desc: "在方舟舰一个僻静的区域，我们发现了一个在官方系统之外运行的隐秘疗养所。被挪用的电力、消费品和水资源支撑着这个专为休养和恢复而设计的受控环境。\n\n在场的人对于被发现几乎没有表现出担忧，他们解释说，这个空间的意义在于脱离对产出和展示效率的持续关注，是从飞船日常生活中逃离的避风港。尽管方舟舰旨在满足所有需求，但仍有人在寻觅一个纯粹用于放松的地方。"
 arkship.1255.a: "$arkship.1245.a$"
 arkship.1255.b: "让他们安居吧。"
 arkship.1260.name: "未登记的集会"
 arkship.1260.desc: "在方舟舰一个僻静的区域，我们发现了一个未被记录的定期聚会社体。少量被挪用的资源被用于布置这些会议场所。\n\n成员们将这些会议描述为一种非正式的交流活动，核心是围绕方舟舰在收割作业期间收集的标本，例如从勘测星系中获取的矿物、矿石碎片和晶体结构。参与者们会检查并讨论他们的发现，比较成分并争论其起源。"
 arkship.1260.a: "$arkship.1245.a$"
 arkship.1260.b: "由这些艺术家去吧。"
 arkship.1265.name: "应急资源贮备"
 arkship.1265.desc: "在一个密封的储藏室内，我们发现了一处私藏的补给点：各种消费品、氧气罐和能量电池。所有物资都经过精心囤积，并避开了官方库存系统的记录。\n\n责任人很快被找到，他们给出的解释很简单：未雨绸缪。他们辩解称，在一个生存完全依赖于稳定性的系统中，如果理所当然地认为稳定性会永远持续下去，那才是真正的失职。从这批囤积物资的规模来看，这显然是远超个人用途的长期计划。方舟舰上并非所有人都有信心它能永存。"
 arkship.1265.a: "没收资源并取缔这场闹剧。"
 arkship.1265.b: "让他们去吧。"
 arkship.1270.name: "全部回收"
 arkship.1270.desc: "在一个封闭的处理区，调查人员发现了一个未登记的回收系统，该系统旨在将生物遗骸转化为可用材料。该系统一直在持续运行，远远超出了其预设的应急功能。\n\n尽管效率很高，但该过程耗资巨大。大量的能源、化学催化剂和加工材料被挪用，用于对有机物进行分解、消毒和提炼，将其转化为标准化产物，以便在方舟号内重复使用。方舟舰上的任何东西都不应被浪费。即便是死者。"
 arkship.1270.a: "拆除这个处理死者的地方。"
 arkship.1270.b: "资源丰富。随它们去吧。"
 arkship.1275.name: "超脱体制"
 arkship.1275.desc: "沿着资源流失的痕迹，我们发现了方舟舰上一处长期被忽视的区域。显然，那里生活着一个脱离官方系统、与世隔绝的小型社区。他们的居所十分简陋，依靠窃取资源维持生存，但由于窃取的量极小，一直未被察觉。\n\n尽管处境艰辛，那里的环境却很稳定，维护得十分用心，并针对他们的需求进行了改造。显而易见，这是一种深思熟虑的生活方式。他们没有做出任何反抗，反而请求解释他们的选择。"
 arkship.1275.a: "听听他们要说什么。"
 arkship.1275.b: "从方舟中驱散。"
 arkship.1275.c: "我们不能容许这种事，净化他们。"
 arkship.1280.name: "生活的其它之道"
 arkship.1280.desc: "那群与世隔绝的人公开谈论了他们的决定。他们并非拒绝方舟舰，而是无法接受其中演变出的生活方式。在他们看来，生存已经变得过度优化：每一项行动都被衡量，每一份资源都被追踪，每一刻时光都被精算。\n\n他们描述了一种对方舟舰体制的不同见解。他们看重在不受持续监管的情况下做出选择的自由。他们声称，自己的生活方式虽然效率较低，但更加充实。我们的领导层中，有些人现在开始质疑，这类群体的存在究竟是对凝聚力的威胁，还是封闭系统中个性表达的必要体现。"
 arkship.1280.a: "强迫他们重新融入社会。"
 arkship.1280.b: "这艘方舟舰上没有你的一席之地。"
 arkship.1280.c: "随他们去，但我们会盯着他们。"
