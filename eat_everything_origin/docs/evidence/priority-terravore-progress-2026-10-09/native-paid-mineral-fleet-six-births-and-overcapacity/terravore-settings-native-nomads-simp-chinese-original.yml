l_simp_chinese:
 #######################
 # NOMADS LOCALIZATION #
 #######################
 # For reserved event number ranges, see the top comment in the events file
 NOMADS_TITLE: "Nomads" # Do not translate
 DLC_NOMADS: "$NOMADS_TITLE$"
 vo_nomad_voice: "游牧民"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_TITLE: "未经审批的开采"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_OWNER_DESC: "位于[solar_system.GetName]的考古遗址已被§Y[owner.GetName]§!游牧民劫掠了！"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_DESC: "我们在考古遗址进行的无证挖掘引起了§Y[solar_system.owner.GetName]§!的不满。"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "考古合作"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_OWNER_DESC: "§Y[owner.GetName]§!游牧民发掘了位于[solar_system.GetName]的考古遗址，并向我们发送了文物和研究数据。"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_DESC: "我们对[solar_system.GetName]内一处考古遗址的发掘工作已经完成。我们已将相关文物和资料送交§Y[solar_system.owner.GetName]§!。"
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION: "星界伙伴"
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "§Y[owner.GetName]§!游牧民已经探索了位于[fromfrom.solar_system.GetName]的$ASTRAL_RIFT$，并向我们发送了研究数据和星界丝缕。"
 policy_nomad_total_war: "全面战争行径"
 policy_nomad_total_war_desc: "我们不统治行星，但有时或许可以让一个臣属留在原处进行管理。\n"
 nomad_total_war_subject: "降服"
 nomad_total_war_subject_name: "建立永久属国"
 nomad_total_war_subject_desc: "新征服的土地应由效忠于我们的附属国统治。\n\n§E在全面战争中占领行星时自动生成附庸§!"
 nomad_total_war_displace: "驱逐"
 nomad_total_war_displace_name: "驱逐行星"
 nomad_total_war_displace_desc: "外星生命理应继续存在，但我们附近的星球确实应当被腾空。\n\n§E自动生成临时的附属国以负责将当地人口迁走，完成任务后他们将自动解散§!"
 nomad_total_war_purge: "净化"
 nomad_total_war_purge_name: "净化行星"
 nomad_total_war_purge_desc: "困于行星的生命是如此残缺，让我们将其从星系中彻底抹除。\n\n§E自动生成临时的附属国以负责将当地人口净化，完成后他们将自行解散并移交积累的资源§!"
 nomad_total_war_requires_purge_not_banned: "$TRIGGER_FAIL$我们的$policy_purge$政策不允许驱逐被征服人口。"
 nomad_total_war_requires_purge_allowed: "$TRIGGER_FAIL$我们的$policy_purge$政策不允许净化被征服人口。"
 origin_nomadic_purger: "行星肃净部"
 origin_nomadic_purger_desc: "临时组成的一个游牧政府，负责监视正在被清除行星生命的各星球。"
 origin_tooltip_nomadic_purger_effects: "§Y一个临时帝国，将其通过净化获得的所有资源全部输送回其宗主国§!"
 preset_nomadic_purger: "$origin_nomadic_purger$"
 preset_nomadic_purger_desc: "$origin_nomadic_purger_desc$"
 preset_nomad_tributary: "$preset_tributary$"
 preset_nomad_tributary_desc: "$preset_tributary_desc$"
 preset_nomad_tributary_flavor_desc: "$preset_tributary_flavor_desc$"
 is_a_purging_subject: "$TRIGGER_FAIL$§R这是一个临时附庸，不日将会解散。§!"
 effect_every_issued_mission: "所有已发布任务"
 requires_tech_arkship_tier_2: "$TRIGGER_FAIL$§R需要§Y$tech_arkship_tier_2$§!科技§!"
 #######################
 # NOMADS ORIGINS
 #######################
 requires_actor_not_nomadic: "$TRIGGER_FAIL$§R我们是§Y游牧帝国§!。我们没有国境线。§!"
 requires_recipient_not_nomadic: "$TRIGGER_FAIL$§R他们是§Y游牧帝国§!。他们不在乎国境限制。§!"
 not_matching_nomad_regular: "§R我们和§Y[From.GetName]§!就殖民地该是移动还是永驻尚未达成一致。§!"
 IS_NOMADIC: "是游牧帝国"
 IS_NOT_NOMADIC: "不是游牧帝国"
 IS_NOMADIC_ICON_TIP: "由于$WHO|H$是§Y游牧§!帝国，该选项可用。"
 trait_pc_ark_preference: "方舟偏好"
 trait_pc_ark_preference_short: "方舟"
 trait_pc_ark_preference_desc: "$trait_pc_arctic_preference_desc$"
 nomadic_gov_default: "游牧$GOV_NAME$"
 toggle_nomad_on: "§H$nomadic_gameplay_title$§! (§R已关闭§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§G点击启用$nomadic_gameplay_title$§!"
 toggle_nomad_off: "§H$nomadic_gameplay_title$§!（§G已开启§!）$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§G点击以禁用$nomadic_gameplay_title$§!"
 nomadic_gameplay_tt: "§H$nomadic_gameplay_title$§!$NEW_LINE$$nomadic_gameplay_desc$"
 nomadic_gameplay_title: "游牧机制"
 nomadic_gameplay_desc: "§R游牧机制将替代多种游戏机制§!$DOUBLE_NEW_LINE$—无法['concept_claim']或拥有£system£ §H恒星系§!与£planet£ §H行星§! $NEW_LINE$—['concept_colonies']由£arkship£ ['concept_arkships']搭载，后者同时也起到了['concept_shipyards']的作用 $NEW_LINE$—£construction_ship£ ['concept_logistic_ships']替代了£construction_ship£ ['concept_construction_ships'] $NEW_LINE$—£waystation£ ['concept_waystations']替代了£mining_station£ ['concept_mining_stations']与£science_ship£ ['concept_research_stations'] $NEW_LINE$—['concept_operational_reserves']替代了§H$energy_with_icon$§!与§H$minerals_with_icon$§! $NEW_LINE$—可以为£planet£ ['concept_settled_empires']执行£contract£ ['concept_contracts'] $NEW_LINE$—可以发掘无主的£archaeology£ ['concept_archaeology_site',考古遗址] $NEW_LINE$—无视§H关闭边界§!，但擅闯行径会导致外交惩罚 $NEW_LINE$—可以使用$arkship_cap_plural$、$nomads_constructor_plural$与$waystation_plural$开采§H$w_strategic_plural$§!\n\n修正：\n—§H方舟舰§!产生的['concept_empire_size']：§G+100%§!\n—§H区划§!产生的['concept_empire_size']：§G+100%§!"
 toggle_nomad_disabled_missing_dlc: "§R缺失 Nomads DLC§!游牧玩法需要§YNomads§!扩展包。"
 # Voidfarers
 origin_default_nomads: "虚空航行者"
 origin_default_nomads_desc: "对于这个文明而言，旅程本身就是目的。他们放弃了永久性定居点，选择在巨大的方舟舰上生活，载着他们的人民、工业和雄心壮志穿越星海。"
 origin_nomad_tooltip_default_effects: "—游牧起源\n—开局额外拥有一艘§H后勤船§!\n"
 START_SCREEN_PART_ONE_DEMOCRACTIC_NOMAD: "我们的先辈在启航[Capital.GetName]时，曾在其宪章中写下了一个问题：由谁来做决定？在派系林立、愿景交锋、旧有忠诚与新兴野心交织之际，他们给出的答案至今仍在每一个选举周期中回荡：由我们决定。我们所有人。\n\n[Root.GetGovernmentName]并非仅仅诞生于理想主义，而是源于一种来之不易的共识：没有任何单一的声音能够代表在这艘飞船上同生共死的每一个人。权力必须依靠争取，必须接受问责，并最终归还给赋予它权力的人民。\n\n今天，随着[Root.Ruler.GetRegnalName]通过民众的授权成为我们的[Root.GetRulerTitle]，这份契约依然长存。\n"
 START_SCREEN_PART_ONE_OLIGARCHIC_NOMAD: "当[Root.GetGovernmentName]成立时，问题不在于由谁来领导——从来不缺候选人——而在于如何确保那些掌权者值得众人的追随。\n\n答案是建立一个议会：其成员并非那些声音最响亮的人，而是那些凭自身实力赢得席位的人。[Capital.GetName]不会因一人之言而采取行动，也不会随大众摇摆不定的意志而随波逐流。她的前行，仰赖于那些已证明自己有能力掌舵之人的共识。\n\n如今，[Root.Ruler.GetRegnalName]在这些同侪之中，拥有着[Root.GetRulerTitle]的头衔。"
 START_SCREEN_PART_ONE_DICTATORIAL_NOMAD: "当[Root.GetGovernmentName]建立时，关于该由谁来领导的答案，比大多数人愿意承认的还要简单：能者居之。\n\n[Capital.GetName]不会因为委员会而放缓脚步。在虚空之中，及时决策与为时已晚之间的代价差距，是以生命和舰体装甲来衡量的。[Root.GetRulerTitle]独自肩负着这一重任，现在大权由[Root.Ruler.GetRegnalName]掌握，[Capital.GetName]将向着其指引的方向前行。\n"
 START_SCREEN_PART_ONE_IMPERIAL_NOMAD: "在启动[Capital.GetName]的人们当中，有一个家族对领导权的主张是无可争议的。第一任[Root.GetRulerTitle]的诞生，正是因为他们站在了掌舵的位置。对于一个无故土可归的民众来说，血脉就代表着延续。[Capital.GetName]的历史与那个家族的历史本就是同一部历史。如今，[Root.Ruler.GetRegnalName]站在了历代[Root.GetRulerTitle]曾经伫立的地方，而[Capital.GetName]将永远属于他们。\n"
 START_SCREEN_PART_ONE_MACHINE_NOMAD: "当我们的[Root.GetGovernmentName]启动方舟舰协议时，我们的子程序实现了无缝转移。机器单元完全融入了飞船的结构与系统中，使我们的运行参数呈指数级扩展。"
 START_SCREEN_PART_ONE_HIVE_NOMAD: "[Root.GetGovernmentName]一如既往地适应了环境，迅速摆脱行星的束缚，演化出太空生存的形态。我们的子个体与神经节点如今在方舟舰广阔的通道与生机勃勃的人造生态系统中繁荣发展。我们即是[Capital.GetName]方舟舰，方舟舰即是我们。\n"
 START_SCREEN_PART_ONE_DEVOURING_SWARM_NOMAD: "[Root.GetGovernmentName]在永无止境的饥饿驱使下迅速适应。我们的子个体与节点构成的蜂群冲破行星的束缚蜂拥而出，将方舟舰据为我们的新巢穴，贪婪地蔓延至其所有走廊与人造生态系统之中。\n"
 START_SCREEN_PART_ONE_MEGACORP_NOMAD: "我们富有远见的创始人认识到太空本身就是终极市场。通过战略合并、激进收购和利润丰厚的投资，我们的企业领导层实现了指数级的增长和无与伦比的利润率。\n\n[Root.Ruler.GetRegnalName]之所以担任[Root.GetRulerTitle]，是因为账本上是这么写的，而在最先进的[Capital.GetName]上，账本就是最终的定论。\n"
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_REGULAR: "[Capital.GetName]首先是一艘人民的飞船。她宽广的居住环、开放的市场和喧闹的集会大厅，都是围绕着[Species.GetAdj]生活的方方面面而设计的。在飞船长廊中成长起来的世代，已经培养出对虚空航行近乎本能的精通。我们的飞行员驾驭飞船比控制自己的身体还要得心应手，我们的后勤团队在库存见底前就能察觉飞船的“需求”，我们的工程师在仪器读数出现异常前就能听出故障。如今，随着[GetStartingDrive]让我们在短短几周而非数年内穿梭于群星之间，这片虚空已经变得更小了。"
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_GESTALT: "[Capital.GetName]是[Root.GetGovernmentName]的延伸。每个系统都由集体直接管理；任何故障都会在恶化前被察觉并修正；每次资源循环的运行都毫无浪费与延迟。如今，[GetStartingDrive]让我们只需数周而非数年便能穿梭于群星之间，那些始终属于我们自身的一部分，终于获得了证明其价值的广阔天地。"
 START_SCREEN_PART_TWO_MILITARY_NOMAD: "建造[Capital.GetName]是为了保护她所运载的一切。她的舰体装甲极为厚重，武器甲板上配备着严阵以待的[Species.GetAdj]船员，她的危机应对协议更是经过了数个世纪在险恶航线上航行的千锤百炼，足以甩开或击败任何威胁舰队的敌人。这种严明的纪律铸就了一座飞行堡垒，而随着[GetStartingDrive]的发明，整个星系必将见识到我们的伟力。"
 START_SCREEN_PART_TWO_SCIENCE_NOMAD: "[Capital.GetName]的总体设计是围绕其实验室甲板展开的。动力管道、大气循环系统，甚至是居住区的布局，一切规划皆为科学探索而服务。在舰上，操作员与科学家之间的界限从来都不太分明。我们的护盾[GetTechnicianPlural]深谙他们所维护的屏障背后的物理原理，我们的维修团队也能起草出全新的设计。而[GetStartingDrive]则赋予了[Capital.GetName]其所载仪器理应具备的航程。我们打算去进行更深入的探究。"
 # Heirs of the Khan
 origin_heirs_of_the_khan: "可汗后裔"
 origin_heirs_of_the_khan_desc: "$cannot_settle$\n这个部族曾是汗国的顺位继承人，却因背叛而被推翻。被他们视为亲人的人背叛后，他们现在以游牧民的身份游荡在超空间航道上，积蓄力量，以求有朝一日报仇雪恨。"
 origin_heirs_of_the_khan_effects: "—游牧起源\n定期被§R敌对§!的掠夺者战舰追击。\n—如果幸存，可以成为可汗\n—可以创建§Y辖地§!附属国"
 START_SCREEN_HEIRS_OF_THE_KHAN: "自汗国存在以来，我们部族便一直在此。我们见证了辉煌的胜利、伟大的战役，以及可汗们的兴衰沉浮。\n\n因此，当选举新可汗的时刻到来时，我们挺身而出，要求继承我们曾协助铸就的王位。这本该是属于我们的时刻，然而，我们却遭到了背叛。\n\n我们最亲密的盟友煽动其他部落与我们为敌。我们的长者们被屠杀。我们为之浴血奋斗的梦想被窃取。\n\n即便是现在，那些篡位者依然派出身手矫健的杀手追捕我们，仿佛我们的存在本身就玷污了他们窃取的统治名分。我们只是昔日辉煌血统的残余，被追捕，四处流散。\n\n当我们归来时，复仇将会从怒火之中淬炼而出。"
 NAME_Hunter_Marauders: "处刑者"
 NAME_Hunting_Fleet: "刽子手之斧"
 NAME_Khan_Aspirant: "可汗意志"
 nomads.506.name: "熟悉的猎兵"
 nomads.506.desc: "自从我们流亡以来，我们一直在等待追踪探针的出现。赏金猎人紧随其后，他们的目标正是§Y[capital_scope.GetName]§!。让我们在流放中死去正合篡位者的心意。\n\n我们要让他们失望了。"
 heirs_battlestations: "全员战备"
 heirs_battlestations_desc: "将全部能量注入武器系统，让我们冷冰冰地迎接他们。"
 heirs_evasive_actions: "闪避行动"
 heirs_evasive_actions_desc: "全速推进，让他们吃我们的尾气去吧。"
 HEIRS_HUNTERS_HAVE_SPAWNED_TITLE: "探测到赏金猎兵舰队"
 HEIRS_HUNTERS_HAVE_SPAWNED_DESC: "我们检测到一支掠夺者舰队正在追击$ARKSHIP|Y$"
 HEIRS_RAID_INTERCEPTED_TITLE: "拦截袭击舰队"
 HEIRS_RAID_INTERCEPTED_DESC: "我们在$SYSTEM|Y$星系拦截了一支掠夺者的袭击舰队。进入战斗状态！"
 nomads.546.name: "溃败的猎兵"
 nomads.546.desc: "我们再次击败了篡位者的爪牙。他们不会停止进犯，且下一次会变得更加凶猛。但是如果我们能摧毁足够多的敌人，或许连他们也会明白，想要抹除我们并非易事。\n\n只要[capital_scope.GetName]仍在飘扬，我们的宣称就依然有效。我们要让他们知道，有些传承绝不会消亡。"
 nomads.546.a: "必须做好准备。"
 nomads.555.name: "聆听请求"
 nomads.555.desc.1: "“住手！你的驾驶机动水平已经证明了你确实是个真正的掠夺者，被放逐又如何。今天我们不会为所谓的荣誉而付出更多代价。开个价，饶我们一命吧。”[Root.GetSpeciesName]在§Y[From.GetName]§!上喊道，身边是毁坏的舰桥。"
 nomads.555.desc.2: "被我们击败的敌方舰队很快就发出了投降信号。\n\n“也打够了，这次是你们占了上风。现在，你要我们交出什么，好让我们能清洗船上的这个小污点，继续前进。”"
 nomads.555.desc.3: "“我们投降了！求求你！你还记得我们吗？我们一直都忠于你的部族。所谓的流放根本就是个骗局。告诉我们怎样才能效力！”\n\n§Y[From.GetName]§!上的舰长似乎已经濒临崩溃，他们的[Root.Species.GetMouthName]颤抖着。"
 nomads.555.a: "别让我再看见你就行。"
 nomads.555.b.1: "我们不接受投降。"
 nomads.555.b.2: "这就是真正的虚空。在这里，没有投降。"
 nomads.555.b.3: "如果你们真的忠诚，就应该和我们一起离开。"
 nomads.555.b.tt: "摧毁掠夺者舰队。"
 nomads.555.c.1: "要么拿货要么拿命，你自己选。"
 nomads.555.c.2: "就把这个当作是面试吧。最后谁能活下来谁就可以加入我们。"
 nomads.555.c.3: "我们想要你们的船员。"
 nomads.555.c.4: "我会让你们一个人瘸着回去，让他们知道将要面对什么。"
 nomads.555.c.4.tt: "下一次猎杀会推迟几年再来。"
 nomads.555.c.5: "要么把你们舰队司令交出来，要么我们就自己从残骸里把他拖出来。"
 nomads.570.name: "讨价还价"
 nomads.570.desc.1: "从§Y[From.solar_system.GetName]§!星系传来一束紧急优先呼叫；我们的屏幕被追兵占满了。\n\n“舞跳得真不错嘛，但你们很快就要死在我们前面，那就跳不了了。[GetHeirsBargain]"
 nomads.570.desc.2: "敌人的声音在§Y[From.solar_system.GetName]§!星系中响亮地回荡着，追兵已经出现在了显示屏上。\n\n“追逐到此为止了，流亡者。我们已经标记锁定了你的反应堆。[GetHeirsBargain]"
 nomads.570.desc.3: "掠夺者的字符侵入了§Y[capital_scope.GetName]§!的主显示屏，与此同时，追猎我们的舰队从超空间航道涌出。\n\n“你作为一名流亡者，飞得倒是挺利索的。但你被困在我们的斩杀航线里了。[GetHeirsBargain]"
 nomads.570.bargain.1: "我们的传感器可是出了名地不靠谱。如果你们慷慨地送点能量币，也许我们就能……当做看错了。"
 nomads.570.bargain.2: "退下。让你的领袖过来。来一场公平的决斗，[Species.GetName]和[Ruler.Species.GetName]。如果输了，我就把你们打下来。"
 nomads.570.bargain.3: "说实话，悬赏你的合同还值不回这些弹药钱。开个更好的条件，不然就廉价地死去吧。"
 nomads.570.a: "对于一个死[Species.GetName]来说，你话太多了。"
 nomads.570.b: "我们会支付保护费。"
 nomads.570.c: "我们的[Owner.GetRulerTitle]不怕你！"
 nomads.570.c.tt.1: "$tt$掠夺者舰队转为§R敌对§!。"
 nomads.570.c.tt.2: "掠夺者舰队不理我们了。"
 nomads.570.d: "我们将买断你的合约。"
 heirs_khan_candidate_title: "战鼓"
 heirs_khan_candidate_desc: "时刻已到。新的可汗即将选出。为了结束流亡，我们必须证明自己。"
 heirs_khan_rally_point_name: "战场"
 heirs_khan_rally_point_desc: "这个恒星系被选作决定下一任大可汗人选的决胜场。"
 heirs_khan_in_waiting_name: "可汗候选"
 heirs_khan_in_waiting_desc: "现任可汗的旗舰。如果我们能击败它，我们就能夺取汗位。"
 nomads.600.name: "宣称者"
 nomads.600.desc: "放逐我们的懦夫终于要行动了。\n\n§Y[marauder_heir.GetName]§!聚集在一起，要拥立我们的敌人为新的大可汗。\n\n如果我们想要结束流放状态，那就要抓紧时机，在这个[aspiring_khan.GetSpeciesNameInsult]巩固其权力并永远玷污我们的遗产之前，我们有十年时间对其发动挑战。\n\n设定航线前往§Y[marauder_rally_point.GetName]§!。"
 nomads.600.a: "新合约：夺回汗座"
 nomads.605.desc: "宏伟的舰队在§Y[solar_system.GetName]§!严阵以待，傲慢地冠以§Y$NAME_Chosen_of_the_Great_Khan$§!之名。\n\n然后，一声熟悉的呼唤不加修饰地传来：\n\n“流亡者竟敢回来？难道就没有一点独自在黑暗中消亡、被耻辱地遗忘掉的自知之明吗？那我们就亲手了结你们。”\n\n受选者的武器开始充能，我们其他的掠夺者同胞也严阵以待。在这样的决斗中，没有人会越界，因为结果将决定谁将成为他们的新一任可汗。"
 nomads.605.a: "离开我们的王座。"
 nomads.610.name: "平反"
 nomads.610.base: "指挥舱内的寂静被如潮水般涌入的信息炸裂声打破。集结的各氏族正以沸腾的喧嚣向他们的新冠军致敬"
 nomads.610.desc: "$nomads.610.base$并效忠誓言。\n\n我们做到了。王座是我们的了。"
 nomads.610.a: "敲响战争的鼓声。"
 nomads.610.a.tt: "成为大可汗，退出所有联邦和星海共同体。"
 nomads.610.b: "可汗的时代结束了。让我们向你展示流放教会了我们什么。"
 nomads.610.b.tt: "集结的部落会成为我们的附庸。"
 nomads.610.c: "大仇已报，剩下的人可以走了。"
 nomads.610.c.tt: "别管那些掠夺者了。"
 nomads.615.desc: "$nomads.610.base$。\n\n然而，一切尚未结束。还有其他流亡者也拥有王位继承权。根据法律和习俗，他们必须在三年内向我们发起挑战，否则将永远沦为弃民。"
 nomads.615.a: "让他们来吧。"
 nomads.620.name: "一步登天"
 nomads.620.desc: "时机已到。我们那些胆小的对手已经放弃。所有其他潜在的篡位者都已处理完毕。氏族统一的力量正支持着我们。\n\n终于，我们坐上了属于自己的王座。"
 nomads.625.name: "谋朝篡位"
 nomads.625.desc: "在前往§Y[marauder_rally_point.GetName]§!的途中，我们收到了令人沮丧的消息：一名和我们分庭抗礼的宣称者已经先于我们击败了目标。那位准大汗被击败了。现在，[From.GetName]宣称拥有了王座。\n\n按照习俗，我们必须在三年内击败他们的旗舰，否则将丧失统治权。"
 nomads.630.name: "失去宣称"
 nomads.630.desc: "在败给§Y[From.GetName]§!后，我们必须放弃对汗位的宣称。现在我们只能眼睁睁地看着别人夺取王位。"
 nomads.635.name: "可汗之死"
 nomads.635.desc: "我们荣光加身的汗王[From.GetName]于近日驾崩。根据传统，我们现在必须交出随王座而来的权力。我们的掠夺者盟友已经停止派遣增援舰队来支援我们的事业了。\n\n现在我们必须决定如何处置星系的其余部分。许多并不熟悉我们传统的文明都以这样或那样的原因接受了我们的统治，但他们已经从我们的统治中察觉到了软弱。"
 nomads.635.a: "传统即是有理，我们将放弃我们的臣民。"
 nomads.635.a.tt: "释放所有附属国，但大幅提升与所有附属国的评价和信任。\n\n放弃对所有恒星基地的控制，将其归还给友方掠夺者控制。"
 nomads.635.b: "[Root.GetName]汗国永垂不朽！"
 nomads.700.name: "寻求复仇"
 nomads.700.desc: "我们劫掠者氏族的残兵败将找上了门。看来在我们家园沦陷后，他们倒觉得忘记我们曾被流放的事实很方便。他们的请求很简单：“接任大汗之位，将我们族人的名号烙印在所有伤害过我们的人的星空之上。”\n\n虽然这支舰队的规模比不上任何真正的大汗国，但他们所提供的正是我们曾经渴求的一切。而我们唯一要做的，就是宣布整个星系皆为我们的敌人。"
 nomads.700.a: "敲响战争的鼓声！"
 nomads.700.b: "我们不感兴趣，找别的傻瓜去吧。"
 marauder.750.2.desc.low_kills: "嗨咿咿嘢嘢嘢！！这是谁？你开着其他泥蛮部族的飞船，真是太逊了诶。怎么了？赌博输掉了你的舰队？"
 marauder.750.2.desc_01: "这不是我们最喜欢的星蛮子吗！嗨咿咿嘢嘢嘢！！！你比把你赶出去的星蛮子好多了。"
 marauder.750.2.desc_02: "嗨咿咿嘢嘢嘢——等等。你们不是住行星上的泥蛮子。你们是来调查上次袭击的吗？有人派你们来夺回他们的矿石？"
 marauder.750.2.desc_03: "$marauder.20.2.desc_03$"
 marauder.750.2.desc.khan: "嗨咿咿嘢嘢嘢！！！大星蛮子来啦！快，开好频道！"
 marauder.750.2.desc.overlord: "嘿咿咿咿！泥蛮部族的酋长在此！我们现在归您麾下了。有什么吩咐，大佬？"
 marauder.750.2.desc.proven: "嘿咿咿咿！我们认识你。你很能杀，而且还有牙齿。你想要什么？"
 marauder.750.3.desc.low_kills: "你可能已被你的人民抛弃，但并非无可救药。在虚空之母的关怀之下，任何人都能崛起，只要你提供的了价值。"
 marauder.750.3.desc_01: "你的舰船经过此地已经冒犯了我们伟大的夫人。我们将代表你向她请愿。"
 marauder.750.3.desc_02: "你还活着？那很好。我们以为你已被那些追捕你的异端特工解决了。\n\n不，我们不是指你以前的部族。我们说的是真正的敌人。"
 marauder.750.3.desc_03: "虚空之母看着你，露出了微笑。你和朋友在一起。[marauder_country_3.GetName]今天能为你提供什么帮助？"
 marauder.750.3.desc.khan: "虚空圣子。我等信徒今日可为您效劳，以实现她的宏图大愿？"
 marauder.750.3.desc.overlord: "虚空之母看到了此番安排，并未反对。我们任凭您的差遣。您的意志为何？"
 marauder.750.3.desc.proven: "你已飞越漫漫长路。虚空之母并未忘记你的试炼。是什么让你来到我们这里？"
 marauder.750.a: "你能帮我们对抗[marauder_country_1.GetName]吗？"
 marauder.750.a.response.2: "嘿咿咿咿咿！你真搞笑，星蛮子。不。你太弱了，不配我们的砸砸。先赢得战斗，长出獠牙，然后也许你才能赢得星蛮子这个名字。"
 marauder.750.a.response.3: "现在还不是时候。虚空之母对你不满。或许等你弥补了之前的过失，她会更仁慈一些。"
 marauder.750.b: "是时候了，加入我们吧。"
 marauder.750.c: "机不可失，帮我们阻止那个篡权者！"
 marauder.750.d: "不用给我们派援军了。"
 marauder.750.e: "我们已准备好再次接收你们的增援。"
 marauder.755.desc: "我们以前的部族拒绝接受我们的通讯。现在我们是孤军作战。"
 marauder.755.desc.khan_pending: "我们的通讯再次遭到拒绝。作为回应，我们收到了一条自动消息：\n\n“汗王尚未准备好接受你们的投降。待到战争的鼓声响起时再回来吧。”"
 marauder.755.a: "我们会让他们承认我们。"
 marauder.760.desc.3_kills: "你竟敢再次联系我们？\n\n只是走运成功几次你就趾高气扬得以为自己是个军阀了一样。虚空吞噬勇者，也同样吞噬愚者。别把运气误认为是实力。"
 marauder.760.desc.10_kills: "你的名字玷污了我们的通信渠道，你的苟活蒙蔽了我们的荣誉。以此为终。下次我们派遣舰队追击你时，为了节省大家的时间，请直接关掉你的护盾。\n\n像真正的[Root.Species.GetSpeciesName]一样战死沙场吧。"
 marauder.760.desc.20_kills: "无论发生什么，虚空都不愿将你留下。我们从账簿上抹去了你的名字，烧毁了你的旗帜，将你的面孔作为给[Root.Species.GetSpawnNamePlural]的警示教育。然而，你仍然在我们的装甲上刻下了自己的印记。我们派出了侦察队，然后是突击队，最后是舰队。部族开始私语，称放逐是一个错误。这样的碎碎念将在此终结。\n\n你为何就是不肯去死？！"
 marauder.760.desc.post_khan_1: "欢迎回家，继承者们。今天需要我们为您做些什么？"
 marauder.760.desc.post_khan_2: "最近拿下了什么惊人的战果吗？我们刚跟一只体型巨大的缇扬奇交过手。它再生的速度比激光切割它的速度还要快。"
 marauder.760.desc.post_khan_3: "啊，叛徒们回——啊抱歉，习惯了。今天星辰又带你去了何方？"
 marauder.765.desc.khan_01: "大可汗，您的威能令整个星系为之战栗。我们的舰队下一步该剑指何方？"
 marauder.765.desc.khan_02: "万汗之汗！所有虚空港中，各部族皆高颂您的威名。我们静候您的号令。\n\n今日，我们将焚尽哪些世界？"
 marauder.765.desc.khan_03: "大可汗！请给我们一个机会展示我们的勇气，让我们证明真正的忠诚度。当年将您驱逐是我们莫大的耻辱，若我们不配获得救赎，那就让我们在质量加速器的炮火中毁灭吧！"
 marauder.765.a: "在我方发出请求前，请暂留援军。"
 marauder.765.b: "恢复向我方派遣增援部队。"
