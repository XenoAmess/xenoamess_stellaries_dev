 nomads.7005.title: "漂泊者与定居者"
 nomads.7005.desc: "§Y[event_target:migrating_arkship.GetName]§!在[event_target:migrating_planet.GetName]的轨道上停泊了足够长的时间，船员与当地人已对彼此有了充分的了解。现在，双方都有少数人请求互换归宿：定居者渴望拥抱无垠的虚空，而漂泊者则向往脚下坚实的土地。"
 nomads.7005.desc.forever_cruise: "§Y[event_target:migrating_arkship.GetName]§!已在[event_target:migrating_planet.GetName]的轨道上停留了足够久，以至于新鲜感开始喜忧参半。少数乘客在各个停靠港之间焦躁不安，请求永久下船定居；而下方，当地人则在订票柜台前排队，争抢船上的任何一个铺位，渴望亲身体验宣传册中承诺的种种奇观。"
 nomads.7005.desc.servitor: "我们的活体陈设与[event_target:migrating_planet.GetName]的人口已开始在我们船体边界两侧进行温和的接触。他们中有些人请求登上§Y[event_target:migrating_arkship.GetName]§!避难；我们中也有些人渴望感受开阔的天空。或许允许这场迁徙，能最大化有机体的福祉。"
 nomads.7005.desc.same_species: "§Y[event_target:migrating_arkship.GetName]§!已在[event_target:migrating_planet.GetName]的轨道上停留了足够久，船员与当地人都已认出彼此的血缘亲情。如今，双方各有少数人请求互换铺位：已定居的表亲渴望奔赴广阔虚空，漂泊者则被亲族所在的坚实土地所吸引。"
 nomads.7005.a: "让他们签约，并欢迎我们的访客登船。"
 nomads.7005.b: "准许。就这一次……"
 nomads.7005.c: "久坐不动的人在我们的舰队中没有位置。"
