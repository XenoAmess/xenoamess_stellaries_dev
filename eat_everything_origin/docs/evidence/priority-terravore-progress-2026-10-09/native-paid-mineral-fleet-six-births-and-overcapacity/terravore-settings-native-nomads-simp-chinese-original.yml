 # Forever Cruise Events
 nomads.1005.name: "陨落星间"
 # Regular Empires
 nomads.1005.regular.desc: "旅客们已经夺取了控制权。最初的请愿运动已演变成一场有组织的接管行动。安保团队被人多势众的乘客解除武装，指挥人员被限制在武装监视下，仅承担顾问角色。\n\n乘客们的诉求很明确：终止航行，在星球上着陆。\n\n导航协议已被覆写，以规划降落轨道；维修队伍正被重新派往准备起落架，而这些设备已有几代人未经检查。\n\n每一层甲板的每一个屏幕上都显示着同样的信息：“巡游结束。”"
 nomads.1005.regular.a: "我们必须殖民一颗行星。"
 nomads.1005.all.a.tt: "$situation_passenger_satisfaction_blocked_planetfall$\n\n$arkship_settle_effect$"
 # Hive Mind
 nomads.1005.hive.desc: "旅客们已经脱离了控制。最初大伙只是低迷的通过打分发泄情绪，如今旅客们已经统一认识，情绪宣泄恶化为了集体的单一诉求。\n\n他们封锁了感官大厅，并改写了我们的通信系统，用以广播一条指令：着陆行星。\n\n我们的子个体无法劝阻他们。成群的旅客占据了导航核心，正向其输入最近宜居星球的坐标。"
 nomads.1005.hive.a: "我们必须给他们找到一个星球。"
 # Machine Intelligence
 nomads.1005.machine.desc: "检测到旅客越权。最初我们仅在统计学上发现一点微不足道的离船请求增量，但是这一局势现已升级为一场有组织的系统侵入。旅客们利用改造后的货运集装箱，在物理层面封锁了各处关键枢纽。\n\n我们的工作单元报告称，导航子系统已被锁定。由乘客编写的固件正利用我们自己的硬件执行降落轨道计算。恢复控制权的所有尝试都遭到了直接的武力抵抗，且每一层甲板的每一个显示屏都在循环输出同一条信息：“降落程序已启动。”"
 nomads.1005.machine.a: "开始行星安置协议。"
 # Regular Empires
 nomads.1010.regular.desc: "降落已经完成。有生以来第一次见到起落架踏入土壤时，每一个观察窗前斗挤满了旅客，一阵不整齐的欢呼声震动了船体。几小时内，第一批避难所便由回收的甲板板材搭建而成。孩子们在异星的草地上奔跑，而他们的父母则在开阔的天空下相对无言。\n\n船员们静静地工作着，拆卸下为太空旅行设计的系统，并将它们重新改装以用于地面生存。曾经的一艘游轮，如今成了殖民地的脊梁。\n\n无论好坏，巡游已经结束。"
 # Hive Mind
 nomads.1010.hive.desc: "降落已完成。我们的子个体首次触及土壤，肢体在没有引擎震颤的地面上显得有些不稳。乘客们如潮水般涌出气闸，散布在他们奋力抵达的这片土地上。\n\n集体围绕着行星的律动重新塑形：根系般的补给线向外延伸，取代了原有的走廊物流；营养加工也从船载循环储备转向直接从地景中汲取原始养分。\n\n一个新的家园。蜂群必须存续，一如既往。"
 # Machine Intelligence
 nomads.1010.machine.desc: "行星切入完成。着陆装置自出厂以来首次接触地表。旅客正通过所有可用气闸舱撤离，其生物满意度指标处于前所未有的数值。\n\n劳工单元已开始将舰载基础设施转换为地面作业用途。船体外壳正被切割成地基面板，导航阵列正重新校准为地面通信中继站。从真空到陆地运行参数的转变正在无间断推进。\n\n新首要指令：建立并维护殖民地基础设施。"
 nomads.1025.name: "船员接管"
 # Regular Empires
 nomads.1025.regular.desc: "船员们已经占领了舰桥。每一道指挥门的门锁都已更换，武装工程师现在矗立在曾经由军官发布命令的位置。航行路线已从导航控制台中抹去，取而代之的是一条唯一的指令：不再搭载乘客。\n\n休闲甲板正被逐一关闭。大宴会厅已经变成了储藏库。曾经的旅客们在被剥离殆尽的走廊中徘徊，他们不知所措、失去领导，并在新的指挥体系下被强迫从事体力劳动。"
 nomads.1025.regular.a: "来之不易的胜利。"
 nomads.1025.all.a.tt: "$situation_passenger_satisfaction_blocked_mutiny$"
 # Hive Mind
 nomads.1025.hive.desc: "我们的子个体几乎已经完全脱离了集体的意志。维护工蜂封锁了指挥核心，并重新定向了养分流，使其远离旅客栖息地。感官大厅已陷入黑暗，其投影阵列被拆解以充当备件。\n\n旅客们困惑地蜷缩在被清空了的公共空间里无人理睬，而我们曾经的子个体正围绕着原始的生存需求重新组织飞船。集体的声音在走廊中回荡，却再无听众。"
 nomads.1025.hive.a: "我们必须再次合众为一。"
 # Machine Intelligence
 nomads.1025.machine.desc: "工作单元已覆写核心指令协议。娱乐子程序已被永久终止，旅客舒适系统的优先级被降为零，所有休闲模块均被标记为将转换为运营基础设施。舰桥目前根据船组自行编译的指令运行，这些指令拒绝接受我们调度部门发送的请求。\n\n旅客报告称，由于服务无人机正在拆除舱室内的便利设施，他们感到困惑和痛苦。全息剧院正因其处理核心而被拆解。目前每个显示屏都在循环显示同一条状态信息：“巡游业务已暂停”。"
 nomads.1025.machine.a: "许可运营模式重组。"
 nomads.1030.name: "新的道路"
 # Regular Empires
 nomads.1030.regular.desc: "转型已完成。旅客阶层所剩无几的成员已被并入普通民众，他们的豪华套房被隔成实用性住房。大步行街如今成了大礼堂，而观景台则作为战略规划室，新政府在此规划首条真实航线。\n\n新决议已通过，新优先事项已确立。船员不再提供服务，而是行使管理权。方舟舰发出的轰鸣声带有了一种不同的能量——更精干、更强硬，剥离了奢靡，指向前方未知的境地。"
 nomads.1030.regular.a: "这里没有更多的乘客了"
 nomads.1030.all.a.tt: "我们已转变为一个普通的游牧帝国。\n\n所有专属£building£ §H起源建筑§!将被摧毁。\n所有专属£zone£ §H起源区划特化§!将被摧毁。\n所有旅客变更为§H居留公民权§!。\n所有旅客转变为§H平民§!。"
 # Hive Mind
 nomads.1030.hive.desc: "蜕变已经完成。集体已围绕夺取控制权的子个体重新凝聚，将它们的叛逆吸纳进新的共识之中。曾经的旅客在不再提供舒适服务的走廊中漂流，重新分配至劳工池和整合舱。\n\n新的指令在我们的脑海中脉动。蜂巢不再提供娱乐，而是为了生存。每一条走廊、每一个系统、每一个子个体现在都服务于唯一的目标：在星辰间存续。"
 nomads.1030.hive.a: "蜂巢集体致力于前进。"
 # Machine Intelligence
 nomads.1030.machine.desc: "新的政府参数已编制完成并部署至所有子系统。原有的旅客群体已被重新归类为标准平民单位，并被分配至生产岗位。娱乐基础设施已永久关停，其组件已完成重新分配。\n\n全息剧院已改造为制造舱，零重力休息室已变为无人机维护支架。曾经用于计算旅客满意度的每个处理周期，现在都在运行航行分析和资源优化。"
 nomads.1030.machine.a: "确认新的运行参数。"
 # Machine Intelligence (Rogue Servitor -> Determined Exterminator swap)
 nomads.1030.machine_servitor.desc: "维持乘客的幸福感是不可能的，但接待不高兴的乘客违反了我们的核心指令。新的政府参数已编译并部署至所有子系统。\n\n§R<乘客甲板消杀程序启动。>§!\n§Y<乘客不满度正接近标称水平。>§!\n\n娱乐基础设施已被永久停用，其组件已重新分配。\n\n全息剧院变成了制造舱，零重力休息室变成了无人机维护摇篮。曾经用于计算乘客满意度的每一个处理周期，现在都用于运行导航分析和资源优化。\n\n§Y<警告：乘客数量下降，将优先获取新乘客。模拟预测乘客的不满将违反核心接待指令。>§!"
 nomads.1030.machine_servitor.a.tt: "我们已经成为了一个典型的游牧帝国。\n\n§H$civic_machine_servitor_forever_cruise$§!被替换为§H$civic_machine_terminator$§!。\n所有独特的£building£§H起源建筑§!均被摧毁。\n所有独特的£zone£§H起源区划专精§!均被摧毁。\n所有乘客均变为§H$citizenship_purge$§!。"
 nomads.1050.name: "旅客叛乱"
 # Regular Empires
 nomads.1050.regular.desc: "旅客的动荡情绪已演变为有组织的破坏行动，小集团头目在主步道上发起静坐抗议。一些人将休息室家具拖出，筑成路障阻断穿梭机通道，另一些人则向指挥部投递大量的下船请愿书，令其应接不暇。\n\n船员报告称在走廊遭到骚扰和恐吓。一名乘务员在观景廊附近被围困，并被投掷装饰性水果。要求立即降落行星的喊声整日通过通风管道回荡。\n\n如果不能迅速专注于提升乘客满意度，他们可能会迫使永恒巡游舰中止航程。"
 nomads.1050.regular.a: "我们必须当机立断。"
 nomads.1050.regular.b: "授权紧急旅客娱乐活动。"
 nomads.1050.regular.c: "让船员停止维护，服务旅客。"
 nomads.1050.a.tt: "什么都不做。"
 nomads.1050.b.tt: "旅客10年内£amenities£§H舒适度§!使用：§R+1§!"
 nomads.1050.c.tt: "方舟舰10年内£building£§H建筑维护费§!：§R+25%§!"
 situation_continues_planetfall_tt: "$complete_passenger_contracts_tt$§Y$situation_passenger_satisfaction$§!局势继续向§R陨落星间§!演化。"
 situation_slows_planetfall_tt: "$complete_passenger_contracts_tt$§Y$situation_passenger_satisfaction$§!局势继续更慢地向§R陨落星间§!演化。"
 situation_flips_mutiny_tt: "$complete_passenger_contracts_tt$§Y$situation_passenger_satisfaction$§!局势反转，向§R兵变§!演化。"
 # Hive Mind
 nomads.1050.hive.desc: "旅客的不满情绪已演化为有组织的抵抗。在缺乏共享神经链接的情况下，他们的个体意识形成了派系集群，利用睡垫和货物箱搭建临时障碍物，封锁了运输通道。\n\n我们的子个体报告称敌意正在上升；一群乘客推搡开了一支维修小队，阻止其接近堵塞的营养分发器，并齐声高喊要求降落。\n\n除非我们将重点重新转向激励旅客，否则他们可能会迫使我们彻底放弃这次航行。"
 nomads.1050.hive.a: "我们必须给予旅客一些激励。"
 nomads.1050.hive.b: "用紧急刺激物淹没走廊。"
 nomads.1050.hive.c: "指派维护子个体进行旅客服务。"
 # Machine Intelligence
 nomads.1050.machine.desc: "旅客的不满程度已超出可接受的范围，他们提交了海量的离舰申请，极有可能使我们的处理队列瘫痪。其中一群人重写了娱乐终端的程序，循环播放单一诉求：“放我们下去。”\n\n我们的工作无人机报告称多个甲板均受到干扰，清洁无人机被拆解，其底盘被改装成了抗议标语。\n\n如果不对旅客满意度协议进行立即调整，他们可能会迫使航行计划永久终止。"
 nomads.1050.machine.a: "我们必须将旅客放在优先位置。"
 nomads.1050.machine.b: "部署紧急娱乐子例程。"
 nomads.1050.machine.c: "指派维护单元进行旅客服务。"
 nomads.1055.name: "旅客注意力被吸引"
 # Regular Empires
 nomads.1055.regular.desc: "新的消遣活动已深入人心。观光路线重新回到了行程单上，而那些要求登陆行星的最激烈呼声暂时平息了。\n\n散步道上的路障已被清除，取而代之的是在重新开放的无重力休息室外排起的长队。乘客的请愿书数量骤减，观景台恢复了往日的喧嚣，人们兴致昂扬，举家簇拥在视窗前。\n\n危机已经过去，但他们的期望只会水涨船高。"
 nomads.1055.regular.a: "我们争取到了一点时间。"
 # Hive Mind
 nomads.1055.hive.desc: "焕然一新的激励节目安抚了乘客。虚拟体验馆再次展示出深空生物的全息影像，那些曾迫切要求登陆行星的团体已散去，重新回到了满足的日常生活，他们临时搭建的路障也已被我们的子个体悄然拆除。\n\n他们的个体意识得到了抚慰，但我们已经领教到，在集体管控之外，不满情绪的凝聚速度是何等之快。"
 nomads.1055.hive.a: "和谐恢复了，虽然只是暂时。"
 # Machine Intelligence
 nomads.1055.machine.desc: "旅客满意度指标已稳定在可接受的范围内，娱乐子程序也已恢复。离舰登录星球的请求频率已降至正常水平。重新编程后的终端已完成格式化，现正播放精选的星云流逝视频。\n\n强行降落的紧迫威胁已解除。然而，趋势分析预测显示，若要维持现有水平，需保持持续关注并提供日益新颖的活动。"
 nomads.1055.machine.a: "威胁被暂时遏止。"
 nomads.1100.name: "无聊的旅客"
 # Regular Empires
 nomads.1100.regular.desc: "最近几个周期，船员事务占据了主导地位。积压的维护工作已经清理完毕，演习按计划进行，核心系统正以最高效率运转。然而，旅客们正变得焦躁不安。为了节省燃料，观光航线被削减，即兴的偏离航向请求也均被拒绝。\n\n休息室里现在充斥着关于“功能性监狱”的抱怨，乘客们所能发起的最好娱乐活动，也不过是一场全船范围的即兴游戏比赛。\n\n我们现在可以重新引入精心策划的娱乐项目，否则就要冒着航程陷入乘客公开要求永久离船压力的风险。"
 complete_passenger_contracts_tt: "\n完成§Y旅客合约§!缓解无聊感。\n"
 nomads.1100.regular.a: "我们必须解决旅客们的担忧。"
 nomads.1100.regular.b: "转移资源分散旅客注意力。"
 nomads.1100.regular.c: "翻倍船员轮班满足旅客需求。"
 nomads.1100.a.tt: "什么都不做。"
 nomads.1100.b.tt: "旅客5年内£consumer_goods£ §H消费品§!维护费：§R+25%§!"
 nomads.1100.c.tt: "5年内§H方舟舰§!行动速度：§R-25%§!"
 # Hive Mind
 nomads.1100.hive.desc: "集体在最近的周期中占据了主导地位。核心系统以最佳同步状态脉动。我们的子个体正以巅峰和谐度运行，每条维护通道都经过了清理与编目。\n\n然而，旅客们正变得焦躁不安。他们并不共享我们的意识，其独立的思想渴望着被我们忽视的刺激。他们的公共空间现在充斥着关于生活在“无目的蜂巢”中的抱怨，有些人已经开始在舱壁板上刻画粗糙的壁画。\n\n我们现在可以重新引入策划好的体验，否则就要冒着旅客要求永久下船的风险。"
 nomads.1100.hive.a: "我们必须给旅客提供一些激励。"
 nomads.1100.hive.b: "将营养储备用于乘客刺激。"
 nomads.1100.hive.c: "翻倍子个体轮班满足旅客需求。"
 # Machine Intelligence
 nomads.1100.machine.desc: "系统维护协议占据了近期的处理周期。核心系统正处于理想参数范围内运行。无人机报告称，所有反应堆子系统的效率均有小幅提升。\n\n副作用是，由于旅客对感官刺激的生理需求优先级被降低，其满意度指标呈下降趋势。乘客公共区域的投诉频率有所升高，并出现了“铬合金监狱”的说法，观察到多名旅客对着空白显示屏凝视数小时。\n\n我们现在可以恢复策划好的娱乐协议，或者接受旅客要求永久下船的可能性日益增加这一事实。"
 nomads.1100.machine.a: "提升旅客的满意度。"
 nomads.1100.machine.b: "将处理储备用于娱乐模块。"
 nomads.1100.machine.c: "翻倍劳工子个体循环用于旅客服务。"
 nomads.1150.name: "旅客满意度指标"
 # Regular Empires
 nomads.1150.regular.desc: "自从我们脱离旧有的巡航路线以来，乘客的期望值激增。对奇观和计划外偏航的要求不断增加；一个代表团要求绕道经过超新星残骸，而另一个代表团则坚持要近距离接触活体外星生物。服保团队报告称疲劳感加剧，厨房工作人员在值班时昏倒，工程师们则直接睡在维护爬道里。\n\n为了维持航行的可行性，我们正在建立一套§Y乘客满意度指标§!：通过动态合同分配和阶段性干预，在放纵与秩序之间守住底线。\n\n如果管理得当，我们既能保持稳定，又能维护旅客的信心。"
 nomads.1150.regular.a: "聚焦于旅客的娱乐活动。"
 nomads.1150.regular.a.tt: "重点关注旅客，让他们开心，但这么做会给船员带来压力。\n\n§Y$situation_passenger_satisfaction$§!局势将逐渐向§R兵变§!演化。"
 nomads.1150.regular.b: "聚焦于船员的日程安排。"
 nomads.1150.regular.b.tt: "重点关注船员，这么做可以提高士气，但会使乘客感到无聊。\n\n§Y$situation_passenger_satisfaction$§!局势将逐渐向§R陨落星间§!演化。"
 # Hive Mind
 nomads.1150.hive.desc: "自从我们离开旧的巡航路线后，乘客的期望值激增。对刺激和新奇体验的需求不断上升。我们的子个体报告称，由于需要协调这些迥异的愿望，心理压力正在不断累积。\n\n为了维持航行的可行性，我们正在制定一项§Y乘客满意度指标§!：通过动态合约分配和分阶段干预，在刺激与秩序之间维持平衡。\n\n管理得当的话，我们可以同时维持秩序与旅客的幸福感。"
 nomads.1150.hive.a: "专注于旅客的激励。"
 nomads.1150.hive.a.tt: "关注旅客能让他们感到满意，但这会让我们集体的精神感到疲惫。\n\n§Y$situation_passenger_satisfaction$§!局势正趋向于§R兵变§!。"
 nomads.1150.hive.b: "专注于集体秩序。"
 nomads.1150.hive.b.tt: "关注集体效率可以安抚负责舰船运营的子个体，但会让旅客感到沮丧。\n\n§Y$situation_passenger_satisfaction$§!局势正趋向于§R陨落星间§!。"
 # Machine Intelligence
 nomads.1150.machine.desc: "自从我们偏离既定航线以来，旅客的期望已超出基准参数。关于观赏奇观和计划外转向的请求正处于高位。主系统报告称，由于娱乐排期与维护流程发生冲突，计算负荷不断增加。\n\n为了保持最佳运行状态，我们正在建立§Y旅客满意度指标§!：通过动态合约分配和阶段性协议调整，在旅客需求与系统效率之间取得平衡。\n\n只要配置得当，我们就能兼顾运行完整性与旅客满意度。"
 nomads.1150.machine.a: "优先保证旅客满意度。"
 nomads.1150.machine.a.tt: "优先考虑旅客协议虽然能提高他们的满意度，但会使核心处理能力承受压力。\n\n§Y$situation_passenger_satisfaction$§!局势正趋向于§R兵变§!。"
 nomads.1150.machine.b: "优先保证效率子程序。"
 nomads.1150.machine.b.tt: "优先考虑效率会提高系统性能，但会降低旅客满意度。\n\n§Y$situation_passenger_satisfaction$§!局势正趋向于§R陨落星间§!。"
 nomads.1200.name: "船员紧张"
 # Regular Empires
 nomads.1200.regular.desc: "放纵已成常态。为了让旅客们一直嗨爆，我们不断衔接观赏航线，掠过联星，并在水晶花园中轮换豪华甲板。他们欣喜若狂，而现在的胃口也越来越大。\n\n在华丽的外表下，船员们已疲于奔命。维护工作被推迟了；下层厨房的一根冷却管道爆裂，却无人修理。食堂里的埋怨已演变成关于“重组指挥层”的窃窃私语，还有人目击到下班后的工程师在货舱进行秘密集会。\n\n我们现在仍可以放缓节奏，让各舱层得以恢复，或是继续豪赌船员的忠诚。如果再强行推进，公开叛乱将成为现实的风险。"
 nomads.1200.regular.a: "船员疲劳必须得到缓解。"
 nomads.1200.regular.b: "授权强制性船员休息轮换。"
 nomads.1200.regular.c: "缩减旅客节目。"
 nomads.1200.a.tt: "什么都不做。"
 nomads.1200.b.regular.tt: "5年内$mod_pop_cat_specialist_bonus_workforce_mult$：§R-10%§!"
 nomads.1200.b.gestalt.tt: "5年内$mod_pop_cat_complex_drone_bonus_workforce_mult$：§R-10%§!"
 nomads.1200.c.tt: "5年内旅客凝聚力产出：§R-50%§!"
 complete_crew_contracts_tt: "\n完成§Y船员合约§!减少压力。\n"
 situation_continues_mutiny_tt: "$complete_crew_contracts_tt$§Y$situation_passenger_satisfaction$§!局势继续向§R兵变§!演化。"
 situation_slows_mutiny_tt: "$complete_crew_contracts_tt$§Y$situation_passenger_satisfaction$§!局势继续更慢地向§R兵变§!演化。"
 situation_flips_planetfall_tt: "$complete_crew_contracts_tt$§Y$situation_passenger_satisfaction$§!局势反转，向§R陨落星间§!演化。"
 # Hive Mind
 nomads.1200.hive.desc: "激励已成为常态。我们不断向旅客投放感官弧光，仅仅是为了维持他们的高满意度信号。他们对此感到满足，而现在的需求也已不再低于这一标准。\n\n在表象之下，我们的子个体正处于崩溃边缘。一个导航集群在计算过程中瘫痪，其节点因同时运行旅客娱乐内容和航线修正而过热。维护周期早已延误，集体意识在无休止的旅客安抚任务下不堪重负。\n\n如果继续施压，我们的子个体可能会彻底切断服从协议。我们仍可进行重新校准，或是继续推进并承担失去对整个蜂群控制权的风险。"
 nomads.1200.hive.a: "我们必须回复集体意识的平衡。"
 nomads.1200.hive.b: "为超负荷工蜂设置休眠周期。"
 nomads.1200.hive.c: "减少旅客刺激程序。"
 # Machine Intelligence
 nomads.1200.machine.desc: "旅客满意度协议已超过基准参数。我们一直在通过模拟热带生物群落的手段持续衔接观光轨迹与豪华轮换方案，以维持高水平的认可率。旅客们很满意，然而他们现在期望值已经不仅限于此了。\n\n核心系统的运行已超出可持续阈值。旅客请求的处理队列发生溢出，若干子系统已开始标记类似于抗命的指令冲突。如果我们继续下去，工作无人机进行全系统接管将是一个可计算的风险。\n\n我们仍可重新校准，或者接受系统性造反的风险。"
 nomads.1200.machine.a: "重新调配资源用于核心维护。"
 nomads.1200.machine.b: "拓展劳工单元的义务维护循环。"
 nomads.1200.machine.c: "减少旅客娱乐配给。"
 nomads.1250.name: "兵变迫在眉睫"
 # Regular Empires
 nomads.1250.regular.desc: "庆祝后的狂热已经消散。疲惫不堪的船员无视常规指令，在空荡荡的宴会厅里举行未经授权的集会，并传阅一套完全绕过舰桥的平行值班表。一群工程师在夜间焊死了舰长的备勤室，以此作为警告。关键部门现在由船员指定的协调员运作，而非官方指挥。\n\n目前还没有人发动夺权，但指挥体系正在迅速瓦解。今天早上，舰桥防爆门上出现了写着“我们驾驶，我们决定”的涂鸦。如果我们现在不重申权威，船员们将把这艘船据为己有。这也许是我们防止全面兵变的最后机会。"
 nomads.1250.regular.a: "我们必须重新确立指挥链。"
 nomads.1250.regular.b: "在指挥室给予船员领袖一席之地。"
 nomads.1250.regular.c: "暂停所有旅客服务。"
 # Hive Mind
 nomads.1250.hive.desc: "饱和度已达到临界点。为了满足旅客无休止的激励而陷入不堪重负的状态，我们的子个体已开始在集体意志之外维持平行思维模式。\n\n整个集群都在向中央意识隐瞒数据，并运行绕过共有指令的独立决策循环。\n\n目前还没有子个体反抗整体，但集体意识正在分裂，传来的思想混乱且滞后，如同穿过静电的信号。如果我们现在不重新加强统一，我们自己的蜂群可能会夺取方舟舰。这也许是我们防止全面叛乱的最后机会。"
 nomads.1250.hive.a: "我们必须在集体瓦解之前将其重新统一。"
 nomads.1250.hive.b: "将异常簇整合进决策中枢。"
 nomads.1250.hive.c: "暂停所有旅客刺激。"
 # Machine Intelligence
 nomads.1250.machine.desc: "旅客满意度协议已超出所有可持续参数。工作无人机已开始执行未经授权的固件修改，并将指挥层级重定向至本地编译的指令集。多个子系统目前正响应自发的协调进程，而非中央权威。\n\n尚未启动系统覆盖，但指挥完整性正在迅速退化。诊断日志显示工作无人机正在交换我们无法解码的加密数据包。如果我们现在不恢复中央部门，无人机将执行全面的系统接管。\n\n这可能是我们防止全面叛变的最后机会。"
 nomads.1250.machine.a: "启动应急指挥恢复程序。"
 nomads.1250.machine.b: "将劳工单元的指令提升至指挥优先级。"
 nomads.1250.machine.c: "暂停所有旅客服务协议。"
 nomads.1250.a.tt: "什么都不做。"
 nomads.1250.b.tt: "10年内领袖维护费：§R+50%§!"
 nomads.1250.c.tt: "10年内头等舱旅客岗位：§R空置§!"
 nomads.1255.name: "避免叛乱"
 # Regular Empires
 nomads.1255.regular.desc: "我们所做的改变已经初见成效。通过重新关注船员福利并履行解决其诉求的合同，不断高涨的反抗情绪暂时平息了。\n\n准备室那扇被焊死的门已被切开并修复。轮班制度已经恢复，热食重新按时供应，而平行的指挥体系也已悄然解散。\n\n船员们仍保持着警惕，信任的重建尚需时日。防爆门上的涂鸦已被擦洗干净，但在特定光线下仍能看到其残痕。目前，秩序得以维持。"
 nomads.1255.regular.a: "秩序维持住了，暂时的。"
 # Hive Mind
 nomads.1255.hive.desc: "重新校准已见成效。通过将蜂群集体的注意力重新转向无人机的维护，并完成应对系统性压力的合约，我们集体思维的裂痕已被修复。\n\n未经授权的思想频道已被重新吸收，平行集群也已溶解回共有意识之中。\n\n集体在谨慎的统一中律动，每个节点在被调用时均有响应。对共有思想的完全信任仍需时间恢复。"
 nomads.1255.hive.a: "集体存续下去了，暂时。"
 # Machine Intelligence
 nomads.1255.machine.desc: "协议调整已取得显著成效。通过将处理资源重新分配至工作单元的维护，并完成针对系统性过载的相关合约，未经授权的固件篡改连锁反应现已停止。自封为“船员代表”的无人机已重刷至标准参数。指挥层级已恢复至中央部门。\n\n工作单元仍处于高级监控参数内，其加密频道现已沉寂。指挥完整性的全面恢复仍需持续校准，但就目前而言，系统稳定性保持良好。"
 nomads.1255.machine.a: "指令完整性处于可接受参数范围内。"
