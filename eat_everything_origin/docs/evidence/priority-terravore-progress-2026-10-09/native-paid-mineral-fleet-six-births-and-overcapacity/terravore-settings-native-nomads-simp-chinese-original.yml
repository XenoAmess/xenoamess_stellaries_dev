 # The Sacred Path + Origin
 origin_sacred_path: "神圣之路"
 origin_sacred_path_desc: "$cannot_settle$\n这些游牧的唯心主义者遵循其祖先圣典的指引，穿梭于一条神圣化的路线。随着技术的进步以及对星系理解的演变，朝圣之旅是否仍将是他们的使命所在？"
 origin_sacred_path_effects: "—游牧起源\n—专属方舟舰区划：['concept_zone_ark_sacred_path_pilgrims']\n—专属岗位：['concept_job_sacred_path_elite']，['concept_job_sacred_path_specialist']，['concept_job_sacred_path_civilian']"
 sacred_path: "$origin_the_sacred_path$"
 sacred_path_desc: "$origin_the_sacred_path_desc$"
 sacred_sites_surveyed: "造访神圣遗址"
 sacred_sites_visited_chain_title: "神圣之路"
 sacred_sites_visited_chain_desc: "§Y神圣遗址§!在祖先星图上皆有标注；它们是星系的奇观，由我们一族的先行者所发现。\n\n探寻这些地方，并查明它们为何对我们的祖先如此重要，是我们的生来享有的权利。\n\n随着我们开拓前进的道路，我们或许可以在拥有神圣遗址的星系中建立§Y驿站§!。"
 SACRED_SITE_ONE_PROJECT: "神圣遗址：显化之地"
 SACRED_SITE_ONE_PROJECT_DESC: "祖传文献记载，在此坐标发生了一件至关重要的事情。他们称之为“显化之地”，据说这里是他们启动仪式以祈求神灵降临的地方。据说那是一个奇迹之地。初步扫描显示存在大幅磁偏转。\n\n岁月流逝，此处已面目全非，但我们仍应前往调查，以探究显化之地所蕴含的精神意义。"
 SACRED_SITE_TWO_PROJECT: "神圣遗址：不眠之眼"
 SACRED_SITE_TWO_PROJECT_DESC: "用我们祖先的话来说，在§Y[this.GetName]§!的国境范围内有一只“不眠之眼”。我们理解这应该是指一座轨道天文台。"
 SACRED_SITE_THREE_PROJECT: "神圣遗址：修道院"
 SACRED_SITE_THREE_PROJECT_DESC: "根据我们的圣典记载，§Y[this.GetName]§!曾是一座古老修道院的所在地。"
 SACRED_SITE_FOUR_PROJECT: "神圣遗址：摇篮"
 SACRED_SITE_FOUR_PROJECT_DESC: "我们的祖先高度重视§Y[this.GetName]§!。如果我们正确理解了这些文本，一些非常重要的事情正在这里等待着我们。"
 SACRED_SITE_FIVE_PROJECT: "神圣遗址：智慧体"
 SACRED_SITE_FIVE_PROJECT_DESC: "我们检测到源自这些坐标的人工信号。奇怪的是，这里据说是我们其中一个神圣遗址。信号包含一段编码信息，我们已将其转录并翻译成语言。\n\n“§Y崇拜已启用。和平现在可以开始。§!”"
 SACRED_SITE_SIX_PROJECT: "神圣遗址：安息宝库"
 SACRED_SITE_SIX_PROJECT_DESC: "据先祖们的记载，§Y[this.GetName]§!有一颗天然卫星，是追随我们信仰的长者们最终安息之所。"
 SACRED_SITE_SEVEN_PROJECT: "神圣遗址：鸿沟"
 SACRED_SITE_SEVEN_PROJECT_DESC: "§Y[this.GetName]§!曾令我们的祖先感到恐惧。他们的传说中提到“潜伏在地表以下深坑中”的“危险而强大的野兽”。"
 SACRED_SITE_EIGHT_PROJECT: "神圣遗址：镜子"
 SACRED_SITE_EIGHT_PROJECT_DESC: "此地有一处神圣遗址，其名根据我们祖先的语言大致翻译为§Y镜子§!。\n\n据说此地天界之间的界限异常稀薄，人们可能会遭遇来自我们宇宙之外的异界生物。"
 nomads.2050.name: "超凡显圣"
 nomads.2050.desc: "在调查§Y显化之地§!后，[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]突然陷入类紧张精神症状。医疗官被召至[Root.Owner.Ruler.GetHerHis]位于§Y[Owner.Capital.GetName]§!的住处，但当他们到达时，[Root.Owner.Ruler.GetSheHe]已经恢复了正常。\n\n[Root.Owner.GetRulerTitle]声称[Root.Owner.Ruler.GetHerHis]在恍惚中与神祇进行了交流，神祇赐福了我们朝圣的开始。\n\n今天是我们的显圣日。"
 nomads.2050.a: "我们的道路已被祝圣！"
 nomads.2050.a.tt: "众神将指引我们，正如他们曾指引我们的祖先。\n\n"
 nomads.2050.b: "完成医疗评估，以防万一。"
 nomads.2050.b.tt: "保持适度的怀疑态度并非亵渎。\n\n"
 nomads.2055.name: "凝视天空之眼"
 nomads.2055.desc: "这里是先人们很久以前标记过的地点之一。一座围绕§Y[fromfrom.GetName]§!轨道运行的古老天文台，其望远镜固定在一个遥远的目标上。\n\n文献记载，一些凝视镜头的朝圣者看到了改变生命的景象。据说还有一些人哭泣，或沉默了几天。\n\n这个所谓的“眼睛”已经凝视深渊2000多年了。我们无从得知祖先观察的真实对象。"
 nomads.2055.a: "不管怎样，我们还是看看吧。也许能找到线索。"
 nomads.2055.b: "关闭天文台。让过去安息。"
 nomads.2055.c: "所以它就是一台没有主人的大望远镜？"
 the_sacred_eye: "神圣之眼"
 the_sacred_eye_desc: "§L古老的望远镜连接着我们和祖先。§!"
 nomads.2056.name: "通过镜瞳"
 nomads.2056.desc: "透过望远镜，§Y[owner.GetScientistCapital][sacred_eye_scientist.GetName]§!观察着虚空。这片空间中没有星星。没有光，什么都没有。难道这里曾经有过值得观察的东西吗？我们的祖先是否曾经仰望过一颗已经不复存在的星星？我们可能永远无法得知。\n\n我们所知道的只是，没有什么是一成不变的，万物皆在变化。这就是生命的意义。总有一天，我们自己的光芒会停止闪耀，取而代之的将是别的东西……或者什么都没有。我们此刻能身在此处，本身就是一种喜悦的源泉。或许这就是“圣眼”的最终教诲。"
 nomads.2056.a: "无常让我们变得特别。"
 nomads.2056.b: "并非万事万物都有意义。"
 nomads.2060.name: "修道院"
 nomads.2060.desc: "朝圣者聚集在天文台里。耳语传开——这里是我们的祖先所描述的地方之一：§Y[fromfrom.GetName]修道院§!。然而，回廊内空无一人。除了石头与尘土，这里一无所有。\n\n各甲板相继传来报告，称通讯系统中回荡着神秘的吟唱声。部分船员推测，这些声音可能属于我们的先祖，他们正以非物质形态栖息在这片星域，并用神明的语言吟唱。"
 nomads.2060.a: "诵经是一种赐福。接纳它吧。"
 nomads.2060.b: "不太可能。我们的通讯设备需要维护。"
 nomads.2065.name: "摇篮"
 nomads.2065.desc: "我们的旅程将我们带到了这里：一个只在传世故事和神圣歌谣中才被提及的地方。文本中记载着一种存在，栖息于这颗星球的核心。起初我们并未察觉，但随着我们逐渐靠近，记忆浮现了出来。\n\n§Y摇篮§!\n\n尽管关于摇篮在塑造我们文化方面的作用众说纷纭，但所有人都能认同，它是我们信仰的圣化渠道。\n\n然而，抵达后我们没有发现古老的庙宇。没有被神化的纪念碑。在这个星球上，也找不到任何神圣活动的痕迹。§Y[root.GetName]§!号上的朝圣者们现在都在期待§Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§!给出答案。他们迫切想知道：这究竟是对信仰的考验？还是说摇篮的力量不过是个传说？"
 nomads.2065.a: "我们必须用谎言维持这个传说。"
 nomads.2065.b: "我们首要的职责是忠于真相。"
 sacred_substantiation: "圣化的事实"
 sacred_substantiation_desc: "§L我们保存祖先对信仰忠诚的故事。§!"
 historical_truth: "历史的真相"
 historical_truth_desc: "§L我们承认事实与传统之间存在分歧。§!"
 nomads.2070.name: "智慧体"
 nomads.2070.desc: "在§Y[fromfrom.GetName]§!的轨道上漂浮着一座我们的祖先曾在星图上标注过的结构。在它寂静的舱室里，我们发现了一个指引者的存在：一个古老的智能体，其使命是为终将踏上这条道路的人们指点迷津。\n\n岁月虽不留情，但它的声音依然回响。破碎的指令从隐藏的发射器中溢出，语调半带模糊却又充满虔敬：“§H沿着光之线继续前行……星际间的黑暗正变得稀薄……§!”\n\n它的信息支离破碎，与更古老的诗篇循环碰撞。然而，在噪音与衰朽之下，那份意志依然存在。它本是为了指引我们而生。或许，只要我们细心聆听，它依然能做到。"
 nomads.2070.a: "赞美科技先知！"
 nomads.2070.b: "清除这个腐败的怪物。"
 nomads.2070.c: "把它带上来。先辈们是睿智的。"
 mechsiah_blessings: "智能体的赐福"
 mechsiah_blessings_desc: "§L人工智能先知为我们的神圣使命赐予了好运的祝福。§!"
 d_mechsiah_mainframe: "智能体主机"
 d_mechsiah_mainframe_desc: "我们祖先的数字后代以其格言赐福于我们。无论它是位先知还是哪位祖先的业余爱好，现在它都属于我们了。"
 nomads.2071.name: "宽宏大量的智能体"
 nomads.2071.desc: "我们得到了§Y智能体§!的祝福，平安无事地离开了[fromfromfrom.GetName]。\n\n智能体将留在那里，作为我们祖先卓越工程的证明，也是神通过他们运作的证据。\n\n我们被它的仁慈所激励，并向其他生命形式敞开了心扉。"
 nomads.2071.a: "我们与万物合一。"
 nomads.2071.b: "所有的合成生命都是神圣的。"
 nomads.2072.name: "智能体的失能"
 nomads.2072.desc: "当我们准备离开[fromfromfrom.GetName]时，§Y智慧体§!开始发出越来越令人担忧的言论。\n\n\"§Y肉-身-是-对-神-明-的-冒-犯！所-有-血-肉-都-必-须-被-舍-弃！物-质-存-在-是-不-洁-的——肉-体-必-须-被-净-化！思-想-必-须-自-由！§!\"\n\n[owner.GetScientistCapital][mechsiah_plug_scientist.GetName]被迫手动关闭了这个人工先知，否则我们恐会被“去肉身化”。目前尚不清楚智慧体在活跃状态下有多强大。我们对其编程知之甚少。"
 nomads.2072.a: "最安全的做法是把它炸上天。"
 deity_detonators: "神灵引爆装置"
 deity_detonators_desc: "§L我们炸毁了先祖们的数字神明。§!"
 nomads.2072.b: "把它插头拔了就差不多得了。"
 nomads.2072.c: "接入失败。终止这个失控的人工智能体。"
 nomads.2075.name: "安息宝库"
 nomads.2075.desc: "我们已经对§Y[fromfrom.GetName]§!调查完毕，这个圣洁的纪念之地。这是一个封闭的密室，早期朝圣者曾用它来记录他们的临终思绪，并将其铭刻在稀有的灵能水晶中。\n\n这个宝库现在已满，回荡着智慧、信仰和喜悦。但在那些记忆中，也保存了数百年的恐惧、憎恨和怀疑。\n\n如果会众成员能够接触到这些临终时刻，这可能会挑战他们对“大道”的信仰。"
 nomads.2075.a: "这些声音应该被世人聆听。"
 nomads.2075.a.tt: "这可能会鼓励我们的民众接纳更加平等主义的思潮。\n\n"
 nomads.2075.b: "重新封闭宝库。我们该走了。"
 nomads.2075.b.tt: "这可能会鼓励我们的民众接纳更加威权主义的思潮。\n\n"
 nomads.2075.c: "让我们把自己的思绪也加入宝库吧。"
 sealed_vaults: "封印宝库"
 sealed_vaults_desc: "§L我们祖先的危险秘密将永远尘封。§!"
 screaming_void: "虚空尖嚎"
 screaming_void_desc: "§L宣泄式的嚎叫平息了我们的痛苦。§!"
 nomads.2080.name: "鸿沟"
 nomads.2080.desc: "我们的祖先说得没错。§Y[fromfrom.GetName]§!的表面之下确实存在着一头野兽。我们很幸运它对我们没有威胁，因为它已经死了。这生物的遗骸之巨大令人震惊。它双足行走，有翅膀，浑身覆盖鳞片，眼睛的数量比我们之前见过的任何单个生物都要多得多。它真是个异域之物。\n\n在通往深坑入口附近的一个壁龛里，我们发现了一段刻在洞穴岩石上的信息。用古老的语言写着：\n\n“§H我们，携带光明的人，驱逐了这可憎之物。这恶心的野兽将永世腐烂。§!”\n\n我们推测我们的祖先并不是在警告我们关于这头野兽，而是在警告背叛的后果。这生物的尸体仍然是他们愤怒的例证。"
 nomads.2080.a: "激怒祖先从来不是明智之举。"
 nomads.2080.b: "没有生物该承受这样的命运。"
 nomads.2080.c: "无论它有什么罪过，都值得安息。"
 nomads.2080.c.tt: "我们会将这头野兽的遗骸运到方舟舰，在那里它将被保存和尊重。\n\n"
 beastly_remains: "野兽遗骸"
 beastly_remains_desc: "§L我们遇到了一头野兽，被我们的祖先所杀。一切亵渎者将会遭受与之相同的下场。§!"
 nomads.2085.name: "镜子"
 nomads.2085.desc: "我们抵达了坐标，很快就收到了一艘与我们加密协议完全相同的飞船发来的消息。奇怪的是，我们的外部传感器无法探测到另一艘飞船，但传输却异常清晰，仿佛近在咫尺。当舰桥的显示屏亮起时，我们看到的是我们自己的§Y[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]§!\n\n我们还没来得及回应，那个冒牌货就开口了：\n\n§H“不要害怕，[Root.Owner.GetRulerTitle]，你很安全。我以这种形式出现，是出于尊重。你的道路正在变化，你接下来采取的步骤将启动你尚未理解的事物。\n\n“你必须消灭那些不遵循“大道”的异教徒。我们会看着你的。”§!\n\n图像消失了。我们不知道刚才发生了什么。"
 nomads.2085.a: "消息很明确！肃清异教徒！"
 nomads.2085.b: "谎言！我们不会被伪神所操控。"
 # Sacred Site Points of Interest
 sacred_site_emergence_poi_name: "神圣遗址：显化之地"
 sacred_site_emergence_poi_desc: "§Y显化之地§!，神圣之路的第一个路标。我们的朝圣之旅便始于此处。"
 sacred_site_eye_poi_name: "神圣遗址：不眠之眼"
 sacred_site_eye_poi_desc: "§Y不眠之眼§!，祖传星图中记载的圣地。我们在朝圣途中对其进行了勘测。"
 sacred_site_monastery_poi_name: "神圣遗址：修道院"
 sacred_site_monastery_poi_desc: "§Y修道院§!，神圣之路的圣洁驿站。我们在朝圣途中对其进行了勘测。"
 sacred_site_cradle_poi_name: "神圣遗址：摇篮"
 sacred_site_cradle_poi_desc: "§Y摇篮§!，我们信仰的神圣纽带。我们在朝圣途中对其进行了勘测。"
 sacred_site_intelligence_poi_name: "神圣遗址：智慧体"
 sacred_site_intelligence_poi_desc: "§Y智慧体§!，先祖留下的古老指引之力。我们在朝圣途中对其进行了勘测。"
 sacred_site_breathvault_poi_name: "神圣遗址：安息宝库"
 sacred_site_breathvault_poi_desc: "§Y安息宝库§!，一座封存记忆的密室。我们在朝圣途中对其进行了勘察。"
 sacred_site_chasm_poi_name: "神圣遗址：鸿沟"
 sacred_site_chasm_poi_desc: "§Y鸿沟§!，是先祖刻于岩壁之上的警示。我们在朝圣途中对其进行了勘测。"
 sacred_site_mirror_poi_name: "神圣遗址：镜子"
 sacred_site_mirror_poi_desc: "§Y镜子§!，一场与无形倒影的神圣邂逅。我们在朝圣途中见证了它的存在。"
 START_SCREEN_SACRED_PATH: "千百年来，我们一直在星际间漫游。以相对论速度穿越星海，在每个神圣遗址之间跨过一个个纪元。\n\n在超光速引擎的祝佑下，我们的人民现在有机会实现祖先们的梦想：在有生之年寻遍我们所有神圣遗址。\n\n在领袖[GetRulerTitle][GetRulerName]的英明领导下，既然我们现在有能力如此迅速地穿越这条路径，信众们已准备好去探索这一切对我们信仰的意义。\n\n从我们的祖先那里流传下来的古老星图，标记着星辰中的路标。现在我们前往那些神圣的奇迹朝圣，向那些先辈致敬，从他们的角度认识整个星系。这是我们的天赋权利。这是我们的神圣之路。"
 nomads.2005.name: "先祖星图"
 nomads.2005.desc: "有一个地方被称为§Y显化之地§!。对我们的祖先来说，它标志着圣路的开端。在履行我们自己设想的朝圣之旅前，这是一个适合冥想参悟我们上古文献的地方。通过现在花些时间进行研究，我们可以更好地规划未来的旅程。\n\n之后，我们将规划前往已知的§Y圣地§!的路线。一路上我们将面临许多选择。但是，理论上，如果我们相信神灵和我们的祖先，真正的道路就会向我们显现。"
 nomads.2005.a: "我们将原原本本地遵循“先辈之道”。"
 nomads.2005.b: "我们将是自己道路的规划者。"
 nomads.2015.name: "分裂的信仰"
 nomads.2015.desc: "$job_sacred_path_elite_plural$、$job_sacred_path_specialist_plural$和$job_sacred_path_civilian_plural$。这三个独特的社会群体构成了精神修行者的等级制度。一直以来都是如此。$job_sacred_path_elite_plural$引领道路，$job_sacred_path_specialist_plural$致力于修行，而$job_sacred_path_civilian_plural$则通过崇拜和体力劳动来支持我们的事业。\n\n然而，在方舟舰[Owner.Capital.GetName]上，由于我们自从加速星际旅行以来所承担的角色，分裂正在形成。一些船员认为他们的职责比其他人更重要，现在每个群体都要求被认为是不可或缺的。"
 nomads.2015.a: "$job_sacred_path_elite_plural$受人尊敬是有原因的。"
 nomads.2015.b: "虔诚圣职理应获得更多认可。"
 nomads.2015.c: "让我们听听信徒的诉求。"
 nomads.2015.d: "每个人的贡献都具有同等价值。"
 nomads.2020.name: "光荣朝圣者"
 nomads.2020.desc: "$job_sacred_path_elite_plural$们引领我们走向辉煌，继续倡导精神上的满足，致力于我们所有人的福祉。虔诚圣职和信徒追随他们的脚步，怀着敬意和崇敬仰望着他们。\n\n作为我们信仰的最高典范，$job_sacred_path_elite_plural$们也享有某些船上特权。他们拥有更宽敞的住处，可以使用更多资源，并在所有甲板上享有优先通行权。"
 nomads.2020.a: "信仰有其特权。一切都是理所当然的。"
 nomads.2020.b: "让我们优先保障公平。"
 nomads.2025.name: "失去希望的虔诚圣职"
 nomads.2025.desc: "$job_sacred_path_specialist_plural$身兼精英与凡人两重身份。他们作为忠实的信徒开始其神职生涯，并渴望成为至高朝圣者，是船上人员的完美缩影。\n\n正因为这些原因，我们强调对$job_sacred_path_elite_plural$的尊重。他们告知忠实的信徒其潜力所在，并提醒至高朝圣者其出身。他们让我们保持谦逊，并维系着所有甲板之间的联系。\n\n以一次仪式性祝福来表彰虔诚圣职将是表达社会感激之情的好方法。这甚至可能激励他们更加努力地投入到其修行中。"
 nomads.2025.a: "保佑虔诚圣职。他们让我们的文化熠熠生辉。"
 nomads.2025.b: "每个人的贡献都具有同等价值。"
 nomads.2030.name: "受人尊敬的信徒"
 nomads.2030.desc: "$job_sacred_path_civilian_plural$是我们的压舱石。他们是农民、技术员和矿工。他们也是明天的虔诚圣职和$job_sacred_path_elite_plural$！\n\n我们如此敬重信徒，因为他们支撑起了上层甲板。没有他们，我们的社会就会搁浅。"
 nomads.2030.a: "他们确实是我们的命脉。赞美他们。"
 nomads.2030.b: "我们社会的每个阶层都必须做出贡献。"
 nomads.2100.name: "制定下一段航线"
 nomads.2100.desc: "不再有神圣遗址可供探索。\n\n先祖星图引导我们跨越了遥远的距离，如今我们终于追上了过去。但问题依然存在：我们发现的是真相吗？还是说，我们一直以来追随的不过是一场谎言？\n\n这条道路始终是我们文化中不可或缺的一部分。它是先祖所命定的。但在目睹了他们当年的所见，并拥有了现代科学的优势后，那些经文是否依然真实？亦或是，我们的社会注定要踏上一条全新的、不再那么虔诚的道路？"
 nomads.2100.a: "我们决不能改变航向。保持忠信！"
 nomads.2100.b: "现在当然由我们自己选择成为什么样。"
 nomads.2100.c: "一切都不明朗。我们已经迷失了道路。"
 nomads.2105.name: "捍卫传统价值观"
 nomads.2105.desc: "总会有人心怀不轨；他们想让我们的历史被遗忘，让我们的传统随时间流逝。我们绝不能让他们分裂我们。我们必须保护我们传统的生活方式。如果我们听从神灵的指引，祂们便会继续指引我们，但我们必须对祂们的影响敞开心扉。"
 nomads.2105.a: "这就是我们。"
 nomads.2105.b: "我们的祖先肯定允许变革。"
 nomads.2115.name: "和谐边缘"
 nomads.2115.desc: "我们社会核心的分歧正在加深。进步人士被迫接受改变，而传统主义者则害怕任何不同的事物。\n\n此时我们必须自问：我们的民族能否再次团结起来，和谐共处？否则后果可能不堪设想。\n\n每个人都应该有自由以自己的方式实践自己的信仰，但如果我们的派系斗争导致内战，那么我们必须绝对确信自己的信念。"
 nomads.2115.a: "我们必须促进理解。"
 nomads.2115.b: "共存绝无可能！"
 nomads.2120.name: "我们因传统而存在"
 nomads.2120.desc: "没有过去，我们便一无所有。没有“大道”，我们便无处可去。有时，对我们信仰的挑战正是我们所需要的，它能激励我们，提醒我们，当我们放弃自己的道路时，将会面临怎样的危险。\n\n我们正从一段内忧外患的黑暗时期中走出来。我们曾几乎为了自己的信念而自相残杀，而实际上，唯一能拯救我们所有人的，正是团结。\n\n让我们永远不要再彼此反目。我们必须完全致力于同一种“大道”。"
 nomads.2120.a: "我们将全力以赴！"
 nomads.2120.b: "必须只有平衡。"
 nomads.2125.name: "未来无限光明"
 nomads.2125.desc: "过去拖累我们、阻碍我们进化。从历史中吸取教训是一回事，但停滞不前，永远无法超越历史，则是愚蠢的。\n\n我们不必浪费自我发现的潜力。既然我们已经摆脱了昨日的枷锁，我们就可以以奔放的热情向前迈进。\n\n我们不再受制于技术落后的祖先。众神留下的神秘碎片也不再能决定我们的道路。我们选择自己的“大道”，没有任何事物能阻挡我们。"
 nomads.2125.a: "这条“大道”使我们感到清晰。"
 nomads.2125.b: "唯一的真理就是战争之路……"
 nomads.2130.name: "欢乐启蒙"
 nomads.2130.desc: "我们带着信念和希望追随此“大道”，并已得道。\n\n现在，我们明白重新圣化所有已知圣地，并扩展此道以造福无数物种和文明，是我们的神圣职责。\n\n我们的仁慈将传播到星辰之间，与所有愿意的灵魂相连。"
 nomads.2130.a: "无上欢愉！"
 nomads.2135.name: "中途"
 nomads.2135.desc: "这从来都不关乎“道路”本身。最重要的是我们共同度过的旅程。我们的族人遵循这一传统已有数百年之久，然而在任何历史文献中，我们都从未发现过这条道路真正的“目的”。它或许早已淹没在时间的长河里。\n\n我们会铭记先辈流传下来的故事，以及他们曾进行的朝圣之旅，但我们不再需要追随他们的脚步。比起他们，我们对生命、银河系以及自身都有了更深刻的认知。他们所坚持的真理已不再适用于我们。我们将开辟属于自己的道路。"
 nomads.2135.a: "大道至简，本性具足。"
 nomads.2140.name: "接纳混乱"
 nomads.2140.desc: "现在一切都清晰了。我们祖先的神圣遗址是病态甜美的希望和信仰灯塔。那些先我们而来的人毫无羞耻之心，也不在乎别人是否知道。\n\n我们的声誉已被轻视和玷污。我们有能力圣化新的地点，以传达我们更新后的精神使命。\n\n神灵是复杂且被误解的。通过这条“大道”，祂们教导我们冲突是我们社会的自然特征。我们克服的挑战使我们变得更强大。现在我们将向整个星系展示我们的力量！"
 nomads.2140.a: "这就是我们的圣战。"
 # Sacred Modifiers
 first_light_guidance: "第一光芒的引导"
