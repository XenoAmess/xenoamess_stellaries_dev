 contract_shoreleave_crew_1: "泊岸小憩"
 contract_shoreleave_crew_1_desc: "[GetShoreleaveCrewDesc1]"
 contract_shoreleave_crew_1_regular_desc: "船员们需要休息。我们将停靠港口，给船员们一些时间去踏上并非他们亲手建造的土地，去见见他们还不认识的面孔。"
 contract_shoreleave_crew_1_gestalt_desc: "长期封闭正在削弱子个体的适应性。让它们在下方的定居点轮转，穿越陌生的地形与环境，将能恢复其性能。"
 contract_shoreleave_crew_1_lore_issued: "[GetShoreleaveCrewLoreIssued1]"
 contract_shoreleave_crew_1_regular_lore_issued: "§L‘新土地、新面孔，还没有值勤表。你还有什么不满意的呢？’§!"
 contract_shoreleave_crew_1_gestalt_lore_issued: "§L“子个体正在部署至地表。新的地形，新的刺激，新的数据。飞船无法提供陌生土地所能给予的一切。”§!"
 contract_shoreleave_crew_1_lore_completed: "[GetShoreleaveCrewLoreCompleted1]"
 contract_shoreleave_crew_1_regular_lore_completed: "§L‘重力不太对劲，食物也很奇怪。我迫不及待要回船上去了！’§!"
 contract_shoreleave_crew_1_gestalt_lore_completed: "§L“子个体已重新校准并返回。陌生的地形恢复了曾被飞船走廊磨钝的路径。”§!"
 contract_shoreleave_crew_1_lore_failed: "[GetShoreleaveCrewLoreFailed1]"
 contract_shoreleave_crew_1_regular_lore_failed: "§L‘岸上休假取消了。飞船一如既往地嗡嗡作响。这声音还是一如既往的令人安心。’§!"
 contract_shoreleave_crew_1_gestalt_lore_failed: "§L“靠岸部署已取消。子个体将继续基于过时感知运行。性能衰减仍处于可接受范围内。”§!"
