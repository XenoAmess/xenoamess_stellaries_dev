 # Forever Cruise
 #################
 origin_forever_cruise: "永恒巡游"
 origin_forever_cruise_desc: "$cannot_settle$\n这艘永恒巡游舰穿梭于星辰之间，专为追逐奇观与极致体验而生。旅客们只要安坐于恒星观测甲板的日光躺椅上，便能亲眼见证星云在真空中孕育与诞生的全过程。舰上配属的专职船员与服务系统昼夜运转，迎合着每一位乘客一切心血来潮的诉求。"
 origin_forever_cruise_effects: "—游牧起源\n—开局局势：['concept_situation_passenger_satisfaction']\n—开局拥有一个§H船员§!和一个§H旅客§!物种\n—专属£district£ 方舟舰区划：['district:district_ark_forever_cruise']\n—专属岗位：['concept_job_cruise_crew_overseer']\n—可用£zone£ 方舟舰区划特化：$TABBED_NEW_LINE$—['concept_forever_cruise_district_specializations']\n—可用建筑：$TABBED_NEW_LINE$—['concept_forever_cruise_buildings']"
 origin_forever_cruise_secondary_species: "旅客"
 # Citizenships and Living Standards
 citizenship_cruise_passenger: "旅客"
 citizenship_cruise_passenger_tooltip: "该物种的人群是永恒巡游舰上的旅客，专注于舒适、享乐，过上了一种在繁星之间尽享闲适的生活。"
 citizenship_cruise_passenger_tooltip_delayed: "§L欢迎登舰！请注意，零重力蔗糖喷泉持续运行，且完全免费。§!"
 species_is_not_cruise_passenger: "$TRIGGER_FAIL$这个物种不是§Y$citizenship_cruise_passenger$§!。"
 living_standard_cruise_passenger: "予取予求"
 living_standard_cruise_passenger_tooltip: "这种生活标准确保一切需求都能得到满足，即使是心血来潮的诉求也不会被忽视。\n\n除非£consumer_goods£§Y消费品§!出现供给不足，否则§Y人口§!会获得$20_HAPPINESS$。"
 living_standard_cruise_passenger_tooltip_delayed: "§L我们当然会飞近一点，这样就能更好地观赏黑洞了！§!"
 living_standard_cruise_economy_passenger: "合约套餐"
 living_standard_cruise_economy_passenger_tooltip: "报名参加此生难忘之旅，去饱览群星。\n\n§R£pop£ §Y人口§!无法担任$job_cruise_passenger$岗位。§!"
 living_standard_cruise_economy_passenger_tooltip_delayed: "§L您梦想中的星际航行，配备私人*客房。\n\n* 私人客房可能与其他乘客共享。§!"
