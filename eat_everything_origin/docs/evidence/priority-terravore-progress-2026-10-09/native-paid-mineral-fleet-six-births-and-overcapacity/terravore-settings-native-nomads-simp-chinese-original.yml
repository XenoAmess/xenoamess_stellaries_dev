 civic_hired_guns: "枪口朝钱"
 civic_hired_guns_desc: "这个帝国将自己塑造为了一个可雇佣的军事伙伴。虽然总是讨价还价，但在运用致命武力为客户解决麻烦这方面，他们确实是最顶尖的。"
