 contract_suntrip_crew_3_desc: "冷却系统需要在热负载下进行一次完整的排空循环。近恒星轨道能让我们高效地冲洗管线，尽管甲板温度会出现波动。"
 contract_suntrip_crew_3_lore_issued: "[GetSuntripCrewLoreIssued3]"
 contract_suntrip_crew_3_regular_lore_issued: "§L“乘客甲板会变热。然后变冷。接着又变热。告诉他们这就是环境氛围的一部分。”§!"
 contract_suntrip_crew_3_gestalt_lore_issued: "§L“预计乘客甲板会出现温度波动。若被问起，将告知乘客这是环境氛围的一部分。”§!"
 contract_suntrip_crew_3_lore_completed: "§L“所有回路的冷却液压力正常。关于温度的抱怨应该会在一小时左右停止。”§!"
 contract_suntrip_crew_3_lore_failed: "[GetSuntripCrewLoreFailed3]"
 contract_suntrip_crew_3_regular_lore_failed: "§L“冲洗已推迟。我们希望没人注意到舞厅天花板上正在形成的冷凝水。”§!"
