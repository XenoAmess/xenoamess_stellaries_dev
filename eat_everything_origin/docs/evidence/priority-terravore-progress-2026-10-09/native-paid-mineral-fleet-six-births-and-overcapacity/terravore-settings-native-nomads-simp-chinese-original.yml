 TECH_UNLOCK_ARKSHIP_1_CONSTRUCTION_DESC: "§H$tech_arkship_construction$§!\n允许我们的方舟舰使用巨型结构建造菜单建造额外的方舟舰。\n\n§L$tech_arkship_construction_desc$§!"
 tech_arkship_tier_2: "方舟工程"
 tech_arkship_tier_2_desc: "优化的结构设计与改进的引擎系统造就了新一代方舟舰：它们承载着更多关于我们的一切，驶向我们前所未至的远方。"
