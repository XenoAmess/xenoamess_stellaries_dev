 contract_shoreleave_passenger_2: "当地的珍馐"
 contract_shoreleave_passenger_2_desc: "下方星球上的著名餐饮区已同意接待乘客，为他们举办一场由向导带领的当地美食品鉴之旅。"
 contract_shoreleave_passenger_2_lore_issued: "§L“听说街头摊贩卖的东西在盘子里还会动。我得去小刀拉屁股——开个眼了。”§!"
 contract_shoreleave_passenger_2_lore_completed: "§L“我吃了一种我连名字都不会念的东西，现在我满脑子都是它。我们什么时候再回去？”§!"
 contract_shoreleave_passenger_2_lore_failed: "§L“他们取消了美食之旅。从上个周期开始我就一直期待着这个活动了。”§!"
