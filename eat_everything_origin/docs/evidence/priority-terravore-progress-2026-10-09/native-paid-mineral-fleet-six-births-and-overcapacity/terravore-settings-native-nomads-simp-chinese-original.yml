 contract_espionage_support_crew_1: "侦察恒星系"
 contract_espionage_support_crew_1_desc: "船员们对于在这个恒星系遭遇干扰的担忧是合情合理的。侦察卫星能对任何可能打乱我们行程的情况提供提前预警。"
 contract_espionage_support_crew_1_lore_issued: "§L“我们不知道外面有什么，而这正是问题所在。立刻部署卫星。”§!"
 contract_espionage_support_crew_1_lore_completed: "§L“监控已上线。在这个恒星系中，没有任何动静能瞒得过我们。”§!"
 contract_espionage_support_crew_1_lore_failed: "§L“没有卫星，就没有数据。我们等于是闭着眼睛穿行于这个恒星系。”§!"
 contract_espionage_support_crew_1_chain_title: "$contract_espionage_support_crew_1$"
 contract_espionage_support_crew_1_chain_desc: "$contract_espionage_support_crew_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT: "$contract_espionage_support_crew_1$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT_DESC: ""
 contract_espionage_support_crew_2: "外交监听"
 contract_espionage_support_crew_2_desc: "停靠权和边境通行权可能会在毫无预警的情况下被撤销。一颗监控政府通信的监视卫星将告诉我们，这个帝国的热情好客究竟是真诚的还是有条件的。"
 contract_espionage_support_crew_2_lore_issued: "§L“我们停靠时他们面带微笑，但当我们的穿梭机离开时他们会说些什么？是时候弄清真相了。”§!"
 contract_espionage_support_crew_2_lore_completed: "§L“他们的外交电报没有异常。没有撤销通行权的动议，也没有关税提案。我们可以放心地规划接下来的三个停靠站。”§!"
 contract_espionage_support_crew_2_lore_failed: "§L“没有监听，就没有观点。我们只能不得不去相信那些微笑。但我们可没法相信那些微笑。”§!"
 contract_espionage_support_crew_2_chain_title: "$contract_espionage_support_crew_2$"
 contract_espionage_support_crew_2_chain_desc: "$contract_espionage_support_crew_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT: "$contract_espionage_support_crew_2$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT_DESC: ""
 contract_espionage_support_crew_3: "路线安全"
 contract_espionage_support_crew_3_desc: "我们预定航线上的舰队动向、边界变动与军事集结可能会使飞船受困于敌对星区。侦察卫星将为导航提供足够的预警时间，以便规划备用路线。"
 contract_espionage_support_crew_3_lore_issued: "§L“我们可不能蒙着眼睛飞入交战区。在决定走这条航线之前，先把卫星部署好。”§!"
 contract_espionage_support_crew_3_lore_completed: "§L“舰队部署已查明，巡逻计划已记录。导航已规划出两条备用航线。我们绝不会被包围的。”§!"
 contract_espionage_support_crew_3_lore_failed: "§L“卫星未就位。如果有人在我们的航线沿途挑起边境战争，我们得要和乘客同时得知这个消息。”§!"
 contract_espionage_support_crew_3_chain_title: "$contract_espionage_support_crew_3$"
 contract_espionage_support_crew_3_chain_desc: "$contract_espionage_support_crew_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT: "$contract_espionage_support_crew_3$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT_DESC: ""
 contract_espionage_support_crew_4: "贸易杠杆"
 contract_espionage_support_crew_4_desc: "当采购部门了解真实价格时，供应谈判会进展得更加顺利。一颗监控贸易渠道和资源流向的监视卫星，将确保我们的团队在下一个港口不会支付过高的价格。"
 contract_espionage_support_crew_4_lore_issued: "§L“上个港口收了我们三倍的反应堆冷却剂费用。只要你知道他们的批发价，就不会发生这种事。”§!"
 contract_espionage_support_crew_4_lore_completed: "§L“采购部已经拿到了数据。下次补给的费用将只有上次的一半。”§!"
 contract_espionage_support_crew_4_lore_failed: "§L“没有贸易数据。采购部又要摸黑谈判了。他们已经在起草投诉了。”§!"
 contract_espionage_support_crew_4_chain_title: "$contract_espionage_support_crew_4$"
 contract_espionage_support_crew_4_chain_desc: "$contract_espionage_support_crew_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT: "$contract_espionage_support_crew_4$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT_DESC: ""
 contract_espionage_support_crew_5: "威胁评估"
 contract_espionage_support_crew_5_desc: "该地区出现了反游牧情绪的相关报道。侦察卫星将确认这一局势仅仅是空谈，还是正在成为当地的政策。"
 contract_espionage_support_crew_5_lore_issued: "§L“有报告称该地区正在形成游牧民禁区。我们需要知道这究竟是猜测还是政策。”§!"
 contract_espionage_support_crew_5_lore_completed: "§L“评估完成。这只是嘴上说说，并非既定政策。全体人员可以解除戒备，但为防万一，我们将保持卫星在线。”§!"
 contract_espionage_support_crew_5_lore_failed: "§L“未作评估。缺乏数据，关于该区域的所有警告都无可辩驳。”§!"
 contract_espionage_support_crew_5_chain_title: "$contract_espionage_support_crew_5$"
 contract_espionage_support_crew_5_chain_desc: "$contract_espionage_support_crew_5_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_5_PROJECT: "$contract_espionage_support_crew_5$"
