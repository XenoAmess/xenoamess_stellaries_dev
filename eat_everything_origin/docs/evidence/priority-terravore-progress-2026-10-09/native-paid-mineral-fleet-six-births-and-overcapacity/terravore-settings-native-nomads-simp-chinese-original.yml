 nomads.4705.name: "定居完成"
 nomads.4705.desc.regular: "方舟舰§Y[event_target:settling_arkship.GetName]§!的航程就此结束。经过数年的辛勤劳作，拆除了它的基础设施并将其运下重力井后，我们终于准备好将这艘飞船废弃。我们[event_target:player_country.GetSpeciesNamePlural]正在经历一个将被后代铭记的历史时刻。现在，让我们在§Y[event_target:settled_planet.GetName]§!定居吧！"
 nomads.4705.desc.machine: "将所有无人机和基础设施从§Y[event_target:settling_arkship.GetName]§!转移至一颗[event_target:settled_planet.GetPlanetMoon]上，这标志着§Y[event_target:player_country.GetName]§!背离了预言中的未来。现在将开发新的优先队列，以适应定居生活。"
 nomads.4705.desc.hive: "经过多年来对§Y[event_target:settling_arkship.GetName]§!基础设施的筹备以及对我们自身生理机能的改造，进化出更强健的骨骼与优化的肺部，如今我们已准备好定居。这将是§Y[event_target:player_country.GetName]§!生命周期中的一个全新阶段，也许定居生活会很适合我们。"
 nomads.4700.a: "这颗[event_target:settled_planet.GetPlanetMoon]将成为我们新帝国的基石。"
 nomads.4700.settle.tt: "§Y[event_target:player_country.GetName]§!将不再是£nomad£ ['concept_nomadic_empire']，而是作为£planet£ ['concept_settled_empire']定居到§Y[event_target:settled_planet.GetName]§!。\n\n"
 nomads.4700.b: "$nomads.4700.a$"
