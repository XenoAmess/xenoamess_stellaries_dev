 CONTRACT_SUNTRIP_passenger_3_PROJECT_DESC: ""
 contract_suntrip_passenger_4: "日光疗愈度假"
 contract_suntrip_passenger_4_desc: "疗愈中心需要长时间暴露在未经过滤的恒星辐射下，以进行乘客们一直要求的一种奇特的焕新理疗。"
 contract_suntrip_passenger_4_lore_issued: "§L“他们说辐射能让你的细胞膜紧致百分之三。我不知道这是什么意思，但算我一个。”§!"
 contract_suntrip_passenger_4_lore_completed: "§L“我觉得自己年轻了十岁。也许那只是轻微的辐射病。不管怎样，都值了。”§!"
 contract_suntrip_passenger_4_lore_failed: "§L\"没有疗愈。他们只发了香氛毛巾。香氛。毛巾。\"§!"
