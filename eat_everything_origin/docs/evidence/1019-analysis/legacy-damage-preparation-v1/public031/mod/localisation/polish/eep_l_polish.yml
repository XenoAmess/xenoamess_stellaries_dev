l_polish:
 origin_heart_of_devouring:0 "Serce Pochłonięcia"
 origin_heart_of_devouring_desc:0 "Nasza cywilizacja nigdy nie postrzegała światów jako granic. Są pożywieniem, które należy jeszcze obnażyć. Królowa Vivhite rządzi lodowatą wolą: obce życie i całe planety ostatecznie będą należeć do jedynego tronu."
 origin_heart_of_devouring_effects:0 "§YWymaga Nemesis. Tylko ustroje eksterminacji.§! Nowe gry natychmiast przyznają §RStań się Kryzysem§!, zachowując waniliową możliwość awansów gatunków, takich jak psionika. Bazowa wydajność stanowiska tronu wynosi §G+10%§!, plus §G10 punktów procentowych§! na każdy rodzimy poziom kryzysu Nemesis (20%–60% na poziomach 1–5, synchronizowane przy następnej miesięcznej aktualizacji).\nStart z jedną dodatkową równoległą kolejką budowy cywilnej na ojczyźnie oraz statkiem-matką o mocy militarnej w przybliżeniu dwukrotnie większej niż Gray oraz dziesięcioma rodzimymi stoczniami Juggernauta. Umysły Roju, Inteligencje Maszynowe i inne autorytety otrzymują odpowiednio świat Roju, świat Maszyn lub świat Reliktów jako ojczyznę, plus jedną skolonizowaną planetę rozmiaru 20 tego samego typu.\nOjczyzna startuje z §G+2§! pojemności dystryktów. Pożeraj posiadane naturalne kolonie i przywracaj kwalifikującą się populację założycielską; każde skumulowane §Y4§! rodzimej materii dodaje §G1§! dystrykt ojczyzny. Generyczny demontaż tworzy §G100§! populacji na każde skumulowane §Y6§! materii; Terravores zachowują rodzime losowe nagrody. Typowe planety rozmiaru 15–25 zajmują 3–5 lat, a dystrykty korzystają ze standardowych stanowisk.\nDecyzje zapewniają audiencję Królowej, relokację ojczyzny, anulowanie demontażu, przełączniki automatycznego pożerania oraz usuwanie lokalnych wyłączeń. Automatyczne pożeranie jest §Ydomyślnie wyłączone§!; po relokacji była ojczyzna również może zostać automatycznie pożarta. Istniejące zapisy nie otrzymują wstecznych nagród startowych ani ścieżki kryzysu."
 eep_requires_exterminator:0 "Wymaga Pożerającego Roju, Zdecydowanego Ekterminatora, Fanatycznych Oczyszczaczy lub ustroju eksterminacji via scorched-earth."
 decision_eep_devour:0 "Pożeranie: Ofiara dla Jedynego Tronu"
 decision_eep_devour_desc:0 "Vivhite nie uznaje żadnych obcych roszczeń do świata. Zostaw wystarczającą populację założycieli, by go strawić, a następnie sprowadź jego mieszkańców, skorupę i stopiony rdzeń do domu."
 eep_devour_effect:0 "Trawienie zajmuje Q × 2.4 efektywnych miesięcy, zaokrąglone w górę. Po zakończeniu zwraca kwalifikującą się populację założycieli i trwale rozbija źródło. Pojemność jest wymieniana za każde skumulowane 4 Q; generyczny demontaż tworzy 100 populacji na każde skumulowane 6 Q, przenosząc resztki między światami. Terravorzy zachowują rodzime losowe nagrody za konsumpcję. Utrata rdzenia lub walka wstrzymują postęp; ostateczne rozliczenie czeka na zakończenie standardowego oczyszczania."
 eep_source_required:0 "Wymaga posiadanej, pokojowej naturalnej kolonii innej niż związane jądro, włączając światy roju i światy maszyn, z jądrem pod naszą kontrolą. Megastruktury, arki, segmenty pierścieni, Synaptic Lathe i światy nanotechnologiczne są wykluczone."
 eep_seed_required:0 "Źródło musi posiadać co najmniej 100 nieoczyszczających się populacji założycielskiej albo rdzeń musi mieć więcej niż 100, by uzupełnić niedobór. Nigdy nie przenoś ostatniej populacji rdzenia. Pracownicy trawienia nie powstają za darmo."
 eep_material_required:0 "Wymagana jest nienaruszona rodzima materia."
 decision_eep_audience:0 "Audiencja u Królowej Vivhite"
 decision_eep_audience_desc:0 "Wejdź na dwór Serca Pochłonięcia. Vivhite ocenia materię zwróconą jej tronowi i następny świat oznaczony do zniszczenia."
 eep_audience_effect:0 "Odczytaj związany rdzeń, skumulowaną materię, wytwarzanie populacji, aktywne zadania i faktyczny status wniebowstąpienia. Ten raport nie przyznaje żadnych nagród."
 eep_capacity:0 "Serce Pochłonięcia: Skumulowana Materia Światów"
 eep_capacity_desc:0 "Pożarta materia staje się prawdziwą, możliwą do zbudowania pojemnością dystryktu bez zmieniania oryginalnego rozmiaru planety."
 d_eep_core:0 "Serce Pochłonięcia: Tron Vivhite"
 situation_eep_devouring:0 "Pożeranie [Target.GetName]"
 situation_eep_devouring_type:0 "Serce Pochłonięcia: Trawienie Planety"
 situation_eep_devouring_desc:0 "Żadne życie nie zasługuje na zachowanie. Żadna skorupa nie zasługuje na zmarnowanie. [Target.GetName] stanie się częścią jedynej macierzystej planety."
 situation_eep_devouring_monthly_change_tooltip:0 "Zyskaj 1 postępu na każdy efektywny miesiąc. Utrata rdzenia, okupacja lub walka naziemna wstrzymuje postęp. Ostateczne rozliczenie czeka na zakończenie całego standardowego oczyszczania."
 eep_digesting:0 "Obnaż Świat"
 eep_digesting_desc:0 "Zredukuj każdy cel tego świata do karmienia tronu."
 eep_devour_approach:0 "Słuchaj Królowej"
 eep_devour_approach_desc:0 "Kontynuuj trawienie, aż świat się rozpadnie."
 eep_cancel_approach:0 "Wstrzymaj Trawienie"
 eep_cancel_approach_desc:0 "Przerwij demontaż tego świata i wyłącz go z automatycznych wznowień. Już poniesione koszty przeniesienia zarodka i rodzimego Żarłoka nie są zwracane, a nagrody nie są przyznawane. Wyłączenie można cofnąć decyzją o wznowieniu lub udanym ręcznym rozpoczęciu."
 eep_monthly_ready:0 "Tron i kolonia trawiąca dostępne"
 eep_block_core:0 "Tron odłączony: związany rdzeń jest poza naszą kontrolą. Postęp i rozliczenie wstrzymane do czasu odzyskania tego samego świata."
 eep_block_combat:0 "Kolonia trawiąca jest okupowana lub toczy walkę naziemną. Postęp jest wstrzymany."
 eep_block_purge:0 "Trawienie zakończone. Oczekiwanie na zakończenie standardowego oczyszczania; bez przedwczesnego niszczenia populacji ani powtórnej konsumpcji."
 mod_situation_eep_devouring_max_progress_add:0 "Wymagane Miesiące Trawienia"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "Jedyny Tron"
 eep.10.desc:0 "Vivhite stoi w obsydianowym dworze, wpatrując się w mapę gwiazd.\n\nGranice? Jej głos nie nosi ciepła. Nie wyznaczam granic wokół pożywienia.\n\nNie ma obietnic dla obcych, ani litości, ani odwrotu. Wszystko musi karmić to serce. Podbite światy oddadzą swe życie, skorupę i rdzenie. Królowa nie będzie żałować niczego."
 eep.10.a:0 "Poza tronem wszystko może być pożarte."
 eep.11.name:0 "Popioły Świata"
 eep.11.desc:0 "Ostatnia warstwa skorupy odpada. Oceany i miasta straciły swe nazwy; liczy się już tylko ilość zwrócona do rdzenia.\n\nVivhite rzuca okiem na raport bez przyjemności. Następny.\n\nPożarte światy: [Root.eep_worlds]; łączna materia rodzima: [Root.eep_c]; dodana pojemność rdzenia: [Root.eep_d]; populacja wytworzona przez ogólny demontaż: [Root.eep_made]. To zapisuje zakończone rozliczenie. Ta wiadomość nie przyznaje dodatkowej nagrody.\n\nDwór: [Root.GetEEPCourtStage]. Ostatni świat: dodana pojemność [Root.eep_last_capacity]; zwrócona populacja założycielska [Root.eep_last_return]; ogólna produkcja [Root.eep_last_manufactured]."
 eep.11.a:0 "Niech popioły karmią serce."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "Horyzont rdzenia rozszerza się ponownie. Nowe dystrykty obsługują prawdziwe mieszkania i stanowiska; fabryki, komory roju i węzły nerwowe dalej pracują.\n\nVivhite strząsa obce terytorium z mapy gwiazd. Ich przodkowa gleba to zaledwie nasz następny fundament.\n\nSkumulowana materia: [Root.eep_c]; łączna dodatkowa pojemność: [Root.eep_d]; wytworzona populacja: [Root.eep_made]. Królowa rejestruje nowy etap wzrostu bez drugiej nagrody ekonomicznej."
 eep.13.a:0 "Niech staną się fundamentem."
 eep.30.name:0 "Nieodparty Rozkaz"
 eep.30.desc:0 "Nasze legalne psioniczne wniebowstąpienie jest zakończone. Świadomość dworu sięga poprzez rdzeń; koordynacja psioniczna i normalne stanowiska podtrzymują jego rosnące serce.\n\nVivhite postrzega obce echa w Zaświatach jako bezwartościową pozostałość. Nie ma potrzeby ich rozumieć. Tylko zmusić ich do poddania się końcowi.\n\nTa chwila rejestruje już osiągnięte standardowe wniebowstąpienie. Nie przyznaje dodatkowej populacji, pojemności ani uprawnień do wniebowstąpienia."
 eep.30.a:0 "Wola jest prawem."
 eep.31.name:0 "Gwiazdy Przekute w Ostrza"
 eep.31.desc:0 "Nasz progres kryzysu odblokował okręty mineralne. Pożarte minerały karmią flotę, a stopy utrzymują budowę rdzenia; wojna zamyka oba obiegi produkcji.\n\nVivhite obserwuje flotę przechodzącą nad głową. Straty można zastąpić. Wahanie jest zabronione.\n\nDostępność okrętów, koszty i późniejsze etapy podlegają standardowym zasadom. Królowa nie omija żadnego wymagania DLC, wniebowstąpienia ani specjalnego projektu."
 eep.31.a:0 "Skieruj ostrze ku następnemu światu."
 eep.40.name:0 "Tron Odłączony"
 eep.40.desc:0 "Kontrola związanego rdzenia została przerwana. Trawienie ustaje, a nierozliczone nagrody pozostają zaplombowane.\n\nRozkaz Vivhite jest zimny i bezpośredni. Odzyskaj go. Koszt jest nieistotny.\n\nOdzyskanie tego samego rdzenia wznawia zadania. Przeniesienie stolicy nie może stworzyć drugiego serca."
 eep.40.a:0 "Odzyskaj tron za wszelką cenę."
 eep.41.name:0 "Tron Przywrócony"
 eep.41.desc:0 "Pierwotna macierzysta planeta jest ponownie pod naszą kontrolą. Ocalałe kolonie trawiące wznawiają postęp; każde oczekujące zadanie rozlicza się raz na własny paragon.\n\nVivhite nie świętuje. Kontynuuj. Niech zapłacą za opóźnienie wszystkim, co mają."
 eep.41.a:0 "Kontynuuj pożeranie."
 eep.42.name:0 "Serce Ustaje"
 eep.42.desc:0 "Pierwotna macierzysta planeta nie jest już użyteczną kolonią. Serce Pochłonięcia nie ma zapasowego tronu.\n\nNiedokończone zadania kończą się. Nie ma ponownego wiązania stolicy, kopiowania pojemności ani uzupełniania populacji. Ocalałe kolonie kontynuują według standardowych zasad. Ostatni rozkaz Królowej wciąż nie pozostawia miejsca na litość."
 eep.42.a:0 "Pamiętaj o jedynym sercu."
 eep.100.name:0 "Królowa Vivhite: Księga Dworu"
 eep.100.desc:0 "Liczę tylko to, co wróciło na tron.\n\nPowiązana macierzysta: [eep_report_core.GetName]; dwór: [Root.GetEEPCourtStage]\nMateria C: [Root.eep_c]; pozostała pojemność: [Root.eep_c_remainder]/4\nMateria ogólna G: [Root.eep_g]; pozostała populacja: [Root.eep_g_remainder]/6\nŁączna dodana pojemność D: [Root.eep_d]; faktycznie wolne dzielnice: [eep_report_core.eep_free_districts]\nObecna populacja macierzystej: [eep_report_core.eep_actual_pop]; historycznie wytworzono: [Root.eep_made]\nPożarte światy: [Root.eep_worlds]; aktywne zadania: [Root.eep_tasks]; oczekujące rozliczenia końcowe: [Root.eep_waiting]\nOstatni świat: dodana pojemność [Root.eep_last_capacity], powracająca populacja [Root.eep_last_return], wytworzono [Root.eep_last_manufactured]\nStatus tronu: [Root.eep_core_state] (0 dostępny, 1 odłączony, 2 trwale zakończony)\nLegalna psioniczna apoteuza zakończona: [Root.eep_psi] (0 nie, 1 tak)\nFaktyczny etap Nemezis: [Root.eep_crisis] (2 korwety, 3 niszczyciele, 4 krążowniki)\n\nRaport wyłącznie do odczytu. Dzielnice, kwatery, stanowiska i utrzymanie wymagają normalnego zarządzania."
 eep.100.a:0 "Odrzucono."
 eep.100.tasks:0 "Przedstaw zapisy trawienia."
 eep.101.name:0 "Kolonia trawiąca: [eep_report_source.GetName]"
 eep.101.desc:0 "Zniszczenie nie jest wymówką. Rozlicz się ze swych postępów.\n\nŹródło: [eep_report_source.GetName]\nŚcieżka: [eep_report_source.GetEEPTaskPath]\nZamrożona materia Q: [eep_report_source.eep_q]\nFaktyczny postęp: [eep_report_source.eep_progress]/[eep_report_source.eep_months] efektywnych miesięcy\nBlokada: [eep_report_source.eep_block_state] (0 normalna, 1 tron odłączony, 2 walka lub okupacja, 3 oczyszczenie końcowe)\n\nZmień podejście w interfejsie sytuacji. Anulowanie lub utrata własności nie przyznaje nagrody za ukończenie."
 eep_stage_0:0 "Tron ustanowiony"
 eep_stage_1:0 "Korona z okruchów światów"
 eep_stage_2:0 "Gwiazdy wracają do Serca"
 eep_stage_3:0 "Dwór Niezliczonych Światów"
 eep_path_native:0 "Terrawor: waniliowa losowa konsumpcja"
 eep_path_generic:0 "Generyczny demontaż: paski z materii skumulowanej"
 eep.32.name:0 "Następne Ostrze Dworu"
 eep.32.desc:0 "Vivhite ogląda właśnie odblokowany kadłub. ‚Ich opór musi skończyć się szybciej niż opór poprzedniego świata.’\n\nAktualny etap Nemezis: [Root.eep_crisis]. Etap 3 odblokowuje $crisis_destroyer$; etap 4 odblokowuje $crisis_cruiser$. Kadłuby, wyposażenie i utrzymanie pozostają waniliowe. Ta wiadomość nie przyznaje żadnej umiejętności ani nagrody."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "Tron Królowej zwiększa wydajność stanowisk ojczyzny: baza +10%, plus 10 punktów procentowych na każdy rodzimy poziom kryzysu Nemesis. Poziomy 1–5 dają 20% / 30% / 40% / 50% / 60%, synchronizowane przy następnej miesięcznej aktualizacji. Bonus podąża za tronem. Istniejące zapisy bez tego kryzysu zachowują bazowe 10%."
 decision_eep_digest_report:0 "Przeczytaj Kronikę Pożerania"
 decision_eep_digest_report_desc:0 "Przedstaw postęp obróbki tej planety. Vivhite obchodzi jedynie wartość, która jeszcze nie dotarła do jej tronu."
 eep_digest_report_effect:0 "Wyświetl postęp pożerania tej planety, powody wstrzymania i oczekujące rozliczenie. Raport nie przyznaje żadnych nagród."
 decision_eep_auto_devour_enable:0 "Włącz automatyczne pożeranie w skali imperium"
 decision_eep_auto_devour_enable_desc:0 "Rozkaz Królowej: każda kwalifikująca się kolonia, z wyjątkiem związanej planety macierzystej, ma zostać pożarta. Nowo przejęte kolonie również podporządkują się temu rozkazowi."
 eep_auto_devour_enable_effect:0 "Włącz przełącznik w skali imperium. Co miesiąc rozpoczynaj pożeranie kwalifikujących się własnych światów innych niż związana planeta macierzysta, z zastrzeżeniem wymogów ziarna założyciela, pokoju oraz własności rdzenia. Domyślnie wyłączone; megastruktury i inne niekwalifikujące się obiekty są pomijane."
 decision_eep_auto_devour_disable:0 "Wyłącz automatyczne pożeranie w skali imperium"
 decision_eep_auto_devour_disable_desc:0 "Wstrzymaj rozkaz ekspansji tronu. Sam wybierz los każdego świata."
 eep_auto_devour_disable_effect:0 "Wyłącz automatyczne uruchamianie nowych zadań w całym imperium. Trwające zadania pożerania są kontynuowane; aby je anulować, skorzystaj z decyzji o demontażu świata źródłowego lub wybierz opcję anulowania w podejściu danej sytuacji."
 eep_parallel_construction:0 "Serce Pożerania: Równoległa budowa"
 eep_parallel_construction_desc:0 "Królowa zarządza jeden dodatkowy cywilny projekt budowy równocześnie na aktualnie związanej planecie macierzystej, gdy pozostaje pod naszą kontrolą. Premia podąża za tronem."
 eep_mothership:0 "Matczyny okręt zagłady Vivhite"
 eep_mothership_desc:0 "Zaprojektowany na bazie okrętu wojennego Graya, dążący do mocy militarnej równej mniej więcej dwukrotności jego wartości. Zawiera dziesięć kolejek rodzimych mobilnych stoczni okrętowych do budowy i napraw. Rzeczywiste wartości różnią się w zależności od modyfikatorów imperium."
 NAME_EEP_Baiqi_Mothership:0 "Werdykt Vivhite"
 NAME_EEP_Throne_World:0 "Danina dla Tronu"
 eep_mothership_ship:0 "Matczynień Werdyktu"
 eep_mothership_ship_plural:0 "Matczynień Verdyktu"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Przenieś Tron tutaj"
 decision_eep_migrate_core_desc:0 "Wola Vivhite nie jest związana z glebą. Ustanów ten świat nową planetą macierzystą i przenieś tu zarówno tron, jak i imperialną stolicę."
 eep_migration_required:0 "Aktualna planeta macierzysta musi pozostawać pod naszą kontrolą. Cel musi być kwalifikującą się własną kolonią, wolną od okupacji i walk naziemnych, ani sztuczną, ani pożeraną, i nie może dzierżyć innego tronu."
 eep_migration_effect:0 "Przenieś tu powiązanie planety macierzystej, imperialną stolicę, premię stanowiska tronu, zgromadzoną pojemność dystryktów oraz dodatkową kolejkę równoległej budowy. Populacja, budynki, zapasy i rejestry pożerania zostają zachowane. Pozostałe zadania rozbiórki trwają dalej, a ich dochody trafiają do nowej planety macierzystej. §RJeśli włączone jest automatyczne pożeranie w skali całego imperium, była planeta macierzysta może następnie zostać zautomatycznie rozebrana.§!"
 decision_eep_cancel_devour:0 "Anuluj demontaż tego świata"
 decision_eep_cancel_devour_desc:0 "Wycofaj rozkaz demontażu tego świata. Królowa zezwala na zmianę rozkazu, lecz nie wymaza już poniesionych kosztów."
 eep_cancel_devour_effect:0 "Natychmiast przerwij sytuację pożerania tego świata i usuń blokady demontażu tej modyfikacji, nie przyznając nagród. Już przeniesiony zarodkowy popul i obrażenia rodzimego Żarłoka pozostają. Przyznaj temu światu wyłączenie z automatycznego pożerania, aby zapobiec wznowieniu w następnym miesiącu; cofnięcie możliwe decyzją o wznowieniu lub udanym ręcznym rozpoczęciu. Pozostałe zadania i przełącznik obejmujący całe imperium pozostają."
 decision_eep_resume_auto_devour:0 "Wznów tu automatyczne pożeranie"
 decision_eep_resume_auto_devour_desc:0 "Cofnij tymczasową karencję tego świata i przywróć go pod rozkaz pożerania imperium."
 eep_resume_auto_devour_effect:0 "Usuń jedynie wyłączenie automatycznego pożerania tego świata. Jeśli automatyczne pożeranie w całym imperium jest włączone, następny comiesięczny skan podejmie normalną próbę rozpoczęcia; w przeciwnym razie nadal wymagane jest ręczne rozpoczęcie."
 d_eep_core_desc:0 "Wola Królowej zbiega się tutaj. Premie Tronu i zgromadzona pojemność dystryktów mogą podążyć za decyzją o relokacji macierzystej planety. Premie Dworu obowiązują jedynie tak długo, jak kontrolujemy związaną macierzystą planetę; jej utrata nigdy nie powoduje automatycznego wyboru zastępczego tronu."
