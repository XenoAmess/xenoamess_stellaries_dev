l_english:
 origin_heart_of_devouring:0 "Heart of Devouring"
 origin_heart_of_devouring_desc:0 "Our civilization never regarded worlds as borders. They are food yet to be stripped bare. Queen Vivhite rules with an icy will: alien lives and entire planets will eventually belong to the only throne."
 origin_heart_of_devouring_effects:0 "§YRequires Nemesis. Extermination civics only.§! New games immediately grant §RBecome the Crisis§!, retaining vanilla eligibility for species ascensions such as psionics. Throne job output starts at §G+10%§!, plus §G10 percentage points§! per native Nemesis crisis level (20%–60% at levels 1–5, synchronized by the next monthly update).\nStart with one extra parallel civilian construction queue on the homeworld and a mothership with Relic-class dreadnought equipment, a working jump drive, dark matter propulsion and ten mobile shipyards. Hive Minds, Machine Intelligences and other authorities receive a Hive World, Machine World or Relic World homeworld respectively, without an extra colony. The mothership gains one uncapped level per 10 effective matter consumed; each level adds +5% damage, hull, armor and shields. Its Voracious Deconstruction Beam dismantles wartime enemy colonies for the homeworld without armies.\nThe homeworld starts with §G+2§! district capacity. Devour owned natural colonies and return eligible founder population; every cumulative §Y4§! native matter adds §G1§! homeworld district. Generic dismantling creates §G100§! population per cumulative §Y6§! matter; Terravores retain native random rewards. Typical size 15–25 worlds take 3–5 years and districts use normal jobs.\nColonial decisions provide the Queen's audience, homeworld relocation, dismantling cancellation, automatic-devouring switches and local exemption removal. Automatic devouring is §Ydisabled by default§!; after relocation the former homeworld may also be devoured automatically. Existing saves receive no retroactive startup rewards or crisis path."
 eep_requires_exterminator:0 "Requires Devouring Swarm, Determined Exterminator, Fanatic Purifiers, or an extermination scorched-earth civic."
 decision_eep_devour:0 "Devour: Offer to the Only Throne"
 decision_eep_devour_desc:0 "Vivhite recognizes no alien claim to a world. Leave enough founder population to digest it, then bring its inhabitants, crust and molten core home."
 eep_devour_effect:0 "Digestion takes Q × 2.4 effective months, rounded up. Completion returns eligible founder population and permanently shatters the source. Capacity is exchanged per cumulative 4 Q; generic dismantling creates 100 population per cumulative 6 Q, carrying remainders across worlds. Terravores retain native random consumption rewards. Core loss or combat pauses progress; final settlement waits for vanilla purging to end."
 eep_source_required:0 "Requires an owned, peaceful natural colony other than the bound core, including Hive Worlds and Machine Worlds, with the core under our control. Megastructures, arks, ring segments, the Synaptic Lathe and nanotech worlds are excluded."
 eep_seed_required:0 "The source needs at least 100 non-purging founder population, or the core needs more than 100 to supply the shortfall. Never relocate the core’s last population. Digestion workers are not created for free."
 eep_material_required:0 "Undamaged native matter is required."
 decision_eep_audience:0 "Audience with Queen Vivhite"
 decision_eep_audience_desc:0 "Enter the court of the Heart of Devouring. Vivhite judges the matter returned to her throne and the next world marked for destruction."
 eep_audience_effect:0 "Read the bound core, cumulative matter, population manufacturing, active tasks and actual ascension status. This report grants no rewards."
 eep_capacity:0 "Heart of Devouring: Accumulated World Matter"
 eep_capacity_desc:0 "Devoured matter becomes genuine buildable district capacity without changing the planet's original size."
 d_eep_core:0 "Heart of Devouring: Vivhite's Throne"
 d_eep_core_desc:0 "The Queen's will converges here. Throne bonuses and accumulated district capacity can follow a homeworld relocation decision. Court bonuses apply only while we control the bound homeworld; losing it never selects a replacement throne automatically."
 situation_eep_devouring:0 "Devouring [Target.GetName]"
 situation_eep_devouring_type:0 "Heart of Devouring: Planetary Digestion"
 situation_eep_devouring_desc:0 "No life deserves preservation. No crust deserves waste. [Target.GetName] will become part of the only homeworld."
 situation_eep_devouring_monthly_change_tooltip:0 "Gain 1 progress each effective month. Core loss, occupation or ground combat pauses progress. Final settlement waits for all vanilla purging to finish."
 eep_digesting:0 "Strip the World"
 eep_digesting_desc:0 "Reduce every purpose of this world to feeding the throne."
 eep_devour_approach:0 "Obey the Queen"
 eep_devour_approach_desc:0 "Continue digestion until the world shatters."
 eep_cancel_approach:0 "Halt Digestion"
 eep_cancel_approach_desc:0 "Abort this world's dismantling and exempt it from automatic restarts. Existing seed relocation and native Terravore costs are not refunded, and no rewards are granted. A resume decision or successful manual start removes the exemption."
 eep_monthly_ready:0 "Throne and digestion colony available"
 eep_block_core:0 "Throne disconnected: the bound core is outside our control. Progress and settlement pause until this same world is recovered."
 eep_block_combat:0 "The digestion colony is occupied or fighting a ground battle. Progress is paused."
 eep_block_purge:0 "Digestion is complete. Waiting for vanilla purging to finish; no premature population destruction or repeated consumption."
 mod_situation_eep_devouring_max_progress_add:0 "Required Digestion Months"
 mod_situation_eep_devouring_max_progress_mult:0 "$mod_situation_eep_devouring_max_progress_add$"
 eep.10.name:0 "The Only Throne"
 eep.10.desc:0 "Vivhite stands in the obsidian court, gazing down at the star chart.\n\nBorders? Her voice carries no warmth. I do not draw borders around food.\n\nThere are no promises to aliens, no mercy and no retreat. Everything must feed this heart. Conquered worlds will surrender their lives, crust and cores. The Queen will regret none of it."
 eep.10.a:0 "Beyond the throne, all may be devoured."
 eep.11.name:0 "The Ashes of a World"
 eep.11.desc:0 "The last crust peels away. Oceans and cities have lost their names; only the quantity returned to the core remains.\n\nVivhite glances at the report without pleasure. Next.\n\nWorlds consumed: [Root.eep_worlds]; cumulative native matter: [Root.eep_c]; added core capacity: [Root.eep_d]; population manufactured by generic dismantling: [Root.eep_made]. These record completed settlement. This message grants no additional reward.\n\nCourt: [Root.GetEEPCourtStage]. Latest world: capacity added [Root.eep_last_capacity]; founder population returned [Root.eep_last_return]; generic manufacture [Root.eep_last_manufactured]."
 eep.11.a:0 "Let the ashes feed the heart."
 eep.13.name:0 "[Root.GetEEPCourtStage]"
 eep.13.desc:0 "The core's horizon expands again. New districts support real housing and jobs; factories, hive chambers and neural hubs keep working.\n\nVivhite brushes an alien territory from the star chart. Their ancestral soil is merely our next foundation.\n\nCumulative matter: [Root.eep_c]; total bonus capacity: [Root.eep_d]; manufactured population: [Root.eep_made]. The Queen records a new growth stage without a second economic reward."
 eep.13.a:0 "Make them the foundation."
 eep.30.name:0 "An Irresistible Will"
 eep.30.desc:0 "Our lawful psionic ascension is complete. The court's consciousness reaches across the core; psionic coordination and normal jobs sustain its growing heart.\n\nVivhite regards alien echoes in the Shroud as worthless residue. There is no need to understand them. Only to make them submit to the end.\n\nThis moment records vanilla ascension already achieved. It grants no extra population, capacity or ascension eligibility."
 eep.30.a:0 "Will is law."
 eep.31.name:0 "Stars Forged into Blades"
 eep.31.desc:0 "Our crisis progression has unlocked mineral ships. Devoured minerals feed the fleet while alloys sustain core construction; war closes both production loops.\n\nVivhite watches the fleet pass overhead. Losses can be replaced. Hesitation is forbidden.\n\nShip availability, costs and later stages follow vanilla rules. The Queen bypasses no DLC, ascension or special project requirement."
 eep.31.a:0 "Point the blade at the next world."
 eep.40.name:0 "Throne Disconnected"
 eep.40.desc:0 "Control of the bound core has been interrupted. Digestion stops and unsettled rewards remain sealed.\n\nVivhite's order is cold and direct. Recover it. The cost is irrelevant.\n\nRecovering the same core resumes tasks. Moving the capital cannot create a second heart."
 eep.40.a:0 "Recover the throne at any cost."
 eep.41.name:0 "The Throne Restored"
 eep.41.desc:0 "The original homeworld is under our control again. Surviving digestion colonies resume progress; each pending task settles once against its own receipt.\n\nVivhite does not celebrate. Continue. Make them pay for the delay with everything they have."
 eep.41.a:0 "Continue devouring."
 eep.42.name:0 "The Heart Stops"
 eep.42.desc:0 "The original homeworld is no longer a usable colony. The Heart of Devouring has no replacement throne.\n\nUnfinished tasks end. There is no capital rebinding, copied capacity or replacement population. Surviving colonies continue under vanilla rules. The Queen's final order still leaves no room for mercy."
 eep.42.a:0 "Remember the only heart."
 eep.100.name:0 "Queen Vivhite: Court Ledger"
 eep.100.desc:0 "I count only what has returned to the throne.\n\nBound core: [eep_report_core.GetName]; court: [Root.GetEEPCourtStage]\nMatter C: [Root.eep_c]; capacity remainder: [Root.eep_c_remainder]/4\nGeneric matter G: [Root.eep_g]; population remainder: [Root.eep_g_remainder]/6\nTotal added capacity D: [Root.eep_d]; actual free districts: [eep_report_core.eep_free_districts]\nCurrent core population: [eep_report_core.eep_actual_pop]; historically manufactured: [Root.eep_made]\nWorlds consumed: [Root.eep_worlds]; active tasks: [Root.eep_tasks]; final settlements waiting: [Root.eep_waiting]\nLatest world: capacity added [Root.eep_last_capacity], returned population [Root.eep_last_return], manufactured [Root.eep_last_manufactured]\nThrone status: [Root.eep_core_state] (0 available, 1 disconnected, 2 permanently ended)\nLawful psionic ascension complete: [Root.eep_psi] (0 no, 1 yes)\nActual Nemesis stage: [Root.eep_crisis] (2 corvettes, 3 destroyers, 4 cruisers)\n\nRead-only report. Districts, housing, jobs and upkeep require normal management.\n\n$eep_evolution_report$"
 eep.100.a:0 "Dismissed."
 eep.100.tasks:0 "Present the digestion records."
 eep.101.name:0 "Digestion Colony: [eep_report_source.GetName]"
 eep.101.desc:0 "Destruction is no excuse. Account for your progress.\n\nSource: [eep_report_source.GetName]\nPath: [eep_report_source.GetEEPTaskPath]\nFrozen matter Q: [eep_report_source.eep_q]\nActual progress: [eep_report_source.eep_progress]/[eep_report_source.eep_months] effective months\nBlocker: [eep_report_source.eep_block_state] (0 normal, 1 throne disconnected, 2 combat or occupation, 3 final purge)\n\nChange approaches in the situation interface. Cancellation or ownership loss grants no completion reward."
 eep_stage_0:0 "Throne Established"
 eep_stage_1:0 "Crown of Shattered Worlds"
 eep_stage_2:0 "Stars Return to the Heart"
 eep_stage_3:0 "Court of Countless Worlds"
 eep_path_native:0 "Terravore: vanilla random consumption"
 eep_path_generic:0 "Generic dismantling: population from cumulative matter"
 eep.32.name:0 "The Court’s Next Blade"
 eep.32.desc:0 "Vivhite examines the newly unlocked hull. Their resistance must end sooner than that of the last world.\n\nActual Nemesis stage: [Root.eep_crisis]. Stage 3 unlocks $crisis_destroyer$; stage 4 unlocks $crisis_cruiser$. Hulls, fitting and upkeep remain vanilla. This message grants no ability or reward."
 eep_court:0 "$d_eep_core$"
 eep_court_desc:0 "The Queen's throne increases homeworld job output: +10% base, plus 10 percentage points per native Nemesis crisis level. Levels 1–5 yield 20% / 30% / 40% / 50% / 60%, synchronized by the next monthly update. The bonus follows the throne. Existing saves without this crisis retain the base 10%."
 decision_eep_digest_report:0 "Read the Devouring Chronicle"
 decision_eep_digest_report_desc:0 "Present this world's stripping progress. Vivhite cares only for the value that has yet to reach her throne."
 eep_digest_report_effect:0 "View this world's devouring progress, pause reasons and pending settlement. The report grants no rewards."
 decision_eep_auto_devour_enable:0 "Enable Empire-wide Automatic Devouring"
 decision_eep_auto_devour_enable_desc:0 "The Queen commands every eligible colony except the bound homeworld to be devoured. Newly acquired colonies will also obey this order."
 eep_auto_devour_enable_effect:0 "Enable the empire-wide switch. Each month, begin devouring eligible owned worlds other than the bound homeworld, subject to founder seed, peace and core ownership requirements. Disabled by default; megastructures and other ineligible objects are skipped."
 decision_eep_auto_devour_disable:0 "Disable Empire-wide Automatic Devouring"
 decision_eep_auto_devour_disable_desc:0 "Suspend the throne's expansion order. Choose the fate of each world yourself."
 eep_auto_devour_disable_effect:0 "Disable automatic initiation of new tasks throughout the empire. Existing devouring tasks continue; cancel one through its source world's dismantling decision or its situation approach."
 eep_parallel_construction:0 "Heart of Devouring: Parallel Construction"
 eep_parallel_construction_desc:0 "The Queen commands one additional civilian construction project to advance simultaneously on the currently bound homeworld while under our control. This bonus follows the throne."
 eep_mothership:0 "Vivhite's Devastation Mothership"
 eep_mothership_desc:0 "Relic-class dreadnought weapons, defenses and core technology, with a working jump drive, dark matter propulsion and ten mobile shipyards. Gains one uncapped evolution level per 10 matter consumed. Actual values depend on empire modifiers."
 NAME_EEP_Baiqi_Mothership:0 "Vivhite's Verdict"
 NAME_EEP_Throne_World:0 "Tribute to the Throne"
 eep_mothership_ship:0 "Verdict Mothership"
 eep_mothership_ship_plural:0 "Verdict Motherships"
 starbase_level_eep_mothership:0 "$eep_mothership_ship$"
 decision_eep_migrate_core:0 "Move the Throne Here"
 decision_eep_migrate_core_desc:0 "Vivhite's will is not bound to soil. Establish this world as the new homeworld and move both the throne and imperial capital here."
 eep_migration_required:0 "The current homeworld must remain under our control. The destination must be an eligible owned colony, free of occupation and ground combat, neither artificial nor being devoured, and must not hold another throne."
 eep_migration_effect:0 "Move the homeworld binding, imperial capital, throne job bonus, accumulated district capacity and granted additional parallel construction queue here. Population, buildings, stockpiles and devouring ledgers are preserved. Other dismantling tasks continue and deliver their proceeds to the new homeworld. §RIf empire-wide automatic devouring is enabled, the former homeworld may subsequently be dismantled automatically.§!"
 decision_eep_cancel_devour:0 "Cancel This World's Dismantling"
 decision_eep_cancel_devour_desc:0 "Withdraw the order to dismantle this world. The Queen permits a changed command, but will not erase the costs already paid."
 eep_cancel_devour_effect:0 "Immediately abort this world's devouring situation and remove this Mod's dismantling locks, granting no rewards. Founder seed already relocated and native Terravore damage remain. Exempt this world from automatic devouring to prevent a restart next month; a resume decision or successful manual start removes the exemption. Other tasks and the empire-wide switch are preserved."
 decision_eep_resume_auto_devour:0 "Resume Automatic Devouring Here"
 decision_eep_resume_auto_devour_desc:0 "Revoke this world's temporary reprieve and return it to the empire's devouring command."
 eep_resume_auto_devour_effect:0 "Remove only this world's automatic-devouring exemption. If empire-wide automatic devouring is enabled, the next monthly scan attempts a normal start; otherwise a manual start is still required."
 NAME_EEP_Baiqi_Mothership_1019:0 "$NAME_EEP_Baiqi_Mothership$"
 EEP_PLANET_KILLER_DEVOURER:0 "Voracious Deconstruction Beam"
 EEP_PLANET_KILLER_DEVOURER_DESC:0 "Dismantles a natural colony for the homeworld without armies. Targets owned non-core colonies or enemy colonies during war. Completed firing grants capacity, population and mothership growth from effective world size. Generic dismantling creates 100 founder population per 6 matter; Terravores retain native random rewards. Cancelled shots grant nothing."
 eep_colossus_target_required:0 "Requires your mothership, an available homeworld, and an owned non-core or wartime enemy natural colony with more than 0 effective matter. Cannot target any empire's homeworld core, artificial worlds, ongoing colonization, ground battles, active devouring tasks or previously settled worlds."
 eep_mothership_evolution:0 "Devouring Symbiosis: Unlimited Evolution"
 eep_mothership_evolution_desc:0 "Gain one evolution level per 10 cumulative effective matter, with no level cap. Each level adds +5% damage, hull, armor and shields, plus 0.1 daily hull and armor regeneration."
 eep_evolution_report:0 "Mothership evolution level: [Root.eep_mothership_level]; matter to next level: [Root.eep_mothership_next]. Each level adds +5% damage, hull, armor and shields. One level per 10 matter, with no level cap.$eep_component_report$"
 EEP_PLANET_KILLER_DEVOURER_ACTION:0 "Dismantle World"
 FLEETORDER_DESTROY_PLANET_WITH_EEP_PLANET_KILLER_DEVOURER:0 "Preparing to dismantle $PLANET|Y$"
 EEP_ADAPTIVE_SHIELD_CORE:0 "Adaptive Shield Core"
 EEP_ADAPTIVE_SHIELD_CORE_DESC:0 "Each rank adds 10% shields. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_shield_core:0 "Adaptive Shield Core"
 EEP_ADAPTIVE_ARMOR_CORE:0 "Adaptive Armor Core"
 EEP_ADAPTIVE_ARMOR_CORE_DESC:0 "Each rank adds 10% armor. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_armor_core:0 "Adaptive Armor Core"
 EEP_ADAPTIVE_HULL_CORE:0 "Adaptive Hull Core"
 EEP_ADAPTIVE_HULL_CORE_DESC:0 "Each rank adds 10% hull. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_hull_core:0 "Adaptive Hull Core"
 EEP_ADAPTIVE_DAMAGE_CORE:0 "Adaptive Firepower Core"
 EEP_ADAPTIVE_DAMAGE_CORE_DESC:0 "Each rank adds 5% weapon damage. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_damage_core:0 "Adaptive Firepower Core"
 EEP_ADAPTIVE_TRACKING_CORE:0 "Adaptive Tracking Core"
 EEP_ADAPTIVE_TRACKING_CORE_DESC:0 "Each rank adds 3 tracking points. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_tracking_core:0 "Adaptive Tracking Core"
 EEP_ADAPTIVE_REGEN_CORE:0 "Adaptive Regeneration Core"
 EEP_ADAPTIVE_REGEN_CORE_DESC:0 "Each rank adds 0.2 fixed daily hull and 0.2 armor regeneration. Every five evolution levels, one of six cores is chosen with equal probability and permanently gains one rank. This core adds no power or upkeep cost."
 eep_adaptive_regen_core:0 "Adaptive Regeneration Core"
 eep_component_report:0 "\n\n§HCore Upgrade Record§!\nEntitled: [Root.eep_component_entitled]; awarded: [Root.eep_component_rewards]; pending: [Root.eep_component_pending]\nLast confirmed ranks: shields [Root.eep_component_shield_level] / armor [Root.eep_component_armor_level] / hull [Root.eep_component_hull_level] / firepower [Root.eep_component_damage_level] / tracking [Root.eep_component_tracking_level] / regeneration [Root.eep_component_regen_level].\nEvery five levels permanently upgrades one of six cores at random. Large backlogs are awarded in batches. Upgrades stop if the mothership is destroyed or unavailable; its history is retained and does not represent active components. Zero is shown if no record exists."
 eep_mothership_section:0 "Verdict-class Mothership Core"
 eep_mothership_section_1019:0 "Verdict-class Symbiotic Hull"
