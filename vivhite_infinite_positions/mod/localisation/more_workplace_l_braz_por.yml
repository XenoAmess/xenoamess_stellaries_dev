l_braz_por:
 decision_extend_workplace_expand: "Expandir os planos de ampliação de empregos"
 decision_extend_workplace_expand_desc: "Exibe todas as decisões de ampliação de empregos fornecidas por este mod. O estado expandido vale apenas para a colônia atual e é preservado nos jogos salvos."
 decision_extend_workplace_collapse: "Recolher os planos de ampliação de empregos"
 decision_extend_workplace_collapse_desc: "Oculta as decisões de ampliação de empregos deste mod, deixando apenas a opção de expandir a lista novamente."

 mod_extend_urban_workplace: "Núcleo urbano ampliado"
 mod_extend_urban_workplace_desc: "Uma vasta supercidade com pontes de trânsito orbital e corredores verticais de transporte. Este núcleo urbano em constante crescimento oferece moradias modernas e serviços públicos para bilhões."
 decision_00_extend_urban_workplace: "Plano 00: Elaborar um programa planetário de expansão urbana"
 decision_00_extend_urban_workplace_desc: "Ao redesenhar o tecido urbano e modernizar as redes de trânsito orbital, podemos aumentar a capacidade deste mundo para sustentar sua população e economia crescentes."

 mod_extend_unity_workplace: "Torre de comando administrativo ampliada"
 mod_extend_unity_workplace_desc: "Altas torres holográficas abrigam sistemas decisórios auxiliados por computação quântica e redes administrativas interestelares. Autoridades e conselheiros de IA coordenam aqui a política imperial."
 decision_01_extend_unity_workplace: "Plano 01: Otimizar a administração imperial"
 decision_01_extend_unity_workplace_desc: "Um governo eficiente é a base de uma civilização coesa. Simplificaremos a estrutura administrativa e implantaremos sistemas colaborativos para gerir assuntos cada vez mais complexos."

 mod_extend_enforcer_workplace: "Diretoria de segurança planetária ampliada"
 mod_extend_enforcer_workplace_desc: "Estações de vigilância orbital e bastiões policiais com dissuasão neural e previsão de crimes em tempo real reprimem distúrbios e criminalidade com eficiência implacável."
 decision_02_extend_enforcer_workplace: "Plano 02: Reforçar a rede de segurança planetária"
 decision_02_extend_enforcer_workplace_desc: "Construindo mais estações de segurança e postos de patrulha, e empregando agentes rigorosamente treinados, podemos conter o crime e preservar a estabilidade planetária."

 mod_extend_trade_workplace: "Centro comercial interestelar ampliado"
 mod_extend_trade_workplace_desc: "Um complexo comercial que atravessa sistemas estelares, centrado em um imenso porto ligado a dezenas de hipervias. Logística automatizada, compensação em tempo real e mercadores distribuem riqueza pelo império."
 decision_03_extend_trade_workplace: "Plano 03: Ativar um centro comercial interestelar unificado"
 decision_03_extend_trade_workplace_desc: "Novos complexos comerciais, portos interestelares e políticas favoráveis à circulação revitalizarão a economia deste mundo e ampliarão o comércio entre sistemas."

 mod_extend_physics_res_workplace: "Instituto de física quântica ampliado"
 mod_extend_physics_res_workplace_desc: "Imensos anéis colisores subterrâneos e observatórios de campo de vácuo recriam as condições extremas do universo primordial. Pesquisadores estudam o espaço-tempo, a matéria escura e dimensões superiores."
 decision_04_extend_physics_res_workplace: "Plano 04: Ampliar os aceleradores de partículas de alta energia"
 decision_04_extend_physics_res_workplace_desc: "Plataformas de colisão e observatórios adicionais nos permitirão investigar a natureza do espaço-tempo, da energia e da matéria com alcance experimental sem precedentes."

 mod_extend_society_res_workplace: "Complexo de simulação social ampliado"
 mod_extend_society_res_workplace_desc: "Um mecanismo de evolução social simula bilhões de indivíduos virtuais, milênios de mudanças institucionais e conflitos entre culturas alienígenas para aperfeiçoar nossos sistemas de governo."
 decision_05_extend_society_res_workplace: "Plano 05: Construir um sistema de simulação da evolução social"
 decision_05_extend_society_res_workplace_desc: "O progresso também depende de compreender como as sociedades se organizam. Novos laboratórios estudarão gestão populacional, culturas alienígenas e instituições políticas."

 mod_extend_engineering_res_workplace: "Instituto de engenharia de megaestruturas ampliado"
 mod_extend_engineering_res_workplace_desc: "Plataformas de montagem em gravidade zero, fundições de metamateriais e centros de projeto auxiliados por IA formam um campus onde esferas de Dyson e naves titânicas se tornam planos viáveis."
 decision_06_extend_engineering_res_workplace: "Plano 06: Construir uma plataforma experimental de megaestruturas"
 decision_06_extend_engineering_res_workplace_desc: "Para transformar teoria em frotas poderosas e monumentos espaciais, criaremos um centro integrado de testes de materiais, projeto estrutural e técnicas avançadas de construção."

 mod_extend_artisan_alloys_workplace: "Complexo de fundições de ligas ampliado"
 mod_extend_artisan_alloys_workplace_desc: "Um conjunto incansável de fornos emprega ativação de nêutrons e reestruturação de redes em nanoescala. Linhas automatizadas forjam minérios do manto em blindagens e estruturas para a frota."
 decision_07_extend_artisan_alloys_workplace: "Plano 07: Implantar linhas avançadas de produção de ligas"
 decision_07_extend_artisan_alloys_workplace_desc: "Guerra e expansão geram uma demanda insaciável por ligas. Mais linhas de fundição e processos de reciclagem eficientes abastecerão nossas frotas e megaestruturas."

 mod_extend_artisan_consumer_workplace: "Complexo de indústrias civis ampliado"
 mod_extend_artisan_consumer_workplace_desc: "Linhas automatizadas e oficinas de montagem molecular fabricam de terminais inteligentes a roupas de luxo. Bens abundantes melhoram a vida cotidiana e sustentam a administração e a pesquisa."
 decision_08_extend_artisan_consumer_workplace: "Plano 08: Otimizar as linhas de bens de consumo"
 decision_08_extend_artisan_consumer_workplace_desc: "Um alto padrão de vida e o funcionamento da administração e da pesquisa exigem um fornecimento confiável de bens de consumo. Este plano ampliará as instalações de montagem."

 mod_extend_generator_workplace: "Nexo energético planetário ampliado"
 mod_extend_generator_workplace_desc: "Conjuntos de reatores de fusão e anéis de armazenamento supercondutor formam um coração energético planetário ligado a uma rede solar orbital que alimenta cada cidade e fábrica."
 decision_09_extend_generator_workplace: "Plano 09: Modernizar a rede de energia de fusão"
 decision_09_extend_generator_workplace_desc: "Converter a rede para sistemas supercondutores e ampliar sua capacidade melhorará a distribuição, sustentará mais reatores e aumentará consideravelmente a produção de energia."

 mod_extend_mining_workplace: "Complexo de mineração profunda ampliado"
 mod_extend_mining_workplace_desc: "Perfuratrizes ultraprofundas e sistemas de fraturamento a plasma avançam rumo ao manto planetário. Guiados por levantamentos gravimétricos, extraem continuamente metais raros e minerais estratégicos."
 decision_10_extend_mining_workplace: "Plano 10: Explorar ricos veios minerais do manto"
 decision_10_extend_mining_workplace_desc: "Os levantamentos gravimétricos e as técnicas de perfuração sísmica mais recentes alcançarão ricos veios profundos na crosta e aumentarão muito a extração total de minerais."

 mod_extend_agri_workplace: "Complexo agrícola vertical ampliado"
 mod_extend_agri_workplace_desc: "Centenas de níveis de torres agrícolas controladas usam hidroponia e aeroponia para produzir grãos, proteína sintética e especiarias raras, garantindo a segurança alimentar do império."
 decision_11_extend_agri_workplace: "Plano 11: Ampliar as arcologias agrícolas verticais"
 decision_11_extend_agri_workplace_desc: "Para aproveitar ao máximo as terras limitadas, construiremos ecossistemas agrícolas em vários níveis. Essas fazendas verticais aumentarão a produção e garantirão o abastecimento imperial."

 mod_extend_soldier_workplace: "Rede de fortalezas planetárias ampliada"
 mod_extend_soldier_workplace_desc: "Plataformas de defesa orbital, fortalezas de artilharia terrestre e geradores de escudo planetário formam uma defesa em camadas guarnecida por tropas de elite."
 decision_12_extend_soldier_workplace: "Plano 12: Construir fortalezas de comando defensivo planetário"
 decision_12_extend_soldier_workplace_desc: "Mais plataformas orbitais, fortalezas terrestres e guardas planetários profissionais fortalecerão nossa capacidade naval e criarão uma linha de defesa inexpugnável."

 mod_extend_bio_trophy_workplace: "Rede de santuários orgânicos ampliada"
 mod_extend_bio_trophy_workplace_desc: "Uma rede de cúpulas ecológicas, centros culturais e sistemas automatizados de cuidado, mantida por Servidores Descontrolados, oferece um lar seguro e confortável para mais seres orgânicos."
 decision_13_extend_bio_trophy_workplace: "Plano 13: Ampliar a capacidade dos santuários orgânicos"
 decision_13_extend_bio_trophy_workplace_desc: "Amplia os santuários orgânicos, adicionando 600 empregos de Biotroféu, 600 de habitação e +10% de eficiência de empregos de Biotroféu. Apenas Servidores Descontrolados podem adotar este plano."

 mod_extend_population_development: "Centro ampliado de desenvolvimento populacional"
 mod_extend_population_development_desc: "Medicina reprodutiva, berçários ecológicos e sistemas de montagem mecânica integrados oferecem a todas as formas de vida a habitação e o suporte técnico necessários para uma expansão contínua."
 decision_14_extend_population_development: "Plano 14: Construir um centro de desenvolvimento populacional"
 decision_14_extend_population_development_desc: "Constrói instalações integradas de desenvolvimento populacional, adicionando 600 de habitação e aumentando em 10% a velocidade de crescimento populacional e a velocidade de montagem de pops mecânicos. Este plano pode ser repetido."
