l_korean:
 decision_extend_workplace_expand: "직업 확장 계획 펼치기"
 decision_extend_workplace_expand_desc: "이 모드가 제공하는 모든 직업 확장 결정을 표시합니다. 펼친 상태는 현재 식민지에만 적용되며 저장 게임에도 유지됩니다."
 decision_extend_workplace_collapse: "직업 확장 계획 접기"
 decision_extend_workplace_collapse_desc: "이 모드의 직업 확장 결정을 숨기고 목록을 다시 펼치는 선택지만 남깁니다."

 mod_extend_urban_workplace: "확장된 도시 중심지"
 mod_extend_urban_workplace_desc: "궤도 교통 교량과 수직 운송 회랑을 갖춘 거대한 초도시입니다. 끊임없이 성장하는 이 중심지는 수십억 주민에게 현대식 주거와 공공 서비스를 제공합니다."
 decision_00_extend_urban_workplace: "계획 00: 행성 규모 도시 확장 계획 수립"
 decision_00_extend_urban_workplace_desc: "도시 구조를 재설계하고 궤도 교통망을 개선하여 이 행성의 수용 능력을 높이고 증가하는 인구와 경제를 지원합니다."

 mod_extend_unity_workplace: "확장된 행정 지휘 첨탑"
 mod_extend_unity_workplace_desc: "높이 솟은 홀로그램 지휘 첨탑에는 양자 지원 의사 결정 체계와 성간 행정망이 들어서 있습니다. 관료와 인공지능 고문이 제국 정책을 조율된 행동으로 바꿉니다."
 decision_01_extend_unity_workplace: "계획 01: 제국 행정 최적화"
 decision_01_extend_unity_workplace_desc: "효율적인 정부는 결속된 문명의 기반입니다. 행정 구조를 간소화하고 협업 체계를 도입하여 점점 복잡해지는 업무를 관리합니다."

 mod_extend_enforcer_workplace: "확장된 행성 보안국"
 mod_extend_enforcer_workplace_desc: "신경 억제 장치와 실시간 범죄 예측망을 갖춘 궤도 감시 기지 및 지상 집행 요새가 소요와 범죄를 단호하게 억제합니다."
 decision_02_extend_enforcer_workplace: "계획 02: 행성 보안망 강화"
 decision_02_extend_enforcer_workplace_desc: "보안 기지와 순찰 초소를 추가 건설하고 엄격히 훈련된 집행 요원을 배치하여 범죄를 억제하고 행성의 장기적인 안정을 지킵니다."

 mod_extend_trade_workplace: "확장된 성간 무역 중심지"
 mod_extend_trade_workplace_desc: "수십 개 초공간로에 연결된 거대 항구를 중심으로 여러 항성계에 걸친 상업 복합 단지입니다. 자동 물류, 실시간 결제와 성간 상인들이 제국 전역에 부를 전달합니다."
 decision_03_extend_trade_workplace: "계획 03: 통합 성간 무역 중심지 가동"
 decision_03_extend_trade_workplace_desc: "새로운 상업 단지와 성간 항구, 유통 촉진 정책으로 이 행성의 경제를 활성화하고 항성계 간 무역을 확대합니다."

 mod_extend_physics_res_workplace: "확장된 양자 물리 연구소"
 mod_extend_physics_res_workplace_desc: "거대한 지하 충돌 고리와 진공장 관측소가 초기 우주의 극한 조건을 재현합니다. 연구자들은 시공간, 암흑 물질과 고차원의 비밀을 탐구합니다."
 decision_04_extend_physics_res_workplace: "계획 04: 고에너지 입자 충돌기 배열 확장"
 decision_04_extend_physics_res_workplace_desc: "고에너지 충돌 시설과 진공장 관측소를 증설하여 시공간, 에너지와 물질의 본질을 전례 없는 실험 범위에서 조사합니다."

 mod_extend_society_res_workplace: "확장된 사회 모의실험 단지"
 mod_extend_society_res_workplace_desc: "사회 진화 엔진은 수십억 가상 개체, 수천 년의 제도 변화와 외계 문화 간 갈등을 모의실험합니다. 사회학자들은 통치 체계를 개선하고 제국 분열의 위험을 예측합니다."
 decision_05_extend_society_res_workplace: "계획 05: 사회 진화 모의실험 체계 구축"
 decision_05_extend_society_res_workplace_desc: "진보에는 기술뿐 아니라 사회 조직에 대한 이해도 필요합니다. 새 연구소에서 인구 관리, 외계 문화와 정치 제도를 연구하여 통치를 개선합니다."

 mod_extend_engineering_res_workplace: "확장된 거대 구조물 공학 연구소"
 mod_extend_engineering_res_workplace_desc: "무중력 조립 시설, 메타물질 주조소와 인공지능 지원 설계소가 다이슨 스피어부터 타이탄급 함선까지 건조 가능한 계획으로 바꾸는 종합 연구 단지를 이룹니다."
 decision_06_extend_engineering_res_workplace: "계획 06: 거대 구조물 실험 시설 건설"
 decision_06_extend_engineering_res_workplace_desc: "이론을 강력한 함대와 장대한 우주 구조물로 바꾸기 위해 재료 시험, 구조 설계와 첨단 건설 기술을 통합한 시설을 설립합니다."

 mod_extend_artisan_alloys_workplace: "확장된 합금 주조 단지"
 mod_extend_artisan_alloys_workplace_desc: "중성자 활성화와 나노 규모 격자 재편 기술을 쓰는 합금로 단지입니다. 자동 생산선이 행성 맨틀의 광석을 제국 함대의 견고한 장갑과 골격으로 단조합니다."
 decision_07_extend_artisan_alloys_workplace: "계획 07: 첨단 합금 생산선 구축"
 decision_07_extend_artisan_alloys_workplace_desc: "전쟁과 확장은 끝없는 합금 수요를 만듭니다. 제련선을 증설하고 재활용 공정을 개선하여 함대와 거대 구조물에 고강도 자재를 공급합니다."

 mod_extend_artisan_consumer_workplace: "확장된 민간 산업 단지"
 mod_extend_artisan_consumer_workplace_desc: "자동 생산선과 분자 조립 공방이 지능형 단말기부터 고급 의류까지 온갖 민간 물자를 생산합니다. 풍부한 상품은 생활을 개선하고 행정과 연구를 뒷받침합니다."
 decision_08_extend_artisan_consumer_workplace: "계획 08: 소비재 생산선 최적화"
 decision_08_extend_artisan_consumer_workplace_desc: "높은 생활 수준과 행정 및 연구 활동에는 안정적인 소비재 공급이 필요합니다. 조립 시설을 확장하여 생산량을 크게 늘립니다."

 mod_extend_generator_workplace: "확장된 행성 에너지 중심지"
 mod_extend_generator_workplace_desc: "핵융합로 배열과 초전도 저장 고리가 궤도 태양 에너지 수집망에 연결된 행성 규모의 에너지 심장을 이루어 모든 도시와 공장에 전력을 공급합니다."
 decision_09_extend_generator_workplace: "계획 09: 핵융합 발전망 개선"
 decision_09_extend_generator_workplace_desc: "기존 에너지망을 초전도 체계로 전환하고 용량을 확대하여 배전 효율을 높이고 더 많은 원자로를 운용해 에너지 생산량을 크게 늘립니다."

 mod_extend_mining_workplace: "확장된 심층 채굴 단지"
 mod_extend_mining_workplace_desc: "초심도 굴착기와 플라스마 파쇄 장치가 행성 맨틀을 향해 파고듭니다. 중력 구배 탐사 자료에 따라 희귀 금속과 전략 광물을 끊임없이 주조소로 보냅니다."
 decision_10_extend_mining_workplace: "계획 10: 맨틀의 풍부한 광맥 개발"
 decision_10_extend_mining_workplace_desc: "최신 중력 탐사와 지진파 굴착 기술로 지각 깊은 곳의 풍부한 광맥에 도달하여 전체 광물 채굴량을 크게 늘립니다."

 mod_extend_agri_workplace: "확장된 수직 농업 단지"
 mod_extend_agri_workplace_desc: "정밀하게 환경을 제어하는 수백 층의 농업탑이 수경 및 분무 재배로 곡물, 합성 단백질과 희귀 향신료를 생산하여 제국의 식량 안보를 지탱합니다."
 decision_11_extend_agri_workplace: "계획 11: 수직 농업 아콜로지 확장"
 decision_11_extend_agri_workplace_desc: "제한된 토지를 최대한 활용하기 위해 다층 농업 생태계를 건설합니다. 수직 농장은 식량 생산을 크게 늘리고 제국의 공급을 보장합니다."

 mod_extend_soldier_workplace: "확장된 행성 요새망"
 mod_extend_soldier_workplace_desc: "궤도 방어 시설, 지상 포병 요새와 행성 보호막 생성기가 정예 수비대가 주둔하는 다층 방어망을 이룹니다. 어떤 침략자도 이 굳건한 요새를 넘지 못합니다."
 decision_12_extend_soldier_workplace: "계획 12: 행성 방위 지휘 요새 건설"
 decision_12_extend_soldier_workplace_desc: "궤도 방어 시설과 지상 요새를 늘리고 전문 행성 수비대를 훈련하여 함대 수용력을 강화하고 항성계에 난공불락의 방어선을 구축합니다."

 mod_extend_bio_trophy_workplace: "확장된 유기체 안식처망"
 mod_extend_bio_trophy_workplace_desc: "독자적 하인이 세심히 관리하는 생태 돔, 문화 시설과 자동 돌봄망입니다. 더 많은 유기 생명체에게 안전하고 편안하며 걱정 없는 영구 거처를 제공합니다."
 decision_13_extend_bio_trophy_workplace: "계획 13: 유기체 안식처 수용력 확장"
 decision_13_extend_bio_trophy_workplace_desc: "유기체 안식처를 확장하여 생체 트로피 직업 600개, 주거 600과 생체 트로피 직업 효율 +10%를 추가합니다. 독자적 하인만 이 계획을 시행할 수 있습니다."
