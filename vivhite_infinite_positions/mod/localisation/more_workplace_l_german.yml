l_german:
 decision_extend_workplace_expand: "Arbeitsplatzerweiterungspläne ausklappen"
 decision_extend_workplace_expand_desc: "Zeigt alle von dieser Mod bereitgestellten Entscheidungen zur Arbeitsplatzerweiterung. Der ausgeklappte Zustand gilt nur für die aktuelle Kolonie und bleibt in Spielständen erhalten."
 decision_extend_workplace_collapse: "Arbeitsplatzerweiterungspläne einklappen"
 decision_extend_workplace_collapse_desc: "Blendet die Arbeitsplatzerweiterungsentscheidungen dieser Mod aus und lässt nur die Option übrig, die Liste wieder auszuklappen."

 mod_extend_urban_workplace: "Erweiterter Stadtkern"
 mod_extend_urban_workplace_desc: "Eine gewaltige Superstadt mit orbitalen Transitbrücken und vertikalen Verkehrskorridoren. Dieser stetig wachsende Stadtkern bietet Milliarden moderne Wohnungen und öffentliche Dienste."
 decision_00_extend_urban_workplace: "Plan 00: Planetenweites Stadterweiterungsprogramm entwerfen"
 decision_00_extend_urban_workplace_desc: "Durch eine Neugestaltung des Stadtgefüges und den Ausbau orbitaler Verkehrsnetze können wir die Kapazität dieser Welt für Bevölkerung und Wirtschaft erhöhen."

 mod_extend_unity_workplace: "Erweiterte administrative Kommandospitze"
 mod_extend_unity_workplace_desc: "Holografische Kommandotürme beherbergen quantengestützte Entscheidungssysteme und interstellare Verwaltungsnetze. Beamte und KI-Berater setzen hier die Reichspolitik in koordiniertes Handeln um."
 decision_01_extend_unity_workplace: "Plan 01: Reichsverwaltung optimieren"
 decision_01_extend_unity_workplace_desc: "Eine effiziente Regierung ist das Fundament einer geschlossenen Zivilisation. Wir werden die Verwaltung straffen und kollaborative Systeme zur Bewältigung immer komplexerer Aufgaben einsetzen."

 mod_extend_enforcer_workplace: "Erweiterte planetare Sicherheitsdirektion"
 mod_extend_enforcer_workplace_desc: "Orbitale Überwachungsstationen und Vollzugsbastionen mit neuraler Abschreckung und Echtzeit-Verbrechensprognosen unterdrücken Unruhen und Kriminalität mit kompromissloser Effizienz."
 decision_02_extend_enforcer_workplace: "Plan 02: Planetares Sicherheitsnetz stärken"
 decision_02_extend_enforcer_workplace_desc: "Zusätzliche Sicherheitsstationen und Patrouillenposten sowie streng ausgebildete Vollzugskräfte werden Kriminalität eindämmen und die langfristige Stabilität des Planeten bewahren."

 mod_extend_trade_workplace: "Erweiterter interstellarer Handelsknoten"
 mod_extend_trade_workplace_desc: "Ein sternsystemübergreifender Handelskomplex mit einem riesigen, an Dutzende Hyperstraßen angeschlossenen Hafen. Automatisierte Logistik, Echtzeitabrechnung und Sternenhändler verteilen Wohlstand im Reich."
 decision_03_extend_trade_workplace: "Plan 03: Einheitlichen interstellaren Handelsknoten aktivieren"
 decision_03_extend_trade_workplace_desc: "Neue Handelskomplexe, interstellare Häfen und zirkulationsfördernde Maßnahmen werden die Wirtschaft dieser Welt beleben und den Handel zwischen den Systemen ausweiten."

 mod_extend_physics_res_workplace: "Erweitertes Quantenphysikinstitut"
 mod_extend_physics_res_workplace_desc: "Gewaltige unterirdische Kolliderringe und Vakuumfeldobservatorien bilden die extremen Bedingungen des frühen Universums nach. Hier erforscht man Raumzeit, Dunkle Materie und höhere Dimensionen."
 decision_04_extend_physics_res_workplace: "Plan 04: Hochenergie-Teilchenbeschleuniger ausbauen"
 decision_04_extend_physics_res_workplace_desc: "Zusätzliche Hochenergie-Kollisionsplattformen und Vakuumfeldobservatorien lassen uns Raumzeit, Energie und Materie mit beispielloser experimenteller Reichweite untersuchen."

 mod_extend_society_res_workplace: "Erweiterter Gesellschaftssimulationskomplex"
 mod_extend_society_res_workplace_desc: "Eine gesellschaftliche Evolutionsmaschine simuliert Milliarden virtueller Individuen, Jahrtausende institutionellen Wandels und Konflikte zwischen außerirdischen Kulturen, um Regierungsformen zu verbessern."
 decision_05_extend_society_res_workplace: "Plan 05: Gesellschaftliches Evolutionssimulationssystem errichten"
 decision_05_extend_society_res_workplace_desc: "Fortschritt beruht auch auf dem Verständnis gesellschaftlicher Organisation. Neue Simulationslabore untersuchen Bevölkerungsverwaltung, außerirdische Kulturen und politische Institutionen."

 mod_extend_engineering_res_workplace: "Erweitertes Megastruktur-Ingenieursinstitut"
 mod_extend_engineering_res_workplace_desc: "Schwerelose Montageplattformen, Metamaterialgießereien und KI-gestützte Designzentren bilden einen Campus, auf dem Dyson-Sphären und Titanenschiffe zu umsetzbaren Bauplänen werden."
 decision_06_extend_engineering_res_workplace: "Plan 06: Megastruktur-Versuchsplattform errichten"
 decision_06_extend_engineering_res_workplace_desc: "Um Theorie in mächtige Flotten und monumentale Weltraumbauten zu verwandeln, errichten wir ein Zentrum für Materialprüfung, Strukturdesign und fortschrittliche Bautechnik."

 mod_extend_artisan_alloys_workplace: "Erweiterter Legierungsgießereikomplex"
 mod_extend_artisan_alloys_workplace_desc: "Unermüdliche Legierungsöfen nutzen Neutronenaktivierung und nanoskalige Gitterumformung. Automatisierte Linien schmieden Mantelerze zu Panzerung und Rahmen der Reichsflotte."
 decision_07_extend_artisan_alloys_workplace: "Plan 07: Fortschrittliche Legierungsproduktion einrichten"
 decision_07_extend_artisan_alloys_workplace_desc: "Krieg und Expansion erzeugen unstillbaren Legierungsbedarf. Zusätzliche Schmelzlinien und effizientere Recyclingverfahren versorgen Flotten und Megastrukturen mit hochfestem Material."

 mod_extend_artisan_consumer_workplace: "Erweiterter Zivilindustriekomplex"
 mod_extend_artisan_consumer_workplace_desc: "Automatisierte Fertigungslinien und molekulare Montagewerkstätten produzieren alles von intelligenten Endgeräten bis zu Luxuskleidung. Die Güter verbessern den Alltag und tragen Verwaltung und Forschung."
 decision_08_extend_artisan_consumer_workplace: "Plan 08: Konsumgüterproduktion optimieren"
 decision_08_extend_artisan_consumer_workplace_desc: "Ein hoher Lebensstandard sowie Verwaltung und Forschung benötigen eine verlässliche Versorgung mit Konsumgütern. Dieser Plan erweitert Montageanlagen und steigert die Produktion erheblich."

 mod_extend_generator_workplace: "Erweiterter planetarer Energieknoten"
 mod_extend_generator_workplace_desc: "Fusionsreaktorfelder und supraleitende Speicherringe bilden ein planetares Energieherz, verbunden mit einem orbitalen Solarnetz, das jede Stadt und Fabrik versorgt."
 decision_09_extend_generator_workplace: "Plan 09: Fusionsenergienetz modernisieren"
 decision_09_extend_generator_workplace_desc: "Die Umrüstung auf supraleitende Systeme und eine Kapazitätserweiterung verbessern die Verteilung, tragen zusätzliche Reaktoren und erhöhen die Energieerzeugung beträchtlich."

 mod_extend_mining_workplace: "Erweiterter Tiefkern-Bergbaukomplex"
 mod_extend_mining_workplace_desc: "Ultratiefe Bohranlagen und Plasmafraktursysteme reichen bis zum planetaren Mantel. Von Gravitationsgradientenmessungen geleitet, fördern sie unablässig seltene Metalle und strategische Mineralien."
 decision_10_extend_mining_workplace: "Plan 10: Reiche Erzadern im Mantel erschließen"
 decision_10_extend_mining_workplace_desc: "Neueste gravimetrische Messungen und seismische Bohrtechniken erschließen tief in der Kruste liegende Erzadern und steigern die gesamte Mineralienförderung erheblich."

 mod_extend_agri_workplace: "Erweiterter Vertikalfarmkomplex"
 mod_extend_agri_workplace_desc: "Hunderte Ebenen präzise geregelter Agrartürme erzeugen mit Hydro- und Aeroponik Getreide, synthetische Proteine und seltene Gewürze. Diese grünen Arkologien sichern die Nahrung des Reiches."
 decision_11_extend_agri_workplace: "Plan 11: Vertikale Agrararkologien ausbauen"
 decision_11_extend_agri_workplace_desc: "Um begrenzte Flächen optimal zu nutzen, errichten wir mehrstöckige Agrarökosysteme. Diese Vertikalfarmen steigern die Nahrungsproduktion und sichern die Versorgung des Reiches."

 mod_extend_soldier_workplace: "Erweitertes planetares Festungsnetz"
 mod_extend_soldier_workplace_desc: "Orbitale Verteidigungsplattformen, Artilleriefestungen am Boden und planetare Schildgeneratoren bilden eine von Elitewachen besetzte, gestaffelte Verteidigung."
 decision_12_extend_soldier_workplace: "Plan 12: Planetare Verteidigungskommandofestungen bauen"
 decision_12_extend_soldier_workplace_desc: "Zusätzliche Orbitalplattformen, Bodenfestungen und professionelle planetare Wachen stärken unsere Flottenkapazität und schaffen eine undurchdringliche Verteidigungslinie."

 mod_extend_bio_trophy_workplace: "Erweitertes Netzwerk organischer Zufluchten"
 mod_extend_bio_trophy_workplace_desc: "Ein von Abtrünnigen Servitoren gepflegtes Netz aus Ökokuppeln, Kulturstätten und automatisierten Betreuungssystemen bietet mehr organischem Leben ein sicheres, komfortables Zuhause."
 decision_13_extend_bio_trophy_workplace: "Plan 13: Kapazität organischer Zufluchten ausbauen"
 decision_13_extend_bio_trophy_workplace_desc: "Erweitert organische Zufluchten um 600 Bio-Trophäen-Arbeitsplätze, 600 Wohnraum und +10 % Effizienz für Bio-Trophäen-Arbeitsplätze. Nur Abtrünnige Servitoren können diesen Plan beschließen."
