l_simp_chinese:
 # 基础工作场所扩展
 decision_extend_workplace_expand: "展开计划菜单"
 decision_extend_workplace_expand_desc: "准备大建"
 decision_extend_workplace_collapse: "收起计划菜单"
 decision_extend_workplace_collapse_desc: "结束大建"
 
 mod_extend_urban_workplace: "扩增的都市核心区"
 mod_extend_urban_workplace_desc: "层峦叠嶂的超级都市群，数以千计的轨道连接桥与垂直运输走廊交织其间，这座不断生长的巨型城市为亿万居民提供了现代化居所与公共服务设施，是行星文明的心脏地带。"
 decision_00_extend_urban_workplace: "计划00：制定全域城市扩容方案"
 decision_00_extend_urban_workplace_desc: "通过重新规划城市结构并升级轨道运输网络，我们可以提升这颗星球的承载能力，以容纳日益增长的人口与经济规模。"
 
 mod_extend_unity_workplace: "扩增的行政指挥塔"
 mod_extend_unity_workplace_desc: "高耸入云的全息指挥塔楼，内置量子协同决策系统与跨星域政务网络，这里汇聚了帝国最优秀的行政官员与AI顾问，确保法令如臂使指，将帝国意志凝聚为无可撼动的向心力。"
 decision_01_extend_unity_workplace: "计划01：优化帝国行政管理体系"
 decision_01_extend_unity_workplace_desc: "一个高效的政府是文明凝聚力的基石，我们将优化行政架构并部署协同办公系统，处理日益复杂的社会事务，减轻帝国中枢的管理压力。"
 
 mod_extend_enforcer_workplace: "扩增的维稳执法局"
 mod_extend_enforcer_workplace_desc: "遍布行星轨道的监控哨站与地面执法堡垒，配备神经震慑单元与实时犯罪预测阵列，这支纪律严明的维稳力量以绝对的效率镇压叛乱与犯罪，为文明发展提供铁一般的秩序基石。"
 decision_02_extend_enforcer_workplace: "计划02：加强行星公共安全网络"
 decision_02_extend_enforcer_workplace_desc: "通过建立更多的安全站与巡逻哨所，并部署经过严格训练的执法力量，我们可以有效压制犯罪活动，维护行星社会的长期稳定。"
 
 mod_extend_trade_workplace: "扩增的星际贸易站"
 mod_extend_trade_workplace_desc: "跨越星域的商业综合体，连接数十条超空间航路的巨型贸易港，自动化的物流、实时汇率清算AI与星际商贾云集于此，让财富如潮水般涌向帝国的每一个角落。"
 decision_03_extend_trade_workplace: "计划03：激活联合星域贸易枢纽"
 decision_03_extend_trade_workplace_desc: "建设新型商业综合体和星际贸易港，并推行一系列促进流通的政策，我们将为这颗星球注入蓬勃的商业活力，促进跨星域贸易流通。"
 
 mod_extend_physics_res_workplace: "扩增的量子物理院"
 mod_extend_physics_res_workplace_desc: "深埋于地下的巨型对撞环与真空场观测阵列，模拟宇宙大爆炸初期的极端条件，这里的研究者们以数学与能量为语言，揭开时空、暗物质与高维空间的终极奥秘。"
 decision_04_extend_physics_res_workplace: "计划04：扩建高能粒子对撞阵列"
 decision_04_extend_physics_res_workplace_desc: "通过增设高能粒子对撞平台与真空场观测阵列，我们将能更深入地探索时空、能量与物质的本质，这项投资将极大拓展物理学的实验边界与探索深度。"

 mod_extend_society_res_workplace: "扩增的社会模拟室"
 mod_extend_society_res_workplace_desc: "容纳数十亿虚拟个体的社会演化引擎，能够模拟文明数千年的制度变迁与跨物种文化冲突，社会学家在这里设计更完美的治理模式，预判并规避帝国的潜在分裂风险。"
 decision_05_extend_society_res_workplace: "计划05：构建社会演化模拟系统"
 decision_05_extend_society_res_workplace_desc: "文明的进步不仅在于技术飞跃，更在于对自身组织的理解，我们将建立社会仿真实验室，用于研究人口管理、异星文化及政治体系，为文明治理提供更深刻的洞察。"

 mod_extend_engineering_res_workplace: "扩增的巨型工程所"
 mod_extend_engineering_res_workplace_desc: "集成零重力装配平台、超材料铸造厂与只能辅助设计中心的综合性实验基地，从戴森球蓝图到泰坦级战舰，一切宏伟造物的理论都在这座设施中化为可建造的现实方案。"
 decision_06_extend_engineering_res_workplace: "计划06：建造巨型结构实验平台"
 decision_06_extend_engineering_res_workplace_desc: "为了将理论转化为坚实的舰队与宏伟的太空建筑，我们必须大力发展工程学，该计划将建立一个集成材料测试、结构设计与建造工艺的综合设施，推动工程学边界的持续突破。"

 mod_extend_artisan_alloys_workplace: "扩增的合金精炼厂"
 mod_extend_artisan_alloys_workplace_desc: "熔炉之火永不熄灭的合金铸造集群，采用中子活化冶炼与纳米级晶格重组技术，无数条自动化生产线日夜不息，将行星地幔中的矿石锻造成帝国舰队最坚固的装甲与骨架。"
 decision_07_extend_artisan_alloys_workplace: "计划07：建立超合金材料生产线"
 decision_07_extend_artisan_alloys_workplace_desc: "战争与扩张的需求永无止境，我们将为合金精炼厂增加多条冶炼线，并采用更高效的循环工艺，以满足舰队与巨型建筑对高强度合金的无底洞需求。"

 mod_extend_artisan_consumer_workplace: "扩增的民用工业厂"
 mod_extend_artisan_consumer_workplace_desc: "全自动化的消费品流水线与分子装配车间，从智能终端到奢侈品服饰，一切民用物资均可按需生产，充足的商品不仅提升了民众幸福度，也为行政与科研体系的运转提供了坚实的后勤保障。"
 decision_08_extend_artisan_consumer_workplace: "计划08：优化日用消费品生产线"
 decision_08_extend_artisan_consumer_workplace_desc: "为了维持民众的高品质生活，并支持行政与科研工作的运转，我们需要充足的消费品，此项计划将扩建大量装配工厂，全面提升消费品供给能力。"
 
 mod_extend_generator_workplace: "扩增的能源枢纽站"
 mod_extend_generator_workplace_desc: "聚变反应堆阵列与超导储能环组成的行星级能源心脏，同时整合了轨道太阳能收集网络，源源不断的等离子体洪流通过量子输电网输送到每一座城市、每一座工厂，为文明引擎注入永不枯竭的动力。"
 decision_09_extend_generator_workplace: "计划09：升级聚变发电网络系统"
 decision_09_extend_generator_workplace_desc: "通过对现有能源网络进行超导化改造与容量扩容，我们可以更高效地分配电力，并支持更多反应堆运行，从而大幅提升能源产出效率。"
 
 mod_extend_mining_workplace: "扩增的深层采矿站"
 mod_extend_mining_workplace_desc: "直达行星地幔的超深井钻机与等离子冲破碎矿系统，利用重力梯度数据精准锁定富矿脉带，轰鸣的挖掘机械昼夜不息，将稀有金属与战略矿物从地壳深处源源不断送至冶炼厂。"
 decision_10_extend_mining_workplace: "计划10：深采行星地幔富矿脉带"
 decision_10_extend_mining_workplace_desc: "利用最新的重力勘探数据与震波钻探技术，我们可以深入行星地壳深处，发掘此前难以触及的富矿矿脉，从而大幅提升稀有矿物开采总量。"
 
 mod_extend_agri_workplace: "扩增的垂直农场群"
 mod_extend_agri_workplace_desc: "高达数百层的立体农业生态塔，内部气候环境都被精确调控，水培与气培系统高效产出谷物、合成蛋白与珍稀香料，这些绿色巨塔是帝国粮食安全最坚实的保障，滋养着星系中的亿万子民。"
 decision_11_extend_agri_workplace: "计划11：扩充立体农业生态塔群"
 decision_11_extend_agri_workplace_desc: "为了最大限度地利用有限的土地，我们将建设多层结构的立体农业生态系统，这些垂直农场将大幅提升粮食产量，并确保帝国粮食供应的绝对安全。"
 
 mod_extend_soldier_workplace: "扩增的行星要塞群"
 mod_extend_soldier_workplace_desc: "轨道防御平台、地面要塞炮群与行星护盾发生器构成的立体防御体系，驻扎着经过训练的精锐守卫部队，任何胆敢进犯的敌人，都将在这座永不陷落的堡垒面前粉身碎骨。"
 decision_12_extend_soldier_workplace: "计划12：建设行星防卫指挥堡垒"
 decision_12_extend_soldier_workplace_desc: "通过建造更多轨道防御平台与地面要塞，并训练专业的行星守卫部队，我们可以提升帝国舰队容量，同时构筑坚不可摧的星域防线。"