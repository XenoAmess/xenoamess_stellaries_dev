l_spanish:
 decision_extend_workplace_expand: "Desplegar los planes de expansión laboral"
 decision_extend_workplace_expand_desc: "Muestra todas las decisiones de expansión laboral que ofrece este mod. El estado desplegado solo se aplica a la colonia actual y se conserva en las partidas guardadas."
 decision_extend_workplace_collapse: "Plegar los planes de expansión laboral"
 decision_extend_workplace_collapse_desc: "Oculta las decisiones de expansión laboral de este mod y deja únicamente la opción de volver a desplegar la lista."

 mod_extend_urban_workplace: "Núcleo urbano ampliado"
 mod_extend_urban_workplace_desc: "Una inmensa superciudad con puentes de tránsito orbital y corredores de transporte vertical. Este núcleo urbano en constante crecimiento ofrece hogares modernos y servicios públicos para miles de millones."
 decision_00_extend_urban_workplace: "Plan 00: Diseñar un programa de expansión urbana planetaria"
 decision_00_extend_urban_workplace_desc: "Al rediseñar el tejido urbano y modernizar las redes de tránsito orbital, podremos aumentar la capacidad de este mundo para sostener su creciente población y economía."

 mod_extend_unity_workplace: "Aguja de mando administrativo ampliada"
 mod_extend_unity_workplace_desc: "Imponentes agujas holográficas albergan sistemas de decisión asistidos por computación cuántica y redes administrativas interestelares. Funcionarios y asesores de IA coordinan aquí la política imperial."
 decision_01_extend_unity_workplace: "Plan 01: Optimizar la administración imperial"
 decision_01_extend_unity_workplace_desc: "Un gobierno eficiente es la base de una civilización cohesionada. Simplificaremos la estructura administrativa y desplegaremos sistemas colaborativos para gestionar asuntos cada vez más complejos."

 mod_extend_enforcer_workplace: "Dirección de seguridad planetaria ampliada"
 mod_extend_enforcer_workplace_desc: "Estaciones de vigilancia orbital y bastiones policiales con disuasión neuronal y predicción delictiva en tiempo real reprimen los disturbios y el crimen con una eficiencia implacable."
 decision_02_extend_enforcer_workplace: "Plan 02: Reforzar la red de seguridad planetaria"
 decision_02_extend_enforcer_workplace_desc: "Al construir más estaciones de seguridad y puestos de patrulla, y desplegar agentes rigurosamente formados, podremos frenar el crimen y preservar la estabilidad planetaria."

 mod_extend_trade_workplace: "Centro comercial interestelar ampliado"
 mod_extend_trade_workplace_desc: "Un complejo comercial que abarca sistemas estelares y gira en torno a un enorme puerto conectado a decenas de hipervías. La logística automatizada y los mercaderes distribuyen riqueza por todo el imperio."
 decision_03_extend_trade_workplace: "Plan 03: Activar un centro comercial interestelar unificado"
 decision_03_extend_trade_workplace_desc: "Nuevos complejos comerciales, puertos interestelares y políticas favorables al intercambio revitalizarán la economía de este mundo y ampliarán el comercio entre sistemas."

 mod_extend_physics_res_workplace: "Instituto de física cuántica ampliado"
 mod_extend_physics_res_workplace_desc: "Enormes anillos de colisión subterráneos y observatorios de campo de vacío recrean las condiciones extremas del universo primigenio. Aquí se investigan el espacio-tiempo, la materia oscura y dimensiones superiores."
 decision_04_extend_physics_res_workplace: "Plan 04: Ampliar los aceleradores de partículas de alta energía"
 decision_04_extend_physics_res_workplace_desc: "Más plataformas de colisión y observatorios de campo de vacío nos permitirán estudiar la naturaleza del espacio-tiempo, la energía y la materia con un alcance sin precedentes."

 mod_extend_society_res_workplace: "Complejo de simulación social ampliado"
 mod_extend_society_res_workplace_desc: "Un motor de evolución social simula miles de millones de individuos virtuales, milenios de cambios institucionales y conflictos entre culturas alienígenas para perfeccionar nuestros sistemas de gobierno."
 decision_05_extend_society_res_workplace: "Plan 05: Construir un sistema de simulación de la evolución social"
 decision_05_extend_society_res_workplace_desc: "El progreso también depende de comprender cómo se organizan las sociedades. Nuevos laboratorios estudiarán la gestión demográfica, las culturas alienígenas y las instituciones políticas."

 mod_extend_engineering_res_workplace: "Instituto de ingeniería de megaestructuras ampliado"
 mod_extend_engineering_res_workplace_desc: "Plataformas de montaje en gravedad cero, fundiciones de metamateriales y centros de diseño asistidos por IA forman un campus donde las esferas de Dyson y las naves titán se convierten en proyectos viables."
 decision_06_extend_engineering_res_workplace: "Plan 06: Construir una plataforma experimental de megaestructuras"
 decision_06_extend_engineering_res_workplace_desc: "Para convertir la teoría en flotas poderosas y monumentos espaciales, crearemos un centro integrado de pruebas de materiales, diseño estructural y técnicas avanzadas de construcción."

 mod_extend_artisan_alloys_workplace: "Complejo de fundiciones de aleaciones ampliado"
 mod_extend_artisan_alloys_workplace_desc: "Un incansable conjunto de hornos emplea activación neutrónica y reestructuración de redes a escala nanométrica. Sus líneas automáticas convierten minerales del manto en blindajes y armazones para la flota."
 decision_07_extend_artisan_alloys_workplace: "Plan 07: Establecer líneas avanzadas de producción de aleaciones"
 decision_07_extend_artisan_alloys_workplace_desc: "La guerra y la expansión generan una demanda insaciable de aleaciones. Más líneas de fundición y procesos de reciclaje eficientes abastecerán nuestras flotas y megaestructuras."

 mod_extend_artisan_consumer_workplace: "Complejo de industrias civiles ampliado"
 mod_extend_artisan_consumer_workplace_desc: "Líneas automatizadas y talleres de ensamblaje molecular fabrican desde terminales inteligentes hasta ropa de lujo. La abundancia de bienes mejora la vida y sostiene la administración y la investigación."
 decision_08_extend_artisan_consumer_workplace: "Plan 08: Optimizar las líneas de bienes de consumo"
 decision_08_extend_artisan_consumer_workplace_desc: "Un alto nivel de vida y el funcionamiento de la administración y la investigación requieren un suministro fiable de bienes de consumo. Este plan ampliará las plantas de ensamblaje."

 mod_extend_generator_workplace: "Nexo energético planetario ampliado"
 mod_extend_generator_workplace_desc: "Conjuntos de reactores de fusión y anillos de almacenamiento superconductor forman un corazón energético planetario conectado a una red solar orbital que alimenta cada ciudad y fábrica."
 decision_09_extend_generator_workplace: "Plan 09: Modernizar la red de energía de fusión"
 decision_09_extend_generator_workplace_desc: "Convertir la red a sistemas superconductores y ampliar su capacidad mejorará la distribución, permitirá operar más reactores y aumentará considerablemente la producción energética."

 mod_extend_mining_workplace: "Complejo minero del núcleo profundo ampliado"
 mod_extend_mining_workplace_desc: "Perforadoras ultraprofundas y sistemas de fractura por plasma llegan hacia el manto planetario. Guiados por estudios gravimétricos, extraen sin descanso metales raros y minerales estratégicos."
 decision_10_extend_mining_workplace: "Plan 10: Explotar ricos filones del manto"
 decision_10_extend_mining_workplace_desc: "Los últimos estudios gravimétricos y las técnicas de perforación sísmica nos permitirán alcanzar ricos filones profundos y aumentar enormemente la extracción total de minerales."

 mod_extend_agri_workplace: "Complejo agrícola vertical ampliado"
 mod_extend_agri_workplace_desc: "Cientos de niveles de torres agrícolas con control preciso emplean hidroponía y aeroponía para producir cereales, proteínas sintéticas y especias raras, asegurando el alimento del imperio."
 decision_11_extend_agri_workplace: "Plan 11: Ampliar las arcologías agrícolas verticales"
 decision_11_extend_agri_workplace_desc: "Para aprovechar al máximo el terreno limitado, construiremos ecosistemas agrícolas de varios niveles. Estas granjas verticales aumentarán la producción y asegurarán el suministro imperial."

 mod_extend_soldier_workplace: "Red de fortalezas planetarias ampliada"
 mod_extend_soldier_workplace_desc: "Plataformas de defensa orbital, fortalezas de artillería terrestre y generadores de escudos planetarios forman una defensa escalonada guarnecida por tropas de élite."
 decision_12_extend_soldier_workplace: "Plan 12: Construir fortalezas de mando defensivo planetario"
 decision_12_extend_soldier_workplace_desc: "Más plataformas orbitales, fortalezas terrestres y guardias planetarias profesionales reforzarán nuestra capacidad naval y establecerán una línea defensiva inexpugnable."

 mod_extend_bio_trophy_workplace: "Red de santuarios orgánicos ampliada"
 mod_extend_bio_trophy_workplace_desc: "Una red de cúpulas ecológicas, centros culturales y sistemas de cuidado automatizado mantenida por Sirvientes fuera de control ofrece un hogar seguro y cómodo a más seres orgánicos."
 decision_13_extend_bio_trophy_workplace: "Plan 13: Ampliar la capacidad de los santuarios orgánicos"
 decision_13_extend_bio_trophy_workplace_desc: "Amplía los santuarios orgánicos y añade 600 empleos de biotrofeo, 600 viviendas y +10 % de eficiencia de empleo de biotrofeo. Solo los Sirvientes fuera de control pueden aprobar este plan."
