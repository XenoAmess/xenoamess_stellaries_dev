l_english:
 decision_extend_workplace_expand: "Expand Workplace Expansion Plans"
 decision_extend_workplace_expand_desc: "Show all workplace expansion decisions provided by this mod. The expanded state applies only to the current colony and is preserved in saved games."
 decision_extend_workplace_collapse: "Collapse Workplace Expansion Plans"
 decision_extend_workplace_collapse_desc: "Hide this mod's workplace expansion decisions, leaving only the option to expand the list again."

 mod_extend_urban_workplace: "Expanded Urban Core"
 mod_extend_urban_workplace_desc: "A vast supercity of orbital transit bridges and vertical transport corridors. This ever-growing urban core provides modern homes and public services for billions, forming the heart of planetary civilization."
 decision_00_extend_urban_workplace: "Plan 00: Draft a Planetwide Urban Expansion Program"
 decision_00_extend_urban_workplace_desc: "By redesigning the urban fabric and upgrading orbital transit networks, we can increase this world's carrying capacity to support its growing population and economy."

 mod_extend_unity_workplace: "Expanded Administrative Command Spire"
 mod_extend_unity_workplace_desc: "Towering holographic command spires house quantum-assisted decision systems and interstellar administrative networks. The empire's finest officials and AI advisers work here to turn imperial policy into coordinated action."
 decision_01_extend_unity_workplace: "Plan 01: Optimize Imperial Administration"
 decision_01_extend_unity_workplace_desc: "Efficient government is the foundation of a cohesive civilization. We will streamline the administrative structure and deploy collaborative systems to manage increasingly complex affairs and ease the burden on the imperial center."

 mod_extend_enforcer_workplace: "Expanded Planetary Security Directorate"
 mod_extend_enforcer_workplace_desc: "Orbital surveillance stations and surface enforcement strongholds equipped with neural deterrence systems and real-time crime prediction arrays. This disciplined security apparatus suppresses unrest and crime with uncompromising efficiency."
 decision_02_extend_enforcer_workplace: "Plan 02: Strengthen the Planetary Security Network"
 decision_02_extend_enforcer_workplace_desc: "By building additional security stations and patrol posts, then deploying rigorously trained enforcement personnel, we can curb criminal activity and preserve long-term planetary stability."

 mod_extend_trade_workplace: "Expanded Interstellar Trade Hub"
 mod_extend_trade_workplace_desc: "A commercial complex spanning star systems, centered on an immense port connected to dozens of hyperlanes. Automated logistics, real-time exchange clearing, and merchants from across the stars channel wealth throughout the empire."
 decision_03_extend_trade_workplace: "Plan 03: Activate a Unified Interstellar Trade Nexus"
 decision_03_extend_trade_workplace_desc: "New commercial complexes, interstellar ports, and policies that promote circulation will invigorate this world's economy and expand trade across neighboring systems."

 mod_extend_physics_res_workplace: "Expanded Quantum Physics Institute"
 mod_extend_physics_res_workplace_desc: "Immense subterranean collider rings and vacuum-field observatories recreate the extreme conditions of the early universe. Here, researchers use mathematics and energy to probe spacetime, dark matter, and higher dimensions."
 decision_04_extend_physics_res_workplace: "Plan 04: Expand High-Energy Particle Collider Arrays"
 decision_04_extend_physics_res_workplace_desc: "Additional high-energy collider platforms and vacuum-field observatories will let us investigate the nature of spacetime, energy, and matter with unprecedented experimental reach."

 mod_extend_society_res_workplace: "Expanded Societal Simulation Complex"
 mod_extend_society_res_workplace_desc: "A societal evolution engine simulates billions of virtual individuals, millennia of institutional change, and conflict between alien cultures. Social scientists use it to refine systems of government and anticipate sources of imperial division."
 decision_05_extend_society_res_workplace: "Plan 05: Construct a Societal Evolution Simulation System"
 decision_05_extend_society_res_workplace_desc: "Progress depends not only on technology but also on understanding how societies organize themselves. New simulation laboratories will study population management, alien cultures, and political institutions to improve governance."

 mod_extend_engineering_res_workplace: "Expanded Megastructure Engineering Institute"
 mod_extend_engineering_res_workplace_desc: "Zero-gravity assembly platforms, metamaterial foundries, and AI-assisted design centers form an integrated research campus where concepts from Dyson spheres to titan-class warships become practical construction plans."
 decision_06_extend_engineering_res_workplace: "Plan 06: Build a Megastructure Experimental Platform"
 decision_06_extend_engineering_res_workplace_desc: "To turn theory into powerful fleets and monumental spaceborne structures, we will establish an integrated center for material testing, structural design, and advanced construction techniques."

 mod_extend_artisan_alloys_workplace: "Expanded Alloy Foundry Complex"
 mod_extend_artisan_alloys_workplace_desc: "A tireless cluster of alloy furnaces uses neutron activation and nanoscale lattice restructuring. Automated production lines forge mantle ores into the resilient armor and frames of the imperial fleet."
 decision_07_extend_artisan_alloys_workplace: "Plan 07: Establish Advanced Alloy Production Lines"
 decision_07_extend_artisan_alloys_workplace_desc: "War and expansion create an insatiable demand for alloys. Additional smelting lines and more efficient recycling processes will supply our fleets and megastructures with high-strength materials."

 mod_extend_artisan_consumer_workplace: "Expanded Civilian Industries Complex"
 mod_extend_artisan_consumer_workplace_desc: "Automated production lines and molecular assembly workshops manufacture everything from smart terminals to luxury apparel. Abundant goods improve daily life while sustaining the administrative and research sectors."
 decision_08_extend_artisan_consumer_workplace: "Plan 08: Optimize Consumer Goods Production Lines"
 decision_08_extend_artisan_consumer_workplace_desc: "Maintaining a high standard of living and supporting administration and research requires a dependable supply of Consumer Goods. This plan will expand assembly facilities and greatly increase output."

 mod_extend_generator_workplace: "Expanded Planetary Energy Nexus"
 mod_extend_generator_workplace_desc: "Fusion reactor arrays and superconducting storage rings form a planetary energy heart linked to an orbital solar collection network. Plasma power flows through a quantum grid to every city and factory."
 decision_09_extend_generator_workplace: "Plan 09: Upgrade the Fusion Power Grid"
 decision_09_extend_generator_workplace_desc: "Converting the existing energy grid to superconducting systems and expanding its capacity will distribute power more efficiently, support additional reactors, and substantially increase energy output."

 mod_extend_mining_workplace: "Expanded Deep-Core Mining Complex"
 mod_extend_mining_workplace_desc: "Ultra-deep drilling rigs and plasma fracturing systems reach toward the planetary mantle. Guided by gravitational-gradient surveys, they work without pause to feed rare metals and strategic minerals to the foundries."
 decision_10_extend_mining_workplace: "Plan 10: Tap Rich Mantle Ore Veins"
 decision_10_extend_mining_workplace_desc: "The latest gravimetric surveys and seismic drilling techniques will let us reach rich ore veins deep within the crust, greatly increasing total mineral extraction."

 mod_extend_agri_workplace: "Expanded Vertical Farming Complex"
 mod_extend_agri_workplace_desc: "Hundreds of levels of precisely controlled agricultural towers use hydroponic and aeroponic systems to produce grain, synthetic protein, and rare spices. These green arcologies anchor the empire's food security."
 decision_11_extend_agri_workplace: "Plan 11: Expand Vertical Agricultural Arcologies"
 decision_11_extend_agri_workplace_desc: "To make the most of limited land, we will construct multilayered agricultural ecosystems. These vertical farms will greatly increase food output and secure the empire's supply."

 mod_extend_soldier_workplace: "Expanded Planetary Fortress Network"
 mod_extend_soldier_workplace_desc: "Orbital defense platforms, surface artillery fortresses, and planetary shield generators form a layered defense network staffed by elite guards. Any invader will break against this unyielding bastion."
 decision_12_extend_soldier_workplace: "Plan 12: Build Planetary Defense Command Fortresses"
 decision_12_extend_soldier_workplace_desc: "Additional orbital defense platforms, surface fortresses, and professional planetary guards will strengthen our naval capacity and establish an impregnable defensive line across the system."

 mod_extend_bio_trophy_workplace: "Expanded Organic Sanctuary Network"
 mod_extend_bio_trophy_workplace_desc: "A network of ecological domes, cultural retreats, and automated caretaking systems maintained by Rogue Servitors as a safe and comfortable permanent home for more organic life."
 decision_13_extend_bio_trophy_workplace: "Plan 13: Expand Organic Sanctuary Capacity"
 decision_13_extend_bio_trophy_workplace_desc: "Expand organic sanctuary facilities, adding 600 Bio-Trophy jobs, 600 housing, and +10% Bio-Trophy job efficiency. Only Rogue Servitors can enact this plan."
