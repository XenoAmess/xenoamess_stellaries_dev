l_french:
 decision_extend_workplace_expand: "Déployer les plans d'expansion des emplois"
 decision_extend_workplace_expand_desc: "Afficher toutes les décisions d'expansion des emplois fournies par ce mod. L'état déployé ne concerne que la colonie actuelle et est conservé dans les sauvegardes."
 decision_extend_workplace_collapse: "Replier les plans d'expansion des emplois"
 decision_extend_workplace_collapse_desc: "Masquer les décisions d'expansion des emplois de ce mod, en ne laissant que l'option permettant de déployer à nouveau la liste."

 mod_extend_urban_workplace: "Centre urbain agrandi"
 mod_extend_urban_workplace_desc: "Une immense mégapole dotée de ponts de transit orbitaux et de corridors de transport verticaux. Ce centre urbain en perpétuelle croissance offre logements modernes et services publics à des milliards d'habitants."
 decision_00_extend_urban_workplace: "Plan 00 : Élaborer un programme d'expansion urbaine planétaire"
 decision_00_extend_urban_workplace_desc: "En repensant le tissu urbain et en modernisant les réseaux de transit orbitaux, nous pouvons accroître la capacité d'accueil de ce monde pour soutenir sa population et son économie."

 mod_extend_unity_workplace: "Flèche de commandement administratif agrandie"
 mod_extend_unity_workplace_desc: "D'imposantes flèches de commandement holographiques abritent des systèmes décisionnels assistés par ordinateur quantique et des réseaux administratifs interstellaires. Fonctionnaires et conseillers IA y coordonnent la politique impériale."
 decision_01_extend_unity_workplace: "Plan 01 : Optimiser l'administration impériale"
 decision_01_extend_unity_workplace_desc: "Un gouvernement efficace est le fondement d'une civilisation unie. Nous rationaliserons l'administration et déploierons des systèmes collaboratifs afin de gérer des affaires toujours plus complexes."

 mod_extend_enforcer_workplace: "Direction de la sécurité planétaire agrandie"
 mod_extend_enforcer_workplace_desc: "Des stations de surveillance orbitale et des bastions de maintien de l'ordre équipés de systèmes de dissuasion neuronale et de prédiction criminelle en temps réel répriment troubles et criminalité avec efficacité."
 decision_02_extend_enforcer_workplace: "Plan 02 : Renforcer le réseau de sécurité planétaire"
 decision_02_extend_enforcer_workplace_desc: "En construisant des postes de sécurité et de patrouille supplémentaires, puis en déployant du personnel rigoureusement formé, nous pourrons réduire la criminalité et préserver la stabilité planétaire."

 mod_extend_trade_workplace: "Carrefour commercial interstellaire agrandi"
 mod_extend_trade_workplace_desc: "Un complexe commercial couvrant plusieurs systèmes, centré sur un immense port relié à des dizaines d'hyperlignes. Logistique automatisée, compensation en temps réel et marchands stellaires irriguent tout l'empire de richesses."
 decision_03_extend_trade_workplace: "Plan 03 : Activer un carrefour commercial interstellaire unifié"
 decision_03_extend_trade_workplace_desc: "De nouveaux complexes commerciaux, des ports interstellaires et des politiques favorisant les échanges dynamiseront l'économie de ce monde et le commerce entre systèmes."

 mod_extend_physics_res_workplace: "Institut de physique quantique agrandi"
 mod_extend_physics_res_workplace_desc: "D'immenses anneaux de collision souterrains et observatoires du champ du vide recréent les conditions extrêmes de l'Univers primordial. Les chercheurs y sondent l'espace-temps, la matière noire et les dimensions supérieures."
 decision_04_extend_physics_res_workplace: "Plan 04 : Agrandir les réseaux de collisionneurs à haute énergie"
 decision_04_extend_physics_res_workplace_desc: "Des plateformes de collision et des observatoires supplémentaires nous permettront d'étudier la nature de l'espace-temps, de l'énergie et de la matière avec une portée expérimentale sans précédent."

 mod_extend_society_res_workplace: "Complexe de simulation sociétale agrandi"
 mod_extend_society_res_workplace_desc: "Un moteur d'évolution sociétale simule des milliards d'individus virtuels, des millénaires de mutations institutionnelles et les conflits entre cultures extraterrestres afin de perfectionner nos modes de gouvernement."
 decision_05_extend_society_res_workplace: "Plan 05 : Construire un système de simulation de l'évolution sociétale"
 decision_05_extend_society_res_workplace_desc: "Le progrès repose aussi sur la compréhension des sociétés. De nouveaux laboratoires étudieront la gestion démographique, les cultures extraterrestres et les institutions politiques afin d'améliorer la gouvernance."

 mod_extend_engineering_res_workplace: "Institut d'ingénierie des mégastructures agrandi"
 mod_extend_engineering_res_workplace_desc: "Plateformes d'assemblage en apesanteur, fonderies de métamatériaux et centres de conception assistée par IA forment un campus où les sphères de Dyson et vaisseaux titanesques deviennent des projets réalisables."
 decision_06_extend_engineering_res_workplace: "Plan 06 : Construire une plateforme expérimentale de mégastructures"
 decision_06_extend_engineering_res_workplace_desc: "Pour transformer la théorie en flottes puissantes et en monuments spatiaux, nous établirons un centre intégré d'essai des matériaux, de conception structurelle et de construction avancée."

 mod_extend_artisan_alloys_workplace: "Complexe de fonderies d'alliages agrandi"
 mod_extend_artisan_alloys_workplace_desc: "Un ensemble infatigable de fourneaux utilise l'activation neutronique et la restructuration des réseaux à l'échelle nanométrique pour forger les minerais du manteau en blindages et ossatures de flotte."
 decision_07_extend_artisan_alloys_workplace: "Plan 07 : Établir des chaînes de production d'alliages avancés"
 decision_07_extend_artisan_alloys_workplace_desc: "La guerre et l'expansion exigent toujours plus d'alliages. De nouvelles lignes de fusion et des procédés de recyclage plus efficaces alimenteront flottes et mégastructures."

 mod_extend_artisan_consumer_workplace: "Complexe d'industries civiles agrandi"
 mod_extend_artisan_consumer_workplace_desc: "Des chaînes automatisées et ateliers d'assemblage moléculaire fabriquent aussi bien des terminaux intelligents que des vêtements de luxe. Ces biens améliorent la vie quotidienne et soutiennent administration et recherche."
 decision_08_extend_artisan_consumer_workplace: "Plan 08 : Optimiser les chaînes de biens de consommation"
 decision_08_extend_artisan_consumer_workplace_desc: "Un niveau de vie élevé et le fonctionnement de l'administration et de la recherche exigent un approvisionnement fiable en biens de consommation. Ce plan agrandira les usines d'assemblage."

 mod_extend_generator_workplace: "Nexus énergétique planétaire agrandi"
 mod_extend_generator_workplace_desc: "Des réseaux de réacteurs à fusion et des anneaux de stockage supraconducteurs forment un cœur énergétique planétaire relié à un réseau solaire orbital, alimentant chaque ville et chaque usine."
 decision_09_extend_generator_workplace: "Plan 09 : Moderniser le réseau d'énergie de fusion"
 decision_09_extend_generator_workplace_desc: "La conversion du réseau énergétique aux systèmes supraconducteurs et l'augmentation de sa capacité amélioreront la distribution, permettront davantage de réacteurs et accroîtront fortement la production."

 mod_extend_mining_workplace: "Complexe minier profond agrandi"
 mod_extend_mining_workplace_desc: "Des foreuses ultraprofondes et systèmes de fracturation au plasma s'enfoncent vers le manteau planétaire. Guidés par des relevés gravimétriques, ils livrent sans relâche métaux rares et minerais stratégiques."
 decision_10_extend_mining_workplace: "Plan 10 : Exploiter les riches filons du manteau"
 decision_10_extend_mining_workplace_desc: "Les derniers relevés gravimétriques et les techniques de forage sismique nous permettront d'atteindre de riches filons enfouis dans la croûte et d'augmenter fortement l'extraction minérale."

 mod_extend_agri_workplace: "Complexe d'agriculture verticale agrandi"
 mod_extend_agri_workplace_desc: "Des centaines d'étages de tours agricoles au climat contrôlé utilisent hydroponie et aéroponie pour produire céréales, protéines synthétiques et épices rares, assurant la sécurité alimentaire impériale."
 decision_11_extend_agri_workplace: "Plan 11 : Agrandir les arcologies agricoles verticales"
 decision_11_extend_agri_workplace_desc: "Pour exploiter au mieux les terres limitées, nous construirons des écosystèmes agricoles à plusieurs niveaux. Ces fermes verticales augmenteront fortement la production et sécuriseront l'approvisionnement."

 mod_extend_soldier_workplace: "Réseau de forteresses planétaires agrandi"
 mod_extend_soldier_workplace_desc: "Des plateformes de défense orbitale, des forteresses d'artillerie au sol et des générateurs de bouclier planétaire forment une défense en profondeur tenue par des gardes d'élite."
 decision_12_extend_soldier_workplace: "Plan 12 : Construire des forteresses de commandement planétaire"
 decision_12_extend_soldier_workplace_desc: "Davantage de plateformes orbitales, de forteresses au sol et de gardes professionnels renforceront notre capacité navale et établiront une ligne de défense imprenable dans le système."

 mod_extend_bio_trophy_workplace: "Réseau de sanctuaires organiques agrandi"
 mod_extend_bio_trophy_workplace_desc: "Un réseau de dômes écologiques, de centres culturels et de systèmes de soins automatisés, entretenu par les Serviteurs incontrôlables, offre un foyer permanent sûr et confortable à davantage d'êtres organiques."
 decision_13_extend_bio_trophy_workplace: "Plan 13 : Agrandir les sanctuaires organiques"
 decision_13_extend_bio_trophy_workplace_desc: "Agrandit les sanctuaires organiques, ajoutant 600 emplois de trophées biologiques, 600 logements et +10 % d'efficacité à ces emplois. Seuls les Serviteurs incontrôlables peuvent adopter ce plan."

 mod_extend_population_development: "Centre de développement démographique agrandi"
 mod_extend_population_development_desc: "La médecine reproductive, les pouponnières écologiques et les systèmes d'assemblage mécanique intégrés offrent à toutes les formes de vie les logements et le soutien technique nécessaires à une expansion durable."
 decision_14_extend_population_development: "Plan 14 : Construire un centre de développement démographique"
 decision_14_extend_population_development_desc: "Construit des installations intégrées de développement démographique, ajoute 600 logements et augmente de 10 % la vitesse de croissance démographique et la vitesse d'assemblage des pops mécaniques. Ce plan peut être répété."
