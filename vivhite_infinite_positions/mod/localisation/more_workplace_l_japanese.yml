l_japanese:
 decision_extend_workplace_expand: "職業拡張計画を展開"
 decision_extend_workplace_expand_desc: "このModが追加するすべての職業拡張ディシジョンを表示する。展開状態は現在の植民地にのみ適用され、セーブデータにも保持される。"
 decision_extend_workplace_collapse: "職業拡張計画を折りたたむ"
 decision_extend_workplace_collapse_desc: "このModの職業拡張ディシジョンを非表示にし、一覧を再び展開するための選択肢だけを残す。"

 mod_extend_urban_workplace: "拡張都市中枢"
 mod_extend_urban_workplace_desc: "軌道交通橋と垂直輸送回廊を備えた巨大都市。成長を続ける都市中枢は数十億の住民に近代的な住居と公共サービスを提供し、惑星文明の心臓部となる。"
 decision_00_extend_urban_workplace: "計画00：惑星規模の都市拡張計画を策定"
 decision_00_extend_urban_workplace_desc: "都市構造を再設計し軌道交通網を改良することで、この惑星の収容力を高め、増大する人口と経済を支える。"

 mod_extend_unity_workplace: "拡張行政司令塔"
 mod_extend_unity_workplace_desc: "高くそびえるホログラム司令塔には、量子支援意思決定システムと恒星間行政ネットワークが収められている。官僚とAI顧問が帝国政策を協調行動へ変える。"
 decision_01_extend_unity_workplace: "計画01：帝国行政を最適化"
 decision_01_extend_unity_workplace_desc: "効率的な政府は結束した文明の基盤である。行政機構を合理化し、協調システムを導入して複雑化する政務を管理する。"

 mod_extend_enforcer_workplace: "拡張惑星保安局"
 mod_extend_enforcer_workplace_desc: "軌道監視ステーションと地上の執行要塞は、神経抑止装置とリアルタイム犯罪予測網を備え、騒乱と犯罪を容赦なく抑え込む。"
 decision_02_extend_enforcer_workplace: "計画02：惑星保安ネットワークを強化"
 decision_02_extend_enforcer_workplace_desc: "保安ステーションと巡回拠点を増設し、厳格に訓練された執行官を配置することで、犯罪を抑制し惑星の長期的な安定を守る。"

 mod_extend_trade_workplace: "拡張恒星間交易拠点"
 mod_extend_trade_workplace_desc: "数十のハイパーレーンへ接続された巨大港を中心に、複数星系へ広がる商業複合体。自動物流、即時決済、星々の商人が帝国全土へ富を送り出す。"
 decision_03_extend_trade_workplace: "計画03：統合恒星間交易拠点を稼働"
 decision_03_extend_trade_workplace_desc: "新たな商業複合体と恒星間港、流通促進政策によって、この惑星の経済を活性化し星系間交易を拡大する。"

 mod_extend_physics_res_workplace: "拡張量子物理学研究所"
 mod_extend_physics_res_workplace_desc: "巨大な地下衝突リングと真空場観測所が初期宇宙の極限状態を再現する。研究者たちは時空、暗黒物質、高次元の謎を探究する。"
 decision_04_extend_physics_res_workplace: "計画04：高エネルギー粒子衝突器群を拡張"
 decision_04_extend_physics_res_workplace_desc: "高エネルギー衝突施設と真空場観測所を増設し、時空、エネルギー、物質の本質を前例のない規模で研究する。"

 mod_extend_society_res_workplace: "拡張社会シミュレーション施設"
 mod_extend_society_res_workplace_desc: "社会進化エンジンは数十億の仮想個体、数千年の制度変化、異星文化間の衝突を再現する。社会学者は統治制度を改善し、帝国分裂の芽を予測する。"
 decision_05_extend_society_res_workplace: "計画05：社会進化シミュレーションを構築"
 decision_05_extend_society_res_workplace_desc: "進歩には技術だけでなく社会組織への理解も必要だ。新たな研究所で人口管理、異星文化、政治制度を研究し、統治を改善する。"

 mod_extend_engineering_res_workplace: "拡張巨大構造物工学研究所"
 mod_extend_engineering_res_workplace_desc: "無重力組立施設、メタマテリアル鋳造所、AI支援設計センターからなる研究拠点。ダイソン球からタイタン級艦船まで、壮大な構想を建造可能な設計へ変える。"
 decision_06_extend_engineering_res_workplace: "計画06：巨大構造物実験施設を建設"
 decision_06_extend_engineering_res_workplace_desc: "理論を強大な艦隊と壮大な宇宙建造物へ変えるため、材料試験、構造設計、先進建造技術を統合した施設を設立する。"

 mod_extend_artisan_alloys_workplace: "拡張合金鋳造施設"
 mod_extend_artisan_alloys_workplace_desc: "中性子活性化とナノスケール格子再編を用いる合金炉群。自動生産ラインが惑星マントルの鉱石を帝国艦隊の強固な装甲と船体骨格へ鍛え上げる。"
 decision_07_extend_artisan_alloys_workplace: "計画07：先進合金生産ラインを設置"
 decision_07_extend_artisan_alloys_workplace_desc: "戦争と拡張は尽きない合金需要を生む。製錬ラインの増設と効率的な再資源化で、艦隊と巨大構造物へ高強度素材を供給する。"

 mod_extend_artisan_consumer_workplace: "拡張民需産業施設"
 mod_extend_artisan_consumer_workplace_desc: "自動生産ラインと分子組立工房が、知能端末から高級衣料まであらゆる民生品を製造する。豊富な物資は生活を向上させ、行政と研究を支える。"
 decision_08_extend_artisan_consumer_workplace: "計画08：消費財生産ラインを最適化"
 decision_08_extend_artisan_consumer_workplace_desc: "高い生活水準と行政・研究活動には、安定した消費財供給が必要だ。組立工場を拡張し、生産量を大幅に増やす。"

 mod_extend_generator_workplace: "拡張惑星エネルギー中枢"
 mod_extend_generator_workplace_desc: "核融合炉群と超伝導蓄電リングが、軌道太陽光収集網に接続された惑星規模のエネルギー心臓部を形成し、すべての都市と工場へ電力を送る。"
 decision_09_extend_generator_workplace: "計画09：核融合発電網を改良"
 decision_09_extend_generator_workplace_desc: "既存のエネルギー網を超伝導化して容量を拡大し、配電効率を高め、より多くの炉を稼働させてエネルギー産出を大幅に増加させる。"

 mod_extend_mining_workplace: "拡張深部採掘施設"
 mod_extend_mining_workplace_desc: "超深度掘削機とプラズマ破砕装置が惑星マントルへ迫る。重力勾配調査に導かれ、希少金属と戦略鉱物を絶え間なく鋳造所へ送り出す。"
 decision_10_extend_mining_workplace: "計画10：マントルの富鉱脈を開発"
 decision_10_extend_mining_workplace_desc: "最新の重力測定と地震波掘削技術により、地殻深部の豊かな鉱脈へ到達し、鉱物の総採掘量を大幅に増やす。"

 mod_extend_agri_workplace: "拡張垂直農業施設"
 mod_extend_agri_workplace_desc: "精密な環境制御を備えた数百層の農業塔。水耕栽培と気耕栽培で穀物、合成タンパク質、希少香辛料を生産し、帝国の食料安全保障を支える。"
 decision_11_extend_agri_workplace: "計画11：垂直農業アーコロジーを拡張"
 decision_11_extend_agri_workplace_desc: "限られた土地を最大限に活用するため、多層型農業生態系を建設する。垂直農場は食料産出を大幅に高め、帝国の供給を確実にする。"

 mod_extend_soldier_workplace: "拡張惑星要塞網"
 mod_extend_soldier_workplace_desc: "軌道防衛施設、地上砲兵要塞、惑星シールド発生装置が、精鋭守備隊の駐留する多層防衛網を形成する。侵略者はこの堅固な砦の前に砕け散る。"
 decision_12_extend_soldier_workplace: "計画12：惑星防衛司令要塞を建設"
 decision_12_extend_soldier_workplace_desc: "軌道防衛施設と地上要塞を増設し、専門の惑星守備隊を配備することで、艦隊許容量を強化し星系に難攻不落の防衛線を築く。"

 mod_extend_bio_trophy_workplace: "拡張有機体の聖域網"
 mod_extend_bio_trophy_workplace_desc: "暴走する奉仕機械が維持する生態ドーム、文化施設、自動介護網。より多くの有機生命へ、安全で快適かつ心配のない恒久的な住まいを提供する。"
 decision_13_extend_bio_trophy_workplace: "計画13：有機体の聖域を拡張"
 decision_13_extend_bio_trophy_workplace_desc: "有機体の聖域を拡張し、バイオトロフィーの職業を600、住居を600、バイオトロフィー職業の効率を+10%追加する。この計画は暴走する奉仕機械のみ実行できる。"

 mod_extend_population_development: "拡張人口開発センター"
 mod_extend_population_development_desc: "生殖医療、生態育成施設、機械組立システムを統合し、あらゆる生命形態の持続的な拡大に必要な住居と技術支援を提供する。"
 decision_14_extend_population_development: "計画14：人口開発センターを建設"
 decision_14_extend_population_development_desc: "総合人口開発施設を建設し、住居を600追加するとともに、人口増加速度と機械POP製造速度をそれぞれ10%上昇させる。この計画は繰り返し実行できる。"
