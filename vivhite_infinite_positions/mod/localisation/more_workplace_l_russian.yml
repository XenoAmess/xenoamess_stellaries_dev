l_russian:
 decision_extend_workplace_expand: "Развернуть планы расширения рабочих мест"
 decision_extend_workplace_expand_desc: "Показывает все решения по расширению рабочих мест, добавленные этим модом. Развёрнутое состояние действует только на текущей колонии и сохраняется в сохранениях игры."
 decision_extend_workplace_collapse: "Свернуть планы расширения рабочих мест"
 decision_extend_workplace_collapse_desc: "Скрывает решения этого мода по расширению рабочих мест, оставляя только возможность снова развернуть список."

 mod_extend_urban_workplace: "Расширенное городское ядро"
 mod_extend_urban_workplace_desc: "Огромный мегаполис с орбитальными транзитными мостами и вертикальными транспортными коридорами. Растущее городское ядро обеспечивает миллиарды жителей современным жильём и услугами."
 decision_00_extend_urban_workplace: "План 00: Разработать программу планетарного расширения городов"
 decision_00_extend_urban_workplace_desc: "Перестроив городскую среду и обновив орбитальные транспортные сети, мы увеличим вместимость этого мира для растущего населения и экономики."

 mod_extend_unity_workplace: "Расширенный административный командный шпиль"
 mod_extend_unity_workplace_desc: "Высокие голографические шпили вмещают квантовые системы принятия решений и межзвёздные административные сети. Чиновники и советники-ИИ превращают политику империи в согласованные действия."
 decision_01_extend_unity_workplace: "План 01: Оптимизировать имперскую администрацию"
 decision_01_extend_unity_workplace_desc: "Эффективное правительство — основа единой цивилизации. Мы упростим административную структуру и внедрим совместные системы для управления всё более сложными делами."

 mod_extend_enforcer_workplace: "Расширенное управление планетарной безопасности"
 mod_extend_enforcer_workplace_desc: "Орбитальные станции наблюдения и наземные бастионы правопорядка с нейронным сдерживанием и прогнозированием преступности в реальном времени подавляют беспорядки и преступность."
 decision_02_extend_enforcer_workplace: "План 02: Усилить сеть планетарной безопасности"
 decision_02_extend_enforcer_workplace_desc: "Дополнительные станции безопасности и патрульные посты с тщательно обученным персоналом помогут сдержать преступность и сохранить долговременную стабильность планеты."

 mod_extend_trade_workplace: "Расширенный межзвёздный торговый узел"
 mod_extend_trade_workplace_desc: "Торговый комплекс охватывает звёздные системы и сосредоточен вокруг огромного порта, связанного с десятками гиперлиний. Автоматическая логистика и торговцы направляют богатство по всей империи."
 decision_03_extend_trade_workplace: "План 03: Активировать единый межзвёздный торговый узел"
 decision_03_extend_trade_workplace_desc: "Новые торговые комплексы, межзвёздные порты и меры по поддержке обмена оживят экономику этого мира и расширят торговлю между системами."

 mod_extend_physics_res_workplace: "Расширенный институт квантовой физики"
 mod_extend_physics_res_workplace_desc: "Огромные подземные кольца коллайдеров и обсерватории вакуумного поля воссоздают экстремальные условия ранней Вселенной. Здесь изучают пространство-время, тёмную материю и высшие измерения."
 decision_04_extend_physics_res_workplace: "План 04: Расширить массивы высокоэнергетических коллайдеров"
 decision_04_extend_physics_res_workplace_desc: "Дополнительные коллайдерные платформы и обсерватории вакуумного поля позволят исследовать природу пространства-времени, энергии и материи с небывалым размахом."

 mod_extend_society_res_workplace: "Расширенный комплекс социального моделирования"
 mod_extend_society_res_workplace_desc: "Движок социальной эволюции моделирует миллиарды виртуальных существ, тысячелетия институциональных перемен и конфликты инопланетных культур, совершенствуя системы управления."
 decision_05_extend_society_res_workplace: "План 05: Создать систему моделирования социальной эволюции"
 decision_05_extend_society_res_workplace_desc: "Прогресс зависит и от понимания устройства обществ. Новые лаборатории изучат управление населением, инопланетные культуры и политические институты."

 mod_extend_engineering_res_workplace: "Расширенный институт инженерии мегасооружений"
 mod_extend_engineering_res_workplace_desc: "Монтажные платформы невесомости, литейные метаматериалов и проектные центры с ИИ образуют комплекс, где сферы Дайсона и корабли класса «Титан» превращаются в выполнимые проекты."
 decision_06_extend_engineering_res_workplace: "План 06: Построить экспериментальную платформу мегасооружений"
 decision_06_extend_engineering_res_workplace_desc: "Чтобы воплотить теорию в могучих флотах и монументальных космических сооружениях, мы создадим центр испытания материалов, проектирования конструкций и передовых технологий строительства."

 mod_extend_artisan_alloys_workplace: "Расширенный комплекс литейных сплавов"
 mod_extend_artisan_alloys_workplace_desc: "Неутомимый комплекс печей использует нейтронную активацию и наноразмерную перестройку решётки. Автоматические линии превращают руды мантии в броню и каркасы имперского флота."
 decision_07_extend_artisan_alloys_workplace: "План 07: Создать передовые линии производства сплавов"
 decision_07_extend_artisan_alloys_workplace_desc: "Война и экспансия создают неутолимый спрос на сплавы. Новые плавильные линии и эффективная переработка обеспечат флот и мегасооружения прочными материалами."

 mod_extend_artisan_consumer_workplace: "Расширенный комплекс гражданской промышленности"
 mod_extend_artisan_consumer_workplace_desc: "Автоматические линии и цеха молекулярной сборки производят всё — от умных терминалов до роскошной одежды. Изобилие товаров улучшает жизнь и поддерживает администрацию и исследования."
 decision_08_extend_artisan_consumer_workplace: "План 08: Оптимизировать производство товаров массового спроса"
 decision_08_extend_artisan_consumer_workplace_desc: "Высокий уровень жизни, администрация и исследования требуют надёжных поставок товаров массового спроса. Этот план расширит сборочные предприятия и значительно повысит выпуск."

 mod_extend_generator_workplace: "Расширенный планетарный энергоузел"
 mod_extend_generator_workplace_desc: "Массивы термоядерных реакторов и сверхпроводящие накопительные кольца образуют энергетическое сердце планеты, связанное с орбитальной солнечной сетью и питающее каждый город и завод."
 decision_09_extend_generator_workplace: "План 09: Модернизировать сеть термоядерной энергетики"
 decision_09_extend_generator_workplace_desc: "Переход на сверхпроводящие системы и увеличение ёмкости сети улучшат распределение, позволят использовать больше реакторов и значительно нарастят производство энергии."

 mod_extend_mining_workplace: "Расширенный комплекс глубинной добычи"
 mod_extend_mining_workplace_desc: "Сверхглубокие буровые установки и системы плазменного дробления тянутся к мантии планеты. Гравиметрические исследования направляют непрерывную добычу редких металлов и стратегических минералов."
 decision_10_extend_mining_workplace: "План 10: Освоить богатые рудные жилы мантии"
 decision_10_extend_mining_workplace_desc: "Новейшие гравиметрические исследования и сейсмическое бурение позволят достичь богатых рудных жил глубоко в коре и значительно увеличить общую добычу минералов."

 mod_extend_agri_workplace: "Расширенный комплекс вертикальных ферм"
 mod_extend_agri_workplace_desc: "Сотни уровней аграрных башен с точным климат-контролем используют гидро- и аэропонику для производства зерна, синтетического белка и редких специй, обеспечивая продовольствие империи."
 decision_11_extend_agri_workplace: "План 11: Расширить вертикальные аграрные аркологии"
 decision_11_extend_agri_workplace_desc: "Чтобы максимально использовать ограниченную землю, мы создадим многоуровневые сельскохозяйственные экосистемы. Вертикальные фермы повысят производство и защитят снабжение империи."

 mod_extend_soldier_workplace: "Расширенная сеть планетарных крепостей"
 mod_extend_soldier_workplace_desc: "Орбитальные оборонные платформы, наземные артиллерийские крепости и генераторы планетарных щитов образуют эшелонированную оборону с элитными гарнизонами."
 decision_12_extend_soldier_workplace: "План 12: Построить планетарные крепости оборонного командования"
 decision_12_extend_soldier_workplace_desc: "Дополнительные орбитальные платформы, наземные крепости и профессиональная планетарная стража укрепят вместимость флота и создадут неприступную линию обороны."

 mod_extend_bio_trophy_workplace: "Расширенная сеть органических заповедников"
 mod_extend_bio_trophy_workplace_desc: "Сеть экологических куполов, культурных центров и автоматических систем ухода, обслуживаемая Машиной-служителем, предоставляет большему числу органических существ безопасный и уютный дом."
 decision_13_extend_bio_trophy_workplace: "План 13: Расширить вместимость органических заповедников"
 decision_13_extend_bio_trophy_workplace_desc: "Расширяет органические заповедники: +600 рабочих мест биотрофеев, +600 жилья и +10% эффективности рабочих мест биотрофеев. Этот план доступен только Машинам-служителям."
