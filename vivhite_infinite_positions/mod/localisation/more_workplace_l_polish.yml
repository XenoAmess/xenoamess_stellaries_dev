l_polish:
 decision_extend_workplace_expand: "Rozwiń plany rozbudowy miejsc pracy"
 decision_extend_workplace_expand_desc: "Wyświetla wszystkie decyzje o rozbudowie miejsc pracy dodane przez ten mod. Stan rozwinięcia dotyczy tylko bieżącej kolonii i jest zachowywany w zapisach gry."
 decision_extend_workplace_collapse: "Zwiń plany rozbudowy miejsc pracy"
 decision_extend_workplace_collapse_desc: "Ukrywa decyzje o rozbudowie miejsc pracy z tego moda, pozostawiając jedynie możliwość ponownego rozwinięcia listy."

 mod_extend_urban_workplace: "Rozbudowane centrum miejskie"
 mod_extend_urban_workplace_desc: "Ogromne supermiasto z orbitalnymi mostami tranzytowymi i pionowymi korytarzami transportowymi. Stale rosnące centrum zapewnia miliardom nowoczesne mieszkania i usługi publiczne."
 decision_00_extend_urban_workplace: "Plan 00: Opracuj planetarny program rozbudowy miast"
 decision_00_extend_urban_workplace_desc: "Przebudowa tkanki miejskiej i modernizacja orbitalnych sieci tranzytowych zwiększą pojemność tego świata, wspierając rosnącą populację i gospodarkę."

 mod_extend_unity_workplace: "Rozbudowana iglica dowództwa administracyjnego"
 mod_extend_unity_workplace_desc: "Wysokie holograficzne iglice mieszczą kwantowo wspomagane systemy decyzyjne i międzygwiezdne sieci administracyjne. Urzędnicy i doradcy SI koordynują tu politykę imperium."
 decision_01_extend_unity_workplace: "Plan 01: Zoptymalizuj administrację imperialną"
 decision_01_extend_unity_workplace_desc: "Sprawny rząd jest podstawą spójnej cywilizacji. Uprościmy strukturę administracyjną i wdrożymy systemy współpracy do zarządzania coraz bardziej złożonymi sprawami."

 mod_extend_enforcer_workplace: "Rozbudowana dyrekcja bezpieczeństwa planetarnego"
 mod_extend_enforcer_workplace_desc: "Orbitalne stacje nadzoru i bastiony porządkowe z odstraszaniem neuronowym oraz prognozowaniem przestępczości w czasie rzeczywistym skutecznie tłumią niepokoje i zbrodnie."
 decision_02_extend_enforcer_workplace: "Plan 02: Wzmocnij planetarną sieć bezpieczeństwa"
 decision_02_extend_enforcer_workplace_desc: "Dodatkowe stacje bezpieczeństwa i posterunki patrolowe, obsadzone rygorystycznie wyszkolonym personelem, ograniczą przestępczość i zachowają długotrwałą stabilność planety."

 mod_extend_trade_workplace: "Rozbudowany międzygwiezdny węzeł handlowy"
 mod_extend_trade_workplace_desc: "Kompleks handlowy obejmujący układy gwiezdne, skupiony wokół olbrzymiego portu połączonego z dziesiątkami hipertras. Automatyczna logistyka i kupcy rozprowadzają bogactwo po imperium."
 decision_03_extend_trade_workplace: "Plan 03: Uruchom zjednoczony międzygwiezdny węzeł handlowy"
 decision_03_extend_trade_workplace_desc: "Nowe kompleksy handlowe, porty międzygwiezdne i polityka wspierająca wymianę ożywią gospodarkę tego świata oraz handel między układami."

 mod_extend_physics_res_workplace: "Rozbudowany instytut fizyki kwantowej"
 mod_extend_physics_res_workplace_desc: "Ogromne podziemne pierścienie zderzeniowe i obserwatoria pola próżniowego odtwarzają skrajne warunki wczesnego wszechświata. Badacze zgłębiają czasoprzestrzeń, ciemną materię i wyższe wymiary."
 decision_04_extend_physics_res_workplace: "Plan 04: Rozbuduj akceleratory cząstek wysokiej energii"
 decision_04_extend_physics_res_workplace_desc: "Dodatkowe platformy zderzeniowe i obserwatoria pola próżniowego pozwolą badać naturę czasoprzestrzeni, energii i materii z niespotykanym dotąd rozmachem."

 mod_extend_society_res_workplace: "Rozbudowany kompleks symulacji społecznych"
 mod_extend_society_res_workplace_desc: "Silnik ewolucji społecznej symuluje miliardy wirtualnych jednostek, tysiąclecia przemian instytucjonalnych i konflikty obcych kultur, pomagając doskonalić systemy rządów."
 decision_05_extend_society_res_workplace: "Plan 05: Zbuduj system symulacji ewolucji społecznej"
 decision_05_extend_society_res_workplace_desc: "Postęp zależy także od zrozumienia organizacji społeczeństw. Nowe laboratoria zbadają zarządzanie populacją, obce kultury i instytucje polityczne."

 mod_extend_engineering_res_workplace: "Rozbudowany instytut inżynierii megastruktur"
 mod_extend_engineering_res_workplace_desc: "Platformy montażowe w zerowej grawitacji, odlewnie metamateriałów i centra projektowe wspomagane SI tworzą kampus, gdzie sfery Dysona i okręty klasy tytan stają się wykonalnymi projektami."
 decision_06_extend_engineering_res_workplace: "Plan 06: Zbuduj platformę doświadczalną megastruktur"
 decision_06_extend_engineering_res_workplace_desc: "Aby przemienić teorię w potężne floty i monumentalne budowle kosmiczne, utworzymy centrum testów materiałów, projektowania konstrukcji i zaawansowanych technik budowy."

 mod_extend_artisan_alloys_workplace: "Rozbudowany kompleks odlewni stopów"
 mod_extend_artisan_alloys_workplace_desc: "Niestrudzony zespół pieców wykorzystuje aktywację neutronową i nanoskalową przebudowę sieci krystalicznych. Automatyczne linie przekuwają rudy płaszcza w pancerze i szkielety floty."
 decision_07_extend_artisan_alloys_workplace: "Plan 07: Uruchom zaawansowane linie produkcji stopów"
 decision_07_extend_artisan_alloys_workplace_desc: "Wojna i ekspansja tworzą nienasycony popyt na stopy. Dodatkowe linie wytopu i wydajniejszy recykling zaopatrzą nasze floty oraz megastruktury."

 mod_extend_artisan_consumer_workplace: "Rozbudowany kompleks przemysłu cywilnego"
 mod_extend_artisan_consumer_workplace_desc: "Automatyczne linie i warsztaty montażu molekularnego wytwarzają wszystko, od inteligentnych terminali po luksusową odzież. Obfitość dóbr wspiera życie, administrację i badania."
 decision_08_extend_artisan_consumer_workplace: "Plan 08: Zoptymalizuj produkcję dóbr konsumpcyjnych"
 decision_08_extend_artisan_consumer_workplace_desc: "Wysoki poziom życia oraz działanie administracji i nauki wymagają pewnych dostaw dóbr konsumpcyjnych. Ten plan rozbuduje zakłady montażowe i znacznie zwiększy produkcję."

 mod_extend_generator_workplace: "Rozbudowany planetarny węzeł energetyczny"
 mod_extend_generator_workplace_desc: "Zespoły reaktorów fuzyjnych i nadprzewodzące pierścienie magazynujące tworzą planetarne serce energetyczne połączone z orbitalną siecią słoneczną, zasilającą każde miasto i fabrykę."
 decision_09_extend_generator_workplace: "Plan 09: Zmodernizuj sieć energii fuzyjnej"
 decision_09_extend_generator_workplace_desc: "Przebudowa sieci na systemy nadprzewodzące i zwiększenie jej pojemności poprawią dystrybucję, pozwolą obsłużyć więcej reaktorów i wyraźnie podniosą produkcję energii."

 mod_extend_mining_workplace: "Rozbudowany kompleks głębinowego wydobycia"
 mod_extend_mining_workplace_desc: "Ultragłębokie wiertnice i systemy kruszenia plazmowego sięgają ku płaszczowi planety. Kierowane pomiarami grawimetrycznymi nieustannie wydobywają rzadkie metale i minerały strategiczne."
 decision_10_extend_mining_workplace: "Plan 10: Wydobądź bogate złoża z płaszcza"
 decision_10_extend_mining_workplace_desc: "Najnowsze badania grawimetryczne i techniki wierceń sejsmicznych pozwolą sięgnąć do bogatych żył głęboko w skorupie i znacznie zwiększyć całkowite wydobycie minerałów."

 mod_extend_agri_workplace: "Rozbudowany kompleks farm pionowych"
 mod_extend_agri_workplace_desc: "Setki poziomów precyzyjnie kontrolowanych wież rolniczych wykorzystują hydroponikę i aeroponikę do produkcji zbóż, białka syntetycznego i rzadkich przypraw, gwarantując żywność imperium."
 decision_11_extend_agri_workplace: "Plan 11: Rozbuduj pionowe arkologie rolnicze"
 decision_11_extend_agri_workplace_desc: "Aby najlepiej wykorzystać ograniczony teren, zbudujemy wielopoziomowe ekosystemy rolnicze. Pionowe farmy zwiększą produkcję żywności i zabezpieczą dostawy imperium."

 mod_extend_soldier_workplace: "Rozbudowana sieć fortec planetarnych"
 mod_extend_soldier_workplace_desc: "Orbitalne platformy obronne, naziemne forty artyleryjskie i generatory osłon planetarnych tworzą warstwową obronę obsadzoną przez elitarne oddziały."
 decision_12_extend_soldier_workplace: "Plan 12: Zbuduj planetarne fortece dowodzenia obroną"
 decision_12_extend_soldier_workplace_desc: "Dodatkowe platformy orbitalne, fortece naziemne i zawodowa straż planetarna wzmocnią naszą pojemność floty i ustanowią nieprzeniknioną linię obrony."

 mod_extend_bio_trophy_workplace: "Rozbudowana sieć sanktuariów organicznych"
 mod_extend_bio_trophy_workplace_desc: "Sieć kopuł ekologicznych, ośrodków kultury i automatycznych systemów opieki utrzymywana przez Zbuntowane jednostki opiekuńcze zapewnia większej liczbie istot organicznych bezpieczny dom."
 decision_13_extend_bio_trophy_workplace: "Plan 13: Zwiększ pojemność sanktuariów organicznych"
 decision_13_extend_bio_trophy_workplace_desc: "Rozbudowuje sanktuaria organiczne, dodając 600 miejsc pracy Biotrofeów, 600 mieszkań i +10% wydajności pracy Biotrofeów. Tylko Zbuntowane jednostki opiekuńcze mogą wdrożyć ten plan."
