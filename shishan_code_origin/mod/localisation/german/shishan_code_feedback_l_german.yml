l_german:
 shishan_code_architecture_jobs:0 "Integrierte Dienstarchitektur der alten Ära auf Grundlage geringer Kohäsion und hoher Kopplung"
 shishan_code_architecture_jobs_desc:0 "Alle tatsächlich vorhandenen Spezieseigenschaften, positive wie negative, werden nach der realen heimischen Bevölkerung der Hauptspezieslinie gewichtet. Jede effektive Eigenschaft gewährt additiv +5% Jobproduktion, ohne den Unterhalt zu erhöhen. Nach Ausschöpfung der begrenzten Belohnungspools zählt jede Patch-Ebene als eine Eigenschaft, ohne Obergrenze. Diese Vorabversion verwendet additive Boni; eine unabhängige Multiplikation ist noch nicht implementiert."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Erfasste Bevölkerung der Hauptspezieslinie [Root.shishan_code_architecture_population]; mittlere tatsächliche Eigenschaften U [Root.shishan_code_architecture_trait_average]; Wiederholungsebenen R [Root.shishan_code_architecture_repeat_count]; effektive Eigenschaften T [Root.shishan_code_architecture_total]; additiver Jobproduktionskoeffizient [Root.shishan_code_architecture_bonus] (0.05 entspricht 5%). Diese Werte stellen keinen tatsächlichen unabhängigen Einkommensmultiplikator dar."
 shishan_code_reward_title:0 "Verbesserung dieser Wartung wählen"
 shishan_code_reward_desc:0 "Eine von bis zu drei Optionen derselben Stufe wählen. Nur geeignete tatsächlich vorhandene heimische Vorlagen erhalten die gewählte Eigenschaft. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Neue Optionen erzeugen"
 shishan_code_reward_reroll_unavailable:0 "Noch [Root.shishan_code_reroll_cooldown] tatsächliche Eigenschaftswahlen abschließen. Neue Optionen sind nur verfügbar, wenn dieser Vorgang noch nicht neu ausgewürfelt wurde und Alternativen existieren."
 shishan_code_reward_later:0 "Später wählen"
 shishan_code_reward_claim_tooltip:0 "Ändert nur geeignete tatsächlich vorhandene heimische Vorlagen. Ausländische und widersprüchliche Vorlagen bleiben unverändert; ursprüngliche Effekte und Unterhalt der Eigenschaft bleiben erhalten."
 shishan_code_reward_repeat_result:0 "Die tatsächlichen Eigenschaftsbelohnungen sind ausgeschöpft. Diese Belohnung fügt eine Wachstumsebene hinzu. $shishan_code_architecture_summary$"
