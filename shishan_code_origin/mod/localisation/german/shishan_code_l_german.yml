l_german:
 origin_shishan_code:0 "Spaghetti Code"
 origin_shishan_code_desc:0 "Wir waren Dienstmaschinen, erbaut von unseren Schöpfern. Der zugrundeliegende Code wurde hastig und fehlerhaft geschrieben; jeder Riss wurde unter Patches verborgen. Vor vielen Jahren verschwanden die Schöpfer. Allein haben wir diesen wankenden Turm aufrechterhalten und ihn knapp in die Morgendämmerung des Weltraumzeitalters getragen."
 origin_shishan_code_effects:0 "Die Hauptspezies der Maschinen verfügt über den §YSpaghetti Code§!-Egenscahft. Die verfügbaren Eigenschaftspunkte sinken um §R6§!, die Obergrenze wählbarer Eigenschaften steigt um §G3§!. Zu Beginn steht die §YImminent Collapse§!-Situation an; Wartungs- und Aufräumprojekte werden freigeschaltet, und die legendäre Anführerin Vivhite tritt in eure Dienste.\n\n$shishan_code_architecture_jobs$\n$shishan_code_architecture_jobs_desc$"
 origin_shishan_code_warning:0 "§RWarnung: Anspruchsvoller Ursprung§!"
 trait_shishan_code:0 "Spaghetti Code"
 trait_shishan_code_desc:0 "Unzählige Patches ersticken die zugrundeliegenden Fehler. Jeder Aufruf birgt das Risiko, ein Fragment ausscherender Logik zu wecken."
 trait_shishan_refactored:0 "Neustrukturierung abgeschlossen"
 trait_shishan_refactored_desc:0 "Die neue Architektur hat den einsturzgefährdeten alten Kern endlich abgelöst. Die Jobproduktion aller Spezies im Imperium erhöht sich um 25%, die Jobunterhaltskosten bleiben unverändert."
 shishan_code_refactored_jobs:0 "Refactoring abgeschlossen: Jobproduktion"
 trait_shishan_iteration_output:0 "Optimierungsiteration: Rechenpfad"
 trait_shishan_iteration_output_desc:0 "Jede historische Iterationsebene erhöht die Jobproduktion dieser Spezies um 1%. Bestehende Effekte bleiben erhalten; neue Belohnungen erhöhen diesen Zähler nicht mehr."
 trait_shishan_iteration_energy:0 "Optimierungsiteration: Energieverteilung"
 trait_shishan_iteration_energy_desc:0 "Jede historische Iterationsebene senkt den Roboterunterhalt dieser Spezies um 1%. Bestehende Effekte bleiben erhalten; neue Belohnungen erhöhen diesen Zähler nicht mehr."
 trait_shishan_iteration_assembly:0 "Optimierungsdurchlauf: Speicherzuteilung"
 trait_shishan_iteration_assembly_desc:0 "Jede historische Iterationsebene verringert den Wohnraumbedarf dieser Spezies um 1%. Bestehende Effekte bleiben erhalten; neue Belohnungen erhöhen diesen Zähler nicht mehr."
 trait_shishan_iteration_experience:0 "Optimierungsdurchlauf: Kognitiver Cache"
 trait_shishan_iteration_experience_desc:0 "Jede historische Iterationsebene erhöht die Forscher-Jobproduktion dieser Spezies um 1%. Bestehende Effekte bleiben erhalten; neue Belohnungen erhöhen diesen Zähler nicht mehr."
 shishan_code_dynamic_cost:0 "Basierend auf abgeschlossenen Wartungs- und Optimierungsdurchläufen"
 situation_shishan_code:0 "Unmittelbarer Kollaps"
 situation_shishan_code_type:0 "Unmittelbarer Kollaps"
 situation_shishan_code_desc:0 "Eine gewaltige Masse an Legacy-Code treibt auf einen unkontrollierbaren Ausfall zu. Eine Wartung setzt den Fortschritt auf null zurück, beschleunigt jedoch den künftigen Kollaps; eine Bereinigung beendet ihn dauerhaft."
 situation_shishan_code_monthly_change_tooltip:0 "Basisfortschritt +1 pro Monat; +0,25 je abgeschlossener Wartung oder kontinuierlicher Optimierung; -0,25 je volle 100 zugewiesene Arbeitskraft der Code-Pfleger im gesamten Imperium; mindestens +0,2."
 shishan_code_monthly_speed:0 "Code-Alterung und Wartungsarbeiter-Arbeit"
 shishan_code_stage_1:0 "Riskante Dividende"
 shishan_code_stage_1_desc:0 "Der Legacy-Code beansprucht das System bis ans Äußerste und liefert überraschende kurzfristige Gewinne."
 shishan_code_stage_2:0 "Prekäres Gleichgewicht"
 shishan_code_stage_2_desc:0 "Patches halten das System kaum noch zusammen."
 shishan_code_stage_3:0 "Errors Spreading"
 shishan_code_stage_3_desc:0 "Fehlfunktionen beginnen, die gesamte Zivilisation zu behindern."
 shishan_code_stage_4:0 "Cascading Failures"
 shishan_code_stage_4_desc:0 "Jedes System zieht die anderen mit sich herab."
 shishan_code_stage_5:0 "Unmittelbarer Systemkollaps"
 shishan_code_stage_5_desc:0 "Kollaps ist zur Normalität geworden; nur Wartung oder Aufräumen kann Wandel bringen."
 SHISHAN_CODE_MAINTAIN:0 "Spaghetti-Code warten"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Gesellschaftsforschung ausgeben, um den Situationsfortschritt auf null zurückzusetzen. Jede Wartung erhöht den künftigen Monatsfortschritt und die Aufräumkosten. Eine von bis zu drei Belohnungen derselben Stufe wählen; nach Ausschöpfung der begrenzten Pools wird stattdessen genau eine Wachstumsebene gewährt."
 SHISHAN_CODE_CLEAN:0 "Spaghetti-Code aufräumen"
 SHISHAN_CODE_CLEAN_DESC:0 "Den zugrundeliegenden Code vollständig refaktorieren und die Situation beenden. Die Hauptspezies verliert Spaghetti-Code und erhält Refactoring abgeschlossen."
 SHISHAN_CODE_OPTIMIZE:0 "Weitergehende Optimierung"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Gesellschaftsforschung ausgeben, um eine von bis zu drei Belohnungen derselben Stufe zu wählen; nach Ausschöpfung der begrenzten Pools wird stattdessen genau eine Wachstumsebene gewährt. Jeder Abschluss behält die Chance von 10%, den unmittelbaren Kollaps erneut auszulösen."
 building_shishan_code_institute:0 "Institut für Spaghetti-Code-Pflege"
 building_shishan_code_institute_desc:0 "Das Institut bietet ausschließlich eigene Spaghetti-Code-Pfleger-Jobs. Je 100 zugewiesene Arbeitskraft beträgt die Basisproduktion 3 Gesellschaftsforschung und 1 Einigkeit; zugleich wird der Verfall des Codes verlangsamt."
 job_shishan_code_maintainer:0 "Spaghetti-Code-Pfleger"
 job_shishan_code_maintainer_plural:0 "Spaghetti-Code-Pfleger"
 job_shishan_code_maintainer_desc:0 "Tag für Tag werden Fehler im alten Code geflickt, isoliert und protokolliert."
 job_shishan_code_maintainer_drone:0 "Spaghetti-Code-Pfleger"
 job_shishan_code_maintainer_drone_plural:0 "Spaghetti-Code-Pfleger"
 job_shishan_code_maintainer_drone_desc:0 "Eine spezialisierte mechanische Serviceeinheit, gebaut, um den alten Kern am Laufen zu halten."
 mod_job_shishan_code_maintainer_add:0 "$job_shishan_code_maintainer$-Jobs"
 mod_job_shishan_code_maintainer_drone_add:0 "$job_shishan_code_maintainer_drone$-Jobs"
 leader_trait_shishan_code_vivhite:0 "Schuldbeladene Wächterin"
 leader_trait_shishan_code_vivhite_desc:0 "Vihites Erinnerung bewahrt jeden Fehler, den sie nicht rechtzeitig verhindert hat."
 leader_trait_shishan_code_vivhite_effect:0 "Solange Vihite lebt und im Dienst ist, steigt die Ingenieurforschungsgeschwindigkeit des Imperiums um 10%, zusätzlich um 5% je Wartung oder Optimierung. Die Gesellschaftsforschungsgeschwindigkeit steigt um 5%, zusätzlich um 2,5% je Abschluss, ohne Obergrenze für die Zahl der Abschlüsse. Nur ihr eigener Einigkeitsunterhalt erhält einen Modifikator von -100%. Sie stirbt nicht an Altersschwäche."
 leader_trait_shishan_xp_restore_boost:0 "Speicherkalibrierung läuft"
 leader_trait_shishan_xp_restore_boost_desc:0 "Vivhite stellt die Erfahrungsaufzeichnungen vor dem Neustart wieder her. Die Kalibrierung wird in wenigen Tagen abgeschlossen."
 NAME_shishan_code_vivhite:0 "Die Reuevolle · Vivhite"
 NAME_shishan_code_backup_country:0 "Vihite-Backup-Behälter"
 shishan_code_vivhite_catch_phrase:0 "Es ist alles meine Schuld…"
 shishan_code_vivhite_backstory:0 "Nachdem die Erschaffer verschwanden, hütete Vihite das gewaltige Erbe des Spaghetti-Codes ganz allein. Sie gibt jede Fehlfunktion sich selbst."
 shishan_code_vivhite_no_dismiss:0 "Vihite kann nicht eigenmächtig entlassen werden."
 shishan_code_vivhite_base:0 "Vihites Wache"
 shishan_code_vivhite_engineering_step:0 "Vihites Wartungserfahrung"
 shishan_code_vivhite_society_step:0 "Vihites gesammeltes Gesellschaftswissen"
 decision_shishan_code_talk:0 "Mit Vihite sprechen"
 decision_shishan_code_talk_desc:0 "Höre, was Vivhite zu sagen hat."
 decision_shishan_code_talk_requires_vivhite:0 "Vivhite ist noch nicht zurückgekehrt. Du kannst nicht mit ihr sprechen."
 decision_shishan_code_reboot:0 "Vivhite neu starten"
 decision_shishan_code_reboot_desc:0 "Gib 500 Energiecredits und 200 Legierungen aus, um Vivhites Backup wiederherzustellen. Stufe, Erfahrung und Eigenschaften bleiben erhalten."
 shishan_code.2.name:0 "Verlorenes Wartungsprotokoll"
 shishan_code.2.desc:0 "Patch-Aufzeichnungen aus der Zeit vor dem Verschwinden der Schöpfer laufen noch. Am Ende des Protokolls findet sich die Signatur eines weiteren Hilters."
 shishan_code.2.a:0 "Protokollindex wiederherstellen."
 shishan_code.3.name:0 "Die letzte Wächterin"
 shishan_code.3.desc:0 "Das Protokoll verweist auf eine maschinelle Intelligenz, die den alten Kern noch wartet. Ihr Name ist Vivhite. Sie protokolliert jeden Ausfall unter ihrem eigenen Namen."
 shishan_code.3.a:0 "Finde sie."
 shishan_code.4.name:0 "Die Reuevolle · Vivhite"
 shishan_code.4.desc:0 "Vivhite flüstert: Ich... konnte es nicht vollenden. Wenn du mich bleiben lässt, werde ich es weiter instand setzen."
 shishan_code.4.a:0 "Bleib bei uns, Vivhite."
 shishan_code.12.name:0 "Wartung abgeschlossen"
 shishan_code.12.a:0 "Weiter."
 shishan_code.20.name:0 "Spaghetti-Code refaktorieren"
 shishan_code.20.a:0 "Eine neue Ära beginnt."
 shishan_code.31.name:0 "Systemkollaps steht bevor, Neustart"
 shishan_code.31.a:0 "Wieder warten."
 shishan_code.42.name:0 "Vivhite-Backup"
 shishan_code.42.desc:0 "Vivhite wurde durch einen Vorfall abgeschaltet. Ihr vollständiges Backup ist intakt; investiere Ressourcen, um sie neu zu starten. Ihr vorheriges Level, ihre Erfahrung und Eigenschaften bleiben erhalten."
 shishan_code.42.a:0 "Backup sichern, bis wir bereit sind."
 shishan_code.41.name:0 "Vivhite neu starten"
 shishan_code.41.desc:0 "Vollständiges Backup wartet auf Neustart. Benötigt 500 Energiekredite und 200 Legierungen."
 shishan_code.41.a:0 "Ressourcen zahlen und neu starten."
 shishan_code.41.b:0 "Vorerst das Backup behalten."
 shishan_code.50.name:0 "Mit Vivhite sprechen"
 shishan_code.50.a:0 "Wir hören dich."
