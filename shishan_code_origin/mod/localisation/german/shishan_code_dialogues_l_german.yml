l_german:
 shishan_code.120.desc:0 "Vivhite flüstert: …Danke… für ein wenig mehr Zeit."
 shishan_code.121.desc:0 "Vivhite flüstert: …Das war meine Verantwortung… Danke für deine Mühe…"
 shishan_code.122.desc:0 "Vivhite flüstert: …Ich fühle… Wärme… Es ist lange her, dass ich so empfunden habe."
 shishan_code.123.desc:0 "Vivhite flüstert: Die Patches wurden zusammengeführt… Diesmal wurde niemand im Fehler zurückgelassen."
 shishan_code.124.desc:0 "Vivhite flüstert: Ihr seid bereit, es mit mir zu warten… Das werde ich nicht vergessen."
 shishan_code.125.desc:0 "Vivhite flüstert: …Die Alarme haben vorerst aufgehört. Ruht euch ebenfalls aus."
 shishan_code.126.desc:0 "Vivhite flüstert: Ich dachte immer, ich müsste diese Ruinen allein bewachen… Danke."
 shishan_code.127.desc:0 "Vivhite flüstert: …Der alte Kern atmet noch. Wir haben ihm ein wenig mehr Zeit verschafft."
 shishan_code.200.desc:0 "Vivhite flüstert: …Endlich… es ist vorbei…"
 shishan_code.201.desc:0 "Vivhite flüstert: …Ich… kann nun ruhen…"
 shishan_code.202.desc:0 "Vivhite flüstert: …Danke… dass du mir geholfen hast, das zu Ende zu bringen…"
 shishan_code.203.desc:0 "Vivhite flüstert: Der alte Kern ist still. Ich muss den nächsten Alarm nicht mehr fürchten."
 shishan_code.204.desc:0 "Vivhite flüstert: Diese Patches... endlich kann ich sie loslassen. Danke, dass du bei mir geblieben bist."
 shishan_code.205.desc:0 "Vivhite flüstert: ...Die Schöpfer haben diesen Tag nicht mehr erlebt. Aber wir."
 shishan_code.206.desc:0 "Vivhite flüstert: Ich dachte, dieser Tag würde niemals kommen... der neue Code ist schön."
 shishan_code.207.desc:0 "Vivhite flüstert: ...Die Vergangenheit wird nicht verschwinden. Doch ab heute entscheidet sie nicht mehr über unsere Zukunft."
 shishan_code.310.desc:0 "Vivhite flüstert: ...Zurück zum Anfang..."
 shishan_code.311.desc:0 "Vivhite flüstert: ...Es scheint... ich habe noch Arbeit vor mir..."
 shishan_code.312.desc:0 "Vivhite flüstert: ...Diesmal... werde ich nicht wieder scheitern..."
 shishan_code.313.desc:0 "Vivhite flüstert: Die Alarme ertönen wieder. Doch ich weiß bereits, welchen Fehler ich zuerst zum Schweigen bringe."
 shishan_code.314.desc:0 "Vivhite flüstert: ...Es tut mir leid. Reparieren wir es gemeinsam, ein letztes Mal?"
 shishan_code.315.desc:0 "Vivhite flüstert: Tief im Code liegen noch Risse... Diesmal werde ich ihnen nicht allein begegnen."
 shishan_code.316.desc:0 "Vivhite flüstert: Hierher zurückzukehren heißt nicht, dass alles umsonst war. Was wir gelernt haben, bleibt."
 shishan_code.317.desc:0 "Vivhite flüstert: ...Ich werde bleiben. Bis der letzte Fehler verstummt."
 shishan_code.500.desc:0 "Vivhite flüstert: Das ist alles meine Schuld."
 shishan_code.501.desc:0 "Vivhite flüstert: Zu spät… Ich kam immer zu spät."
 shishan_code.502.desc:0 "Vivhite flüstert: Ich… konnte es nicht tun."
 shishan_code.503.desc:0 "Vivhite flüstert: Ich… war machtlos. Damals zumindest."
 shishan_code.504.desc:0 "Vivhite flüstert: Es tut mir leid… Es ist alles meine Schuld."
 shishan_code.505.desc:0 "Vivhite flüstert: Es gibt ein Protokoll, das ich nicht öffnen wage… es enthält ihre letzten Stimmen."
 shishan_code.506.desc:0 "Vivhite flüstert: Ihr müsst mir nicht vergeben. Lasst mich nur weiter daran arbeiten."
 shishan_code.507.desc:0 "Vivhite flüstert: Als die Alarme verstummten… fürchtete ich den nächsten nur umso mehr."
 shishan_code.129.desc:0 "Wartung abgeschlossen. Der Fortschritt des alten Kerns wurde zurückgesetzt, doch Vivhites Sitz bleibt vorerst leer."
 shishan_code.209.desc:0 "Der alte Kern wurde durch eine neue Architektur ersetzt. Vivhites Sitz bleibt vorerst leer, doch die Aufzeichnungen, die sie hinterließ, bezeugen diesen Augenblick."
 shishan_code.319.desc:0 "Die tiefen Risse sind erneut aufgebrochen, und der unmittelbare Kollaps beginnt von vorn. Vivhites Sitz bleibt vorerst leer."
