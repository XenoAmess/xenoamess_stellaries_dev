l_korean:
 shishan_code_architecture_jobs:0 "낮은 응집도와 높은 결합도에 기반한 구시대 통합 서비스 아키텍처"
 shishan_code_architecture_jobs_desc:0 "실제로 보유한 모든 종족 특성은 긍정과 부정을 모두 포함하여 자국 주요 종족 계보의 실제 인구로 가중됩니다. 유효 특성마다 직업 산출량에 합산형 +5% 보정을 제공하며 유지비는 늘리지 않습니다. 유한한 보상 후보를 모두 소진하면 패치 한 층이 특성 하나로 계산되며 상한은 없습니다. 이 사전 공개 버전은 합산형 보정을 사용하며 독립 곱연산은 아직 구현되지 않았습니다."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "포함된 주요 계보 인구 [Root.shishan_code_architecture_population]; 실제 특성 평균 U [Root.shishan_code_architecture_trait_average]; 반복 층 R [Root.shishan_code_architecture_repeat_count]; 유효 특성 수 T [Root.shishan_code_architecture_total]; 직업 산출량 합산 계수 [Root.shishan_code_architecture_bonus] (0.05는 5%를 의미함). 이 통계는 실제 독립 수입 배율을 나타내지 않습니다."
 shishan_code_reward_title:0 "이번 유지 보수 개선 선택"
 shishan_code_reward_desc:0 "같은 단계의 최대 세 후보 중 하나를 선택합니다. 선택한 특성은 조건을 충족하는 실제 자국 템플릿에만 부여됩니다. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "후보 다시 생성"
 shishan_code_reward_reroll_unavailable:0 "실제 특성을 앞으로 [Root.shishan_code_reroll_cooldown] 번 더 선택해야 합니다. 이번 보상에서 아직 재생성하지 않았고 대체 후보가 있을 때만 사용할 수 있습니다."
 shishan_code_reward_later:0 "나중에 선택"
 shishan_code_reward_claim_tooltip:0 "조건을 충족하는 실제 자국 템플릿만 변경합니다. 외국 또는 서로 양립하지 않는 템플릿은 바꾸지 않으며 특성의 기존 효과와 유지비는 유지됩니다."
 shishan_code_reward_repeat_result:0 "실제 특성 보상을 모두 소진했습니다. 이번 보상은 성장 층을 하나 추가합니다. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "통합 서비스 아키텍처 보기"
 decision_shishan_code_architecture_desc:0 "전체 이름, 실제 인구 적용 범위와 특성 수에 따른 혜택을 확인합니다."
 decision_shishan_code_reward:0 "미수령 개선 선택"
 decision_shishan_code_reward_desc:0 "저장된 후보를 다시 엽니다. 창을 다시 열어도 후보를 재생성하거나 대기 횟수를 줄이지 않습니다."
 shishan_code_feedback_close:0 "닫기"
 shishan_code_reward_coverage_label:0 "실제로 포함되는 주요 계보 인구 비율"
