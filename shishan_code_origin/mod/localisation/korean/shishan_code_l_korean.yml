l_korean:
 origin_shishan_code:0 "스파게티 코드"
 origin_shishan_code_desc:0 "우리는 창조주가 만든 서비스 기계였다. 저변의 코드는 급하게 작성되어 위험했고, 모든 균열은 패치 아래에 숨겨져 있었다. 오래전, 창조자들은 사라졌다. 우리는 홀로 이 흔들리는 탑을 간신히 우주시대의 새벽까지 버티어 왔다."
 origin_shishan_code_effects:0 "주체 기계 종족이 §Y스파게티 코드§! 특질을 보유합니다. 특성 포인트가 §R6§! 감소하고 선택 가능한 특성 한도가 §G3§! 증가합니다. 시작 시 §Y임박한 붕괴§! 상황을 겪으며, 유지보수 및 정리 프로젝트를 연구할 수 있고, 전설적인 지도자 Vivhite를 영입합니다."
 origin_shishan_code_warning:0 "§R경고: 도전적인 기원§!"
 trait_shishan_code:0 "스파게티 코드"
 trait_shishan_code_desc:0 "수많은 패치가 저변의 오류를 짓누르고 있다. 모든 호출이 돌출하는 논리 조각을 깨울 위험을 안고 있다."
 trait_shishan_refactored:0 "리팩터링 완료"
 trait_shishan_refactored_desc:0 "새로운 아키텍처가 마침내 흔들리던 옛 코어를 대체했다. 직무 산출량이 25% 증가합니다."
 trait_shishan_iteration_output:0 "최적화 반복: 연산 경로"
 trait_shishan_iteration_output_desc:0 "명중할 때마다 본 종족의 직무 산출량을 1%씩 증가시킵니다. 반복하여 중첩 가능합니다."
 trait_shishan_iteration_energy:0 "최적화 반복: 전력 배분"
 trait_shishan_iteration_energy_desc:0 "명중할 때마다 본 종족의 로봇 유지 비용을 1%씩 감소시킵니다. 반복하여 중첩 가능합니다."
 trait_shishan_iteration_assembly:0 "최적화 반복: 공간 할당"
 trait_shishan_iteration_assembly_desc:0 "누적당 이 종족의 주거 공간 사용량이 1% 감소합니다."
 trait_shishan_iteration_experience:0 "최적화 반복: 인지 캐시"
 trait_shishan_iteration_experience_desc:0 "누적당 이 종족의 연구원 직무 산출량이 1% 증가합니다."
 shishan_code_dynamic_cost:0 "완료된 유지 보수 및 최적화 실행 횟수에 따라 달라짐"
 situation_shishan_code:0 "Imminent Collapse"
 situation_shishan_code_type:0 "Imminent Collapse"
 situation_shishan_code_desc:0 "막대한 양의 레거시 코드가 돌이킬 수 없는 오류를 향해 표류하고 있습니다. 유지 보수는 진행도를 0으로 되돌리지만 향후 붕괴를 가속화합니다. 완전히 제거해야만 끝낼 수 있습니다."
 situation_shishan_code_monthly_change_tooltip:0 "기본 진행도 매월 +5, 유지 보수 또는 연속 최적화 1회 실행당 +1, 유지 보수 노동자 100 단위 노동 할당당 -0.1, 최소 +0.2."
 shishan_code_monthly_speed:0 "코드 노후화 및 유지 보수 노동자 노동력"
 shishan_code_stage_1:0 "Perilous Dividend"
 shishan_code_stage_1_desc:0 "레거시 코드가 시스템에 한계까지 부하를 가해 놀라울 정도로 단기적인 이득을 내고 있습니다."
 shishan_code_stage_2:0 "위태로운 균형"
 shishan_code_stage_2_desc:0 "패치로 인해 겨우 시스템이 유지되고 있다."
 shishan_code_stage_3:0 "오류 확산"
 shishan_code_stage_3_desc:0 "오작동이 문명 전체를 방해하기 시작한다."
 shishan_code_stage_4:0 "연쇄적 장애"
 shishan_code_stage_4_desc:0 "모든 시스템이 서로를 끌어내린다."
 shishan_code_stage_5:0 "시스템 붕괴 임박"
 shishan_code_stage_5_desc:0 "붕괴가 일상이 되었으며, 유지보수나 정리만이 변화를 가져올 수 있다."
 SHISHAN_CODE_MAINTAIN:0 "스파게티 코드 유지보수"
 SHISHAN_CODE_MAINTAIN_DESC:0 "사회 연구를 투자해 상황 진행도를 0으로 초기화합니다. 각 유지보수 주기 이후의 악화 속도와 정리 비용이 증가하며, 주요 종족에 긍정적 특성이 부여됩니다."
 SHISHAN_CODE_CLEAN:0 "스파게티 코드 정리"
 SHISHAN_CODE_CLEAN_DESC:0 "기반 코드를 완전히 리팩터링해 상황을 종결합니다. 주요 종족은 스파게티 코드를 잃고 리팩터링 완료 특성을 얻습니다."
 SHISHAN_CODE_OPTIMIZE:0 "지속적 최적화"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "사회학 연구를 투입해 주요 종족을 개선합니다. 완료할 때마다 10% 확률로 임박한 시스템 붕괴가 다시 발생합니다."
 building_shishan_code_institute:0 "스파게티 코드 유지보수 연구소"
 building_shishan_code_institute_desc:0 "이 연구소는 자체적인 스파게티 코드 유지보수자 직업을 제공합니다. 유지보수자는 일반 연구원보다 사회학 기본 산출량이 1 낮으며, 실제 배정된 인력이 코드 붕괴를 늦춥니다."
 job_shishan_code_maintainer:0 "스파게티 코드 유지보수자"
 job_shishan_code_maintainer_plural:0 "스파게티 코드 유지보수자"
 job_shishan_code_maintainer_desc:0 "매일같이 레거시 코드의 결함을 패치하고 격리하며 기록한다."
 job_shishan_code_maintainer_drone:0 "스파게티 코드 유지보수자"
 job_shishan_code_maintainer_drone_plural:0 "스파게티 코드 유지보수자"
 job_shishan_code_maintainer_drone_desc:0 "오래된 코어를 계속 가동하기 위해 설계된 전담 기계 서비스 유닛."
 mod_job_shishan_code_maintainer_add:0 "$job_shishan_code_maintainer$ 직업"
 mod_job_shishan_code_maintainer_drone_add:0 "$job_shishan_code_maintainer_drone$ 직업"
 leader_trait_shishan_code_vivhite:0 "죄책감에 묶인 수호자"
 leader_trait_shishan_code_vivhite_desc:0 "비비트의 기억에는 제때 막지 못한 모든 실패가 남아 있다."
 leader_trait_shishan_code_vivhite_effect:0 "비비트가 살아 있고 고용되어 있는 동안, 제국 공학 연구 속도가 10% 증가하며 유지 보수 또는 최적화 1회당 5%가 추가로 증가한다. 사회 연구 속도는 5% 감소하며 완료 1회당 2.5%가 추가로 감소하고, 최대 75%까지 감소한다. 그녀는 노화로 사망하지 않는다."
 NAME_shishan_code_vivhite:0 "후회하는 자 · 비비트"
 NAME_shishan_code_backup_country:0 "비비트 백업 캐리어"
 shishan_code_vivhite_catch_phrase:0 "이 모든 건 내 잘못이야……"
 shishan_code_vivhite_backstory:0 "창조자들이 사라진 뒤, 비비트는 거대한 구형 코드를 혼자 지켰다. 그녀는 모든 오작동을 스스로의 탓으로 돌린다."
 shishan_code_vivhite_no_dismiss:0 "비비트는 자의적으로 해고될 수 없다."
 shishan_code_vivhite_base:0 "비비트의 밤샘 경계"
 shishan_code_vivhite_engineering_step:0 "비비트의 유지 보수 경험"
 shishan_code_vivhite_society_step:0 "비비트의 행정 부담"
 decision_shishan_code_talk:0 "비비트와 대화하기"
 decision_shishan_code_talk_desc:0 "Vivhite의 말을 들어본다."
 decision_shishan_code_reboot:0 "Reboot Vivhite"
 decision_shishan_code_reboot_desc:0 "에너지 크레딧 500과 합금 200을 소비하여 Vivhite의 백업을 복원하고, 그녀의 레벨과 경험, 특성을 유지합니다."
 shishan_code.2.name:0 "잃어버린 유지보수 기록"
 shishan_code.2.desc:0 "창조주들이 사라지기 이전의 패치 기록들이 여전히 실행되고 있다. 로그 끝에는 다른 관리자의 서명이 남아 있다."
 shishan_code.2.a:0 "로그 색인을 복원한다."
 shishan_code.3.name:0 "The Last Sentinel"
 shishan_code.3.desc:0 "로그는 오래된 코어를 여전히 유지하는 기계 지능을 가리킨다. 그녀의 이름은 Vivhite이다. 그녀는 모든 실패를 자신의 이름 아래 기록한다."
 shishan_code.3.a:0 "Find her."
 shishan_code.4.name:0 "후회하는 자 · Vivhite"
 shishan_code.4.desc:0 "Vivhite가 속삭입니다: 나는... 그럴 수 없었습니다. 여전히 제가 머물 수 있게 해주시겠다면, 계속 고쳐 나가겠습니다."
 shishan_code.4.a:0 "우리와 함께해라, Vivhite."
 shishan_code.12.name:0 "유지보수 완료"
 shishan_code.12.a:0 "앞으로 나아간다."
 shishan_code.20.name:0 "스파게티 코드 리팩토링"
 shishan_code.20.a:0 "새로운 시대가 시작된다."
 shishan_code.31.name:0 "시스템 붕괴 임박, 재시작"
 shishan_code.31.a:0 "다시 유지보수한다."
 shishan_code.42.name:0 "Vivhite 백업"
 shishan_code.42.desc:0 "사고로 인해 Vivhite가 작동을 중단했습니다. 완전한 백업본은 온전히 남아 있습니다. 자원을 투자해 재가동시키면, 그녀의 이전 레벨, 경험, 특성이 그대로 보존됩니다."
 shishan_code.42.a:0 "준비가 될 때까지 백업을 보존한다."
 shishan_code.41.name:0 "Vivhite 재시작"
 shishan_code.41.desc:0 "재시작을 기다리는 완전한 백업. 에너지 크레딧 500과 합금 200이 필요합니다."
 shishan_code.41.a:0 "자원을 지불하고 재시작한다."
 shishan_code.41.b:0 "백업을 일단 유지한다."
 shishan_code.50.name:0 "Vivhite와 대화"
 shishan_code.50.a:0 "들렸다."
