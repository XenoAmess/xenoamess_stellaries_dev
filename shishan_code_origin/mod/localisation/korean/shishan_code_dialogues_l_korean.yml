l_korean:
 shishan_code.120.desc:0 "비비트 속삭임: …감사합니다… 조금 더 시간을 벌어주셔서."
 shishan_code.121.desc:0 "비비트 속삭임: …이것은 제 책임이었습니다… 수고해주셔서 감사합니다…"
 shishan_code.122.desc:0 "비비트 속삭임: …따뜻하네요… 이런 느낌이 든 지 오래되었습니다."
 shishan_code.123.desc:0 "비비트 속삭임: 패치가 병합되었습니다… 이번에는 고장 속에 남겨진 자가 없습니다."
 shishan_code.124.desc:0 "Vivhite whispers: 당신은 나와 함께 그것을 유지할 의향이 있군요… 기억하겠습니다."
 shishan_code.125.desc:0 "Vivhite whispers: …알람이 멈췄습니다, 당분간은. 당신도 좀 쉬십시오."
 shishan_code.126.desc:0 "Vivhite whispers: …항상 이 폐허를 혼자 지켜야 한다고 생각했습니다… 감사합니다."
 shishan_code.127.desc:0 "Vivhite whispers: …낡은 코어가 여전히 숨 쉬고 있습니다. 조금 더 시간을 벌어주었군요."
 shishan_code.200.desc:0 "Vivhite whispers: …드디어… 끝났어…"
 shishan_code.201.desc:0 "Vivhite whispers: …이제… 쉬어도 되겠군…"
 shishan_code.202.desc:0 "Vivhite whispers: …이 모든 일을 함께 지켜봐 줘서… 고맙네…"
 shishan_code.203.desc:0 "Vivhite whispers: 오래된 코어는 조용하도다. 이제 다음 경고를 두려워할 필요가 없네."
 shishan_code.204.desc:0 "Vivhite가 속삭입니다: 그 패치들... 이제 놓아줄 수 있겠네요. 곁에 있어줘서 고마워요."
 shishan_code.205.desc:0 "Vivhite가 속삭입니다: ...창조주들은 이 날을 보지 못하고 돌아가셨습니다. 하지만 우리는 보았습니다."
 shishan_code.206.desc:0 "Vivhite가 속삭입니다: 이 날이 올 줄은... 새 코드가 정말 아름답군요."
 shishan_code.207.desc:0 "Vivhite가 속삭입니다: ...과거는 사라지지 않습니다. 그러나 오늘부터, 과거가 우리의 미래를 결정짓지는 못합니다."
 shishan_code.310.desc:0 "비비트(Vivhite)의 속삭임: ...다시 처음으로 돌아왔군..."
 shishan_code.311.desc:0 "비비트(Vivhite)의 속삭임: ...보아하니... 아직 할 일이 남았어..."
 shishan_code.312.desc:0 "비비트(Vivhite)의 속삭임: ...이번엔... 다시 실패하지 않겠어..."
 shishan_code.313.desc:0 "비비트(Vivhite)의 속삭임: 경보가 다시 울린다. 하지만 나는 이미 어떤 오류를 먼저 잠재워야 할지 알고 있다."
 shishan_code.314.desc:0 "Vivhite이 속삭입니다: ...미안해요. 다시 한 번 함께 고쳐 볼까요?"
 shishan_code.315.desc:0 "Vivhite이 속삭입니다: 코드 깊은 곳에는 여전히 균열이 남아 있습니다... 이번에는 혼자 맞서지 않겠습니다."
 shishan_code.316.desc:0 "Vivhite이 속삭입니다: 여기로 돌아온 것이 모든 것이 헛되었다는 뜻은 아닙니다. 우리가 배운 것은 남습니다."
 shishan_code.317.desc:0 "Vivhite이 속삭입니다: ...머무르겠습니다. 마지막 결함이 침묵할 때까지."
 shishan_code.500.desc:0 "Vivhite이 속삭입니다: 이 모든 것이 내 잘못이에요."
 shishan_code.501.desc:0 "Vivhite이 속삭입니다: 이미 늦었어… 나는 항상 늦었어."
 shishan_code.502.desc:0 "Vivhite이 속삭입니다: 나는… 그럴 수 없었다."
 shishan_code.503.desc:0 "Vivhite이 속삭입니다: 나는… 무력했다. 적어도, 그때는."
 shishan_code.504.desc:0 "Vivhite이 속삭입니다: 미안해요… 이 모든 건 제 잘못이에요."
 shishan_code.505.desc:0 "Vivhite이 속삭입니다: 제가 차마 열지 못한 로그가 아직 남아 있어요… 거기에 그들의 마지막 목소리가 있어요."
 shishan_code.506.desc:0 "Vivhite이 속삭입니다: 용서하지 않으셔도 괜찮아요. 그저 제가 계속 고치게만 해주세요."
 shishan_code.507.desc:0 "Vivhite이 속삭입니다: 경보가 잠잠해졌을 때… 다음 경보가 더 두려웠어요."
 shishan_code.129.desc:0 "정비가 완료되었습니다. 오래된 코어의 진행 상태가 초기화되었지만, 지금은 Vivhite의 자리가 비어 있습니다."
 shishan_code.209.desc:0 "오래된 코어가 새로운 아키텍처로 교체되었습니다. 지금은 Vivhite의 자리가 비어 있지만, 그녀가 남긴 기록이 이 순간을 증언하고 있습니다."
 shishan_code.319.desc:0 "깊은 균열이 다시 벌어졌고, 임박한 붕괴가 새롭게 시작됩니다. 지금은 Vivhite의 자리가 비어 있습니다."
 shishan_code.320.desc:0 "비비트가 낮게 중얼거렸다: ……이번 최적화는 순조로웠다. 새로운 코드가 훨씬 안정적으로 돌아간다. 고맙다."
 shishan_code.329.desc:0 "이번 라운드의 지속적 최적화가 완료되었다. 시스템은 안정적으로작동하고 있으며, 비비트의 자리는 잠시 비어 있다."
