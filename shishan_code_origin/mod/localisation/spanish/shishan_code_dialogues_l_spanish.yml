l_spanish:
 shishan_code.120.desc:0 "Vivhite susurra: …Gracias… por comprarme un poco más de tiempo."
 shishan_code.121.desc:0 "Vivhite susurra: …Era mi responsabilidad… Gracias por tu esfuerzo…"
 shishan_code.122.desc:0 "Vivhite susurra: …Siento… calor… Hacía mucho que no me sentía así."
 shishan_code.123.desc:0 "Vivhite susurra: Los parches se han fusionado… Esta vez, nadie se ha quedado atrás en el fallo."
 shishan_code.124.desc:0 "Vivhite susurra: Estáis dispuestos a mantenerlo conmigo… Lo recordaré."
 shishan_code.125.desc:0 "Vivhite susurra: …Las alarmas se han detenido, por ahora. Por favor, descansa tú también."
 shishan_code.126.desc:0 "Vivhite susurra: Siempre creí que tendría que guardar estas ruinas sola… Gracias."
 shishan_code.127.desc:0 "Vivhite susurra: …El viejo núcleo aún respira. Le hemos ganado un poco más de tiempo."
 shishan_code.200.desc:0 "Vivhite susurra: …Por fin… ha terminado…"
 shishan_code.201.desc:0 "Vivhite susurra: …Yo… puedo descansar ya…"
 shishan_code.202.desc:0 "Vivhite susurra: …Gracias… por ayudarme a llegar hasta el final…"
 shishan_code.203.desc:0 "Vivhite susurra: El viejo núcleo está en silencio. Ya no tengo que temer a la siguiente alarma."
 shishan_code.204.desc:0 "Vivhite susurra: Esos parches... por fin puedo soltarlos. Gracias por quedarte a mi lado."
 shishan_code.205.desc:0 "Vivhite susurra: ...Los creadores nunca vivieron para ver este día. Pero nosotros sí."
 shishan_code.206.desc:0 "Vivhite susurra: Creí que este día nunca llegaría... el código nuevo es hermoso."
 shishan_code.207.desc:0 "Vivhite susurra: ...El pasado no desaparecerá. Pero a partir de hoy, ya no decide nuestro futuro."
 shishan_code.310.desc:0 "Vivhite susurra: ...De vuelta al principio otra vez..."
 shishan_code.311.desc:0 "Vivhite susurra: ...Parece que... todavía me queda trabajo por hacer..."
 shishan_code.312.desc:0 "Vivhite susurra: ...Esta vez... no volveré a fallar..."
 shishan_code.313.desc:0 "Vivhite susurra: Las alarmas vuelven a sonar. Pero ya sé qué error silenciar primero."
 shishan_code.314.desc:0 "Vivhite susurra: ...Lo siento. ¿Lo reparamos juntos una vez más?"
 shishan_code.315.desc:0 "Vivhite susurra: En lo profundo del código aún quedan fisuras... Esta vez no las enfrentaré sola."
 shishan_code.316.desc:0 "Vivhite susurra: Volver aquí no significa que todo haya sido en vano. Lo que aprendimos permanece."
 shishan_code.317.desc:0 "Vivhite susurra: ...Me quedaré. Hasta que el último fallo caiga en silencio."
 shishan_code.500.desc:0 "Vivhite susurra: This is all my fault."
 shishan_code.501.desc:0 "Vivhite susurra: Too late… I was always too late."
 shishan_code.502.desc:0 "Vivhite susurra: I… could not do it."
 shishan_code.503.desc:0 "Vivhite susurra: I… was powerless. At least, back then."
 shishan_code.504.desc:0 "Vivhite susurra: I'm sorry… It is all my fault."
 shishan_code.505.desc:0 "Vivhite susurra: There is still a log I dare not open… it holds their last voices."
 shishan_code.506.desc:0 "Vivhite susurra: You need not forgive me. Only let me keep repairing it."
 shishan_code.507.desc:0 "Vivhite susurra: When the alarms fell silent… I feared the next one even more."
 shishan_code.129.desc:0 "Mantenimiento completado. El progreso del núcleo antiguo se ha reiniciado, pero el asiento de Vivhite permanece vacío por ahora."
 shishan_code.209.desc:0 "El núcleo antiguo ha sido sustituido por una nueva arquitectura. El asiento de Vivhite permanece vacío por ahora, pero los registros que dejó dan testimonio de este momento."
 shishan_code.319.desc:0 "Las profundas fracturas se han vuelto a abrir y el colapso inminente comienza de nuevo. El asiento de Vivhite permanece vacío por ahora."
