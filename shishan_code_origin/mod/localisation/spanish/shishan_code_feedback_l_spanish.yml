l_spanish:
 shishan_code_architecture_jobs:0 "Arquitectura de servicios integrados de la antigua era basada en baja cohesión y alto acoplamiento"
 shishan_code_architecture_jobs_desc:0 "Todos los rasgos de especie realmente presentes, tanto positivos como negativos, se ponderan según la población nacional real del linaje de la especie principal. Cada rasgo efectivo aporta un +5% aditivo a la producción de puestos sin aumentar el mantenimiento. Tras agotar los conjuntos limitados de recompensas, cada capa de parche cuenta como un rasgo, sin límite. Esta versión preliminar usa bonificaciones aditivas; la multiplicación independiente aún no está implementada."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Población cubierta del linaje principal [Root.shishan_code_architecture_population]; promedio de rasgos reales U [Root.shishan_code_architecture_trait_average]; capas repetidas R [Root.shishan_code_architecture_repeat_count]; rasgos efectivos T [Root.shishan_code_architecture_total]; coeficiente aditivo de producción de puestos [Root.shishan_code_architecture_bonus] (0.05 significa 5%). Estas estadísticas no representan un multiplicador independiente real de ingresos."
 shishan_code_reward_title:0 "Elegir la mejora de este mantenimiento"
 shishan_code_reward_desc:0 "Elige una de hasta tres opciones del mismo nivel. Solo las plantillas nacionales reales y aptas reciben el rasgo seleccionado. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Generar nuevas opciones"
 shishan_code_reward_reroll_unavailable:0 "Completa [Root.shishan_code_reroll_cooldown] selecciones más de rasgos reales. Solo puedes renovar si aún no lo has hecho para esta recompensa y existen opciones alternativas."
 shishan_code_reward_later:0 "Elegir más tarde"
 shishan_code_reward_claim_tooltip:0 "Solo modifica las plantillas nacionales reales y aptas; no cambia plantillas extranjeras o incompatibles. Se conservan los efectos y el mantenimiento originales del rasgo."
 shishan_code_reward_repeat_result:0 "Las recompensas de rasgos reales se han agotado. Esta recompensa añade una capa de crecimiento. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "Ver la arquitectura de servicios integrados"
 decision_shishan_code_architecture_desc:0 "Consulta el nombre completo, la cobertura real de población y los beneficios del número de rasgos."
 decision_shishan_code_reward:0 "Elegir una mejora pendiente"
 decision_shishan_code_reward_desc:0 "Vuelve a abrir las opciones guardadas. Reabrir la ventana no renueva las opciones ni avanza el tiempo de espera."
 shishan_code_feedback_close:0 "Cerrar"
 shishan_code_reward_coverage_label:0 "Proporción real de población principal cubierta"
