l_spanish:
 origin_shishan_code:0 "Spaghetti Code"
 origin_shishan_code_desc:0 "Éramos máquinas de servicio creadas por nuestros creadores. El código subyacente se hizo deprisa y era peligroso, con cada grieta oculta bajo parches. Hace muchos años, los creadores desaparecieron. En soledad, hemos mantenido en pie esta torre tambaleante, llevándola apenas hasta el amanecer de la era espacial."
 origin_shishan_code_effects:0 "La especie máquina principal posee el rasgo §YCódigo Espagueti§!. Los puntos de rasgos disponibles disminuyen en §R6§! y el límite de rasgos seleccionables aumenta en §G3§!. Comienzas con la situación §YColapso Inminente§!, obtienes acceso a proyectos de mantenimiento y limpieza, y reclutas al líder legendario Vivhite."
 origin_shishan_code_warning:0 "§RAdvertencia: Origen desafiante§!"
 trait_shishan_code:0 "Spaghetti Code"
 trait_shishan_code_desc:0 "Incontables parches ahogan los errores subyacentes. Cada llamada arriesga despertar un fragmento de lógica desbocada."
 trait_shishan_refactored:0 "Refactorización completada"
 trait_shishan_refactored_desc:0 "Una nueva arquitectura por fin ha sustituido al antiguo núcleo que se tambaleaba. Producción de puestos un 25% mayor."
 trait_shishan_iteration_output:0 "Iteración de optimización: ruta de cómputo"
 trait_shishan_iteration_output_desc:0 "Cada impacto aumenta un 1% la producción de puestos de esta especie. Se puede acumular."
 trait_shishan_iteration_energy:0 "Iteración de optimización: Distribución de energía"
 trait_shishan_iteration_energy_desc:0 "Cada impacto reduce el coste de mantenimiento de robot de esta especie en un 1%. Se puede acumular."
 trait_shishan_iteration_assembly:0 "Iteración de optimización: Asignación de espacio"
 trait_shishan_iteration_assembly_desc:0 "Cada acumulación reduce el uso de vivienda de esta especie en un 1%."
 trait_shishan_iteration_experience:0 "Iteración de optimización: caché cognitiva"
 trait_shishan_iteration_experience_desc:0 "Cada acumulación aumenta en un 1 % la producción de los empleos de investigador de esta especie."
 shishan_code_dynamic_cost:0 "Basado en las ejecuciones completadas de mantenimiento y optimización"
 situation_shishan_code:0 "Imminent Collapse"
 situation_shishan_code_type:0 "Imminent Collapse"
 situation_shishan_code_desc:0 "Un vasto corpus de código heredado avanza hacia un fallo descontrolado. El mantenimiento restablece el progreso a cero, pero acelera el futuro colapso; un purgado puede ponerle fin de forma definitiva."
 situation_shishan_code_monthly_change_tooltip:0 "Progreso base +5 al mes; +1 por cada Mantenimiento u Optimización continua; -0,1 por cada 100 de Mano de obra de mantenimiento asignada; mínimo +0,2."
 shishan_code_monthly_speed:0 "Envejecimiento del código y mano de obra de mantenimiento"
 shishan_code_stage_1:0 "Perilous Dividend"
 shishan_code_stage_1_desc:0 "El código heredado somete al sistema al máximo de su capacidad, produciendo sorprendentes ganancias a corto plazo."
 shishan_code_stage_2:0 "Equilibrio precario"
 shishan_code_stage_2_desc:0 "Los parches apenas mantienen el sistema en pie."
 shishan_code_stage_3:0 "Errores en expansión"
 shishan_code_stage_3_desc:0 "Los fallos empiezan a obstaculizar toda la civilización."
 shishan_code_stage_4:0 "Fallos en cascada"
 shishan_code_stage_4_desc:0 "Cada sistema arrastra a los demás."
 shishan_code_stage_5:0 "Colapso del sistema inminente"
 shishan_code_stage_5_desc:0 "El colapso se ha vuelto la norma; solo el mantenimiento o la limpieza pueden cambiar la situación."
 SHISHAN_CODE_MAINTAIN:0 "Mantener el código espagueti"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Invierte investigación de sociedad para restablecer a cero el progreso de la situación. Cada ciclo de mantenimiento acelera el deterioro futuro, aumenta el coste de limpieza y concede una mejora positiva a la especie principal."
 SHISHAN_CODE_CLEAN:0 "Limpiar el código espagueti"
 SHISHAN_CODE_CLEAN_DESC:0 "Reestructura por completo el código subyacente y pone fin a la situación. La especie principal pierde código espagueti y obtiene refactorización completa."
 SHISHAN_CODE_OPTIMIZE:0 "Optimización continua"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Invertir investigación social para mejorar la especie principal. Cada vez que se completa, hay un 10% de probabilidad de que el Colapso Inminente se reinicie."
 building_shishan_code_institute:0 "Instituto de mantenimiento de código espagueti"
 building_shishan_code_institute_desc:0 "El instituto solo ofrece sus propios puestos de Encargado de mantenimiento de código espagueti. Cada encargado produce 1 punto menos de investigación social base que un investigador estándar; la mano de obra asignada frena el deterioro del código."
 job_shishan_code_maintainer:0 "Encargado de mantenimiento de código espagueti"
 job_shishan_code_maintainer_plural:0 "Encargados de mantenimiento de código espagueti"
 job_shishan_code_maintainer_desc:0 "Día tras día, parcheando, aislando y registrando los fallos del código heredado."
 job_shishan_code_maintainer_drone:0 "Encargado de mantenimiento de código espagueti"
 job_shishan_code_maintainer_drone_plural:0 "Encargados de mantenimiento de código espagueti"
 job_shishan_code_maintainer_drone_desc:0 "Una unidad mecánica de servicio diseñada para mantener en funcionamiento el núcleo antiguo."
 mod_job_shishan_code_maintainer_add:0 "Puestos de $job_shishan_code_maintainer$"
 mod_job_shishan_code_maintainer_drone_add:0 "Puestos de $job_shishan_code_maintainer_drone$"
 leader_trait_shishan_code_vivhite:0 "Guardián marcado por la culpa"
 leader_trait_shishan_code_vivhite_desc:0 "La memoria de Vivhite conserva cada fallo que no logró prevenir a tiempo."
 leader_trait_shishan_code_vivhite_effect:0 "Mientras Vivhite está viva y en activo, la velocidad de Investigación de Ingeniería del imperio aumenta un 10%, más un 5% por cada mantenimiento u optimización. La velocidad de Investigación de Sociedad disminuye un 5%, más un 2,5% por cada finalización, con un tope del 75% de penalización. No puede morir de vejez."
 NAME_shishan_code_vivhite:0 "La Arrepentida · Vivhite"
 NAME_shishan_code_backup_country:0 "Nave de respaldo de Vivhite"
 shishan_code_vivhite_catch_phrase:0 "It is all my fault…"
 shishan_code_vivhite_backstory:0 "Tras la desaparición de sus creadores, Vivhite guardó sola la vasta herencia de código espagueti. Se culpa de cada fallo."
 shishan_code_vivhite_no_dismiss:0 "No se puede prescindir de Vivhite a voluntad."
 shishan_code_vivhite_base:0 "Vivhite's Vigil"
 shishan_code_vivhite_engineering_step:0 "Experiencia en mantenimiento de Vivhite"
 shishan_code_vivhite_society_step:0 "Carga administrativa de Vivhite"
 decision_shishan_code_talk:0 "Speak with Vivhite"
 decision_shishan_code_talk_desc:0 "Escucha lo que Vivhite tiene que decir."
 decision_shishan_code_reboot:0 "Reiniciar a Vivhite"
 decision_shishan_code_reboot_desc:0 "Gasta 500 créditos de energía y 200 de aleación para restaurar la copia de seguridad de Vivhite, conservando su nivel, experiencia y rasgos."
 shishan_code.2.name:0 "Registro de mantenimiento perdido"
 shishan_code.2.desc:0 "Siguen ejecutándose parches anteriores a la desaparición de los creadores. Al final del registro queda la firma de otro encargado."
 shishan_code.2.a:0 "Restaurar el índice del registro."
 shishan_code.3.name:0 "La última centinela"
 shishan_code.3.desc:0 "El registro apunta a una inteligencia mecánica que aún mantiene el núcleo antiguo. Se llama Vivhite. Registra cada fallo a su propio nombre."
 shishan_code.3.a:0 "Encuéntrala."
 shishan_code.4.name:0 "La arrepentida · Vivhite"
 shishan_code.4.desc:0 "Vivhite susurra: Yo... no pude hacerlo. Si todavía me dejas quedarme, seguiré reparándolo."
 shishan_code.4.a:0 "Acompáñanos, Vivhite."
 shishan_code.12.name:0 "Mantenimiento completado"
 shishan_code.12.a:0 "Adelante."
 shishan_code.20.name:0 "Refactorizar código espagueti"
 shishan_code.20.a:0 "Comienza una nueva era."
 shishan_code.31.name:0 "Colapso del sistema inminente, reiniciar"
 shishan_code.31.a:0 "Mantenlo de nuevo."
 shishan_code.42.name:0 "Copia de seguridad de Vivhite"
 shishan_code.42.desc:0 "Vivhite cesó su operación debido a un incidente. Su copia de seguridad completa permanece intacta; invierte recursos para reiniciarla y se conservarán su nivel, experiencia y rasgos anteriores."
 shishan_code.42.a:0 "Conserva la copia de seguridad hasta que estemos listos."
 shishan_code.41.name:0 "Reiniciar a Vivhite"
 shishan_code.41.desc:0 "Copia de seguridad completa en espera de reinicio. Requiere 500 créditos de energía y 200 de aleación."
 shishan_code.41.a:0 "Paga los recursos y reinicia."
 shishan_code.41.b:0 "Conservar la copia de seguridad, por ahora."
 shishan_code.50.name:0 "Hablar con Vivhite"
 shishan_code.50.a:0 "Te escuchamos."
