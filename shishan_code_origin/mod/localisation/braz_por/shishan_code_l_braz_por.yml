l_braz_por:
 origin_shishan_code:0 "Spaghetti Code"
 origin_shishan_code_desc:0 "Fomos máquinas de serviço construídas por nossos criadores. O código subjacente foi escrito às pressas e de forma perigosa, com cada falha oculta sob remendos. Há muitos anos, os criadores desapareceram. Sozinhas, mantivemos esta torre cambaleante de pé, mal conseguindo carregá-la até o amanhecer da era espacial."
 origin_shishan_code_effects:0 "A espécie mecânica principal possui a característica §YSpaghetti Code§!. Os pontos de característica disponíveis diminuem em §R6§! e o limite de características selecionáveis aumenta em §G3§!. Comece com a situação §YImminent Collapse§!, tenha acesso a projetos de manutenção e limpeza, e recrute a líder lendária Vivhite."
 origin_shishan_code_warning:0 "§RAlerta: Origem Desafiadora§!"
 trait_shishan_code:0 "Spaghetti Code"
 trait_shishan_code_desc:0 "Inúmeros remendos sufocam os erros subjacentes. Cada chamada corre o risco de despertar um fragmento de lógica descontrolada."
 trait_shishan_refactored:0 "Refatoração Concluída"
 trait_shishan_refactored_desc:0 "A nova arquitetura finalmente substituiu o núcleo obsoleto. A produção de todos os postos de trabalho, para todas as espécies do império, aumenta em 25%, sem alterar o custo de manutenção dos postos."
 shishan_code_refactored_jobs:0 "Refatoração Concluída: produção dos postos"
 trait_shishan_iteration_output:0 "Iteração de Otimização: Rota de Computação"
 trait_shishan_iteration_output_desc:0 "Cada acerto aumenta a produção dos postos desta espécie em 1%. Pode ser acumulado repetidamente."
 trait_shishan_iteration_energy:0 "Iteração de Otimização: Roteamento de Energia"
 trait_shishan_iteration_energy_desc:0 "Cada acerto reduz o custo de manutenção de robôs desta espécie em 1%. Pode ser acumulado repetidamente."
 trait_shishan_iteration_assembly:0 "Otimização Iterativa: Alocação Espacial"
 trait_shishan_iteration_assembly_desc:0 "Cada acúmulo reduz o uso de habitação desta espécie em 1%."
 trait_shishan_iteration_experience:0 "Otimização Iterativa: Cache Cognitiva"
 trait_shishan_iteration_experience_desc:0 "Cada acúmulo aumenta a produção de pesquisador desta espécie em 1%."
 shishan_code_dynamic_cost:0 "Baseado em execuções de Manutenção e Otimização concluídas"
 situation_shishan_code:0 "Colapso Iminente"
 situation_shishan_code_type:0 "Colapso Iminente"
 situation_shishan_code_desc:0 "Um vasto corpo de código legado caminha para uma falha descontrolada. A manutenção zera o progresso, mas acelera o colapso futuro; uma limpeza pode encerrá-lo de vez."
 situation_shishan_code_monthly_change_tooltip:0 "Progresso base +5 por mês; +1 por execução de manutenção ou otimização contínua; -0,1 por 100 de mão de obra de manutenção alocada; mínimo +0,2."
 shishan_code_monthly_speed:0 "Envelhecimento do Código e Mão de Obra de Manutenção"
 shishan_code_stage_1:0 "Dividendo Perigoso"
 shishan_code_stage_1_desc:0 "O código legado pressiona o sistema ao limite, gerando ganhos surpreendentes em curto prazo."
 shishan_code_stage_2:0 "Equilíbrio Instável"
 shishan_code_stage_2_desc:0 "Patches mal seguram o sistema junto."
 shishan_code_stage_3:0 "Erros se Espalhando"
 shishan_code_stage_3_desc:0 "Defeitos começam a atrapalhar toda a civilização."
 shishan_code_stage_4:0 "Falhas em Cascata"
 shishan_code_stage_4_desc:0 "Cada sistema arrasta os outros para baixo."
 shishan_code_stage_5:0 "Colapso Iminente do Sistema"
 shishan_code_stage_5_desc:0 "O colapso virou rotina; só manutenção ou limpeza podem mudar o quadro."
 SHISHAN_CODE_MAINTAIN:0 "Manter o Spaghetti Code"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Gaste Pesquisa da Sociedade para zerar o progresso da situação. Cada ciclo de manutenção acelera a deterioração futura, aumenta o custo de limpeza e concede uma característica positiva à espécie principal."
 SHISHAN_CODE_CLEAN:0 "Limpar o Spaghetti Code"
 SHISHAN_CODE_CLEAN_DESC:0 "Refatora completamente o código subjacente e encerra a situação. A espécie principal perde Spaghetti Code e ganha Refatoração Concluída."
 SHISHAN_CODE_OPTIMIZE:0 "Otimização Contínua"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Gastar Pesquisa da Sociedade para melhorar a espécie principal. Cada conclusão tem 10% de chance de reiniciar o Colapso Iminente."
 building_shishan_code_institute:0 "Instituto de Manutenção de Código Spaghetti"
 building_shishan_code_institute_desc:0 "O instituto oferece apenas seus próprios cargos de Mantenedor de Código Spaghetti. Cada mantenedor produz 1 ponto a menos de Pesquisa da Sociedade base que um pesquisador padrão; a mão de obra atribuída retarda o colapso do código."
 job_shishan_code_maintainer:0 "Mantenedor de Código Spaghetti"
 job_shishan_code_maintainer_plural:0 "Mantenedores de Código Spaghetti"
 job_shishan_code_maintainer_desc:0 "Dia após dia, consertando, isolando e registrando as falhas do código legado."
 job_shishan_code_maintainer_drone:0 "Mantenedor de Código Spaghetti"
 job_shishan_code_maintainer_drone_plural:0 "Mantenedores de Código Spaghetti"
 job_shishan_code_maintainer_drone_desc:0 "Uma unidade mecânica de serviço dedicada a manter o núcleo antigo em funcionamento."
 mod_job_shishan_code_maintainer_add:0 "Vagas de $job_shishan_code_maintainer$"
 mod_job_shishan_code_maintainer_drone_add:0 "Vagas de $job_shishan_code_maintainer_drone$"
 leader_trait_shishan_code_vivhite:0 "Guardiã Culpada"
 leader_trait_shishan_code_vivhite_desc:0 "A memória de Vivhite preserva cada falha que ela não conseguiu evitar a tempo."
 leader_trait_shishan_code_vivhite_effect:0 "Enquanto Vivhite estiver viva e empregada, a velocidade de Pesquisa em Engenharia do império aumenta em 10%, mais 5% por manutenção ou otimização. A velocidade de Pesquisa em Sociedade diminui em 5%, mais 2,5% por conclusão, com um limite de penalidade de 75%. Ela não pode morrer de velhice."
 leader_trait_shishan_xp_restore_boost:0 "Calibração de Memória"
 leader_trait_shishan_xp_restore_boost_desc:0 "Vivhite está restaurando os registros de experiência anteriores ao reinício. A calibração será concluída em alguns dias."
 NAME_shishan_code_vivhite:0 "A Arrependida · Vivhite"
 NAME_shishan_code_backup_country:0 "Embarcação de Backup de Vivhite"
 shishan_code_vivhite_catch_phrase:0 "A culpa é toda minha…"
 shishan_code_vivhite_backstory:0 "Após o desaparecimento dos criadores, Vivhite guardou sozinha o vasto legado de spaghetti code. Ela atribui cada falha a si mesma."
 shishan_code_vivhite_no_dismiss:0 "Vivhite não pode ser demitida por vontade própria."
 shishan_code_vivhite_base:0 "Vigília de Vivhite"
 shishan_code_vivhite_engineering_step:0 "Experiência de Manutenção de Vivhite"
 shishan_code_vivhite_society_step:0 "Fardo Administrativo de Vivhite"
 decision_shishan_code_talk:0 "Falar com Vivhite"
 decision_shishan_code_talk_desc:0 "Ouça o que Vivhite tem a dizer."
 decision_shishan_code_reboot:0 "Reiniciar Vivhite"
 decision_shishan_code_reboot_desc:0 "Gaste 500 Créditos de Energia e 200 Ligas para restaurar o backup de Vivhite, mantendo seu nível, experiência e traços."
 shishan_code.2.name:0 "Registro de Manutenção Perdido"
 shishan_code.2.desc:0 "Registros de patches anteriores ao desaparecimento dos criadores ainda estão em execução. Ao final do registro, resta a assinatura de outro mantenedor."
 shishan_code.2.a:0 "Restaurar o índice de registros."
 shishan_code.3.name:0 "A Última Sentinela"
 shishan_code.3.desc:0 "O registro aponta para uma inteligência mecânica que ainda mantém o núcleo antigo. O nome dela é Vivhite. Ela registra cada falha em seu próprio nome."
 shishan_code.3.a:0 "Encontre-a."
 shishan_code.4.name:0 "A Arrependida · Vivhite"
 shishan_code.4.desc:0 "Vivhite sussurra: Eu... não consegui. Se ainda me permitir ficar, continuarei reparando."
 shishan_code.4.a:0 "Fique conosco, Vivhite."
 shishan_code.12.name:0 "Manutenção concluída"
 shishan_code.12.a:0 "Seguir em frente."
 shishan_code.20.name:0 "Refatorar código espaguete"
 shishan_code.20.a:0 "Uma nova era começa."
 shishan_code.31.name:0 "Colapso iminente do sistema, reiniciar"
 shishan_code.31.a:0 "Faça a manutenção de novo."
 shishan_code.42.name:0 "Backup de Vivhite"
 shishan_code.42.desc:0 "Vivhite cessou a operação devido a um incidente. Seu backup completo permanece intacto; invista recursos para reiniciá-la e seu nível, experiência e traços anteriores serão preservados."
 shishan_code.42.a:0 "Preservar o backup até estarmos prontos."
 shishan_code.41.name:0 "Reiniciar Vivhite"
 shishan_code.41.desc:0 "Backup completo aguardando reinício. Requer 500 créditos de energia e 200 ligas."
 shishan_code.41.a:0 "Pagar os recursos e reiniciar."
 shishan_code.41.b:0 "Manter o backup, por enquanto."
 shishan_code.50.name:0 "Falar com Vivhite"
 shishan_code.50.a:0 "Ouvimos você."
