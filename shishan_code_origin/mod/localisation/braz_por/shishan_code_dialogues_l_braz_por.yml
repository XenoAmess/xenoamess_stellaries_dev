l_braz_por:
 shishan_code.120.desc:0 "Vivhite sussurra: …Obrigada… por me comprar um pouco mais de tempo."
 shishan_code.121.desc:0 "Vivhite sussurra: …Isso era minha responsabilidade… Obrigada pelo seu esforço…"
 shishan_code.122.desc:0 "Vivhite sussurra: …Sinto… calor… Faz muito tempo desde que me senti assim."
 shishan_code.123.desc:0 "Vivhite sussurra: Os patches foram mergeados… Desta vez, ninguém ficou para trás na falha."
 shishan_code.124.desc:0 "Vivhite sussurra: Vocês estão dispostos a manter isso comigo… Vou lembrar disso."
 shishan_code.125.desc:0 "Vivhite sussurra: …Os alarmes pararam, por enquanto. Por favor, descansem também."
 shishan_code.126.desc:0 "Vivhite sussurra: Sempre pensei que teria que guardar essas ruínas sozinha… Obrigada."
 shishan_code.127.desc:0 "Vivhite sussurra: …O núcleo antigo ainda respira. Conquistamos um pouco mais de tempo para ele."
 shishan_code.200.desc:0 "Vivhite sussurra: …Finalmente… acabou…"
 shishan_code.201.desc:0 "Vivhite sussurra: …Eu… posso descansar agora…"
 shishan_code.202.desc:0 "Vivhite sussurra: …Obrigada… por me ajudar a chegar até o fim…"
 shishan_code.203.desc:0 "Vivhite sussurra: O núcleo antigo está em silêncio. Não preciso mais temer o próximo alarme."
 shishan_code.204.desc:0 "Vivhite sussurra: Aqueles patches... finalmente posso deixá-los ir. Obrigada por ficarem comigo."
 shishan_code.205.desc:0 "Vivhite sussurra: ...Os criadores não viveram para ver este dia. Mas nós vimos."
 shishan_code.206.desc:0 "Vivhite sussurra: Achei que esse dia nunca chegaria... o novo código é bonito."
 shishan_code.207.desc:0 "Vivhite sussurra: ...O passado não vai desaparecer. Mas a partir de hoje, ele não decide mais o nosso futuro."
 shishan_code.310.desc:0 "Vivhite sussurra: ...De volta ao início outra vez..."
 shishan_code.311.desc:0 "Vivhite sussurra: ...Parece que... ainda tenho trabalho a fazer..."
 shishan_code.312.desc:0 "Vivhite sussurra: ...Desta vez... não vou falhar de novo..."
 shishan_code.313.desc:0 "Vivhite sussurra: Os alarmes tocam de novo. Mas eu já sei qual erro silenciar primeiro."
 shishan_code.314.desc:0 "Vivhite sussurra: ...Desculpe. Vamos consertar isso juntos mais uma vez?"
 shishan_code.315.desc:0 "Vivhite sussurra: Nas profundezas do código ainda há fissuras... Desta vez, não vou enfrentá-las sozinha."
 shishan_code.316.desc:0 "Vivhite sussurra: Voltar aqui não significa que tudo foi em vão. O que aprendemos permanece."
 shishan_code.317.desc:0 "Vivhite sussurra: ...Eu vou permanecer. Até que a última falha se cale."
 shishan_code.500.desc:0 "Vivhite sussurra: Isso é tudo culpa minha."
 shishan_code.501.desc:0 "Vivhite sussurra: Tarde demais... Eu sempre cheguei tarde demais."
 shishan_code.502.desc:0 "Vivhite sussurra: Eu... não consegui."
 shishan_code.503.desc:0 "Vivhite sussurra: Eu... estava sem forças. Pelo menos, naquela época."
 shishan_code.504.desc:0 "Vivhite sussurra: Me desculpe... É tudo culpa minha."
 shishan_code.505.desc:0 "Vivhite sussurra: Ainda há um registro que não ouso abrir... ele guarda as últimas vozes deles."
 shishan_code.506.desc:0 "Vivhite sussurra: Vocês não precisam me perdoar. Apenas me deixem continuar reparando."
 shishan_code.507.desc:0 "Vivhite sussurra: Quando os alarmes ficaram em silêncio... passei a temer o próximo ainda mais."
 shishan_code.129.desc:0 "Manutenção concluída. O progresso do núcleo antigo foi reiniciado, mas o assento de Vivhite permanece vazio por enquanto."
 shishan_code.209.desc:0 "O núcleo antigo foi substituído por uma nova arquitetura. O assento de Vivhite permanece vazio por enquanto, mas os registros que ela deixou testemunham este momento."
 shishan_code.319.desc:0 "As fissuras profundas se reabriram e o colapso iminente começa de novo. O assento de Vivhite permanece vazio por enquanto."
 shishan_code.320.desc:0 "Vivhite diz em voz baixa: ... A otimização desta vez correu muito bem. O novo código está funcionando de forma mais estável. Obrigada."
 shishan_code.329.desc:0 "Esta rodada de otimização contínua foi concluída. O sistema permanece estável; o assento de Vivhite está temporariamente vazio."
