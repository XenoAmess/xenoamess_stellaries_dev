l_braz_por:
 shishan_code_architecture_jobs:0 "Arquitetura de serviços integrados da antiga era baseada em baixa coesão e alto acoplamento"
 shishan_code_architecture_jobs_desc:0 "Todas as características de espécie realmente presentes, positivas e negativas, são ponderadas pela população nacional real da linhagem da espécie principal. Cada característica efetiva concede um bônus aditivo de +5% à produção dos cargos sem aumentar a manutenção. Após esgotar os conjuntos limitados de recompensas, cada camada de correção conta como uma característica, sem limite. Esta prévia usa bônus aditivos; a multiplicação independente ainda não foi implementada."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "População coberta da linhagem principal [Root.shishan_code_architecture_population]; média de características reais U [Root.shishan_code_architecture_trait_average]; camadas repetidas R [Root.shishan_code_architecture_repeat_count]; características efetivas T [Root.shishan_code_architecture_total]; coeficiente aditivo de produção dos cargos [Root.shishan_code_architecture_bonus] (0.05 significa 5%). Essas estatísticas não representam um multiplicador independente real da renda."
 shishan_code_reward_title:0 "Escolher a melhoria desta manutenção"
 shishan_code_reward_desc:0 "Escolha uma de até três opções do mesmo nível. Apenas os modelos nacionais reais e elegíveis recebem a característica selecionada. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Gerar novas opções"
 shishan_code_reward_reroll_unavailable:0 "Conclua mais [Root.shishan_code_reroll_cooldown] escolhas de características reais. Uma nova seleção só está disponível se esta recompensa ainda não foi sorteada novamente e existem opções alternativas."
 shishan_code_reward_later:0 "Escolher depois"
 shishan_code_reward_claim_tooltip:0 "Altera apenas os modelos nacionais reais e elegíveis, sem mudar modelos estrangeiros ou incompatíveis. Os efeitos e a manutenção originais da característica são preservados."
 shishan_code_reward_repeat_result:0 "As recompensas de características reais foram esgotadas. Esta recompensa adiciona uma camada de crescimento. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "Ver a arquitetura de serviços integrados"
 decision_shishan_code_architecture_desc:0 "Veja o nome completo, a cobertura real de população e os benefícios da quantidade de características."
 decision_shishan_code_reward:0 "Escolher uma melhoria pendente"
 decision_shishan_code_reward_desc:0 "Reabre as opções salvas. Reabrir a janela não sorteia novas opções nem avança o tempo de espera."
 shishan_code_feedback_close:0 "Fechar"
 shishan_code_reward_coverage_label:0 "Proporção real da população principal coberta"
