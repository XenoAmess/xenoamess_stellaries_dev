l_english:
 shishan_code_architecture_jobs:0 "Legacy Integrated Service Architecture Based on Low Cohesion and High Coupling"
 shishan_code_architecture_jobs_desc:0 "All actual species traits, positive and negative alike, are weighted by the real domestic population of the main-species lineage. Each effective trait provides an additive +5% job output bonus without increasing upkeep. After the finite reward pools are exhausted, each patch layer counts as one trait, with no cap. This prerelease uses additive bonuses; independent multiplication is not yet implemented."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Covered main-lineage population [Root.shishan_code_architecture_population]; average actual traits U [Root.shishan_code_architecture_trait_average]; repeat layers R [Root.shishan_code_architecture_repeat_count]; effective traits T [Root.shishan_code_architecture_total]; additive job-output coefficient [Root.shishan_code_architecture_bonus] (0.05 means 5%). These statistics do not represent an actual independent income multiplier."
 shishan_code_reward_title:0 "Choose This Maintenance Improvement"
 shishan_code_reward_desc:0 "Choose one of up to three candidates from the same tier. Only eligible actual domestic templates receive the selected trait. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Generate New Candidates"
 shishan_code_reward_reroll_unavailable:0 "Complete [Root.shishan_code_reroll_cooldown] more actual trait selections. Reroll is available only if this ticket has not been rerolled and alternative candidates exist."
 shishan_code_reward_later:0 "Choose Later"
 shishan_code_reward_claim_tooltip:0 "Changes only eligible actual domestic templates, leaving foreign and conflicting templates unchanged. The trait's original effects and upkeep remain."
 shishan_code_reward_repeat_result:0 "Actual trait rewards are exhausted. This reward adds one growth layer. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "View Integrated Service Architecture"
 decision_shishan_code_architecture_desc:0 "View the full name, actual population coverage, and benefits from trait count."
 decision_shishan_code_reward:0 "Choose a Pending Improvement"
 decision_shishan_code_reward_desc:0 "Reopens the saved candidates. Reopening the window does not reroll or advance the cooldown."
 shishan_code_feedback_close:0 "Close"
 shishan_code_reward_coverage_label:0 "Actual Share of Main-Lineage Population Covered"
