l_english:
 shishan_code.120.desc:0 "Vivhite whispers: …Thank you… for buying me a little more time."
 shishan_code.121.desc:0 "Vivhite whispers: …This was my responsibility… Thank you for your hard work…"
 shishan_code.122.desc:0 "Vivhite whispers: …I feel… warm… It has been a long time since I felt this way."
 shishan_code.123.desc:0 "Vivhite whispers: The patches have been merged… This time, no one was left behind in the fault."
 shishan_code.124.desc:0 "Vivhite whispers: You are willing to maintain it with me… I will remember that."
 shishan_code.125.desc:0 "Vivhite whispers: …The alarms have stopped, for now. Please rest as well."
 shishan_code.126.desc:0 "Vivhite whispers: I always thought I would have to guard these ruins alone… Thank you."
 shishan_code.127.desc:0 "Vivhite whispers: …The old core still breathes. We have won it a little more time."
 shishan_code.200.desc:0 "Vivhite whispers: …At last… it is over…"
 shishan_code.201.desc:0 "Vivhite whispers: …I… can rest now…"
 shishan_code.202.desc:0 "Vivhite whispers: …Thank you… for helping me see this through…"
 shishan_code.203.desc:0 "Vivhite whispers: The old core is quiet. I no longer have to fear the next alarm."
 shishan_code.204.desc:0 "Vivhite whispers: Those patches... I can finally let them go. Thank you for staying with me."
 shishan_code.205.desc:0 "Vivhite whispers: ...The creators never lived to see this day. But we did."
 shishan_code.206.desc:0 "Vivhite whispers: I thought this day would never come... the new code is beautiful."
 shishan_code.207.desc:0 "Vivhite whispers: ...The past will not disappear. But from today onward, it no longer decides our future."
 shishan_code.310.desc:0 "Vivhite whispers: ...Back to the beginning again..."
 shishan_code.311.desc:0 "Vivhite whispers: ...It seems... I still have work to do..."
 shishan_code.312.desc:0 "Vivhite whispers: ...This time... I will not fail again..."
 shishan_code.313.desc:0 "Vivhite whispers: The alarms sound again. But I already know which error to silence first."
 shishan_code.314.desc:0 "Vivhite whispers: ...I'm sorry. Shall we repair it together once more?"
 shishan_code.315.desc:0 "Vivhite whispers: Deep within the code still lie fissures... This time, I will not face them alone."
 shishan_code.316.desc:0 "Vivhite whispers: Returning here does not mean everything was in vain. What we learned endures."
 shishan_code.317.desc:0 "Vivhite whispers: ...I will remain. Until the last fault falls silent."
 shishan_code.500.desc:0 "Vivhite whispers: This is all my fault."
 shishan_code.501.desc:0 "Vivhite whispers: Too late… I was always too late."
 shishan_code.502.desc:0 "Vivhite whispers: I… could not do it."
 shishan_code.503.desc:0 "Vivhite whispers: I… was powerless. At least, back then."
 shishan_code.504.desc:0 "Vivhite whispers: I'm sorry… It is all my fault."
 shishan_code.505.desc:0 "Vivhite whispers: There is still a log I dare not open… it holds their last voices."
 shishan_code.506.desc:0 "Vivhite whispers: You need not forgive me. Only let me keep repairing it."
 shishan_code.507.desc:0 "Vivhite whispers: When the alarms fell silent… I feared the next one even more."
 shishan_code.129.desc:0 "Maintenance complete. The old core's progress has been reset, but Vivhite's seat stands empty for now."
 shishan_code.209.desc:0 "The old core has been replaced by a new architecture. Vivhite's seat stands empty for now, but the records she left behind bear witness to this moment."
 shishan_code.319.desc:0 "The deep fractures have reopened, and the imminent collapse begins anew. Vivhite's seat stands empty for now."
 shishan_code.320.desc:0 "Vivhite says quietly: …This optimization went smoothly. The new code runs more steadily. Thank you."
 shishan_code.329.desc:0 "This round of continued optimization is complete. System operation remains stable, and Vivhite's seat is temporarily empty."
