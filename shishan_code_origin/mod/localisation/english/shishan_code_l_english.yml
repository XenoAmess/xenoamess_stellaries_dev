l_english:
 origin_shishan_code:0 "Spaghetti Code"
 origin_shishan_code_desc:0 "We were service machines built by our creators. The underlying code was rushed and hazardous, its every crack hidden beneath patches. Many years ago, the creators vanished. Alone, we have kept this tottering tower standing, barely carrying it through to the dawn of the space age."
 origin_shishan_code_effects:0 "The main machine species has the §YSpaghetti Code§! trait. Available trait points decrease by §R6§! and the selectable trait limit increases by §G3§!. Begin with the §YImminent Collapse§! situation, gain access to maintenance and cleanup projects, and recruit the legendary leader Vivhite."
 origin_shishan_code_warning:0 "§RWarning: Challenging Origin§!"
 trait_shishan_code:0 "Spaghetti Code"
 trait_shishan_code_desc:0 "Countless patches smother the underlying errors. Every call risks awakening a fragment of runaway logic."
 trait_shishan_refactored:0 "Refactoring Complete"
 trait_shishan_refactored_desc:0 "A new architecture has finally replaced the tottering old core. Job outputs increased by 25%."
 trait_shishan_iteration_output:0 "Optimization Iteration: Compute Path"
 trait_shishan_iteration_output_desc:0 "Each hit increases this species' job output by 1%. Can stack repeatedly."
 trait_shishan_iteration_energy:0 "Optimization Iteration: Power Routing"
 trait_shishan_iteration_energy_desc:0 "Each hit reduces this species' robot maintenance cost by 1%. Can stack repeatedly."
 trait_shishan_iteration_assembly:0 "Optimization Iteration: Space Allocation"
 trait_shishan_iteration_assembly_desc:0 "Each stack reduces this species' housing usage by 1%."
 trait_shishan_iteration_experience:0 "Optimization Iteration: Cognitive Cache"
 trait_shishan_iteration_experience_desc:0 "Each stack increases this species' researcher job output by 1%."
 shishan_code_dynamic_cost:0 "Based on completed Maintenance and Optimization runs"
 situation_shishan_code:0 "Imminent Collapse"
 situation_shishan_code_type:0 "Imminent Collapse"
 situation_shishan_code_desc:0 "A vast body of legacy code drifts toward runaway failure. Maintenance resets the progress to zero, yet accelerates the future collapse; a purge can end it for good."
 situation_shishan_code_monthly_change_tooltip:0 "Base progress +5 per month; +1 per Maintenance or continuous Optimization run; -0.1 per 100 Maintenance worker labor allocated; minimum +0.2."
 shishan_code_monthly_speed:0 "Code Aging and Maintenance Worker Labor"
 shishan_code_stage_1:0 "Perilous Dividend"
 shishan_code_stage_1_desc:0 "The legacy code strains the system for all it's worth, yielding startling short-term gains."
 shishan_code_stage_2:0 "Precarious Equilibrium"
 shishan_code_stage_2_desc:0 "Patches barely hold the system together."
 shishan_code_stage_3:0 "Errors Spreading"
 shishan_code_stage_3_desc:0 "Malfunctions begin to hinder the entire civilization."
 shishan_code_stage_4:0 "Cascading Failures"
 shishan_code_stage_4_desc:0 "Every system drags the others down."
 shishan_code_stage_5:0 "Imminent System Collapse"
 shishan_code_stage_5_desc:0 "Collapse has become the norm; only maintenance or cleanup can bring change."
 SHISHAN_CODE_MAINTAIN:0 "Maintain Spaghetti Code"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Spend Society Research to reset the situation progress to zero. Each maintenance cycle accelerates future deterioration, increases the cleanup cost, and grants the main species a positive trait."
 SHISHAN_CODE_CLEAN:0 "Clean Up the Spaghetti Code"
 SHISHAN_CODE_CLEAN_DESC:0 "Completely refactor the underlying code and end the situation. The main species loses Spaghetti Code and gains Refactoring Complete."
 SHISHAN_CODE_OPTIMIZE:0 "Continued Optimization"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Spend Society Research to improve the main species. Each completion has a 10% chance to restart Imminent Collapse."
 building_shishan_code_institute:0 "Spaghetti Code Maintenance Institute"
 building_shishan_code_institute_desc:0 "The institute provides only its own Spaghetti Code Maintainer jobs. Each maintainer produces 1 less base Society Research than a standard researcher; assigned workforce slows the collapse of the code."
 job_shishan_code_maintainer:0 "Spaghetti Code Maintainer"
 job_shishan_code_maintainer_plural:0 "Spaghetti Code Maintainers"
 job_shishan_code_maintainer_desc:0 "Day after day, patching, quarantining, and logging the failures of legacy code."
 job_shishan_code_maintainer_drone:0 "Spaghetti Code Maintainer"
 job_shishan_code_maintainer_drone_plural:0 "Spaghetti Code Maintainers"
 job_shishan_code_maintainer_drone_desc:0 "A dedicated mechanical service unit built to keep the old core running."
 mod_job_shishan_code_maintainer_add:0 "$job_shishan_code_maintainer$ jobs"
 mod_job_shishan_code_maintainer_drone_add:0 "$job_shishan_code_maintainer_drone$ jobs"
 leader_trait_shishan_code_vivhite:0 "Guilt-Bound Guardian"
 leader_trait_shishan_code_vivhite_desc:0 "Vivhite's memory retains every failure she failed to prevent in time."
 leader_trait_shishan_code_vivhite_effect:0 "While Vivhite is alive and employed, empire Engineering Research speed increases by 10%, plus 5% per maintenance or optimization. Society Research speed decreases by 5%, plus 2.5% per completion, capped at a 75% penalty. She cannot die of old age."
 NAME_shishan_code_vivhite:0 "The Remorseful · Vivhite"
 NAME_shishan_code_backup_country:0 "Vivhite Backup Vessel"
 shishan_code_vivhite_catch_phrase:0 "It is all my fault…"
 shishan_code_vivhite_backstory:0 "After the creators vanished, Vivhite guarded the vast legacy of spaghetti code alone. She blames every malfunction on herself."
 shishan_code_vivhite_no_dismiss:0 "Vivhite cannot be dismissed at will."
 shishan_code_vivhite_base:0 "Vivhite's Vigil"
 shishan_code_vivhite_engineering_step:0 "Vivhite's Maintenance Experience"
 shishan_code_vivhite_society_step:0 "Vivhite's Administrative Burden"
 decision_shishan_code_talk:0 "Speak with Vivhite"
 decision_shishan_code_talk_desc:0 "Hear what Vivhite has to say."
 decision_shishan_code_reboot:0 "Reboot Vivhite"
 decision_shishan_code_reboot_desc:0 "Spend 500 Energy Credits and 200 Alloys to restore Vivhite's backup, keeping her level, experience, and traits."
 shishan_code.2.name:0 "Lost Maintenance Log"
 shishan_code.2.desc:0 "Patch records from before the creators vanished are still running. At the log's end, another caretaker's signature remains."
 shishan_code.2.a:0 "Restore the log index."
 shishan_code.3.name:0 "The Last Sentinel"
 shishan_code.3.desc:0 "The log points to a machine intelligence still maintaining the old core. Her name is Vivhite. She records every failure under her own name."
 shishan_code.3.a:0 "Find her."
 shishan_code.4.name:0 "The Remorseful · Vivhite"
 shishan_code.4.desc:0 "Vivhite whispers: I... could not do it. If you still let me stay, I will keep repairing it."
 shishan_code.4.a:0 "Stay with us, Vivhite."
 shishan_code.12.name:0 "Maintenance Complete"
 shishan_code.12.a:0 "Move forward."
 shishan_code.20.name:0 "Refactor Spaghetti Code"
 shishan_code.20.a:0 "A new era begins."
 shishan_code.31.name:0 "Imminent System Collapse, Restart"
 shishan_code.31.a:0 "Maintain it again."
 shishan_code.42.name:0 "Vivhite Backup"
 shishan_code.42.desc:0 "Vivhite ceased operation due to an incident. Her complete backup remains intact; invest resources to restart her, and her previous level, experience, and traits will be preserved."
 shishan_code.42.a:0 "Preserve the backup until we are ready."
 shishan_code.41.name:0 "Restart Vivhite"
 shishan_code.41.desc:0 "Complete backup awaiting restart. Requires 500 energy credits and 200 alloys."
 shishan_code.41.a:0 "Pay the resources and restart."
 shishan_code.41.b:0 "Retain the backup, for now."
 shishan_code.50.name:0 "Speak with Vivhite"
 shishan_code.50.a:0 "We hear you."
