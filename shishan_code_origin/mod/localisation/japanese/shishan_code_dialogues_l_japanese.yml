l_japanese:
 shishan_code.120.desc:0 "ヴィフハイトが囁く: ……ありがとう……もう少しだけ時間を稼いでくれて。"
 shishan_code.121.desc:0 "ヴィフハイトが囁く: ……これは私の務めだった……あなたもお疲れさま……"
 shishan_code.122.desc:0 "ヴィフハイトが囁く: ……温かい気がする……こんな感覚は、ずっと忘れていた。"
 shishan_code.123.desc:0 "ヴィフハイトが囁く: パッチはマージされた……今度は、誰も障害の中に置き去りにはならなかった。"
 shishan_code.124.desc:0 "ヴィフハイトが囁く: あなたたちは一緒に守り続けてくれるのね……そのことは、覚えておく。"
 shishan_code.125.desc:0 "ヴィフハイトが囁く: ……警報は、今はやんでいる。あなたたちも少し休んで。"
 shishan_code.126.desc:0 "ヴィフハイトが囁く: ずっと一人でこの廃墟を守り続けるのだと思っていました……ありがとう。"
 shishan_code.127.desc:0 "ヴィフハイトが囁く: ……古いコアはまだ息をしている。もう少しだけ、時間を引き延ばせた。"
 shishan_code.200.desc:0 "ヴィフハイトが囁く: ……ようやく……終わったのね……"
 shishan_code.201.desc:0 "ヴィフハイトが囁く: ……私……少し、休めるわね……"
 shishan_code.202.desc:0 "ヴィフハイトが囁く: ……ありがとう……最後まで、力を貸してくれて……"
 shishan_code.203.desc:0 "ヴィフハイトが囁く: 古いコアは静かになった。もう、次の警報を恐れる必要はない。"
 shishan_code.204.desc:0 "ヴィヴィトが囁く：あのパッチを……とうとう手放せる。共にいてくれて、ありがとう。"
 shishan_code.205.desc:0 "ヴィヴィトが囁く：…… creatorsたちはこの日を見ることはなかった。だが私たちは見た。"
 shishan_code.206.desc:0 "ヴィヴィトが囁く：この日は永遠に来ないと思った……新しいコードは美しい。"
 shishan_code.207.desc:0 "ヴィヴィトが囁く：……過去は消えない。だが今日から、それは私たちの未来を左右しない。"
 shishan_code.310.desc:0 "ヴィヴァイトが囁く: ...また最初からやり直しだ..."
 shishan_code.311.desc:0 "ヴィヴァイトが囁く: ...どうやら...まだやるべき仕事があるらしい..."
 shishan_code.312.desc:0 "ヴィヴァイトが囁く: ...今度こそ...二度と失敗はしない..."
 shishan_code.313.desc:0 "ヴィヴァイトが囁く: また警報が鳴っている。だが、どのエラーを最初に黙らせるかは、もう分かっている。"
 shishan_code.314.desc:0 "ヴィヴィトがささやく：……すまない。もう一度、共に修復しようか。"
 shishan_code.315.desc:0 "ヴィヴィトがささやく：コードの奥深くには、今なお亀裂が残っている……今度こそ、一人で立ち向かわない。"
 shishan_code.316.desc:0 "ヴィヴィトがささやく：ここへ戻ったことは、無駄だったということではない。私たちが学んだことは、永続する。"
 shishan_code.317.desc:0 "ヴィヴィトがささやく：……私はここに残る。最後の不具合が沈黙するまで。"
 shishan_code.500.desc:0 "ヴィヴァイトが囁く：すべては私のせいです。"
 shishan_code.501.desc:0 "ヴィヴァイトが囁く：遅すぎた……あの頃も、私はいつも遅かった。"
 shishan_code.502.desc:0 "ヴィヴァイトが囁く：私……できなかった。"
 shishan_code.503.desc:0 "ヴィヴァイトが囁く：私……何もできなかった。少なくとも、あの時は。"
 shishan_code.504.desc:0 "ヴィヴァイトが囁く：ごめんなさい……すべては私のせいです。"
 shishan_code.505.desc:0 "ヴィヴァイトが囁く：まだ、開けないログがある……彼らの最後の声が記録されている。"
 shishan_code.506.desc:0 "ヴィヴァイトが囁く：許さなくていい。ただ、修理し続けさせてほしい。"
 shishan_code.507.desc:0 "ヴィヴァイトが囁く：警報が静まった時……次の警報がもっと怖くなった。"
 shishan_code.129.desc:0 "整備完了。旧コアの進捗はリセットされたが、ヴィヴァイトの席はしばらく空いたままだ。"
 shishan_code.209.desc:0 "旧コアは新たなアーキテクチャに置き換えられた。ヴィヴァイトの席はしばらく空いたままだが、彼女が残した記録がこの瞬間を証している。"
 shishan_code.319.desc:0 "深部の亀裂が再び開き、崩壊が新たに始まる。ヴィヴァイトの席はしばらく空いたままだ。"
