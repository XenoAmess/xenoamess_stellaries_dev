l_japanese:
 shishan_code_architecture_jobs:0 "低凝集・高結合に基づく旧時代の統合サービスアーキテクチャ"
 shishan_code_architecture_jobs_desc:0 "実際に存在するすべての種族特性を、正負を問わず、自国内の主要種族系統の実際の人口で加重する。有効特性ごとにジョブ産出へ加算型の+5%補正を与え、維持費は増やさない。有限の報酬候補を使い切ると、パッチ層ごとに特性一つ分として数え、上限はない。この先行版は加算型であり、独立した乗算は未実装。"
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "対象となる主要系統人口 [Root.shishan_code_architecture_population]；実在特性の平均U [Root.shishan_code_architecture_trait_average]；反復層R [Root.shishan_code_architecture_repeat_count]；有効特性数T [Root.shishan_code_architecture_total]；ジョブ産出の加算係数 [Root.shishan_code_architecture_bonus]（0.05は5%を意味する）。これらは実際の独立した収入倍率を表すものではない。"
 shishan_code_reward_title:0 "今回のメンテナンス改善を選ぶ"
 shishan_code_reward_desc:0 "同じ段階から最大三候補のうち一つを選ぶ。選んだ特性は自国内の条件を満たす実際のテンプレートにのみ付与される。$shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "候補を再生成"
 shishan_code_reward_reroll_unavailable:0 "実在特性をあと [Root.shishan_code_reroll_cooldown] 回選択する必要がある。今回の報酬でまだ再生成しておらず、代替候補がある場合のみ使用できる。"
 shishan_code_reward_later:0 "あとで選ぶ"
 shishan_code_reward_claim_tooltip:0 "自国内の条件を満たす実際のテンプレートのみ変更する。国外や両立しないテンプレートは変更せず、特性本来の効果と維持費は保持する。"
 shishan_code_reward_repeat_result:0 "実在特性の報酬を使い切った。今回の報酬では成長層を一つ追加する。$shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "統合サービスアーキテクチャを確認"
 decision_shishan_code_architecture_desc:0 "正式名称、実際の人口への適用範囲、特性数による利益を確認する。"
 decision_shishan_code_reward:0 "未受領の改善を選ぶ"
 decision_shishan_code_reward_desc:0 "保存された候補を再び開く。ウィンドウを開き直しても候補は再生成されず、待機回数も減らない。"
 shishan_code_feedback_close:0 "閉じる"
 shishan_code_reward_coverage_label:0 "実際に対象となる主要系統人口の割合"
