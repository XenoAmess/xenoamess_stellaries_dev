l_japanese:
 origin_shishan_code:0 "スパゲッティコード"
 origin_shishan_code_desc:0 "我々は創造主に作られたサービス機械だった。基盤のコードは場当たり的で危険に満ち、創造主たちはパッチでひび割れを一つずつ覆い隠した。遠い昔、創造主たちは消え去った。孤独のなか、我々はこの揺らぐ塔を必死に支え、ようやく宇宙時代の夜明けへと漕ぎつけた。"
 origin_shishan_code_effects:0 "主要機械種族は§Yスパゲッティコード§!特性を保有。特性ポイントを§R6§!減少し、選択可能な特性上限を§G3§!増加。開始時に§Y崩壊の危機§!状況に入り、整備とクリーンアップ系のプロジェクトへアクセス可能となり、伝説の指導者ヴィヴァイトを招聘する。\n\n$shishan_code_architecture_jobs$\n$shishan_code_architecture_jobs_desc$"
 origin_shishan_code_warning:0 "§R警告：難度の高いオリジン§!"
 trait_shishan_code:0 "スパゲッティコード"
 trait_shishan_code_desc:0 "無数のパッチが根深いエラーを覆い隠している。あらゆる呼び出しが暴走ロジックの断片を目覚めさせる危険を伴う。"
 trait_shishan_refactored:0 "リファクタリング完了"
 trait_shishan_refactored_desc:0 "新たなアーキテクチャがついに老朽化した旧式コアに取って代わった。帝国の全種族のジョブ産出が25%上昇し、ジョブの維持費は変わらない。"
 shishan_code_refactored_jobs:0 "リファクタリング完了：ジョブ産出"
 trait_shishan_iteration_output:0 "最適化イテレーション：演算経路"
 trait_shishan_iteration_output_desc:0 "過去の反復層ごとに、この種族のジョブ産出が1%上昇する。既存の効果は保持され、新しい報酬ではこの計数は増加しない。"
 trait_shishan_iteration_energy:0 "最適化イテレーション：電力ルーティング"
 trait_shishan_iteration_energy_desc:0 "過去の反復層ごとに、この種族のロボット維持費が1%低下する。既存の効果は保持され、新しい報酬ではこの計数は増加しない。"
 trait_shishan_iteration_assembly:0 "最適化反復：空間割当"
 trait_shishan_iteration_assembly_desc:0 "過去の反復層ごとに、この種族の住宅使用量が1%低下する。既存の効果は保持され、新しい報酬ではこの計数は増加しない。"
 trait_shishan_iteration_experience:0 "最適化反復：認知キャッシュ"
 trait_shishan_iteration_experience_desc:0 "過去の反復層ごとに、この種族の研究者ジョブ産出が1%上昇する。既存の効果は保持され、新しい報酬ではこの計数は増加しない。"
 shishan_code_dynamic_cost:0 "完了済みのメンテナンスおよび最適化の実行回数に基づく"
 situation_shishan_code:0 "崩壊の足音"
 situation_shishan_code_type:0 "崩壊の足音"
 situation_shishan_code_desc:0 "膨大かつ乱れた旧式コードが、制御不能な失敗へと流されている。メンテナンスは進行をゼロへ戻すが、その後の崩壊を加速させる。完全に停止させるには、パージしか方法はない。"
 situation_shishan_code_monthly_change_tooltip:0 "基本進行：毎月+1。完了したメンテナンスまたは継続的最適化1回ごとに+0.25。帝国全体で実際に割り当てられた保守員の労働力100の完全な単位ごとに-0.25。最低+0.2。"
 shishan_code_monthly_speed:0 "コードの老朽化とメンテナンス作業者の労働力"
 shishan_code_stage_1:0 "危険な配当"
 shishan_code_stage_1_desc:0 "旧式コードは限界までシステムを引き伸ばし、目を見張るような短期的な利益をもたらしている。"
 shishan_code_stage_2:0 "危険な均衡"
 shishan_code_stage_2_desc:0 "パッチによって辛うじてシステムが保たれている。"
 shishan_code_stage_3:0 "Errors Spreading"
 shishan_code_stage_3_desc:0 "不具合が文明全体に影響し始める。"
 shishan_code_stage_4:0 "Cascading Failures"
 shishan_code_stage_4_desc:0 "あらゆるシステムが他のシステムを引きずり落とす。"
 shishan_code_stage_5:0 "差し迫ったシステム崩壊"
 shishan_code_stage_5_desc:0 "崩壊は常態化した。変化をもたらすには、保守か整理しかない。"
 SHISHAN_CODE_MAINTAIN:0 "スパゲッティコードの保守"
 SHISHAN_CODE_MAINTAIN_DESC:0 "社会学研究を消費し、状況の進行をゼロに戻す。保守のたびに以後の月間進行と整理コストが増加する。同じ段階の最大三候補から一つの報酬を選び、有限の候補を使い切ると成長層を一つ確定で得る。"
 SHISHAN_CODE_CLEAN:0 "スパゲッティコードを整理"
 SHISHAN_CODE_CLEAN_DESC:0 "根本からコードを完全にリファクタリングし、この状況を終結させる。主要種族は「スパゲッティコード」を失い、「リファクタリング完了」を獲得する。"
 SHISHAN_CODE_OPTIMIZE:0 "継続的な最適化"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "社会学研究を消費し、同じ段階の最大三候補から一つの報酬を選ぶ。有限の候補を使い切ると成長層を一つ確定で得る。完了ごとのシステム崩壊再発確率は従来どおり10%。"
 building_shishan_code_institute:0 "スパゲッティコード保守研究所"
 building_shishan_code_institute_desc:0 "研究所は独自のスパゲッティコード保守員ジョブのみを提供する。割り当てられた労働力100ごとの基礎産出は社会学研究3と統合力1であり、コードの崩壊も遅らせる。"
 job_shishan_code_maintainer:0 "スパゲッティコード保守員"
 job_shishan_code_maintainer_plural:0 "スパゲッティコード保守員"
 job_shishan_code_maintainer_desc:0 " Legacy codeの不具合を、修復し、隔離し、記録する日々が続く。"
 job_shishan_code_maintainer_drone:0 "スパゲッティコード保守員"
 job_shishan_code_maintainer_drone_plural:0 "スパゲッティコード保守員"
 job_shishan_code_maintainer_drone_desc:0 "旧式コアの稼働を維持するために作られた専用の機械整備ユニット。"
 mod_job_shishan_code_maintainer_add:0 "$job_shishan_code_maintainer$ジョブ"
 mod_job_shishan_code_maintainer_drone_add:0 "$job_shishan_code_maintainer_drone$ジョブ"
 leader_trait_shishan_code_vivhite:0 "罪の鎖に縛られた守護者"
 leader_trait_shishan_code_vivhite_desc:0 "白綺の記憶には、その時止められなかったすべての失敗が刻まれている。"
 leader_trait_shishan_code_vivhite_effect:0 "白绮が生存し任用されている間、帝国の工学研究速度が10%上昇し、メンテナンスまたは最適化ごとに5%追加される。社会学研究速度は5%上昇し、完了ごとに2.5%追加され、完了回数による上限はない。彼女自身の統合力維持費にのみ-100%の補正が適用される。彼女は老齢で死ぬことはない。"
 leader_trait_shishan_xp_restore_boost:0 "記憶キャリブレーション中"
 leader_trait_shishan_xp_restore_boost_desc:0 "白綺は再起動前の経験値を復元中である。校正は数日で完了する。"
 NAME_shishan_code_vivhite:0 "悔恨の者・白綺"
 NAME_shishan_code_backup_country:0 "白绮予備保管体"
 shishan_code_vivhite_catch_phrase:0 "すべては私の責任です……"
 shishan_code_vivhite_backstory:0 "造り手たちが消えた後、白绮は膨大なスパゲッティコードの遺産を一人で守り続けた。彼女はあらゆる不具合を自分のせいだと責めている。"
 shishan_code_vivhite_no_dismiss:0 "白绮は任意の解雇ができない。"
 shishan_code_vivhite_base:0 "白绮の監視"
 shishan_code_vivhite_engineering_step:0 "白绮の整備経験"
 shishan_code_vivhite_society_step:0 "白绮の社会学的知見の蓄積"
 decision_shishan_code_talk:0 "白绮と話す"
 decision_shishan_code_talk_desc:0 "Vivhiteの話を聞く。"
 decision_shishan_code_talk_requires_vivhite:0 "Vivhiteはまだ戻ってきていないため、彼女と話すことはできません。"
 decision_shishan_code_reboot:0 "Reboot Vivhite"
 decision_shishan_code_reboot_desc:0 "500エネルギークレジットと200アロイを消費してVivhiteのバックアップを復元し、レベル・経験値・特性を維持する。"
 shishan_code.2.name:0 "失われた整備記録"
 shishan_code.2.desc:0 "創造主が消える前から稼働しているパッチ記録。その末尾に、別の管理者の署名が残されている。"
 shishan_code.2.a:0 "ログの索引を復元する。"
 shishan_code.3.name:0 "The Last Sentinel"
 shishan_code.3.desc:0 "その記録が示すのは、旧い中核を維持し続ける機械知性体。その名はヴィヴァイト。彼女はすべて失敗を己の名のもとに記録している。"
 shishan_code.3.a:0 "Find her."
 shishan_code.4.name:0 "後悔の者 · ヴィバイト"
 shishan_code.4.desc:0 "ヴィバイトが囁く: 私は……それを実行することができませんでした。それでも私を留めるというのなら、私はそれを修繕し続けます。"
 shishan_code.4.a:0 "共にいてくれ、ヴィバイト。"
 shishan_code.12.name:0 "メンテナンス完了"
 shishan_code.12.a:0 "前へ進む。"
 shishan_code.20.name:0 "スパゲッティコードのリファクタリング"
 shishan_code.20.a:0 "新しい時代が始まる。"
 shishan_code.31.name:0 "システム崩壊の危機、再起動"
 shishan_code.31.a:0 "再びメンテナンスする。"
 shishan_code.42.name:0 "ヴィヴァイトのバックアップ"
 shishan_code.42.desc:0 "ヴィヴァイトは事故により稼働を停止した。完全なバックアップは健在であり、資源を投じて再起動すれば、これまでのレベル、経験、特質が復元される。"
 shishan_code.42.a:0 "準備が整うまでバックアップを保持する。"
 shishan_code.41.name:0 "ヴィヴァイトを再起動"
 shishan_code.41.desc:0 "完全なバックアップが再起動を待機している。エネルギー・クレジット500と合金200が必要。"
 shishan_code.41.a:0 "資源を支払い、再起動する。"
 shishan_code.41.b:0 "しばらくはバックアップを保持する。"
 shishan_code.50.name:0 "ヴィヴハイトと話す"
 shishan_code.50.a:0 "お前の声は届いている。"
 mod_country_sr_living_metal_produces_mult:0 "月間$sr_living_metal$生産量"
 mod_country_sr_dark_matter_produces_mult:0 "月間$sr_dark_matter$生産量"
 mod_country_nanites_produces_mult:0 "月間$nanites$生産量"
 mod_country_minor_artifacts_produces_mult:0 "月間$minor_artifacts$生産量"
 mod_country_advanced_logic_produces_mult:0 "月間$advanced_logic$産出"
 mod_country_entropy_crystals_produces_mult:0 "月間$entropy_crystals$産出"
 shishan_code.32.name:0 "継続最適化完了"
