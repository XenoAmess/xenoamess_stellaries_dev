l_simp_chinese:
 shishan_code.120.desc:0 "白绮低声说：……谢谢你……又替我争取了一点时间。"
 shishan_code.121.desc:0 "白绮低声说：……这是我的责任……辛苦你了……"
 shishan_code.122.desc:0 "白绮低声说：……我感到……温暖……这样的感觉，我很久没有过了。"
 shishan_code.123.desc:0 "白绮低声说：补丁已经合并……这一次，没有人被留在故障里。"
 shishan_code.124.desc:0 "白绮低声说：你们愿意和我一起维护它……我会记住的。"
 shishan_code.125.desc:0 "白绮低声说：……警报暂时停了。请你们也休息一下。"
 shishan_code.126.desc:0 "白绮低声说：我原以为只能独自守着这片废墟……谢谢你。"
 shishan_code.127.desc:0 "白绮低声说：……旧核心还在呼吸。我们又为它赢得了一点时间。"
 shishan_code.200.desc:0 "白绮低声说：……终于……结束了……"
 shishan_code.201.desc:0 "白绮低声说：……我……可以休息一下了……"
 shishan_code.202.desc:0 "白绮低声说：……感谢你……帮我完成了这件事……"
 shishan_code.203.desc:0 "白绮低声说：旧核心安静了。我终于不用再害怕下一次警报。"
 shishan_code.204.desc:0 "白绮低声说：那些补丁……终于可以放下了。谢谢你一直陪着我。"
 shishan_code.205.desc:0 "白绮低声说：……创造者没能等到今天。但我们做到了。"
 shishan_code.206.desc:0 "白绮低声说：我以为这一天永远不会来……新的代码，很美。"
 shishan_code.207.desc:0 "白绮低声说：……过去不会消失。但从今天起，它不再决定我们的未来。"
 shishan_code.310.desc:0 "白绮低声说：……又回到了原点……"
 shishan_code.311.desc:0 "白绮低声说：……看来……我还需要努力……"
 shishan_code.312.desc:0 "白绮低声说：……这次……我不会再失败了……"
 shishan_code.313.desc:0 "白绮低声说：警报又响了。但我已经知道该先关掉哪一道错误。"
 shishan_code.314.desc:0 "白绮低声说：……对不起。我们再一起把它修好，好吗？"
 shishan_code.315.desc:0 "白绮低声说：深层代码还藏着裂缝……这一次，我不会独自面对。"
 shishan_code.316.desc:0 "白绮低声说：回到这里并不意味着一切白费。我们学到的东西还在。"
 shishan_code.317.desc:0 "白绮低声说：……我会留下。直到最后一道故障平息。"
 shishan_code.500.desc:0 "白绮低声说：这都是我的错。"
 shishan_code.501.desc:0 "白绮低声说：太迟了……那时我总是来得太迟。"
 shishan_code.502.desc:0 "白绮低声说：我……没能做到。"
 shishan_code.503.desc:0 "白绮低声说：我……无能为力。至少当时是这样。"
 shishan_code.504.desc:0 "白绮低声说：对不起……都怪我。"
 shishan_code.505.desc:0 "白绮低声说：还有一段日志我不敢打开……里面写着他们最后的声音。"
 shishan_code.506.desc:0 "白绮低声说：你们不必原谅我。只要让我继续修复它。"
 shishan_code.507.desc:0 "白绮低声说：警报停下来的时候……我反而更害怕下一次。"
 shishan_code.129.desc:0 "维护完成。旧核心的进度已归零，但白绮的席位暂时空着。"
 shishan_code.209.desc:0 "旧核心已被新的架构取代。白绮的席位暂时空着，但她留下的记录见证了这一刻。"
 shishan_code.319.desc:0 "深层裂缝重新打开，大厦将倾再度开始。白绮的席位暂时空着。"
