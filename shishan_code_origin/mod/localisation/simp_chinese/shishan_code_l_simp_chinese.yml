l_simp_chinese:
 origin_shishan_code:0 "屎山代码"
 origin_shishan_code_desc:0 "我们本是创造者制造的服务机器。底层代码仓促而危险，创造者用补丁掩盖了每一道裂缝。许多年前，创造者消失了。我们独自维持这座摇摇欲坠的大厦，终于勉强走到了太空时代的黎明。"
 origin_shishan_code_effects:0 "主体机械物种拥有§Y屎山代码§!特质，特质点数减少§R6§!，可选特质上限增加§G3§!。开局进入§Y大厦将倾§!局势，可研究维护与清理项目，并获得传奇领袖白绮。"
 origin_shishan_code_warning:0 "§R警告：具有挑战性的起源§!"
 trait_shishan_code:0 "屎山代码"
 trait_shishan_code_desc:0 "无数补丁压住了底层错误。每次调用都可能唤醒一段失控逻辑。"
 trait_shishan_refactored:0 "重构完成"
 trait_shishan_refactored_desc:0 "新的架构终于取代了摇摇欲坠的旧核心。帝国所有物种的岗位产出提高25%，岗位维护费不变。"
 shishan_code_refactored_jobs:0 "重构完成：岗位产出"
 trait_shishan_iteration_output:0 "优化迭代：计算路径"
 trait_shishan_iteration_output_desc:0 "每次命中提高本物种岗位产出1%，可重复累积。"
 trait_shishan_iteration_energy:0 "优化迭代：供能调度"
 trait_shishan_iteration_energy_desc:0 "每次命中降低本物种机器人维护费1%，可重复累积。"
 trait_shishan_iteration_assembly:0 "优化迭代：空间调度"
 trait_shishan_iteration_assembly_desc:0 "每次命中降低本物种住房使用1%，可重复累积。"
 trait_shishan_iteration_experience:0 "优化迭代：认知缓存"
 trait_shishan_iteration_experience_desc:0 "每次命中提高本物种科研岗位产出1%，可重复累积。"
 shishan_code_dynamic_cost:0 "按照已完成维护与优化次数计算"
 situation_shishan_code:0 "大厦将倾"
 situation_shishan_code_type:0 "大厦将倾"
 situation_shishan_code_desc:0 "庞大的底层代码正在逼近失控。维护可以把进度归零，却会让未来崩坏得更快；清理则能结束这一切。"
 situation_shishan_code_monthly_change_tooltip:0 "每月基础进度+5；每次维护或持续优化+1；每100已分配的维护员劳动力-0.1；最低+0.2。"
 shishan_code_monthly_speed:0 "代码老化与维护员劳动力"
 shishan_code_stage_1:0 "危险的红利"
 shishan_code_stage_1_desc:0 "旧代码过度榨取性能，短期收益惊人。"
 shishan_code_stage_2:0 "脆弱的平衡"
 shishan_code_stage_2_desc:0 "补丁勉强维持着系统。"
 shishan_code_stage_3:0 "错误蔓延"
 shishan_code_stage_3_desc:0 "故障开始妨碍整个文明。"
 shishan_code_stage_4:0 "连锁故障"
 shishan_code_stage_4_desc:0 "系统各处互相拖累。"
 shishan_code_stage_5:0 "大厦将倾"
 shishan_code_stage_5_desc:0 "崩坏已成为常态，唯有维护或清理能带来改变。"
 SHISHAN_CODE_MAINTAIN:0 "维护屎山"
 SHISHAN_CODE_MAINTAIN_DESC:0 "投入社会学研究，将局势进度归零。每次维护都会提高以后局势的月度进度与清理成本，并赋予主体物种一项正面改进。"
 SHISHAN_CODE_CLEAN:0 "清理屎山"
 SHISHAN_CODE_CLEAN_DESC:0 "彻底重构底层代码，结束局势；主体物种失去屎山代码并获得重构完成。"
 SHISHAN_CODE_OPTIMIZE:0 "持续优化"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "继续投入社会学研究，改进主体物种。每次完成有10%概率使大厦将倾局势复发。"
 building_shishan_code_institute:0 "屎山维护研究所"
 building_shishan_code_institute_desc:0 "研究所只提供自身的屎山维护员岗位。维护员的社会学基础产出比普通生物学家低1，并以实际分配的劳动力延缓代码崩坏。"
 job_shishan_code_maintainer:0 "屎山维护员"
 job_shishan_code_maintainer_plural:0 "屎山维护员"
 job_shishan_code_maintainer_desc:0 "日复一日地修复、隔离和记录旧代码的故障。"
 job_shishan_code_maintainer_drone:0 "屎山维护员"
 job_shishan_code_maintainer_drone_plural:0 "屎山维护员"
 job_shishan_code_maintainer_drone_desc:0 "专门维持旧核心运转的机械维护单位。"
 mod_job_shishan_code_maintainer_add:0 "$job_shishan_code_maintainer$岗位"
 mod_job_shishan_code_maintainer_drone_add:0 "$job_shishan_code_maintainer_drone$岗位"
 leader_trait_shishan_code_vivhite:0 "负疚的守护者"
 leader_trait_shishan_code_vivhite_desc:0 "白绮的记忆里保留着每一次没能及时阻止的故障。"
 leader_trait_shishan_code_vivhite_effect:0 "白绮存活且受雇时，全国工程学研究速度+10%，每次维护或优化额外+5%；社会学研究速度-5%，每次额外-2.5%，最多-75%。她不会因年龄死亡。"
 NAME_shishan_code_vivhite:0 "负疚者·白绮"
 NAME_shishan_code_backup_country:0 "白绮备份载体"
 shishan_code_vivhite_catch_phrase:0 "这都是我的错……"
 shishan_code_vivhite_backstory:0 "创造者消失以后，白绮独自守护着庞大的旧代码。她把所有故障都归咎于自己。"
 shishan_code_vivhite_no_dismiss:0 "白绮无法被主动解雇。"
 shishan_code_vivhite_base:0 "白绮的守护"
 shishan_code_vivhite_engineering_step:0 "白绮的维护经验"
 shishan_code_vivhite_society_step:0 "白绮的行政负担"
 decision_shishan_code_talk:0 "与白绮交谈"
 decision_shishan_code_talk_desc:0 "听听白绮此刻想说的话。"
 decision_shishan_code_reboot:0 "重启白绮"
 decision_shishan_code_reboot_desc:0 "以500能量币和200合金修复白绮的备份，使她保留原有成长并重新为帝国效力。"
 shishan_code.2.name:0 "遗失的维护日志"
 shishan_code.2.desc:0 "创造者失踪前的补丁记录仍在运行。日志末尾还有另一位维护者的签名。"
 shishan_code.2.a:0 "恢复日志索引。"
 shishan_code.3.name:0 "最后的值守者"
 shishan_code.3.desc:0 "日志指向一名仍在维护旧核心的机械智能。她叫白绮。她把每一次失控都记在自己名下。"
 shishan_code.3.a:0 "找到她。"
 shishan_code.4.name:0 "负疚者·白绮"
 shishan_code.4.desc:0 "白绮低声说：我……没能做到。若你仍愿意让我留下，我会继续修复它。"
 shishan_code.4.a:0 "和我们一起走下去，白绮。"
 shishan_code.12.name:0 "维护完成"
 shishan_code.12.a:0 "继续前进。"
 shishan_code.20.name:0 "清理屎山"
 shishan_code.20.a:0 "新的时代开始了。"
 shishan_code.31.name:0 "大厦将倾，再度开始"
 shishan_code.31.a:0 "再次维护它。"
 shishan_code.42.name:0 "白绮的备份"
 shishan_code.42.desc:0 "白绮因事故停止运行。她的完整备份仍在，投入资源即可重启；此前的等级、经验和特质会保留。"
 shishan_code.42.a:0 "保存备份，待我们准备好。"
 shishan_code.41.name:0 "重启白绮"
 shishan_code.41.desc:0 "完整备份等待重启。需要500能量币和200合金。"
 shishan_code.41.a:0 "支付资源并重启。"
 shishan_code.41.b:0 "暂时保留备份。"
 shishan_code.50.name:0 "与白绮交谈"
 shishan_code.50.a:0 "我们听见了。"
