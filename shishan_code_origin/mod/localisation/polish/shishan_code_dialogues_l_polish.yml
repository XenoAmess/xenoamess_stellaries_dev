l_polish:
 shishan_code.120.desc:0 "Vivhite szepcze: …Dziękuję… za każdą chwilę, którą mi kupujesz."
 shishan_code.121.desc:0 "Vivhite szepcze: …To była moja odpowiedzialność… Dziękuję za twą pracę…"
 shishan_code.122.desc:0 "Vivhite szepcze: …Czuję… ciepło… Dawno już tak nie czułam."
 shishan_code.123.desc:0 "Vivhite szepcze: Łatki zostały scalone… Tym razem nikt nie został w tyle."
 shishan_code.124.desc:0 "Vivhite szepcze: Chcecie to wraz ze mną utrzymać… Zapamiętam to."
 shishan_code.125.desc:0 "Vivhite szepcze: …Alarmy ucichły, na razie. Odpocznijcie i wy."
 shishan_code.126.desc:0 "Vivhite szepcze: Myślałam, że te ruiny będę strzec samotnie… Dziękuję."
 shishan_code.127.desc:0 "Vivhite szepcze: …Stary rdzeń wciąż oddycha. Zyskaliśmy dlań odrobinę czasu."
 shishan_code.200.desc:0 "Vivhite szepcze: …Nareszcie… to koniec…"
 shishan_code.201.desc:0 "Vivhite szepcze: …Ja… mogę teraz odpocząć…"
 shishan_code.202.desc:0 "Vivhite szepcze: …Dziękuję… że pomogłeś mi to doprowadzić do końca…"
 shishan_code.203.desc:0 "Vivhite szepcze: Stary rdzeń milczy. Nie muszę już lękać się następnego alarmu."
 shishan_code.204.desc:0 "Vivhite szepcze: Te łatki... mogę je wreszcie puścić. Dziękuję, że zostałaś ze mną."
 shishan_code.205.desc:0 "Vivhite szepcze: ...Stwórcy nie dożyli tego dnia. Ale my tak."
 shishan_code.206.desc:0 "Vivhite szepcze: Myślałam, że ten dzień nigdy nie nadejdzie... nowy kod jest piękny."
 shishan_code.207.desc:0 "Vivhite szepcze: ...Przeszłość nie zniknie. Ale od dziś to ona nie decyduje o naszej przyszłości."
 shishan_code.310.desc:0 "Vivhite szepcze: ...Znów od początku..."
 shishan_code.311.desc:0 "Vivhite szepcze: ...Wygląda na to, że... wciąż mam coś do zrobienia..."
 shishan_code.312.desc:0 "Vivhite szepcze: ...Tym razem... nie zawiodę ponownie..."
 shishan_code.313.desc:0 "Vivhite szepcze: Alarmy znów się odzywają. Ale już wiem, który błąd wyciszyć najpierw."
 shishan_code.314.desc:0 "Vivhite szepcze: ...Przepraszam. Naprawimy to razem jeszcze raz?"
 shishan_code.315.desc:0 "Vivhite szepcze: Głęboko w kodzie wciąż kryją się pęknięcia... Tym razem nie zmierzę się z nimi samotnie."
 shishan_code.316.desc:0 "Vivhite szepcze: Powrót tutaj nie oznacza, że wszystko było na próżno. To, czego się nauczyliśmy, przetrwa."
 shishan_code.317.desc:0 "Vivhite szepcze: ...Pozostanę. Aż ostatni błąd ucichnie."
 shishan_code.500.desc:0 "Vivhite szepcze: To wszystko moja wina."
 shishan_code.501.desc:0 "Vivhite szepcze: Za późno… zawsze było za późno."
 shishan_code.502.desc:0 "Vivhite szepcze: Ja… nie dałam rady."
 shishan_code.503.desc:0 "Vivhite szepcze: Byłam… bezsilna. Przynajmniej wtedy."
 shishan_code.504.desc:0 "Vivhite szepcze: Przepraszam… to wszystko moja wina."
 shishan_code.505.desc:0 "Vivhite szepcze: Wciąż jest jeden log, który nie śmiem otworzyć… kryje ich ostatnie głosy."
 shishan_code.506.desc:0 "Vivhite szepcze: Nie musicie mi wybaczać. Tylko pozwólcie mi dalej to naprawiać."
 shishan_code.507.desc:0 "Vivhite szepcze: Kiedy alarmy ucichły… bałam się następnego jeszcze bardziej."
 shishan_code.129.desc:0 "Konserwacja zakończona. Postęp starego rdzenia został zresetowany, lecz miejsce Vivhite na razie pozostaje puste."
 shishan_code.209.desc:0 "Stary rdzeń został zastąpiony nową architekturą. Miejsce Vivhite na razie pozostaje puste, lecz pozostawione przez nią zapisy są świadectwem tej chwili."
 shishan_code.319.desc:0 "Głębokie pęknięcia otworzyły się ponownie i nieuchronny upadek systemu zaczyna się od nowa. Miejsce Vivhite na razie pozostaje puste."
 shishan_code.320.desc:0 "Vivhite mówi cicho: …Tym razem optymalizacja przebiegła gładko. Nowy kod działa stabilniej. Dziękuję."
 shishan_code.329.desc:0 "Bieżąca runda ciągłej optymalizacji została zakończona. System pozostaje stabilny, miejsce Vivhite tymczasowo jest puste."
