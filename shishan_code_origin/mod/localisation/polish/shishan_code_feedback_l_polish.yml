l_polish:
 shishan_code_architecture_jobs:0 "Architektura zintegrowanych usług dawnej epoki oparta na niskiej spójności i wysokim sprzężeniu"
 shishan_code_architecture_jobs_desc:0 "Wszystkie faktycznie obecne cechy gatunku, zarówno pozytywne, jak i negatywne, są ważone rzeczywistą krajową populacją linii gatunku głównego. Każda efektywna cecha zapewnia addytywną premię +5% do produkcji stanowisk bez zwiększania utrzymania. Po wyczerpaniu ograniczonych pul nagród każda warstwa łatki liczy się jako jedna cecha, bez limitu. Ta wersja przedpremierowa stosuje premie addytywne; niezależne mnożenie nie zostało jeszcze wdrożone."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Objęta populacja linii głównej [Root.shishan_code_architecture_population]; średnia faktycznych cech U [Root.shishan_code_architecture_trait_average]; warstwy powtórzeń R [Root.shishan_code_architecture_repeat_count]; efektywne cechy T [Root.shishan_code_architecture_total]; addytywny współczynnik produkcji stanowisk [Root.shishan_code_architecture_bonus] (0.05 oznacza 5%). Te statystyki nie przedstawiają rzeczywistego niezależnego mnożnika dochodów."
 shishan_code_reward_title:0 "Wybierz ulepszenie tej konserwacji"
 shishan_code_reward_desc:0 "Wybierz jedną z maksymalnie trzech opcji tego samego poziomu. Wybraną cechę otrzymują tylko kwalifikujące się, faktyczne krajowe szablony. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Wygeneruj nowe opcje"
 shishan_code_reward_reroll_unavailable:0 "Ukończ jeszcze [Root.shishan_code_reroll_cooldown] wyborów faktycznych cech. Ponowne losowanie jest dostępne tylko, gdy nie użyto go dla tej nagrody i istnieją alternatywne opcje."
 shishan_code_reward_later:0 "Wybierz później"
 shishan_code_reward_claim_tooltip:0 "Zmienia tylko kwalifikujące się, faktyczne krajowe szablony; zagraniczne i niezgodne szablony pozostają bez zmian. Pierwotne efekty i utrzymanie cechy są zachowane."
 shishan_code_reward_repeat_result:0 "Nagrody faktycznych cech zostały wyczerpane. Ta nagroda dodaje jedną warstwę wzrostu. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "Zobacz architekturę zintegrowanych usług"
 decision_shishan_code_architecture_desc:0 "Zobacz pełną nazwę, faktyczny zasięg populacji oraz korzyści z liczby cech."
 decision_shishan_code_reward:0 "Wybierz oczekujące ulepszenie"
 decision_shishan_code_reward_desc:0 "Ponownie otwiera zapisane opcje. Otwarcie okna nie losuje ich ponownie ani nie skraca czasu oczekiwania."
 shishan_code_feedback_close:0 "Zamknij"
 shishan_code_reward_coverage_label:0 "Faktyczny udział objętej populacji głównej"
