l_polish:
 origin_shishan_code:0 "Spaghetti Code"
 origin_shishan_code_desc:0 "Byliśmy maszynami służebnymi zbudowanymi przez naszych stwórców. Bazowy kod był pospieszny i niebezpieczny, a każda jego rysa ukryta pod łatkami. Wiele lat temu stwórcy zniknęli. Sami utrzymujemy tę chwiejną wieżę w pionie, z trudem dźwigając ją aż do świtu ery kosmicznej."
 origin_shishan_code_effects:0 "Główny gatunek maszyn posiada cechę §YKod Spaghetti§! Dostępne punkty cech maleją o §R6§!, a limit wybieralnych cech wzrasta o §G3§!. Rozpocznij z sytuacją §YNadciągający Upadek§!, zyskaj dostęp do projektów konserwacji i porządkowania oraz pozyskaj legendarną liderkę Vivhite."
 origin_shishan_code_warning:0 "§RUwaga: Wymagające Pochodzenie§!"
 trait_shishan_code:0 "Spaghetti Code"
 trait_shishan_code_desc:0 "Niezliczone łatki tłumią ukryte błędy. Każde wywołanie grozi obudzeniem fragmentu wymykającej się logiki."
 trait_shishan_refactored:0 "Refaktoryzacja zakończona"
 trait_shishan_refactored_desc:0 "Nowa architektura ostatecznie zastąpiła chwiejny stary rdzeń. Wydajność pracy wzrosła o 25%."
 trait_shishan_iteration_output:0 "Iteracja optymalizacji: ścieżka obliczeniowa"
 trait_shishan_iteration_output_desc:0 "Każde trafienie zwiększa wydajność pracy tego gatunku o 1%. Może się kumulować wielokrotnie."
 trait_shishan_iteration_energy:0 "Iteracja optymalizacji: trasowanie mocy"
 trait_shishan_iteration_energy_desc:0 "Każde trafienie zmniejsza koszt utrzymania robotów tego gatunku o 1%. Można kumulować."
 trait_shishan_iteration_assembly:0 "Iteracja optymalizacji: alokacja przestrzeni"
 trait_shishan_iteration_assembly_desc:0 "Każde nałożenie zmniejsza zużycie kwater tego gatunku o 1%."
 trait_shishan_iteration_experience:0 "Iteracja optymalizacji: pamięć podręczna kognitywna"
 trait_shishan_iteration_experience_desc:0 "Każdy stos zwiększa wydajność pracy badacza tego gatunku o 1%."
 shishan_code_dynamic_cost:0 "Na podstawie zakończonych przebiegów konserwacji i optymalizacji"
 situation_shishan_code:0 "Imminent Collapse"
 situation_shishan_code_type:0 "Imminent Collapse"
 situation_shishan_code_desc:0 "Rozległy blok starszego kodu zmierza ku niekontrolowanej awarii. Konserwacja resetuje postęp do zera, lecz przyspiesza przyszłe załamanie; oczyszczenie może zakończyć to raz na zawsze."
 situation_shishan_code_monthly_change_tooltip:0 "Bazowy postęp +5 miesięcznie; +1 za każdy przebieg konserwacji lub ciągłej optymalizacji; -0,1 za każde 100 przydzielonych roboczogodzin pracowników konserwacji; minimum +0,2."
 shishan_code_monthly_speed:0 "Starzenie się kodu i nakład pracy pracowników konserwacji"
 shishan_code_stage_1:0 "Perilous Dividend"
 shishan_code_stage_1_desc:0 "Przestarzały kod napina system do granic możliwości, przynosząc zaskakujące krótkoterminowe korzyści."
 shishan_code_stage_2:0 "Niepewna Równowaga"
 shishan_code_stage_2_desc:0 "Łatki ledwo utrzymują system w całości."
 shishan_code_stage_3:0 "Rozprzestrzenianie się Błędów"
 shishan_code_stage_3_desc:0 "Usterki zaczynają hamować całą cywilizację."
 shishan_code_stage_4:0 "Kaskadowe Awarie"
 shishan_code_stage_4_desc:0 "Każdy system ciągnie pozostałe w dół."
 shishan_code_stage_5:0 "Nieuchronny Upadek Systemu"
 shishan_code_stage_5_desc:0 "Awaria stała się normą; jedynie konserwacja lub porządki mogą coś zmienić."
 SHISHAN_CODE_MAINTAIN:0 "Utrzymuj Spaghetti Code"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Wydaj Badania Społeczne, aby zresetować postęp sytuacji do zera. Każdy cykl konserwacji przyspiesza przyszłą degradację, zwiększa koszt porządkowania i przyznaje głównemu gatunkowi pozytywną cechę."
 SHISHAN_CODE_CLEAN:0 "Posprzątaj Spaghetti Code"
 SHISHAN_CODE_CLEAN_DESC:0 "Całkowicie przebuduj bazowy kod i zakończ sytuację. Główny gatunek traci Spaghetti Code i zyskuje Refaktoryzacja Zakończona."
 SHISHAN_CODE_OPTIMIZE:0 "Ciągła optymalizacja"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Przeznacz badania Społeczeństwa na ulepszenie gatunku głównego. Każde ukończenie niesie 10% szansy na nawrót rychłego załamania systemu."
 building_shishan_code_institute:0 "Instytut Utrzymania Spaghetti Code"
 building_shishan_code_institute_desc:0 "Instytut oferuje wyłącznie własne stanowiska Spaghetti Code Maintainer. Każdy maintainer wytwarza o 1 mniej bazowych punktów badań Społeczeństwa niż standardowy badacz; przydzielona siła robocza spowalnia rozpad kodu."
 job_shishan_code_maintainer:0 "Opiekun kodu spaghetti"
 job_shishan_code_maintainer_plural:0 "Opiekunowie kodu spaghetti"
 job_shishan_code_maintainer_desc:0 "Dzień za dniem, łatanie, izolowanie i rejestrowanie awarii starego kodu."
 job_shishan_code_maintainer_drone:0 "Opiekun kodu spaghetti"
 job_shishan_code_maintainer_drone_plural:0 "Opiekunowie kodu spaghetti"
 job_shishan_code_maintainer_drone_desc:0 "Dedykowana jednostka mechaniczna zbudowana, by utrzymać stare jądro w ruchu."
 mod_job_shishan_code_maintainer_add:0 "Stanowiska $job_shishan_code_maintainer$"
 mod_job_shishan_code_maintainer_drone_add:0 "Stanowiska $job_shishan_code_maintainer_drone$"
 leader_trait_shishan_code_vivhite:0 "Guardian of Guilt"
 leader_trait_shishan_code_vivhite_desc:0 "Pamięć Vivhite zachowuje każdą porażkę, której nie zdołała zapobiec na czas."
 leader_trait_shishan_code_vivhite_effect:0 "Dopóki Vivhite żyje i jest zatrudniona, prędkość badań inżynieryjnych imperium wzrasta o 10%, plus 5% za każdą konserwację lub optymalizację. Prędkość badań społecznych spada o 5%, plus 2,5% za każde ukończenie, maksymalnie do kary 75%. Nie może umrzeć ze starości."
 NAME_shishan_code_vivhite:0 "Skruszała · Vivhite"
 NAME_shishan_code_backup_country:0 "Jednostka zapasowa Vivhite"
 shishan_code_vivhite_catch_phrase:0 "It is all my fault…"
 shishan_code_vivhite_backstory:0 "Po zniknięciu twórców Vivhite samotnie strzegła rozległego dziedzictwa spaghetti code'u. Obwinia się za każdą usterkę."
 shishan_code_vivhite_no_dismiss:0 "Vivhite nie może zostać zwolniona wedle woli."
 shishan_code_vivhite_base:0 "Vivhite's Vigil"
 shishan_code_vivhite_engineering_step:0 "Doświadczenie serwisowe Vivhite"
 shishan_code_vivhite_society_step:0 "Biurokratyczny ciężar Vivhite"
 decision_shishan_code_talk:0 "Speak with Vivhite"
 decision_shishan_code_talk_desc:0 "Posłuchaj, co Vivhite ma do powiedzenia."
 decision_shishan_code_reboot:0 "Uruchom ponownie Vivhite"
 decision_shishan_code_reboot_desc:0 "Wydaj 500 kredytów energetycznych i 200 stopów, aby odtworzyć kopię zapasową Vivhite, zachowując jej poziom, doświadczenie i cechy."
 shishan_code.2.name:0 "Utracony dziennik konserwacji"
 shishan_code.2.desc:0 "Rekordy łatek sprzed zniknięcia twórców wciąż działają. Na końcu dziennika widnieje podpis innego opiekuna."
 shishan_code.2.a:0 "Odtwórz indeks dziennika."
 shishan_code.3.name:0 "Ostatni wartownik"
 shishan_code.3.desc:0 "Dziennik wskazuje na inteligencję maszynową, która wciąż utrzymuje stary rdzeń. Na imię ma Vivhite. Każdą awarię zapisuje na swoje własne konto."
 shishan_code.3.a:0 "Znajdź ją."
 shishan_code.4.name:0 "Skruszona · Vivhite"
 shishan_code.4.desc:0 "Vivhite szepcze: Ja... nie dałam rady. Jeśli wciąż pozwolisz mi zostać, będę dalej to naprawiać."
 shishan_code.4.a:0 "Zostań z nami, Vivhite."
 shishan_code.12.name:0 "Konserwacja zakończona"
 shishan_code.12.a:0 "Move forward."
 shishan_code.20.name:0 "Refaktoryzacja kodu spaghetti"
 shishan_code.20.a:0 "A new era begins."
 shishan_code.31.name:0 "Nieuchronny upadek systemu, restart"
 shishan_code.31.a:0 "Maintain it again."
 shishan_code.42.name:0 "Vivhite Backup"
 shishan_code.42.desc:0 "Vivhite zakończyła działanie z powodu incydentu. Jej pełna kopia zapasowa pozostaje nienaruszona; zainwestuj zasoby, aby ją ponownie uruchomić, a jej poprzedni poziom, doświadczenie i cechy zostaną zachowane."
 shishan_code.42.a:0 "Zachowaj kopię zapasową, aż będziemy gotowi."
 shishan_code.41.name:0 "Restart Vivhite"
 shishan_code.41.desc:0 "Pełna kopia zapasowa oczekuje na ponowne uruchomienie. Wymaga 500 kredytów energetycznych i 200 stopów."
 shishan_code.41.a:0 "Zapłać zasoby i uruchom ponownie."
 shishan_code.41.b:0 "Na razie zachowaj kopię zapasową."
 shishan_code.50.name:0 "Porozmawiaj z Vivhite"
 shishan_code.50.a:0 "Słyszymy cię."
