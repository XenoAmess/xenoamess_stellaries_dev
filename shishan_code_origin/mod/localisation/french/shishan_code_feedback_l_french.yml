l_french:
 shishan_code_architecture_jobs:0 "Architecture de services intégrés de l'ancienne ère fondée sur une faible cohésion et un fort couplage"
 shishan_code_architecture_jobs_desc:0 "Tous les traits d'espèce réellement présents, positifs comme négatifs, sont pondérés selon la population nationale réelle de la lignée de l'espèce principale. Chaque trait effectif accorde un bonus additif de +5 % à la production des postes, sans augmenter l'entretien. Une fois les réserves limitées de récompenses épuisées, chaque couche de correctif compte pour un trait, sans plafond. Cette préversion utilise des bonus additifs ; la multiplication indépendante n'est pas encore implémentée."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Population couverte de la lignée principale [Root.shishan_code_architecture_population] ; moyenne des traits réels U [Root.shishan_code_architecture_trait_average] ; couches répétées R [Root.shishan_code_architecture_repeat_count] ; traits effectifs T [Root.shishan_code_architecture_total] ; coefficient additif de production des postes [Root.shishan_code_architecture_bonus] (0.05 signifie 5 %). Ces statistiques ne représentent pas un multiplicateur indépendant réel des revenus."
 shishan_code_reward_title:0 "Choisir l'amélioration de cette maintenance"
 shishan_code_reward_desc:0 "Choisissez une option parmi trois au maximum du même palier. Seuls les modèles nationaux réels et admissibles reçoivent le trait choisi. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Générer de nouvelles options"
 shishan_code_reward_reroll_unavailable:0 "Effectuez encore [Root.shishan_code_reroll_cooldown] sélections de traits réels. Le renouvellement est disponible uniquement si ce choix n'a pas encore été renouvelé et si des options alternatives existent."
 shishan_code_reward_later:0 "Choisir plus tard"
 shishan_code_reward_claim_tooltip:0 "Modifie uniquement les modèles nationaux réels et admissibles, sans changer les modèles étrangers ou incompatibles. Les effets et l'entretien d'origine du trait sont conservés."
 shishan_code_reward_repeat_result:0 "Les récompenses de traits réels sont épuisées. Cette récompense ajoute une couche de croissance. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "Voir l'architecture de services intégrés"
 decision_shishan_code_architecture_desc:0 "Consultez le nom complet, la couverture réelle de la population et les bénéfices du nombre de traits."
 decision_shishan_code_reward:0 "Choisir une amélioration en attente"
 decision_shishan_code_reward_desc:0 "Rouvre les options sauvegardées. Rouvrir la fenêtre ne renouvelle pas les options et ne fait pas avancer le délai."
 shishan_code_feedback_close:0 "Fermer"
 shishan_code_reward_coverage_label:0 "Part réelle de la population principale couverte"
