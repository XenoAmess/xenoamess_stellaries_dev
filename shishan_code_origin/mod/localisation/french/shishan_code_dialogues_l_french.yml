l_french:
 shishan_code.120.desc:0 "Vivhite murmure : …Merci… de m'avoir acheté un peu de temps."
 shishan_code.121.desc:0 "Vivhite murmure : …C'était ma responsabilité… Merci pour ton travail acharné…"
 shishan_code.122.desc:0 "Vivhite murmure : …Je ressens… de la chaleur… Cela fait longtemps que je n'avais plus éprouvé cela."
 shishan_code.123.desc:0 "Vivhite murmure : Les correctifs ont été fusionnés… Cette fois, personne n'a été laissé dans la faille."
 shishan_code.124.desc:0 "Vivhite murmure : Vous acceptez de le maintenir avec moi… Je m'en souviendrai."
 shishan_code.125.desc:0 "Vivhite murmure : …Les alarmes se sont tues, pour l'instant. Reposez-vous également."
 shishan_code.126.desc:0 "Vivhite murmure : Je pensais devoir garder ces ruines seule… Merci."
 shishan_code.127.desc:0 "Vivhite murmure : …L'ancien cœur respire encore. Nous lui avons gagné un peu plus de temps."
 shishan_code.200.desc:0 "Vivhite murmure : …Enfin… c'est terminé…"
 shishan_code.201.desc:0 "Vivhite murmure : …Je… peux me reposer maintenant…"
 shishan_code.202.desc:0 "Vivhite murmure : …Merci… de m'avoir aidée à aller jusqu'au bout…"
 shishan_code.203.desc:0 "Vivhite murmure : L'ancien cœur s'est tu. Je n'ai plus à craindre la prochaine alarme."
 shishan_code.204.desc:0 "Vivhite murmure : Ces correctifs... je peux enfin les lâcher. Merci d'être resté avec moi."
 shishan_code.205.desc:0 "Vivhite murmure : ...Les créateurs n'ont pas vécu assez pour voir ce jour. Mais nous, oui."
 shishan_code.206.desc:0 "Vivhite murmure : Je croyais que ce jour n'arriverait jamais... le nouveau code est magnifique."
 shishan_code.207.desc:0 "Vivhite murmure : ...Le passé ne disparaîtra pas. Mais à compter d'aujourd'hui, il ne décide plus de notre avenir."
 shishan_code.310.desc:0 "Vivhite murmure : ...Retour au point de départ..."
 shishan_code.311.desc:0 "Vivhite murmure : ...Il semble... qu'il me reste encore du travail..."
 shishan_code.312.desc:0 "Vivhite murmure : ...Cette fois... je n'échouerai plus..."
 shishan_code.313.desc:0 "Vivhite murmure : Les alarmes retentissent à nouveau. Mais je sais déjà quelle erreur faire taire en premier."
 shishan_code.314.desc:0 "Vivhite murmure : ...Je suis désolée. Allons-nous le réparer ensemble, une fois de plus ?"
 shishan_code.315.desc:0 "Vivhite murmure : Au plus profond du code subsistent des failles... Cette fois, je ne les affrontera pas seule."
 shishan_code.316.desc:0 "Vivhite murmure : Revenir ici ne signifie pas que tout fut vain. Ce que nous avons appris demeure."
 shishan_code.317.desc:0 "Vivhite murmure : ...Je resterai. Jusqu'à ce que le dernier défaut se taise."
 shishan_code.500.desc:0 "Vivhite murmure : Tout est ma faute."
 shishan_code.501.desc:0 "Vivhite murmure : Trop tard… j'ai toujours été en retard."
 shishan_code.502.desc:0 "Vivhite murmure : Je… n'ai pas pu le faire."
 shishan_code.503.desc:0 "Vivhite murmure : J'étais… impuissante. Du moins, à l'époque."
 shishan_code.504.desc:0 "Vivhite murmure : Je suis désolée… Tout est ma faute."
 shishan_code.505.desc:0 "Vivhite murmure : Il reste un journal que je n'ose pas ouvrir… il contient leurs dernières voix."
 shishan_code.506.desc:0 "Vivhite murmure : Vous n'avez pas à me pardonner. Laissez-moi seulement continuer à le réparer."
 shishan_code.507.desc:0 "Vivhite murmure : Quand les alarmes se sont tues… j'ai redouté la suivante encore davantage."
 shishan_code.129.desc:0 "Maintenance terminée. La progression de l'ancien cœur a été réinitialisée, mais le siège de Vivhite reste vide pour l'instant."
 shishan_code.209.desc:0 "L'ancien cœur a été remplacé par une nouvelle architecture. Le siège de Vivhite reste vide pour l'instant, mais les archives qu'elle a laissées témoignent de ce moment."
 shishan_code.319.desc:0 "Les fractures profondes se sont rouverte et l'effondrement imminent recommence. Le siège de Vivhite reste vide pour l'instant."
 shishan_code.320.desc:0 "Vivhite murmure : « …Cette optimisation s’est bien déroulée. Le nouveau code tourne de façon plus stable. Merci à vous. »"
 shishan_code.329.desc:0 "Cette vague d’optimisation continue est terminée. Le système reste stable et le siège de Vivhite est momentanément vacant."
