l_french:
 origin_shishan_code:0 "Code Spaghetti"
 origin_shishan_code_desc:0 "Nous étions des machines de servitude construites par nos créateurs. Le code sous-jacent a été bâclé et dangereux, chaque faille dissimulée sous des rustines. Il y a de nombreuses années, les créateurs ont disparu. Seules, nous avons maintenu cette tour chancelante debout, parvenant à peine à l'amener jusqu'à l'aube de l'ère spatiale."
 origin_shishan_code_effects:0 "L'espèce mécanique principale dispose du trait §YCode Spaghetti§!. Les points de trait disponibles diminuent de §R6§! et la limite de traits sélectionnables augmente de §G3§!. Commencez avec la situation §YEffondrement Imminent§!, accédez à des projets de maintenance et de nettoyage, et recrutez la dirigeante légendaire Vivhite."
 origin_shishan_code_warning:0 "§RAttention : Origine exigeante§!"
 trait_shishan_code:0 "Code Spaghetti"
 trait_shishan_code_desc:0 "D'innombrables rustines étouffent les fautes sous-jacentes. Chaque appel risque d'éveiller un fragment de logique incontrôlée."
 trait_shishan_refactored:0 "Refactorisation Terminée"
 trait_shishan_refactored_desc:0 "La nouvelle architecture a enfin remplacé l'ancien cœur défaillant. La production de tous les postes de l'empire, pour toutes les espèces, augmente de 25 %, sans modification des frais d'entretien."
 shishan_code_refactored_jobs:0 "Refactorisation achevée : production des postes"
 trait_shishan_iteration_output:0 "Itération d'Optimisation : Voie de Calcul"
 trait_shishan_iteration_output_desc:0 "Chaque occurrence augmente de 1 % la production des postes de cette espèce. Cumulable indéfiniment."
 trait_shishan_iteration_energy:0 "Itération d'Optimisation : Routage d'Énergie"
 trait_shishan_iteration_energy_desc:0 "Chaque occurrence diminue de 1 % le coût de maintenance robotique de cette espèce. Cumulable indéfiniment."
 trait_shishan_iteration_assembly:0 "Itération d'optimisation : allocation d'espace"
 trait_shishan_iteration_assembly_desc:0 "Chaque occurrence réduit l'usage résidentiel de cette espèce de 1 %."
 trait_shishan_iteration_experience:0 "Itération d'optimisation : cache cognitif"
 trait_shishan_iteration_experience_desc:0 "Chaque occurrence augmente la sortie des postes de chercheur de cette espèce de 1 %."
 shishan_code_dynamic_cost:0 "Basé sur les cycles de Maintenance et d'Optimisation terminés"
 situation_shishan_code:0 "Effondrement imminent"
 situation_shishan_code_type:0 "Effondrement imminent"
 situation_shishan_code_desc:0 "Une vaste masse de code legacy dérive vers une défaillance incontrôlable. La maintenance remet la progression à zéro, mais accélère l'effondrement futur ; une purge peut y mettre un terme définitif."
 situation_shishan_code_monthly_change_tooltip:0 "Progression de base +5 par mois ; +1 par cycle de Maintenance ou d'Optimisation continue ; -0,1 par tranche de 100 ouvriers de maintenance alloués ; minimum +0,2."
 shishan_code_monthly_speed:0 "Vieillissement du code et main-d'œuvre de maintenance"
 shishan_code_stage_1:0 "Dividende périlleux"
 shishan_code_stage_1_desc:0 "Le code legacy pousse le système à bout, produisant des gains à court terme saisissants."
 shishan_code_stage_2:0 "Équilibre précaire"
 shishan_code_stage_2_desc:0 "Les correctifs maintiennent à peine le système en place."
 shishan_code_stage_3:0 "Propagation d'erreurs"
 shishan_code_stage_3_desc:0 "Les dysfonctionnements commencent à entraver toute la civilisation."
 shishan_code_stage_4:0 "Défaillances en cascade"
 shishan_code_stage_4_desc:0 "Chaque système entraîne les autres dans sa chute."
 shishan_code_stage_5:0 "Effondrement imminent du système"
 shishan_code_stage_5_desc:0 "L'effondrement est devenu la norme ; seule la maintenance ou le nettoyage peut changer la donne."
 SHISHAN_CODE_MAINTAIN:0 "Maintenir le spaghetti code"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Consomme de la recherche sociétale pour ramener la progression de la situation à zéro. Chaque cycle de maintenance accélère la détérioration future, augmente le coût du nettoyage et octroie un trait positif à l'espèce principale."
 SHISHAN_CODE_CLEAN:0 "Nettoyer le spaghetti code"
 SHISHAN_CODE_CLEAN_DESC:0 "Refactorise entièrement le code sous-jacent et met fin à la situation. L'espèce principale perd le spaghetti code et obtient Refactorisation achevée."
 SHISHAN_CODE_OPTIMIZE:0 "Optimisation continue"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Consacrer de la recherche sociétale pour améliorer l'espèce principale. Chaque achèvement a 10 % de chances de relancer l'Effondrement imminent."
 building_shishan_code_institute:0 "Institut de maintenance du code spaghetti"
 building_shishan_code_institute_desc:0 "L'institut ne fournit que ses propres postes de Mainteneur de code spaghetti. Chaque mainteneur produit 1 recherche sociétale de base de moins qu'un chercheur standard ; la main-d'œuvre affectée ralentit l'effondrement du code."
 job_shishan_code_maintainer:0 "Mainteneur de code spaghetti"
 job_shishan_code_maintainer_plural:0 "Mainteneurs de code spaghetti"
 job_shishan_code_maintainer_desc:0 "Jour après jour, corriger, isoler et consigner les défaillances de l'ancien code."
 job_shishan_code_maintainer_drone:0 "Mainteneur de code spaghetti"
 job_shishan_code_maintainer_drone_plural:0 "Mainteneurs de code spaghetti"
 job_shishan_code_maintainer_drone_desc:0 "Une unité mécanique dédiée, conçue pour maintenir l'ancien cœur en fonctionnement."
 mod_job_shishan_code_maintainer_add:0 "Postes de $job_shishan_code_maintainer$"
 mod_job_shishan_code_maintainer_drone_add:0 "Postes de $job_shishan_code_maintainer_drone$"
 leader_trait_shishan_code_vivhite:0 "Gardienne marquée par la culpabilité"
 leader_trait_shishan_code_vivhite_desc:0 "La mémoire de Vivhite conserve chaque défaillance qu'elle n'a pas su empêcher à temps."
 leader_trait_shishan_code_vivhite_effect:0 "Tant que Vivhite est en vie et employée, la vitesse de recherche en Ingénierie de l'empire augmente de 10 %, plus 5 % par maintenance ou optimisation. La vitesse de recherche en Société diminue de 5 %, plus 2,5 % par achèvement, plafonnée à 75 % de pénalité. Elle ne meurt pas de vieillesse."
 leader_trait_shishan_xp_restore_boost:0 "Calibrage de la mémoire"
 leader_trait_shishan_xp_restore_boost_desc:0 "Vivhite restaure les enregistrements d'expérience antérieurs au redémarrage. Le calibrage sera terminé d'ici quelques jours."
 NAME_shishan_code_vivhite:0 "La Rémorse · Vivhite"
 NAME_shishan_code_backup_country:0 "Vaisseau de sauvegarde de Vivhite"
 shishan_code_vivhite_catch_phrase:0 "Tout est de ma faute…"
 shishan_code_vivhite_backstory:0 "Après la disparition des créateurs, Vivhite a veillé seule sur l'immense héritage de code spaghetti. Elle s'impute la responsabilité de chaque dysfonctionnement."
 shishan_code_vivhite_no_dismiss:0 "Vivhite ne peut pas être renvoyée."
 shishan_code_vivhite_base:0 "Veille de Vivhite"
 shishan_code_vivhite_engineering_step:0 "Expérience de maintenance de Vivhite"
 shishan_code_vivhite_society_step:0 "Charge administrative de Vivhite"
 decision_shishan_code_talk:0 "Parler à Vivhite"
 decision_shishan_code_talk_desc:0 "Écoutez ce que Vivhite a à dire."
 decision_shishan_code_reboot:0 "Reboot Vivhite"
 decision_shishan_code_reboot_desc:0 "Dépensez 500 crédits d'énergie et 200 alliages pour restaurer la sauvegarde de Vivhite, en conservant son niveau, son expérience et ses traits."
 shishan_code.2.name:0 "Journal de maintenance perdu"
 shishan_code.2.desc:0 "Des correctifs antérieurs à la disparition des créateurs sont toujours en cours d'exécution. À la fin du journal, la signature d'un autre mainteneur figure encore."
 shishan_code.2.a:0 "Restaurer l'index du journal."
 shishan_code.3.name:0 "La dernière sentinelle"
 shishan_code.3.desc:0 "Le journal désigne une intelligence mécanique qui entretient toujours l'ancien cœur. Elle s'appelle Vivhite. Elle consigne chaque défaillance sous son propre nom."
 shishan_code.3.a:0 "La trouver."
 shishan_code.4.name:0 "La rongée par le regret · Vivhite"
 shishan_code.4.desc:0 "Vivhite murmure : Je... n'ai pas pu y arriver. Si vous me laissez rester, je continuerai à le réparer."
 shishan_code.4.a:0 "Restez avec nous, Vivhite."
 shishan_code.12.name:0 "Maintenance terminée"
 shishan_code.12.a:0 "Avancer."
 shishan_code.20.name:0 "Refactoriser le code spaghetti"
 shishan_code.20.a:0 "Une ère nouvelle commence."
 shishan_code.31.name:0 "Effondrement imminent du système, redémarrer"
 shishan_code.31.a:0 "Procéder à la maintenance à nouveau."
 shishan_code.42.name:0 "Sauvegarde de Vivhite"
 shishan_code.42.desc:0 "Vivhite a cessé de fonctionner suite à un incident. Sa sauvegarde complète est intacte ; investissez des ressources pour la redémarrer, et son niveau, son expérience et ses traits précédents seront conservés."
 shishan_code.42.a:0 "Conserver la sauvegarde jusqu'à ce que nous soyons prêts."
 shishan_code.41.name:0 "Redémarrer Vivhite"
 shishan_code.41.desc:0 "Sauvegarde complète en attente de redémarrage. Nécessite 500 crédits d'énergie et 200 alliages."
 shishan_code.41.a:0 "Payer les ressources et redémarrer."
 shishan_code.41.b:0 "Conserver la sauvegarde, pour l'instant."
 shishan_code.50.name:0 "Parler avec Vivhite"
 shishan_code.50.a:0 "Nous vous entendons."
