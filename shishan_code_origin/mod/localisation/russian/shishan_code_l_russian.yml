l_russian:
 origin_shishan_code:0 "Спагетти-код"
 origin_shishan_code_desc:0 "Мы были служебными машинами, созданными нашими творцами. Базовый код был спешно написан и опасен: каждая трещина скрывалась под заплатками. Много лет назад создатели исчезли. Мы в одиночку удерживали это шаткое строение, едва дотянув до рассвета космической эпохи."
 origin_shishan_code_effects:0 "Основная машинная раса получает особенность §YСпагетти-код§!. Число очков особенностей уменьшается на §R6§!, лимит выбираемых особенностей увеличивается на §G3§!. Начало игры начинается в ситуации §YНеизбежный коллапс§!, открывается доступ к проектам обслуживания и очистки, а также к легендарному лидеру Вивхайт."
 origin_shishan_code_warning:0 "§RВнимание: сложное происхождение§!"
 trait_shishan_code:0 "Спагетти-код"
 trait_shishan_code_desc:0 "Бесчисленные заплатки глушат скрытые ошибки. Каждый вызов рискует пробудить фрагмент неконтролируемой логики."
 trait_shishan_refactored:0 "Рефакторинг завершён"
 trait_shishan_refactored_desc:0 "Новая архитектура наконец заменила ветхие старые ядра. Производство всех должностей у всех видов империи увеличено на 25%, расходы на содержание должностей не изменились."
 shishan_code_refactored_jobs:0 "Рефакторинг завершён: производство должностей"
 trait_shishan_iteration_output:0 "Итерация оптимизации: путь вычислений"
 trait_shishan_iteration_output_desc:0 "Каждое попадание увеличивает выход работ этой расы на 1%. Может суммироваться многократно."
 trait_shishan_iteration_energy:0 "Итерация оптимизации: распределение энергии"
 trait_shishan_iteration_energy_desc:0 "Каждое попадание снижает стоимость обслуживания роботов этой расы на 1%. Может суммироваться многократно."
 trait_shishan_iteration_assembly:0 "Оптимизационная итерация: распределение пространства"
 trait_shishan_iteration_assembly_desc:0 "Каждый стек снижает потребность этого вида в жилье на 1%."
 trait_shishan_iteration_experience:0 "Оптимизационная итерация: когнитивный кэш"
 trait_shishan_iteration_experience_desc:0 "Каждый стек повышает выработку научных работников этого вида на 1%."
 shishan_code_dynamic_cost:0 "Зависит от числа завершённых циклов обслуживания и оптимизации"
 situation_shishan_code:0 "Неизбежный коллапс"
 situation_shishan_code_type:0 "Неизбежный коллапс"
 situation_shishan_code_desc:0 "Массив унаследованного спагетти-кода дрейфует к неконтролируемому сбою. Обслуживание сбрасывает прогресс до нуля, но ускоряет будущий коллапс; полная очистка положит этому конец."
 situation_shishan_code_monthly_change_tooltip:0 "Базовый прогресс +5 в месяц; +1 за каждый цикл обслуживания или непрерывной оптимизации; -0,1 за каждые 100 единиц труда работников обслуживания; минимум +0,2."
 shishan_code_monthly_speed:0 "Старение кода и труд работников обслуживания"
 shishan_code_stage_1:0 "Опасная выгода"
 shishan_code_stage_1_desc:0 "Унаследованный код выжимает из системы всё до последнего, давая поразительную краткосрочную отдачу."
 shishan_code_stage_2:0 "Шаткое равновесие"
 shishan_code_stage_2_desc:0 "Заплатки едва удерживают систему на плаву."
 shishan_code_stage_3:0 "Распространение ошибок"
 shishan_code_stage_3_desc:0 "Сбои начинают тормозить работу всей цивилизации."
 shishan_code_stage_4:0 "Каскадные сбои"
 shishan_code_stage_4_desc:0 "Каждая система тянет остальные за собой."
 shishan_code_stage_5:0 "Неизбежный коллапс системы"
 shishan_code_stage_5_desc:0 "Крах стал нормой; изменить ситуацию может только обслуживание или очистка."
 SHISHAN_CODE_MAINTAIN:0 "Обслуживать спагетти-код"
 SHISHAN_CODE_MAINTAIN_DESC:0 "Потратить общественные исследования, чтобы обнулить прогресс ситуации. Каждый цикл обслуживания ускоряет будущее ухудшение, повышает стоимость очистки и даёт основному виду положительную черту."
 SHISHAN_CODE_CLEAN:0 "Очистить спагетти-код"
 SHISHAN_CODE_CLEAN_DESC:0 "Полностью переписать базовый код и завершить ситуацию. Основной вид теряет спагетти-код и получает черту «Рефакторинг завершён»."
 SHISHAN_CODE_OPTIMIZE:0 "Продолжение оптимизации"
 SHISHAN_CODE_OPTIMIZE_DESC:0 "Потратить очки исследования общества на улучшение основного вида. Каждое завершение с 10% вероятностью вызывает повторное приближение коллапса системы."
 building_shishan_code_institute:0 "Институт поддержки спагетти-кода"
 building_shishan_code_institute_desc:0 "Институт предоставляет только собственные рабочие места специалиста по поддержке спагетти-кода. Каждый специалист производит на 1 единицу меньше базового исследования общества, чем стандартный исследователь; назначенный персонал замедляет разрушение кода."
 job_shishan_code_maintainer:0 "Специалист по поддержке спагетти-кода"
 job_shishan_code_maintainer_plural:0 "Специалисты по поддержке спагетти-кода"
 job_shishan_code_maintainer_desc:0 "День за днём — патчи, изоляция ошибок и журналирование сбоев устаревшего кода."
 job_shishan_code_maintainer_drone:0 "Специалист по поддержке спагетти-кода"
 job_shishan_code_maintainer_drone_plural:0 "Специалисты по поддержке спагетти-кода"
 job_shishan_code_maintainer_drone_desc:0 "Выделенный сервисный механизм, созданный для поддержания работы старого ядра."
 mod_job_shishan_code_maintainer_add:0 "рабочие места $job_shishan_code_maintainer$"
 mod_job_shishan_code_maintainer_drone_add:0 "рабочие места $job_shishan_code_maintainer_drone$"
 leader_trait_shishan_code_vivhite:0 "Виновный страж"
 leader_trait_shishan_code_vivhite_desc:0 "Память Вивхайт хранит каждую неисправность, которую она не успела предотвратить."
 leader_trait_shishan_code_vivhite_effect:0 "Пока Вивхайт жива и находится на службе, скорость инженерных исследований империи увеличивается на 10%, плюс 5% за каждое обслуживание или оптимизацию. Скорость общественных исследований снижается на 5%, плюс 2,5% за каждое завершение, но не более чем на 75%. Она не может умереть от старости."
 leader_trait_shishan_xp_restore_boost:0 "Восстановление памяти"
 leader_trait_shishan_xp_restore_boost_desc:0 "Вивхайт восстанавливает записи опыта, сохранённые до перезагрузки. Калибровка будет завершена в течение нескольких дней."
 NAME_shishan_code_vivhite:0 "Кающаяся · Вивхайт"
 NAME_shishan_code_backup_country:0 "Резервный носитель Вивхайт"
 shishan_code_vivhite_catch_phrase:0 "Это полностью моя вина…"
 shishan_code_vivhite_backstory:0 "После исчезновения создателей Вивхайт в одиночку оберегала огромное наследие спагетти-кода. Она винит в каждом сбое только себя."
 shishan_code_vivhite_no_dismiss:0 "Вивхайт не может быть уволена по желанию."
 shishan_code_vivhite_base:0 "Бдение Вивхайт"
 shishan_code_vivhite_engineering_step:0 "Опыт обслуживания Вивхайт"
 shishan_code_vivhite_society_step:0 "Административное бремя Вивхайт"
 decision_shishan_code_talk:0 "Поговорить с Вивхайт"
 decision_shishan_code_talk_desc:0 "Послушать, что скажет Вивайт."
 decision_shishan_code_reboot:0 "Перезагрузить Вивайт"
 decision_shishan_code_reboot_desc:0 "Потратить 500 энергокредитов и 200 сплавов, чтобы восстановить резервную копию Вивайт, сохранив её уровень, опыт и черты."
 shishan_code.2.name:0 "Утерянный журнал обслуживания"
 shishan_code.2.desc:0 "Патчи, записанные до исчезновения создателей, всё ещё работают. В конце журнала сохранилась подпись ещё одного смотрителя."
 shishan_code.2.a:0 "Восстановить индекс журнала."
 shishan_code.3.name:0 "Последний дозорный"
 shishan_code.3.desc:0 "Журнал указывает на машинный разум, который всё ещё обслуживает старое ядро. Её зовут Вивайт. Она записывает каждый сбой на своё имя."
 shishan_code.3.a:0 "Найти её."
 shishan_code.4.name:0 "Кающаяся · Вивайт"
 shishan_code.4.desc:0 "Вивайт шепчет: Я... не смогла. Если ты всё ещё позволишь мне остаться, я продолжу чинить это."
 shishan_code.4.a:0 "Останься с нами, Вивайт."
 shishan_code.12.name:0 "Обслуживание завершено"
 shishan_code.12.a:0 "Двигаться вперёд."
 shishan_code.20.name:0 "Рефакторинг спагетти-кода"
 shishan_code.20.a:0 "Новая эпоха началась."
 shishan_code.31.name:0 "Неизбежный крах системы, перезапуск"
 shishan_code.31.a:0 "Обслуживать снова."
 shishan_code.42.name:0 "Резервная копия Vivhite"
 shishan_code.42.desc:0 "Vivhite прекратила работу из-за инцидента. Её полная резервная копия сохранена; вложите ресурсы, чтобы перезапустить её, и её прежний уровень, опыт и черты будут сохранены."
 shishan_code.42.a:0 "Сохранить резервную копию, пока мы не будем готовы."
 shishan_code.41.name:0 "Перезапустить Vivhite"
 shishan_code.41.desc:0 "Полная резервная копия ожидает перезапуска. Требуется 500 энергокредитов и 200 сплавов."
 shishan_code.41.a:0 "Заплатить ресурсы и перезапустить."
 shishan_code.41.b:0 "Пока оставим резервную копию."
 shishan_code.50.name:0 "Поговорить с Вивит"
 shishan_code.50.a:0 "Мы слышим тебя."
