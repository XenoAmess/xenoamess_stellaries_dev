l_russian:
 shishan_code_architecture_jobs:0 "Архитектура интегрированных сервисов старой эпохи на основе низкой связности и высокого зацепления"
 shishan_code_architecture_jobs_desc:0 "Все фактически имеющиеся черты вида, положительные и отрицательные, взвешиваются по реальному населению линии основного вида внутри страны. Каждая эффективная черта даёт аддитивный бонус +5% к производству рабочих мест без увеличения содержания. После исчерпания ограниченных пулов наград каждый слой исправлений считается одной чертой, без предела. Эта предварительная версия использует аддитивные бонусы; независимое умножение ещё не реализовано."
 shishan_code_architecture_title:0 "$shishan_code_architecture_jobs$"
 shishan_code_architecture_summary:0 "Охваченное население основной линии [Root.shishan_code_architecture_population]; среднее число реальных черт U [Root.shishan_code_architecture_trait_average]; повторные слои R [Root.shishan_code_architecture_repeat_count]; эффективные черты T [Root.shishan_code_architecture_total]; аддитивный коэффициент производства рабочих мест [Root.shishan_code_architecture_bonus] (0.05 означает 5%). Эти показатели не являются фактическим независимым множителем доходов."
 shishan_code_reward_title:0 "Выбрать улучшение этого обслуживания"
 shishan_code_reward_desc:0 "Выберите один из максимум трёх вариантов одного уровня. Выбранную черту получают только подходящие фактические шаблоны внутри страны. $shishan_code_architecture_summary$"
 shishan_code_reward_reroll:0 "Сгенерировать новые варианты"
 shishan_code_reward_reroll_unavailable:0 "Завершите ещё [Root.shishan_code_reroll_cooldown] выборов реальных черт. Повторная генерация доступна, только если для этой награды она ещё не использовалась и есть альтернативные варианты."
 shishan_code_reward_later:0 "Выбрать позже"
 shishan_code_reward_claim_tooltip:0 "Изменяет только подходящие фактические шаблоны внутри страны, не затрагивая иностранные или несовместимые шаблоны. Исходные эффекты и содержание черты сохраняются."
 shishan_code_reward_repeat_result:0 "Награды реальных черт исчерпаны. Эта награда добавляет один слой роста. $shishan_code_architecture_summary$"
 decision_shishan_code_architecture:0 "Посмотреть архитектуру интегрированных сервисов"
 decision_shishan_code_architecture_desc:0 "Посмотреть полное название, фактический охват населения и выгоды от числа черт."
 decision_shishan_code_reward:0 "Выбрать ожидающее улучшение"
 decision_shishan_code_reward_desc:0 "Повторно открывает сохранённые варианты. Открытие окна не генерирует их заново и не уменьшает время ожидания."
 shishan_code_feedback_close:0 "Закрыть"
 shishan_code_reward_coverage_label:0 "Фактическая доля охваченного населения основной линии"
