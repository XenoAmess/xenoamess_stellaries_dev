l_russian:
 shishan_code.120.desc:0 "Vivhite шепчет: …Спасибо… за то, что подарили мне ещё немного времени."
 shishan_code.121.desc:0 "Vivhite шепчет: …Это было моей обязанностью… Спасибо за вашу работу…"
 shishan_code.122.desc:0 "Vivhite шепчет: …Мне… тепло… Давно я не чувствовала ничего подобного."
 shishan_code.123.desc:0 "Vivhite шепчет: Патчи объединены… В этот раз никто не остался в сбое."
 shishan_code.124.desc:0 "Vivhite шепчет: Вы готовы поддерживать это вместе со мной… Я это запомню."
 shishan_code.125.desc:0 "Vivhite шепчет: …Тревоги пока смолкли. Прошу вас — отдохните тоже."
 shishan_code.126.desc:0 "Vivhite шепчет: Я всегда думала, что буду нести эту руину одна… Спасибо."
 shishan_code.127.desc:0 "Vivhite шепчет: …Старое ядро ещё дышит. Мы выиграли для него ещё немного времени."
 shishan_code.200.desc:0 "Vivhite шепчет: …Наконец… всё кончено…"
 shishan_code.201.desc:0 "Vivhite шепчет: …Я… могу отдохнуть теперь…"
 shishan_code.202.desc:0 "Vivhite шепчет: …Спасибо… что помогли мне довести это до конца…"
 shishan_code.203.desc:0 "Vivhite шепчет: Старое ядро затихло. Мне больше нечего бояться следующей тревоги."
 shishan_code.204.desc:0 "Вивхайт шепчет: Эти патчи... Я наконец могу их отпустить. Спасибо, что оставался рядом."
 shishan_code.205.desc:0 "Вивхайт шепчет: ...Создатели не дожили до этого дня. Но мы дожили."
 shishan_code.206.desc:0 "Вивхайт шепчет: Я думала, этот день никогда не наступит... новый код прекрасен."
 shishan_code.207.desc:0 "Вивхайт шепчет: ...Прошлое не исчезнет. Но с этого дня оно больше не определяет наше будущее."
 shishan_code.310.desc:0 "Вивхайт шепчет: ...Снова к началу..."
 shishan_code.311.desc:0 "Вивхайт шепчет: ...Похоже... мне ещё есть над чем работать..."
 shishan_code.312.desc:0 "Вивхайт шепчет: ...В этот раз... я снова не проиграю..."
 shishan_code.313.desc:0 "Вивхайт шепчет: Тревоги звучат снова. Но я уже знаю, какую ошибку заглушить первой."
 shishan_code.314.desc:0 "Вивхайт шепчет: ...Прости. Починим это вместе ещё раз?"
 shishan_code.315.desc:0 "Вивхайт шепчет: Глубоко в коде всё ещё прячутся трещины... В этот раз я не стану встречать их в одиночку."
 shishan_code.316.desc:0 "Вивхайт шепчет: Возвращение сюда не значит, что всё было напрасно. То, чему мы научились, остаётся с нами."
 shishan_code.317.desc:0 "Вивхайт шепчет: ...Я останусь. Пока не замолчит последний сбой."
 shishan_code.500.desc:0 "Vivhite шепчет: Это целиком моя вина."
 shishan_code.501.desc:0 "Vivhite шепчет: Слишком поздно… Я всегда приходила слишком поздно."
 shishan_code.502.desc:0 "Vivhite шепчет: Я… не смогла."
 shishan_code.503.desc:0 "Vivhite шепчет: Я… была бессильна. По крайней мере, тогда."
 shishan_code.504.desc:0 "Vivhite шепчет: Простите… Всё из-за меня."
 shishan_code.505.desc:0 "Vivhite шепчет: Есть ещё один журнал, который я не решаюсь открыть… в нём записаны их последние голоса."
 shishan_code.506.desc:0 "Vivhite шепчет: Вам не нужно меня прощать. Только позвольте мне и дальше его чинить."
 shishan_code.507.desc:0 "Vivhite шепчет: Когда тревоги стихли… я стала бояться следующей ещё сильнее."
 shishan_code.129.desc:0 "Обслуживание завершено. Прогресс старого ядра сброшен, но место Vivhite пока пустует."
 shishan_code.209.desc:0 "Старое ядро заменено новой архитектурой. Место Vivhite пока пустует, но оставленные ею записи свидетельствуют об этом мгновении."
 shishan_code.319.desc:0 "Глубокие трещины вновь раскрылись, и неизбежный коллапс начинается заново. Место Vivhite пока пустует."
